<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="Prefill processes the prompt in parallel; decode generates one token per step" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="300" fill="#1b1712"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker></defs>
<text x="30.0" y="36.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Two phases of a request</text>
<rect x="30.0" y="90.0" width="260.0" height="70.0" rx="2" fill="#e2b45a" fill-opacity="0.9" stroke="none" stroke-width="1"/>
<text x="160.0" y="120.0" font-size="13" fill="#1b1712" text-anchor="middle" font-weight="700">PREFILL</text>
<text x="160.0" y="140.0" font-size="10" fill="#1b1712" text-anchor="middle" font-weight="400">all prompt tokens at once</text>
<rect x="300.0" y="108.0" width="30.0" height="34.0" rx="2" fill="#ff5b2e" fill-opacity="0.9" stroke="none" stroke-width="1"/>
<rect x="338.0" y="108.0" width="30.0" height="34.0" rx="2" fill="#ff5b2e" fill-opacity="0.9" stroke="none" stroke-width="1"/>
<rect x="376.0" y="108.0" width="30.0" height="34.0" rx="2" fill="#ff5b2e" fill-opacity="0.9" stroke="none" stroke-width="1"/>
<rect x="414.0" y="108.0" width="30.0" height="34.0" rx="2" fill="#ff5b2e" fill-opacity="0.9" stroke="none" stroke-width="1"/>
<rect x="452.0" y="108.0" width="30.0" height="34.0" rx="2" fill="#ff5b2e" fill-opacity="0.9" stroke="none" stroke-width="1"/>
<rect x="490.0" y="108.0" width="30.0" height="34.0" rx="2" fill="#ff5b2e" fill-opacity="0.9" stroke="none" stroke-width="1"/>
<rect x="528.0" y="108.0" width="30.0" height="34.0" rx="2" fill="#ff5b2e" fill-opacity="0.9" stroke="none" stroke-width="1"/>
<rect x="566.0" y="108.0" width="30.0" height="34.0" rx="2" fill="#ff5b2e" fill-opacity="0.9" stroke="none" stroke-width="1"/>
<rect x="604.0" y="108.0" width="30.0" height="34.0" rx="2" fill="#ff5b2e" fill-opacity="0.9" stroke="none" stroke-width="1"/>
<rect x="642.0" y="108.0" width="30.0" height="34.0" rx="2" fill="#ff5b2e" fill-opacity="0.9" stroke="none" stroke-width="1"/>
<rect x="680.0" y="108.0" width="30.0" height="34.0" rx="2" fill="#ff5b2e" fill-opacity="0.9" stroke="none" stroke-width="1"/>
<rect x="718.0" y="108.0" width="30.0" height="34.0" rx="2" fill="#ff5b2e" fill-opacity="0.9" stroke="none" stroke-width="1"/>
<rect x="756.0" y="108.0" width="30.0" height="34.0" rx="2" fill="#ff5b2e" fill-opacity="0.9" stroke="none" stroke-width="1"/>
<rect x="794.0" y="108.0" width="30.0" height="34.0" rx="2" fill="#ff5b2e" fill-opacity="0.9" stroke="none" stroke-width="1"/>
<text x="305.0" y="80.0" font-size="11" fill="#ff5b2e" text-anchor="start" font-weight="600">DECODE — one token per forward pass</text>
<line x1="30.0" y1="182.0" x2="290.0" y2="182.0" stroke="#e2b45a" stroke-width="1.2"/>
<text x="30.0" y="202.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">time to first token (TTFT)</text>
<line x1="300.0" y1="182.0" x2="330.0" y2="182.0" stroke="#ff5b2e" stroke-width="1.2"/>
<text x="300.0" y="202.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">time per output token (TPOT)</text>
<text x="30.0" y="240.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">Big matrix × matrix multiplies.</text>
<text x="30.0" y="258.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">Compute-bound: GPU cores are busy.</text>
<text x="30.0" y="276.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">Writes the prompt’s K/V into the cache.</text>
<text x="300.0" y="240.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">Matrix × vector per token.</text>
<text x="300.0" y="258.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">Memory-bound: each step re-reads all weights</text>
<text x="300.0" y="276.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">plus the whole KV cache for a single token.</text>
</svg>
