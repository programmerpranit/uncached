<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 417" width="360" height="417" role="img" aria-label="Diamond dependency graph showing push-pull propagation: a write marks nodes stale and reads recompute each once, avoiding glitches" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="417" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Push-pull: no glitches</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">mark eagerly, recompute lazily</text>
<rect x="60.0" y="84.0" width="240.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="104.1" font-size="11.5" fill="#e2b45a" text-anchor="middle" font-weight="600">a (signal)</text>
<rect x="60.0" y="130.0" width="240.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="150.1" font-size="11.5" fill="#5fb3a1" text-anchor="middle" font-weight="600">b = a*2   c = a+1</text>
<line x1="180.0" y1="116.0" x2="180.0" y2="130.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="60.0" y="176.0" width="240.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="196.1" font-size="11.5" fill="#5fb3a1" text-anchor="middle" font-weight="600">d = b + c</text>
<line x1="180.0" y1="162.0" x2="180.0" y2="176.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="60.0" y="222.0" width="240.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="180.0" y="242.1" font-size="11.5" fill="#9b8cff" text-anchor="middle" font-weight="600">effect: log(d)</text>
<line x1="180.0" y1="208.0" x2="180.0" y2="222.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<text x="16.0" y="278.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="700">1. push</text>
<text x="80.0" y="278.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">a.set(5) marks b, c, d stale</text>
<text x="16.0" y="306.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="700">2. pull</text>
<text x="80.0" y="306.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">effect reads d; d recomputes b, c</text>
<text x="16.0" y="334.0" font-size="12" fill="#9b8cff" text-anchor="start" font-weight="700">3. once</text>
<text x="80.0" y="334.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">d computed once, no glitch</text>
<text x="16.0" y="368.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Each node sees a consistent</text>
<text x="16.0" y="387.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">snapshot of its inputs.</text>
</svg>
