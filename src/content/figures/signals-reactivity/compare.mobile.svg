<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 473" width="360" height="473" role="img" aria-label="Comparison of a virtual DOM component re-render, which re-runs and diffs a whole subtree, with a signal update that runs only its subscribed effect" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="473" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e5534b"/></marker></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">What one update costs</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">re-render vs fine-grained</text>
<rect x="16.0" y="80.0" width="328.0" height="150.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="28.0" y="102.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="700">Virtual DOM</text>
<rect x="118.0" y="114.0" width="124.0" height="28.0" rx="3" fill="#1b1712" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<text x="180.0" y="132.0" font-size="11" fill="#e5534b" text-anchor="middle" font-weight="600">&lt;App&gt;</text>
<rect x="28.0" y="156.0" width="94.0" height="26.0" rx="3" fill="#1b1712" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<text x="75.0" y="172.6" font-size="10" fill="#e5534b" text-anchor="middle" font-weight="600">&lt;Header&gt;</text>
<rect x="134.0" y="156.0" width="94.0" height="26.0" rx="3" fill="#1b1712" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<text x="181.0" y="172.6" font-size="10" fill="#e5534b" text-anchor="middle" font-weight="600">&lt;List&gt;</text>
<rect x="240.0" y="156.0" width="94.0" height="26.0" rx="3" fill="#1b1712" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<text x="287.0" y="172.6" font-size="10" fill="#e5534b" text-anchor="middle" font-weight="600">&lt;Footer&gt;</text>
<text x="28.0" y="210.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">re-run all, diff tree, patch one node</text>
<rect x="16.0" y="246.0" width="328.0" height="150.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="28.0" y="268.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="700">Signals</text>
<rect x="100.0" y="280.0" width="160.0" height="28.0" rx="3" fill="#1b1712" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="298.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="600">count signal</text>
<line x1="180.0" y1="308.0" x2="180.0" y2="322.0" stroke="#e5534b" stroke-width="2" marker-end="url(#ah0)"/>
<rect x="100.0" y="322.0" width="160.0" height="28.0" rx="3" fill="#1b1712" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="180.0" y="340.0" font-size="11" fill="#9b8cff" text-anchor="middle" font-weight="600">text effect</text>
<text x="28.0" y="376.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">run only the subscribed effect</text>
<text x="16.0" y="424.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Same DOM write; far less code</text>
<text x="16.0" y="443.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">runs to find it.</text>
</svg>
