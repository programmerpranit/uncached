<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 419" width="880" height="419" role="img" aria-label="Dependency graph from signals through computed values to DOM effects, with only the path from a changed signal highlighted" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="419" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e5534b"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">A reactive dependency graph</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">signals feed computeds, computeds feed effects</text>
<text x="40.0" y="100.0" font-size="12.5" fill="#e2b45a" text-anchor="start" font-weight="700">Signals (state)</text>
<text x="330.0" y="100.0" font-size="12.5" fill="#5fb3a1" text-anchor="start" font-weight="700">Computeds (derived)</text>
<text x="620.0" y="100.0" font-size="12.5" fill="#9b8cff" text-anchor="start" font-weight="700">Effects (DOM, I/O)</text>
<rect x="40.0" y="130.0" width="200.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="140.0" y="154.7" font-size="13" fill="#e2b45a" text-anchor="middle" font-weight="600">firstName</text>
<rect x="40.0" y="200.0" width="200.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="140.0" y="224.7" font-size="13" fill="#e2b45a" text-anchor="middle" font-weight="600">lastName</text>
<rect x="40.0" y="290.0" width="200.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="140.0" y="314.7" font-size="13" fill="#e2b45a" text-anchor="middle" font-weight="600">count</text>
<rect x="330.0" y="165.0" width="200.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="430.0" y="189.7" font-size="13" fill="#5fb3a1" text-anchor="middle" font-weight="600">fullName</text>
<rect x="330.0" y="290.0" width="200.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="430.0" y="314.7" font-size="13" fill="#5fb3a1" text-anchor="middle" font-weight="600">isEven</text>
<rect x="620.0" y="130.0" width="220.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="730.0" y="154.7" font-size="13" fill="#9b8cff" text-anchor="middle" font-weight="600">&lt;h1&gt; text</text>
<rect x="620.0" y="200.0" width="220.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="730.0" y="224.7" font-size="13" fill="#9b8cff" text-anchor="middle" font-weight="600">&lt;title&gt; text</text>
<rect x="620.0" y="290.0" width="220.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="730.0" y="314.7" font-size="13" fill="#9b8cff" text-anchor="middle" font-weight="600">badge class</text>
<line x1="240.0" y1="150.0" x2="330.0" y2="180.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<line x1="240.0" y1="220.0" x2="330.0" y2="190.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<line x1="240.0" y1="310.0" x2="330.0" y2="310.0" stroke="#e5534b" stroke-width="2" marker-end="url(#ah1)"/>
<line x1="530.0" y1="180.0" x2="620.0" y2="150.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<line x1="530.0" y1="190.0" x2="620.0" y2="220.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<line x1="530.0" y1="310.0" x2="620.0" y2="310.0" stroke="#e5534b" stroke-width="2" marker-end="url(#ah1)"/>
<text x="40.0" y="370.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Reading a signal inside a computed or effect subscribes it automatically. Setting count = 3 marks only</text>
<text x="40.0" y="389.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">isEven and the badge effect dirty (red path). The header, the title and the rest of the page are not touched.</text>
</svg>
