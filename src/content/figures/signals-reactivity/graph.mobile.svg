<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 535" width="360" height="535" role="img" aria-label="Dependency graph from signals through computed values to DOM effects, with only the path from a changed signal highlighted" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="535" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Dependency graph</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">signals → computeds → effects</text>
<text x="16.0" y="96.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="700">Signals</text>
<rect x="16.0" y="106.0" width="328.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="126.1" font-size="11.5" fill="#e2b45a" text-anchor="middle" font-weight="600">firstName</text>
<rect x="16.0" y="144.0" width="328.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="164.1" font-size="11.5" fill="#e2b45a" text-anchor="middle" font-weight="600">lastName</text>
<rect x="16.0" y="182.0" width="328.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<text x="180.0" y="202.1" font-size="11.5" fill="#e5534b" text-anchor="middle" font-weight="600">count</text>
<text x="16.0" y="240.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="700">Computeds</text>
<rect x="16.0" y="250.0" width="328.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="270.1" font-size="11.5" fill="#5fb3a1" text-anchor="middle" font-weight="600">fullName = first + last</text>
<rect x="16.0" y="288.0" width="328.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<text x="180.0" y="308.1" font-size="11.5" fill="#e5534b" text-anchor="middle" font-weight="600">isEven = count % 2 == 0</text>
<text x="16.0" y="346.0" font-size="12" fill="#9b8cff" text-anchor="start" font-weight="700">Effects</text>
<rect x="16.0" y="356.0" width="328.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="180.0" y="376.1" font-size="11.5" fill="#9b8cff" text-anchor="middle" font-weight="600">&lt;h1&gt; ← fullName</text>
<rect x="16.0" y="394.0" width="328.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="180.0" y="414.1" font-size="11.5" fill="#9b8cff" text-anchor="middle" font-weight="600">&lt;title&gt; ← fullName</text>
<rect x="16.0" y="432.0" width="328.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<text x="180.0" y="452.1" font-size="11.5" fill="#e5534b" text-anchor="middle" font-weight="600">badge ← isEven</text>
<text x="16.0" y="486.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Setting count updates only the</text>
<text x="16.0" y="505.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">red nodes; nothing else re-runs.</text>
</svg>
