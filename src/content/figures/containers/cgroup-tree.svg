<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 458" width="880" height="458" role="img" aria-label="A cgroup v2 hierarchy with system, kubepods and user slices and per-pod and per-container limits" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="458" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">cgroup v2: a tree of groups with resource controls</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">limits and weights apply to everything in a subtree</text>
<rect x="355.0" y="84.0" width="170.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ede6d8" stroke-width="1"/>
<text x="440.0" y="104.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">/ (root)</text>
<rect x="120.0" y="154.0" width="170.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="205.0" y="174.1" font-size="11.5" fill="#e2b45a" text-anchor="middle" font-weight="600">system.slice</text>
<rect x="355.0" y="154.0" width="170.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="440.0" y="174.1" font-size="11.5" fill="#5fb3a1" text-anchor="middle" font-weight="600">kubepods.slice</text>
<rect x="590.0" y="154.0" width="170.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="675.0" y="174.1" font-size="11.5" fill="#e2b45a" text-anchor="middle" font-weight="600">user.slice</text>
<rect x="250.0" y="230.0" width="170.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="335.0" y="247.0" font-size="11.5" fill="#5fb3a1" text-anchor="middle" font-weight="600">pod-api</text>
<text x="335.0" y="263.0" font-size="10" fill="#5fb3a1" text-anchor="middle" font-weight="400">cpu.weight=200</text>
<rect x="470.0" y="230.0" width="170.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="555.0" y="247.0" font-size="11.5" fill="#5fb3a1" text-anchor="middle" font-weight="600">pod-batch</text>
<text x="555.0" y="263.0" font-size="10" fill="#5fb3a1" text-anchor="middle" font-weight="400">cpu.weight=50</text>
<rect x="150.0" y="316.0" width="180.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="240.0" y="333.0" font-size="11.5" fill="#7cc47f" text-anchor="middle" font-weight="600">container app</text>
<text x="240.0" y="349.0" font-size="10" fill="#7cc47f" text-anchor="middle" font-weight="400">memory.max=2G</text>
<rect x="350.0" y="316.0" width="160.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="430.0" y="333.0" font-size="11.5" fill="#7cc47f" text-anchor="middle" font-weight="600">sidecar</text>
<text x="430.0" y="349.0" font-size="10" fill="#7cc47f" text-anchor="middle" font-weight="400">memory.max=256M</text>
<rect x="540.0" y="316.0" width="200.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="640.0" y="333.0" font-size="11.5" fill="#7cc47f" text-anchor="middle" font-weight="600">worker</text>
<text x="640.0" y="349.0" font-size="10" fill="#7cc47f" text-anchor="middle" font-weight="400">cpu.max=200000 100000</text>
<line x1="440.0" y1="116.0" x2="205.0" y2="154.0" stroke="#4a4136" stroke-width="1.2"/>
<line x1="440.0" y1="116.0" x2="440.0" y2="154.0" stroke="#4a4136" stroke-width="1.2"/>
<line x1="440.0" y1="116.0" x2="675.0" y2="154.0" stroke="#4a4136" stroke-width="1.2"/>
<line x1="440.0" y1="186.0" x2="335.0" y2="230.0" stroke="#4a4136" stroke-width="1.2"/>
<line x1="440.0" y1="186.0" x2="555.0" y2="230.0" stroke="#4a4136" stroke-width="1.2"/>
<line x1="335.0" y1="270.0" x2="240.0" y2="316.0" stroke="#4a4136" stroke-width="1.2"/>
<line x1="335.0" y1="270.0" x2="430.0" y2="316.0" stroke="#4a4136" stroke-width="1.2"/>
<line x1="555.0" y1="270.0" x2="640.0" y2="316.0" stroke="#4a4136" stroke-width="1.2"/>
<text x="40.0" y="390.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Each group is a directory in /sys/fs/cgroup with files like cpu.max, cpu.weight, memory.max, memory.high, io.max and</text>
<text x="40.0" y="409.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">pids.max. Usage is accounted per group (memory.current, cpu.stat) and limits apply to the whole subtree. Kubernetes</text>
<text x="40.0" y="428.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">and systemd both build this tree: a pod is a cgroup, each container is a child.</text>
</svg>
