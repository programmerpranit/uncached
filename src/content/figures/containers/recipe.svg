<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 448" width="880" height="448" role="img" aria-label="A container combines namespaces, cgroups, a root filesystem, capabilities, seccomp and LSM policies" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="448" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">A container is a recipe, not a kernel object</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">the runtime combines several independent kernel features</text>
<rect x="40.0" y="90.0" width="200.0" height="250.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="140.0" y="212.0" font-size="14" fill="#ede6d8" text-anchor="middle" font-weight="600">process</text>
<text x="140.0" y="228.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">runc / crun</text>
<rect x="300.0" y="92.0" width="540.0" height="34.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="316.0" y="113.0" font-size="12.5" fill="#5fb3a1" text-anchor="start" font-weight="700">namespaces</text>
<text x="560.0" y="113.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">what it can see</text>
<line x1="240.0" y1="215.0" x2="298.0" y2="110.0" stroke="#4a4136" stroke-width="1"/>
<rect x="300.0" y="134.0" width="540.0" height="34.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="316.0" y="155.0" font-size="12.5" fill="#e2b45a" text-anchor="start" font-weight="700">cgroups</text>
<text x="560.0" y="155.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">how much it can use</text>
<line x1="240.0" y1="215.0" x2="298.0" y2="152.0" stroke="#4a4136" stroke-width="1"/>
<rect x="300.0" y="176.0" width="540.0" height="34.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="316.0" y="197.0" font-size="12.5" fill="#9b8cff" text-anchor="start" font-weight="700">root filesystem</text>
<text x="560.0" y="197.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">image layers via overlayfs + pivot_root</text>
<line x1="240.0" y1="215.0" x2="298.0" y2="194.0" stroke="#4a4136" stroke-width="1"/>
<rect x="300.0" y="218.0" width="540.0" height="34.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<text x="316.0" y="239.0" font-size="12.5" fill="#e5534b" text-anchor="start" font-weight="700">capabilities</text>
<text x="560.0" y="239.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">drop most of root's powers</text>
<line x1="240.0" y1="215.0" x2="298.0" y2="236.0" stroke="#4a4136" stroke-width="1"/>
<rect x="300.0" y="260.0" width="540.0" height="34.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<text x="316.0" y="281.0" font-size="12.5" fill="#e5534b" text-anchor="start" font-weight="700">seccomp</text>
<text x="560.0" y="281.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">block risky system calls</text>
<line x1="240.0" y1="215.0" x2="298.0" y2="278.0" stroke="#4a4136" stroke-width="1"/>
<rect x="300.0" y="302.0" width="540.0" height="34.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<text x="316.0" y="323.0" font-size="12.5" fill="#e5534b" text-anchor="start" font-weight="700">LSM (AppArmor / SELinux)</text>
<text x="560.0" y="323.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">mandatory access control</text>
<line x1="240.0" y1="215.0" x2="298.0" y2="320.0" stroke="#4a4136" stroke-width="1"/>
<text x="40.0" y="380.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Docker, containerd and Kubernetes call a low-level runtime (runc, crun) that clones a process into new namespaces,</text>
<text x="40.0" y="399.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">puts it in a cgroup, mounts the image layers as its root, drops capabilities and adds a seccomp filter, then execs</text>
<text x="40.0" y="418.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">the entrypoint. Stronger isolation (gVisor, Kata, Firecracker) adds a user-space kernel or a lightweight VM.</text>
</svg>
