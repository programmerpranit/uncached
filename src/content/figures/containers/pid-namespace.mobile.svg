<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 368" width="360" height="368" role="img" aria-label="Host and container views of process IDs under PID namespaces" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="368" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">PID namespaces</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">host vs container view</text>
<text x="16.0" y="86.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">host sees:</text>
<text x="16.0" y="108.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">   1 systemd</text>
<text x="16.0" y="128.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">4242 nginx (A)</text>
<text x="16.0" y="148.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">5100 postgres (B)</text>
<text x="16.0" y="186.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="600">container A sees:</text>
<text x="16.0" y="208.0" font-size="11.5" fill="#5fb3a1" text-anchor="start" font-weight="400">   1 nginx</text>
<text x="16.0" y="238.0" font-size="12" fill="#9b8cff" text-anchor="start" font-weight="600">container B sees:</text>
<text x="16.0" y="260.0" font-size="11.5" fill="#9b8cff" text-anchor="start" font-weight="400">   1 postgres</text>
<text x="16.0" y="300.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">PID 1 must reap zombies and</text>
<text x="16.0" y="319.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">handle signals; that's why tini</text>
<text x="16.0" y="338.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">and dumb-init exist.</text>
</svg>
