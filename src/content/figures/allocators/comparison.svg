<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 441" width="880" height="441" role="img" aria-label="glibc malloc, jemalloc, tcmalloc, mimalloc and musl compared" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="441" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Common allocators and what they optimize</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">all use size classes and caches; they differ in arenas, purging and multithreaded behavior</text>
<rect x="40.0" y="84.0" width="800.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="56.0" y="104.0" font-size="12.5" fill="#e2b45a" text-anchor="start" font-weight="700">glibc ptmalloc2</text>
<text x="56.0" y="122.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">default on most Linux</text>
<text x="270.0" y="112.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">per-thread arenas (up to 8 × cores) + tcache; can bloat with many threads</text>
<rect x="40.0" y="140.0" width="800.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="56.0" y="160.0" font-size="12.5" fill="#5fb3a1" text-anchor="start" font-weight="700">jemalloc</text>
<text x="56.0" y="178.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">FreeBSD, Rust (formerly), Redis</text>
<text x="270.0" y="168.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">arenas per CPU, size classes, decay-based purging; strong fragmentation control</text>
<rect x="40.0" y="196.0" width="800.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="56.0" y="216.0" font-size="12.5" fill="#7cc47f" text-anchor="start" font-weight="700">tcmalloc</text>
<text x="56.0" y="234.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">Google, Chromium (partly)</text>
<text x="270.0" y="224.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">per-CPU caches with restartable sequences; huge-page-aware (Temeraire)</text>
<rect x="40.0" y="252.0" width="800.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="56.0" y="272.0" font-size="12.5" fill="#9b8cff" text-anchor="start" font-weight="700">mimalloc</text>
<text x="56.0" y="290.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">Microsoft, many apps</text>
<text x="270.0" y="280.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">free-list sharding per page; small and fast; secure mode</text>
<rect x="40.0" y="308.0" width="800.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<text x="56.0" y="328.0" font-size="12.5" fill="#e5534b" text-anchor="start" font-weight="700">musl mallocng</text>
<text x="56.0" y="346.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">Alpine Linux</text>
<text x="270.0" y="336.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">small and hardened; much slower for multithreaded workloads</text>
<text x="40.0" y="392.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Switching is often an LD_PRELOAD away, and can cut memory 20–50% or fix multithreaded slowdowns, but results are</text>
<text x="40.0" y="411.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">workload-specific: benchmark with production traffic and watch both throughput and RSS over days, not minutes.</text>
</svg>
