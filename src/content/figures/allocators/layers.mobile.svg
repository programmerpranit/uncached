<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" width="360" height="380" role="img" aria-label="Layers of a modern allocator: thread caches, arenas, page runs and kernel calls" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="380" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Where malloc gets memory</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">between your code and the kernel</text>
<text x="16.0" y="86.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="700">malloc(48) / free(p)</text>
<text x="16.0" y="103.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">your code</text>
<text x="16.0" y="130.0" font-size="12" fill="#7cc47f" text-anchor="start" font-weight="700">thread cache</text>
<text x="16.0" y="147.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">per-thread lists, no lock</text>
<text x="16.0" y="174.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="700">arenas / central heap</text>
<text x="16.0" y="191.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">shared bins, locked or per-CPU</text>
<text x="16.0" y="218.0" font-size="12" fill="#9b8cff" text-anchor="start" font-weight="700">page allocator in user space</text>
<text x="16.0" y="235.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">page runs split into classes</text>
<text x="16.0" y="262.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="700">kernel: brk / mmap / madvise</text>
<text x="16.0" y="279.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">whole pages, µs per call</text>
<text x="16.0" y="312.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Most calls never take a lock or</text>
<text x="16.0" y="331.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">enter the kernel; RSS doesn't</text>
<text x="16.0" y="350.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">drop the moment you free().</text>
</svg>
