<text x="440.0" y="330.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">request 50 bytes → 64-byte class (14 bytes of internal fragmentation)</text>
<text x="40.0" y="362.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Equal-size slots make allocation a pop from a free list and free a push, with no searching and no coalescing.</text>
<text x="40.0" y="381.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Fine-grained classes (jemalloc and tcmalloc use dozens) keep internal waste around 10–20%. Each class lives in</text>
<text x="40.0" y="400.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">spans of pages ("slabs"), so the allocator can find an object's size from its address alone.</text>
