<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 299" width="880" height="299" role="img" aria-label="Subscribers request n items; publishers may send at most that many" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="299" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2b45a"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Pull-based flow control</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Reactive Streams: request(n)</text>
<rect x="40.0" y="100.0" width="180.0" height="60.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="130.0" y="127.0" font-size="13" fill="#5fb3a1" text-anchor="middle" font-weight="600">subscriber</text>
<text x="130.0" y="143.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="400">buffer: 16 slots</text>
<rect x="620.0" y="100.0" width="180.0" height="60.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="710.0" y="134.7" font-size="13" fill="#ede6d8" text-anchor="middle" font-weight="600">publisher</text>
<line x1="222.0" y1="118.0" x2="618.0" y2="118.0" stroke="#5fb3a1" stroke-width="1.3" marker-end="url(#ah0)"/>
<text x="420.0" y="110.0" font-size="12" fill="#5fb3a1" text-anchor="middle" font-weight="600">request(16)</text>
<line x1="618.0" y1="144.0" x2="222.0" y2="144.0" stroke="#e2b45a" stroke-width="1.3" marker-end="url(#ah1)"/>
<text x="420.0" y="170.0" font-size="12" fill="#e2b45a" text-anchor="middle" font-weight="600">onNext × ≤16</text>
<line x1="222.0" y1="200.0" x2="618.0" y2="200.0" stroke="#5fb3a1" stroke-width="1.3" marker-end="url(#ah0)"/>
<text x="420.0" y="192.0" font-size="12" fill="#5fb3a1" text-anchor="middle" font-weight="400">request(8)  — after processing 8</text>
<text x="40.0" y="250.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">The publisher may only send as many items as have been requested. Demand travels upstream, data downstream;</text>
<text x="40.0" y="269.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">the subscriber can never be overwhelmed. TCP windows, HTTP/2 flow control and Kafka’s pull model work the same way.</text>
</svg>
