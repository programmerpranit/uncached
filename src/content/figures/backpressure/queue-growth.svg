<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 379" width="880" height="379" role="img" aria-label="An unbounded queue grows forever under sustained overload; a bounded queue with backpressure caps it" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="379" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Producer outpaces consumer</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">producer 1,200 msg/s, consumer 1,000 msg/s</text>
<line x1="80.0" y1="274.0" x2="660.0" y2="274.0" stroke="#2f2921" stroke-width="1"/>
<text x="72.0" y="278.0" font-size="11" fill="#a69d8e" text-anchor="end" font-weight="400">0k</text>
<line x1="80.0" y1="210.7" x2="660.0" y2="210.7" stroke="#2f2921" stroke-width="1"/>
<text x="72.0" y="214.7" font-size="11" fill="#a69d8e" text-anchor="end" font-weight="400">4k</text>
<line x1="80.0" y1="147.3" x2="660.0" y2="147.3" stroke="#2f2921" stroke-width="1"/>
<text x="72.0" y="151.3" font-size="11" fill="#a69d8e" text-anchor="end" font-weight="400">8k</text>
<line x1="80.0" y1="84.0" x2="660.0" y2="84.0" stroke="#2f2921" stroke-width="1"/>
<text x="72.0" y="88.0" font-size="11" fill="#a69d8e" text-anchor="end" font-weight="400">12k</text>
<text x="80.0" y="292.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">0s</text>
<text x="273.3" y="292.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">20s</text>
<text x="466.7" y="292.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">40s</text>
<text x="660.0" y="292.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">60s</text>
<text x="72.0" y="72.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">queued messages</text>
