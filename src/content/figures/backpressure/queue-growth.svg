<path d="M80.0 274.0 L89.7 270.8 L99.3 267.7 L109.0 264.5 L118.7 261.3 L128.3 258.2 L138.0 255.0 L147.7 251.8 L157.3 248.7 L167.0 245.5 L176.7 242.3 L186.3 242.3 L196.0 242.3 L205.7 242.3 L215.3 242.3 L225.0 242.3 L234.7 242.3 L244.3 242.3 L254.0 242.3 L263.7 242.3 L273.3 242.3 L283.0 242.3 L292.7 242.3 L302.3 242.3 L312.0 242.3 L321.7 242.3 L331.3 242.3 L341.0 242.3 L350.7 242.3 L360.3 242.3 L370.0 242.3 L379.7 242.3 L389.3 242.3 L399.0 242.3 L408.7 242.3 L418.3 242.3 L428.0 242.3 L437.7 242.3 L447.3 242.3 L457.0 242.3 L466.7 242.3 L476.3 242.3 L486.0 242.3 L495.7 242.3 L505.3 242.3 L515.0 242.3 L524.7 242.3 L534.3 242.3 L544.0 242.3 L553.7 242.3 L563.3 242.3 L573.0 242.3 L582.7 242.3 L592.3 242.3 L602.0 242.3 L611.7 242.3 L621.3 242.3 L631.0 242.3 L640.7 242.3 L650.3 242.3 L660.0 242.3" fill="none" stroke="#5fb3a1" stroke-width="2.5"/>
<text x="670.0" y="88.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="700">unbounded buffer:</text>
<text x="670.0" y="106.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="400">grows forever → OOM</text>
<text x="670.0" y="234.3" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="700">bounded (2k) +</text>
<text x="670.0" y="252.3" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="400">backpressure: producer</text>
<text x="670.0" y="270.3" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="400">slowed to 1,000/s</text>
<text x="40.0" y="330.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Any sustained mismatch grows a queue linearly. Buffers only absorb bursts; for sustained overload something must</text>
<text x="40.0" y="349.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">slow down, drop, or scale out.</text>
</svg>
