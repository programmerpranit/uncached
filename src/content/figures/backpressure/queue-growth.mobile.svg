<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 446" width="360" height="446" role="img" aria-label="An unbounded queue grows forever under sustained overload; a bounded queue with backpressure caps it" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
