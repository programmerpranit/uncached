<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 349" width="360" height="349" role="img" aria-label="Subscribers request n items; publishers may send at most that many" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="349" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2b45a"/></marker></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Pull-based flow control</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Reactive Streams: request(n)</text>
<rect x="16.0" y="72.0" width="328.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="100.3" font-size="12" fill="#5fb3a1" text-anchor="middle" font-weight="600">subscriber (16 slots)</text>
<line x1="120.0" y1="122.0" x2="120.0" y2="180.0" stroke="#5fb3a1" stroke-width="1.3" marker-end="url(#ah0)"/>
<text x="128.0" y="148.0" font-size="11" fill="#5fb3a1" text-anchor="start" font-weight="400">request(16)</text>
<line x1="240.0" y1="180.0" x2="240.0" y2="122.0" stroke="#e2b45a" stroke-width="1.3" marker-end="url(#ah1)"/>
<text x="248.0" y="160.0" font-size="11" fill="#e2b45a" text-anchor="start" font-weight="400">≤16 items</text>
<rect x="16.0" y="182.0" width="328.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="180.0" y="210.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">publisher</text>
<text x="16.0" y="262.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">The publisher sends only what was</text>
<text x="16.0" y="281.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">requested, so the subscriber is</text>
<text x="16.0" y="300.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">never overwhelmed. TCP windows and</text>
<text x="16.0" y="319.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Kafka’s pull model work alike.</text>
</svg>
