<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 424" width="360" height="424" role="img" aria-label="Write latency for different placements of consensus replicas across zones and regions" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="424" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Replica placement vs latency</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">commit = majority ack</text>
<rect x="16.0" y="72.0" width="328.0" height="76.0" rx="3" fill="#7cc47f" fill-opacity="0.1" stroke="#7cc47f" stroke-width="1"/>
<text x="28.0" y="94.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="600">3 replicas in one region (3 AZs)</text>
<text x="332.0" y="94.0" font-size="1" fill="#ede6d8" text-anchor="start" font-weight="400"></text>
<text x="28.0" y="116.0" font-size="13" fill="#7cc47f" text-anchor="start" font-weight="700">~2 ms</text>
<text x="28.0" y="136.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">survives an AZ, not a region</text>
<rect x="16.0" y="156.0" width="328.0" height="76.0" rx="3" fill="#e2b45a" fill-opacity="0.1" stroke="#e2b45a" stroke-width="1"/>
<text x="28.0" y="178.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="600">3 regions, leader in us-east</text>
<text x="332.0" y="178.0" font-size="1" fill="#ede6d8" text-anchor="start" font-weight="400"></text>
<text x="28.0" y="200.0" font-size="13" fill="#e2b45a" text-anchor="start" font-weight="700">~65 ms</text>
<text x="28.0" y="220.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">majority = us-east + nearest region</text>
<rect x="16.0" y="240.0" width="328.0" height="76.0" rx="3" fill="#5fb3a1" fill-opacity="0.1" stroke="#5fb3a1" stroke-width="1"/>
<text x="28.0" y="262.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="600">5 replicas: 2 + 2 + 1 across regions</text>
<text x="332.0" y="262.0" font-size="1" fill="#ede6d8" text-anchor="start" font-weight="400"></text>
<text x="28.0" y="284.0" font-size="13" fill="#5fb3a1" text-anchor="start" font-weight="700">~20–30 ms*</text>
<text x="28.0" y="304.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">*majority from leader region + a nearby one</text>
<rect x="16.0" y="324.0" width="328.0" height="76.0" rx="3" fill="#e5534b" fill-opacity="0.1" stroke="#e5534b" stroke-width="1"/>
<text x="28.0" y="346.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="600">3 regions on 3 continents</text>
<text x="332.0" y="346.0" font-size="1" fill="#ede6d8" text-anchor="start" font-weight="400"></text>
<text x="28.0" y="368.0" font-size="13" fill="#e5534b" text-anchor="start" font-weight="700">~150 ms</text>
<text x="28.0" y="388.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">survives a region; every write crosses oceans</text>
</svg>
