<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 442" width="360" height="442" role="img" aria-label="Geo-partitioned data: each user row is homed in a region, with global reference tables replicated everywhere" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="442" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Geo-partitioning</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">rows pinned to a home region</text>
<rect x="16.0" y="72.0" width="328.0" height="64.0" rx="3" fill="#5fb3a1" fill-opacity="0.1" stroke="#5fb3a1" stroke-width="1"/>
<text x="28.0" y="96.0" font-size="13" fill="#5fb3a1" text-anchor="start" font-weight="700">eu-west</text>
<text x="28.0" y="118.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">users where region = "eu"</text>
<rect x="16.0" y="144.0" width="328.0" height="64.0" rx="3" fill="#e2b45a" fill-opacity="0.1" stroke="#e2b45a" stroke-width="1"/>
<text x="28.0" y="168.0" font-size="13" fill="#e2b45a" text-anchor="start" font-weight="700">us-east</text>
<text x="28.0" y="190.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">users where region = "us"</text>
<rect x="16.0" y="216.0" width="328.0" height="64.0" rx="3" fill="#9b8cff" fill-opacity="0.1" stroke="#9b8cff" stroke-width="1"/>
<text x="28.0" y="240.0" font-size="13" fill="#9b8cff" text-anchor="start" font-weight="700">ap-south</text>
<text x="28.0" y="262.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">users where region = "in"</text>
<rect x="16.0" y="292.0" width="328.0" height="52.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="180.0" y="315.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">global tables</text>
<text x="180.0" y="331.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">replicated everywhere, read locally</text>
<text x="16.0" y="374.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Local users get local latency and</text>
<text x="16.0" y="393.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">data residency. Travellers and</text>
<text x="16.0" y="412.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">cross-region queries pay the RTT.</text>
</svg>
