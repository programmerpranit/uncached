<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 429" width="360" height="429" role="img" aria-label="Typical round-trip times between cloud regions compared with the speed-of-light minimum in fibre" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="429" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">The speed of light sets a floor</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">typical RTT vs fibre minimum</text>
<text x="16.0" y="80.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">us-east ↔ us-west</text>
<rect x="16.0" y="88.0" width="73.3" height="16.0" rx="3" fill="#e2b45a" fill-opacity="0.5" stroke="#e2b45a" stroke-width="1"/>
<rect x="16.0" y="88.0" width="46.1" height="16.0" rx="3" fill="#5fb3a1" fill-opacity="0.8" stroke="#5fb3a1" stroke-width="1"/>
<text x="95.3" y="101.0" font-size="10.5" fill="#e2b45a" text-anchor="start" font-weight="400">62 ms</text>
<text x="16.0" y="128.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">us-east ↔ eu-west</text>
<rect x="16.0" y="136.0" width="82.7" height="16.0" rx="3" fill="#e2b45a" fill-opacity="0.5" stroke="#e2b45a" stroke-width="1"/>
<rect x="16.0" y="136.0" width="62.6" height="16.0" rx="3" fill="#5fb3a1" fill-opacity="0.8" stroke="#5fb3a1" stroke-width="1"/>
<text x="104.7" y="149.0" font-size="10.5" fill="#e2b45a" text-anchor="start" font-weight="400">70 ms</text>
<text x="16.0" y="176.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">eu-west ↔ ap-south</text>
<rect x="16.0" y="184.0" width="141.8" height="16.0" rx="3" fill="#e2b45a" fill-opacity="0.5" stroke="#e2b45a" stroke-width="1"/>
<rect x="16.0" y="184.0" width="91.0" height="16.0" rx="3" fill="#5fb3a1" fill-opacity="0.8" stroke="#5fb3a1" stroke-width="1"/>
<text x="163.8" y="197.0" font-size="10.5" fill="#e2b45a" text-anchor="start" font-weight="400">120 ms</text>
<text x="16.0" y="224.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">us-east ↔ ap-northeast</text>
<rect x="16.0" y="232.0" width="177.3" height="16.0" rx="3" fill="#e2b45a" fill-opacity="0.5" stroke="#e2b45a" stroke-width="1"/>
<rect x="16.0" y="232.0" width="128.8" height="16.0" rx="3" fill="#5fb3a1" fill-opacity="0.8" stroke="#5fb3a1" stroke-width="1"/>
<text x="199.3" y="245.0" font-size="10.5" fill="#e2b45a" text-anchor="start" font-weight="400">150 ms</text>
<text x="16.0" y="272.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">us-east ↔ ap-southeast</text>
<rect x="16.0" y="280.0" width="236.4" height="16.0" rx="3" fill="#e2b45a" fill-opacity="0.5" stroke="#e2b45a" stroke-width="1"/>
<rect x="16.0" y="280.0" width="184.4" height="16.0" rx="3" fill="#5fb3a1" fill-opacity="0.8" stroke="#5fb3a1" stroke-width="1"/>
<text x="258.4" y="293.0" font-size="10.5" fill="#e2b45a" text-anchor="start" font-weight="400">200 ms</text>
<rect x="16.0" y="318.0" width="12.0" height="12.0" rx="2" fill="#5fb3a1" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="34.0" y="328.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">fibre minimum</text>
<rect x="16.0" y="338.0" width="12.0" height="12.0" rx="2" fill="#e2b45a" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="34.0" y="348.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">typical RTT</text>
<text x="16.0" y="380.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Real paths are longer than great</text>
<text x="16.0" y="399.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">circles. The floor can’t be removed.</text>
</svg>
