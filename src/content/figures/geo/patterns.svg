<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 319" width="880" height="319" role="img" aria-label="Primary with read replicas, active-active, and geo-partitioned multi-region designs" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="319" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Three ways to go multi-region</text>
<rect x="40.0" y="80.0" width="255.0" height="150.0" rx="3" fill="#e2b45a" fill-opacity="0.1" stroke="#e2b45a" stroke-width="1"/>
<text x="54.0" y="106.0" font-size="12.5" fill="#e2b45a" text-anchor="start" font-weight="700">Primary + read replicas</text>
<text x="54.0" y="138.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">· writes go to one region</text>
<text x="54.0" y="162.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">· local reads (maybe stale)</text>
<text x="54.0" y="186.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">· simple; remote users pay on writes</text>
<rect x="315.0" y="80.0" width="255.0" height="150.0" rx="3" fill="#ff5b2e" fill-opacity="0.1" stroke="#ff5b2e" stroke-width="1"/>
<text x="329.0" y="106.0" font-size="12.5" fill="#ff5b2e" text-anchor="start" font-weight="700">Active-active (multi-leader)</text>
<text x="329.0" y="138.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">· every region accepts writes</text>
<text x="329.0" y="162.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">· async replication between regions</text>
<text x="329.0" y="186.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">· fast; conflicts must be resolved</text>
<rect x="590.0" y="80.0" width="255.0" height="150.0" rx="3" fill="#5fb3a1" fill-opacity="0.1" stroke="#5fb3a1" stroke-width="1"/>
<text x="604.0" y="106.0" font-size="12.5" fill="#5fb3a1" text-anchor="start" font-weight="700">Geo-partitioned</text>
<text x="604.0" y="138.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">· each row has a home region</text>
<text x="604.0" y="162.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">· local reads &amp; writes for its users</text>
<text x="604.0" y="186.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">· cross-region queries are slow</text>
<text x="40.0" y="270.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">A fourth option, a single consensus group spanning regions (Spanner, CockroachDB with global tables), gives strong</text>
<text x="40.0" y="289.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">consistency everywhere but pays at least one cross-region round trip per write.</text>
</svg>
