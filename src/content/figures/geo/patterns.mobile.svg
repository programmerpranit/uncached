<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 489" width="360" height="489" role="img" aria-label="Primary with read replicas, active-active, and geo-partitioned multi-region designs" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="489" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Three ways to go multi-region</text>
<rect x="16.0" y="72.0" width="328.0" height="108.0" rx="3" fill="#e2b45a" fill-opacity="0.1" stroke="#e2b45a" stroke-width="1"/>
<text x="28.0" y="96.0" font-size="12.5" fill="#e2b45a" text-anchor="start" font-weight="700">Primary + read replicas</text>
<text x="28.0" y="122.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">· writes go to one region</text>
<text x="28.0" y="142.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">· local reads (maybe stale)</text>
<text x="28.0" y="162.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">· simple; remote users pay on writes</text>
<rect x="16.0" y="190.0" width="328.0" height="108.0" rx="3" fill="#ff5b2e" fill-opacity="0.1" stroke="#ff5b2e" stroke-width="1"/>
<text x="28.0" y="214.0" font-size="12.5" fill="#ff5b2e" text-anchor="start" font-weight="700">Active-active (multi-leader)</text>
<text x="28.0" y="240.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">· every region accepts writes</text>
<text x="28.0" y="260.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">· async replication between regions</text>
<text x="28.0" y="280.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">· fast; conflicts must be resolved</text>
<rect x="16.0" y="308.0" width="328.0" height="108.0" rx="3" fill="#5fb3a1" fill-opacity="0.1" stroke="#5fb3a1" stroke-width="1"/>
<text x="28.0" y="332.0" font-size="12.5" fill="#5fb3a1" text-anchor="start" font-weight="700">Geo-partitioned</text>
<text x="28.0" y="358.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">· each row has a home region</text>
<text x="28.0" y="378.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">· local reads &amp; writes for its users</text>
<text x="28.0" y="398.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">· cross-region queries are slow</text>
<text x="16.0" y="440.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Or: one consensus group across</text>
<text x="16.0" y="459.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">regions, paying an RTT per write.</text>
</svg>
