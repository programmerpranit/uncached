<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 354" width="880" height="354" role="img" aria-label="Write latency for different placements of consensus replicas across zones and regions" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="354" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Where you put the replicas sets write latency</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Raft/Paxos commit needs a majority to acknowledge</text>
<text x="40.0" y="92.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="600">placement</text>
<text x="400.0" y="92.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="600">write</text>
<text x="490.0" y="92.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="600">note</text>
<line x1="40.0" y1="102.0" x2="840.0" y2="102.0" stroke="#4a4136" stroke-width="1.3"/>
<text x="40.0" y="132.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">3 replicas in one region (3 AZs)</text>
<text x="400.0" y="132.0" font-size="12" fill="#7cc47f" text-anchor="start" font-weight="700">~2 ms</text>
<text x="490.0" y="132.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">survives an AZ, not a region</text>
<text x="40.0" y="166.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">3 regions, leader in us-east</text>
<text x="400.0" y="166.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="700">~65 ms</text>
<text x="490.0" y="166.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">majority = us-east + nearest region</text>
<text x="40.0" y="200.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">5 replicas: 2 + 2 + 1 across regions</text>
<text x="400.0" y="200.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="700">~20–30 ms*</text>
<text x="490.0" y="200.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">*majority from leader region + a nearby one</text>
<text x="40.0" y="234.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">3 regions on 3 continents</text>
<text x="400.0" y="234.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="700">~150 ms</text>
<text x="490.0" y="234.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">survives a region; every write crosses oceans</text>
<text x="40.0" y="286.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Survivability and latency pull in opposite directions: surviving a region loss means a majority must span regions,</text>
<text x="40.0" y="305.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">so each write waits for at least one cross-region round trip. Placing replicas so the nearest region completes</text>
<text x="40.0" y="324.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">the majority keeps that round trip short.</text>
</svg>
