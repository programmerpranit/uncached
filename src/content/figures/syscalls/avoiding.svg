<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 407" width="880" height="407" role="img" aria-label="Ways to avoid entering the kernel: vDSO, futex fast path, user-space buffering and kernel bypass" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="407" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Avoiding the kernel entirely: vDSO and user-space fast paths</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">some "syscalls" never cross the boundary</text>
<rect x="40.0" y="84.0" width="800.0" height="52.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="56.0" y="104.0" font-size="13" fill="#7cc47f" text-anchor="start" font-weight="700">vDSO</text>
<text x="260.0" y="104.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">clock_gettime, gettimeofday, getcpu</text>
<text x="260.0" y="122.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">kernel maps code + data page into every process</text>
<rect x="40.0" y="146.0" width="800.0" height="52.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="56.0" y="166.0" font-size="13" fill="#5fb3a1" text-anchor="start" font-weight="700">futex fast path</text>
<text x="260.0" y="166.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">uncontended lock / unlock</text>
<text x="260.0" y="184.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">atomic in user memory; kernel only to sleep / wake</text>
<rect x="40.0" y="208.0" width="800.0" height="52.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="56.0" y="228.0" font-size="13" fill="#e2b45a" text-anchor="start" font-weight="700">user-space buffering</text>
<text x="260.0" y="228.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">stdio, BufReader, bufio</text>
<text x="260.0" y="246.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">many small writes become one write()</text>
<rect x="40.0" y="270.0" width="800.0" height="52.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="56.0" y="290.0" font-size="13" fill="#9b8cff" text-anchor="start" font-weight="700">kernel bypass</text>
<text x="260.0" y="290.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">DPDK, SPDK, RDMA</text>
<text x="260.0" y="308.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">device queues mapped into the app; poll in user space</text>
<text x="40.0" y="358.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">The vDSO is a small shared library the kernel maps into each process; the time functions read a clock page the</text>
<text x="40.0" y="377.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">kernel keeps updated, so asking for the time costs tens of nanoseconds instead of a syscall.</text>
</svg>
