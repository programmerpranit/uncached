<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 377" width="880" height="377" role="img" aria-label="Number of system calls needed to copy 1 GiB with different buffer sizes" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="377" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Batching: same bytes, far fewer crossings</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">copying a 1 GiB file with different buffer sizes</text>
<text x="40.0" y="104.0" font-size="12.5" fill="#ede6d8" text-anchor="start" font-weight="600">1-byte read/write</text>
<text x="40.0" y="121.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">~2.1 billion syscalls</text>
<rect x="400.0" y="94.0" width="382.0" height="20.0" rx="3" fill="#e5534b" fill-opacity="0.7" stroke="#e5534b" stroke-width="1"/>
<text x="40.0" y="158.0" font-size="12.5" fill="#ede6d8" text-anchor="start" font-weight="600">4 KiB buffer</text>
<text x="40.0" y="175.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">~524,000 syscalls</text>
<rect x="400.0" y="148.0" width="211.0" height="20.0" rx="3" fill="#e2b45a" fill-opacity="0.7" stroke="#e2b45a" stroke-width="1"/>
<text x="40.0" y="212.0" font-size="12.5" fill="#ede6d8" text-anchor="start" font-weight="600">128 KiB buffer</text>
<text x="40.0" y="229.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">~16,000 syscalls</text>
<rect x="400.0" y="202.0" width="116.0" height="20.0" rx="3" fill="#5fb3a1" fill-opacity="0.7" stroke="#5fb3a1" stroke-width="1"/>
<text x="40.0" y="266.0" font-size="12.5" fill="#ede6d8" text-anchor="start" font-weight="600">copy_file_range / sendfile</text>
<text x="40.0" y="283.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">a few syscalls, no user copy</text>
<rect x="400.0" y="256.0" width="21.0" height="20.0" rx="3" fill="#7cc47f" fill-opacity="0.7" stroke="#7cc47f" stroke-width="1"/>
<text x="400.0" y="84.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">number of system calls (log scale)</text>
<text x="40.0" y="328.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Each call has fixed overhead, so bigger buffers amortize it. The same idea drives stdio buffering, writev/readv,</text>
<text x="40.0" y="347.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">sendmmsg, io_uring batches, and zero-copy calls (sendfile, splice, copy_file_range) that skip user space entirely.</text>
</svg>
