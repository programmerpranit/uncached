<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 444" width="880" height="444" role="img" aria-label="Path of a read system call from user code through libc, the syscall instruction, the kernel and back" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="444" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">The path of read(fd, buf, n)</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">from a library call in user mode to the kernel and back</text>
<rect x="40.0" y="84.0" width="800.0" height="34.0" rx="3" fill="#5fb3a1" fill-opacity="0.08" stroke="#5fb3a1" stroke-width="1"/>
<text x="56.0" y="106.0" font-size="12.5" fill="#ede6d8" text-anchor="start" font-weight="700">your code</text>
<text x="370.0" y="106.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">read(fd, buf, 4096)</text>
<text x="828.0" y="106.0" font-size="11" fill="#5fb3a1" text-anchor="end" font-weight="400">user mode</text>
<rect x="40.0" y="126.0" width="800.0" height="34.0" rx="3" fill="#5fb3a1" fill-opacity="0.08" stroke="#5fb3a1" stroke-width="1"/>
<text x="56.0" y="148.0" font-size="12.5" fill="#ede6d8" text-anchor="start" font-weight="700">libc wrapper</text>
<text x="370.0" y="148.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">rax = 0 (SYS_read), args in rdi, rsi, rdx</text>
<text x="828.0" y="148.0" font-size="11" fill="#5fb3a1" text-anchor="end" font-weight="400">user mode</text>
<rect x="40.0" y="168.0" width="800.0" height="34.0" rx="3" fill="#e2b45a" fill-opacity="0.08" stroke="#e2b45a" stroke-width="1"/>
<text x="56.0" y="190.0" font-size="12.5" fill="#ede6d8" text-anchor="start" font-weight="700">syscall instruction</text>
<text x="370.0" y="190.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">CPU switches to ring 0, jumps to entry point</text>
<text x="828.0" y="190.0" font-size="11" fill="#e2b45a" text-anchor="end" font-weight="400">mode switch</text>
<rect x="40.0" y="210.0" width="800.0" height="34.0" rx="3" fill="#e5534b" fill-opacity="0.08" stroke="#e5534b" stroke-width="1"/>
<text x="56.0" y="232.0" font-size="12.5" fill="#ede6d8" text-anchor="start" font-weight="700">kernel entry</text>
<text x="370.0" y="232.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">save registers, switch stack, mitigations</text>
<text x="828.0" y="232.0" font-size="11" fill="#e5534b" text-anchor="end" font-weight="400">kernel mode</text>
<rect x="40.0" y="252.0" width="800.0" height="34.0" rx="3" fill="#e5534b" fill-opacity="0.08" stroke="#e5534b" stroke-width="1"/>
<text x="56.0" y="274.0" font-size="12.5" fill="#ede6d8" text-anchor="start" font-weight="700">sys_read → VFS → socket / page cache</text>
<text x="370.0" y="274.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">validate fd and buffer, copy data to user</text>
<text x="828.0" y="274.0" font-size="11" fill="#e5534b" text-anchor="end" font-weight="400">kernel mode</text>
<rect x="40.0" y="294.0" width="800.0" height="34.0" rx="3" fill="#e2b45a" fill-opacity="0.08" stroke="#e2b45a" stroke-width="1"/>
<text x="56.0" y="316.0" font-size="12.5" fill="#ede6d8" text-anchor="start" font-weight="700">sysret</text>
<text x="370.0" y="316.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">restore registers, back to ring 3; rax = bytes read</text>
<text x="828.0" y="316.0" font-size="11" fill="#e2b45a" text-anchor="end" font-weight="400">mode switch</text>
<text x="40.0" y="376.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">The kernel never trusts user pointers: it checks that buf is in user space and copies via routines that</text>
<text x="40.0" y="395.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">handle faults. Arguments travel in registers. Everything on the red and amber rows is overhead you pay per call,</text>
<text x="40.0" y="414.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">which is why chatty programs (one syscall per byte or per tiny message) are slow.</text>
</svg>
