<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 344" width="360" height="344" role="img" aria-label="Ways to avoid entering the kernel: vDSO, futex fast path, user-space buffering and kernel bypass" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="344" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Skipping the kernel</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">some calls never cross</text>
<text x="16.0" y="86.0" font-size="12.5" fill="#7cc47f" text-anchor="start" font-weight="700">vDSO</text>
<text x="16.0" y="103.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">clock_gettime, gettimeofday, getcpu</text>
<text x="16.0" y="132.0" font-size="12.5" fill="#5fb3a1" text-anchor="start" font-weight="700">futex fast path</text>
<text x="16.0" y="149.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">uncontended lock / unlock</text>
<text x="16.0" y="178.0" font-size="12.5" fill="#e2b45a" text-anchor="start" font-weight="700">user-space buffering</text>
<text x="16.0" y="195.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">stdio, BufReader, bufio</text>
<text x="16.0" y="224.0" font-size="12.5" fill="#9b8cff" text-anchor="start" font-weight="700">kernel bypass</text>
<text x="16.0" y="241.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">DPDK, SPDK, RDMA</text>
<text x="16.0" y="276.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">The vDSO maps time functions and</text>
<text x="16.0" y="295.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">a clock page into every process:</text>
<text x="16.0" y="314.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">~20 ns, no kernel entry.</text>
</svg>
