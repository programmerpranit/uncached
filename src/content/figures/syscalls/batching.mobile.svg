<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 384" width="360" height="384" role="img" aria-label="Number of system calls needed to copy 1 GiB with different buffer sizes" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="384" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Batching</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">copy 1 GiB, different buffers</text>
<text x="16.0" y="86.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">1-byte read/write</text>
<text x="16.0" y="103.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">~2.1 billion syscalls</text>
<rect x="16.0" y="110.0" width="252.0" height="12.0" rx="3" fill="#e5534b" fill-opacity="0.7" stroke="#e5534b" stroke-width="1"/>
<text x="16.0" y="142.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">4 KiB buffer</text>
<text x="16.0" y="159.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">~524,000 syscalls</text>
<rect x="16.0" y="166.0" width="139.5" height="12.0" rx="3" fill="#e2b45a" fill-opacity="0.7" stroke="#e2b45a" stroke-width="1"/>
<text x="16.0" y="198.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">128 KiB buffer</text>
<text x="16.0" y="215.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">~16,000 syscalls</text>
<rect x="16.0" y="222.0" width="77.0" height="12.0" rx="3" fill="#5fb3a1" fill-opacity="0.7" stroke="#5fb3a1" stroke-width="1"/>
<text x="16.0" y="254.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">sendfile / copy_file_range</text>
<text x="16.0" y="271.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">a few syscalls, no user copy</text>
<rect x="16.0" y="278.0" width="14.5" height="12.0" rx="3" fill="#7cc47f" fill-opacity="0.7" stroke="#7cc47f" stroke-width="1"/>
<text x="16.0" y="316.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Bigger buffers amortize the fixed</text>
<text x="16.0" y="335.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">cost; zero-copy calls skip user</text>
<text x="16.0" y="354.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">space entirely.</text>
</svg>
