<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 414" width="880" height="414" role="img" aria-label="Startup, liveness and readiness probes ask different questions; failing liveness restarts the container while failing readiness only removes it from load balancing" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="414" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b8cff"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e5534b"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Three probes, three consequences</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">the orchestrator asks different questions and takes different actions when the answer is no</text>
<rect x="40.0" y="96.0" width="150.0" height="250.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="115.0" y="218.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">kubelet /</text>
<text x="115.0" y="234.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">load balancer</text>
<line x1="194.0" y1="128.0" x2="286.0" y2="128.0" stroke="#9b8cff" stroke-width="1.4" marker-end="url(#ah0)"/>
<rect x="290.0" y="100.0" width="250.0" height="56.0" rx="3" fill="#9b8cff" fill-opacity="0.18" stroke="#9b8cff" stroke-width="1"/>
<text x="415.0" y="125.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Startup probe</text>
<text x="415.0" y="141.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">"Have you finished booting?"</text>
<line x1="540.0" y1="128.0" x2="586.0" y2="128.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah1)"/>
<rect x="590.0" y="100.0" width="250.0" height="56.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="715.0" y="131.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">fail → keep waiting; give up → restart</text>
<line x1="194.0" y1="212.0" x2="286.0" y2="212.0" stroke="#e5534b" stroke-width="1.4" marker-end="url(#ah2)"/>
<rect x="290.0" y="184.0" width="250.0" height="56.0" rx="3" fill="#e5534b" fill-opacity="0.18" stroke="#e5534b" stroke-width="1"/>
<text x="415.0" y="209.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Liveness probe</text>
<text x="415.0" y="225.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">"Are you stuck beyond repair?"</text>
<line x1="540.0" y1="212.0" x2="586.0" y2="212.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah1)"/>
<rect x="590.0" y="184.0" width="250.0" height="56.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="715.0" y="215.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">fail → kill and restart the container</text>
<line x1="194.0" y1="296.0" x2="286.0" y2="296.0" stroke="#5fb3a1" stroke-width="1.4" marker-end="url(#ah3)"/>
<rect x="290.0" y="268.0" width="250.0" height="56.0" rx="3" fill="#5fb3a1" fill-opacity="0.18" stroke="#5fb3a1" stroke-width="1"/>
<text x="415.0" y="293.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Readiness probe</text>
<text x="415.0" y="309.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">"Should you get traffic right now?"</text>
<line x1="540.0" y1="296.0" x2="586.0" y2="296.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah1)"/>
<rect x="590.0" y="268.0" width="250.0" height="56.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="715.0" y="299.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">fail → pulled from endpoints only</text>
<text x="440.0" y="384.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">Liveness checks only the process itself. Readiness may consider local capacity and warm-up.</text>
</svg>
