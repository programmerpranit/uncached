<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 490" width="360" height="490" role="img" aria-label="A pod passes its startup probe, warms up, becomes ready, briefly turns unready under overload, and on SIGTERM fails readiness to drain before exiting" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="490" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">A pod's life through its probes</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">boot → ready → drain</text>
<rect x="16.0" y="76.0" width="328.0" height="46.0" rx="3" fill="#9b8cff" fill-opacity="0.18" stroke="#9b8cff" stroke-width="1"/>
<text x="180.0" y="96.0" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Booting</text>
<text x="180.0" y="112.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">startup probe failing · no traffic, no liveness</text>
<rect x="16.0" y="138.0" width="328.0" height="46.0" rx="3" fill="#e2b45a" fill-opacity="0.18" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="158.0" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Warming</text>
<text x="180.0" y="174.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">ready = false · caches, pools, JIT</text>
<rect x="16.0" y="200.0" width="328.0" height="46.0" rx="3" fill="#7cc47f" fill-opacity="0.18" stroke="#7cc47f" stroke-width="1"/>
<text x="180.0" y="220.0" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Serving</text>
<text x="180.0" y="236.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">ready = true · in endpoints</text>
<rect x="16.0" y="262.0" width="328.0" height="46.0" rx="3" fill="#e2b45a" fill-opacity="0.18" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="282.0" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Overloaded</text>
<text x="180.0" y="298.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">ready = false · shed briefly</text>
<rect x="16.0" y="324.0" width="328.0" height="46.0" rx="3" fill="#7cc47f" fill-opacity="0.18" stroke="#7cc47f" stroke-width="1"/>
<text x="180.0" y="344.0" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Serving</text>
<text x="180.0" y="360.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">ready = true · back in</text>
<rect x="16.0" y="386.0" width="328.0" height="46.0" rx="3" fill="#e5534b" fill-opacity="0.18" stroke="#e5534b" stroke-width="1"/>
<text x="180.0" y="406.0" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Draining</text>
<text x="180.0" y="422.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">SIGTERM → ready=false · finish in-flight</text>
<text x="16.0" y="460.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">Liveness starts after startup succeeds.</text>
</svg>
