<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 482" width="360" height="482" role="img" aria-label="Startup, liveness and readiness probes ask different questions; failing liveness restarts the container while failing readiness only removes it from load balancing" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="482" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Three probes, three consequences</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">what happens when each one fails</text>
<rect x="16.0" y="76.0" width="328.0" height="50.0" rx="3" fill="#9b8cff" fill-opacity="0.18" stroke="#9b8cff" stroke-width="1"/>
<text x="180.0" y="98.0" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Startup probe</text>
<text x="180.0" y="114.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">"Have you finished booting?"</text>
<line x1="180.0" y1="126.0" x2="180.0" y2="140.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="16.0" y="142.0" width="328.0" height="34.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="180.0" y="162.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">fail → keep waiting; give up → restart</text>
<rect x="16.0" y="192.0" width="328.0" height="50.0" rx="3" fill="#e5534b" fill-opacity="0.18" stroke="#e5534b" stroke-width="1"/>
<text x="180.0" y="214.0" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Liveness probe</text>
<text x="180.0" y="230.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">"Are you stuck beyond repair?"</text>
<line x1="180.0" y1="242.0" x2="180.0" y2="256.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="16.0" y="258.0" width="328.0" height="34.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="180.0" y="278.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">fail → kill and restart the container</text>
<rect x="16.0" y="308.0" width="328.0" height="50.0" rx="3" fill="#5fb3a1" fill-opacity="0.18" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="330.0" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Readiness probe</text>
<text x="180.0" y="346.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">"Should you get traffic right now?"</text>
<line x1="180.0" y1="358.0" x2="180.0" y2="372.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="16.0" y="374.0" width="328.0" height="34.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="180.0" y="394.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">fail → pulled from endpoints only</text>
<text x="16.0" y="436.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">Liveness: only the process itself.</text>
<text x="16.0" y="452.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">Readiness: can I serve right now?</text>
</svg>
