<text x="170.0" y="312.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">each box = one DATA frame tagged with its stream ID (client streams are odd); the receiver reassembles per stream</text>
<text x="40.0" y="346.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">HTTP/1.1: a slow response blocks the requests queued behind it on that connection (application-level head-of-line blocking),</text>
<text x="40.0" y="362.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">so browsers open ~6 connections per origin and sites resorted to sprites, bundling and domain sharding.</text>
<text x="40.0" y="378.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">HTTP/2: one handshake, one congestion window, compressed headers, no per-connection queue — responses finish in any order.</text>
