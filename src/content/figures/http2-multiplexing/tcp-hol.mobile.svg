<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 431" width="360" height="431" role="img" aria-label="Seven packets carrying streams 1, 3 and 5 are sent; packet 2 is lost, so packets 3 to 7 wait in the kernel buffer and the application receives only packet 1 until the retransmission arrives" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="431" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">TCP head-of-line blocking</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">one lost packet stalls every stream</text>
<text x="16.0" y="78.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="700">sent</text>
<rect x="16.0" y="86.0" width="50.0" height="26.0" rx="3" fill="#5fb3a1" fill-opacity="0.25" stroke="#5fb3a1" stroke-width="1"/>
<text x="41.0" y="102.1" font-size="8.5" fill="#ede6d8" text-anchor="middle" font-weight="600">#1 s1</text>
<rect x="72.0" y="86.0" width="50.0" height="26.0" rx="3" fill="#9b8cff" fill-opacity="0.25" stroke="#9b8cff" stroke-width="1"/>
<text x="97.0" y="102.1" font-size="8.5" fill="#ede6d8" text-anchor="middle" font-weight="600">#2 s3</text>
<rect x="128.0" y="86.0" width="50.0" height="26.0" rx="3" fill="#e2b45a" fill-opacity="0.25" stroke="#e2b45a" stroke-width="1"/>
<text x="153.0" y="102.1" font-size="8.5" fill="#ede6d8" text-anchor="middle" font-weight="600">#3 s5</text>
<rect x="184.0" y="86.0" width="50.0" height="26.0" rx="3" fill="#5fb3a1" fill-opacity="0.25" stroke="#5fb3a1" stroke-width="1"/>
<text x="209.0" y="102.1" font-size="8.5" fill="#ede6d8" text-anchor="middle" font-weight="600">#4 s1</text>
<rect x="240.0" y="86.0" width="50.0" height="26.0" rx="3" fill="#9b8cff" fill-opacity="0.25" stroke="#9b8cff" stroke-width="1"/>
<text x="265.0" y="102.1" font-size="8.5" fill="#ede6d8" text-anchor="middle" font-weight="600">#5 s3</text>
<rect x="296.0" y="86.0" width="50.0" height="26.0" rx="3" fill="#e2b45a" fill-opacity="0.25" stroke="#e2b45a" stroke-width="1"/>
<text x="321.0" y="102.1" font-size="8.5" fill="#ede6d8" text-anchor="middle" font-weight="600">#6 s5</text>
<text x="16.0" y="142.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="700">arrived</text>
<rect x="16.0" y="150.0" width="50.0" height="26.0" rx="3" fill="#5fb3a1" fill-opacity="0.25" stroke="#5fb3a1" stroke-width="1"/>
<text x="41.0" y="166.1" font-size="8.5" fill="#ede6d8" text-anchor="middle" font-weight="600">#1 s1</text>
<rect x="72.0" y="150.0" width="50.0" height="26.0" rx="4" fill="#1b1712" fill-opacity="1" stroke="#e5534b" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="97.0" y="167.0" font-size="8.5" fill="#e5534b" text-anchor="middle" font-weight="700">LOST</text>
<rect x="128.0" y="150.0" width="50.0" height="26.0" rx="3" fill="#e2b45a" fill-opacity="0.25" stroke="#e2b45a" stroke-width="1"/>
<text x="153.0" y="166.1" font-size="8.5" fill="#ede6d8" text-anchor="middle" font-weight="600">#3 s5</text>
<rect x="184.0" y="150.0" width="50.0" height="26.0" rx="3" fill="#5fb3a1" fill-opacity="0.25" stroke="#5fb3a1" stroke-width="1"/>
<text x="209.0" y="166.1" font-size="8.5" fill="#ede6d8" text-anchor="middle" font-weight="600">#4 s1</text>
<rect x="240.0" y="150.0" width="50.0" height="26.0" rx="3" fill="#9b8cff" fill-opacity="0.25" stroke="#9b8cff" stroke-width="1"/>
<text x="265.0" y="166.1" font-size="8.5" fill="#ede6d8" text-anchor="middle" font-weight="600">#5 s3</text>
<rect x="296.0" y="150.0" width="50.0" height="26.0" rx="3" fill="#e2b45a" fill-opacity="0.25" stroke="#e2b45a" stroke-width="1"/>
<text x="321.0" y="166.1" font-size="8.5" fill="#ede6d8" text-anchor="middle" font-weight="600">#6 s5</text>
<rect x="124.0" y="145.0" width="226.0" height="36.0" rx="5" fill="#e5534b" fill-opacity="0.06" stroke="#e5534b" stroke-width="1" stroke-dasharray="5 4"/>
<text x="16.0" y="198.0" font-size="9" fill="#e5534b" text-anchor="start" font-weight="400">held in kernel buffer</text>
<text x="16.0" y="232.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="700">app sees</text>
<rect x="16.0" y="240.0" width="50.0" height="26.0" rx="3" fill="#5fb3a1" fill-opacity="0.25" stroke="#5fb3a1" stroke-width="1"/>
<text x="41.0" y="256.1" font-size="8.5" fill="#ede6d8" text-anchor="middle" font-weight="600">#1 s1</text>
<text x="76.0" y="257.0" font-size="9" fill="#a69d8e" text-anchor="start" font-weight="400">… then waits for resend</text>
<text x="16.0" y="296.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">s3 and s5 lost nothing but still</text>
<text x="16.0" y="311.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">wait: TCP delivers bytes in order.</text>
<text x="16.0" y="341.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">One loss stalls every HTTP/2 stream</text>
<text x="16.0" y="356.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">and halves the shared cwnd.</text>
<text x="16.0" y="386.0" font-size="9.5" fill="#7cc47f" text-anchor="start" font-weight="400">HTTP/3 (QUIC) blocks only the</text>
<text x="16.0" y="401.0" font-size="9.5" fill="#7cc47f" text-anchor="start" font-weight="400">stream that lost data.</text>
</svg>
