<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 401" width="880" height="401" role="img" aria-label="Seven packets carrying streams 1, 3 and 5 are sent; packet 2 is lost, so packets 3 to 7 wait in the kernel buffer and the application receives only packet 1 until the retransmission arrives" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="401" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Where head-of-line blocking moved</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">HTTP/2 removed it from HTTP, but TCP still delivers one ordered byte stream</text>
<text x="40.0" y="96.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="700">sent</text>
<rect x="120.0" y="78.0" width="82.0" height="30.0" rx="3" fill="#5fb3a1" fill-opacity="0.25" stroke="#5fb3a1" stroke-width="1"/>
<text x="161.0" y="96.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">#1 · s1</text>
<rect x="212.0" y="78.0" width="82.0" height="30.0" rx="3" fill="#9b8cff" fill-opacity="0.25" stroke="#9b8cff" stroke-width="1"/>
<text x="253.0" y="96.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">#2 · s3</text>
<rect x="304.0" y="78.0" width="82.0" height="30.0" rx="3" fill="#e2b45a" fill-opacity="0.25" stroke="#e2b45a" stroke-width="1"/>
<text x="345.0" y="96.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">#3 · s5</text>
<rect x="396.0" y="78.0" width="82.0" height="30.0" rx="3" fill="#5fb3a1" fill-opacity="0.25" stroke="#5fb3a1" stroke-width="1"/>
<text x="437.0" y="96.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">#4 · s1</text>
<rect x="488.0" y="78.0" width="82.0" height="30.0" rx="3" fill="#9b8cff" fill-opacity="0.25" stroke="#9b8cff" stroke-width="1"/>
<text x="529.0" y="96.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">#5 · s3</text>
<rect x="580.0" y="78.0" width="82.0" height="30.0" rx="3" fill="#e2b45a" fill-opacity="0.25" stroke="#e2b45a" stroke-width="1"/>
<text x="621.0" y="96.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">#6 · s5</text>
<rect x="672.0" y="78.0" width="82.0" height="30.0" rx="3" fill="#5fb3a1" fill-opacity="0.25" stroke="#5fb3a1" stroke-width="1"/>
<text x="713.0" y="96.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">#7 · s1</text>
<text x="40.0" y="166.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="700">arrived</text>
<rect x="120.0" y="148.0" width="82.0" height="30.0" rx="3" fill="#5fb3a1" fill-opacity="0.25" stroke="#5fb3a1" stroke-width="1"/>
<text x="161.0" y="166.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">#1 · s1</text>
<rect x="212.0" y="148.0" width="82.0" height="30.0" rx="4" fill="#1b1712" fill-opacity="1" stroke="#e5534b" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="253.0" y="167.0" font-size="10" fill="#e5534b" text-anchor="middle" font-weight="700">LOST</text>
<rect x="304.0" y="148.0" width="82.0" height="30.0" rx="3" fill="#e2b45a" fill-opacity="0.25" stroke="#e2b45a" stroke-width="1"/>
<text x="345.0" y="166.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">#3 · s5</text>
<rect x="396.0" y="148.0" width="82.0" height="30.0" rx="3" fill="#5fb3a1" fill-opacity="0.25" stroke="#5fb3a1" stroke-width="1"/>
<text x="437.0" y="166.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">#4 · s1</text>
<rect x="488.0" y="148.0" width="82.0" height="30.0" rx="3" fill="#9b8cff" fill-opacity="0.25" stroke="#9b8cff" stroke-width="1"/>
<text x="529.0" y="166.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">#5 · s3</text>
<rect x="580.0" y="148.0" width="82.0" height="30.0" rx="3" fill="#e2b45a" fill-opacity="0.25" stroke="#e2b45a" stroke-width="1"/>
<text x="621.0" y="166.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">#6 · s5</text>
<rect x="672.0" y="148.0" width="82.0" height="30.0" rx="3" fill="#5fb3a1" fill-opacity="0.25" stroke="#5fb3a1" stroke-width="1"/>
<text x="713.0" y="166.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">#7 · s1</text>
<rect x="298.0" y="140.0" width="462.0" height="46.0" rx="6" fill="#e5534b" fill-opacity="0.06" stroke="#e5534b" stroke-width="1" stroke-dasharray="5 4"/>
<text x="530.0" y="202.0" font-size="10" fill="#e5534b" text-anchor="middle" font-weight="400">in the kernel receive buffer — complete, but not delivered to the app</text>
<text x="40.0" y="246.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="700">app sees</text>
<rect x="120.0" y="228.0" width="82.0" height="30.0" rx="3" fill="#5fb3a1" fill-opacity="0.25" stroke="#5fb3a1" stroke-width="1"/>
<text x="161.0" y="246.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">#1 · s1</text>
<text x="220.0" y="247.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">… nothing else until #2 is retransmitted (≥ 1 RTT, often an RTO)</text>
<line x1="40.0" y1="296.0" x2="840.0" y2="296.0" stroke="#4a4136" stroke-width="1"/>
<text x="40.0" y="320.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">Streams 3 and 5 did not lose anything, yet they wait: TCP only hands bytes to the application in order.</text>
<text x="40.0" y="337.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">With six HTTP/1.1 connections, one loss stalls one connection; with one HTTP/2 connection it stalls every stream,</text>
<text x="40.0" y="354.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">and the single congestion window halves for all of them. On lossy links (&gt;1–2% loss) HTTP/2 can be slower than HTTP/1.1.</text>
<text x="40.0" y="371.0" font-size="10" fill="#7cc47f" text-anchor="start" font-weight="400">HTTP/3 fixes this by moving streams into QUIC over UDP, where loss only blocks the stream that lost data.</text>
</svg>
