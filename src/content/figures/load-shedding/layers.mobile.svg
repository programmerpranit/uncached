<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 474" width="360" height="474" role="img" aria-label="Requests can be rejected at the edge with rate limits, at the load balancer, by server admission control, by priority, and by deadline checks in handlers" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="474" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Where to reject</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">earliest is cheapest</text>
<rect x="16.0" y="76.0" width="328.0" height="48.0" rx="3" fill="#5fb3a1" fill-opacity="0.18" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="97.0" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Edge / gateway</text>
<text x="180.0" y="113.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">rate limits, quotas per client</text>
<text x="28.0" y="140.0" font-size="10" fill="#5fb3a1" text-anchor="start" font-weight="400">→ 429 before any work</text>
<rect x="16.0" y="152.0" width="328.0" height="48.0" rx="3" fill="#9b8cff" fill-opacity="0.18" stroke="#9b8cff" stroke-width="1"/>
<text x="180.0" y="173.0" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Load balancer</text>
<text x="180.0" y="189.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">max connections, outlier ejection</text>
<text x="28.0" y="216.0" font-size="10" fill="#9b8cff" text-anchor="start" font-weight="400">→ route away from hot nodes</text>
<rect x="16.0" y="228.0" width="328.0" height="48.0" rx="3" fill="#e2b45a" fill-opacity="0.18" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="249.0" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Server admission</text>
<text x="180.0" y="265.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">concurrency limit, queue timeout, CoDel</text>
<text x="28.0" y="292.0" font-size="10" fill="#e2b45a" text-anchor="start" font-weight="400">→ 503 in microseconds</text>
<rect x="16.0" y="304.0" width="328.0" height="48.0" rx="3" fill="#d77fa1" fill-opacity="0.18" stroke="#d77fa1" stroke-width="1"/>
<text x="180.0" y="325.0" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Priority</text>
<text x="180.0" y="341.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">critical &gt; default &gt; batch</text>
<text x="28.0" y="368.0" font-size="10" fill="#d77fa1" text-anchor="start" font-weight="400">→ drop sheddable first</text>
<rect x="16.0" y="380.0" width="328.0" height="48.0" rx="3" fill="#7cc47f" fill-opacity="0.18" stroke="#7cc47f" stroke-width="1"/>
<text x="180.0" y="401.0" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Handler / deadline</text>
<text x="180.0" y="417.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">skip work whose caller gave up</text>
<text x="28.0" y="444.0" font-size="10" fill="#7cc47f" text-anchor="start" font-weight="400">→ no wasted effort</text>
</svg>
