<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" role="img" aria-label="Requests can be rejected at the edge with rate limits, at the load balancer, by server admission control, by priority, and by deadline checks in handlers" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="450" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Where to reject</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">reject as early and as cheaply as possible, with signals that reflect real saturation</text>
<rect x="40.0" y="92.0" width="300.0" height="48.0" rx="3" fill="#5fb3a1" fill-opacity="0.18" stroke="#5fb3a1" stroke-width="1"/>
<text x="190.0" y="120.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Edge / gateway</text>
<text x="360.0" y="114.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">rate limits, quotas per client</text>
<text x="360.0" y="130.0" font-size="10" fill="#5fb3a1" text-anchor="start" font-weight="400">429 before any work</text>
<line x1="190.0" y1="140.0" x2="190.0" y2="152.0" stroke="#a69d8e" stroke-width="1.1" marker-end="url(#ah0)"/>
<rect x="40.0" y="154.0" width="300.0" height="48.0" rx="3" fill="#9b8cff" fill-opacity="0.18" stroke="#9b8cff" stroke-width="1"/>
<text x="190.0" y="182.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Load balancer</text>
<text x="360.0" y="176.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">max connections, outlier ejection</text>
<text x="360.0" y="192.0" font-size="10" fill="#9b8cff" text-anchor="start" font-weight="400">route away from hot nodes</text>
<line x1="190.0" y1="202.0" x2="190.0" y2="214.0" stroke="#a69d8e" stroke-width="1.1" marker-end="url(#ah0)"/>
<rect x="40.0" y="216.0" width="300.0" height="48.0" rx="3" fill="#e2b45a" fill-opacity="0.18" stroke="#e2b45a" stroke-width="1"/>
<text x="190.0" y="244.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Server admission</text>
<text x="360.0" y="238.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">concurrency limit, queue timeout, CoDel</text>
<text x="360.0" y="254.0" font-size="10" fill="#e2b45a" text-anchor="start" font-weight="400">503 in microseconds</text>
<line x1="190.0" y1="264.0" x2="190.0" y2="276.0" stroke="#a69d8e" stroke-width="1.1" marker-end="url(#ah0)"/>
<rect x="40.0" y="278.0" width="300.0" height="48.0" rx="3" fill="#d77fa1" fill-opacity="0.18" stroke="#d77fa1" stroke-width="1"/>
<text x="190.0" y="306.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Priority</text>
<text x="360.0" y="300.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">critical &gt; default &gt; batch</text>
<text x="360.0" y="316.0" font-size="10" fill="#d77fa1" text-anchor="start" font-weight="400">drop sheddable first</text>
<line x1="190.0" y1="326.0" x2="190.0" y2="338.0" stroke="#a69d8e" stroke-width="1.1" marker-end="url(#ah0)"/>
<rect x="40.0" y="340.0" width="300.0" height="48.0" rx="3" fill="#7cc47f" fill-opacity="0.18" stroke="#7cc47f" stroke-width="1"/>
<text x="190.0" y="368.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Handler / deadline</text>
<text x="360.0" y="362.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">skip work whose caller gave up</text>
<text x="360.0" y="378.0" font-size="10" fill="#7cc47f" text-anchor="start" font-weight="400">no wasted effort</text>
<text x="440.0" y="420.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">Each rejected request should cost far less than serving one.</text>
</svg>
