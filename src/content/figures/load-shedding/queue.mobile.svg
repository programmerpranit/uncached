<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 346" width="360" height="346" role="img" aria-label="An unbounded FIFO queue makes every request wait past its client timeout, while a bounded queue with timeouts rejects excess immediately and keeps queued work fresh" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="346" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Bound the queue, not just the rate</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">a long queue is a latency bomb</text>
<text x="16.0" y="100.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="700">Unbounded FIFO</text>
<rect x="16.0" y="110.0" width="22.0" height="26.0" rx="3" fill="#e5534b" fill-opacity="0.3" stroke="#e5534b" stroke-width="1"/>
<rect x="41.0" y="110.0" width="22.0" height="26.0" rx="3" fill="#e5534b" fill-opacity="0.3" stroke="#e5534b" stroke-width="1"/>
<rect x="66.0" y="110.0" width="22.0" height="26.0" rx="3" fill="#e5534b" fill-opacity="0.3" stroke="#e5534b" stroke-width="1"/>
<rect x="91.0" y="110.0" width="22.0" height="26.0" rx="3" fill="#e5534b" fill-opacity="0.3" stroke="#e5534b" stroke-width="1"/>
<rect x="116.0" y="110.0" width="22.0" height="26.0" rx="3" fill="#e5534b" fill-opacity="0.3" stroke="#e5534b" stroke-width="1"/>
<rect x="141.0" y="110.0" width="22.0" height="26.0" rx="3" fill="#e5534b" fill-opacity="0.3" stroke="#e5534b" stroke-width="1"/>
<rect x="166.0" y="110.0" width="22.0" height="26.0" rx="3" fill="#e5534b" fill-opacity="0.3" stroke="#e5534b" stroke-width="1"/>
<rect x="191.0" y="110.0" width="22.0" height="26.0" rx="3" fill="#e5534b" fill-opacity="0.3" stroke="#e5534b" stroke-width="1"/>
<rect x="216.0" y="110.0" width="22.0" height="26.0" rx="3" fill="#a69d8e" fill-opacity="0.3" stroke="#a69d8e" stroke-width="1"/>
<rect x="241.0" y="110.0" width="22.0" height="26.0" rx="3" fill="#a69d8e" fill-opacity="0.3" stroke="#a69d8e" stroke-width="1"/>
<rect x="266.0" y="110.0" width="22.0" height="26.0" rx="3" fill="#a69d8e" fill-opacity="0.3" stroke="#a69d8e" stroke-width="1"/>
<rect x="291.0" y="110.0" width="22.0" height="26.0" rx="3" fill="#a69d8e" fill-opacity="0.3" stroke="#a69d8e" stroke-width="1"/>
<text x="16.0" y="156.0" font-size="10" fill="#e5534b" text-anchor="start" font-weight="400">all work stale by the time it runs</text>
<text x="16.0" y="200.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="700">Bounded + timeout</text>
<rect x="16.0" y="210.0" width="22.0" height="26.0" rx="3" fill="#7cc47f" fill-opacity="0.3" stroke="#7cc47f" stroke-width="1"/>
<rect x="41.0" y="210.0" width="22.0" height="26.0" rx="3" fill="#7cc47f" fill-opacity="0.3" stroke="#7cc47f" stroke-width="1"/>
<rect x="66.0" y="210.0" width="22.0" height="26.0" rx="3" fill="#7cc47f" fill-opacity="0.3" stroke="#7cc47f" stroke-width="1"/>
<rect x="91.0" y="210.0" width="22.0" height="26.0" rx="3" fill="#7cc47f" fill-opacity="0.3" stroke="#7cc47f" stroke-width="1"/>
<text x="16.0" y="256.0" font-size="10" fill="#7cc47f" text-anchor="start" font-weight="400">excess → 503 now; rest fresh</text>
<text x="16.0" y="300.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">Adaptive: CoDel, LIFO under overload,</text>
<text x="16.0" y="316.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">latency-based concurrency limits.</text>
</svg>
