<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 410" width="360" height="410" role="img" aria-label="Goodput rises with load up to capacity; with load shedding it stays flat beyond capacity, without it it collapses as requests time out" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="410" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Goodput collapses without shedding</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">throughput vs offered load</text>
<line x1="40.0" y1="360.0" x2="340.0" y2="360.0" stroke="#a69d8e" stroke-width="1.2"/>
<line x1="40.0" y1="360.0" x2="40.0" y2="120.0" stroke="#a69d8e" stroke-width="1.2"/>
<text x="340.0" y="380.0" font-size="10" fill="#a69d8e" text-anchor="end" font-weight="400">offered load →</text>
<text x="32.0" y="114.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">goodput</text>
<line x1="175.0" y1="360.0" x2="175.0" y2="120.0" stroke="#4a4136" stroke-width="1" stroke-dasharray="3,4"/>
<text x="175.0" y="380.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">capacity</text>
<path d="M40,360 L175,180 L340,180" fill="none" stroke="#7cc47f" stroke-width="2.2"/>
<path d="M175,180 C220,190 265,324 340,341" fill="none" stroke="#e5534b" stroke-width="2.2" stroke-dasharray="6,4"/>
<text x="160.0" y="166.0" font-size="9.5" fill="#7cc47f" text-anchor="start" font-weight="400">with load shedding: flat</text>
<text x="187.0" y="336.0" font-size="9.5" fill="#e5534b" text-anchor="start" font-weight="400">no shedding: collapse</text>
</svg>
