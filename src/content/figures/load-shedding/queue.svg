<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 398" width="880" height="398" role="img" aria-label="An unbounded FIFO queue makes every request wait past its client timeout, while a bounded queue with timeouts rejects excess immediately and keeps queued work fresh" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="398" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Bound the queue, not just the rate</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">a deep FIFO serves only stale requests; a bounded queue with timeouts serves fresh ones</text>
<text x="40.0" y="110.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="700">Unbounded FIFO</text>
<rect x="40.0" y="120.0" width="20.0" height="26.0" rx="3" fill="#e5534b" fill-opacity="0.3" stroke="#e5534b" stroke-width="1"/>
