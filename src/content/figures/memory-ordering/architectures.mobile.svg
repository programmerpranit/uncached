<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 361" width="360" height="361" role="img" aria-label="Table of which load and store reorderings x86, ARM, POWER and RISC-V allow" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="361" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Hardware reorderings</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">✓ = allowed, different addresses</text>
<text x="192.0" y="86.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">LL</text>
<text x="236.0" y="86.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">LS</text>
<text x="280.0" y="86.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">SS</text>
<text x="324.0" y="86.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">SL</text>
<text x="16.0" y="114.0" font-size="11.5" fill="#5fb3a1" text-anchor="start" font-weight="600">x86-64 (TSO)</text>
<text x="192.0" y="114.0" font-size="12" fill="#a69d8e" text-anchor="middle" font-weight="400">–</text>
<text x="236.0" y="114.0" font-size="12" fill="#a69d8e" text-anchor="middle" font-weight="400">–</text>
<text x="280.0" y="114.0" font-size="12" fill="#a69d8e" text-anchor="middle" font-weight="400">–</text>
<text x="324.0" y="114.0" font-size="12" fill="#e5534b" text-anchor="middle" font-weight="400">✓</text>
<text x="16.0" y="144.0" font-size="11.5" fill="#e2b45a" text-anchor="start" font-weight="600">ARMv8 / AArch64</text>
<text x="192.0" y="144.0" font-size="12" fill="#e5534b" text-anchor="middle" font-weight="400">✓</text>
<text x="236.0" y="144.0" font-size="12" fill="#e5534b" text-anchor="middle" font-weight="400">✓</text>
<text x="280.0" y="144.0" font-size="12" fill="#e5534b" text-anchor="middle" font-weight="400">✓</text>
<text x="324.0" y="144.0" font-size="12" fill="#e5534b" text-anchor="middle" font-weight="400">✓</text>
<text x="16.0" y="174.0" font-size="11.5" fill="#e2b45a" text-anchor="start" font-weight="600">POWER</text>
<text x="192.0" y="174.0" font-size="12" fill="#e5534b" text-anchor="middle" font-weight="400">✓</text>
<text x="236.0" y="174.0" font-size="12" fill="#e5534b" text-anchor="middle" font-weight="400">✓</text>
<text x="280.0" y="174.0" font-size="12" fill="#e5534b" text-anchor="middle" font-weight="400">✓</text>
<text x="324.0" y="174.0" font-size="12" fill="#e5534b" text-anchor="middle" font-weight="400">✓</text>
<text x="16.0" y="204.0" font-size="11.5" fill="#e2b45a" text-anchor="start" font-weight="600">RISC-V (RVWMO)</text>
<text x="192.0" y="204.0" font-size="12" fill="#e5534b" text-anchor="middle" font-weight="400">✓</text>
<text x="236.0" y="204.0" font-size="12" fill="#e5534b" text-anchor="middle" font-weight="400">✓</text>
<text x="280.0" y="204.0" font-size="12" fill="#e5534b" text-anchor="middle" font-weight="400">✓</text>
<text x="324.0" y="204.0" font-size="12" fill="#e5534b" text-anchor="middle" font-weight="400">✓</text>
<text x="16.0" y="234.0" font-size="11.5" fill="#7cc47f" text-anchor="start" font-weight="600">seq. consistent</text>
<text x="192.0" y="234.0" font-size="12" fill="#a69d8e" text-anchor="middle" font-weight="400">–</text>
<text x="236.0" y="234.0" font-size="12" fill="#a69d8e" text-anchor="middle" font-weight="400">–</text>
<text x="280.0" y="234.0" font-size="12" fill="#a69d8e" text-anchor="middle" font-weight="400">–</text>
<text x="324.0" y="234.0" font-size="12" fill="#a69d8e" text-anchor="middle" font-weight="400">–</text>
<text x="16.0" y="274.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">L = load, S = store; "SL" = a later</text>
<text x="16.0" y="293.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">load passes an earlier store. x86</text>
<text x="16.0" y="312.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">only does SL; ARM does all four.</text>
<text x="16.0" y="331.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Compilers reorder on every CPU.</text>
</svg>
