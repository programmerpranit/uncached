<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 371" width="360" height="371" role="img" aria-label="C++ and Rust memory orders from relaxed to sequentially consistent with uses and relative cost" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="371" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Memory orders</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">stronger = safer, maybe slower</text>
<text x="16.0" y="86.0" font-size="12.5" fill="#7cc47f" text-anchor="start" font-weight="700">relaxed</text>
<text x="16.0" y="103.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">use: counters, statistics</text>
<rect x="230.0" y="76.0" width="16.5" height="14.0" rx="3" fill="#7cc47f" fill-opacity="0.7" stroke="#7cc47f" stroke-width="1"/>
<text x="16.0" y="134.0" font-size="12.5" fill="#5fb3a1" text-anchor="start" font-weight="700">acquire / release</text>
<text x="16.0" y="151.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">use: locks, publishing data</text>
<rect x="230.0" y="124.0" width="44.0" height="14.0" rx="3" fill="#5fb3a1" fill-opacity="0.7" stroke="#5fb3a1" stroke-width="1"/>
<text x="16.0" y="182.0" font-size="12.5" fill="#e2b45a" text-anchor="start" font-weight="700">acq_rel</text>
<text x="16.0" y="199.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">use: CAS in lock-free code</text>
<rect x="230.0" y="172.0" width="60.5" height="14.0" rx="3" fill="#e2b45a" fill-opacity="0.7" stroke="#e2b45a" stroke-width="1"/>
<text x="16.0" y="230.0" font-size="12.5" fill="#e5534b" text-anchor="start" font-weight="700">seq_cst</text>
<text x="16.0" y="247.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">use: default; when unsure</text>
<rect x="230.0" y="220.0" width="93.5" height="14.0" rx="3" fill="#e5534b" fill-opacity="0.7" stroke="#e5534b" stroke-width="1"/>
<text x="16.0" y="284.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">On x86, acquire/release are free</text>
<text x="16.0" y="303.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">(plain moves); seq_cst stores need</text>
<text x="16.0" y="322.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">a fence. Default to seq_cst, and</text>
<text x="16.0" y="341.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">prefer locks or library code.</text>
</svg>
