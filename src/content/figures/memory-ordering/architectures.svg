<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 414" width="880" height="414" role="img" aria-label="Table of which load and store reorderings x86, ARM, POWER and RISC-V allow" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="414" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Which reorderings hardware may perform</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">✓ = allowed (for accesses to different addresses)</text>
<text x="367.5" y="100.0" font-size="11.5" fill="#a69d8e" text-anchor="middle" font-weight="400">load→load</text>
<text x="502.5" y="100.0" font-size="11.5" fill="#a69d8e" text-anchor="middle" font-weight="400">load→store</text>
<text x="637.5" y="100.0" font-size="11.5" fill="#a69d8e" text-anchor="middle" font-weight="400">store→store</text>
<text x="772.5" y="100.0" font-size="11.5" fill="#a69d8e" text-anchor="middle" font-weight="400">store→load</text>
<rect x="40.0" y="114.0" width="800.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="56.0" y="135.0" font-size="12.5" fill="#5fb3a1" text-anchor="start" font-weight="600">x86-64 (TSO)</text>
<text x="367.5" y="136.0" font-size="13" fill="#a69d8e" text-anchor="middle" font-weight="400">–</text>
<text x="502.5" y="136.0" font-size="13" fill="#a69d8e" text-anchor="middle" font-weight="400">–</text>
<text x="637.5" y="136.0" font-size="13" fill="#a69d8e" text-anchor="middle" font-weight="400">–</text>
<text x="772.5" y="136.0" font-size="13" fill="#e5534b" text-anchor="middle" font-weight="700">✓</text>
<rect x="40.0" y="154.0" width="800.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="56.0" y="175.0" font-size="12.5" fill="#e2b45a" text-anchor="start" font-weight="600">ARMv8 / AArch64</text>
<text x="367.5" y="176.0" font-size="13" fill="#e5534b" text-anchor="middle" font-weight="700">✓</text>
<text x="502.5" y="176.0" font-size="13" fill="#e5534b" text-anchor="middle" font-weight="700">✓</text>
<text x="637.5" y="176.0" font-size="13" fill="#e5534b" text-anchor="middle" font-weight="700">✓</text>
<text x="772.5" y="176.0" font-size="13" fill="#e5534b" text-anchor="middle" font-weight="700">✓</text>
<rect x="40.0" y="194.0" width="800.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="56.0" y="215.0" font-size="12.5" fill="#e2b45a" text-anchor="start" font-weight="600">POWER</text>
<text x="367.5" y="216.0" font-size="13" fill="#e5534b" text-anchor="middle" font-weight="700">✓</text>
<text x="502.5" y="216.0" font-size="13" fill="#e5534b" text-anchor="middle" font-weight="700">✓</text>
<text x="637.5" y="216.0" font-size="13" fill="#e5534b" text-anchor="middle" font-weight="700">✓</text>
<text x="772.5" y="216.0" font-size="13" fill="#e5534b" text-anchor="middle" font-weight="700">✓</text>
<rect x="40.0" y="234.0" width="800.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="56.0" y="255.0" font-size="12.5" fill="#e2b45a" text-anchor="start" font-weight="600">RISC-V (RVWMO)</text>
<text x="367.5" y="256.0" font-size="13" fill="#e5534b" text-anchor="middle" font-weight="700">✓</text>
<text x="502.5" y="256.0" font-size="13" fill="#e5534b" text-anchor="middle" font-weight="700">✓</text>
<text x="637.5" y="256.0" font-size="13" fill="#e5534b" text-anchor="middle" font-weight="700">✓</text>
<text x="772.5" y="256.0" font-size="13" fill="#e5534b" text-anchor="middle" font-weight="700">✓</text>
<rect x="40.0" y="274.0" width="800.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="56.0" y="295.0" font-size="12.5" fill="#7cc47f" text-anchor="start" font-weight="600">sequential consistency</text>
<text x="367.5" y="296.0" font-size="13" fill="#a69d8e" text-anchor="middle" font-weight="400">–</text>
<text x="502.5" y="296.0" font-size="13" fill="#a69d8e" text-anchor="middle" font-weight="400">–</text>
<text x="637.5" y="296.0" font-size="13" fill="#a69d8e" text-anchor="middle" font-weight="400">–</text>
<text x="772.5" y="296.0" font-size="13" fill="#a69d8e" text-anchor="middle" font-weight="400">–</text>
<text x="40.0" y="346.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">"store→load" means a later load may complete before an earlier store becomes visible. x86 only does that</text>
<text x="40.0" y="365.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">one, so most code "just works" there and breaks when ported to ARM (Apple Silicon, Graviton). Compilers reorder</text>
<text x="40.0" y="384.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">too, on every architecture, so the language memory model, not the CPU, is what you program against.</text>
</svg>
