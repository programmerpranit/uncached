<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 426" width="880" height="426" role="img" aria-label="C++ and Rust memory orders from relaxed to sequentially consistent with uses and relative cost" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="426" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">C++ / Rust memory orders: guarantee vs cost</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">stronger orders forbid more reorderings, and may need fences</text>
<text x="40.0" y="104.0" font-size="13" fill="#7cc47f" text-anchor="start" font-weight="700">relaxed</text>
<text x="40.0" y="122.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">atomicity only; no ordering with other variables</text>
<text x="40.0" y="138.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">use: counters, statistics</text>
<rect x="560.0" y="98.0" width="39.0" height="18.0" rx="3" fill="#7cc47f" fill-opacity="0.7" stroke="#7cc47f" stroke-width="1"/>
<text x="40.0" y="166.0" font-size="13" fill="#5fb3a1" text-anchor="start" font-weight="700">acquire / release</text>
<text x="40.0" y="184.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">one-way ordering around a load / store</text>
<text x="40.0" y="200.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">use: locks, publishing data</text>
<rect x="560.0" y="160.0" width="104.0" height="18.0" rx="3" fill="#5fb3a1" fill-opacity="0.7" stroke="#5fb3a1" stroke-width="1"/>
<text x="40.0" y="228.0" font-size="13" fill="#e2b45a" text-anchor="start" font-weight="700">acq_rel</text>
<text x="40.0" y="246.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">both, for read-modify-write</text>
<text x="40.0" y="262.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">use: CAS in lock-free code</text>
<rect x="560.0" y="222.0" width="143.0" height="18.0" rx="3" fill="#e2b45a" fill-opacity="0.7" stroke="#e2b45a" stroke-width="1"/>
<text x="40.0" y="290.0" font-size="13" fill="#e5534b" text-anchor="start" font-weight="700">seq_cst</text>
<text x="40.0" y="308.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">one global order of all seq_cst operations</text>
<text x="40.0" y="324.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">use: default; when unsure</text>
<rect x="560.0" y="284.0" width="221.0" height="18.0" rx="3" fill="#e5534b" fill-opacity="0.7" stroke="#e5534b" stroke-width="1"/>
<text x="560.0" y="84.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">relative strength / potential cost</text>
<text x="40.0" y="358.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">On x86, acquire loads and release stores compile to plain moves (TSO already gives them); only seq_cst stores</text>
<text x="40.0" y="377.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">need a fence or xchg. On ARMv8, acquire/release map to ldar/stlr instructions. Default to seq_cst, then relax</text>
<text x="40.0" y="396.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">with proof and tests; most programmers should use locks or library structures and never write orders at all.</text>
</svg>
