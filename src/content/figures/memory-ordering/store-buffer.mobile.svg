<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 417" width="360" height="417" role="img" aria-label="Store-buffering litmus test where both threads read zero because stores wait in store buffers" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="417" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Store buffering</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">x = y = 0; both reads can see 0</text>
<rect x="16.0" y="84.0" width="328.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="103.3" font-size="12" fill="#5fb3a1" text-anchor="middle" font-weight="600">core 1</text>
<text x="24.0" y="136.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">1. x = 1   2. r1 = y</text>
<text x="24.0" y="156.0" font-size="11" fill="#e2b45a" text-anchor="start" font-weight="400">x = 1 waits in store buffer</text>
<rect x="16.0" y="180.0" width="328.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="180.0" y="199.3" font-size="12" fill="#9b8cff" text-anchor="middle" font-weight="600">core 2</text>
<text x="24.0" y="232.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">1. y = 1   2. r2 = x</text>
<text x="24.0" y="252.0" font-size="11" fill="#e2b45a" text-anchor="start" font-weight="400">y = 1 waits in store buffer</text>
<text x="16.0" y="300.0" font-size="12.5" fill="#e5534b" text-anchor="start" font-weight="700">r1 = 0 and r2 = 0 is possible</text>
<text x="16.0" y="330.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Stores sit in the store buffer while</text>
<text x="16.0" y="349.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">the later load reads memory. A full</text>
<text x="16.0" y="368.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">fence (mfence / seq_cst) between</text>
<text x="16.0" y="387.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">them forbids this, for a cost.</text>
</svg>
