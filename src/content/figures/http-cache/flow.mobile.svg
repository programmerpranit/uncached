<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 473" width="360" height="473" role="img" aria-label="A cached response is reused with no request while fresh; once stale the browser revalidates with If-None-Match and gets a 304 to reuse the body or a 200 with a new one" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="473" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Cache decision</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">fresh · stale · miss</text>
<rect x="16.0" y="86.0" width="328.0" height="46.0" rx="6" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1.2"/>
<text x="28.0" y="106.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="700">request /app.css</text>
<rect x="16.0" y="140.0" width="328.0" height="46.0" rx="6" fill="#e5534b" fill-opacity="0.18" stroke="#e5534b" stroke-width="1.2"/>
<text x="28.0" y="160.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="700">not cached → full GET → 200</text>
<text x="28.0" y="177.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">download everything</text>
<rect x="16.0" y="194.0" width="328.0" height="46.0" rx="6" fill="#5fb3a1" fill-opacity="0.18" stroke="#5fb3a1" stroke-width="1.2"/>
<text x="28.0" y="214.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="700">cached &amp; fresh (age &lt; max-age)</text>
<text x="28.0" y="231.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">no request at all</text>
<rect x="16.0" y="248.0" width="328.0" height="46.0" rx="6" fill="#e2b45a" fill-opacity="0.18" stroke="#e2b45a" stroke-width="1.2"/>
<text x="28.0" y="268.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="700">cached &amp; stale → If-None-Match</text>
<text x="28.0" y="285.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">conditional request</text>
<rect x="16.0" y="302.0" width="328.0" height="46.0" rx="6" fill="#7cc47f" fill-opacity="0.18" stroke="#7cc47f" stroke-width="1.2"/>
<text x="28.0" y="322.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="700">→ 304 Not Modified</text>
<text x="28.0" y="339.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">reuse body, 1 round trip</text>
<rect x="16.0" y="356.0" width="328.0" height="46.0" rx="6" fill="#ff5b2e" fill-opacity="0.18" stroke="#ff5b2e" stroke-width="1.2"/>
<text x="28.0" y="376.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="700">→ 200 with new body</text>
<text x="28.0" y="393.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">resource changed</text>
<text x="16.0" y="424.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">Fresh hits are free; 304s save</text>
<text x="16.0" y="443.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">bytes but not the round trip.</text>
</svg>
