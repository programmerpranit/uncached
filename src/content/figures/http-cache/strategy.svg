<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 349" width="880" height="349" role="img" aria-label="HTML is served with no-cache and an ETag so it is always revalidated, while content-hashed assets are cached for a year as immutable because changed content gets a new URL" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="349" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a4136"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Two kinds of URL, two cache policies</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">HTML stays revalidated; hashed assets cache forever</text>
<rect x="40.0" y="110.0" width="360.0" height="150.0" rx="3" fill="#ff5b2e" fill-opacity="0.08" stroke="#ff5b2e" stroke-width="1"/>
<text x="220.0" y="189.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="60.0" y="136.0" font-size="13" fill="#ff5b2e" text-anchor="start" font-weight="700">index.html</text>
<text x="60.0" y="162.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">Cache-Control: no-cache</text>
<text x="60.0" y="182.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">ETag: "a1b2"</text>
<text x="60.0" y="212.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">always revalidated (usually a 304)</text>
<text x="60.0" y="231.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">points to the current asset URLs</text>
<rect x="480.0" y="110.0" width="360.0" height="150.0" rx="3" fill="#5fb3a1" fill-opacity="0.08" stroke="#5fb3a1" stroke-width="1"/>
<text x="660.0" y="189.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="500.0" y="136.0" font-size="13" fill="#5fb3a1" text-anchor="start" font-weight="700">app.3f9c1e.js · styles.8d2a.css</text>
<text x="500.0" y="162.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">Cache-Control: public,</text>
<text x="500.0" y="182.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">  max-age=31536000, immutable</text>
<text x="500.0" y="212.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">content hash in the name</text>
<text x="500.0" y="231.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">new content → new URL</text>
<line x1="400.0" y1="185.0" x2="480.0" y2="185.0" stroke="#4a4136" stroke-width="1.4" marker-end="url(#ah0)"/>
<text x="440.0" y="176.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">&lt;script src&gt;</text>
<text x="40.0" y="300.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Deploy: upload new hashed assets first, then the new HTML. Old pages keep working with old assets;</text>
<text x="40.0" y="319.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">new pages get new ones. Nothing is ever purged, because a changed file is a different URL.</text>
</svg>
