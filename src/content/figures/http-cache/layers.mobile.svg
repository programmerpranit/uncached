<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 450" width="360" height="450" role="img" aria-label="A request passes the memory cache, HTTP disk cache, service worker and CDN before reaching the origin; private, public, s-maxage, no-store and Vary control which layers store it" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="450" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Cache layers</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">same headers, different scope</text>
<rect x="16.0" y="86.0" width="328.0" height="44.0" rx="6" fill="#9b8cff" fill-opacity="0.2" stroke="#9b8cff" stroke-width="1.2"/>
<text x="28.0" y="105.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="700">Memory cache</text>
<text x="28.0" y="122.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">this tab, this page load</text>
<rect x="16.0" y="138.0" width="328.0" height="44.0" rx="6" fill="#5fb3a1" fill-opacity="0.2" stroke="#5fb3a1" stroke-width="1.2"/>
<text x="28.0" y="157.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="700">HTTP disk cache</text>
<text x="28.0" y="174.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">private: one browser</text>
<rect x="16.0" y="190.0" width="328.0" height="44.0" rx="6" fill="#ff5b2e" fill-opacity="0.2" stroke="#ff5b2e" stroke-width="1.2"/>
<text x="28.0" y="209.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="700">Service worker</text>
<text x="28.0" y="226.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">your code decides</text>
<rect x="16.0" y="242.0" width="328.0" height="44.0" rx="6" fill="#e2b45a" fill-opacity="0.2" stroke="#e2b45a" stroke-width="1.2"/>
<text x="28.0" y="261.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="700">CDN / proxy</text>
<text x="28.0" y="278.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">shared: many users · s-maxage</text>
<rect x="16.0" y="294.0" width="328.0" height="44.0" rx="6" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1.2"/>
<text x="28.0" y="313.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="700">Origin</text>
<text x="28.0" y="330.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">source of truth</text>
<text x="16.0" y="360.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">private: browser only</text>
<text x="16.0" y="380.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">public / s-maxage: CDNs too</text>
<text x="16.0" y="400.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">no-store: never stored</text>
<text x="16.0" y="420.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">Vary: one copy per header value</text>
</svg>
