<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 434" width="360" height="434" role="img" aria-label="HTML is served with no-cache and an ETag so it is always revalidated, while content-hashed assets are cached for a year as immutable because changed content gets a new URL" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="434" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a4136"/></marker></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Cache policy by URL</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">HTML vs hashed assets</text>
<rect x="16.0" y="86.0" width="328.0" height="130.0" rx="8" fill="#ff5b2e" fill-opacity="0.08" stroke="#ff5b2e" stroke-width="1.2"/>
<text x="28.0" y="110.0" font-size="12.5" fill="#ff5b2e" text-anchor="start" font-weight="700">index.html</text>
<text x="28.0" y="134.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">Cache-Control: no-cache</text>
<text x="28.0" y="152.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">ETag: "a1b2"</text>
<text x="28.0" y="180.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">always revalidated (304)</text>
<text x="28.0" y="199.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">references current assets</text>
<line x1="180.0" y1="216.0" x2="180.0" y2="246.0" stroke="#4a4136" stroke-width="1.4" marker-end="url(#ah0)"/>
<rect x="16.0" y="246.0" width="328.0" height="130.0" rx="8" fill="#5fb3a1" fill-opacity="0.08" stroke="#5fb3a1" stroke-width="1.2"/>
<text x="28.0" y="270.0" font-size="12.5" fill="#5fb3a1" text-anchor="start" font-weight="700">app.3f9c1e.js</text>
<text x="28.0" y="294.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">max-age=31536000,</text>
<text x="28.0" y="312.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">immutable</text>
<text x="28.0" y="340.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">new content → new filename</text>
<text x="28.0" y="359.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">so it never needs purging</text>
<text x="16.0" y="404.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">Upload assets first, HTML last.</text>
</svg>
