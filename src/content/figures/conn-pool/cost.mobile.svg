<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 323" width="360" height="323" role="img" aria-label="Opening a new connection spends about 8 ms on TCP, TLS, authentication and backend fork before a 2 ms query; a pooled request just borrows a connection and runs the query" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="323" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Per-request vs pooled</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">one request, 2 ms query</text>
<text x="16.0" y="100.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="700">New connection  ≈10 ms</text>
<rect x="16.0" y="112.0" width="30.0" height="30.0" rx="3" fill="#a69d8e" fill-opacity="0.3" stroke="#a69d8e" stroke-width="1.1"/>
<text x="31.0" y="131.0" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="400">TCP</text>
<rect x="46.0" y="112.0" width="60.0" height="30.0" rx="3" fill="#e2b45a" fill-opacity="0.3" stroke="#e2b45a" stroke-width="1.1"/>
<text x="76.0" y="131.0" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="400">TLS</text>
<rect x="106.0" y="112.0" width="60.0" height="30.0" rx="3" fill="#9b8cff" fill-opacity="0.3" stroke="#9b8cff" stroke-width="1.1"/>
<text x="136.0" y="131.0" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="400">auth</text>
<rect x="166.0" y="112.0" width="90.0" height="30.0" rx="3" fill="#e5534b" fill-opacity="0.3" stroke="#e5534b" stroke-width="1.1"/>
<text x="211.0" y="131.0" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="400">fork</text>
<rect x="256.0" y="112.0" width="60.0" height="30.0" rx="3" fill="#7cc47f" fill-opacity="0.3" stroke="#7cc47f" stroke-width="1.1"/>
<text x="286.0" y="131.0" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="400">query</text>
<text x="16.0" y="172.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="700">Pooled  ≈2.1 ms</text>
<rect x="16.0" y="184.0" width="5.0" height="30.0" rx="3" fill="#5fb3a1" fill-opacity="0.3" stroke="#5fb3a1" stroke-width="1.1"/>
<rect x="21.0" y="184.0" width="60.0" height="30.0" rx="3" fill="#7cc47f" fill-opacity="0.3" stroke="#7cc47f" stroke-width="1.1"/>
<text x="51.0" y="203.0" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="400">query</text>
<rect x="16.0" y="234.0" width="12.0" height="12.0" rx="2" fill="#a69d8e" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="34.0" y="244.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">TCP</text>
<rect x="74.6" y="234.0" width="12.0" height="12.0" rx="2" fill="#e2b45a" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="92.6" y="244.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">TLS</text>
<rect x="133.2" y="234.0" width="12.0" height="12.0" rx="2" fill="#9b8cff" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="151.2" y="244.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">auth</text>
<rect x="198.0" y="234.0" width="12.0" height="12.0" rx="2" fill="#e5534b" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="216.0" y="244.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">fork</text>
<rect x="262.8" y="234.0" width="12.0" height="12.0" rx="2" fill="#7cc47f" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="280.8" y="244.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">query</text>
<text x="16.0" y="274.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">Setup dominates short requests.</text>
<text x="16.0" y="293.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">A pool pays it once.</text>
</svg>
