<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 384" width="360" height="384" role="img" aria-label="Forty app pods each with a pool of 20 open 800 client connections; PgBouncer in transaction mode multiplexes them onto 30 server connections, well under the PostgreSQL limit of 100" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="384" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5b2e"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Pools multiply</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">database sees instances × pool size</text>
<rect x="16.0" y="96.0" width="328.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="180.0" y="120.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">40 app pods × pool 20</text>
<line x1="180.0" y1="136.0" x2="180.0" y2="166.0" stroke="#ff5b2e" stroke-width="1.4" marker-end="url(#ah0)"/>
<text x="188.0" y="156.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">800 client conns</text>
<rect x="16.0" y="166.0" width="328.0" height="46.0" rx="3" fill="#5fb3a1" fill-opacity="0.22" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="186.0" font-size="12.5" fill="#ede6d8" text-anchor="middle" font-weight="600">PgBouncer</text>
<text x="180.0" y="202.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">transaction mode</text>
<line x1="180.0" y1="212.0" x2="180.0" y2="242.0" stroke="#5fb3a1" stroke-width="2.2" marker-end="url(#ah1)"/>
<text x="188.0" y="232.0" font-size="10.5" fill="#5fb3a1" text-anchor="start" font-weight="400">30 server conns</text>
<rect x="16.0" y="242.0" width="328.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="180.0" y="262.0" font-size="12.5" fill="#ede6d8" text-anchor="middle" font-weight="600">PostgreSQL</text>
<text x="180.0" y="278.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">max_connections = 100</text>
<text x="16.0" y="316.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">Without a proxy, 800 connections hit</text>
<text x="16.0" y="335.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">a limit of 100. A pooler holds a server</text>
<text x="16.0" y="354.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">connection only per transaction.</text>
</svg>
