<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 459" width="880" height="459" role="img" aria-label="Forty app pods each with a pool of 20 open 800 client connections; PgBouncer in transaction mode multiplexes them onto 30 server connections, well under the PostgreSQL limit of 100" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="459" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5b2e"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Pools multiply</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">every app instance has its own pool; the database sees the product</text>
<rect x="40.0" y="110.0" width="150.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="115.0" y="129.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">app pod 1</text>
<text x="115.0" y="145.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">pool = 20</text>
<rect x="40.0" y="172.0" width="150.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="115.0" y="191.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">app pod 2</text>
<text x="115.0" y="207.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">pool = 20</text>
<rect x="40.0" y="234.0" width="150.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="115.0" y="253.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">app pod 3</text>
<text x="115.0" y="269.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">pool = 20</text>
<rect x="40.0" y="296.0" width="150.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="115.0" y="315.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">app pod 4</text>
<text x="115.0" y="331.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">pool = 20</text>
<text x="115.0" y="370.0" font-size="13" fill="#ff5b2e" text-anchor="middle" font-weight="700">× 40 pods</text>
<rect x="340.0" y="170.0" width="170.0" height="110.0" rx="3" fill="#5fb3a1" fill-opacity="0.22" stroke="#5fb3a1" stroke-width="1"/>
<text x="425.0" y="222.0" font-size="13" fill="#ede6d8" text-anchor="middle" font-weight="600">PgBouncer</text>
<text x="425.0" y="238.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">transaction mode</text>
<line x1="190.0" y1="132.0" x2="340.0" y2="225.0" stroke="#ff5b2e" stroke-width="1.1" marker-end="url(#ah0)"/>
<line x1="190.0" y1="194.0" x2="340.0" y2="225.0" stroke="#ff5b2e" stroke-width="1.1" marker-end="url(#ah0)"/>
<line x1="190.0" y1="256.0" x2="340.0" y2="225.0" stroke="#ff5b2e" stroke-width="1.1" marker-end="url(#ah0)"/>
<line x1="190.0" y1="318.0" x2="340.0" y2="225.0" stroke="#ff5b2e" stroke-width="1.1" marker-end="url(#ah0)"/>
<text x="265.0" y="110.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">800 client conns</text>
<rect x="640.0" y="175.0" width="190.0" height="100.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="735.0" y="222.0" font-size="13" fill="#ede6d8" text-anchor="middle" font-weight="600">PostgreSQL</text>
<text x="735.0" y="238.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">max_connections = 100</text>
<line x1="510.0" y1="225.0" x2="640.0" y2="225.0" stroke="#5fb3a1" stroke-width="2.4" marker-end="url(#ah1)"/>
<text x="575.0" y="212.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="400">30 server conns</text>
<text x="40.0" y="410.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Without a proxy: 40 pods × 20 = 800 connections against a limit of 100, each a process with its</text>
<text x="40.0" y="429.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">own memory. A pooler multiplexes them onto a few server connections, held only per transaction.</text>
</svg>
