<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 399" width="880" height="399" role="img" aria-label="Webhook delivery pipeline: the domain write and an outbox row commit together, a dispatcher signs and POSTs to the customer endpoint, failures retry with exponential backoff and eventually land in a dead letter queue or disable the endpoint" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="399" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ede6d8"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Reliable webhook delivery</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">commit the event, then deliver asynchronously with retries</text>
<rect x="40.0" y="110.0" width="160.0" height="56.0" rx="3" fill="#ff5b2e" fill-opacity="0.15" stroke="#ff5b2e" stroke-width="1"/>
<text x="120.0" y="142.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Domain write</text>
<text x="120.0" y="186.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">+ outbox row</text>
<line x1="202.0" y1="138.0" x2="238.0" y2="138.0" stroke="#ede6d8" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="240.0" y="110.0" width="160.0" height="56.0" rx="3" fill="#5fb3a1" fill-opacity="0.15" stroke="#5fb3a1" stroke-width="1"/>
<text x="320.0" y="142.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Outbox / queue</text>
<text x="320.0" y="186.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">durable</text>
<line x1="402.0" y1="138.0" x2="438.0" y2="138.0" stroke="#ede6d8" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="440.0" y="110.0" width="160.0" height="56.0" rx="3" fill="#9b8cff" fill-opacity="0.15" stroke="#9b8cff" stroke-width="1"/>
<text x="520.0" y="142.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Dispatcher</text>
<text x="520.0" y="186.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">sign + POST</text>
<line x1="602.0" y1="138.0" x2="638.0" y2="138.0" stroke="#ede6d8" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="640.0" y="110.0" width="160.0" height="56.0" rx="3" fill="#7cc47f" fill-opacity="0.15" stroke="#7cc47f" stroke-width="1"/>
<text x="720.0" y="142.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Endpoint</text>
<text x="720.0" y="186.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">customer server</text>
<text x="40.0" y="236.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="700">On non-2xx or timeout: retry with exponential backoff + jitter</text>
<rect x="40.0" y="256.0" width="84.0" height="32.0" rx="3" fill="#e2b45a" fill-opacity="0.15" stroke="#e2b45a" stroke-width="1"/>
<text x="82.0" y="275.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">try 2</text>
<text x="82.0" y="304.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">+1m</text>
<line x1="126.0" y1="272.0" x2="150.0" y2="272.0" stroke="#a69d8e" stroke-width="1" marker-end="url(#ah1)"/>
<rect x="152.0" y="256.0" width="84.0" height="32.0" rx="3" fill="#e2b45a" fill-opacity="0.15" stroke="#e2b45a" stroke-width="1"/>
<text x="194.0" y="275.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">try 3</text>
<text x="194.0" y="304.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">+5m</text>
<line x1="238.0" y1="272.0" x2="262.0" y2="272.0" stroke="#a69d8e" stroke-width="1" marker-end="url(#ah1)"/>
<rect x="264.0" y="256.0" width="84.0" height="32.0" rx="3" fill="#e2b45a" fill-opacity="0.15" stroke="#e2b45a" stroke-width="1"/>
<text x="306.0" y="275.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">try 4</text>
<text x="306.0" y="304.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">+30m</text>
<line x1="350.0" y1="272.0" x2="374.0" y2="272.0" stroke="#a69d8e" stroke-width="1" marker-end="url(#ah1)"/>
<rect x="376.0" y="256.0" width="84.0" height="32.0" rx="3" fill="#e2b45a" fill-opacity="0.15" stroke="#e2b45a" stroke-width="1"/>
<text x="418.0" y="275.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">try 5</text>
<text x="418.0" y="304.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">+2h</text>
<line x1="462.0" y1="272.0" x2="486.0" y2="272.0" stroke="#a69d8e" stroke-width="1" marker-end="url(#ah1)"/>
<rect x="488.0" y="256.0" width="84.0" height="32.0" rx="3" fill="#e2b45a" fill-opacity="0.15" stroke="#e2b45a" stroke-width="1"/>
<text x="530.0" y="275.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">try 6</text>
<text x="530.0" y="304.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">+8h</text>
<line x1="574.0" y1="272.0" x2="598.0" y2="272.0" stroke="#a69d8e" stroke-width="1" marker-end="url(#ah1)"/>
<rect x="600.0" y="256.0" width="84.0" height="32.0" rx="3" fill="#e2b45a" fill-opacity="0.15" stroke="#e2b45a" stroke-width="1"/>
<text x="642.0" y="275.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">try 7</text>
<text x="642.0" y="304.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">+24h</text>
<rect x="720.0" y="256.0" width="120.0" height="32.0" rx="3" fill="#e5534b" fill-opacity="0.15" stroke="#e5534b" stroke-width="1"/>
<text x="780.0" y="275.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">DLQ / disable</text>
<text x="40.0" y="350.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Deliver at least once; consumers must deduplicate by event ID.</text>
<text x="40.0" y="369.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">After repeated failure, park events, alert the owner, and offer manual or API replay.</text>
</svg>
