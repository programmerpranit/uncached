<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img" aria-label="The sender computes an HMAC-SHA256 over the timestamp and raw body and sends both in headers; the receiver checks the timestamp window, recomputes the HMAC on raw bytes, compares in constant time and deduplicates by event ID" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="470" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Signature verification</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">HMAC(ts + body)</text>
<text x="16.0" y="96.0" font-size="12" fill="#ff5b2e" text-anchor="start" font-weight="700">Sender</text>
<rect x="16.0" y="108.0" width="328.0" height="30.0" rx="3" fill="#ff5b2e" fill-opacity="0.12" stroke="#ff5b2e" stroke-width="1"/>
<text x="180.0" y="126.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">payload = ts + "." + body</text>
<rect x="16.0" y="148.0" width="328.0" height="30.0" rx="3" fill="#ff5b2e" fill-opacity="0.12" stroke="#ff5b2e" stroke-width="1"/>
<text x="180.0" y="166.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">sig = HMAC(secret, payload)</text>
<rect x="16.0" y="188.0" width="328.0" height="30.0" rx="3" fill="#ff5b2e" fill-opacity="0.12" stroke="#ff5b2e" stroke-width="1"/>
<text x="180.0" y="206.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">send ts + sig headers</text>
<text x="16.0" y="248.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="700">Receiver</text>
<rect x="16.0" y="260.0" width="328.0" height="30.0" rx="3" fill="#5fb3a1" fill-opacity="0.12" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="278.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">1. timestamp within 5 min</text>
<rect x="16.0" y="300.0" width="328.0" height="30.0" rx="3" fill="#5fb3a1" fill-opacity="0.12" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="318.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">2. HMAC over raw bytes</text>
<rect x="16.0" y="340.0" width="328.0" height="30.0" rx="3" fill="#5fb3a1" fill-opacity="0.12" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="358.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">3. constant-time compare</text>
<rect x="16.0" y="380.0" width="328.0" height="30.0" rx="3" fill="#5fb3a1" fill-opacity="0.12" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="398.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">4. dedupe event ID</text>
<text x="16.0" y="440.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">Rotate: accept old + new secret.</text>
</svg>
