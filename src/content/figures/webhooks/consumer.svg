<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 379" width="880" height="379" role="img" aria-label="A consumer verifies the signature, inserts the event ID with a unique constraint, returns 200 within a second, and processes asynchronously by fetching the latest state, so duplicates and reordering are harmless" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="379" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ede6d8"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">A well-behaved consumer</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">acknowledge fast, process later, tolerate duplicates and reordering</text>
<rect x="40.0" y="120.0" width="140.0" height="48.0" rx="3" fill="#ff5b2e" fill-opacity="0.15" stroke="#ff5b2e" stroke-width="1"/>
<text x="110.0" y="148.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">POST /hooks</text>
<line x1="182.0" y1="144.0" x2="222.0" y2="144.0" stroke="#ede6d8" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="224.0" y="120.0" width="170.0" height="48.0" rx="3" fill="#5fb3a1" fill-opacity="0.15" stroke="#5fb3a1" stroke-width="1"/>
<text x="309.0" y="141.0" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">verify + insert</text>
<text x="309.0" y="157.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">event_id UNIQUE</text>
<line x1="396.0" y1="144.0" x2="436.0" y2="144.0" stroke="#ede6d8" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="438.0" y="120.0" width="120.0" height="48.0" rx="3" fill="#7cc47f" fill-opacity="0.15" stroke="#7cc47f" stroke-width="1"/>
<text x="498.0" y="141.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">200 OK</text>
<text x="498.0" y="157.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">&lt; 1 s</text>
<line x1="310.0" y1="170.0" x2="310.0" y2="220.0" stroke="#a69d8e" stroke-width="1" marker-end="url(#ah1)" stroke-dasharray="4,3"/>
<rect x="224.0" y="222.0" width="170.0" height="48.0" rx="3" fill="#9b8cff" fill-opacity="0.15" stroke="#9b8cff" stroke-width="1"/>
<text x="309.0" y="250.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">worker queue</text>
<line x1="396.0" y1="246.0" x2="436.0" y2="246.0" stroke="#ede6d8" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="438.0" y="222.0" width="180.0" height="48.0" rx="3" fill="#e2b45a" fill-opacity="0.15" stroke="#e2b45a" stroke-width="1"/>
<text x="528.0" y="243.0" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">fetch latest state</text>
<text x="528.0" y="259.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">GET /orders/123</text>
<text x="600.0" y="140.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">duplicate? → 200, skip</text>
<text x="40.0" y="330.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Events can arrive twice and out of order. Treat them as hints: re-read the current</text>
<text x="40.0" y="349.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">state from the provider's API, or compare a version/timestamp before applying.</text>
</svg>
