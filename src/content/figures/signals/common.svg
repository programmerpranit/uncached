<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 433" width="880" height="433" role="img" aria-label="Common Unix signals with their typical source and default action" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="433" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Signals you'll meet most</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">name, typical source and default action</text>
<rect x="40.0" y="82.0" width="800.0" height="28.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="56.0" y="101.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="700">SIGINT</text>
<text x="240.0" y="101.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">Ctrl-C in a terminal</text>
<text x="820.0" y="101.0" font-size="11.5" fill="#a69d8e" text-anchor="end" font-weight="400">terminate</text>
<rect x="40.0" y="116.0" width="800.0" height="28.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="56.0" y="135.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="700">SIGTERM</text>
<text x="240.0" y="135.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">kill, systemd stop, Kubernetes pod shutdown</text>
<text x="820.0" y="135.0" font-size="11.5" fill="#a69d8e" text-anchor="end" font-weight="400">terminate</text>
<rect x="40.0" y="150.0" width="800.0" height="28.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="56.0" y="169.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="700">SIGKILL</text>
<text x="240.0" y="169.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">kill -9, OOM killer</text>
<text x="820.0" y="169.0" font-size="11.5" fill="#e5534b" text-anchor="end" font-weight="400">terminate (uncatchable)</text>
<rect x="40.0" y="184.0" width="800.0" height="28.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="56.0" y="203.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="700">SIGHUP</text>
<text x="240.0" y="203.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">terminal closed; daemons: reload config</text>
<text x="820.0" y="203.0" font-size="11.5" fill="#a69d8e" text-anchor="end" font-weight="400">terminate</text>
<rect x="40.0" y="218.0" width="800.0" height="28.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="56.0" y="237.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="700">SIGSEGV / SIGBUS</text>
<text x="240.0" y="237.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">invalid memory access, mmap I/O error</text>
<text x="820.0" y="237.0" font-size="11.5" fill="#e5534b" text-anchor="end" font-weight="400">core dump</text>
<rect x="40.0" y="252.0" width="800.0" height="28.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="56.0" y="271.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="700">SIGPIPE</text>
<text x="240.0" y="271.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">write to a closed pipe or socket</text>
<text x="820.0" y="271.0" font-size="11.5" fill="#a69d8e" text-anchor="end" font-weight="400">terminate</text>
<rect x="40.0" y="286.0" width="800.0" height="28.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="56.0" y="305.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="700">SIGCHLD</text>
<text x="240.0" y="305.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">child exited or stopped</text>
<text x="820.0" y="305.0" font-size="11.5" fill="#a69d8e" text-anchor="end" font-weight="400">ignore</text>
<rect x="40.0" y="320.0" width="800.0" height="28.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="56.0" y="339.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="700">SIGUSR1/2</text>
<text x="240.0" y="339.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">application-defined</text>
<text x="820.0" y="339.0" font-size="11.5" fill="#a69d8e" text-anchor="end" font-weight="400">terminate</text>
<text x="40.0" y="384.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Servers usually ignore SIGPIPE (and handle EPIPE instead), turn SIGTERM into a graceful shutdown, and use SIGHUP</text>
<text x="40.0" y="403.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">or SIGUSR1 to reload config or reopen logs. Containers deliver SIGTERM to PID 1, then SIGKILL after a grace period.</text>
</svg>
