<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 432" width="880" height="432" role="img" aria-label="Steps of signal delivery from generation to handler execution and sigreturn" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="432" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a4136"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">How a signal is delivered</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">the kernel hijacks the thread's next return to user mode</text>
<circle cx="56.0" cy="100.0" r="11" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1.5"/>
<text x="56.0" y="104.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="700">1</text>
<text x="80.0" y="104.0" font-size="12.5" fill="#ede6d8" text-anchor="start" font-weight="700">generated</text>
<text x="280.0" y="104.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">kill(), Ctrl-C (SIGINT), child exit (SIGCHLD), bad memory access (SIGSEGV)</text>
<line x1="56.0" y1="112.0" x2="56.0" y2="130.0" stroke="#4a4136" stroke-width="1.2" marker-end="url(#ah0)"/>
<circle cx="56.0" cy="142.0" r="11" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1.5"/>
<text x="56.0" y="146.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="700">2</text>
<text x="80.0" y="146.0" font-size="12.5" fill="#e2b45a" text-anchor="start" font-weight="700">pending</text>
<text x="280.0" y="146.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">bit set in the thread or process pending mask (unless blocked)</text>
<line x1="56.0" y1="154.0" x2="56.0" y2="172.0" stroke="#4a4136" stroke-width="1.2" marker-end="url(#ah0)"/>
<circle cx="56.0" cy="184.0" r="11" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1.5"/>
<text x="56.0" y="188.0" font-size="11" fill="#9b8cff" text-anchor="middle" font-weight="700">3</text>
<text x="80.0" y="188.0" font-size="12.5" fill="#9b8cff" text-anchor="start" font-weight="700">return to user mode</text>
<text x="280.0" y="188.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">after a syscall, interrupt or timer tick, the kernel checks pending signals</text>
<line x1="56.0" y1="196.0" x2="56.0" y2="214.0" stroke="#4a4136" stroke-width="1.2" marker-end="url(#ah0)"/>
<circle cx="56.0" cy="226.0" r="11" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1.5"/>
<text x="56.0" y="230.0" font-size="11" fill="#e5534b" text-anchor="middle" font-weight="700">4</text>
<text x="80.0" y="230.0" font-size="12.5" fill="#e5534b" text-anchor="start" font-weight="700">handler frame</text>
<text x="280.0" y="230.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">kernel pushes a signal frame on the user stack, jumps to the handler</text>
<line x1="56.0" y1="238.0" x2="56.0" y2="256.0" stroke="#4a4136" stroke-width="1.2" marker-end="url(#ah0)"/>
<circle cx="56.0" cy="268.0" r="11" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1.5"/>
<text x="56.0" y="272.0" font-size="11" fill="#e5534b" text-anchor="middle" font-weight="700">5</text>
<text x="80.0" y="272.0" font-size="12.5" fill="#e5534b" text-anchor="start" font-weight="700">handler runs</text>
<text x="280.0" y="272.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">at any instruction of the interrupted code, mid-malloc, mid-printf…</text>
<line x1="56.0" y1="280.0" x2="56.0" y2="298.0" stroke="#4a4136" stroke-width="1.2" marker-end="url(#ah0)"/>
<circle cx="56.0" cy="310.0" r="11" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1.5"/>
<text x="56.0" y="314.0" font-size="11" fill="#7cc47f" text-anchor="middle" font-weight="700">6</text>
<text x="80.0" y="314.0" font-size="12.5" fill="#7cc47f" text-anchor="start" font-weight="700">sigreturn</text>
<text x="280.0" y="314.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">restore saved registers; interrupted code resumes (or syscall gets EINTR)</text>
<text x="40.0" y="364.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Without a handler, the default action applies: terminate, terminate with core dump, stop, continue, or ignore.</text>
<text x="40.0" y="383.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">SIGKILL and SIGSTOP can't be caught, blocked or ignored. Signals of the same type don't queue: two SIGCHLDs</text>
<text x="40.0" y="402.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">arriving while one is pending become one, so handlers must loop (e.g. waitpid in a loop).</text>
</svg>
