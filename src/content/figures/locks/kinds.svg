<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 379" width="880" height="379" role="img" aria-label="Comparison of mutex, semaphore and spinlock" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="379" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Three primitives, three ways to wait</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">who may enter, and what a waiting thread does</text>
<rect x="40.0" y="84.0" width="250.0" height="210.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="165.0" y="112.0" font-size="15" fill="#5fb3a1" text-anchor="middle" font-weight="700">mutex</text>
<text x="60.0" y="148.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">• one owner at a time</text>
<text x="60.0" y="172.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">• owner must unlock</text>
<text x="60.0" y="196.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">• waiters sleep</text>
<line x1="56.0" y1="232.0" x2="274.0" y2="232.0" stroke="#4a4136" stroke-width="1.3"/>
<text x="60.0" y="258.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">use for:</text>
<text x="60.0" y="278.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="400">protect shared data</text>
<rect x="320.0" y="84.0" width="250.0" height="210.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="445.0" y="112.0" font-size="15" fill="#e2b45a" text-anchor="middle" font-weight="700">semaphore</text>
<text x="340.0" y="148.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">• N permits (counter)</text>
<text x="340.0" y="172.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">• any thread can post</text>
<text x="340.0" y="196.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">• waiters sleep</text>
<line x1="336.0" y1="232.0" x2="554.0" y2="232.0" stroke="#4a4136" stroke-width="1.3"/>
<text x="340.0" y="258.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">use for:</text>
<text x="340.0" y="278.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="400">limit concurrency, signal</text>
<rect x="600.0" y="84.0" width="250.0" height="210.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<text x="725.0" y="112.0" font-size="15" fill="#e5534b" text-anchor="middle" font-weight="700">spinlock</text>
<text x="620.0" y="148.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">• one owner at a time</text>
<text x="620.0" y="172.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">• never sleeps</text>
<text x="620.0" y="196.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">• waiters busy-loop</text>
<line x1="616.0" y1="232.0" x2="834.0" y2="232.0" stroke="#4a4136" stroke-width="1.3"/>
<text x="620.0" y="258.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">use for:</text>
<text x="620.0" y="278.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="400">tiny sections, kernel, IRQs</text>
<text x="40.0" y="330.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">A mutex is a semaphore with one permit plus the rule that only the owner unlocks. A spinlock trades CPU for</text>
<text x="40.0" y="349.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">latency: if the holder will release within a few hundred nanoseconds, spinning beats sleeping and waking.</text>
</svg>
