<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 424" width="880" height="424" role="img" aria-label="Illustrative throughput of one global lock versus striped locks as threads increase" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="424" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Contention kills scaling: one global lock vs striped locks</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">throughput of a shared hash map as threads increase (illustrative)</text>
<line x1="90.0" y1="290.0" x2="730.0" y2="290.0" stroke="#4a4136" stroke-width="1.3"/>
<line x1="90.0" y1="290.0" x2="90.0" y2="100.0" stroke="#4a4136" stroke-width="1.3"/>
<path d="M90.0 281.0 L218.0 278.2 L346.0 279.1 L474.0 281.9 L602.0 283.7 L730.0 285.0" fill="none" stroke="#e5534b" stroke-width="2.2"/>
<circle cx="90.0" cy="281.0" r="3.2" fill="#e5534b" fill-opacity="1" stroke="none" stroke-width="1"/>
<circle cx="218.0" cy="278.2" r="3.2" fill="#e5534b" fill-opacity="1" stroke="none" stroke-width="1"/>
<circle cx="346.0" cy="279.1" r="3.2" fill="#e5534b" fill-opacity="1" stroke="none" stroke-width="1"/>
<circle cx="474.0" cy="281.9" r="3.2" fill="#e5534b" fill-opacity="1" stroke="none" stroke-width="1"/>
<circle cx="602.0" cy="283.7" r="3.2" fill="#e5534b" fill-opacity="1" stroke="none" stroke-width="1"/>
<circle cx="730.0" cy="285.0" r="3.2" fill="#e5534b" fill-opacity="1" stroke="none" stroke-width="1"/>
<path d="M90.0 281.0 L218.0 272.4 L346.0 255.6 L474.0 224.9 L602.0 172.4 L730.0 109.0" fill="none" stroke="#7cc47f" stroke-width="2.2"/>
<circle cx="90.0" cy="281.0" r="3.2" fill="#7cc47f" fill-opacity="1" stroke="none" stroke-width="1"/>
<circle cx="218.0" cy="272.4" r="3.2" fill="#7cc47f" fill-opacity="1" stroke="none" stroke-width="1"/>
<circle cx="346.0" cy="255.6" r="3.2" fill="#7cc47f" fill-opacity="1" stroke="none" stroke-width="1"/>
<circle cx="474.0" cy="224.9" r="3.2" fill="#7cc47f" fill-opacity="1" stroke="none" stroke-width="1"/>
<circle cx="602.0" cy="172.4" r="3.2" fill="#7cc47f" fill-opacity="1" stroke="none" stroke-width="1"/>
<circle cx="730.0" cy="109.0" r="3.2" fill="#7cc47f" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="90.0" y="308.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">1</text>
<text x="218.0" y="308.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">2</text>
<text x="346.0" y="308.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">4</text>
<text x="474.0" y="308.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">8</text>
<text x="602.0" y="308.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">16</text>
<text x="730.0" y="308.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">32</text>
<text x="410.0" y="326.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">threads</text>
<text x="724.0" y="99.0" font-size="11.5" fill="#7cc47f" text-anchor="end" font-weight="400">64 striped locks</text>
<text x="724.0" y="275.0" font-size="11.5" fill="#e5534b" text-anchor="end" font-weight="400">one global lock</text>
<text x="40.0" y="356.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">With one lock, threads queue and the cache line holding the lock bounces between cores, so adding threads</text>
<text x="40.0" y="375.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">can make things slower. Splitting state across many locks (Java's ConcurrentHashMap, sharded counters), or using</text>
<text x="40.0" y="394.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">read-mostly techniques (RW locks, RCU, seqlocks), lets independent operations proceed in parallel.</text>
</svg>
