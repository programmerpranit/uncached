<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 449" width="360" height="449" role="img" aria-label="Illustrative cost of spinning versus sleeping as lock hold time grows" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="449" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Spin or sleep?</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">cost vs hold time (illustrative)</text>
<line x1="46.0" y1="270.0" x2="336.0" y2="270.0" stroke="#4a4136" stroke-width="1.3"/>
<line x1="46.0" y1="270.0" x2="46.0" y2="100.0" stroke="#4a4136" stroke-width="1.3"/>
<path d="M46.0 270.0 L73.7 252.2 L104.0 232.6 L131.7 214.8 L162.0 195.2 L189.7 177.4 L220.0 157.8 L247.7 140.0 L278.0 120.4 L305.7 102.6 L336.0 100.0" fill="none" stroke="#e5534b" stroke-width="2.2"/>
<path d="M46.0 164.6 L336.0 147.6" fill="none" stroke="#5fb3a1" stroke-width="2.2"/>
<text x="46.0" y="288.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">10 ns</text>
<text x="162.0" y="288.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">1 µs</text>
<text x="278.0" y="288.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">100 µs</text>
<text x="191.0" y="306.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">how long the holder keeps the lock</text>
<line x1="209.5" y1="270.0" x2="209.5" y2="100.0" stroke="#e2b45a" stroke-width="1" stroke-dasharray="4 3"/>
<text x="203.5" y="112.0" font-size="11" fill="#e2b45a" text-anchor="end" font-weight="400">sleep/wake cost ≈</text>
<rect x="16.0" y="322.0" width="12.0" height="12.0" rx="2" fill="#e5534b" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="34.0" y="332.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">spin</text>
<rect x="106.0" y="322.0" width="12.0" height="12.0" rx="2" fill="#5fb3a1" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="124.0" y="332.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">sleep</text>
<text x="16.0" y="362.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Spin for short holds, sleep for long</text>
<text x="16.0" y="381.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">ones. Adaptive mutexes spin about</text>
<text x="16.0" y="400.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">as long as a context switch costs,</text>
<text x="16.0" y="419.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">then sleep.</text>
</svg>
