<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="Token bucket: tokens refill at a fixed rate up to a capacity; each request takes one" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="400" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2b45a"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Token bucket</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">capacity b, refilled at r tokens/second</text>
<rect x="60.0" y="90.0" width="180.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="150.0" y="116.3" font-size="12" fill="#5fb3a1" text-anchor="middle" font-weight="600">refill: r = 10/s</text>
<line x1="150.0" y1="136.0" x2="150.0" y2="170.0" stroke="#5fb3a1" stroke-width="1.5" marker-end="url(#ah0)"/>
<path d="M90 175 L90 330 Q90 345 105 345 L195 345 Q210 345 210 330 L210 175" fill="none" stroke="#ede6d8" stroke-width="2"/>
<circle cx="118.0" cy="330.0" r="11" fill="#e2b45a" fill-opacity="1" stroke="none" stroke-width="1"/>
<circle cx="150.0" cy="330.0" r="11" fill="#e2b45a" fill-opacity="1" stroke="none" stroke-width="1"/>
<circle cx="182.0" cy="330.0" r="11" fill="#e2b45a" fill-opacity="1" stroke="none" stroke-width="1"/>
<circle cx="118.0" cy="300.0" r="11" fill="#e2b45a" fill-opacity="1" stroke="none" stroke-width="1"/>
<circle cx="150.0" cy="300.0" r="11" fill="#e2b45a" fill-opacity="1" stroke="none" stroke-width="1"/>
<circle cx="182.0" cy="300.0" r="11" fill="#e2b45a" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="150.0" y="370.0" font-size="12" fill="#a69d8e" text-anchor="middle" font-weight="400">b = 10 tokens max</text>
<rect x="400.0" y="200.0" width="150.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="475.0" y="228.7" font-size="13" fill="#ede6d8" text-anchor="middle" font-weight="600">request</text>
<line x1="552.0" y1="224.0" x2="640.0" y2="224.0" stroke="#a69d8e" stroke-width="1.3" marker-end="url(#ah1)"/>
<line x1="398.0" y1="224.0" x2="214.0" y2="260.0" stroke="#e2b45a" stroke-width="1.3" marker-end="url(#ah2)"/>
<text x="300.0" y="228.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="400">take 1 token</text>
<rect x="645.0" y="160.0" width="190.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="740.0" y="186.1" font-size="11.5" fill="#7cc47f" text-anchor="middle" font-weight="600">token available → allow</text>
<rect x="645.0" y="250.0" width="190.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<text x="740.0" y="276.1" font-size="11.5" fill="#e5534b" text-anchor="middle" font-weight="600">bucket empty → 429</text>
<text x="400.0" y="330.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Bursts up to b pass instantly;</text>
<text x="400.0" y="349.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">sustained rate is capped at r.</text>
</svg>
