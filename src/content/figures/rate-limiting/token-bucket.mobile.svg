<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 495" width="360" height="495" role="img" aria-label="Token bucket: tokens refill at a fixed rate up to a capacity; each request takes one" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="495" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Token bucket</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">capacity b, refilled at r tokens/second</text>
<rect x="16.0" y="70.0" width="160.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="96.0" y="94.3" font-size="12" fill="#5fb3a1" text-anchor="middle" font-weight="600">refill r = 10/s</text>
<line x1="96.0" y1="112.0" x2="96.0" y2="138.0" stroke="#5fb3a1" stroke-width="1.5" marker-end="url(#ah0)"/>
<path d="M40 142 L40 270 Q40 282 52 282 L140 282 Q152 282 152 270 L152 142" fill="none" stroke="#ede6d8" stroke-width="2"/>
<circle cx="66.0" cy="266.0" r="10" fill="#e2b45a" fill-opacity="1" stroke="none" stroke-width="1"/>
<circle cx="96.0" cy="266.0" r="10" fill="#e2b45a" fill-opacity="1" stroke="none" stroke-width="1"/>
<circle cx="126.0" cy="266.0" r="10" fill="#e2b45a" fill-opacity="1" stroke="none" stroke-width="1"/>
<circle cx="66.0" cy="238.0" r="10" fill="#e2b45a" fill-opacity="1" stroke="none" stroke-width="1"/>
<circle cx="96.0" cy="238.0" r="10" fill="#e2b45a" fill-opacity="1" stroke="none" stroke-width="1"/>
<circle cx="126.0" cy="238.0" r="10" fill="#e2b45a" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="96.0" y="302.0" font-size="12" fill="#a69d8e" text-anchor="middle" font-weight="400">b = 10 max</text>
<rect x="200.0" y="150.0" width="144.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="272.0" y="174.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">request</text>
<text x="272.0" y="212.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="400">takes 1 token</text>
<rect x="16.0" y="330.0" width="328.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="180.0" y="354.3" font-size="12" fill="#7cc47f" text-anchor="middle" font-weight="600">token available → allow</text>
<rect x="16.0" y="380.0" width="328.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<text x="180.0" y="404.3" font-size="12" fill="#e5534b" text-anchor="middle" font-weight="600">bucket empty → 429</text>
<text x="16.0" y="446.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Bursts up to b pass instantly;</text>
<text x="16.0" y="465.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">sustained rate is capped at r.</text>
</svg>
