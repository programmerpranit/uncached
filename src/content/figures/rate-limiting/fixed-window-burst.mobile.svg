<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" width="360" height="320" role="img" aria-label="A fixed window lets up to twice the limit through around a window boundary" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="320" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Fixed window: the boundary burst</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">limit 100 requests per minute</text>
<line x1="16.0" y1="150.0" x2="344.0" y2="150.0" stroke="#4a4136" stroke-width="2"/>
<line x1="16.0" y1="124.0" x2="16.0" y2="160.0" stroke="#a69d8e" stroke-width="1"/>
<text x="16.0" y="178.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">12:00</text>
<line x1="180.0" y1="124.0" x2="180.0" y2="160.0" stroke="#a69d8e" stroke-width="1"/>
<text x="180.0" y="178.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">12:01</text>
<line x1="344.0" y1="124.0" x2="344.0" y2="160.0" stroke="#a69d8e" stroke-width="1"/>
<text x="344.0" y="178.0" font-size="11" fill="#a69d8e" text-anchor="end" font-weight="400">12:02</text>
<rect x="140.0" y="90.0" width="38.0" height="58.0" rx="3" fill="#ff5b2e" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="160.0" y="82.0" font-size="12" fill="#ff5b2e" text-anchor="middle" font-weight="700">100</text>
<rect x="182.0" y="90.0" width="38.0" height="58.0" rx="3" fill="#ff5b2e" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="200.0" y="82.0" font-size="12" fill="#ff5b2e" text-anchor="middle" font-weight="700">100</text>
<path d="M157.04 198 L202.95999999999998 198" fill="none" stroke="#e2b45a" stroke-width="2"/>
<text x="180.0" y="218.0" font-size="12" fill="#e2b45a" text-anchor="middle" font-weight="600">200 requests in ~10 seconds</text>
<text x="16.0" y="252.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Both windows are under the limit, so</text>
<text x="16.0" y="271.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">everything passes, but the backend</text>
<text x="16.0" y="290.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">sees 2× the limit at the boundary.</text>
</svg>
