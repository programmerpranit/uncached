<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 356" width="880" height="356" role="img" aria-label="A hung dependency exhausts the caller thread pool and takes down healthy features" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
