<text x="260.0" y="212.0" font-size="11" fill="#e5534b" text-anchor="start" font-weight="400">threads: 190 stuck waiting</text>
<text x="40.0" y="260.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">1. Recommendations slows down. Calls to it hold API threads for the full timeout.</text>
<text x="40.0" y="282.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">2. At 100 req/s × 30 s, all 200 threads are waiting within seconds.</text>
<text x="40.0" y="304.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="400">3. Payments and search calls queue behind them, so the whole API times out.</text>
<text x="40.0" y="326.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="400">4. Users retry, adding load. Upstream services now fail the same way.</text>
