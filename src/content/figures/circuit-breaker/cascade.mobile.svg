<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 426" width="360" height="426" role="img" aria-label="A hung dependency exhausts the caller thread pool and takes down healthy features" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="426" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">A cascading failure</text>
<rect x="16.0" y="72.0" width="328.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="180.0" y="99.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">API service (200 threads)</text>
<rect x="16.0" y="134.0" width="328.0" height="36.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="180.0" y="156.3" font-size="12" fill="#7cc47f" text-anchor="middle" font-weight="600">payments  5 ms</text>
<rect x="16.0" y="178.0" width="328.0" height="36.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="180.0" y="200.3" font-size="12" fill="#7cc47f" text-anchor="middle" font-weight="600">search  20 ms</text>
<rect x="16.0" y="222.0" width="328.0" height="36.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<text x="180.0" y="244.3" font-size="12" fill="#e5534b" text-anchor="middle" font-weight="600">recommendations  hung</text>
