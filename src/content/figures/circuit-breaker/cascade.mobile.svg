<text x="16.0" y="316.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">1. One dependency hangs.</text>
<text x="16.0" y="336.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">2. Its calls hold threads for 30 s.</text>
<text x="16.0" y="356.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="400">3. All 200 threads are soon stuck.</text>
<text x="16.0" y="376.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="400">4. Healthy calls fail too.</text>
<text x="16.0" y="396.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="400">5. Retries add more load.</text>
</svg>
