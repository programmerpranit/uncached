<text x="440.0" y="369.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="600">own backend (BFF)</text>
<line x1="712.0" y1="154.0" x2="712.0" y2="176.0" stroke="#a69d8e" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="584.0" y="180.0" width="256.0" height="214.0" rx="8" fill="#9b8cff" fill-opacity="0.08" stroke="#9b8cff" stroke-width="1.3"/>
<text x="600.0" y="206.0" font-size="13" fill="#9b8cff" text-anchor="start" font-weight="700">Checkout team</text>
<rect x="600.0" y="222.0" width="224.0" height="34.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="712.0" y="243.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">UI: cart + payment</text>
<rect x="600.0" y="264.0" width="224.0" height="34.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="712.0" y="285.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">own repo + CI/CD</text>
<rect x="600.0" y="306.0" width="224.0" height="34.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="712.0" y="327.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">own release cadence</text>
<rect x="600.0" y="348.0" width="224.0" height="34.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="712.0" y="369.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="600">own backend (BFF)</text>
<text x="40.0" y="428.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Split by business domain, not by technical layer. Each slice goes from UI to database and is owned by one team.</text>
<text x="40.0" y="447.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">The shell composes them at runtime; a deploy by one team does not require the others to rebuild.</text>
