<text x="440.0" y="285.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">own repo + CI/CD</text>
<rect x="328.0" y="306.0" width="224.0" height="34.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
