<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 479" width="880" height="479" role="img" aria-label="A host loads remoteEntry files from independently deployed remotes, negotiates shared library versions, and renders exposed components" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="479" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b8cff"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Module federation at runtime</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">the host loads remote modules and negotiates shared libraries</text>
<rect x="40.0" y="96.0" width="330.0" height="300.0" rx="8" fill="#ff5b2e" fill-opacity="0.08" stroke="#ff5b2e" stroke-width="1.3"/>
<text x="56.0" y="122.0" font-size="13" fill="#ff5b2e" text-anchor="start" font-weight="700">host (shell) in the browser</text>
<text x="56.0" y="150.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">import("checkout/Cart")</text>
<rect x="56.0" y="170.0" width="298.0" height="100.0" rx="6" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="70.0" y="192.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">shared scope</text>
<text x="70.0" y="216.0" font-size="11" fill="#7cc47f" text-anchor="start" font-weight="400">react 18.3.1  singleton ✓</text>
<text x="70.0" y="236.0" font-size="11" fill="#7cc47f" text-anchor="start" font-weight="400">react-dom 18.3.1  singleton ✓</text>
<text x="70.0" y="258.0" font-size="11" fill="#e2b45a" text-anchor="start" font-weight="400">date-fns 3.x / 2.x  both loaded</text>
<text x="56.0" y="296.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">1. fetch remoteEntry.js</text>
<text x="56.0" y="314.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">2. agree which shared versions to use</text>
<text x="56.0" y="332.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">3. load only the chunks needed</text>
<text x="56.0" y="350.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">4. render &lt;Cart/&gt; inside host tree</text>
<rect x="500.0" y="110.0" width="340.0" height="132.0" rx="8" fill="#9b8cff" fill-opacity="0.08" stroke="#9b8cff" stroke-width="1.3"/>
<text x="516.0" y="134.0" font-size="13" fill="#9b8cff" text-anchor="start" font-weight="700">remote: checkout</text>
<text x="516.0" y="154.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">cdn.shop/checkout/remoteEntry.js</text>
<text x="516.0" y="182.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">exposes: ./Cart, ./MiniCart</text>
<text x="516.0" y="200.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">shares: react, react-dom</text>
<text x="516.0" y="218.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">deployed by its own team</text>
<rect x="500.0" y="264.0" width="340.0" height="132.0" rx="8" fill="#5fb3a1" fill-opacity="0.08" stroke="#5fb3a1" stroke-width="1.3"/>
<text x="516.0" y="288.0" font-size="13" fill="#5fb3a1" text-anchor="start" font-weight="700">remote: product</text>
<text x="516.0" y="308.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">cdn.shop/product/remoteEntry.js</text>
<text x="516.0" y="336.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">exposes: ./Gallery, ./Reviews</text>
<text x="516.0" y="354.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">shares: react, react-dom</text>
<text x="516.0" y="372.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">deployed by its own team</text>
<line x1="372.0" y1="160.0" x2="496.0" y2="160.0" stroke="#9b8cff" stroke-width="1.4" marker-end="url(#ah0)"/>
<text x="434.0" y="152.0" font-size="10.5" fill="#9b8cff" text-anchor="middle" font-weight="400">load</text>
<line x1="372.0" y1="320.0" x2="496.0" y2="320.0" stroke="#5fb3a1" stroke-width="1.4" marker-end="url(#ah1)" stroke-dasharray="4 3"/>
<text x="434.0" y="312.0" font-size="10.5" fill="#5fb3a1" text-anchor="middle" font-weight="400">lazy</text>
<text x="40.0" y="430.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">The host knows only a URL per remote. A remote team can redeploy, and the next page load picks up the new code.</text>
<text x="40.0" y="449.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Shared singletons such as React must be compatible, or two copies load and hooks and context break.</text>
</svg>
