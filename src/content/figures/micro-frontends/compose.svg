<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 426" width="880" height="426" role="img" aria-label="Four places to compose micro-frontends: build-time packages, server or edge includes, runtime loading in the browser, and iframes, with their trade-offs" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="426" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Where the pieces are put together</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">build time, on the server or edge, or in the browser</text>
<rect x="40.0" y="96.0" width="190.0" height="250.0" rx="8" fill="#e2b45a" fill-opacity="0.08" stroke="#e2b45a" stroke-width="1.3"/>
<text x="54.0" y="122.0" font-size="13" fill="#e2b45a" text-anchor="start" font-weight="700">Build time</text>
<text x="54.0" y="142.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">npm packages</text>
<text x="54.0" y="178.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">each MFE is a package</text>
<text x="54.0" y="195.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">host installs + bundles</text>
<text x="54.0" y="244.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">+ simple, type-safe</text>
<text x="54.0" y="261.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">+ one optimized bundle</text>
<text x="54.0" y="278.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">– host must rebuild</text>
<text x="54.0" y="295.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">  for every change</text>
<rect x="244.0" y="96.0" width="190.0" height="250.0" rx="8" fill="#5fb3a1" fill-opacity="0.08" stroke="#5fb3a1" stroke-width="1.3"/>
<text x="258.0" y="122.0" font-size="13" fill="#5fb3a1" text-anchor="start" font-weight="700">Server / edge</text>
<text x="258.0" y="142.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">SSI, ESI, fragments</text>
<text x="258.0" y="178.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">server stitches HTML</text>
<text x="258.0" y="195.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">from several services</text>
<text x="258.0" y="244.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">+ fast first paint</text>
<text x="258.0" y="261.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">+ good for SEO</text>
<text x="258.0" y="278.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">– client interactivity</text>
<text x="258.0" y="295.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">  and state are harder</text>
<rect x="448.0" y="96.0" width="190.0" height="250.0" rx="8" fill="#9b8cff" fill-opacity="0.08" stroke="#9b8cff" stroke-width="1.3"/>
<text x="462.0" y="122.0" font-size="13" fill="#9b8cff" text-anchor="start" font-weight="700">Runtime (browser)</text>
<text x="462.0" y="142.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">federation, import maps</text>
<text x="462.0" y="178.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">host loads remote JS</text>
<text x="462.0" y="195.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">at runtime by URL</text>
<text x="462.0" y="244.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">+ independent deploys</text>
<text x="462.0" y="261.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">– version drift</text>
<text x="462.0" y="278.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">– runtime load failures</text>
<text x="462.0" y="295.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">– more JS shipped</text>
<rect x="652.0" y="96.0" width="190.0" height="250.0" rx="8" fill="#d77fa1" fill-opacity="0.08" stroke="#d77fa1" stroke-width="1.3"/>
<text x="666.0" y="122.0" font-size="13" fill="#d77fa1" text-anchor="start" font-weight="700">iframes</text>
<text x="666.0" y="142.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">full isolation</text>
<text x="666.0" y="178.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">each MFE in its own</text>
<text x="666.0" y="195.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">browsing context</text>
<text x="666.0" y="244.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">+ strongest isolation</text>
<text x="666.0" y="261.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">– sizing and routing</text>
<text x="666.0" y="278.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">– accessibility</text>
<text x="666.0" y="295.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">– duplicate downloads</text>
<line x1="40.0" y1="376.0" x2="840.0" y2="376.0" stroke="#a69d8e" stroke-width="1.3" marker-end="url(#ah0)"/>
<text x="40.0" y="396.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">more coupled, simpler</text>
<text x="840.0" y="396.0" font-size="11" fill="#a69d8e" text-anchor="end" font-weight="400">more independent, more moving parts</text>
</svg>
