<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 338" width="880" height="338" role="img" aria-label="A poison message m3 blocks messages m4 to m6 when there is no retry limit; with a maximum attempt count it moves to a dead-letter queue and the rest are processed" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="338" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e5534b"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">A poison message</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">without a limit, one message that always fails blocks everything behind it</text>
<text x="40.0" y="100.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="700">No retry limit (ordered queue / partition)</text>
<rect x="40.0" y="110.0" width="64.0" height="30.0" rx="3" fill="#7cc47f" fill-opacity="0.2" stroke="#7cc47f" stroke-width="1"/>
<text x="72.0" y="128.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">m1</text>
<rect x="110.0" y="110.0" width="64.0" height="30.0" rx="3" fill="#7cc47f" fill-opacity="0.2" stroke="#7cc47f" stroke-width="1"/>
<text x="142.0" y="128.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">m2</text>
<rect x="180.0" y="110.0" width="64.0" height="30.0" rx="3" fill="#e5534b" fill-opacity="0.2" stroke="#e5534b" stroke-width="1"/>
<text x="212.0" y="128.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">m3 ☠</text>
<rect x="250.0" y="110.0" width="64.0" height="30.0" rx="3" fill="#a69d8e" fill-opacity="0.2" stroke="#a69d8e" stroke-width="1"/>
<text x="282.0" y="128.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">m4</text>
<rect x="320.0" y="110.0" width="64.0" height="30.0" rx="3" fill="#a69d8e" fill-opacity="0.2" stroke="#a69d8e" stroke-width="1"/>
<text x="352.0" y="128.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">m5</text>
<rect x="390.0" y="110.0" width="64.0" height="30.0" rx="3" fill="#a69d8e" fill-opacity="0.2" stroke="#a69d8e" stroke-width="1"/>
<text x="422.0" y="128.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">m6</text>
<text x="40.0" y="168.0" font-size="10" fill="#e5534b" text-anchor="start" font-weight="400">m3 fails forever; m4–m6 wait; consumer lag grows</text>
<path d="M200,140 C200,154 226,154 226,143" fill="none" stroke="#e5534b" stroke-width="1.3" marker-end="url(#ah0)"/>
<text x="40.0" y="240.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="700">With max attempts + DLQ</text>
<rect x="40.0" y="250.0" width="64.0" height="30.0" rx="3" fill="#7cc47f" fill-opacity="0.2" stroke="#7cc47f" stroke-width="1"/>
<text x="72.0" y="268.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">m1</text>
<rect x="110.0" y="250.0" width="64.0" height="30.0" rx="3" fill="#7cc47f" fill-opacity="0.2" stroke="#7cc47f" stroke-width="1"/>
<text x="142.0" y="268.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">m2</text>
<rect x="180.0" y="250.0" width="64.0" height="30.0" rx="3" fill="#e5534b" fill-opacity="0.2" stroke="#e5534b" stroke-width="1"/>
<text x="212.0" y="268.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">m3 ☠</text>
<rect x="250.0" y="250.0" width="64.0" height="30.0" rx="3" fill="#5fb3a1" fill-opacity="0.2" stroke="#5fb3a1" stroke-width="1"/>
<text x="282.0" y="268.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">m4</text>
<rect x="320.0" y="250.0" width="64.0" height="30.0" rx="3" fill="#5fb3a1" fill-opacity="0.2" stroke="#5fb3a1" stroke-width="1"/>
<text x="352.0" y="268.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">m5</text>
<rect x="390.0" y="250.0" width="64.0" height="30.0" rx="3" fill="#5fb3a1" fill-opacity="0.2" stroke="#5fb3a1" stroke-width="1"/>
<text x="422.0" y="268.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">m6</text>
<text x="40.0" y="308.0" font-size="10" fill="#7cc47f" text-anchor="start" font-weight="400">m3 moves aside after 3 attempts; m4–m6 flow</text>
<rect x="520.0" y="240.0" width="120.0" height="40.0" rx="3" fill="#e5534b" fill-opacity="0.18" stroke="#e5534b" stroke-width="1"/>
<text x="580.0" y="263.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">DLQ: m3</text>
<path d="M212,250 C212,222 500,222 540,238" fill="none" stroke="#e5534b" stroke-width="1.2" marker-end="url(#ah0)" stroke-dasharray="4,3"/>
<rect x="680.0" y="100.0" width="170.0" height="180.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="765.0" y="193.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="694.0" y="124.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">Poison message =</text>
<text x="694.0" y="141.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">one that can never</text>
<text x="694.0" y="158.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">succeed:</text>
<text x="694.0" y="192.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">• malformed JSON</text>
<text x="694.0" y="209.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">• schema mismatch</text>
<text x="694.0" y="226.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">• missing reference</text>
<text x="694.0" y="243.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">• code bug on input</text>
</svg>
