<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 459" width="880" height="459" role="img" aria-label="Five resolvers each call load with one id; DataLoader deduplicates them and sends one query with id IN (3, 5, 7, 12)" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="459" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5b2e"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7cc47f"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">DataLoader: collect, then batch</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">resolvers ask for one key each; the loader sends one query per tick</text>
<rect x="40.0" y="104.0" width="140.0" height="36.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="110.0" y="126.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">load(7)</text>
<line x1="180.0" y1="122.0" x2="330.0" y2="215.0" stroke="#ff5b2e" stroke-width="1.1" marker-end="url(#ah0)"/>
<rect x="40.0" y="154.0" width="140.0" height="36.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="110.0" y="176.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">load(3)</text>
<line x1="180.0" y1="172.0" x2="330.0" y2="215.0" stroke="#ff5b2e" stroke-width="1.1" marker-end="url(#ah0)"/>
<rect x="40.0" y="204.0" width="140.0" height="36.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="110.0" y="226.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">load(7)</text>
<line x1="180.0" y1="222.0" x2="330.0" y2="215.0" stroke="#ff5b2e" stroke-width="1.1" marker-end="url(#ah0)"/>
<rect x="40.0" y="254.0" width="140.0" height="36.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="110.0" y="276.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">load(12)</text>
<line x1="180.0" y1="272.0" x2="330.0" y2="215.0" stroke="#ff5b2e" stroke-width="1.1" marker-end="url(#ah0)"/>
<rect x="40.0" y="304.0" width="140.0" height="36.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="110.0" y="326.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">load(5)</text>
<line x1="180.0" y1="322.0" x2="330.0" y2="215.0" stroke="#ff5b2e" stroke-width="1.1" marker-end="url(#ah0)"/>
<text x="110.0" y="370.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">Post.author resolvers</text>
<rect x="330.0" y="170.0" width="200.0" height="90.0" rx="3" fill="#ff5b2e" fill-opacity="0.22" stroke="#ff5b2e" stroke-width="1"/>
<text x="430.0" y="212.0" font-size="13" fill="#ede6d8" text-anchor="middle" font-weight="600">DataLoader</text>
<text x="430.0" y="228.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">dedupe + wait one tick</text>
<rect x="620.0" y="170.0" width="220.0" height="90.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="730.0" y="212.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">SELECT … WHERE</text>
<text x="730.0" y="228.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">id IN (3, 5, 7, 12)</text>
<line x1="530.0" y1="215.0" x2="620.0" y2="215.0" stroke="#7cc47f" stroke-width="2" marker-end="url(#ah1)"/>
<text x="575.0" y="202.0" font-size="11" fill="#7cc47f" text-anchor="middle" font-weight="400">1 query</text>
<text x="40.0" y="410.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Each resolver calls load(id) and gets a promise. The loader waits until the current tick ends, removes</text>
<text x="40.0" y="429.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">duplicates, issues one batched query, and resolves every promise from the result. It also caches per request.</text>
</svg>
