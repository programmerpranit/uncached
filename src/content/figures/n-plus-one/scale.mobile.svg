<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 405" width="360" height="405" role="img" aria-label="N+1 latency grows linearly with the number of rows, reaching about 240 ms at 200 rows, while batched and joined queries stay nearly flat" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="405" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Latency vs rows on the page</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">1 ms round trip (illustrative)</text>
<line x1="58.0" y1="296.0" x2="338.0" y2="296.0" stroke="#4a4136" stroke-width="1"/>
<line x1="58.0" y1="96.0" x2="58.0" y2="296.0" stroke="#4a4136" stroke-width="1"/>
<path d="M58.0,295.0 L338.0,103.2" fill="none" stroke="#e5534b" stroke-width="2.4"/>
<path d="M58.0,294.1 L338.0,291.2" fill="none" stroke="#e2b45a" stroke-width="2.4"/>
<path d="M58.0,295.0 L338.0,293.6" fill="none" stroke="#7cc47f" stroke-width="2.4" stroke-dasharray="6 4"/>
<text x="58.0" y="314.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">0</text>
<text x="128.0" y="314.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">50</text>
<text x="198.0" y="314.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">100</text>
<text x="268.0" y="314.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">150</text>
<text x="338.0" y="314.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">200</text>
<text x="50.0" y="300.0" font-size="10.5" fill="#a69d8e" text-anchor="end" font-weight="400">0 ms</text>
<text x="50.0" y="220.0" font-size="10.5" fill="#a69d8e" text-anchor="end" font-weight="400">100 ms</text>
<text x="50.0" y="140.0" font-size="10.5" fill="#a69d8e" text-anchor="end" font-weight="400">200 ms</text>
<text x="198.0" y="334.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">rows (N)</text>
<text x="226.0" y="160.0" font-size="11.5" fill="#e5534b" text-anchor="end" font-weight="400">N+1</text>
<text x="338.0" y="279.2" font-size="11" fill="#7cc47f" text-anchor="end" font-weight="400">batched / join</text>
<text x="16.0" y="356.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">Invisible with 3 rows on localhost,</text>
<text x="16.0" y="375.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">painful with 200 rows over a network.</text>
</svg>
