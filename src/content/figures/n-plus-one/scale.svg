<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 449" width="880" height="449" role="img" aria-label="N+1 latency grows linearly with the number of rows, reaching about 240 ms at 200 rows, while batched and joined queries stay nearly flat" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="449" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Latency vs rows on the page</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">1 ms round trip, 0.2 ms per query execution (illustrative)</text>
<line x1="90.0" y1="330.0" x2="770.0" y2="330.0" stroke="#4a4136" stroke-width="1"/>
<line x1="90.0" y1="100.0" x2="90.0" y2="330.0" stroke="#4a4136" stroke-width="1"/>
<path d="M90.0,328.9 L770.0,108.3" fill="none" stroke="#e5534b" stroke-width="2.4"/>
<path d="M90.0,327.8 L770.0,324.5" fill="none" stroke="#e2b45a" stroke-width="2.4"/>
<path d="M90.0,328.8 L770.0,327.2" fill="none" stroke="#7cc47f" stroke-width="2.4" stroke-dasharray="6 4"/>
<text x="90.0" y="348.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">0</text>
<text x="260.0" y="348.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">50</text>
<text x="430.0" y="348.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">100</text>
<text x="600.0" y="348.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">150</text>
<text x="770.0" y="348.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">200</text>
<text x="82.0" y="334.0" font-size="10.5" fill="#a69d8e" text-anchor="end" font-weight="400">0 ms</text>
<text x="82.0" y="242.0" font-size="10.5" fill="#a69d8e" text-anchor="end" font-weight="400">100 ms</text>
<text x="82.0" y="150.0" font-size="10.5" fill="#a69d8e" text-anchor="end" font-weight="400">200 ms</text>
<text x="430.0" y="368.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">rows (N)</text>
<text x="600.0" y="155.2" font-size="12" fill="#e5534b" text-anchor="end" font-weight="400">N+1: grows linearly</text>
<text x="770.0" y="310.5" font-size="12" fill="#7cc47f" text-anchor="end" font-weight="400">batched / join: nearly flat</text>
<text x="40.0" y="400.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">In development, N is 3 and the database is on localhost, so N+1 looks free. In production, N is 200</text>
<text x="40.0" y="419.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">and every round trip crosses the network.</text>
</svg>
