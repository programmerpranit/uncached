<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 374" width="360" height="374" role="img" aria-label="Five resolvers each call load with one id; DataLoader deduplicates them and sends one query with id IN (3, 5, 7, 12)" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="374" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5b2e"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7cc47f"/></marker></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">DataLoader: collect, then batch</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">one query per tick</text>
<rect x="16.0" y="96.0" width="328.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="180.0" y="119.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">load(7) load(3) load(7) load(12) load(5)</text>
<line x1="180.0" y1="136.0" x2="180.0" y2="162.0" stroke="#ff5b2e" stroke-width="1.4" marker-end="url(#ah0)"/>
<rect x="16.0" y="162.0" width="328.0" height="46.0" rx="3" fill="#ff5b2e" fill-opacity="0.22" stroke="#ff5b2e" stroke-width="1"/>
<text x="180.0" y="182.0" font-size="12.5" fill="#ede6d8" text-anchor="middle" font-weight="600">DataLoader</text>
<text x="180.0" y="198.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">dedupe + wait one tick</text>
<line x1="180.0" y1="208.0" x2="180.0" y2="234.0" stroke="#7cc47f" stroke-width="2" marker-end="url(#ah1)"/>
<text x="188.0" y="225.0" font-size="10.5" fill="#7cc47f" text-anchor="start" font-weight="400">1 query</text>
<rect x="16.0" y="234.0" width="328.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="180.0" y="254.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">SELECT … WHERE</text>
<text x="180.0" y="270.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">id IN (3, 5, 7, 12)</text>
<text x="16.0" y="306.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">Resolvers each ask for one key; the</text>
<text x="16.0" y="325.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">loader batches and dedupes them into</text>
<text x="16.0" y="344.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">one query, and caches per request.</text>
</svg>
