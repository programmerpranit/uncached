<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 311" width="360" height="311" role="img" aria-label="Observed-remove set: a concurrent add survives a remove because removes only cover observed tags" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="311" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">OR-Set: add wins</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">remove deletes only seen tags</text>
<text x="16.0" y="80.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="400">A: add milk  (tag a1)</text>
<text x="16.0" y="104.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">B: receives milk#a1</text>
<text x="16.0" y="128.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="400">A: remove milk  (removes {a1})</text>
<text x="16.0" y="152.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="400">B: add milk  (tag b7), concurrently</text>
<rect x="16.0" y="184.0" width="328.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="180.0" y="205.0" font-size="13" fill="#7cc47f" text-anchor="middle" font-weight="600">merged: {milk#b7}</text>
<text x="180.0" y="221.0" font-size="11" fill="#7cc47f" text-anchor="middle" font-weight="400">milk stays on both replicas</text>
<text x="16.0" y="262.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">A remove deletes only the tags it</text>
<text x="16.0" y="281.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">has seen, so a concurrent add wins.</text>
</svg>
