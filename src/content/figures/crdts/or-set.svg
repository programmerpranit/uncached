<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 329" width="880" height="329" role="img" aria-label="Observed-remove set: a concurrent add survives a remove because removes only cover observed tags" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="329" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2b45a"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Observed-remove set: add wins over a concurrent remove</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">every add gets a unique tag; remove deletes only tags it has seen</text>
<text x="40.0" y="100.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="600">replica A</text>
<text x="40.0" y="210.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="600">replica B</text>
<line x1="140.0" y1="96.0" x2="840.0" y2="96.0" stroke="#5fb3a1" stroke-width="1.3"/>
<line x1="140.0" y1="206.0" x2="840.0" y2="206.0" stroke="#e2b45a" stroke-width="1.3"/>
<circle cx="190.0" cy="96.0" r="6" fill="#5fb3a1" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="190.0" y="78.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="400">add milk#a1</text>
<line x1="190.0" y1="96.0" x2="280.0" y2="206.0" stroke="#a69d8e" stroke-width="1" marker-end="url(#ah0)" stroke-dasharray="4 3"/>
<circle cx="280.0" cy="206.0" r="6" fill="#e2b45a" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="280.0" y="232.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">sees milk#a1</text>
<circle cx="430.0" cy="96.0" r="6" fill="#5fb3a1" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="430.0" y="78.0" font-size="11" fill="#e5534b" text-anchor="middle" font-weight="400">remove milk {a1}</text>
<circle cx="450.0" cy="206.0" r="6" fill="#e2b45a" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="450.0" y="232.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="400">add milk#b7</text>
<line x1="430.0" y1="96.0" x2="620.0" y2="206.0" stroke="#5fb3a1" stroke-width="1" marker-end="url(#ah1)" stroke-dasharray="4 3"/>
<line x1="450.0" y1="206.0" x2="620.0" y2="96.0" stroke="#e2b45a" stroke-width="1" marker-end="url(#ah2)" stroke-dasharray="4 3"/>
<circle cx="660.0" cy="96.0" r="7" fill="#7cc47f" fill-opacity="1" stroke="none" stroke-width="1"/>
<circle cx="660.0" cy="206.0" r="7" fill="#7cc47f" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="660.0" y="78.0" font-size="12" fill="#7cc47f" text-anchor="middle" font-weight="600">{milk#b7}</text>
<text x="660.0" y="232.0" font-size="12" fill="#7cc47f" text-anchor="middle" font-weight="600">{milk#b7}</text>
<text x="40.0" y="280.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">A’s remove only covered tag a1, which it had observed. B’s concurrent add created tag b7, which survives.</text>
<text x="40.0" y="299.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Result: milk is in the set on both replicas. Removes need tombstones (or causal metadata) for removed tags.</text>
</svg>
