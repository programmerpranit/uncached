<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 349" width="880" height="349" role="img" aria-label="G-Counter: per-replica slots merged with element-wise max" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="349" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2b45a"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7cc47f"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">A grow-only counter (G-Counter)</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">each replica increments its own slot; merge = element-wise max</text>
<rect x="40.0" y="90.0" width="220.0" height="60.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="150.0" y="117.0" font-size="12" fill="#5fb3a1" text-anchor="middle" font-weight="600">replica A</text>
<text x="150.0" y="133.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="400">{A:3, B:0, C:0} → 3</text>
<rect x="40.0" y="190.0" width="220.0" height="60.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="150.0" y="217.0" font-size="12" fill="#e2b45a" text-anchor="middle" font-weight="600">replica B</text>
<text x="150.0" y="233.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="400">{A:1, B:2, C:0} → 3</text>
<rect x="330.0" y="140.0" width="220.0" height="60.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="440.0" y="167.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">merge (max per slot)</text>
<text x="440.0" y="183.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">{A:3, B:2, C:0}</text>
<line x1="262.0" y1="120.0" x2="328.0" y2="160.0" stroke="#5fb3a1" stroke-width="1.2" marker-end="url(#ah0)"/>
<line x1="262.0" y1="220.0" x2="328.0" y2="182.0" stroke="#e2b45a" stroke-width="1.2" marker-end="url(#ah1)"/>
<rect x="620.0" y="140.0" width="220.0" height="60.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="730.0" y="167.0" font-size="14" fill="#7cc47f" text-anchor="middle" font-weight="600">value = 5</text>
<text x="730.0" y="183.0" font-size="11" fill="#7cc47f" text-anchor="middle" font-weight="400">sum of slots</text>
<line x1="552.0" y1="170.0" x2="618.0" y2="170.0" stroke="#7cc47f" stroke-width="1.2" marker-end="url(#ah2)"/>
<text x="40.0" y="300.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Max is commutative, associative and idempotent, so replicas can merge in any order, any number of times,</text>
<text x="40.0" y="319.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">and still agree. Adding a second vector for decrements gives a PN-Counter (value = P − N).</text>
</svg>
