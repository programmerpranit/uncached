<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 389" width="360" height="389" role="img" aria-label="Sequence CRDT: characters have unique IDs and inserts reference IDs, so concurrent inserts merge deterministically" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="389" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Text CRDTs: IDs, not indexes</text>
<text x="16.0" y="82.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">"Hi": each char has an ID</text>
<rect x="16.0" y="94.0" width="56.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="44.0" y="119.4" font-size="15" fill="#ede6d8" text-anchor="middle" font-weight="600">H</text>
<text x="44.0" y="150.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">1@A</text>
<rect x="80.0" y="94.0" width="56.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="108.0" y="119.4" font-size="15" fill="#ede6d8" text-anchor="middle" font-weight="600">i</text>
<text x="108.0" y="150.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">2@A</text>
<text x="16.0" y="182.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="400">A: insert "!" after 2@A</text>
<text x="16.0" y="201.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="400">B: insert "?" after 2@A</text>
<text x="16.0" y="240.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">merged on both:</text>
<rect x="16.0" y="252.0" width="56.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="44.0" y="277.4" font-size="15" fill="#ede6d8" text-anchor="middle" font-weight="600">H</text>
<text x="44.0" y="308.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">1@A</text>
<rect x="80.0" y="252.0" width="56.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="108.0" y="277.4" font-size="15" fill="#ede6d8" text-anchor="middle" font-weight="600">i</text>
<text x="108.0" y="308.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">2@A</text>
<rect x="144.0" y="252.0" width="56.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="172.0" y="277.4" font-size="15" fill="#e2b45a" text-anchor="middle" font-weight="600">?</text>
<text x="172.0" y="308.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">3@B</text>
<rect x="208.0" y="252.0" width="56.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="236.0" y="277.4" font-size="15" fill="#5fb3a1" text-anchor="middle" font-weight="600">!</text>
<text x="236.0" y="308.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">3@A</text>
<text x="16.0" y="340.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Insert after an ID, not at an index.</text>
<text x="16.0" y="359.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Ties broken by replica ID.</text>
</svg>
