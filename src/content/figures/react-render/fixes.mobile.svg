<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 559" width="360" height="559" role="img" aria-label="Moving hover state into a small HoverArea component, or passing the slow chart as children to a stateful wrapper, stops the chart re-rendering without memo" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="559" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Fix the structure first</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">state down · children up</text>
<text x="16.0" y="98.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="700">Before</text>
<rect x="16.0" y="108.0" width="328.0" height="30.0" rx="3" fill="#e2b45a" fill-opacity="0.3" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="126.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Page (hover state)</text>
<rect x="40.0" y="144.0" width="304.0" height="30.0" rx="3" fill="#ff5b2e" fill-opacity="0.2" stroke="#ff5b2e" stroke-width="1"/>
<text x="192.0" y="162.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Tooltip</text>
<rect x="40.0" y="180.0" width="304.0" height="30.0" rx="3" fill="#ff5b2e" fill-opacity="0.2" stroke="#ff5b2e" stroke-width="1"/>
<text x="192.0" y="198.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">BigChart (slow)</text>
<text x="16.0" y="236.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="700">Move state down</text>
<rect x="16.0" y="246.0" width="328.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="180.0" y="264.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Page</text>
<rect x="40.0" y="282.0" width="304.0" height="30.0" rx="3" fill="#e2b45a" fill-opacity="0.3" stroke="#e2b45a" stroke-width="1"/>
<text x="192.0" y="300.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">HoverArea (state)</text>
<rect x="64.0" y="318.0" width="280.0" height="30.0" rx="3" fill="#ff5b2e" fill-opacity="0.2" stroke="#ff5b2e" stroke-width="1"/>
<text x="204.0" y="336.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Tooltip</text>
<rect x="40.0" y="354.0" width="304.0" height="30.0" rx="3" fill="#5fb3a1" fill-opacity="0.12" stroke="#5fb3a1" stroke-width="1"/>
<text x="192.0" y="372.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">BigChart</text>
<text x="16.0" y="410.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="700">Pass as children</text>
<rect x="16.0" y="420.0" width="328.0" height="30.0" rx="3" fill="#e2b45a" fill-opacity="0.3" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="438.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Hover (state)</text>
<rect x="40.0" y="456.0" width="304.0" height="30.0" rx="3" fill="#5fb3a1" fill-opacity="0.12" stroke="#5fb3a1" stroke-width="1"/>
<text x="192.0" y="474.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">{children} = BigChart</text>
<text x="16.0" y="510.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">Children created by the parent keep</text>
<text x="16.0" y="529.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">their identity; React skips them.</text>
</svg>
