<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 445" width="880" height="445" role="img" aria-label="Moving hover state into a small HoverArea component, or passing the slow chart as children to a stateful wrapper, stops the chart re-rendering without memo" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="445" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Cheaper than memo: change the shape of the tree</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">move state down, or pass children through</text>
<text x="140.0" y="100.0" font-size="12" fill="#e5534b" text-anchor="middle" font-weight="700">Before</text>
<rect x="40.0" y="116.0" width="200.0" height="30.0" rx="3" fill="#e2b45a" fill-opacity="0.3" stroke="#e2b45a" stroke-width="1"/>
<text x="140.0" y="135.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Page  (hover state)</text>
<rect x="40.0" y="176.0" width="200.0" height="30.0" rx="3" fill="#ff5b2e" fill-opacity="0.2" stroke="#ff5b2e" stroke-width="1"/>
<text x="140.0" y="195.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Tooltip</text>
<rect x="40.0" y="236.0" width="200.0" height="30.0" rx="3" fill="#ff5b2e" fill-opacity="0.2" stroke="#ff5b2e" stroke-width="1"/>
<text x="140.0" y="255.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">BigChart  (slow)</text>
<line x1="140.0" y1="146.0" x2="140.0" y2="176.0" stroke="#4a4136" stroke-width="1.2"/>
<line x1="140.0" y1="146.0" x2="140.0" y2="176.0" stroke="#4a4136" stroke-width="1.2"/>
<line x1="60.0" y1="146.0" x2="60.0" y2="236.0" stroke="#4a4136" stroke-width="1.2"/>
<text x="440.0" y="100.0" font-size="12" fill="#5fb3a1" text-anchor="middle" font-weight="700">Move state down</text>
<rect x="340.0" y="116.0" width="200.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="440.0" y="135.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Page</text>
<rect x="340.0" y="176.0" width="200.0" height="30.0" rx="3" fill="#e2b45a" fill-opacity="0.3" stroke="#e2b45a" stroke-width="1"/>
<text x="440.0" y="195.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">HoverArea (state)</text>
<rect x="340.0" y="236.0" width="200.0" height="30.0" rx="3" fill="#ff5b2e" fill-opacity="0.2" stroke="#ff5b2e" stroke-width="1"/>
<text x="440.0" y="255.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Tooltip</text>
<line x1="440.0" y1="146.0" x2="440.0" y2="176.0" stroke="#4a4136" stroke-width="1.2"/>
<line x1="440.0" y1="206.0" x2="440.0" y2="236.0" stroke="#4a4136" stroke-width="1.2"/>
<rect x="340.0" y="296.0" width="200.0" height="30.0" rx="3" fill="#5fb3a1" fill-opacity="0.12" stroke="#5fb3a1" stroke-width="1"/>
<text x="440.0" y="315.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">BigChart</text>
<path d="M 350 146 L 330 146 L 330 311 L 340 311" fill="none" stroke="#4a4136" stroke-width="1.2"/>
<text x="740.0" y="100.0" font-size="12" fill="#5fb3a1" text-anchor="middle" font-weight="700">Lift content up (children)</text>
<rect x="640.0" y="116.0" width="200.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="740.0" y="134.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">Page → &lt;Hover&gt;{chart}&lt;/Hover&gt;</text>
<rect x="640.0" y="176.0" width="200.0" height="30.0" rx="3" fill="#e2b45a" fill-opacity="0.3" stroke="#e2b45a" stroke-width="1"/>
<text x="740.0" y="195.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Hover (state)</text>
<rect x="640.0" y="236.0" width="200.0" height="30.0" rx="3" fill="#5fb3a1" fill-opacity="0.12" stroke="#5fb3a1" stroke-width="1"/>
<text x="740.0" y="254.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">{children} = BigChart</text>
<line x1="740.0" y1="146.0" x2="740.0" y2="176.0" stroke="#4a4136" stroke-width="1.2"/>
<line x1="740.0" y1="206.0" x2="740.0" y2="236.0" stroke="#4a4136" stroke-width="1.2"/>
<rect x="40.0" y="346.0" width="12.0" height="12.0" rx="2" fill="#e2b45a" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="58.0" y="356.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">owns state</text>
<rect x="148.2" y="346.0" width="12.0" height="12.0" rx="2" fill="#ff5b2e" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="166.2" y="356.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">re-renders</text>
<rect x="256.4" y="346.0" width="12.0" height="12.0" rx="2" fill="#5fb3a1" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="274.4" y="356.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">not re-rendered</text>
<text x="40.0" y="396.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Elements passed in as children were created by the parent, so when the stateful wrapper re-renders, React sees the</text>
<text x="40.0" y="415.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">same element objects and skips them. No memo, no dependency arrays, nothing to keep stable.</text>
</svg>
