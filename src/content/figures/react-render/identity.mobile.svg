<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 465" width="360" height="465" role="img" aria-label="Primitive props compare equal between renders, but inline objects, arrow functions and derived arrays are new references each time, so memo re-renders unless they are stabilized" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="465" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Referential identity</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">memo uses Object.is per prop</text>
<rect x="16.0" y="86.0" width="328.0" height="46.0" rx="6" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1.2"/>
<text x="28.0" y="105.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">label="Save"</text>
<text x="28.0" y="123.0" font-size="10" fill="#7cc47f" text-anchor="start" font-weight="400">"Save" === "Save"</text>
<text x="330.0" y="114.0" font-size="14" fill="#7cc47f" text-anchor="end" font-weight="700">✓</text>
<rect x="16.0" y="138.0" width="328.0" height="46.0" rx="6" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1.2"/>
<text x="28.0" y="157.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">count={3}</text>
<text x="28.0" y="175.0" font-size="10" fill="#7cc47f" text-anchor="start" font-weight="400">3 === 3</text>
<text x="330.0" y="166.0" font-size="14" fill="#7cc47f" text-anchor="end" font-weight="700">✓</text>
<rect x="16.0" y="190.0" width="328.0" height="46.0" rx="6" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1.2"/>
<text x="28.0" y="209.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">style={{color:"red"}}</text>
<text x="28.0" y="227.0" font-size="10" fill="#e5534b" text-anchor="start" font-weight="400">{…} !== {…}  (new object)</text>
<text x="330.0" y="218.0" font-size="14" fill="#e5534b" text-anchor="end" font-weight="700">✗</text>
<rect x="16.0" y="242.0" width="328.0" height="46.0" rx="6" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1.2"/>
<text x="28.0" y="261.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">onClick={() =&gt; save()}</text>
<text x="28.0" y="279.0" font-size="10" fill="#e5534b" text-anchor="start" font-weight="400">fn !== fn  (new closure)</text>
<text x="330.0" y="270.0" font-size="14" fill="#e5534b" text-anchor="end" font-weight="700">✗</text>
<rect x="16.0" y="294.0" width="328.0" height="46.0" rx="6" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1.2"/>
<text x="28.0" y="313.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">items={list.filter(…)}</text>
<text x="28.0" y="331.0" font-size="10" fill="#e5534b" text-anchor="start" font-weight="400">[…] !== […]  (new array)</text>
<text x="330.0" y="322.0" font-size="14" fill="#e5534b" text-anchor="end" font-weight="700">✗</text>
<rect x="16.0" y="346.0" width="328.0" height="46.0" rx="6" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1.2"/>
<text x="28.0" y="365.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">onClick={save}  // useCallback</text>
<text x="28.0" y="383.0" font-size="10" fill="#7cc47f" text-anchor="start" font-weight="400">same reference</text>
<text x="330.0" y="374.0" font-size="14" fill="#7cc47f" text-anchor="end" font-weight="700">✓</text>
<text x="16.0" y="416.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">One unstable prop defeats memo:</text>
<text x="16.0" y="435.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">you pay for the compare and the render.</text>
</svg>
