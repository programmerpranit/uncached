<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 442" width="880" height="442" role="img" aria-label="Primitive props compare equal between renders, but inline objects, arrow functions and derived arrays are new references each time, so memo re-renders unless they are stabilized" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="442" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Why memo "doesn't work": new identities every render</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">memo compares props with Object.is, one by one</text>
<text x="40.0" y="100.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="700">prop passed by parent</text>
<text x="380.0" y="100.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="700">render 1 vs render 2</text>
<text x="760.0" y="100.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="700">memo skips?</text>
<rect x="40.0" y="114.0" width="800.0" height="34.0" rx="6" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="56.0" y="136.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">label="Save"</text>
<text x="380.0" y="136.0" font-size="11.5" fill="#7cc47f" text-anchor="start" font-weight="400">"Save" === "Save"</text>
<text x="800.0" y="136.0" font-size="12" fill="#7cc47f" text-anchor="middle" font-weight="700">yes</text>
<rect x="40.0" y="154.0" width="800.0" height="34.0" rx="6" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="56.0" y="176.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">count={3}</text>
<text x="380.0" y="176.0" font-size="11.5" fill="#7cc47f" text-anchor="start" font-weight="400">3 === 3</text>
<text x="800.0" y="176.0" font-size="12" fill="#7cc47f" text-anchor="middle" font-weight="700">yes</text>
<rect x="40.0" y="194.0" width="800.0" height="34.0" rx="6" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="56.0" y="216.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">style={{color:"red"}}</text>
<text x="380.0" y="216.0" font-size="11.5" fill="#e5534b" text-anchor="start" font-weight="400">{…} !== {…}  (new object)</text>
<text x="800.0" y="216.0" font-size="12" fill="#e5534b" text-anchor="middle" font-weight="700">no</text>
<rect x="40.0" y="234.0" width="800.0" height="34.0" rx="6" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="56.0" y="256.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">onClick={() =&gt; save()}</text>
<text x="380.0" y="256.0" font-size="11.5" fill="#e5534b" text-anchor="start" font-weight="400">fn !== fn  (new closure)</text>
<text x="800.0" y="256.0" font-size="12" fill="#e5534b" text-anchor="middle" font-weight="700">no</text>
<rect x="40.0" y="274.0" width="800.0" height="34.0" rx="6" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="56.0" y="296.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">items={list.filter(…)}</text>
<text x="380.0" y="296.0" font-size="11.5" fill="#e5534b" text-anchor="start" font-weight="400">[…] !== […]  (new array)</text>
<text x="800.0" y="296.0" font-size="12" fill="#e5534b" text-anchor="middle" font-weight="700">no</text>
<rect x="40.0" y="314.0" width="800.0" height="34.0" rx="6" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="56.0" y="336.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">onClick={save}  // useCallback</text>
<text x="380.0" y="336.0" font-size="11.5" fill="#7cc47f" text-anchor="start" font-weight="400">same reference</text>
<text x="800.0" y="336.0" font-size="12" fill="#7cc47f" text-anchor="middle" font-weight="700">yes</text>
<text x="40.0" y="374.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">One unstable prop makes memo compare, fail and re-render anyway, so you pay for both.</text>
<text x="40.0" y="393.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">useMemo and useCallback mostly exist to keep these references stable, so a memoized</text>
<text x="40.0" y="412.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">child (or an effect dependency) can see that nothing changed.</text>
</svg>
