<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" role="img" aria-label="A setState in Page re-renders every descendant component, except a memo-wrapped Footer whose props are unchanged" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="480" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">A state change re-renders the whole subtree</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">by default, children render because their parent did</text>
<line x1="440.0" y1="126.0" x2="440.0" y2="160.0" stroke="#4a4136" stroke-width="1.2"/>
<line x1="440.0" y1="190.0" x2="210.0" y2="230.0" stroke="#4a4136" stroke-width="1.2"/>
<line x1="440.0" y1="190.0" x2="440.0" y2="230.0" stroke="#4a4136" stroke-width="1.2"/>
<line x1="440.0" y1="190.0" x2="670.0" y2="230.0" stroke="#4a4136" stroke-width="1.2"/>
<line x1="210.0" y1="260.0" x2="210.0" y2="300.0" stroke="#4a4136" stroke-width="1.2"/>
<line x1="440.0" y1="260.0" x2="380.0" y2="300.0" stroke="#4a4136" stroke-width="1.2"/>
<line x1="440.0" y1="260.0" x2="530.0" y2="300.0" stroke="#4a4136" stroke-width="1.2"/>
<line x1="670.0" y1="260.0" x2="670.0" y2="300.0" stroke="#4a4136" stroke-width="1.2"/>
<rect x="380.0" y="96.0" width="120.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="440.0" y="115.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">App</text>
<rect x="380.0" y="160.0" width="120.0" height="30.0" rx="3" fill="#e2b45a" fill-opacity="0.3" stroke="#e2b45a" stroke-width="1"/>
<text x="440.0" y="179.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Page</text>
<rect x="150.0" y="230.0" width="120.0" height="30.0" rx="3" fill="#ff5b2e" fill-opacity="0.2" stroke="#ff5b2e" stroke-width="1"/>
<text x="210.0" y="249.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Header</text>
<rect x="380.0" y="230.0" width="120.0" height="30.0" rx="3" fill="#ff5b2e" fill-opacity="0.2" stroke="#ff5b2e" stroke-width="1"/>
<text x="440.0" y="249.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">List</text>
<rect x="610.0" y="230.0" width="120.0" height="30.0" rx="3" fill="#ff5b2e" fill-opacity="0.2" stroke="#ff5b2e" stroke-width="1"/>
<text x="670.0" y="249.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Sidebar</text>
<rect x="150.0" y="300.0" width="120.0" height="30.0" rx="3" fill="#ff5b2e" fill-opacity="0.2" stroke="#ff5b2e" stroke-width="1"/>
<text x="210.0" y="319.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Avatar</text>
<rect x="320.0" y="300.0" width="120.0" height="30.0" rx="3" fill="#ff5b2e" fill-opacity="0.2" stroke="#ff5b2e" stroke-width="1"/>
<text x="380.0" y="319.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Row ×200</text>
<rect x="470.0" y="300.0" width="120.0" height="30.0" rx="3" fill="#5fb3a1" fill-opacity="0.12" stroke="#5fb3a1" stroke-width="1"/>
<text x="530.0" y="319.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Footer (memo)</text>
<rect x="610.0" y="300.0" width="120.0" height="30.0" rx="3" fill="#ff5b2e" fill-opacity="0.2" stroke="#ff5b2e" stroke-width="1"/>
<text x="670.0" y="319.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Ad</text>
<text x="510.0" y="180.0" font-size="11" fill="#e2b45a" text-anchor="start" font-weight="700">setState() here</text>
<rect x="40.0" y="362.0" width="12.0" height="12.0" rx="2" fill="#e2b45a" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="58.0" y="372.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">state changed</text>
<rect x="168.7" y="362.0" width="12.0" height="12.0" rx="2" fill="#ff5b2e" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="186.7" y="372.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">re-rendered (props may be identical)</text>
<rect x="454.2" y="362.0" width="12.0" height="12.0" rx="2" fill="#5fb3a1" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="472.2" y="372.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">memo: props equal → skipped</text>
<rect x="678.3" y="362.0" width="12.0" height="12.0" rx="2" fill="#4a4136" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="696.3" y="372.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">untouched</text>
<text x="40.0" y="412.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Re-rendering means calling the component function and diffing its output; the DOM changes only</text>
<text x="40.0" y="431.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">where the output differs. Most renders are cheap. They matter when a subtree is large (Row ×200)</text>
<text x="40.0" y="450.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">or a component does expensive work during render.</text>
</svg>
