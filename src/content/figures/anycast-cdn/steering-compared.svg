<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 376" width="880" height="376" role="img" aria-label="A comparison table of unicast, GeoDNS and anycast: who decides where a user goes, how fast failover happens, and the main trade-off of each" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="376" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Three ways to steer users to a server</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">who makes the choice, how fast it changes, and what it costs</text>
<text x="40.0" y="90.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="700">Method</text>
<text x="220.0" y="90.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="700">Who decides</text>
<text x="420.0" y="90.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="700">Failover speed</text>
<text x="620.0" y="90.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="700">Trade-off</text>
<line x1="40.0" y1="98.0" x2="840.0" y2="98.0" stroke="#4a4136" stroke-width="1"/>
<rect x="40.0" y="112.0" width="150.0" height="48.0" rx="3" fill="#a69d8e" fill-opacity="0.22" stroke="#a69d8e" stroke-width="1"/>
<text x="115.0" y="133.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Unicast</text>
<text x="115.0" y="149.0" font-size="8.5" fill="#a69d8e" text-anchor="middle" font-weight="400">one IP, one place</text>
<text x="220.0" y="132.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">nobody — everyone</text>
<text x="220.0" y="147.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">travels to it</text>
<text x="420.0" y="132.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">n/a</text>
<text x="620.0" y="132.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">simple; far users</text>
<text x="620.0" y="147.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">pay latency</text>
<rect x="40.0" y="178.0" width="150.0" height="48.0" rx="3" fill="#e2b45a" fill-opacity="0.22" stroke="#e2b45a" stroke-width="1"/>
<text x="115.0" y="199.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">GeoDNS</text>
<text x="115.0" y="215.0" font-size="8.5" fill="#a69d8e" text-anchor="middle" font-weight="400">IP per region</text>
<text x="220.0" y="198.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">authoritative DNS,</text>
<text x="220.0" y="213.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">by resolver IP</text>
<text x="420.0" y="198.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">DNS TTL (secs–mins,</text>
<text x="420.0" y="213.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">often ignored)</text>
<text x="620.0" y="198.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">fine-grained; resolver</text>
<text x="620.0" y="213.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">≠ user location</text>
<rect x="40.0" y="244.0" width="150.0" height="48.0" rx="3" fill="#5fb3a1" fill-opacity="0.22" stroke="#5fb3a1" stroke-width="1"/>
<text x="115.0" y="265.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Anycast</text>
<text x="115.0" y="281.0" font-size="8.5" fill="#a69d8e" text-anchor="middle" font-weight="400">same IP, many places</text>
<text x="220.0" y="264.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">BGP, router</text>
<text x="220.0" y="279.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">by router</text>
<text x="420.0" y="264.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">BGP convergence</text>
<text x="420.0" y="279.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">(secs–mins)</text>
<text x="620.0" y="264.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">no client state;</text>
<text x="620.0" y="279.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">coarse control</text>
<text x="40.0" y="330.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">Large CDNs combine them: anycast gets packets to a nearby edge with zero client cooperation, while DNS answers (sometimes</text>
<text x="40.0" y="346.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">using EDNS Client Subnet) pick between anycast pools or shed load from a hot region. Most DNS providers are themselves anycast.</text>
</svg>
