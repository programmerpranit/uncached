<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 392" width="360" height="392" role="img" aria-label="Three stages: two PoPs announcing, one withdrawing after a failed health check, and the remaining PoP absorbing its users after BGP converges; a note explains that route changes mid-connection can reset TCP flows" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="392" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">PoP failure &amp; route flaps</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">withdraw → traffic shifts</text>
<rect x="16.0" y="72.0" width="328.0" height="40.0" rx="3" fill="#5fb3a1" fill-opacity="0.22" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="89.0" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">1. Healthy</text>
<text x="180.0" y="105.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">A and B both announce</text>
<rect x="16.0" y="122.0" width="328.0" height="40.0" rx="3" fill="#e5534b" fill-opacity="0.22" stroke="#e5534b" stroke-width="1"/>
<text x="180.0" y="139.0" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">2. A withdraws</text>
<text x="180.0" y="155.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">health check fails</text>
<rect x="16.0" y="172.0" width="328.0" height="40.0" rx="3" fill="#7cc47f" fill-opacity="0.22" stroke="#7cc47f" stroke-width="1"/>
<text x="180.0" y="189.0" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">3. Converged</text>
<text x="180.0" y="205.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">B absorbs A's users</text>
<rect x="16.0" y="228.0" width="328.0" height="140.0" rx="8" fill="#2f2921" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="28.0" y="250.0" font-size="9.5" fill="#ede6d8" text-anchor="start" font-weight="700">Risk: path flips mid-connection</text>
<text x="28.0" y="266.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">A TCP flow re-routed to another</text>
<text x="28.0" y="282.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">PoP hits a host with no state → RST.</text>
<text x="28.0" y="298.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">Long downloads and WebSockets feel</text>
<text x="28.0" y="314.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">it; short requests rarely do.</text>
<text x="28.0" y="330.0" font-size="9.5" fill="#e2b45a" text-anchor="start" font-weight="600">Drain first: prepend, then withdraw.</text>
</svg>
