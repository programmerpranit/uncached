<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 332" width="360" height="332" role="img" aria-label="Three points of presence in Frankfurt, Virginia and Singapore all announce the same prefix over BGP; users in Paris, Boston and Jakarta connecting to the same IP each reach the nearest PoP" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="332" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b8cff"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2b45a"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d77fa1"/></marker></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Anycast: one IP, many PoPs</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">BGP picks the "nearest" announcer</text>
<rect x="16.0" y="72.0" width="150.0" height="40.0" rx="3" fill="#9b8cff" fill-opacity="0.22" stroke="#9b8cff" stroke-width="1"/>
<text x="91.0" y="89.0" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">PoP Frankfurt</text>
<text x="91.0" y="105.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">203.0.113.0/24</text>
<rect x="194.0" y="72.0" width="150.0" height="40.0" rx="3" fill="#5fb3a1" fill-opacity="0.18" stroke="#5fb3a1" stroke-width="1"/>
<text x="269.0" y="95.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">User in Paris</text>
<line x1="192.0" y1="92.0" x2="168.0" y2="92.0" stroke="#9b8cff" stroke-width="1.4" marker-end="url(#ah0)"/>
<rect x="16.0" y="126.0" width="150.0" height="40.0" rx="3" fill="#e2b45a" fill-opacity="0.22" stroke="#e2b45a" stroke-width="1"/>
<text x="91.0" y="143.0" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">PoP Virginia</text>
<text x="91.0" y="159.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">203.0.113.0/24</text>
<rect x="194.0" y="126.0" width="150.0" height="40.0" rx="3" fill="#5fb3a1" fill-opacity="0.18" stroke="#5fb3a1" stroke-width="1"/>
<text x="269.0" y="149.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">User in Boston</text>
<line x1="192.0" y1="146.0" x2="168.0" y2="146.0" stroke="#e2b45a" stroke-width="1.4" marker-end="url(#ah1)"/>
<rect x="16.0" y="180.0" width="150.0" height="40.0" rx="3" fill="#d77fa1" fill-opacity="0.22" stroke="#d77fa1" stroke-width="1"/>
<text x="91.0" y="197.0" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">PoP Singapore</text>
<text x="91.0" y="213.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">203.0.113.0/24</text>
<rect x="194.0" y="180.0" width="150.0" height="40.0" rx="3" fill="#5fb3a1" fill-opacity="0.18" stroke="#5fb3a1" stroke-width="1"/>
<text x="269.0" y="203.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">User in Jakarta</text>
<line x1="192.0" y1="200.0" x2="168.0" y2="200.0" stroke="#d77fa1" stroke-width="1.4" marker-end="url(#ah2)"/>
<text x="16.0" y="242.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">Every PoP announces the same prefix.</text>
<text x="16.0" y="257.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">Each router keeps its single best</text>
<text x="16.0" y="272.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">BGP route, so users split across</text>
<text x="16.0" y="287.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">PoPs by routing distance — which</text>
<text x="16.0" y="302.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">usually, not always, tracks geography.</text>
</svg>
