<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 509" width="880" height="509" role="img" aria-label="Choreographed sagas pass events between services; orchestrated sagas use a central coordinator" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="509" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5b2e"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Choreography vs orchestration</text>
<text x="40.0" y="90.0" font-size="13" fill="#5fb3a1" text-anchor="start" font-weight="700">Choreography: services react to each other’s events</text>
<rect x="40.0" y="110.0" width="170.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="125.0" y="138.7" font-size="13" fill="#ede6d8" text-anchor="middle" font-weight="600">Order</text>
<line x1="212.0" y1="134.0" x2="248.0" y2="134.0" stroke="#5fb3a1" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="250.0" y="110.0" width="170.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="335.0" y="138.7" font-size="13" fill="#ede6d8" text-anchor="middle" font-weight="600">Payment</text>
<line x1="422.0" y1="134.0" x2="458.0" y2="134.0" stroke="#5fb3a1" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="460.0" y="110.0" width="170.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="545.0" y="138.7" font-size="13" fill="#ede6d8" text-anchor="middle" font-weight="600">Inventory</text>
<line x1="632.0" y1="134.0" x2="668.0" y2="134.0" stroke="#5fb3a1" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="670.0" y="110.0" width="170.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="755.0" y="138.7" font-size="13" fill="#ede6d8" text-anchor="middle" font-weight="600">Shipping</text>
<text x="230.0" y="180.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">OrderCreated</text>
<text x="440.0" y="180.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">PaymentCaptured</text>
<text x="650.0" y="180.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">StockReserved</text>
<text x="40.0" y="240.0" font-size="13" fill="#ff5b2e" text-anchor="start" font-weight="700">Orchestration: a coordinator tells each service what to do</text>
<rect x="340.0" y="260.0" width="200.0" height="52.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="440.0" y="283.0" font-size="12" fill="#ff5b2e" text-anchor="middle" font-weight="600">Order saga orchestrator</text>
<text x="440.0" y="299.0" font-size="11" fill="#ff5b2e" text-anchor="middle" font-weight="400">state machine, persisted</text>
<rect x="40.0" y="370.0" width="170.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="125.0" y="398.7" font-size="13" fill="#ede6d8" text-anchor="middle" font-weight="600">Order</text>
<line x1="440.0" y1="314.0" x2="125.0" y2="368.0" stroke="#ff5b2e" stroke-width="1.2" marker-end="url(#ah1)"/>
<rect x="250.0" y="370.0" width="170.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="335.0" y="398.7" font-size="13" fill="#ede6d8" text-anchor="middle" font-weight="600">Payment</text>
<line x1="440.0" y1="314.0" x2="335.0" y2="368.0" stroke="#ff5b2e" stroke-width="1.2" marker-end="url(#ah1)"/>
<rect x="460.0" y="370.0" width="170.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="545.0" y="398.7" font-size="13" fill="#ede6d8" text-anchor="middle" font-weight="600">Inventory</text>
<line x1="440.0" y1="314.0" x2="545.0" y2="368.0" stroke="#ff5b2e" stroke-width="1.2" marker-end="url(#ah1)"/>
<rect x="670.0" y="370.0" width="170.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="755.0" y="398.7" font-size="13" fill="#ede6d8" text-anchor="middle" font-weight="600">Shipping</text>
<line x1="440.0" y1="314.0" x2="755.0" y2="368.0" stroke="#ff5b2e" stroke-width="1.2" marker-end="url(#ah1)"/>
<text x="40.0" y="460.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Choreography: loose coupling, no central component, but the overall flow is implicit and hard to trace.</text>
<text x="40.0" y="479.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Orchestration: the flow lives in one place, easy to monitor and change, but the orchestrator must be reliable.</text>
</svg>
