<text x="86.0" y="295.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Shipping</text>
<text x="16.0" y="352.0" font-size="13" fill="#ff5b2e" text-anchor="start" font-weight="700">Orchestration</text>
<rect x="16.0" y="366.0" width="328.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
