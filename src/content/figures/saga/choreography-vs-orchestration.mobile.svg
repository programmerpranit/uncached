<text x="86.0" y="175.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Payment</text>
<line x1="86.0" y1="192.0" x2="86.0" y2="210.0" stroke="#5fb3a1" stroke-width="1.2" marker-end="url(#ah0)"/>
<text x="100.0" y="205.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">PaymentCaptured</text>
