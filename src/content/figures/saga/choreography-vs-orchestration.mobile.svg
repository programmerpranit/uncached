<text x="16.0" y="496.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Choreography: decoupled, but the</text>
<text x="16.0" y="515.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">flow is implicit and hard to trace.</text>
<text x="16.0" y="534.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Orchestration: one place to see and</text>
<text x="16.0" y="553.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">change the flow; must be reliable.</text>
