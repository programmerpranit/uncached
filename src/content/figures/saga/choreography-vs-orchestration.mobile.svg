<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 583" width="360" height="583" role="img" aria-label="Choreographed sagas pass events between services; orchestrated sagas use a central coordinator" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
