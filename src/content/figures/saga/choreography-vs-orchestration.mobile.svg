<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Choreography vs orchestration</text>
<text x="16.0" y="80.0" font-size="13" fill="#5fb3a1" text-anchor="start" font-weight="700">Choreography</text>
