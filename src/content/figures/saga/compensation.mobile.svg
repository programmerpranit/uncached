<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 498" width="360" height="498" role="img" aria-label="A saga runs local transactions in sequence and compensates completed steps when one fails" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="498" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">A saga with compensation</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">T3 fails → undo T2, then T1</text>
<rect x="16.0" y="74.0" width="328.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="96.0" font-size="13" fill="#ede6d8" text-anchor="middle" font-weight="600">T1: create order</text>
<text x="180.0" y="112.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">Order service</text>
<line x1="180.0" y1="126.0" x2="180.0" y2="144.0" stroke="#5fb3a1" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="16.0" y="146.0" width="328.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="168.0" font-size="13" fill="#ede6d8" text-anchor="middle" font-weight="600">T2: charge card</text>
<text x="180.0" y="184.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">Payment service</text>
<line x1="180.0" y1="198.0" x2="180.0" y2="216.0" stroke="#5fb3a1" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="16.0" y="218.0" width="328.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<text x="180.0" y="240.0" font-size="13" fill="#e5534b" text-anchor="middle" font-weight="600">T3: reserve stock</text>
<text x="180.0" y="256.0" font-size="11" fill="#e5534b" text-anchor="middle" font-weight="400">Inventory service</text>
<text x="180.0" y="284.0" font-size="12" fill="#e5534b" text-anchor="middle" font-weight="700">✕ out of stock → compensate</text>
<rect x="16.0" y="302.0" width="328.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="328.7" font-size="13" fill="#e2b45a" text-anchor="middle" font-weight="600">C2: refund card</text>
<rect x="16.0" y="360.0" width="328.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="386.7" font-size="13" fill="#e2b45a" text-anchor="middle" font-weight="600">C1: cancel order</text>
<text x="16.0" y="430.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Each step is a local transaction.</text>
<text x="16.0" y="449.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Compensations are semantic undos:</text>
<text x="16.0" y="468.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">a refund, not a rollback.</text>
</svg>
