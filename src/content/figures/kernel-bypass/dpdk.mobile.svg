<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 382" width="360" height="382" role="img" aria-label="DPDK techniques: poll-mode drivers, batching, hugepage memory pools, lock-free rings and core pinning" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="382" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">DPDK techniques</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">remove per-packet costs</text>
<text x="16.0" y="86.0" font-size="12.5" fill="#7cc47f" text-anchor="start" font-weight="700">poll-mode drivers</text>
<text x="16.0" y="103.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">cost: cores at 100% even when idle</text>
<text x="16.0" y="130.0" font-size="12.5" fill="#5fb3a1" text-anchor="start" font-weight="700">batching</text>
<text x="16.0" y="147.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">cost: a little added latency</text>
<text x="16.0" y="174.0" font-size="12.5" fill="#e2b45a" text-anchor="start" font-weight="700">hugepage memory pools</text>
<text x="16.0" y="191.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">cost: memory reserved up front</text>
<text x="16.0" y="218.0" font-size="12.5" fill="#9b8cff" text-anchor="start" font-weight="700">lock-free rings</text>
<text x="16.0" y="235.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">cost: careful pipeline design</text>
<text x="16.0" y="262.0" font-size="12.5" fill="#d77fa1" text-anchor="start" font-weight="700">core and NUMA pinning</text>
<text x="16.0" y="279.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">cost: static configuration</text>
<text x="16.0" y="314.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">You give up the kernel TCP/IP</text>
<text x="16.0" y="333.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">stack, firewall, tcpdump and</text>
<text x="16.0" y="352.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">normal sockets.</text>
</svg>
