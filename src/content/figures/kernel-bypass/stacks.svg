<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 466" width="880" height="466" role="img" aria-label="The kernel networking stack layers compared with DPDK user-space packet processing" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="466" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Kernel networking vs kernel bypass</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">where a received packet goes, and who touches it</text>
<text x="220.0" y="96.0" font-size="12.5" fill="#e2b45a" text-anchor="middle" font-weight="700">kernel stack</text>
<text x="660.0" y="96.0" font-size="12.5" fill="#7cc47f" text-anchor="middle" font-weight="700">DPDK (kernel bypass)</text>
<rect x="80.0" y="110.0" width="280.0" height="28.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="220.0" y="128.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="600">app: recv()</text>
<rect x="80.0" y="144.0" width="280.0" height="28.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<text x="220.0" y="162.0" font-size="11" fill="#e5534b" text-anchor="middle" font-weight="600">syscall + copy</text>
<rect x="80.0" y="178.0" width="280.0" height="28.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="220.0" y="196.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="600">socket layer</text>
<rect x="80.0" y="212.0" width="280.0" height="28.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="220.0" y="230.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="600">TCP / IP</text>
<rect x="80.0" y="246.0" width="280.0" height="28.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="220.0" y="264.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="600">netfilter, qdisc, routing</text>
<rect x="80.0" y="280.0" width="280.0" height="28.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="220.0" y="298.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="600">softirq / NAPI</text>
<rect x="80.0" y="314.0" width="280.0" height="28.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="220.0" y="332.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="600">driver + interrupts</text>
<rect x="80.0" y="348.0" width="280.0" height="28.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="220.0" y="366.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">NIC</text>
<rect x="520.0" y="110.0" width="280.0" height="28.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="660.0" y="128.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="600">app + DPDK libraries</text>
<rect x="520.0" y="144.0" width="280.0" height="28.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="660.0" y="162.0" font-size="11" fill="#7cc47f" text-anchor="middle" font-weight="600">user-space driver (PMD)</text>
<rect x="520.0" y="178.0" width="280.0" height="28.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="660.0" y="196.0" font-size="11" fill="#7cc47f" text-anchor="middle" font-weight="600">rx ring in hugepage memory</text>
<rect x="520.0" y="212.0" width="280.0" height="28.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="660.0" y="230.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">NIC</text>
<rect x="520.0" y="266.0" width="280.0" height="56.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="660.0" y="291.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="600">kernel: not involved</text>
<text x="660.0" y="307.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">after setup via vfio</text>
<text x="40.0" y="398.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">The kernel path is general and safe: shared by all apps, with firewalls, routing and TCP. Each layer costs</text>
<text x="40.0" y="417.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">per-packet work, interrupts, syscalls and copies, limiting a core to roughly 1–2 M small packets/s. DPDK</text>
<text x="40.0" y="436.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">maps the NIC's queues into the app, which polls them directly: tens of millions of packets/s per core.</text>
</svg>
