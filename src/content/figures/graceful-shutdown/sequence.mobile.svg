<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 468" width="360" height="468" role="img" aria-label="Graceful shutdown sequence: SIGTERM, fail readiness, wait for the load balancer to remove the endpoint, stop accepting, drain in-flight work, close resources and exit before the grace period ends in SIGKILL" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="468" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ede6d8"/></marker></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Shutdown sequence</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">leave LB, drain, exit</text>
<rect x="16.0" y="86.0" width="140.0" height="36.0" rx="3" fill="#e5534b" fill-opacity="0.15" stroke="#e5534b" stroke-width="1"/>
<text x="86.0" y="108.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">SIGTERM</text>
<text x="168.0" y="108.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">signal arrives</text>
<line x1="86.0" y1="122.0" x2="86.0" y2="134.0" stroke="#ede6d8" stroke-width="1" marker-end="url(#ah0)"/>
<rect x="16.0" y="134.0" width="140.0" height="36.0" rx="3" fill="#e2b45a" fill-opacity="0.15" stroke="#e2b45a" stroke-width="1"/>
<text x="86.0" y="156.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">fail ready</text>
<text x="168.0" y="156.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">no new traffic</text>
<line x1="86.0" y1="170.0" x2="86.0" y2="182.0" stroke="#ede6d8" stroke-width="1" marker-end="url(#ah0)"/>
<rect x="16.0" y="182.0" width="140.0" height="36.0" rx="3" fill="#e2b45a" fill-opacity="0.15" stroke="#e2b45a" stroke-width="1"/>
<text x="86.0" y="204.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">wait for LB</text>
<text x="168.0" y="204.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">LB catches up</text>
<line x1="86.0" y1="218.0" x2="86.0" y2="230.0" stroke="#ede6d8" stroke-width="1" marker-end="url(#ah0)"/>
<rect x="16.0" y="230.0" width="140.0" height="36.0" rx="3" fill="#5fb3a1" fill-opacity="0.15" stroke="#5fb3a1" stroke-width="1"/>
<text x="86.0" y="252.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">stop accept</text>
<text x="168.0" y="252.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">close listener</text>
<line x1="86.0" y1="266.0" x2="86.0" y2="278.0" stroke="#ede6d8" stroke-width="1" marker-end="url(#ah0)"/>
<rect x="16.0" y="278.0" width="140.0" height="36.0" rx="3" fill="#5fb3a1" fill-opacity="0.15" stroke="#5fb3a1" stroke-width="1"/>
<text x="86.0" y="300.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">drain</text>
<text x="168.0" y="300.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">finish work</text>
<line x1="86.0" y1="314.0" x2="86.0" y2="326.0" stroke="#ede6d8" stroke-width="1" marker-end="url(#ah0)"/>
<rect x="16.0" y="326.0" width="140.0" height="36.0" rx="3" fill="#9b8cff" fill-opacity="0.15" stroke="#9b8cff" stroke-width="1"/>
<text x="86.0" y="348.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">close</text>
<text x="168.0" y="348.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">flush, close pools</text>
<line x1="86.0" y1="362.0" x2="86.0" y2="374.0" stroke="#ede6d8" stroke-width="1" marker-end="url(#ah0)"/>
<rect x="16.0" y="374.0" width="140.0" height="36.0" rx="3" fill="#7cc47f" fill-opacity="0.15" stroke="#7cc47f" stroke-width="1"/>
<text x="86.0" y="396.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">exit 0</text>
<text x="168.0" y="396.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">before SIGKILL</text>
<text x="16.0" y="438.0" font-size="10.5" fill="#e5534b" text-anchor="start" font-weight="400">hard SIGKILL at grace period (30 s)</text>
</svg>
