<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 345" width="360" height="345" role="img" aria-label="Without a pre-stop delay the pod exits while the load balancer still routes to it, causing 502s; with a short pre-stop sleep the load balancer removes the endpoint before the pod stops serving" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="345" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Endpoint removal race</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">signal and LB update race</text>
<text x="16.0" y="100.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="700">No delay</text>
<text x="16.0" y="124.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">pod</text>
<rect x="56.0" y="112.0" width="60.0" height="16.0" rx="3" fill="#5fb3a1" fill-opacity="0.5" stroke="none" stroke-width="1"/>
<text x="16.0" y="148.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">LB</text>
<rect x="56.0" y="136.0" width="240.0" height="16.0" rx="3" fill="#ff5b2e" fill-opacity="0.4" stroke="none" stroke-width="1"/>
<text x="16.0" y="174.0" font-size="10.5" fill="#e5534b" text-anchor="start" font-weight="400">gap → 502s</text>
<text x="16.0" y="214.0" font-size="12" fill="#7cc47f" text-anchor="start" font-weight="700">Pre-stop sleep</text>
<text x="16.0" y="238.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">pod</text>
<rect x="56.0" y="226.0" width="100.0" height="16.0" rx="3" fill="#e2b45a" fill-opacity="0.5" stroke="none" stroke-width="1"/>
<rect x="156.0" y="226.0" width="160.0" height="16.0" rx="3" fill="#5fb3a1" fill-opacity="0.5" stroke="none" stroke-width="1"/>
<text x="16.0" y="262.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">LB</text>
<rect x="56.0" y="250.0" width="70.0" height="16.0" rx="3" fill="#ff5b2e" fill-opacity="0.4" stroke="none" stroke-width="1"/>
<text x="16.0" y="296.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">LB stops routing before</text>
<text x="16.0" y="315.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">the pod stops serving.</text>
</svg>
