<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 429" width="880" height="429" role="img" aria-label="How to drain each kind of work: HTTP requests finish in flight, keep-alive and gRPC connections get GOAWAY, WebSockets are told to reconnect, queue consumers stop polling and nack unfinished messages, and long batch jobs checkpoint progress" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="429" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Draining long-running work</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">stop pulling, finish or hand back, never half-finish</text>
<rect x="40.0" y="96.0" width="200.0" height="40.0" rx="3" fill="#5fb3a1" fill-opacity="0.15" stroke="#5fb3a1" stroke-width="1"/>
<text x="140.0" y="120.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">HTTP requests</text>
<text x="260.0" y="121.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">stop accept, finish in-flight, set Connection: close</text>
<rect x="40.0" y="148.0" width="200.0" height="40.0" rx="3" fill="#ff5b2e" fill-opacity="0.15" stroke="#ff5b2e" stroke-width="1"/>
<text x="140.0" y="172.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Keep-alive / gRPC</text>
<text x="260.0" y="173.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">send GOAWAY / close idle conns so clients reconnect</text>
<rect x="40.0" y="200.0" width="200.0" height="40.0" rx="3" fill="#9b8cff" fill-opacity="0.15" stroke="#9b8cff" stroke-width="1"/>
<text x="140.0" y="224.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">WebSockets / SSE</text>
<text x="260.0" y="225.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">notify clients, close with reconnect hint, stagger</text>
<rect x="40.0" y="252.0" width="200.0" height="40.0" rx="3" fill="#e2b45a" fill-opacity="0.15" stroke="#e2b45a" stroke-width="1"/>
<text x="140.0" y="276.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Queue consumers</text>
<text x="260.0" y="277.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">stop polling; finish or nack so message is redelivered</text>
<rect x="40.0" y="304.0" width="200.0" height="40.0" rx="3" fill="#d77fa1" fill-opacity="0.15" stroke="#d77fa1" stroke-width="1"/>
<text x="140.0" y="328.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Long batch jobs</text>
<text x="260.0" y="329.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">checkpoint progress; resume elsewhere idempotently</text>
<text x="40.0" y="380.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Anything that can outlive the grace period must be resumable:</text>
<text x="40.0" y="399.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">acknowledge only after the work is done, and make it idempotent.</text>
</svg>
