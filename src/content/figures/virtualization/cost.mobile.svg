<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" width="360" height="420" role="img" aria-label="Bar comparison: rendering every row costs far more DOM nodes, render time and memory than rendering a window" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="420" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Full vs windowed</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">10,000 rows (illustrative)</text>
<text x="16.0" y="98.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="600">DOM nodes</text>
<rect x="16.0" y="106.0" width="320.0" height="16.0" rx="3" fill="#e5534b" fill-opacity="0.6" stroke="none" stroke-width="1"/>
<text x="330.0" y="118.0" font-size="10.5" fill="#1b1712" text-anchor="end" font-weight="600">80,000</text>
<rect x="16.0" y="126.0" width="4.0" height="16.0" rx="3" fill="#7cc47f" fill-opacity="0.8" stroke="none" stroke-width="1"/>
<text x="28.0" y="138.0" font-size="10.5" fill="#7cc47f" text-anchor="start" font-weight="600">~240</text>
<text x="16.0" y="174.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="600">initial render</text>
<rect x="16.0" y="182.0" width="320.0" height="16.0" rx="3" fill="#e5534b" fill-opacity="0.6" stroke="none" stroke-width="1"/>
<text x="330.0" y="194.0" font-size="10.5" fill="#1b1712" text-anchor="end" font-weight="600">~1,800 ms</text>
<rect x="16.0" y="202.0" width="4.5" height="16.0" rx="3" fill="#7cc47f" fill-opacity="0.8" stroke="none" stroke-width="1"/>
<text x="28.5" y="214.0" font-size="10.5" fill="#7cc47f" text-anchor="start" font-weight="600">~25 ms</text>
<text x="16.0" y="250.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="600">memory (DOM + VDOM)</text>
<rect x="16.0" y="258.0" width="320.0" height="16.0" rx="3" fill="#e5534b" fill-opacity="0.6" stroke="none" stroke-width="1"/>
<text x="330.0" y="270.0" font-size="10.5" fill="#1b1712" text-anchor="end" font-weight="600">~120 MB</text>
<rect x="16.0" y="278.0" width="22.4" height="16.0" rx="3" fill="#7cc47f" fill-opacity="0.8" stroke="none" stroke-width="1"/>
<text x="46.4" y="290.0" font-size="10.5" fill="#7cc47f" text-anchor="start" font-weight="600">~8 MB</text>
<text x="16.0" y="326.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="600">style recalc on theme change</text>
<rect x="16.0" y="334.0" width="320.0" height="16.0" rx="3" fill="#e5534b" fill-opacity="0.6" stroke="none" stroke-width="1"/>
<text x="330.0" y="346.0" font-size="10.5" fill="#1b1712" text-anchor="end" font-weight="600">~400 ms</text>
<rect x="16.0" y="354.0" width="4.0" height="16.0" rx="3" fill="#7cc47f" fill-opacity="0.8" stroke="none" stroke-width="1"/>
<text x="28.0" y="366.0" font-size="10.5" fill="#7cc47f" text-anchor="start" font-weight="600">~4 ms</text>
<rect x="16.0" y="380.0" width="12.0" height="12.0" rx="2" fill="#e5534b" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="34.0" y="390.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">everything</text>
<rect x="121.1" y="380.0" width="12.0" height="12.0" rx="2" fill="#7cc47f" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="139.1" y="390.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">windowed</text>
</svg>
