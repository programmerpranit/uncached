<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 402" width="880" height="402" role="img" aria-label="Bar comparison: rendering every row costs far more DOM nodes, render time and memory than rendering a window" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="402" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Full list vs windowed list</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">10,000 rows, ~8 DOM nodes each (illustrative)</text>
<text x="40.0" y="118.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">DOM nodes</text>
<rect x="260.0" y="104.0" width="520.0" height="18.0" rx="3" fill="#e5534b" fill-opacity="0.6" stroke="none" stroke-width="1"/>
<text x="774.0" y="117.0" font-size="11" fill="#1b1712" text-anchor="end" font-weight="600">80,000</text>
<rect x="260.0" y="126.0" width="4.0" height="18.0" rx="3" fill="#7cc47f" fill-opacity="0.8" stroke="none" stroke-width="1"/>
<text x="272.0" y="139.0" font-size="11" fill="#7cc47f" text-anchor="start" font-weight="600">~240</text>
<text x="40.0" y="184.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">initial render</text>
<rect x="260.0" y="170.0" width="520.0" height="18.0" rx="3" fill="#e5534b" fill-opacity="0.6" stroke="none" stroke-width="1"/>
<text x="774.0" y="183.0" font-size="11" fill="#1b1712" text-anchor="end" font-weight="600">~1,800 ms</text>
<rect x="260.0" y="192.0" width="7.3" height="18.0" rx="3" fill="#7cc47f" fill-opacity="0.8" stroke="none" stroke-width="1"/>
<text x="275.3" y="205.0" font-size="11" fill="#7cc47f" text-anchor="start" font-weight="600">~25 ms</text>
<text x="40.0" y="250.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">memory (DOM + VDOM)</text>
<rect x="260.0" y="236.0" width="520.0" height="18.0" rx="3" fill="#e5534b" fill-opacity="0.6" stroke="none" stroke-width="1"/>
<text x="774.0" y="249.0" font-size="11" fill="#1b1712" text-anchor="end" font-weight="600">~120 MB</text>
<rect x="260.0" y="258.0" width="36.4" height="18.0" rx="3" fill="#7cc47f" fill-opacity="0.8" stroke="none" stroke-width="1"/>
<text x="304.4" y="271.0" font-size="11" fill="#7cc47f" text-anchor="start" font-weight="600">~8 MB</text>
<text x="40.0" y="316.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">style recalc on theme change</text>
<rect x="260.0" y="302.0" width="520.0" height="18.0" rx="3" fill="#e5534b" fill-opacity="0.6" stroke="none" stroke-width="1"/>
<text x="774.0" y="315.0" font-size="11" fill="#1b1712" text-anchor="end" font-weight="600">~400 ms</text>
<rect x="260.0" y="324.0" width="5.2" height="18.0" rx="3" fill="#7cc47f" fill-opacity="0.8" stroke="none" stroke-width="1"/>
<text x="273.2" y="337.0" font-size="11" fill="#7cc47f" text-anchor="start" font-weight="600">~4 ms</text>
<rect x="260.0" y="362.0" width="12.0" height="12.0" rx="2" fill="#e5534b" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="278.0" y="372.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">render everything</text>
<rect x="421.2" y="362.0" width="12.0" height="12.0" rx="2" fill="#7cc47f" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="439.2" y="372.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">windowed (~30 rows)</text>
</svg>
