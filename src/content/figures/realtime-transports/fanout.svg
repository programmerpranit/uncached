<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 414" width="880" height="414" role="img" aria-label="Workers publish events to a pub/sub bus; several gateway nodes each hold tens of thousands of client sockets and forward events for the channels their clients subscribe to" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
