<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" role="img" aria-label="Decision guide: frequent client-to-server messages point to WebSocket; one-way server push points to SSE; long polling when streaming is blocked; plain polling when updates are rare" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="370" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Picking a transport</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">start from who sends, how often, and through what network</text>
<rect x="330.0" y="84.0" width="220.0" height="40.0" rx="3" fill="#a69d8e" fill-opacity="0.12" stroke="#a69d8e" stroke-width="1"/>
<text x="440.0" y="108.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Does the client send often?</text>
<rect x="120.0" y="170.0" width="220.0" height="40.0" rx="3" fill="#a69d8e" fill-opacity="0.12" stroke="#a69d8e" stroke-width="1"/>
<text x="230.0" y="194.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Need push from server?</text>
<rect x="560.0" y="170.0" width="240.0" height="44.0" rx="3" fill="#9b8cff" fill-opacity="0.15" stroke="#9b8cff" stroke-width="1"/>
<text x="680.0" y="189.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">WebSocket</text>
<text x="680.0" y="205.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">chat, games, collab editing</text>
<line x1="400.0" y1="124.0" x2="240.0" y2="168.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<text x="300.0" y="146.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">no</text>
<line x1="480.0" y1="124.0" x2="660.0" y2="168.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<text x="590.0" y="146.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">yes</text>
<rect x="30.0" y="260.0" width="240.0" height="44.0" rx="3" fill="#5fb3a1" fill-opacity="0.15" stroke="#5fb3a1" stroke-width="1"/>
<text x="150.0" y="279.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">SSE</text>
<text x="150.0" y="295.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">feeds, notifications, LLM tokens</text>
<rect x="290.0" y="260.0" width="220.0" height="44.0" rx="3" fill="#ff5b2e" fill-opacity="0.15" stroke="#ff5b2e" stroke-width="1"/>
<text x="400.0" y="279.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Long polling</text>
<text x="400.0" y="295.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">hostile proxies, legacy</text>
<rect x="530.0" y="260.0" width="220.0" height="44.0" rx="3" fill="#a69d8e" fill-opacity="0.15" stroke="#a69d8e" stroke-width="1"/>
<text x="640.0" y="279.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Plain polling</text>
<text x="640.0" y="295.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">updates every minute+</text>
<line x1="200.0" y1="210.0" x2="140.0" y2="258.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<text x="140.0" y="236.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">streaming OK</text>
<line x1="240.0" y1="210.0" x2="390.0" y2="258.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<text x="310.0" y="236.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">blocked</text>
<line x1="300.0" y1="210.0" x2="620.0" y2="258.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<text x="500.0" y="232.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">rarely</text>
<text x="40.0" y="340.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">SSE over HTTP/2 avoids the six-connections-per-origin limit and works through most proxies and CDNs.</text>
</svg>
