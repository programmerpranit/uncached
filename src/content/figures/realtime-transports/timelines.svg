<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" role="img" aria-label="Timelines of three transports: long polling repeats held GET requests; Server-Sent Events keeps one GET open and streams events one way; WebSocket upgrades once and then exchanges frames in both directions" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="390" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Three ways to push updates</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">what travels over the wire for each transport</text>
<text x="40.0" y="130.0" font-size="12" fill="#ff5b2e" text-anchor="start" font-weight="700">Long polling</text>
<line x1="170.0" y1="130.0" x2="840.0" y2="130.0" stroke="#4a4136" stroke-width="1"/>
<text x="40.0" y="210.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="700">SSE</text>
<line x1="170.0" y1="210.0" x2="840.0" y2="210.0" stroke="#4a4136" stroke-width="1"/>
<text x="40.0" y="290.0" font-size="12" fill="#9b8cff" text-anchor="start" font-weight="700">WebSocket</text>
<line x1="170.0" y1="290.0" x2="840.0" y2="290.0" stroke="#4a4136" stroke-width="1"/>
<rect x="180.0" y="118.0" width="180.0" height="24.0" rx="4" fill="#ff5b2e" fill-opacity="0.15" stroke="#ff5b2e" stroke-width="1"/>
<rect x="380.0" y="118.0" width="180.0" height="24.0" rx="4" fill="#ff5b2e" fill-opacity="0.15" stroke="#ff5b2e" stroke-width="1"/>
<rect x="580.0" y="118.0" width="120.0" height="24.0" rx="4" fill="#ff5b2e" fill-opacity="0.15" stroke="#ff5b2e" stroke-width="1"/>
<rect x="720.0" y="118.0" width="110.0" height="24.0" rx="4" fill="#ff5b2e" fill-opacity="0.15" stroke="#ff5b2e" stroke-width="1"/>
<text x="270.0" y="134.0" font-size="9.5" fill="#ede6d8" text-anchor="middle" font-weight="400">GET held… → 200 {event}</text>
<text x="470.0" y="134.0" font-size="9.5" fill="#ede6d8" text-anchor="middle" font-weight="400">new GET held… → 200</text>
<text x="640.0" y="134.0" font-size="9.5" fill="#ede6d8" text-anchor="middle" font-weight="400">GET → 204</text>
<text x="775.0" y="134.0" font-size="9.5" fill="#ede6d8" text-anchor="middle" font-weight="400">GET…</text>
<rect x="180.0" y="198.0" width="650.0" height="24.0" rx="4" fill="#5fb3a1" fill-opacity="0.12" stroke="#5fb3a1" stroke-width="1"/>
<text x="200.0" y="214.0" font-size="9.5" fill="#ede6d8" text-anchor="start" font-weight="400">one GET, text/event-stream →</text>
<line x1="430.0" y1="194.0" x2="430.0" y2="226.0" stroke="#5fb3a1" stroke-width="2"/>
<line x1="520.0" y1="194.0" x2="520.0" y2="226.0" stroke="#5fb3a1" stroke-width="2"/>
<line x1="600.0" y1="194.0" x2="600.0" y2="226.0" stroke="#5fb3a1" stroke-width="2"/>
<line x1="700.0" y1="194.0" x2="700.0" y2="226.0" stroke="#5fb3a1" stroke-width="2"/>
<line x1="790.0" y1="194.0" x2="790.0" y2="226.0" stroke="#5fb3a1" stroke-width="2"/>
<text x="610.0" y="240.0" font-size="9.5" fill="#a69d8e" text-anchor="middle" font-weight="400">server→client events only; auto-reconnect with Last-Event-ID</text>
<rect x="180.0" y="278.0" width="110.0" height="24.0" rx="4" fill="#a69d8e" fill-opacity="0.15" stroke="#a69d8e" stroke-width="1"/>
<text x="235.0" y="294.0" font-size="9.5" fill="#ede6d8" text-anchor="middle" font-weight="400">HTTP Upgrade</text>
<rect x="300.0" y="278.0" width="530.0" height="24.0" rx="4" fill="#9b8cff" fill-opacity="0.12" stroke="#9b8cff" stroke-width="1"/>
<text x="340.0" y="295.0" font-size="13" fill="#9b8cff" text-anchor="middle" font-weight="700">↓</text>
<text x="420.0" y="295.0" font-size="13" fill="#d77fa1" text-anchor="middle" font-weight="700">↑</text>
<text x="480.0" y="295.0" font-size="13" fill="#9b8cff" text-anchor="middle" font-weight="700">↓</text>
<text x="560.0" y="295.0" font-size="13" fill="#d77fa1" text-anchor="middle" font-weight="700">↑</text>
<text x="640.0" y="295.0" font-size="13" fill="#9b8cff" text-anchor="middle" font-weight="700">↓</text>
<text x="700.0" y="295.0" font-size="13" fill="#d77fa1" text-anchor="middle" font-weight="700">↑</text>
<text x="780.0" y="295.0" font-size="13" fill="#9b8cff" text-anchor="middle" font-weight="700">↓</text>
<text x="565.0" y="320.0" font-size="9.5" fill="#a69d8e" text-anchor="middle" font-weight="400">full-duplex frames both ways over one TCP connection</text>
<text x="40.0" y="360.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">Each step right trades simplicity and HTTP compatibility for lower overhead and more capability.</text>
</svg>
