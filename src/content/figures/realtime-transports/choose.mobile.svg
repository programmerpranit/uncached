<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 395" width="360" height="395" role="img" aria-label="Decision guide: frequent client-to-server messages point to WebSocket; one-way server push points to SSE; long polling when streaming is blocked; plain polling when updates are rare" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="395" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Picking a transport</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">start from the traffic direction</text>
<rect x="16.0" y="84.0" width="328.0" height="52.0" rx="3" fill="#9b8cff" fill-opacity="0.1" stroke="#9b8cff" stroke-width="1"/>
<text x="180.0" y="113.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="28.0" y="105.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">Two-way, frequent client msgs</text>
<text x="28.0" y="124.0" font-size="11.5" fill="#9b8cff" text-anchor="start" font-weight="700">→ WebSocket</text>
<rect x="16.0" y="146.0" width="328.0" height="52.0" rx="3" fill="#5fb3a1" fill-opacity="0.1" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="175.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="28.0" y="167.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">Server → client stream</text>
<text x="28.0" y="186.0" font-size="11.5" fill="#5fb3a1" text-anchor="start" font-weight="700">→ SSE</text>
<rect x="16.0" y="208.0" width="328.0" height="52.0" rx="3" fill="#ff5b2e" fill-opacity="0.1" stroke="#ff5b2e" stroke-width="1"/>
<text x="180.0" y="237.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="28.0" y="229.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">Streaming blocked by proxies</text>
<text x="28.0" y="248.0" font-size="11.5" fill="#ff5b2e" text-anchor="start" font-weight="700">→ Long polling</text>
<rect x="16.0" y="270.0" width="328.0" height="52.0" rx="3" fill="#a69d8e" fill-opacity="0.1" stroke="#a69d8e" stroke-width="1"/>
<text x="180.0" y="299.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="28.0" y="291.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">Updates rarely needed</text>
<text x="28.0" y="310.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="700">→ Plain polling</text>
<text x="16.0" y="346.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">Prefer SSE over HTTP/2 for</text>
<text x="16.0" y="365.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">one-way push.</text>
</svg>
