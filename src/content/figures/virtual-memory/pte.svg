<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 389" width="880" height="389" role="img" aria-label="Layout of an x86-64 page table entry: frame number, present, writable, user, accessed, dirty and no-execute bits" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="389" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">What's in a page table entry (x86-64, simplified)</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">64 bits: a physical frame number plus permission and status bits</text>
<rect x="40.0" y="84.0" width="56.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<text x="68.0" y="101.0" font-size="12" fill="#e5534b" text-anchor="middle" font-weight="600">NX</text>
<text x="68.0" y="117.0" font-size="10" fill="#e5534b" text-anchor="middle" font-weight="400">63</text>
<rect x="100.0" y="84.0" width="326.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="263.0" y="101.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">frame number</text>
<text x="263.0" y="117.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">51–12</text>
<rect x="430.0" y="84.0" width="56.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="458.0" y="101.0" font-size="12" fill="#e2b45a" text-anchor="middle" font-weight="600">D</text>
<text x="458.0" y="117.0" font-size="10" fill="#e2b45a" text-anchor="middle" font-weight="400">6</text>
<rect x="490.0" y="84.0" width="56.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="518.0" y="101.0" font-size="12" fill="#e2b45a" text-anchor="middle" font-weight="600">A</text>
<text x="518.0" y="117.0" font-size="10" fill="#e2b45a" text-anchor="middle" font-weight="400">5</text>
<rect x="550.0" y="84.0" width="66.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="583.0" y="101.0" font-size="12" fill="#9b8cff" text-anchor="middle" font-weight="600">U/S</text>
<text x="583.0" y="117.0" font-size="10" fill="#9b8cff" text-anchor="middle" font-weight="400">2</text>
<rect x="620.0" y="84.0" width="66.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="653.0" y="101.0" font-size="12" fill="#5fb3a1" text-anchor="middle" font-weight="600">R/W</text>
<text x="653.0" y="117.0" font-size="10" fill="#5fb3a1" text-anchor="middle" font-weight="400">1</text>
<rect x="690.0" y="84.0" width="56.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="718.0" y="101.0" font-size="12" fill="#7cc47f" text-anchor="middle" font-weight="600">P</text>
<text x="718.0" y="117.0" font-size="10" fill="#7cc47f" text-anchor="middle" font-weight="400">0</text>
<text x="40.0" y="158.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="700">NX</text>
<text x="170.0" y="158.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">no-execute: fault on instruction fetch</text>
<text x="40.0" y="182.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="700">frame number</text>
<text x="170.0" y="182.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">physical address of the 4 KiB frame</text>
<text x="40.0" y="206.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="700">D</text>
<text x="170.0" y="206.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">dirty: page has been written</text>
<text x="40.0" y="230.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="700">A</text>
<text x="170.0" y="230.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">accessed: page has been read or written</text>
<text x="40.0" y="254.0" font-size="12" fill="#9b8cff" text-anchor="start" font-weight="700">U/S</text>
<text x="170.0" y="254.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">user-mode accessible</text>
<text x="40.0" y="278.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="700">R/W</text>
<text x="170.0" y="278.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">writable (cleared for COW / read-only)</text>
<text x="40.0" y="302.0" font-size="12" fill="#7cc47f" text-anchor="start" font-weight="700">P</text>
<text x="170.0" y="302.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">present: if 0, any access faults</text>
<text x="40.0" y="340.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">The MMU checks P, R/W, U/S and NX on every access and raises a page fault if one fails. It sets A and D in</text>
<text x="40.0" y="359.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">hardware; the kernel reads them to decide which pages are cold (reclaim) and which must be written back.</text>
</svg>
