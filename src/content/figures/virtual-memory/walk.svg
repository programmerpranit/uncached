<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 408" width="880" height="408" role="img" aria-label="A 48-bit x86-64 virtual address split into four 9-bit indexes and a 12-bit offset, walking four tables from CR3 to the page" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="408" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5b2e"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2b45a"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b8cff"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker><marker id="ah4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ede6d8"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">x86-64 address translation: a 4-level page walk</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">a 48-bit virtual address is four 9-bit table indexes plus a 12-bit page offset</text>
<rect x="40.0" y="84.0" width="144.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="112.0" y="101.0" font-size="12" fill="#ff5b2e" text-anchor="middle" font-weight="600">PML4</text>
<text x="112.0" y="117.0" font-size="10.5" fill="#ff5b2e" text-anchor="middle" font-weight="400">bits 47–39</text>
<rect x="190.0" y="84.0" width="144.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="262.0" y="101.0" font-size="12" fill="#e2b45a" text-anchor="middle" font-weight="600">PDPT</text>
<text x="262.0" y="117.0" font-size="10.5" fill="#e2b45a" text-anchor="middle" font-weight="400">bits 38–30</text>
<rect x="340.0" y="84.0" width="144.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="412.0" y="101.0" font-size="12" fill="#9b8cff" text-anchor="middle" font-weight="600">PD</text>
<text x="412.0" y="117.0" font-size="10.5" fill="#9b8cff" text-anchor="middle" font-weight="400">bits 29–21</text>
<rect x="490.0" y="84.0" width="144.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="562.0" y="101.0" font-size="12" fill="#5fb3a1" text-anchor="middle" font-weight="600">PT</text>
<text x="562.0" y="117.0" font-size="10.5" fill="#5fb3a1" text-anchor="middle" font-weight="400">bits 20–12</text>
<rect x="640.0" y="84.0" width="164.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="722.0" y="101.0" font-size="12" fill="#7cc47f" text-anchor="middle" font-weight="600">offset</text>
<text x="722.0" y="117.0" font-size="10.5" fill="#7cc47f" text-anchor="middle" font-weight="400">bits 11–0</text>
<text x="40.0" y="150.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">CR3 →</text>
<rect x="90.0" y="170.0" width="120.0" height="130.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="150.0" y="190.0" font-size="11.5" fill="#ff5b2e" text-anchor="middle" font-weight="600">PML4 table</text>
<text x="150.0" y="206.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">512 × 8 B = 4 KiB</text>
<rect x="98.0" y="220.0" width="104.0" height="14.0" rx="2" fill="#ff5b2e" fill-opacity="0.35" stroke="#ff5b2e" stroke-width="1"/>
<line x1="150.0" y1="124.0" x2="150.0" y2="168.0" stroke="#ff5b2e" stroke-width="1" marker-end="url(#ah0)" stroke-dasharray="3 3"/>
<line x1="202.0" y1="227.0" x2="250.0" y2="190.0" stroke="#ff5b2e" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="250.0" y="170.0" width="120.0" height="130.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="310.0" y="190.0" font-size="11.5" fill="#e2b45a" text-anchor="middle" font-weight="600">PDPT table</text>
<text x="310.0" y="206.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">512 × 8 B = 4 KiB</text>
<rect x="258.0" y="238.0" width="104.0" height="14.0" rx="2" fill="#e2b45a" fill-opacity="0.35" stroke="#e2b45a" stroke-width="1"/>
<line x1="310.0" y1="124.0" x2="310.0" y2="168.0" stroke="#e2b45a" stroke-width="1" marker-end="url(#ah1)" stroke-dasharray="3 3"/>
<line x1="362.0" y1="245.0" x2="410.0" y2="190.0" stroke="#e2b45a" stroke-width="1.2" marker-end="url(#ah1)"/>
<rect x="410.0" y="170.0" width="120.0" height="130.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="470.0" y="190.0" font-size="11.5" fill="#9b8cff" text-anchor="middle" font-weight="600">PD table</text>
<text x="470.0" y="206.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">512 × 8 B = 4 KiB</text>
<rect x="418.0" y="256.0" width="104.0" height="14.0" rx="2" fill="#9b8cff" fill-opacity="0.35" stroke="#9b8cff" stroke-width="1"/>
<line x1="470.0" y1="124.0" x2="470.0" y2="168.0" stroke="#9b8cff" stroke-width="1" marker-end="url(#ah2)" stroke-dasharray="3 3"/>
<line x1="522.0" y1="263.0" x2="570.0" y2="190.0" stroke="#9b8cff" stroke-width="1.2" marker-end="url(#ah2)"/>
<rect x="570.0" y="170.0" width="120.0" height="130.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="630.0" y="190.0" font-size="11.5" fill="#5fb3a1" text-anchor="middle" font-weight="600">PT table</text>
<text x="630.0" y="206.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">512 × 8 B = 4 KiB</text>
<rect x="578.0" y="274.0" width="104.0" height="14.0" rx="2" fill="#5fb3a1" fill-opacity="0.35" stroke="#5fb3a1" stroke-width="1"/>
<line x1="630.0" y1="124.0" x2="630.0" y2="168.0" stroke="#5fb3a1" stroke-width="1" marker-end="url(#ah3)" stroke-dasharray="3 3"/>
<line x1="70.0" y1="154.0" x2="90.0" y2="172.0" stroke="#ede6d8" stroke-width="1.2" marker-end="url(#ah4)"/>
<rect x="730.0" y="240.0" width="120.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="790.0" y="260.0" font-size="12" fill="#7cc47f" text-anchor="middle" font-weight="600">4 KiB page</text>
<text x="790.0" y="276.0" font-size="11" fill="#7cc47f" text-anchor="middle" font-weight="400">+ offset → byte</text>
<line x1="682.0" y1="281.0" x2="730.0" y2="263.0" stroke="#5fb3a1" stroke-width="1.2" marker-end="url(#ah3)"/>
<text x="40.0" y="340.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">CR3 holds the physical address of the top table. Each level's index picks one of 512 entries, which points to the</text>
<text x="40.0" y="359.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">next table. Four dependent memory reads per translation, which is why the TLB caches results. A 2 MiB huge page</text>
<text x="40.0" y="378.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">stops at the PD level (21-bit offset); a 1 GiB page stops at the PDPT. 5-level paging adds a level for 57 bits.</text>
</svg>
