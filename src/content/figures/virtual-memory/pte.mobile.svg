<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 447" width="360" height="447" role="img" aria-label="Layout of an x86-64 page table entry: frame number, present, writable, user, accessed, dirty and no-execute bits" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="447" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">A page table entry</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">frame number + flag bits</text>
<text x="16.0" y="86.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="700">NX</text>
<text x="130.0" y="86.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">bit 63</text>
<text x="16.0" y="104.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">no-execute: fault on instruction fetch</text>
<text x="16.0" y="130.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="700">frame number</text>
<text x="130.0" y="130.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">bits 51–12</text>
<text x="16.0" y="148.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">physical address of the 4 KiB frame</text>
<text x="16.0" y="174.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="700">D</text>
<text x="130.0" y="174.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">bit 6</text>
<text x="16.0" y="192.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">dirty: page has been written</text>
<text x="16.0" y="218.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="700">A</text>
<text x="130.0" y="218.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">bit 5</text>
<text x="16.0" y="236.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">accessed: page has been read or written</text>
<text x="16.0" y="262.0" font-size="12" fill="#9b8cff" text-anchor="start" font-weight="700">U/S</text>
<text x="130.0" y="262.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">bit 2</text>
<text x="16.0" y="280.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">user-mode accessible</text>
<text x="16.0" y="306.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="700">R/W</text>
<text x="130.0" y="306.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">bit 1</text>
<text x="16.0" y="324.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">writable (cleared for COW / read-only)</text>
<text x="16.0" y="350.0" font-size="12" fill="#7cc47f" text-anchor="start" font-weight="700">P</text>
<text x="130.0" y="350.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">bit 0</text>
<text x="16.0" y="368.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">present: if 0, any access faults</text>
<text x="16.0" y="398.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">MMU checks P, R/W, U/S, NX on</text>
<text x="16.0" y="417.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">every access; sets A and D itself.</text>
</svg>
