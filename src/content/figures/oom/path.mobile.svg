<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 373" width="360" height="373" role="img" aria-label="Stages as memory runs out: background reclaim, direct reclaim, thrashing, OOM kill and recovery" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="373" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Running out of memory</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">reclaim first, kill last</text>
<circle cx="26.0" cy="86.0" r="10" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1.5"/>
<text x="26.0" y="90.0" font-size="10.5" fill="#7cc47f" text-anchor="middle" font-weight="700">1</text>
<text x="44.0" y="90.0" font-size="11.5" fill="#7cc47f" text-anchor="start" font-weight="400">below watermark: kswapd</text>
<circle cx="26.0" cy="124.0" r="10" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1.5"/>
<text x="26.0" y="128.0" font-size="10.5" fill="#e2b45a" text-anchor="middle" font-weight="700">2</text>
<text x="44.0" y="128.0" font-size="11.5" fill="#e2b45a" text-anchor="start" font-weight="400">direct reclaim in the fault</text>
<circle cx="26.0" cy="162.0" r="10" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1.5"/>
<text x="26.0" y="166.0" font-size="10.5" fill="#e5534b" text-anchor="middle" font-weight="700">3</text>
<text x="44.0" y="166.0" font-size="11.5" fill="#e5534b" text-anchor="start" font-weight="400">no progress: thrashing</text>
<circle cx="26.0" cy="200.0" r="10" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1.5"/>
<text x="26.0" y="204.0" font-size="10.5" fill="#e5534b" text-anchor="middle" font-weight="700">4</text>
<text x="44.0" y="204.0" font-size="11.5" fill="#e5534b" text-anchor="start" font-weight="400">OOM killer: SIGKILL</text>
<circle cx="26.0" cy="238.0" r="10" fill="#2f2921" fill-opacity="1" stroke="#a69d8e" stroke-width="1.5"/>
<text x="26.0" y="242.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="700">5</text>
<text x="44.0" y="242.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">freed; allocation retried</text>
<text x="16.0" y="286.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Thrashing before the kill can</text>
<text x="16.0" y="305.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">freeze a box for minutes.</text>
<text x="16.0" y="324.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">systemd-oomd / earlyoom act</text>
<text x="16.0" y="343.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">earlier using PSI.</text>
</svg>
