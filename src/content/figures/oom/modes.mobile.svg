<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 309" width="360" height="309" role="img" aria-label="The three vm.overcommit_memory policies: heuristic, always and strict" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="309" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">overcommit_memory</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">how allocations are checked</text>
<text x="16.0" y="86.0" font-size="12.5" fill="#e2b45a" text-anchor="start" font-weight="700">0 (default)  heuristic</text>
<text x="16.0" y="106.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">refuse only absurd requests</text>
<text x="16.0" y="137.0" font-size="12.5" fill="#e5534b" text-anchor="start" font-weight="700">1  always</text>
<text x="16.0" y="157.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">never refuse (Redis: fork works)</text>
<text x="16.0" y="188.0" font-size="12.5" fill="#7cc47f" text-anchor="start" font-weight="700">2  strict</text>
<text x="16.0" y="208.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">refuse beyond swap + 50% RAM;</text>
<text x="16.0" y="225.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">malloc can return NULL</text>
<text x="16.0" y="260.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Most systems run 0 and rely on</text>
<text x="16.0" y="279.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">the OOM killer.</text>
</svg>
