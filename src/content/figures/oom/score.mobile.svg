<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 363" width="360" height="363" role="img" aria-label="Example OOM scores for processes with different memory use and oom_score_adj" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="363" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Who gets killed</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">memory share + oom_score_adj</text>
<text x="16.0" y="86.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">java (8 GiB RSS)</text>
<text x="16.0" y="103.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">adj 0</text>
<rect x="200.0" y="80.0" width="60.0" height="14.0" rx="3" fill="#e5534b" fill-opacity="0.7" stroke="#e5534b" stroke-width="1"/>
<text x="266.0" y="92.0" font-size="11" fill="#e5534b" text-anchor="start" font-weight="700">≈ 500</text>
<text x="16.0" y="132.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">postgres (3 GiB)</text>
<text x="16.0" y="149.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">adj −900 (protected)</text>
<rect x="200.0" y="126.0" width="1.2" height="14.0" rx="3" fill="#7cc47f" fill-opacity="0.7" stroke="#7cc47f" stroke-width="1"/>
<text x="207.2" y="138.0" font-size="11" fill="#7cc47f" text-anchor="start" font-weight="700">≈ 0</text>
<text x="16.0" y="178.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">batch job (2 GiB)</text>
<text x="16.0" y="195.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">adj +500 (expendable)</text>
<rect x="200.0" y="172.0" width="74.4" height="14.0" rx="3" fill="#e5534b" fill-opacity="0.7" stroke="#e5534b" stroke-width="1"/>
<text x="280.4" y="184.0" font-size="11" fill="#e5534b" text-anchor="start" font-weight="700">≈ 620</text>
<text x="16.0" y="224.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">sshd (10 MiB)</text>
<text x="16.0" y="241.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">adj −1000 (never)</text>
<text x="200.0" y="230.0" font-size="11" fill="#7cc47f" text-anchor="start" font-weight="700">never killed</text>
<text x="16.0" y="276.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Highest score dies. Kubernetes</text>
<text x="16.0" y="295.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">sets adj by QoS class. A cgroup</text>
<text x="16.0" y="314.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">at memory.max only kills inside</text>
<text x="16.0" y="333.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">that cgroup.</text>
</svg>
