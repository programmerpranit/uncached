<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 341" width="880" height="341" role="img" aria-label="The three vm.overcommit_memory policies: heuristic, always and strict" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="341" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">vm.overcommit_memory: three policies</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">how the kernel answers "can I have this memory?"</text>
<rect x="40.0" y="84.0" width="800.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="56.0" y="104.0" font-size="13" fill="#e2b45a" text-anchor="start" font-weight="700">0 (default)</text>
<text x="56.0" y="122.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">heuristic</text>
<text x="220.0" y="112.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">refuse only obviously impossible requests; almost always succeeds</text>
<rect x="40.0" y="144.0" width="800.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<text x="56.0" y="164.0" font-size="13" fill="#e5534b" text-anchor="start" font-weight="700">1</text>
<text x="56.0" y="182.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">always</text>
<text x="220.0" y="172.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">never refuse; Redis recommends it so fork() for snapshots works</text>
<rect x="40.0" y="204.0" width="800.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="56.0" y="224.0" font-size="13" fill="#7cc47f" text-anchor="start" font-weight="700">2</text>
<text x="56.0" y="242.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">strict</text>
<text x="220.0" y="232.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">refuse when commit &gt; swap + RAM × overcommit_ratio (50%); malloc can return NULL</text>
<text x="40.0" y="292.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Mode 2 moves failures to allocation time, where programs can handle them, at the cost of refusing memory that</text>
<text x="40.0" y="311.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">would never have been used. Most Linux systems run mode 0 and rely on the OOM killer when reality catches up.</text>
</svg>
