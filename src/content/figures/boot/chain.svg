<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 398" width="880" height="398" role="img" aria-label="Boot chain from firmware to bootloader, kernel, initramfs, systemd and finally login or the workload" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="398" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a4136"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">From power button to login prompt</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">each stage loads, verifies and hands control to the next</text>
<rect x="40.0" y="100.0" width="240.0" height="56.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="160.0" y="125.0" font-size="12.5" fill="#e2b45a" text-anchor="middle" font-weight="600">firmware (UEFI / BIOS)</text>
<text x="160.0" y="141.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="400">self test, init RAM + devices</text>
<rect x="320.0" y="100.0" width="240.0" height="56.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="440.0" y="125.0" font-size="12.5" fill="#9b8cff" text-anchor="middle" font-weight="600">bootloader (GRUB, systemd-boot)</text>
<text x="440.0" y="141.0" font-size="11" fill="#9b8cff" text-anchor="middle" font-weight="400">load kernel + initramfs</text>
<rect x="600.0" y="100.0" width="240.0" height="56.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="720.0" y="125.0" font-size="12.5" fill="#5fb3a1" text-anchor="middle" font-weight="600">kernel</text>
<text x="720.0" y="141.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="400">paging, drivers, scheduler</text>
<rect x="600.0" y="210.0" width="240.0" height="56.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#d77fa1" stroke-width="1"/>
<text x="720.0" y="235.0" font-size="12.5" fill="#d77fa1" text-anchor="middle" font-weight="600">initramfs</text>
<text x="720.0" y="251.0" font-size="11" fill="#d77fa1" text-anchor="middle" font-weight="400">unlock + mount real root</text>
<rect x="320.0" y="210.0" width="240.0" height="56.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="440.0" y="235.0" font-size="12.5" fill="#7cc47f" text-anchor="middle" font-weight="600">init: systemd (PID 1)</text>
<text x="440.0" y="251.0" font-size="11" fill="#7cc47f" text-anchor="middle" font-weight="400">services in dependency order</text>
<rect x="40.0" y="210.0" width="240.0" height="56.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="160.0" y="235.0" font-size="12.5" fill="#ede6d8" text-anchor="middle" font-weight="600">login / your app</text>
<text x="160.0" y="251.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">getty, GUI, or the workload</text>
<line x1="282.0" y1="128.0" x2="318.0" y2="128.0" stroke="#4a4136" stroke-width="1.3" marker-end="url(#ah0)"/>
<line x1="562.0" y1="128.0" x2="598.0" y2="128.0" stroke="#4a4136" stroke-width="1.3" marker-end="url(#ah0)"/>
<line x1="720.0" y1="158.0" x2="720.0" y2="208.0" stroke="#4a4136" stroke-width="1.3" marker-end="url(#ah0)"/>
<line x1="598.0" y1="238.0" x2="562.0" y2="238.0" stroke="#4a4136" stroke-width="1.3" marker-end="url(#ah0)"/>
<line x1="318.0" y1="238.0" x2="282.0" y2="238.0" stroke="#4a4136" stroke-width="1.3" marker-end="url(#ah0)"/>
<text x="40.0" y="330.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">CPU starts in a minimal mode at a fixed reset address that maps to firmware flash. Each stage runs with more of</text>
<text x="40.0" y="349.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">the machine initialised than the last: firmware brings up RAM, the kernel brings up virtual memory and drivers,</text>
<text x="40.0" y="368.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">and systemd brings up the userspace that you actually see. Typical server: 10–60 s of firmware, a few s of the rest.</text>
</svg>
