<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 485" width="360" height="485" role="img" aria-label="Boot chain from firmware to bootloader, kernel, initramfs, systemd and finally login or the workload" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="485" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a4136"/></marker></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Boot chain</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">each stage loads the next</text>
<rect x="16.0" y="86.0" width="328.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="105.0" font-size="11.5" fill="#e2b45a" text-anchor="middle" font-weight="600">firmware (UEFI / BIOS)</text>
<text x="180.0" y="121.0" font-size="10.5" fill="#e2b45a" text-anchor="middle" font-weight="400">self test</text>
<line x1="180.0" y1="130.0" x2="180.0" y2="140.0" stroke="#4a4136" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="16.0" y="142.0" width="328.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="180.0" y="161.0" font-size="11.5" fill="#9b8cff" text-anchor="middle" font-weight="600">bootloader (GRUB, systemd-boot)</text>
<text x="180.0" y="177.0" font-size="10.5" fill="#9b8cff" text-anchor="middle" font-weight="400">load kernel + initramfs</text>
<line x1="180.0" y1="186.0" x2="180.0" y2="196.0" stroke="#4a4136" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="16.0" y="198.0" width="328.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="217.0" font-size="11.5" fill="#5fb3a1" text-anchor="middle" font-weight="600">kernel</text>
<text x="180.0" y="233.0" font-size="10.5" fill="#5fb3a1" text-anchor="middle" font-weight="400">paging</text>
<line x1="180.0" y1="242.0" x2="180.0" y2="252.0" stroke="#4a4136" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="16.0" y="254.0" width="328.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#d77fa1" stroke-width="1"/>
<text x="180.0" y="273.0" font-size="11.5" fill="#d77fa1" text-anchor="middle" font-weight="600">initramfs</text>
<text x="180.0" y="289.0" font-size="10.5" fill="#d77fa1" text-anchor="middle" font-weight="400">unlock + mount real root</text>
<line x1="180.0" y1="298.0" x2="180.0" y2="308.0" stroke="#4a4136" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="16.0" y="310.0" width="328.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="180.0" y="329.0" font-size="11.5" fill="#7cc47f" text-anchor="middle" font-weight="600">init: systemd (PID 1)</text>
<text x="180.0" y="345.0" font-size="10.5" fill="#7cc47f" text-anchor="middle" font-weight="400">services in dependency order</text>
<line x1="180.0" y1="354.0" x2="180.0" y2="364.0" stroke="#4a4136" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="16.0" y="366.0" width="328.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="180.0" y="385.0" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">login / your app</text>
<text x="180.0" y="401.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">getty</text>
<text x="16.0" y="436.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Each stage initialises more of</text>
<text x="16.0" y="455.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">the machine and hands off.</text>
</svg>
