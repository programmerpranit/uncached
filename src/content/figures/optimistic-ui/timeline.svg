<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 329" width="880" height="329" role="img" aria-label="Pessimistic UI shows a spinner until the server responds; optimistic UI updates immediately, sends the request in the background, and confirms on success or rolls back on error" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="329" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a4136"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Pessimistic vs optimistic</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">same request, different moment the UI changes</text>
<text x="40.0" y="100.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">time →</text>
<line x1="150.0" y1="96.0" x2="820.0" y2="96.0" stroke="#4a4136" stroke-width="1" marker-end="url(#ah0)"/>
<text x="40.0" y="140.0" font-size="12.5" fill="#e2b45a" text-anchor="start" font-weight="700">Pessimistic</text>
<rect x="150.0" y="122.0" width="70.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="185.0" y="142.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">click</text>
<rect x="224.0" y="122.0" width="420.0" height="32.0" rx="6" fill="#e2b45a" fill-opacity="0.12" stroke="#e2b45a" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="434.0" y="142.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="400">spinner · request in flight (300–2000 ms)</text>
<rect x="648.0" y="122.0" width="170.0" height="32.0" rx="3" fill="#e2b45a" fill-opacity="0.25" stroke="#e2b45a" stroke-width="1"/>
<text x="733.0" y="142.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">UI updates</text>
<text x="40.0" y="212.0" font-size="12.5" fill="#5fb3a1" text-anchor="start" font-weight="700">Optimistic</text>
<rect x="150.0" y="194.0" width="70.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="185.0" y="214.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">click</text>
<rect x="224.0" y="194.0" width="130.0" height="32.0" rx="3" fill="#5fb3a1" fill-opacity="0.25" stroke="#5fb3a1" stroke-width="1"/>
<text x="289.0" y="214.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">UI updates</text>
<rect x="358.0" y="194.0" width="286.0" height="32.0" rx="6" fill="#5fb3a1" fill-opacity="0.08" stroke="#5fb3a1" stroke-width="1" stroke-dasharray="5 4"/>
<text x="501.0" y="214.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="400">request in background</text>
<rect x="648.0" y="180.0" width="170.0" height="26.0" rx="3" fill="#7cc47f" fill-opacity="0.2" stroke="#7cc47f" stroke-width="1"/>
<text x="733.0" y="196.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">200 → confirm</text>
<rect x="648.0" y="212.0" width="170.0" height="26.0" rx="3" fill="#e5534b" fill-opacity="0.2" stroke="#e5534b" stroke-width="1"/>
<text x="733.0" y="228.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">error → roll back</text>
<text x="40.0" y="280.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Optimistic UI applies the expected result immediately and treats the server response as a confirmation.</text>
<text x="40.0" y="299.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Perceived latency drops to zero for the common case; the cost is handling the rare failure honestly.</text>
</svg>
