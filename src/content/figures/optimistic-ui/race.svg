<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img" aria-label="Two quick like and unlike requests whose responses return out of order; applying the late response flips the UI to the wrong state unless stale responses are ignored" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="430" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5b2e"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b8cff"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Out-of-order responses</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">two quick clicks, responses arrive in the wrong order</text>
<text x="220.0" y="100.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="700">client</text>
<text x="760.0" y="100.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="700">server</text>
<line x1="220.0" y1="110.0" x2="220.0" y2="330.0" stroke="#4a4136" stroke-width="1.2"/>
<line x1="760.0" y1="110.0" x2="760.0" y2="330.0" stroke="#4a4136" stroke-width="1.2"/>
<line x1="220.0" y1="130.0" x2="760.0" y2="190.0" stroke="#ff5b2e" stroke-width="1.4" marker-end="url(#ah0)"/>
<text x="400.0" y="136.0" font-size="11" fill="#ff5b2e" text-anchor="start" font-weight="400">PUT like=true  (req 1)</text>
<line x1="220.0" y1="160.0" x2="760.0" y2="220.0" stroke="#9b8cff" stroke-width="1.4" marker-end="url(#ah1)"/>
<text x="300.0" y="214.0" font-size="11" fill="#9b8cff" text-anchor="start" font-weight="400">PUT like=false (req 2)</text>
<line x1="760.0" y1="240.0" x2="220.0" y2="280.0" stroke="#9b8cff" stroke-width="1.4" marker-end="url(#ah1)"/>
<text x="600.0" y="240.0" font-size="11" fill="#9b8cff" text-anchor="start" font-weight="400">ok false</text>
<line x1="760.0" y1="270.0" x2="220.0" y2="310.0" stroke="#ff5b2e" stroke-width="1.4" marker-end="url(#ah0)"/>
<text x="560.0" y="316.0" font-size="11" fill="#ff5b2e" text-anchor="start" font-weight="400">ok true  (late)</text>
<text x="40.0" y="284.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">UI: ♡</text>
<text x="40.0" y="314.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="700">UI: ♥ ✗</text>
<text x="40.0" y="362.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">If the client applies whichever response arrives last, the heart flips back to liked even though the user's last</text>
<text x="40.0" y="381.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">action was unlike. Fixes: ignore responses older than the latest request, cancel the earlier request, or serialize</text>
<text x="40.0" y="400.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">mutations per item. The server can also get them out of order, so send a version or the full intended state.</text>
</svg>
