<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 350" width="360" height="350" role="img" aria-label="A retry budget implemented as a token bucket refilled by successful requests" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="350" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">A retry budget caps the extra load</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">retries ≤ ~10% of requests</text>
<rect x="16.0" y="72.0" width="328.0" height="42.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<text x="180.0" y="97.3" font-size="12" fill="#e5534b" text-anchor="middle" font-weight="600">request fails</text>
<rect x="16.0" y="130.0" width="328.0" height="56.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="155.0" font-size="12" fill="#e2b45a" text-anchor="middle" font-weight="600">retry token bucket</text>
<text x="180.0" y="171.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="400">+0.1 per success, −1 per retry</text>
<rect x="16.0" y="204.0" width="160.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="96.0" y="230.0" font-size="11" fill="#7cc47f" text-anchor="middle" font-weight="600">token → retry</text>
<rect x="184.0" y="204.0" width="160.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<text x="264.0" y="230.0" font-size="11" fill="#e5534b" text-anchor="middle" font-weight="600">empty → fail</text>
<text x="16.0" y="282.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Healthy: rare failures are retried.</text>
<text x="16.0" y="301.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Outage: bucket drains, retries stop,</text>
<text x="16.0" y="320.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">extra load stays near 10%.</text>
</svg>
