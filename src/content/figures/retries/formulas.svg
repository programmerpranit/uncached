<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 344" width="880" height="344" role="img" aria-label="Constant, exponential, full jitter, equal jitter and decorrelated jitter backoff formulas" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="344" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Backoff formulas</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">base = 100 ms, cap = 5 s</text>
<text x="40.0" y="96.0" font-size="13" fill="#e5534b" text-anchor="start" font-weight="700">constant</text>
<text x="200.0" y="96.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">sleep = base</text>
<text x="200.0" y="114.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">simple; hammers a struggling server</text>
<text x="40.0" y="146.0" font-size="13" fill="#e2b45a" text-anchor="start" font-weight="700">exponential</text>
<text x="200.0" y="146.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">sleep = min(cap, base·2ⁿ)</text>
<text x="200.0" y="164.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">backs off, but clients stay in sync</text>
<text x="40.0" y="196.0" font-size="13" fill="#7cc47f" text-anchor="start" font-weight="700">full jitter</text>
<text x="200.0" y="196.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">sleep = random(0, min(cap, base·2ⁿ))</text>
<text x="200.0" y="214.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">spreads load best; AWS recommendation</text>
<text x="40.0" y="246.0" font-size="13" fill="#5fb3a1" text-anchor="start" font-weight="700">equal jitter</text>
<text x="200.0" y="246.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">t = min(cap, base·2ⁿ); sleep = t/2 + random(0, t/2)</text>
<text x="200.0" y="264.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">guarantees some wait</text>
<text x="40.0" y="296.0" font-size="13" fill="#9b8cff" text-anchor="start" font-weight="700">decorrelated</text>
<text x="200.0" y="296.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">sleep = min(cap, random(base, prev·3))</text>
<text x="200.0" y="314.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">grows from the previous sleep</text>
</svg>
