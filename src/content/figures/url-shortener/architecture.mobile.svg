<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 490" width="360" height="490" role="img" aria-label="URL shortener: separate create and redirect paths, an ID allocator, cache and analytics pipeline" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="490" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">URL shortener architecture</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">create path and redirect path</text>
<rect x="16.0" y="72.0" width="328.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="180.0" y="92.0" font-size="12" fill="#ff5b2e" text-anchor="middle" font-weight="600">create API</text>
<text x="180.0" y="108.0" font-size="11" fill="#ff5b2e" text-anchor="middle" font-weight="400">POST /links</text>
<rect x="16.0" y="128.0" width="328.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="180.0" y="148.0" font-size="12" fill="#ff5b2e" text-anchor="middle" font-weight="600">ID allocator</text>
<text x="180.0" y="164.0" font-size="11" fill="#ff5b2e" text-anchor="middle" font-weight="400">ranges of 1,000</text>
<rect x="16.0" y="184.0" width="328.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="204.0" font-size="12" fill="#e2b45a" text-anchor="middle" font-weight="600">links DB</text>
<text x="180.0" y="220.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="400">code → long URL</text>
<rect x="16.0" y="240.0" width="328.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="260.0" font-size="12" fill="#5fb3a1" text-anchor="middle" font-weight="600">redirect service</text>
<text x="180.0" y="276.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="400">GET /:code</text>
<rect x="16.0" y="296.0" width="328.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="316.0" font-size="12" fill="#5fb3a1" text-anchor="middle" font-weight="600">cache</text>
<text x="180.0" y="332.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="400">hot codes, ~all reads</text>
<rect x="16.0" y="352.0" width="328.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="180.0" y="372.0" font-size="12" fill="#9b8cff" text-anchor="middle" font-weight="600">Kafka → analytics</text>
<text x="180.0" y="388.0" font-size="11" fill="#9b8cff" text-anchor="middle" font-weight="400">async click events</text>
<text x="16.0" y="422.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Writes: create API → allocator → DB.</text>
<text x="16.0" y="441.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Reads: redirect → cache → DB on miss,</text>
<text x="16.0" y="460.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">then emit a click event to Kafka.</text>
</svg>
