<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 469" width="880" height="469" role="img" aria-label="URL shortener: separate create and redirect paths, an ID allocator, cache and analytics pipeline" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="469" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5b2e"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b8cff"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">URL shortener architecture</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">write path (create) and read path (redirect)</text>
<rect x="30.0" y="170.0" width="110.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="85.0" y="198.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">clients</text>
<rect x="190.0" y="170.0" width="120.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="250.0" y="198.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">load balancer</text>
<line x1="142.0" y1="194.0" x2="188.0" y2="194.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="370.0" y="90.0" width="170.0" height="56.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="455.0" y="115.0" font-size="12" fill="#ff5b2e" text-anchor="middle" font-weight="600">create API</text>
<text x="455.0" y="131.0" font-size="11" fill="#ff5b2e" text-anchor="middle" font-weight="400">POST /links</text>
<rect x="370.0" y="250.0" width="170.0" height="56.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="455.0" y="275.0" font-size="12" fill="#5fb3a1" text-anchor="middle" font-weight="600">redirect service</text>
<text x="455.0" y="291.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="400">GET /:code</text>
<line x1="312.0" y1="186.0" x2="368.0" y2="118.0" stroke="#ff5b2e" stroke-width="1.2" marker-end="url(#ah1)"/>
<line x1="312.0" y1="202.0" x2="368.0" y2="278.0" stroke="#5fb3a1" stroke-width="1.2" marker-end="url(#ah2)"/>
<rect x="600.0" y="40.0" width="130.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="665.0" y="59.0" font-size="11" fill="#ff5b2e" text-anchor="middle" font-weight="600">ID allocator</text>
<text x="665.0" y="75.0" font-size="11" fill="#ff5b2e" text-anchor="middle" font-weight="400">ranges of 1,000</text>
<line x1="542.0" y1="110.0" x2="598.0" y2="70.0" stroke="#ff5b2e" stroke-width="1.1" marker-end="url(#ah1)"/>
<rect x="620.0" y="150.0" width="230.0" height="60.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="735.0" y="177.0" font-size="13" fill="#e2b45a" text-anchor="middle" font-weight="600">links DB</text>
<text x="735.0" y="193.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="400">code → long URL (KV / sharded)</text>
<line x1="542.0" y1="124.0" x2="618.0" y2="170.0" stroke="#ff5b2e" stroke-width="1.2" marker-end="url(#ah1)"/>
<rect x="600.0" y="250.0" width="140.0" height="56.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="670.0" y="275.0" font-size="12" fill="#5fb3a1" text-anchor="middle" font-weight="600">cache</text>
<text x="670.0" y="291.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="400">hot codes</text>
<line x1="542.0" y1="278.0" x2="598.0" y2="278.0" stroke="#5fb3a1" stroke-width="1.2" marker-end="url(#ah2)"/>
<line x1="670.0" y1="248.0" x2="700.0" y2="212.0" stroke="#5fb3a1" stroke-width="1" marker-end="url(#ah2)" stroke-dasharray="4 3"/>
<text x="712.0" y="236.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">on miss</text>
<rect x="600.0" y="340.0" width="250.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="725.0" y="366.0" font-size="11" fill="#9b8cff" text-anchor="middle" font-weight="600">Kafka → click analytics</text>
<line x1="455.0" y1="308.0" x2="598.0" y2="360.0" stroke="#9b8cff" stroke-width="1" marker-end="url(#ah3)" stroke-dasharray="4 3"/>
<text x="30.0" y="420.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Reads outnumber writes ~100:1, so the redirect path is separate, cached heavily, and records clicks</text>
<text x="30.0" y="439.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">asynchronously so analytics never slows a redirect.</text>
</svg>
