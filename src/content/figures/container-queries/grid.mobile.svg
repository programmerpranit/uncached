<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 359" width="360" height="359" role="img" aria-label="An auto-fit grid with minmax shows three columns in a wide container, two in a medium one and one in a narrow one, with no media queries" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="359" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Intrinsic grid</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">auto-fit + minmax, no breakpoints</text>
<text x="16.0" y="86.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="700">wide → 3 columns</text>
<rect x="16.0" y="94.0" width="328.0" height="40.0" rx="6" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="24.0" y="100.0" width="98.7" height="28.0" rx="4" fill="#ff5b2e" fill-opacity="0.25" stroke="#ff5b2e" stroke-width="1.2"/>
<rect x="130.7" y="100.0" width="98.7" height="28.0" rx="4" fill="#ff5b2e" fill-opacity="0.25" stroke="#ff5b2e" stroke-width="1.2"/>
<rect x="237.3" y="100.0" width="98.7" height="28.0" rx="4" fill="#ff5b2e" fill-opacity="0.25" stroke="#ff5b2e" stroke-width="1.2"/>
<text x="16.0" y="158.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="700">medium → 2 columns</text>
<rect x="16.0" y="166.0" width="220.0" height="40.0" rx="6" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="24.0" y="172.0" width="98.0" height="28.0" rx="4" fill="#ff5b2e" fill-opacity="0.25" stroke="#ff5b2e" stroke-width="1.2"/>
<rect x="130.0" y="172.0" width="98.0" height="28.0" rx="4" fill="#ff5b2e" fill-opacity="0.25" stroke="#ff5b2e" stroke-width="1.2"/>
<text x="16.0" y="230.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="700">narrow → 1 column</text>
<rect x="16.0" y="238.0" width="110.0" height="40.0" rx="6" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="24.0" y="244.0" width="94.0" height="28.0" rx="4" fill="#ff5b2e" fill-opacity="0.25" stroke="#ff5b2e" stroke-width="1.2"/>
<text x="16.0" y="310.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">Columns ≥ 14rem, as many as fit;</text>
<text x="16.0" y="329.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">no breakpoints needed.</text>
</svg>
