<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 430" width="360" height="430" role="img" aria-label="Declare a container with inline-size containment, its width resolves from the parent, container queries match against it, and cqi units size children relative to it" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="430" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Container query setup</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">container → query → units</text>
<rect x="16.0" y="86.0" width="328.0" height="58.0" rx="8" fill="#e2b45a" fill-opacity="0.12" stroke="#e2b45a" stroke-width="1.3"/>
<text x="28.0" y="108.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="700">1. Declare a container</text>
<text x="28.0" y="128.0" font-size="9.5" fill="#e2b45a" text-anchor="start" font-weight="400">.slot { container: card / inline-size }</text>
<rect x="16.0" y="152.0" width="328.0" height="58.0" rx="8" fill="#ff5b2e" fill-opacity="0.12" stroke="#ff5b2e" stroke-width="1.3"/>
<text x="28.0" y="174.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="700">2. Lay out the container</text>
<text x="28.0" y="194.0" font-size="9.5" fill="#ff5b2e" text-anchor="start" font-weight="400">width resolved from parent: 340px</text>
<rect x="16.0" y="218.0" width="328.0" height="58.0" rx="8" fill="#9b8cff" fill-opacity="0.12" stroke="#9b8cff" stroke-width="1.3"/>
<text x="28.0" y="240.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="700">3. Match queries</text>
<text x="28.0" y="260.0" font-size="9.5" fill="#9b8cff" text-anchor="start" font-weight="400">@container card (width &gt; 400px)</text>
<rect x="16.0" y="284.0" width="328.0" height="58.0" rx="8" fill="#5fb3a1" fill-opacity="0.12" stroke="#5fb3a1" stroke-width="1.3"/>
<text x="28.0" y="306.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="700">4. Size with query units</text>
<text x="28.0" y="326.0" font-size="9.5" fill="#5fb3a1" text-anchor="start" font-weight="400">font-size: clamp(1rem, 4cqi, 1.5rem)</text>
<text x="16.0" y="362.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">Inline-size containment stops</text>
<text x="16.0" y="381.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">children affecting the width,</text>
<text x="16.0" y="400.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">so queries cannot loop.</text>
</svg>
