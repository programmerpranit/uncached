<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 471" width="880" height="471" role="img" aria-label="Declare a container with inline-size containment, its width resolves from the parent, container queries match against it, and cqi units size children relative to it" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="471" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">How a container query resolves</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">mark a container, query its size, size children in cq units</text>
<rect x="40.0" y="100.0" width="800.0" height="64.0" rx="8" fill="#e2b45a" fill-opacity="0.12" stroke="#e2b45a" stroke-width="1.3"/>
<text x="56.0" y="124.0" font-size="12.5" fill="#ede6d8" text-anchor="start" font-weight="700">1. Declare a container</text>
<text x="330.0" y="124.0" font-size="11.5" fill="#e2b45a" text-anchor="start" font-weight="400">.slot { container: card / inline-size; }</text>
<text x="330.0" y="146.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">inline-size containment: its width no longer depends on its children</text>
<rect x="40.0" y="176.0" width="800.0" height="64.0" rx="8" fill="#ff5b2e" fill-opacity="0.12" stroke="#ff5b2e" stroke-width="1.3"/>
<text x="56.0" y="200.0" font-size="12.5" fill="#ede6d8" text-anchor="start" font-weight="700">2. Lay out the container</text>
<text x="330.0" y="200.0" font-size="11.5" fill="#ff5b2e" text-anchor="start" font-weight="400">width resolved from the parent: 340px</text>
<text x="330.0" y="222.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">children cannot change it, so there is no loop</text>
<rect x="40.0" y="252.0" width="800.0" height="64.0" rx="8" fill="#9b8cff" fill-opacity="0.12" stroke="#9b8cff" stroke-width="1.3"/>
<text x="56.0" y="276.0" font-size="12.5" fill="#ede6d8" text-anchor="start" font-weight="700">3. Match queries</text>
<text x="330.0" y="276.0" font-size="11.5" fill="#9b8cff" text-anchor="start" font-weight="400">@container card (width &gt; 400px) { … }</text>
<text x="330.0" y="298.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">evaluated against the nearest ancestor named card</text>
<rect x="40.0" y="328.0" width="800.0" height="64.0" rx="8" fill="#5fb3a1" fill-opacity="0.12" stroke="#5fb3a1" stroke-width="1.3"/>
<text x="56.0" y="352.0" font-size="12.5" fill="#ede6d8" text-anchor="start" font-weight="700">4. Size with query units</text>
<text x="330.0" y="352.0" font-size="11.5" fill="#5fb3a1" text-anchor="start" font-weight="400">font-size: clamp(1rem, 4cqi, 1.5rem)</text>
<text x="330.0" y="374.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">1cqi = 1% of the container's inline size</text>
<text x="40.0" y="422.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">A container can't size itself from its contents in the queried axis. That is the price of avoiding a</text>
<text x="40.0" y="441.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">layout cycle, and why you mark wrappers as containers rather than the component itself.</text>
</svg>
