<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 499" width="360" height="499" role="img" aria-label="With a media query the sidebar card is forced into the wide layout because the viewport is wide; with a container query each card adapts to its own container" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="499" fill="#1b1712"/>
