<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 466" width="880" height="466" role="img" aria-label="With a media query the sidebar card is forced into the wide layout because the viewport is wide; with a container query each card adapts to its own container" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="466" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Media query vs container query</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">the same card placed in a narrow sidebar and a wide main column</text>
<text x="40.0" y="104.0" font-size="12.5" fill="#e5534b" text-anchor="start" font-weight="700">@media (min-width: 900px)</text>
<rect x="40.0" y="116.0" width="380.0" height="240.0" rx="8" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1.2"/>
<text x="52.0" y="134.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">viewport 1200px</text>
<rect x="52.0" y="144.0" width="110.0" height="200.0" rx="6" fill="#1b1712" fill-opacity="1" stroke="#4a4136" stroke-width="1" stroke-dasharray="4 3"/>
<text x="58.0" y="160.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">sidebar 220px</text>
<rect x="172.0" y="144.0" width="236.0" height="200.0" rx="6" fill="#1b1712" fill-opacity="1" stroke="#4a4136" stroke-width="1" stroke-dasharray="4 3"/>
<text x="178.0" y="160.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">main 640px</text>
<rect x="58.0" y="170.0" width="98.0" height="70.0" rx="6" fill="#e5534b" fill-opacity="0.12" stroke="#e5534b" stroke-width="1.3"/>
<rect x="62.0" y="176.0" width="40.0" height="58.0" rx="4" fill="#e5534b" fill-opacity="0.35" stroke="None" stroke-width="0"/>
<text x="106.0" y="196.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="700">Card</text>
<text x="106.0" y="212.0" font-size="9" fill="#e5534b" text-anchor="start" font-weight="400">squashed</text>
<rect x="180.0" y="170.0" width="220.0" height="70.0" rx="6" fill="#5fb3a1" fill-opacity="0.12" stroke="#5fb3a1" stroke-width="1.3"/>
<rect x="188.0" y="178.0" width="70.0" height="54.0" rx="4" fill="#5fb3a1" fill-opacity="0.35" stroke="None" stroke-width="0"/>
<text x="268.0" y="198.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="700">Card title</text>
<text x="268.0" y="216.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">image beside text</text>
<text x="460.0" y="104.0" font-size="12.5" fill="#7cc47f" text-anchor="start" font-weight="700">@container (min-width: 400px)</text>
<rect x="460.0" y="116.0" width="380.0" height="240.0" rx="8" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1.2"/>
<text x="472.0" y="134.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">viewport 1200px</text>
<rect x="472.0" y="144.0" width="110.0" height="200.0" rx="6" fill="#1b1712" fill-opacity="1" stroke="#4a4136" stroke-width="1" stroke-dasharray="4 3"/>
<text x="478.0" y="160.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">sidebar 220px</text>
<rect x="592.0" y="144.0" width="236.0" height="200.0" rx="6" fill="#1b1712" fill-opacity="1" stroke="#4a4136" stroke-width="1" stroke-dasharray="4 3"/>
<text x="598.0" y="160.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">main 640px</text>
<rect x="478.0" y="170.0" width="98.0" height="110.0" rx="6" fill="#5fb3a1" fill-opacity="0.12" stroke="#5fb3a1" stroke-width="1.3"/>
<rect x="486.0" y="178.0" width="82.0" height="50.0" rx="4" fill="#5fb3a1" fill-opacity="0.35" stroke="None" stroke-width="0"/>
<text x="488.0" y="248.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="700">Card title</text>
<text x="488.0" y="266.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">image stacked</text>
<rect x="600.0" y="170.0" width="220.0" height="70.0" rx="6" fill="#5fb3a1" fill-opacity="0.12" stroke="#5fb3a1" stroke-width="1.3"/>
<rect x="608.0" y="178.0" width="70.0" height="54.0" rx="4" fill="#5fb3a1" fill-opacity="0.35" stroke="None" stroke-width="0"/>
<text x="688.0" y="198.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="700">Card title</text>
<text x="688.0" y="216.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">image beside text</text>
<text x="40.0" y="382.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Left: the viewport is wide, so every card goes side-by-side, even the one in the sidebar.</text>
<text x="40.0" y="401.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Right: each card asks its own container, so the sidebar card stacks.</text>
<text x="40.0" y="436.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">Components become portable: the same card works in any slot without the page knowing about it.</text>
</svg>
