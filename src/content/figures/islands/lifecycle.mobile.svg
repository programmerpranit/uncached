<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 497" width="360" height="497" role="img" aria-label="Islands are server-rendered to HTML with serialized props, the browser paints immediately, and each island fetches and hydrates its own chunk when its trigger fires" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="497" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Island lifecycle</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">render → ship → wake</text>
<rect x="16.0" y="86.0" width="328.0" height="50.0" rx="6" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1.2"/>
<text x="28.0" y="106.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="700">1. Build</text>
<text x="28.0" y="124.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">each island gets its own chunk</text>
<rect x="16.0" y="144.0" width="328.0" height="50.0" rx="6" fill="#ff5b2e" fill-opacity="0.15" stroke="#ff5b2e" stroke-width="1.2"/>
<text x="28.0" y="164.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="700">2. Server render</text>
<text x="28.0" y="182.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">HTML + serialized props per island</text>
<rect x="16.0" y="202.0" width="328.0" height="50.0" rx="6" fill="#5fb3a1" fill-opacity="0.15" stroke="#5fb3a1" stroke-width="1.2"/>
<text x="28.0" y="222.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="700">3. Browser paints</text>
<text x="28.0" y="240.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">content visible, 0 JS run yet</text>
<rect x="16.0" y="260.0" width="328.0" height="50.0" rx="6" fill="#e2b45a" fill-opacity="0.15" stroke="#e2b45a" stroke-width="1.2"/>
<text x="28.0" y="280.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="700">4. Trigger fires</text>
<text x="28.0" y="298.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">load · idle · visible · media</text>
<rect x="16.0" y="318.0" width="328.0" height="50.0" rx="6" fill="#9b8cff" fill-opacity="0.15" stroke="#9b8cff" stroke-width="1.2"/>
<text x="28.0" y="338.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="700">5. Hydrate island</text>
<text x="28.0" y="356.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">fetch chunk, attach to the DOM</text>
<rect x="16.0" y="376.0" width="328.0" height="50.0" rx="6" fill="#7cc47f" fill-opacity="0.15" stroke="#7cc47f" stroke-width="1.2"/>
<text x="28.0" y="396.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="700">6. Interactive</text>
<text x="28.0" y="414.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">others sleep until their trigger</text>
<text x="16.0" y="448.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">Props are serialized into the HTML;</text>
<text x="16.0" y="467.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">the island hydrates in place.</text>
</svg>
