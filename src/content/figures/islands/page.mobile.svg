<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 503" width="360" height="503" role="img" aria-label="A page of static HTML with three interactive islands: search hydrates on load, a gallery when visible, and an add-to-cart button when idle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="503" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Islands on a page</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">HTML everywhere, JS where needed</text>
<rect x="16.0" y="86.0" width="328.0" height="250.0" rx="10" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1.2"/>
<rect x="28.0" y="98.0" width="200.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="128.0" y="116.8" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="600">Header (static)</text>
<rect x="236.0" y="98.0" width="96.0" height="30.0" rx="3" fill="#ff5b2e" fill-opacity="0.25" stroke="#ff5b2e" stroke-width="1"/>
<text x="284.0" y="116.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Search</text>
<rect x="28.0" y="138.0" width="304.0" height="64.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="180.0" y="173.8" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="600">Article body (static)</text>
<rect x="28.0" y="212.0" width="304.0" height="50.0" rx="3" fill="#9b8cff" fill-opacity="0.25" stroke="#9b8cff" stroke-width="1"/>
<text x="180.0" y="240.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Image gallery</text>
<rect x="28.0" y="272.0" width="150.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="103.0" y="300.8" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="600">Footer (static)</text>
<rect x="186.0" y="272.0" width="146.0" height="50.0" rx="3" fill="#e2b45a" fill-opacity="0.25" stroke="#e2b45a" stroke-width="1"/>
<text x="259.0" y="300.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Add to cart</text>
<rect x="16.0" y="352.0" width="12.0" height="12.0" rx="2" fill="#ff5b2e" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="34.0" y="362.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">Search · client:load</text>
<rect x="16.0" y="372.0" width="12.0" height="12.0" rx="2" fill="#9b8cff" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="34.0" y="382.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">Gallery · client:visible</text>
<rect x="16.0" y="392.0" width="12.0" height="12.0" rx="2" fill="#e2b45a" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="34.0" y="402.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">Cart · client:idle</text>
<rect x="16.0" y="412.0" width="12.0" height="12.0" rx="2" fill="#4a4136" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="34.0" y="422.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">static · 0 kB JS</text>
<text x="16.0" y="454.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">Each island hydrates on its own;</text>
<text x="16.0" y="473.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">the rest is plain HTML.</text>
</svg>
