<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 393" width="360" height="393" role="img" aria-label="Startup JavaScript for a client-rendered SPA and full SSR hydration is large, while an islands page only boots the few interactive components" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="393" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">JS shipped &amp; hydrated</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">three strategies</text>
<text x="16.0" y="100.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="700">SPA (client-rendered)</text>
<rect x="16.0" y="110.0" width="328.0" height="22.0" rx="4" fill="#ff5b2e" fill-opacity="0.35" stroke="#ff5b2e" stroke-width="1.2"/>
<text x="16.0" y="150.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">blank until JS runs</text>
<text x="16.0" y="182.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="700">SSR + full hydration</text>
<rect x="16.0" y="192.0" width="301.8" height="22.0" rx="4" fill="#e2b45a" fill-opacity="0.35" stroke="#e2b45a" stroke-width="1.2"/>
<text x="16.0" y="232.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">visible early, interactive late</text>
<text x="16.0" y="264.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="700">Islands</text>
<rect x="16.0" y="274.0" width="59.0" height="22.0" rx="4" fill="#5fb3a1" fill-opacity="0.35" stroke="#5fb3a1" stroke-width="1.2"/>
<text x="16.0" y="314.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">visible early, interactive early</text>
<text x="16.0" y="344.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">Hydration cost ∝ hydrated tree;</text>
<text x="16.0" y="363.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">islands hydrate only interactive parts.</text>
</svg>
