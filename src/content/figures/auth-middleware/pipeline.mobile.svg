<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 559" width="360" height="559" role="img" aria-label="A request passes request-id, authentication, principal loading and authorization middleware before the handler; authentication can return 401, authorization 403, and each step adds fields to a per-request context" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="559" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ede6d8"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e5534b"/></marker></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">The middleware chain</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">reject early, enrich context</text>
<rect x="16.0" y="92.0" width="220.0" height="44.0" rx="3" fill="#a69d8e" fill-opacity="0.2" stroke="#a69d8e" stroke-width="1"/>
<text x="126.0" y="111.0" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Request ID + logging</text>
<text x="126.0" y="127.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">assign trace id</text>
<line x1="126.0" y1="136.0" x2="126.0" y2="152.0" stroke="#ede6d8" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="16.0" y="152.0" width="220.0" height="44.0" rx="3" fill="#ff5b2e" fill-opacity="0.2" stroke="#ff5b2e" stroke-width="1"/>
<text x="126.0" y="171.0" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Authenticate</text>
<text x="126.0" y="187.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">who is calling?</text>
<line x1="236.0" y1="174.0" x2="262.0" y2="174.0" stroke="#e5534b" stroke-width="1.3" marker-end="url(#ah1)" stroke-dasharray="4 3"/>
<text x="266.0" y="178.0" font-size="11.5" fill="#e5534b" text-anchor="start" font-weight="700">401</text>
<line x1="126.0" y1="196.0" x2="126.0" y2="212.0" stroke="#ede6d8" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="16.0" y="212.0" width="220.0" height="44.0" rx="3" fill="#5fb3a1" fill-opacity="0.2" stroke="#5fb3a1" stroke-width="1"/>
<text x="126.0" y="231.0" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Load principal</text>
<text x="126.0" y="247.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">user, tenant, roles</text>
<line x1="126.0" y1="256.0" x2="126.0" y2="272.0" stroke="#ede6d8" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="16.0" y="272.0" width="220.0" height="44.0" rx="3" fill="#e2b45a" fill-opacity="0.2" stroke="#e2b45a" stroke-width="1"/>
<text x="126.0" y="291.0" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Authorize</text>
<text x="126.0" y="307.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">may they do this?</text>
<line x1="236.0" y1="294.0" x2="262.0" y2="294.0" stroke="#e5534b" stroke-width="1.3" marker-end="url(#ah1)" stroke-dasharray="4 3"/>
<text x="266.0" y="298.0" font-size="11.5" fill="#e5534b" text-anchor="start" font-weight="700">403</text>
<line x1="126.0" y1="316.0" x2="126.0" y2="332.0" stroke="#ede6d8" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="16.0" y="332.0" width="220.0" height="44.0" rx="3" fill="#7cc47f" fill-opacity="0.2" stroke="#7cc47f" stroke-width="1"/>
<text x="126.0" y="351.0" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Handler</text>
<text x="126.0" y="367.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">business logic</text>
<rect x="16.0" y="392.0" width="328.0" height="92.0" rx="8" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1.2"/>
<text x="28.0" y="414.0" font-size="12" fill="#ff5b2e" text-anchor="start" font-weight="700">Request context</text>
<text x="28.0" y="434.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">request_id · principal · tenant</text>
<text x="28.0" y="453.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">scopes · deadline · client_ip</text>
<text x="16.0" y="510.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">Each layer rejects early or adds to</text>
<text x="16.0" y="529.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">the context the handler reads.</text>
</svg>
