<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 482" width="360" height="482" role="img" aria-label="Request context flows from handler to service to repository to outbound calls, passed explicitly or via async-local storage; a global current-user variable lets concurrent requests overwrite each other" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="482" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5b2e"/></marker></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Passing context down</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">explicit or async-local, not global</text>
<rect x="16.0" y="92.0" width="140.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="86.0" y="116.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Handler</text>
<text x="166.0" y="109.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">reads ctx.principal</text>
<line x1="86.0" y1="132.0" x2="86.0" y2="148.0" stroke="#ff5b2e" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="16.0" y="148.0" width="140.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="86.0" y="172.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Service</text>
<text x="166.0" y="165.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">checks ownership,</text>
<text x="166.0" y="179.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">tenant</text>
<line x1="86.0" y1="188.0" x2="86.0" y2="204.0" stroke="#ff5b2e" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="16.0" y="204.0" width="140.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="86.0" y="228.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Repository</text>
<text x="166.0" y="221.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">scopes queries by</text>
<text x="166.0" y="235.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">tenant</text>
<line x1="86.0" y1="244.0" x2="86.0" y2="260.0" stroke="#ff5b2e" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="16.0" y="260.0" width="140.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="86.0" y="284.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Outbound call</text>
<text x="166.0" y="277.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">forwards trace +</text>
<text x="166.0" y="291.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">identity headers</text>
<rect x="16.0" y="322.0" width="328.0" height="62.0" rx="8" fill="#7cc47f" fill-opacity="0.12" stroke="#7cc47f" stroke-width="1"/>
<text x="28.0" y="344.0" font-size="12" fill="#7cc47f" text-anchor="start" font-weight="700">Good</text>
<text x="28.0" y="366.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">parameter or per-request async-local</text>
<rect x="16.0" y="396.0" width="328.0" height="62.0" rx="8" fill="#e5534b" fill-opacity="0.12" stroke="#e5534b" stroke-width="1"/>
<text x="28.0" y="418.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="700">Bad</text>
<text x="28.0" y="440.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">global "currentUser": requests collide</text>
</svg>
