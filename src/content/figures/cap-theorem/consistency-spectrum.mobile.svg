<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 436" width="360" height="436" role="img" aria-label="Consistency models from linearizable to eventual" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="436" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Consistency is a spectrum</text>
<rect x="16.0" y="84.0" width="328.0" height="54.0" rx="3" fill="#ff5b2e" fill-opacity="0.16" stroke="#ff5b2e" stroke-width="1"/>
<text x="30.0" y="104.0" font-size="13" fill="#ff5b2e" text-anchor="start" font-weight="700">Linearizable</text>
<text x="30.0" y="122.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">acts like one copy, always latest</text>
<rect x="16.0" y="146.0" width="328.0" height="54.0" rx="3" fill="#e2b45a" fill-opacity="0.16" stroke="#e2b45a" stroke-width="1"/>
<text x="30.0" y="166.0" font-size="13" fill="#e2b45a" text-anchor="start" font-weight="700">Sequential</text>
<text x="30.0" y="184.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">one global order, not tied to real time</text>
<rect x="16.0" y="208.0" width="328.0" height="54.0" rx="3" fill="#5fb3a1" fill-opacity="0.16" stroke="#5fb3a1" stroke-width="1"/>
<text x="30.0" y="228.0" font-size="13" fill="#5fb3a1" text-anchor="start" font-weight="700">Causal</text>
<text x="30.0" y="246.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">cause before effect, for everyone</text>
<rect x="16.0" y="270.0" width="328.0" height="54.0" rx="3" fill="#9b8cff" fill-opacity="0.16" stroke="#9b8cff" stroke-width="1"/>
<text x="30.0" y="290.0" font-size="13" fill="#9b8cff" text-anchor="start" font-weight="700">Session guarantees</text>
<text x="30.0" y="308.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">read-your-writes, monotonic reads</text>
<rect x="16.0" y="332.0" width="328.0" height="54.0" rx="3" fill="#a69d8e" fill-opacity="0.16" stroke="#a69d8e" stroke-width="1"/>
<text x="30.0" y="352.0" font-size="13" fill="#a69d8e" text-anchor="start" font-weight="700">Eventual</text>
<text x="30.0" y="370.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">replicas converge if writes stop</text>
<text x="16.0" y="406.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">weaker ↓ faster, more available</text>
<text x="16.0" y="70.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">stronger ↑ more coordination, slower</text>
</svg>
