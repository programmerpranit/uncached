<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 318" width="880" height="318" role="img" aria-label="Synchronous replication adds a round trip; asynchronous replication is fast but can be stale" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="318" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5b2e"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2b45a"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">The “else” trade-off: latency vs consistency</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">a write in normal operation, no partition</text>
<text x="30.0" y="92.0" font-size="12" fill="#ff5b2e" text-anchor="start" font-weight="600">Synchronous replication (EC): ack after the replica confirms</text>
<rect x="30.0" y="100.0" width="120.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="90.0" y="124.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">client</text>
<rect x="280.0" y="100.0" width="120.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="340.0" y="124.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">leader</text>
<rect x="590.0" y="100.0" width="140.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="660.0" y="124.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">replica (far)</text>
<line x1="152.0" y1="112.0" x2="278.0" y2="112.0" stroke="#a69d8e" stroke-width="1.3" marker-end="url(#ah0)"/>
<line x1="402.0" y1="112.0" x2="588.0" y2="112.0" stroke="#ff5b2e" stroke-width="1.3" marker-end="url(#ah1)"/>
<line x1="588.0" y1="130.0" x2="402.0" y2="130.0" stroke="#ff5b2e" stroke-width="1.3" marker-end="url(#ah1)"/>
<line x1="278.0" y1="130.0" x2="152.0" y2="130.0" stroke="#a69d8e" stroke-width="1.3" marker-end="url(#ah0)"/>
<text x="495.0" y="162.0" font-size="11" fill="#ff5b2e" text-anchor="middle" font-weight="400">+ 1 cross-region round trip (e.g. 70 ms)</text>
<text x="30.0" y="202.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="600">Asynchronous replication (EL): ack immediately, replicate later</text>
<rect x="30.0" y="210.0" width="120.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="90.0" y="234.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">client</text>
<rect x="280.0" y="210.0" width="120.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="340.0" y="234.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">leader</text>
<rect x="590.0" y="210.0" width="140.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="660.0" y="234.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">replica (far)</text>
<line x1="152.0" y1="222.0" x2="278.0" y2="222.0" stroke="#a69d8e" stroke-width="1.3" marker-end="url(#ah0)"/>
<line x1="278.0" y1="240.0" x2="152.0" y2="240.0" stroke="#a69d8e" stroke-width="1.3" marker-end="url(#ah0)"/>
<line x1="402.0" y1="230.0" x2="588.0" y2="230.0" stroke="#e2b45a" stroke-width="1.3" marker-end="url(#ah2)" stroke-dasharray="5 4"/>
<text x="495.0" y="272.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="400">fast ack — but a read from the replica may be stale,</text>
<text x="495.0" y="288.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="400">and a leader crash can lose acknowledged writes</text>
</svg>
