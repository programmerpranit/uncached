<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 412" width="880" height="412" role="img" aria-label="Consistency models from linearizable to eventual" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="412" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Consistency is a spectrum, not a switch</text>
<text x="30.0" y="80.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">stronger ↑  more coordination, more latency, less available in a partition</text>
<rect x="30.0" y="100.0" width="820.0" height="46.0" rx="3" fill="#ff5b2e" fill-opacity="0.16" stroke="#ff5b2e" stroke-width="1"/>
<text x="44.0" y="120.0" font-size="13" fill="#ff5b2e" text-anchor="start" font-weight="700">Linearizable</text>
<text x="44.0" y="138.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">acts like one copy; reads see the latest write</text>
<rect x="30.0" y="154.0" width="721.6" height="46.0" rx="3" fill="#e2b45a" fill-opacity="0.16" stroke="#e2b45a" stroke-width="1"/>
<text x="44.0" y="174.0" font-size="13" fill="#e2b45a" text-anchor="start" font-weight="700">Sequential</text>
<text x="44.0" y="192.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">one global order, not tied to real time</text>
<rect x="30.0" y="208.0" width="623.2" height="46.0" rx="3" fill="#5fb3a1" fill-opacity="0.16" stroke="#5fb3a1" stroke-width="1"/>
<text x="44.0" y="228.0" font-size="13" fill="#5fb3a1" text-anchor="start" font-weight="700">Causal</text>
<text x="44.0" y="246.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">cause before effect, for everyone</text>
<rect x="30.0" y="262.0" width="524.8" height="46.0" rx="3" fill="#9b8cff" fill-opacity="0.16" stroke="#9b8cff" stroke-width="1"/>
<text x="44.0" y="282.0" font-size="13" fill="#9b8cff" text-anchor="start" font-weight="700">Session guarantees</text>
<text x="44.0" y="300.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">read-your-writes, monotonic reads</text>
<rect x="30.0" y="316.0" width="426.4" height="46.0" rx="3" fill="#a69d8e" fill-opacity="0.16" stroke="#a69d8e" stroke-width="1"/>
<text x="44.0" y="336.0" font-size="13" fill="#a69d8e" text-anchor="start" font-weight="700">Eventual</text>
<text x="44.0" y="354.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">replicas converge if writes stop</text>
<text x="30.0" y="382.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">weaker ↓  faster, available, harder to program against</text>
</svg>
