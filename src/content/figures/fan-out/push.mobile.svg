<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 399" width="360" height="399" role="img" aria-label="Fan-out on write: a post is copied into every follower timeline at write time" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="399" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5b2e"/></marker></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Fan-out on write (push)</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">work happens at post time</text>
<rect x="16.0" y="72.0" width="328.0" height="42.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="180.0" y="97.3" font-size="12" fill="#ff5b2e" text-anchor="middle" font-weight="600">Alice posts</text>
<rect x="16.0" y="130.0" width="328.0" height="42.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="180.0" y="155.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">fan-out workers (queue)</text>
<line x1="180.0" y1="116.0" x2="180.0" y2="128.0" stroke="#ff5b2e" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="16.0" y="190.0" width="328.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="209.8" font-size="10.5" fill="#5fb3a1" text-anchor="middle" font-weight="600">follower 1 timeline ← post id</text>
<rect x="16.0" y="230.0" width="328.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="249.8" font-size="10.5" fill="#5fb3a1" text-anchor="middle" font-weight="600">follower 2 timeline ← post id</text>
<rect x="16.0" y="270.0" width="328.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="289.8" font-size="10.5" fill="#5fb3a1" text-anchor="middle" font-weight="600">follower 3 timeline ← post id</text>
<text x="16.0" y="318.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">… one write per follower</text>
<text x="16.0" y="350.0" font-size="12" fill="#7cc47f" text-anchor="start" font-weight="400">Reads: one lookup, precomputed.</text>
<text x="16.0" y="369.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="400">Writes: cost grows with followers.</text>
</svg>
