<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 349" width="880" height="349" role="img" aria-label="Fan-out on write: a post is copied into every follower timeline at write time" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="349" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5b2e"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7cc47f"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Fan-out on write (push)</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">do the work when a post is created</text>
<rect x="40.0" y="110.0" width="140.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="110.0" y="139.3" font-size="12" fill="#ff5b2e" text-anchor="middle" font-weight="600">Alice posts</text>
<rect x="230.0" y="110.0" width="150.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="305.0" y="132.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">fan-out workers</text>
<text x="305.0" y="148.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">via queue</text>
<line x1="182.0" y1="135.0" x2="228.0" y2="135.0" stroke="#ff5b2e" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="450.0" y="70.0" width="170.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="535.0" y="89.6" font-size="10" fill="#5fb3a1" text-anchor="middle" font-weight="600">follower 1 timeline</text>
<line x1="382.0" y1="135.0" x2="448.0" y2="86.0" stroke="#5fb3a1" stroke-width="1" marker-end="url(#ah1)"/>
<rect x="450.0" y="110.0" width="170.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="535.0" y="129.6" font-size="10" fill="#5fb3a1" text-anchor="middle" font-weight="600">follower 2 timeline</text>
<line x1="382.0" y1="135.0" x2="448.0" y2="126.0" stroke="#5fb3a1" stroke-width="1" marker-end="url(#ah1)"/>
<rect x="450.0" y="150.0" width="170.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="535.0" y="169.6" font-size="10" fill="#5fb3a1" text-anchor="middle" font-weight="600">follower 3 timeline</text>
<line x1="382.0" y1="135.0" x2="448.0" y2="166.0" stroke="#5fb3a1" stroke-width="1" marker-end="url(#ah1)"/>
<rect x="450.0" y="190.0" width="170.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="535.0" y="209.6" font-size="10" fill="#5fb3a1" text-anchor="middle" font-weight="600">follower 4 timeline</text>
<line x1="382.0" y1="135.0" x2="448.0" y2="206.0" stroke="#5fb3a1" stroke-width="1" marker-end="url(#ah1)"/>
<text x="450.0" y="250.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">… one write per follower</text>
<rect x="690.0" y="110.0" width="150.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="765.0" y="132.0" font-size="11" fill="#7cc47f" text-anchor="middle" font-weight="600">Bob opens app</text>
<text x="765.0" y="148.0" font-size="11" fill="#7cc47f" text-anchor="middle" font-weight="400">1 read, precomputed</text>
<line x1="688.0" y1="135.0" x2="622.0" y2="135.0" stroke="#7cc47f" stroke-width="1" marker-end="url(#ah2)" stroke-dasharray="4 3"/>
<text x="40.0" y="300.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">Write cost ∝ followers. Read cost: one lookup of a ready-made list (e.g. a Redis list of post IDs).</text>
<text x="40.0" y="319.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Fast, predictable reads. Wasted work for inactive followers, and slow fan-out for accounts with millions.</text>
</svg>
