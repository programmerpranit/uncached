<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 349" width="880" height="349" role="img" aria-label="Fan-out on read: a timeline is assembled by querying every followed account at read time" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="349" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7cc47f"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2b45a"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Fan-out on read (pull)</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">do the work when a timeline is opened</text>
<rect x="40.0" y="110.0" width="150.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="115.0" y="139.0" font-size="11" fill="#7cc47f" text-anchor="middle" font-weight="600">Bob opens app</text>
<rect x="250.0" y="110.0" width="150.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="325.0" y="139.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">timeline service</text>
<line x1="192.0" y1="135.0" x2="248.0" y2="135.0" stroke="#7cc47f" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="470.0" y="70.0" width="150.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="545.0" y="89.8" font-size="10.5" fill="#e2b45a" text-anchor="middle" font-weight="600">Alice posts</text>
<line x1="402.0" y1="135.0" x2="468.0" y2="86.0" stroke="#e2b45a" stroke-width="1" marker-end="url(#ah1)"/>
<rect x="470.0" y="110.0" width="150.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="545.0" y="129.8" font-size="10.5" fill="#e2b45a" text-anchor="middle" font-weight="600">Carol posts</text>
<line x1="402.0" y1="135.0" x2="468.0" y2="126.0" stroke="#e2b45a" stroke-width="1" marker-end="url(#ah1)"/>
<rect x="470.0" y="150.0" width="150.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="545.0" y="169.8" font-size="10.5" fill="#e2b45a" text-anchor="middle" font-weight="600">Dan posts</text>
<line x1="402.0" y1="135.0" x2="468.0" y2="166.0" stroke="#e2b45a" stroke-width="1" marker-end="url(#ah1)"/>
<rect x="470.0" y="190.0" width="150.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="545.0" y="209.8" font-size="10.5" fill="#e2b45a" text-anchor="middle" font-weight="600">…300 more posts</text>
<line x1="402.0" y1="135.0" x2="468.0" y2="206.0" stroke="#e2b45a" stroke-width="1" marker-end="url(#ah1)"/>
<rect x="690.0" y="110.0" width="150.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="765.0" y="132.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="600">merge + rank</text>
<text x="765.0" y="148.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="400">top 50</text>
<line x1="622.0" y1="135.0" x2="688.0" y2="135.0" stroke="#5fb3a1" stroke-width="1" marker-end="url(#ah2)"/>
<text x="40.0" y="300.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">Write cost: one insert. Read cost ∝ accounts followed: query, merge and rank on every open.</text>
<text x="40.0" y="319.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">No wasted work and fresh results, but reads are slow and expensive, and load scales with page views.</text>
</svg>
