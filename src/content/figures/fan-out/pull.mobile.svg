<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 395" width="360" height="395" role="img" aria-label="Fan-out on read: a timeline is assembled by querying every followed account at read time" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="395" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Fan-out on read (pull)</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">work happens at read time</text>
<rect x="16.0" y="72.0" width="328.0" height="42.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="180.0" y="97.3" font-size="12" fill="#7cc47f" text-anchor="middle" font-weight="600">Bob opens app</text>
<rect x="16.0" y="130.0" width="328.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="149.8" font-size="10.5" fill="#e2b45a" text-anchor="middle" font-weight="600">query Alice’s recent posts</text>
<rect x="16.0" y="170.0" width="328.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="189.8" font-size="10.5" fill="#e2b45a" text-anchor="middle" font-weight="600">query Carol’s recent posts</text>
<rect x="16.0" y="210.0" width="328.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="229.8" font-size="10.5" fill="#e2b45a" text-anchor="middle" font-weight="600">query Dan’s recent posts</text>
<text x="16.0" y="258.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">… one query per followee</text>
<rect x="16.0" y="274.0" width="328.0" height="42.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="299.3" font-size="12" fill="#5fb3a1" text-anchor="middle" font-weight="600">merge + rank → top 50</text>
<text x="16.0" y="346.0" font-size="12" fill="#7cc47f" text-anchor="start" font-weight="400">Writes: one insert.</text>
<text x="16.0" y="365.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="400">Reads: cost grows with followees.</text>
</svg>
