<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 349" width="880" height="349" role="img" aria-label="Hybrid fan-out: push posts from normal users, pull posts from celebrities at read time" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="349" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d77fa1"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">The hybrid: push for most, pull for celebrities</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">precomputed timeline + celebrity posts merged at read time</text>
<rect x="40.0" y="90.0" width="170.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="125.0" y="111.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="600">normal user posts</text>
<text x="125.0" y="127.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="400">~200 followers</text>
<rect x="40.0" y="200.0" width="170.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#d77fa1" stroke-width="1"/>
<text x="125.0" y="221.0" font-size="11" fill="#d77fa1" text-anchor="middle" font-weight="600">celebrity posts</text>
<text x="125.0" y="237.0" font-size="11" fill="#d77fa1" text-anchor="middle" font-weight="400">50M followers</text>
<rect x="300.0" y="90.0" width="200.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="400.0" y="118.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="600">push to follower caches</text>
<rect x="300.0" y="200.0" width="200.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#d77fa1" stroke-width="1"/>
<text x="400.0" y="228.0" font-size="11" fill="#d77fa1" text-anchor="middle" font-weight="600">store once, no fan-out</text>
<line x1="212.0" y1="114.0" x2="298.0" y2="114.0" stroke="#5fb3a1" stroke-width="1.2" marker-end="url(#ah0)"/>
<line x1="212.0" y1="224.0" x2="298.0" y2="224.0" stroke="#d77fa1" stroke-width="1.2" marker-end="url(#ah1)"/>
<rect x="600.0" y="140.0" width="240.0" height="60.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="720.0" y="167.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Bob’s timeline read</text>
<text x="720.0" y="183.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">cached list ∪ followed celebs</text>
<line x1="502.0" y1="114.0" x2="598.0" y2="160.0" stroke="#5fb3a1" stroke-width="1.1" marker-end="url(#ah0)"/>
<line x1="502.0" y1="224.0" x2="598.0" y2="182.0" stroke="#d77fa1" stroke-width="1.1" marker-end="url(#ah1)" stroke-dasharray="4 3"/>
<text x="40.0" y="300.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Twitter’s classic design: tweets from accounts with huge follower counts are not fanned out. At read time the</text>
<text x="40.0" y="319.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">timeline service fetches the few celebrities a user follows and merges them into the precomputed list.</text>
</svg>
