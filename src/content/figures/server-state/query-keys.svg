<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 478" width="880" height="478" role="img" aria-label="Components reading the same query key share one cache entry and request; a mutation invalidates the todos keys so they refetch" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="478" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2b45a"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d77fa1"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">One cache, keyed by query</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">components share entries; mutations invalidate them</text>
<rect x="40.0" y="110.0" width="240.0" height="52.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="160.0" y="133.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">&lt;Header&gt;</text>
<text x="160.0" y="149.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">useQuery(['user'])</text>
<rect x="40.0" y="180.0" width="240.0" height="52.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="160.0" y="203.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">&lt;Avatar&gt;</text>
<text x="160.0" y="219.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">useQuery(['user'])</text>
<rect x="40.0" y="250.0" width="240.0" height="52.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="160.0" y="273.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">&lt;TodoList&gt;</text>
<text x="160.0" y="289.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">useQuery(['todos',{done:false}])</text>
<rect x="40.0" y="320.0" width="240.0" height="52.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="160.0" y="343.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">&lt;TodoCount&gt;</text>
<text x="160.0" y="359.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">useQuery(['todos',{done:false}])</text>
<rect x="380.0" y="110.0" width="250.0" height="262.0" rx="8" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="505.0" y="134.0" font-size="13" fill="#ede6d8" text-anchor="middle" font-weight="700">query cache</text>
<rect x="400.0" y="150.0" width="210.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="505.0" y="172.0" font-size="12" fill="#5fb3a1" text-anchor="middle" font-weight="600">['user']</text>
<text x="505.0" y="188.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="400">fresh</text>
<rect x="400.0" y="232.0" width="210.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="505.0" y="254.0" font-size="11.5" fill="#9b8cff" text-anchor="middle" font-weight="600">['todos',{done:false}]</text>
<text x="505.0" y="270.0" font-size="11" fill="#9b8cff" text-anchor="middle" font-weight="400">stale → refetching</text>
<rect x="400.0" y="310.0" width="210.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="505.0" y="330.0" font-size="11.5" fill="#a69d8e" text-anchor="middle" font-weight="600">['todos',{done:true}]</text>
<text x="505.0" y="346.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">inactive</text>
<line x1="282.0" y1="136.0" x2="396.0" y2="176.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<line x1="282.0" y1="206.0" x2="396.0" y2="176.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<line x1="282.0" y1="276.0" x2="396.0" y2="256.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<line x1="282.0" y1="346.0" x2="396.0" y2="256.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="700.0" y="150.0" width="150.0" height="56.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="775.0" y="175.0" font-size="13" fill="#e2b45a" text-anchor="middle" font-weight="600">API</text>
<text x="775.0" y="191.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="400">one request</text>
<line x1="612.0" y1="256.0" x2="698.0" y2="190.0" stroke="#e2b45a" stroke-width="1.4" marker-end="url(#ah1)"/>
<rect x="700.0" y="250.0" width="150.0" height="70.0" rx="3" fill="#ff5b2e" fill-opacity="0.9" stroke="#ff5b2e" stroke-width="1"/>
<text x="775.0" y="282.0" font-size="12" fill="#1b1712" text-anchor="middle" font-weight="600">useMutation</text>
<text x="775.0" y="298.0" font-size="11" fill="#1b1712" text-anchor="middle" font-weight="400">addTodo()</text>
<path d="M 700 300 C 660 330, 650 290, 614 268" fill="none" stroke="#d77fa1" stroke-width="1.4" marker-end="url(#ah2)"/>
<text x="770.0" y="346.0" font-size="11" fill="#d77fa1" text-anchor="middle" font-weight="400">onSuccess:</text>
<text x="770.0" y="362.0" font-size="11" fill="#d77fa1" text-anchor="middle" font-weight="400">invalidate ['todos']</text>
<text x="40.0" y="410.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Two components asking for the same key share one entry and one in-flight request (deduplication).</text>
<text x="40.0" y="429.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Invalidating the prefix ['todos'] marks every todo query stale: active ones refetch now,</text>
<text x="40.0" y="448.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">inactive ones when next used.</text>
</svg>
