<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 643" width="360" height="643" role="img" aria-label="Client state is owned by the tab and synchronous; server state is a possibly stale copy of data the server owns" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="643" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Two kinds of state</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">ownership decides the tool</text>
<rect x="16.0" y="84.0" width="328.0" height="236.0" rx="8" fill="#ff5b2e" fill-opacity="0.1" stroke="#ff5b2e" stroke-width="1.4"/>
<text x="28.0" y="110.0" font-size="14" fill="#ff5b2e" text-anchor="start" font-weight="700">client state</text>
<text x="28.0" y="130.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">owned by this browser tab</text>
<text x="28.0" y="156.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">• modal open?</text>
<text x="28.0" y="173.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">• selected tab, form draft</text>
<text x="28.0" y="190.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">• theme, sidebar collapsed</text>
<text x="28.0" y="207.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">• undo stack</text>
<text x="28.0" y="234.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">synchronous, always correct</text>
<text x="28.0" y="251.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">lost on reload (unless persisted)</text>
<text x="28.0" y="268.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">tools: useState, context,</text>
<text x="28.0" y="285.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">Zustand, Redux, URL params</text>
<rect x="16.0" y="332.0" width="328.0" height="236.0" rx="8" fill="#5fb3a1" fill-opacity="0.1" stroke="#5fb3a1" stroke-width="1.4"/>
<text x="28.0" y="358.0" font-size="14" fill="#5fb3a1" text-anchor="start" font-weight="700">server state</text>
<text x="28.0" y="378.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">owned by the server; you hold a copy</text>
<text x="28.0" y="404.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">• current user, todo list</text>
<text x="28.0" y="421.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">• product prices</text>
<text x="28.0" y="438.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">• search results</text>
<text x="28.0" y="455.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">• notifications</text>
<text x="28.0" y="482.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">async, can be stale any time</text>
<text x="28.0" y="499.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">shared with other users</text>
<text x="28.0" y="516.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">needs caching, refetching,</text>
<text x="28.0" y="533.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">dedup, invalidation, retries</text>
<text x="16.0" y="594.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Server state is a cache of data</text>
<text x="16.0" y="613.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">someone else owns.</text>
</svg>
