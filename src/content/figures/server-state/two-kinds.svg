<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 469" width="880" height="469" role="img" aria-label="Client state is owned by the tab and synchronous; server state is a possibly stale copy of data the server owns" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="469" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Two different kinds of state</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">who owns it decides how you should manage it</text>
<rect x="40.0" y="96.0" width="390.0" height="290.0" rx="8" fill="#ff5b2e" fill-opacity="0.1" stroke="#ff5b2e" stroke-width="1.4"/>
<text x="58.0" y="126.0" font-size="15" fill="#ff5b2e" text-anchor="start" font-weight="700">client state</text>
<text x="58.0" y="148.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">owned by this browser tab</text>
<text x="58.0" y="182.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">examples</text>
<text x="58.0" y="204.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">• modal open?</text>
<text x="58.0" y="223.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">• selected tab, form draft</text>
<text x="58.0" y="242.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">• theme, sidebar collapsed</text>
<text x="58.0" y="261.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">• undo stack</text>
<text x="58.0" y="296.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">properties</text>
<text x="58.0" y="318.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">synchronous, always correct</text>
<text x="58.0" y="337.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">lost on reload (unless persisted)</text>
<text x="58.0" y="356.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">tools: useState, context,</text>
<text x="58.0" y="375.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">Zustand, Redux, URL params</text>
<rect x="450.0" y="96.0" width="390.0" height="290.0" rx="8" fill="#5fb3a1" fill-opacity="0.1" stroke="#5fb3a1" stroke-width="1.4"/>
<text x="468.0" y="126.0" font-size="15" fill="#5fb3a1" text-anchor="start" font-weight="700">server state</text>
<text x="468.0" y="148.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">owned by the server; you hold a copy</text>
<text x="468.0" y="182.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">examples</text>
<text x="468.0" y="204.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">• current user, todo list</text>
<text x="468.0" y="223.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">• product prices</text>
<text x="468.0" y="242.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">• search results</text>
<text x="468.0" y="261.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">• notifications</text>
<text x="468.0" y="296.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">properties</text>
<text x="468.0" y="318.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">async, can be stale any time</text>
<text x="468.0" y="337.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">shared with other users</text>
<text x="468.0" y="356.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">needs caching, refetching,</text>
<text x="468.0" y="375.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">dedup, invalidation, retries</text>
<text x="40.0" y="420.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Most "state management" pain came from keeping server state in a client store: hand-written loading flags,</text>
<text x="40.0" y="439.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">manual refetching, and copies that silently go stale. Treat it as a cache of the server instead.</text>
</svg>
