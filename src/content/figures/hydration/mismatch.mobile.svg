<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 449" width="360" height="449" role="img" aria-label="Server HTML and the client first render differ, causing a hydration mismatch, with common causes and fixes" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="449" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Hydration mismatch</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">server and client must agree</text>
<rect x="16.0" y="86.0" width="328.0" height="58.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="28.0" y="108.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="700">Server HTML</text>
<text x="28.0" y="130.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">Updated 10:42 UTC</text>
<rect x="16.0" y="154.0" width="328.0" height="58.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="28.0" y="176.0" font-size="12" fill="#9b8cff" text-anchor="start" font-weight="700">Client render</text>
<text x="28.0" y="198.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">Updated 15:42 IST</text>
<rect x="16.0" y="222.0" width="328.0" height="58.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<text x="28.0" y="244.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="700">Result</text>
<text x="28.0" y="266.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">error + client re-render</text>
<text x="16.0" y="306.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="700">Causes</text>
<text x="16.0" y="328.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">dates, random, window reads,</text>
<text x="16.0" y="345.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">invalid nesting, extensions</text>
<text x="16.0" y="380.0" font-size="12" fill="#7cc47f" text-anchor="start" font-weight="700">Fixes</text>
<text x="16.0" y="402.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">same data both sides; client-only</text>
<text x="16.0" y="419.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">values in an effect; useId()</text>
</svg>
