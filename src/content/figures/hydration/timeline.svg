<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="Timeline: HTML arrives and paints, then JavaScript downloads, executes and hydrates before the page becomes interactive" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="420" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">SSR + hydration timeline</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">visible early, interactive only after JS loads and hydrates</text>
<rect x="40.0" y="110.0" width="110.3" height="40.0" rx="3" fill="#5fb3a1" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="95.1" y="135.0" font-size="12" fill="#1b1712" text-anchor="middle" font-weight="600">HTML</text>
<rect x="154.3" y="110.0" width="224.6" height="40.0" rx="3" fill="#e2b45a" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="266.6" y="135.0" font-size="12" fill="#1b1712" text-anchor="middle" font-weight="600">JS download</text>
<rect x="382.9" y="110.0" width="133.1" height="40.0" rx="3" fill="#e2b45a" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="449.4" y="135.0" font-size="12" fill="#1b1712" text-anchor="middle" font-weight="600">parse/exec</text>
<rect x="520.0" y="110.0" width="178.9" height="40.0" rx="3" fill="#9b8cff" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="609.4" y="135.0" font-size="12" fill="#1b1712" text-anchor="middle" font-weight="600">hydrate</text>
<rect x="702.9" y="110.0" width="133.1" height="40.0" rx="3" fill="#7cc47f" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="769.4" y="135.0" font-size="12" fill="#1b1712" text-anchor="middle" font-weight="600">interactive</text>
<line x1="154.3" y1="165.0" x2="154.3" y2="200.0" stroke="#ede6d8" stroke-width="1.2"/>
<text x="154.3" y="218.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="400">FCP / LCP: content painted</text>
<line x1="702.9" y1="165.0" x2="702.9" y2="200.0" stroke="#7cc47f" stroke-width="1.2"/>
<text x="702.9" y="218.0" font-size="11" fill="#7cc47f" text-anchor="middle" font-weight="400">handlers attached</text>
<rect x="154.3" y="240.0" width="548.6" height="34.0" rx="3" fill="#e5534b" fill-opacity="0.15" stroke="#e5534b" stroke-width="1" stroke-dasharray="4 3"/>
<text x="428.6" y="262.0" font-size="11.5" fill="#e5534b" text-anchor="middle" font-weight="400">"uncanny valley": looks ready, clicks do nothing</text>
<rect x="40.0" y="300.0" width="385.0" height="96.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="56.0" y="324.0" font-size="13" fill="#5fb3a1" text-anchor="start" font-weight="700">Server</text>
<text x="56.0" y="348.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">render components to HTML string/stream</text>
<text x="56.0" y="366.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">embed serialized data (props, state)</text>
<text x="56.0" y="384.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">send &lt;script&gt; for the client bundle</text>
<rect x="455.0" y="300.0" width="385.0" height="96.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="471.0" y="324.0" font-size="13" fill="#9b8cff" text-anchor="start" font-weight="700">Client (hydrateRoot)</text>
<text x="471.0" y="348.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">re-run components to rebuild the tree</text>
<text x="471.0" y="366.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">match it against existing DOM nodes</text>
<text x="471.0" y="384.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">attach event listeners, run effects</text>
</svg>
