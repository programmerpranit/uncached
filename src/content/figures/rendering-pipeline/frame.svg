<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 294" width="880" height="294" role="img" aria-label="Timeline of a single frame: input, JavaScript, requestAnimationFrame, style, layout, paint and composite fitting in a 16.7 ms budget" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="294" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Anatomy of a frame</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">at 60 Hz everything must fit in about 16.7 ms</text>
<rect x="40.0" y="110.0" width="49.8" height="40.0" rx="3" fill="#e2b45a" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="66.4" y="135.0" font-size="11" fill="#1b1712" text-anchor="middle" font-weight="600">input</text>
<rect x="92.8" y="110.0" width="195.1" height="40.0" rx="3" fill="#9b8cff" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="191.9" y="135.0" font-size="11" fill="#1b1712" text-anchor="middle" font-weight="600">JS / timers</text>
<rect x="290.9" y="110.0" width="63.0" height="40.0" rx="3" fill="#d77fa1" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="324.0" y="135.0" font-size="11" fill="#1b1712" text-anchor="middle" font-weight="600">rAF</text>
<rect x="357.0" y="110.0" width="89.5" height="40.0" rx="3" fill="#9b8cff" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="403.2" y="135.0" font-size="11" fill="#1b1712" text-anchor="middle" font-weight="600">style</text>
<rect x="449.4" y="110.0" width="115.9" height="40.0" rx="3" fill="#e2b45a" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="508.9" y="135.0" font-size="11" fill="#1b1712" text-anchor="middle" font-weight="600">layout</text>
<rect x="568.3" y="110.0" width="89.5" height="40.0" rx="3" fill="#d77fa1" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="614.5" y="135.0" font-size="11" fill="#1b1712" text-anchor="middle" font-weight="600">paint</text>
<rect x="660.8" y="110.0" width="76.2" height="40.0" rx="3" fill="#5fb3a1" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="700.4" y="135.0" font-size="11" fill="#1b1712" text-anchor="middle" font-weight="600">composite</text>
<line x1="40.0" y1="170.0" x2="740.0" y2="170.0" stroke="#a69d8e" stroke-width="1"/>
<text x="40.0" y="188.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">0 ms</text>
<text x="740.0" y="188.0" font-size="11" fill="#a69d8e" text-anchor="end" font-weight="400">16.7 ms → vsync</text>
<rect x="752.0" y="110.0" width="88.0" height="40.0" rx="3" fill="#e5534b" fill-opacity="0.25" stroke="#e5534b" stroke-width="1" stroke-dasharray="4 3"/>
<text x="796.0" y="135.0" font-size="11" fill="#e5534b" text-anchor="middle" font-weight="400">overrun</text>
<text x="40.0" y="226.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">If a frame's main-thread work runs past vsync, the frame is dropped and the previous one stays on screen (jank).</text>
<text x="40.0" y="245.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">On 120 Hz displays the budget is ~8.3 ms. requestAnimationFrame callbacks run just before style, once per frame.</text>
<text x="40.0" y="264.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Long tasks (&gt; 50 ms) delay both rendering and input handling, which is what INP measures.</text>
</svg>
