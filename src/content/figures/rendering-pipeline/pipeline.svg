<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 391" width="880" height="391" role="img" aria-label="Rendering pipeline stages: parse, style, layout, paint and composite, with the main thread and compositor thread" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="391" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a4136"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">From bytes to pixels</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">the stages a browser runs to turn HTML and CSS into a frame</text>
<rect x="40.0" y="104.0" width="148.0" height="58.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="114.0" y="130.0" font-size="13" fill="#ede6d8" text-anchor="middle" font-weight="600">Parse</text>
<text x="114.0" y="146.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">DOM + CSSOM</text>
<line x1="190.0" y1="133.0" x2="202.0" y2="133.0" stroke="#4a4136" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="204.0" y="104.0" width="148.0" height="58.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="278.0" y="130.0" font-size="13" fill="#9b8cff" text-anchor="middle" font-weight="600">Style</text>
<text x="278.0" y="146.0" font-size="10" fill="#9b8cff" text-anchor="middle" font-weight="400">computed styles</text>
<line x1="354.0" y1="133.0" x2="366.0" y2="133.0" stroke="#4a4136" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="368.0" y="104.0" width="148.0" height="58.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="442.0" y="130.0" font-size="13" fill="#e2b45a" text-anchor="middle" font-weight="600">Layout</text>
<text x="442.0" y="146.0" font-size="10" fill="#e2b45a" text-anchor="middle" font-weight="400">box geometry</text>
<line x1="518.0" y1="133.0" x2="530.0" y2="133.0" stroke="#4a4136" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="532.0" y="104.0" width="148.0" height="58.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#d77fa1" stroke-width="1"/>
<text x="606.0" y="130.0" font-size="13" fill="#d77fa1" text-anchor="middle" font-weight="600">Paint</text>
<text x="606.0" y="146.0" font-size="10" fill="#d77fa1" text-anchor="middle" font-weight="400">draw commands</text>
<line x1="682.0" y1="133.0" x2="694.0" y2="133.0" stroke="#4a4136" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="696.0" y="104.0" width="148.0" height="58.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="770.0" y="130.0" font-size="13" fill="#5fb3a1" text-anchor="middle" font-weight="600">Composite</text>
<text x="770.0" y="146.0" font-size="10" fill="#5fb3a1" text-anchor="middle" font-weight="400">GPU merges layers</text>
<text x="40.0" y="196.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">main thread</text>
<rect x="40.0" y="204.0" width="640.0" height="6.0" rx="3" fill="#9b8cff" fill-opacity="0.5" stroke="none" stroke-width="1"/>
<text x="696.0" y="196.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">compositor + GPU</text>
<rect x="696.0" y="204.0" width="144.0" height="6.0" rx="3" fill="#5fb3a1" fill-opacity="0.6" stroke="none" stroke-width="1"/>
<rect x="40.0" y="240.0" width="385.0" height="66.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="232.5" y="270.0" font-size="12.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Render tree / layout tree</text>
<text x="232.5" y="286.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">visible boxes only: no display:none, plus ::before</text>
<rect x="455.0" y="240.0" width="385.0" height="66.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="647.5" y="270.0" font-size="12.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Layer tree + display lists</text>
<text x="647.5" y="286.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">rasterised into tiles off the main thread</text>
<text x="40.0" y="342.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Each stage consumes the previous one's output, so a change redoes every stage after the first one it touches.</text>
<text x="40.0" y="361.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Chrome also has pre-paint (property trees) and layerize steps; rasterisation happens on worker threads and the GPU.</text>
</svg>
