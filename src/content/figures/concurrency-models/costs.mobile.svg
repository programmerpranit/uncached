<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 368" width="360" height="368" role="img" aria-label="Approximate memory, creation and switch cost of processes, OS threads, green threads and async tasks" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="368" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Rough costs</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">memory, create, switch</text>
<text x="16.0" y="86.0" font-size="12.5" fill="#ff5b2e" text-anchor="start" font-weight="700">process</text>
<text x="16.0" y="103.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">mem: ~1+ MB</text>
<text x="16.0" y="119.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">switch: ~µs + TLB</text>
<text x="16.0" y="138.0" font-size="12.5" fill="#e2b45a" text-anchor="start" font-weight="700">OS thread</text>
<text x="16.0" y="155.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">mem: 1–8 MB stack reserved</text>
<text x="16.0" y="171.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">switch: ~1–2 µs</text>
<text x="16.0" y="190.0" font-size="12.5" fill="#7cc47f" text-anchor="start" font-weight="700">goroutine / virtual thread</text>
<text x="16.0" y="207.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">mem: ~2 KB stack</text>
<text x="16.0" y="223.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">switch: ~100–200 ns</text>
<text x="16.0" y="242.0" font-size="12.5" fill="#5fb3a1" text-anchor="start" font-weight="700">async task (Rust, JS)</text>
<text x="16.0" y="259.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">mem: size of its state machine</text>
<text x="16.0" y="275.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">switch: ~10s of ns</text>
<text x="16.0" y="300.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">10k OS threads is fine; a million</text>
<text x="16.0" y="319.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">is not. A million goroutines fits</text>
<text x="16.0" y="338.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">in a few GB.</text>
</svg>
