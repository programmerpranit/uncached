<text x="350.0" y="218.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">kt4</text>
<rect x="470.0" y="120.0" width="38.0" height="26.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="489.0" y="136.6" font-size="10" fill="#7cc47f" text-anchor="middle" font-weight="600">g1</text>
<rect x="515.0" y="120.0" width="38.0" height="26.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="534.0" y="136.6" font-size="10" fill="#7cc47f" text-anchor="middle" font-weight="600">g2</text>
<rect x="560.0" y="120.0" width="38.0" height="26.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="579.0" y="136.6" font-size="10" fill="#7cc47f" text-anchor="middle" font-weight="600">g3</text>
<rect x="605.0" y="120.0" width="38.0" height="26.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="624.0" y="136.6" font-size="10" fill="#7cc47f" text-anchor="middle" font-weight="600">g4</text>
<rect x="650.0" y="120.0" width="38.0" height="26.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="669.0" y="136.6" font-size="10" fill="#7cc47f" text-anchor="middle" font-weight="600">g5</text>
<rect x="695.0" y="120.0" width="38.0" height="26.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="714.0" y="136.6" font-size="10" fill="#7cc47f" text-anchor="middle" font-weight="600">g6</text>
<rect x="740.0" y="120.0" width="38.0" height="26.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="759.0" y="136.6" font-size="10" fill="#7cc47f" text-anchor="middle" font-weight="600">g7</text>
<rect x="785.0" y="120.0" width="38.0" height="26.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="804.0" y="136.6" font-size="10" fill="#7cc47f" text-anchor="middle" font-weight="600">g8</text>
<rect x="470.0" y="160.0" width="355.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="648.0" y="180.0" font-size="11" fill="#9b8cff" text-anchor="middle" font-weight="400">runtime scheduler (user space)</text>
<line x1="560.0" y1="190.0" x2="560.0" y2="198.0" stroke="#9b8cff" stroke-width="1.2" marker-end="url(#ah1)"/>
<rect x="525.0" y="200.0" width="70.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="560.0" y="218.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">kt1</text>
<line x1="650.0" y1="190.0" x2="650.0" y2="198.0" stroke="#9b8cff" stroke-width="1.2" marker-end="url(#ah1)"/>
<rect x="615.0" y="200.0" width="70.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="650.0" y="218.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">kt2</text>
<line x1="740.0" y1="190.0" x2="740.0" y2="198.0" stroke="#9b8cff" stroke-width="1.2" marker-end="url(#ah1)"/>
<rect x="705.0" y="200.0" width="70.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="740.0" y="218.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">kt3</text>
<rect x="40.0" y="250.0" width="800.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="440.0" y="270.0" font-size="11.5" fill="#a69d8e" text-anchor="middle" font-weight="400">kernel scheduler → CPU cores</text>
<text x="40.0" y="320.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">1:1 is what pthreads, Java platform threads and Rust std::thread use: every thread is a kernel thread, scheduled</text>
<text x="40.0" y="339.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">and preempted by the kernel. M:N runtimes (Go, Erlang, Java virtual threads, Tokio tasks) multiplex many cheap</text>
<text x="40.0" y="358.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">tasks onto a thread per core and switch between them in user space when a task blocks or yields.</text>
</svg>
