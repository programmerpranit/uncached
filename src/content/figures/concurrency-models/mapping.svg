<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 388" width="880" height="388" role="img" aria-label="One-to-one kernel threads versus many green threads multiplexed onto a few kernel threads" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="388" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2b45a"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b8cff"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Who schedules what: 1:1 vs M:N</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">kernel threads (1:1) vs user-space tasks multiplexed onto a few kernel threads (M:N)</text>
<text x="220.0" y="96.0" font-size="13" fill="#e2b45a" text-anchor="middle" font-weight="700">1:1 (OS threads)</text>
<text x="650.0" y="96.0" font-size="13" fill="#7cc47f" text-anchor="middle" font-weight="700">M:N (green threads)</text>
<rect x="60.0" y="120.0" width="70.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="95.0" y="139.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="600">t1</text>
<line x1="95.0" y1="150.0" x2="95.0" y2="198.0" stroke="#e2b45a" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="60.0" y="200.0" width="70.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="95.0" y="218.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">kt1</text>
<rect x="145.0" y="120.0" width="70.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="139.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="600">t2</text>
<line x1="180.0" y1="150.0" x2="180.0" y2="198.0" stroke="#e2b45a" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="145.0" y="200.0" width="70.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="180.0" y="218.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">kt2</text>
<rect x="230.0" y="120.0" width="70.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="265.0" y="139.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="600">t3</text>
<line x1="265.0" y1="150.0" x2="265.0" y2="198.0" stroke="#e2b45a" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="230.0" y="200.0" width="70.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="265.0" y="218.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">kt3</text>
<rect x="315.0" y="120.0" width="70.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
