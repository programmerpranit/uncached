<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 369" width="360" height="369" role="img" aria-label="What processes and threads share versus keep private" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="369" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Shared vs private</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">processes vs threads</text>
<text x="16.0" y="86.0" font-size="13" fill="#ff5b2e" text-anchor="start" font-weight="700">processes</text>
<text x="16.0" y="108.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">each has its own address space,</text>
<text x="16.0" y="126.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">heap, file descriptor table,</text>
<text x="16.0" y="144.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">registers and stack</text>
<text x="16.0" y="186.0" font-size="13" fill="#5fb3a1" text-anchor="start" font-weight="700">threads (same process)</text>
<text x="16.0" y="208.0" font-size="11.5" fill="#7cc47f" text-anchor="start" font-weight="400">share: memory, heap, globals,</text>
<text x="16.0" y="226.0" font-size="11.5" fill="#7cc47f" text-anchor="start" font-weight="400">fds, signal handlers</text>
<text x="16.0" y="244.0" font-size="11.5" fill="#5fb3a1" text-anchor="start" font-weight="400">own: registers, stack, TLS</text>
<text x="16.0" y="282.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Processes: robust, but need IPC.</text>
<text x="16.0" y="301.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Threads: share memory directly,</text>
<text x="16.0" y="320.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">which is fast, and is where</text>
<text x="16.0" y="339.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">data races come from.</text>
</svg>
