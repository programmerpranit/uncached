<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 336" width="360" height="336" role="img" aria-label="When to use processes, OS threads, green threads or async tasks, with examples" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="336" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Choosing a model</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">isolation, scale, workload</text>
<text x="16.0" y="86.0" font-size="12.5" fill="#ff5b2e" text-anchor="start" font-weight="700">processes</text>
<text x="16.0" y="103.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">e.g. Chrome tabs</text>
<text x="16.0" y="130.0" font-size="12.5" fill="#e2b45a" text-anchor="start" font-weight="700">OS threads</text>
<text x="16.0" y="147.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">e.g. thread pools</text>
<text x="16.0" y="174.0" font-size="12.5" fill="#7cc47f" text-anchor="start" font-weight="700">green threads</text>
<text x="16.0" y="191.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">e.g. Go servers</text>
<text x="16.0" y="218.0" font-size="12.5" fill="#5fb3a1" text-anchor="start" font-weight="700">async/await</text>
<text x="16.0" y="235.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">e.g. Node.js</text>
<text x="16.0" y="268.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">They combine: processes for</text>
<text x="16.0" y="287.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">isolation, then threads, green</text>
<text x="16.0" y="306.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">threads or async inside.</text>
</svg>
