<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 423" width="880" height="423" role="img" aria-label="When to use processes, OS threads, green threads or async tasks, with examples" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="423" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Which model fits which job</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">pick by isolation needs, concurrency level and workload type</text>
<rect x="40.0" y="82.0" width="800.0" height="56.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="56.0" y="104.0" font-size="13" fill="#ff5b2e" text-anchor="start" font-weight="700">processes</text>
<text x="220.0" y="104.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">isolation, crash containment, multi-language, sandboxing</text>
<text x="220.0" y="124.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">e.g. Chrome tabs, PostgreSQL backends, pre-fork servers</text>
<rect x="40.0" y="148.0" width="800.0" height="56.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="56.0" y="170.0" font-size="13" fill="#e2b45a" text-anchor="start" font-weight="700">OS threads</text>
<text x="220.0" y="170.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">CPU-bound parallelism, moderate concurrency</text>
<text x="220.0" y="190.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">e.g. thread pools, games, numeric code</text>
<rect x="40.0" y="214.0" width="800.0" height="56.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="56.0" y="236.0" font-size="13" fill="#7cc47f" text-anchor="start" font-weight="700">green threads</text>
<text x="220.0" y="236.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">huge numbers of mostly-waiting I/O tasks, blocking style</text>
<text x="220.0" y="256.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">e.g. Go servers, Erlang/Elixir, Java virtual threads</text>
<rect x="40.0" y="280.0" width="800.0" height="56.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="56.0" y="302.0" font-size="13" fill="#5fb3a1" text-anchor="start" font-weight="700">async/await</text>
<text x="220.0" y="302.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">huge I/O concurrency with minimal memory</text>
<text x="220.0" y="322.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">e.g. Node.js, Rust Tokio, Python asyncio, C#</text>
<text x="40.0" y="374.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">They combine: nginx runs a process per core, each with an event loop; Go runs goroutines on OS threads; Chrome</text>
<text x="40.0" y="393.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">runs processes with many threads each. Choose the boundary for isolation, then the model for concurrency inside.</text>
</svg>
