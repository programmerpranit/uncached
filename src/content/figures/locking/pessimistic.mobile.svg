<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 365" width="360" height="365" role="img" aria-label="Pessimistic locking: transaction A takes a row lock with SELECT FOR UPDATE; transaction B blocks until A commits and then reads the updated value" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="365" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Pessimistic locking</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">lock first; others wait</text>
<rect x="16.0" y="86.0" width="328.0" height="32.0" rx="3" fill="#ff5b2e" fill-opacity="0.15" stroke="#ff5b2e" stroke-width="1"/>
<text x="180.0" y="105.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">A: SELECT … FOR UPDATE</text>
<rect x="16.0" y="128.0" width="328.0" height="32.0" rx="3" fill="#e2b45a" fill-opacity="0.15" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="147.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">B: FOR UPDATE → blocks</text>
<rect x="16.0" y="170.0" width="328.0" height="32.0" rx="3" fill="#ff5b2e" fill-opacity="0.15" stroke="#ff5b2e" stroke-width="1"/>
<text x="180.0" y="189.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">A: UPDATE stock = 4</text>
<rect x="16.0" y="212.0" width="328.0" height="32.0" rx="3" fill="#7cc47f" fill-opacity="0.15" stroke="#7cc47f" stroke-width="1"/>
<text x="180.0" y="231.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">A: COMMIT (lock released)</text>
<rect x="16.0" y="254.0" width="328.0" height="32.0" rx="3" fill="#9b8cff" fill-opacity="0.15" stroke="#9b8cff" stroke-width="1"/>
<text x="180.0" y="273.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">B: reads stock = 4</text>
<text x="16.0" y="316.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">Safe under contention;</text>
<text x="16.0" y="335.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">costs waiting and deadlock risk.</text>
</svg>
