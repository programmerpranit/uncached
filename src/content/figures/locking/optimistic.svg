<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 339" width="880" height="339" role="img" aria-label="Optimistic locking: both transactions read version 7; the first conditional update succeeds and bumps the version to 8; the second matches zero rows and must re-read and retry" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="339" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Optimistic concurrency control</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">read a version, write only if it is unchanged</text>
<text x="40.0" y="110.0" font-size="11" fill="#ff5b2e" text-anchor="start" font-weight="700">A</text>
<text x="40.0" y="170.0" font-size="11" fill="#9b8cff" text-anchor="start" font-weight="700">B</text>
<rect x="70.0" y="92.0" width="150.0" height="30.0" rx="3" fill="#ff5b2e" fill-opacity="0.15" stroke="#ff5b2e" stroke-width="1"/>
<text x="145.0" y="110.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">read v=7, stock=5</text>
<rect x="70.0" y="152.0" width="150.0" height="30.0" rx="3" fill="#9b8cff" fill-opacity="0.15" stroke="#9b8cff" stroke-width="1"/>
<text x="145.0" y="170.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">read v=7, stock=5</text>
<rect x="260.0" y="92.0" width="280.0" height="30.0" rx="3" fill="#ff5b2e" fill-opacity="0.15" stroke="#ff5b2e" stroke-width="1"/>
<text x="400.0" y="110.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">UPDATE … SET v=8 WHERE v=7</text>
<text x="560.0" y="111.0" font-size="11" fill="#7cc47f" text-anchor="start" font-weight="700">1 row ✓</text>
<rect x="330.0" y="152.0" width="280.0" height="30.0" rx="3" fill="#9b8cff" fill-opacity="0.15" stroke="#9b8cff" stroke-width="1"/>
<text x="470.0" y="170.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">UPDATE … SET v=8 WHERE v=7</text>
<text x="630.0" y="171.0" font-size="11" fill="#e5534b" text-anchor="start" font-weight="700">0 rows ✗ → retry</text>
<rect x="330.0" y="206.0" width="280.0" height="30.0" rx="3" fill="#9b8cff" fill-opacity="0.15" stroke="#9b8cff" stroke-width="1"/>
<text x="470.0" y="224.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">re-read v=8, stock=4, retry</text>
<text x="40.0" y="290.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">No locks are held while the user or service thinks. Conflicts are detected at write time,</text>
<text x="40.0" y="309.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">so it shines when conflicts are rare and degrades into retry storms when they are common.</text>
</svg>
