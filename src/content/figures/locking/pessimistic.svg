<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 309" width="880" height="309" role="img" aria-label="Pessimistic locking: transaction A takes a row lock with SELECT FOR UPDATE; transaction B blocks until A commits and then reads the updated value" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="309" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Pessimistic locking</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">lock first, then work: others wait</text>
<text x="40.0" y="110.0" font-size="11" fill="#ff5b2e" text-anchor="start" font-weight="700">Tx A</text>
<text x="40.0" y="190.0" font-size="11" fill="#9b8cff" text-anchor="start" font-weight="700">Tx B</text>
<rect x="100.0" y="92.0" width="200.0" height="30.0" rx="3" fill="#ff5b2e" fill-opacity="0.15" stroke="#ff5b2e" stroke-width="1"/>
<text x="200.0" y="110.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">SELECT … FOR UPDATE</text>
<rect x="304.0" y="92.0" width="180.0" height="30.0" rx="3" fill="#ff5b2e" fill-opacity="0.15" stroke="#ff5b2e" stroke-width="1"/>
<text x="394.0" y="110.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">UPDATE stock = 4</text>
<rect x="488.0" y="92.0" width="100.0" height="30.0" rx="3" fill="#7cc47f" fill-opacity="0.15" stroke="#7cc47f" stroke-width="1"/>
<text x="538.0" y="110.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">COMMIT</text>
<rect x="160.0" y="172.0" width="200.0" height="30.0" rx="3" fill="#9b8cff" fill-opacity="0.15" stroke="#9b8cff" stroke-width="1"/>
<text x="260.0" y="190.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">SELECT … FOR UPDATE</text>
<rect x="364.0" y="172.0" width="224.0" height="30.0" rx="4" fill="#e2b45a" fill-opacity="0.15" stroke="#e2b45a" stroke-width="1" stroke-dasharray="4,3"/>
<text x="476.0" y="191.0" font-size="10" fill="#e2b45a" text-anchor="middle" font-weight="400">blocked, waiting for lock</text>
<rect x="592.0" y="172.0" width="180.0" height="30.0" rx="3" fill="#9b8cff" fill-opacity="0.15" stroke="#9b8cff" stroke-width="1"/>
<text x="682.0" y="190.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">reads stock = 4</text>
<line x1="588.0" y1="122.0" x2="592.0" y2="170.0" stroke="#a69d8e" stroke-width="1" marker-end="url(#ah0)" stroke-dasharray="3,3"/>
<text x="40.0" y="260.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Correct under heavy contention, but holds locks across the work: throughput drops,</text>
<text x="40.0" y="279.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">deadlocks become possible, and a slow client can stall everyone.</text>
</svg>
