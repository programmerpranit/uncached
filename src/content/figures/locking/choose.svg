<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-label="Optimistic locking gives higher throughput at low conflict rates but degrades sharply as conflicts rise; pessimistic locking has steadier throughput and wins on hot rows" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="380" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Which one, when?</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">throughput vs conflict rate</text>
<line x1="80.0" y1="320.0" x2="600.0" y2="320.0" stroke="#a69d8e" stroke-width="1"/>
<line x1="80.0" y1="100.0" x2="80.0" y2="320.0" stroke="#a69d8e" stroke-width="1"/>
<text x="340.0" y="350.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">conflict rate →</text>
<text x="70.0" y="110.0" font-size="10.5" fill="#a69d8e" text-anchor="end" font-weight="400">throughput</text>
<path d="M80,120 C 280,130 380,220 600,310" fill="none" stroke="#ff5b2e" stroke-width="2.5"/>
<path d="M80,180 L 600,220" fill="none" stroke="#9b8cff" stroke-width="2.5"/>
<text x="110.0" y="112.0" font-size="11" fill="#ff5b2e" text-anchor="start" font-weight="700">optimistic</text>
<text x="590.0" y="210.0" font-size="11" fill="#9b8cff" text-anchor="end" font-weight="700">pessimistic</text>
<text x="630.0" y="130.0" font-size="12" fill="#ff5b2e" text-anchor="start" font-weight="700">Optimistic</text>
<text x="630.0" y="152.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">low contention</text>
<text x="630.0" y="171.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">long think time</text>
<text x="630.0" y="190.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">HTTP / ETag</text>
<text x="630.0" y="230.0" font-size="12" fill="#9b8cff" text-anchor="start" font-weight="700">Pessimistic</text>
<text x="630.0" y="252.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">hot rows</text>
<text x="630.0" y="271.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">short transactions</text>
<text x="630.0" y="290.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">retries costly</text>
</svg>
