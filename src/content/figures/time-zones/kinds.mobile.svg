<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 474" width="360" height="474" role="img" aria-label="Three kinds of time: an instant stored as UTC, a local date-time with an IANA zone for future and recurring events, and a plain date with no zone for birthdays" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="474" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Three kinds of "time"</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">pick the type before the storage</text>
<rect x="16.0" y="76.0" width="328.0" height="118.0" rx="3" fill="#5fb3a1" fill-opacity="0.08" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="138.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="28.0" y="98.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="700">Instant</text>
<text x="28.0" y="116.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">a point on the global timeline</text>
<rect x="28.0" y="126.0" width="304.0" height="24.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="180.0" y="142.0" font-size="9.6" fill="#ede6d8" text-anchor="middle" font-weight="400">2026-03-08T10:00:00Z</text>
<text x="28.0" y="168.0" font-size="9.6" fill="#ede6d8" text-anchor="start" font-weight="400">logs, created_at, payments, expiry</text>
<text x="28.0" y="184.0" font-size="9.8" fill="#5fb3a1" text-anchor="start" font-weight="700">store as UTC timestamp</text>
<rect x="16.0" y="204.0" width="328.0" height="118.0" rx="3" fill="#9b8cff" fill-opacity="0.08" stroke="#9b8cff" stroke-width="1"/>
<text x="180.0" y="266.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="28.0" y="226.0" font-size="12" fill="#9b8cff" text-anchor="start" font-weight="700">Local date-time + zone</text>
<text x="28.0" y="244.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">a wall-clock time somewhere</text>
<rect x="28.0" y="254.0" width="304.0" height="24.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="180.0" y="270.0" font-size="9.6" fill="#ede6d8" text-anchor="middle" font-weight="400">2026-11-10 09:00 America/New_York</text>
<text x="28.0" y="296.0" font-size="9.6" fill="#ede6d8" text-anchor="start" font-weight="400">meetings, alarms, store hours, recurring events</text>
<text x="28.0" y="312.0" font-size="9.8" fill="#9b8cff" text-anchor="start" font-weight="700">store local time + IANA zone ID</text>
<rect x="16.0" y="332.0" width="328.0" height="118.0" rx="3" fill="#e2b45a" fill-opacity="0.08" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="394.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="28.0" y="354.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="700">Plain date / time</text>
<text x="28.0" y="372.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">no zone at all</text>
<rect x="28.0" y="382.0" width="304.0" height="24.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="180.0" y="398.0" font-size="9.6" fill="#ede6d8" text-anchor="middle" font-weight="400">1990-05-14  ·  09:00</text>
<text x="28.0" y="424.0" font-size="9.6" fill="#ede6d8" text-anchor="start" font-weight="400">birthdays, holidays, "opens at 9"</text>
<text x="28.0" y="440.0" font-size="9.8" fill="#e2b45a" text-anchor="start" font-weight="700">store as date / time, never convert</text>
</svg>
