<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 316" width="360" height="316" role="img" aria-label="A wall clock reading that jumps backwards when NTP corrects it, next to a monotonic clock that always increases, showing why durations should use the monotonic clock" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="316" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Wall clock vs monotonic clock</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">use the right clock for the job</text>
<rect x="16.0" y="80.0" width="328.0" height="100.0" rx="3" fill="#d77fa1" fill-opacity="0.1" stroke="#d77fa1" stroke-width="1"/>
<text x="180.0" y="133.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="28.0" y="104.0" font-size="12.5" fill="#d77fa1" text-anchor="start" font-weight="700">Wall clock</text>
<text x="28.0" y="124.0" font-size="9.6" fill="#ede6d8" text-anchor="start" font-weight="400">time.time(), Date.now(), now()</text>
<text x="28.0" y="148.0" font-size="9.8" fill="#a69d8e" text-anchor="start" font-weight="400">can jump back or forward (NTP, admin, leap smear).</text>
<text x="28.0" y="164.0" font-size="9.8" fill="#a69d8e" text-anchor="start" font-weight="400">Use for timestamps humans read.</text>
<rect x="16.0" y="192.0" width="328.0" height="100.0" rx="3" fill="#5fb3a1" fill-opacity="0.1" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="245.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="28.0" y="216.0" font-size="12.5" fill="#5fb3a1" text-anchor="start" font-weight="700">Monotonic clock</text>
<text x="28.0" y="236.0" font-size="9.6" fill="#ede6d8" text-anchor="start" font-weight="400">time.monotonic(), performance.now()</text>
<text x="28.0" y="260.0" font-size="9.8" fill="#a69d8e" text-anchor="start" font-weight="400">only moves forward, meaningless across machines.</text>
<text x="28.0" y="276.0" font-size="9.8" fill="#a69d8e" text-anchor="start" font-weight="400">Use for timeouts and durations.</text>
</svg>
