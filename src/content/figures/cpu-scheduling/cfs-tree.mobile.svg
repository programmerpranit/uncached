<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 422" width="360" height="422" role="img" aria-label="Runnable tasks in a red-black tree ordered by vruntime; the leftmost task runs next" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="422" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">CFS: least vruntime runs</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">red-black tree keyed by vruntime</text>
<line x1="180.0" y1="118.0" x2="100.0" y2="160.0" stroke="#4a4136" stroke-width="1.2"/>
<line x1="180.0" y1="118.0" x2="260.0" y2="160.0" stroke="#4a4136" stroke-width="1.2"/>
<line x1="100.0" y1="188.0" x2="56.0" y2="230.0" stroke="#4a4136" stroke-width="1.2"/>
<line x1="100.0" y1="188.0" x2="144.0" y2="230.0" stroke="#4a4136" stroke-width="1.2"/>
<line x1="260.0" y1="188.0" x2="304.0" y2="230.0" stroke="#4a4136" stroke-width="1.2"/>
<rect x="140.0" y="90.0" width="80.0" height="28.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="107.8" font-size="10.5" fill="#e2b45a" text-anchor="middle" font-weight="600">vim 410</text>
<rect x="60.0" y="160.0" width="80.0" height="28.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="100.0" y="177.8" font-size="10.5" fill="#5fb3a1" text-anchor="middle" font-weight="600">make 212</text>
<rect x="220.0" y="160.0" width="80.0" height="28.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="260.0" y="177.8" font-size="10.5" fill="#9b8cff" text-anchor="middle" font-weight="600">java 780</text>
<rect x="16.0" y="230.0" width="80.0" height="28.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="56.0" y="247.8" font-size="10.5" fill="#7cc47f" text-anchor="middle" font-weight="600">ssh 95</text>
<rect x="104.0" y="230.0" width="80.0" height="28.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="144.0" y="247.8" font-size="10.5" fill="#5fb3a1" text-anchor="middle" font-weight="600">gcc 300</text>
<rect x="264.0" y="230.0" width="80.0" height="28.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#d77fa1" stroke-width="1"/>
<text x="304.0" y="247.8" font-size="10.5" fill="#d77fa1" text-anchor="middle" font-weight="600">db 905</text>
<text x="56.0" y="280.0" font-size="11.5" fill="#ff5b2e" text-anchor="start" font-weight="400">↑ leftmost runs next</text>
<text x="16.0" y="316.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">vruntime += ran × 1024 / weight</text>
<text x="16.0" y="354.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Running tasks drift right; a task</text>
<text x="16.0" y="373.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">that slept wakes near the left,</text>
<text x="16.0" y="392.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">clamped so it can't hoard credit.</text>
