<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 409" width="880" height="409" role="img" aria-label="Runnable tasks in a red-black tree ordered by vruntime; the leftmost task runs next" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="409" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">CFS: always run the task that has had the least (weighted) CPU</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">runnable tasks sit in a red-black tree ordered by virtual runtime</text>
<line x1="330.0" y1="124.0" x2="200.0" y2="176.0" stroke="#4a4136" stroke-width="1.2"/>
<line x1="330.0" y1="124.0" x2="460.0" y2="176.0" stroke="#4a4136" stroke-width="1.2"/>
<line x1="200.0" y1="204.0" x2="130.0" y2="256.0" stroke="#4a4136" stroke-width="1.2"/>
<line x1="200.0" y1="204.0" x2="270.0" y2="256.0" stroke="#4a4136" stroke-width="1.2"/>
<line x1="460.0" y1="204.0" x2="530.0" y2="256.0" stroke="#4a4136" stroke-width="1.2"/>
<rect x="275.0" y="96.0" width="110.0" height="28.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="330.0" y="114.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="600">vim 410</text>
<rect x="145.0" y="176.0" width="110.0" height="28.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="200.0" y="194.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="600">make 212</text>
<rect x="405.0" y="176.0" width="110.0" height="28.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="460.0" y="194.0" font-size="11" fill="#9b8cff" text-anchor="middle" font-weight="600">java 780</text>
<rect x="75.0" y="256.0" width="110.0" height="28.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="130.0" y="274.0" font-size="11" fill="#7cc47f" text-anchor="middle" font-weight="600">ssh 95</text>
<rect x="215.0" y="256.0" width="110.0" height="28.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="270.0" y="274.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="600">gcc 300</text>
<rect x="475.0" y="256.0" width="110.0" height="28.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#d77fa1" stroke-width="1"/>
<text x="530.0" y="274.0" font-size="11" fill="#d77fa1" text-anchor="middle" font-weight="600">db 905</text>
<text x="60.0" y="312.0" font-size="11.5" fill="#ff5b2e" text-anchor="start" font-weight="400">↑ leftmost = smallest vruntime → runs next</text>
<text x="620.0" y="110.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">vruntime += ran_ns × 1024 / weight</text>
<text x="620.0" y="148.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">A task that runs accrues vruntime,</text>
<text x="620.0" y="167.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">moves right, and eventually stops</text>
<text x="620.0" y="186.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">being leftmost. A task that sleeps</text>
<text x="620.0" y="205.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">accrues nothing and, when it wakes,</text>
<text x="620.0" y="224.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">is near the left (its vruntime is</text>
<text x="620.0" y="243.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">raised to about the tree minimum</text>
<text x="620.0" y="262.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">so it can't hoard credit).</text>
<text x="40.0" y="360.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Picking the next task is O(1) (cached leftmost node); inserting a task is O(log n). Weights come from nice values,</text>
<text x="40.0" y="379.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">so a high-priority task's vruntime grows more slowly and it gets a larger share.</text>
</svg>
