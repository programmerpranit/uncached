<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 356" width="360" height="356" role="img" aria-label="CPU shares for pairs of tasks with different nice values" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="356" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Nice → weight → share</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">~1.25× weight per nice step</text>
<text x="16.0" y="86.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">nice 0 vs nice 0</text>
<text x="240.0" y="86.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">50% / 50%</text>
<rect x="16.0" y="94.0" width="160.0" height="14.0" rx="3" fill="#5fb3a1" fill-opacity="0.75" stroke="#5fb3a1" stroke-width="1"/>
<rect x="176.0" y="94.0" width="160.0" height="14.0" rx="3" fill="#e2b45a" fill-opacity="0.75" stroke="#e2b45a" stroke-width="1"/>
<text x="16.0" y="134.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">nice 0 vs nice 1</text>
<text x="240.0" y="134.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">56% / 44%</text>
<rect x="16.0" y="142.0" width="177.6" height="14.0" rx="3" fill="#5fb3a1" fill-opacity="0.75" stroke="#5fb3a1" stroke-width="1"/>
<rect x="193.6" y="142.0" width="142.4" height="14.0" rx="3" fill="#e2b45a" fill-opacity="0.75" stroke="#e2b45a" stroke-width="1"/>
<text x="16.0" y="182.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">nice 0 vs nice 5</text>
<text x="240.0" y="182.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">75% / 25%</text>
<rect x="16.0" y="190.0" width="241.0" height="14.0" rx="3" fill="#5fb3a1" fill-opacity="0.75" stroke="#5fb3a1" stroke-width="1"/>
<rect x="257.0" y="190.0" width="79.0" height="14.0" rx="3" fill="#e2b45a" fill-opacity="0.75" stroke="#e2b45a" stroke-width="1"/>
<text x="16.0" y="230.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">nice −10 vs nice 10</text>
<text x="240.0" y="230.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">99% / 1%</text>
<rect x="16.0" y="238.0" width="316.5" height="14.0" rx="3" fill="#5fb3a1" fill-opacity="0.75" stroke="#5fb3a1" stroke-width="1"/>
<rect x="332.5" y="238.0" width="3.5" height="14.0" rx="3" fill="#e2b45a" fill-opacity="0.75" stroke="#e2b45a" stroke-width="1"/>
<text x="16.0" y="288.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">share = weight / Σ weights.</text>
<text x="16.0" y="307.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">cgroups (cpu.weight) use the</text>
<text x="16.0" y="326.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">same idea for containers.</text>
</svg>
