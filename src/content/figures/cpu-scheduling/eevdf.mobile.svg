<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 369" width="360" height="369" role="img" aria-label="EEVDF choosing the eligible task with the earliest virtual deadline" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="369" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">EEVDF picks</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">eligible (lag ≥ 0), then earliest deadline</text>
<text x="16.0" y="90.0" font-size="12.5" fill="#9b8cff" text-anchor="start" font-weight="700">batch job</text>
<text x="140.0" y="90.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">slice 3 ms</text>
<rect x="16.0" y="98.0" width="161.2" height="14.0" rx="3" fill="#9b8cff" fill-opacity="0.4" stroke="#9b8cff" stroke-width="1"/>
<line x1="177.2" y1="94.0" x2="177.2" y2="116.0" stroke="#9b8cff" stroke-width="2"/>
<text x="16.0" y="130.0" font-size="11" fill="#7cc47f" text-anchor="start" font-weight="400">eligible</text>
<text x="16.0" y="152.0" font-size="12.5" fill="#7cc47f" text-anchor="start" font-weight="700">audio thread</text>
<text x="140.0" y="152.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">slice 0.5 ms</text>
<rect x="16.0" y="160.0" width="20.8" height="14.0" rx="3" fill="#7cc47f" fill-opacity="0.4" stroke="#7cc47f" stroke-width="1"/>
<line x1="36.8" y1="156.0" x2="36.8" y2="178.0" stroke="#7cc47f" stroke-width="2"/>
<text x="16.0" y="192.0" font-size="11" fill="#7cc47f" text-anchor="start" font-weight="400">eligible</text>
<text x="16.0" y="214.0" font-size="12.5" fill="#5fb3a1" text-anchor="start" font-weight="700">web worker</text>
<text x="140.0" y="214.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">slice 3 ms</text>
<rect x="16.0" y="222.0" width="143.0" height="14.0" rx="3" fill="#5fb3a1" fill-opacity="0.4" stroke="#5fb3a1" stroke-width="1"/>
<line x1="159.0" y1="218.0" x2="159.0" y2="240.0" stroke="#5fb3a1" stroke-width="2"/>
<text x="16.0" y="254.0" font-size="11" fill="#e5534b" text-anchor="start" font-weight="400">not eligible (ran ahead)</text>
<text x="16.0" y="282.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Short slice → earlier deadline →</text>
<text x="16.0" y="301.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">runs sooner. Tasks that ran ahead</text>
<text x="16.0" y="320.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">of their share wait. Long-run</text>
<text x="16.0" y="339.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">shares stay fair.</text>
</svg>
