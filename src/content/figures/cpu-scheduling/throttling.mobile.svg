<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 353" width="360" height="353" role="img" aria-label="A container with a 0.4 CPU limit uses its quota in 10 ms with 4 threads and is throttled for 90 ms each period" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="353" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">CPU limits throttle</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">limit 0.4 CPU, 4 busy threads</text>
<text x="16.0" y="104.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">T1</text>
<rect x="70.0" y="92.0" width="27.0" height="16.0" rx="3" fill="#ff5b2e" fill-opacity="0.8" stroke="#ff5b2e" stroke-width="1"/>
<rect x="97.0" y="92.0" width="243.0" height="16.0" rx="3" fill="#e5534b" fill-opacity="0.15" stroke="#e5534b" stroke-width="1" stroke-dasharray="3 3"/>
<text x="16.0" y="128.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">T2</text>
<rect x="70.0" y="116.0" width="27.0" height="16.0" rx="3" fill="#ff5b2e" fill-opacity="0.8" stroke="#ff5b2e" stroke-width="1"/>
<rect x="97.0" y="116.0" width="243.0" height="16.0" rx="3" fill="#e5534b" fill-opacity="0.15" stroke="#e5534b" stroke-width="1" stroke-dasharray="3 3"/>
<text x="16.0" y="152.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">T3</text>
<rect x="70.0" y="140.0" width="27.0" height="16.0" rx="3" fill="#ff5b2e" fill-opacity="0.8" stroke="#ff5b2e" stroke-width="1"/>
<rect x="97.0" y="140.0" width="243.0" height="16.0" rx="3" fill="#e5534b" fill-opacity="0.15" stroke="#e5534b" stroke-width="1" stroke-dasharray="3 3"/>
<text x="16.0" y="176.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">T4</text>
<rect x="70.0" y="164.0" width="27.0" height="16.0" rx="3" fill="#ff5b2e" fill-opacity="0.8" stroke="#ff5b2e" stroke-width="1"/>
<rect x="97.0" y="164.0" width="243.0" height="16.0" rx="3" fill="#e5534b" fill-opacity="0.15" stroke="#e5534b" stroke-width="1" stroke-dasharray="3 3"/>
<text x="70.0" y="200.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">0</text>
<text x="97.0" y="200.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">10</text>
<text x="340.0" y="200.0" font-size="10.5" fill="#a69d8e" text-anchor="end" font-weight="400">100 ms</text>
<rect x="16.0" y="220.0" width="12.0" height="12.0" rx="2" fill="#ff5b2e" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="34.0" y="230.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">running</text>
<rect x="126.0" y="220.0" width="12.0" height="12.0" rx="2" fill="#e5534b" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="144.0" y="230.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">throttled</text>
<text x="16.0" y="266.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Quota is gone after 10 ms; every</text>
<text x="16.0" y="285.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">thread waits 90 ms. Low average</text>
<text x="16.0" y="304.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">CPU, big latency spikes. Watch</text>
<text x="16.0" y="323.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">nr_throttled in cpu.stat.</text>
</svg>
