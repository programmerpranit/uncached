<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" role="img" aria-label="Cache-aside: read through the cache on miss, invalidate on write" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="290" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2b45a"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Cache-aside (lazy loading)</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">the application manages the cache explicitly</text>
<rect x="40.0" y="80.0" width="150.0" height="186.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="115.0" y="178.0" font-size="14" fill="#ede6d8" text-anchor="middle" font-weight="600">app</text>
<rect x="380.0" y="80.0" width="170.0" height="80.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="465.0" y="117.0" font-size="14" fill="#5fb3a1" text-anchor="middle" font-weight="600">cache</text>
<text x="465.0" y="133.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="400">Redis / Memcached</text>
<rect x="380.0" y="210.0" width="170.0" height="56.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="465.0" y="243.0" font-size="14" fill="#e2b45a" text-anchor="middle" font-weight="600">database</text>
<line x1="192.0" y1="98.0" x2="378.0" y2="98.0" stroke="#5fb3a1" stroke-width="1.3" marker-end="url(#ah0)"/>
<text x="285.0" y="92.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="400">1. GET user:42</text>
<line x1="378.0" y1="120.0" x2="192.0" y2="120.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah1)" stroke-dasharray="4 3"/>
<text x="285.0" y="114.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">2. miss</text>
<line x1="192.0" y1="146.0" x2="378.0" y2="146.0" stroke="#5fb3a1" stroke-width="1.3" marker-end="url(#ah0)" stroke-dasharray="6 3"/>
<text x="285.0" y="140.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="400">4. SET user:42, TTL</text>
<line x1="192.0" y1="238.0" x2="378.0" y2="238.0" stroke="#e2b45a" stroke-width="1.3" marker-end="url(#ah2)"/>
<text x="285.0" y="232.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="400">3. SELECT … → row</text>
<rect x="600.0" y="80.0" width="250.0" height="186.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="616.0" y="106.0" font-size="12" fill="#ff5b2e" text-anchor="start" font-weight="700">on write</text>
<text x="616.0" y="132.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">1. UPDATE the database</text>
<text x="616.0" y="151.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">2. DELETE the cache key</text>
<text x="616.0" y="189.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Next read misses and reloads</text>
<text x="616.0" y="208.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">fresh data. Deleting is safer</text>
<text x="616.0" y="227.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">than writing the new value.</text>
</svg>
