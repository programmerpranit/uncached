<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 468" width="880" height="468" role="img" aria-label="Average latency falls steeply as cache hit rate approaches 100%" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="468" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Why the last few % of hit rate matter</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">cache 1 ms, database 50 ms, 10,000 req/s</text>
<text x="40.0" y="86.0" font-size="12" fill="#ff5b2e" text-anchor="start" font-weight="700">average latency</text>
<text x="40.0" y="115.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">0%</text>
<rect x="100.0" y="100.0" width="660.0" height="20.0" rx="2" fill="#ff5b2e" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="768.0" y="115.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">50.0 ms</text>
<text x="40.0" y="143.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">80%</text>
<rect x="100.0" y="128.0" width="142.6" height="20.0" rx="2" fill="#ff5b2e" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="250.6" y="143.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">10.8 ms</text>
<text x="40.0" y="171.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">90%</text>
<rect x="100.0" y="156.0" width="77.9" height="20.0" rx="2" fill="#ff5b2e" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="185.9" y="171.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">5.9 ms</text>
<text x="40.0" y="199.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">95%</text>
<rect x="100.0" y="184.0" width="45.5" height="20.0" rx="2" fill="#ff5b2e" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="153.5" y="199.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">3.5 ms</text>
<text x="40.0" y="227.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">99%</text>
<rect x="100.0" y="212.0" width="19.7" height="20.0" rx="2" fill="#ff5b2e" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="127.7" y="227.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">1.5 ms</text>
<text x="40.0" y="258.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="700">database queries / second</text>
<text x="40.0" y="287.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">0%</text>
<rect x="100.0" y="272.0" width="660.0" height="20.0" rx="2" fill="#e2b45a" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="768.0" y="287.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">10,000</text>
<text x="40.0" y="315.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">80%</text>
<rect x="100.0" y="300.0" width="132.0" height="20.0" rx="2" fill="#e2b45a" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="240.0" y="315.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">2,000</text>
<text x="40.0" y="343.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">90%</text>
<rect x="100.0" y="328.0" width="66.0" height="20.0" rx="2" fill="#e2b45a" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="174.0" y="343.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">1,000</text>
<text x="40.0" y="371.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">95%</text>
<rect x="100.0" y="356.0" width="33.0" height="20.0" rx="2" fill="#e2b45a" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="141.0" y="371.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">500</text>
<text x="40.0" y="399.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">99%</text>
<rect x="100.0" y="384.0" width="6.6" height="20.0" rx="2" fill="#e2b45a" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="114.6" y="399.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">100</text>
<text x="40.0" y="438.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Going from 90% to 99% hits cuts average latency about 4× and database load 10×.</text>
</svg>
