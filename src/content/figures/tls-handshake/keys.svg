<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img" aria-label="Client and server exchange ephemeral public key shares, each computes the same shared secret, and an HKDF key schedule derives handshake keys, application keys and a resumption secret" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="440" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">From key shares to session keys</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">both sides compute the same secret from public key shares; a key schedule derives separate keys for each phase</text>
<rect x="40.0" y="90.0" width="200.0" height="56.0" rx="3" fill="#5fb3a1" fill-opacity="0.18" stroke="#5fb3a1" stroke-width="1"/>
<text x="140.0" y="115.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">client private a</text>
<text x="140.0" y="131.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">public share A = a·G</text>
<rect x="640.0" y="90.0" width="200.0" height="56.0" rx="3" fill="#9b8cff" fill-opacity="0.18" stroke="#9b8cff" stroke-width="1"/>
<text x="740.0" y="115.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">server private b</text>
<text x="740.0" y="131.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">public share B = b·G</text>
<line x1="240.0" y1="118.0" x2="640.0" y2="118.0" stroke="#a69d8e" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="440.0" y="110.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">only A and B cross the network</text>
<rect x="320.0" y="176.0" width="240.0" height="44.0" rx="3" fill="#e2b45a" fill-opacity="0.2" stroke="#e2b45a" stroke-width="1"/>
<text x="440.0" y="202.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">shared secret = a·B = b·A</text>
<line x1="140.0" y1="146.0" x2="330.0" y2="176.0" stroke="#a69d8e" stroke-width="1" marker-end="url(#ah0)"/>
<line x1="740.0" y1="146.0" x2="550.0" y2="176.0" stroke="#a69d8e" stroke-width="1" marker-end="url(#ah0)"/>
<rect x="320.0" y="250.0" width="240.0" height="40.0" rx="3" fill="#ff5b2e" fill-opacity="0.2" stroke="#ff5b2e" stroke-width="1"/>
<text x="440.0" y="267.0" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">HKDF key schedule</text>
<text x="440.0" y="283.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">mixes in hash of transcript</text>
<line x1="440.0" y1="220.0" x2="440.0" y2="250.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="60.0" y="330.0" width="220.0" height="48.0" rx="3" fill="#9b8cff" fill-opacity="0.18" stroke="#9b8cff" stroke-width="1"/>
<text x="170.0" y="351.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">handshake traffic keys</text>
<text x="170.0" y="367.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">encrypt certs + Finished</text>
<line x1="440.0" y1="290.0" x2="170.0" y2="330.0" stroke="#a69d8e" stroke-width="1" marker-end="url(#ah0)"/>
<rect x="330.0" y="330.0" width="220.0" height="48.0" rx="3" fill="#7cc47f" fill-opacity="0.18" stroke="#7cc47f" stroke-width="1"/>
<text x="440.0" y="351.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">application traffic keys</text>
<text x="440.0" y="367.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">encrypt HTTP data</text>
<line x1="440.0" y1="290.0" x2="440.0" y2="330.0" stroke="#a69d8e" stroke-width="1" marker-end="url(#ah0)"/>
<rect x="600.0" y="330.0" width="220.0" height="48.0" rx="3" fill="#d77fa1" fill-opacity="0.18" stroke="#d77fa1" stroke-width="1"/>
<text x="710.0" y="351.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">resumption secret</text>
<text x="710.0" y="367.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">PSK for next connection</text>
<line x1="440.0" y1="290.0" x2="710.0" y2="330.0" stroke="#a69d8e" stroke-width="1" marker-end="url(#ah0)"/>
<text x="440.0" y="410.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">Ephemeral a and b are discarded after the handshake → forward secrecy: a stolen server key cannot decrypt past traffic.</text>
</svg>
