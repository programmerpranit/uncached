<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 481" width="360" height="481" role="img" aria-label="TLS 1.3 handshake: ClientHello with key share, ServerHello with key share followed by encrypted certificate, certificate verify and finished, then client finished and application data after one round trip" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="481" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b8cff"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7cc47f"/></marker></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">TLS 1.3: one round trip</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">client can send data after 1 RTT</text>
<rect x="10.0" y="84.0" width="80.0" height="32.0" rx="3" fill="#5fb3a1" fill-opacity="0.2" stroke="#5fb3a1" stroke-width="1"/>
<text x="50.0" y="104.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">client</text>
<rect x="270.0" y="84.0" width="80.0" height="32.0" rx="3" fill="#9b8cff" fill-opacity="0.2" stroke="#9b8cff" stroke-width="1"/>
<text x="310.0" y="104.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">server</text>
<line x1="50.0" y1="116.0" x2="50.0" y2="414.0" stroke="#4a4136" stroke-width="1.2"/>
<line x1="310.0" y1="116.0" x2="310.0" y2="414.0" stroke="#4a4136" stroke-width="1.2"/>
<line x1="50.0" y1="150.0" x2="310.0" y2="166.0" stroke="#5fb3a1" stroke-width="1.6" marker-end="url(#ah0)"/>
<text x="180.0" y="144.0" font-size="9.5" fill="#5fb3a1" text-anchor="middle" font-weight="400">ClientHello + key_share</text>
<line x1="310.0" y1="206.0" x2="50.0" y2="222.0" stroke="#9b8cff" stroke-width="1.6" marker-end="url(#ah1)"/>
<text x="180.0" y="200.0" font-size="9.5" fill="#9b8cff" text-anchor="middle" font-weight="400">ServerHello + key_share</text>
<line x1="310.0" y1="276.0" x2="50.0" y2="292.0" stroke="#9b8cff" stroke-width="1.6" marker-end="url(#ah1)"/>
<text x="180.0" y="256.0" font-size="9.5" fill="#9b8cff" text-anchor="middle" font-weight="400">{EncExt, Cert,</text>
<text x="180.0" y="270.0" font-size="9.5" fill="#9b8cff" text-anchor="middle" font-weight="400">CertVerify, Finished}</text>
<line x1="50.0" y1="332.0" x2="310.0" y2="348.0" stroke="#7cc47f" stroke-width="1.6" marker-end="url(#ah2)"/>
<text x="180.0" y="326.0" font-size="9.5" fill="#7cc47f" text-anchor="middle" font-weight="400">{Finished} + [app data]</text>
<line x1="310.0" y1="388.0" x2="50.0" y2="404.0" stroke="#7cc47f" stroke-width="1.6" marker-end="url(#ah2)"/>
<text x="180.0" y="382.0" font-size="9.5" fill="#7cc47f" text-anchor="middle" font-weight="400">[app data]</text>
<text x="16.0" y="436.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">{ } handshake keys, [ ] app keys.</text>
<text x="16.0" y="451.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">TLS 1.2 needed 2 round trips.</text>
</svg>
