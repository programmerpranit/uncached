<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 486" width="880" height="486" role="img" aria-label="TLS 1.3 handshake: ClientHello with key share, ServerHello with key share followed by encrypted certificate, certificate verify and finished, then client finished and application data after one round trip" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="486" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b8cff"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7cc47f"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">TLS 1.3 full handshake: one round trip</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">the client guesses the key-exchange group and sends its key share up front, so keys exist after a single round trip</text>
<rect x="110.0" y="90.0" width="120.0" height="32.0" rx="3" fill="#5fb3a1" fill-opacity="0.2" stroke="#5fb3a1" stroke-width="1"/>
<text x="170.0" y="110.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">client</text>
<rect x="650.0" y="90.0" width="120.0" height="32.0" rx="3" fill="#9b8cff" fill-opacity="0.2" stroke="#9b8cff" stroke-width="1"/>
<text x="710.0" y="110.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">server</text>
<line x1="170.0" y1="122.0" x2="170.0" y2="410.0" stroke="#4a4136" stroke-width="1.2"/>
<line x1="710.0" y1="122.0" x2="710.0" y2="410.0" stroke="#4a4136" stroke-width="1.2"/>
<line x1="170.0" y1="156.0" x2="710.0" y2="172.0" stroke="#5fb3a1" stroke-width="1.6" marker-end="url(#ah0)"/>
<text x="440.0" y="150.0" font-size="10.5" fill="#5fb3a1" text-anchor="middle" font-weight="400">ClientHello + key_share + SNI + ALPN</text>
<line x1="710.0" y1="212.0" x2="170.0" y2="228.0" stroke="#9b8cff" stroke-width="1.6" marker-end="url(#ah1)"/>
<text x="440.0" y="206.0" font-size="10.5" fill="#9b8cff" text-anchor="middle" font-weight="400">ServerHello + key_share</text>
<line x1="710.0" y1="282.0" x2="170.0" y2="298.0" stroke="#9b8cff" stroke-width="1.6" marker-end="url(#ah1)"/>
<text x="440.0" y="262.0" font-size="10.5" fill="#9b8cff" text-anchor="middle" font-weight="400">{EncryptedExtensions, Certificate,</text>
<text x="440.0" y="276.0" font-size="10.5" fill="#9b8cff" text-anchor="middle" font-weight="400">CertificateVerify, Finished}</text>
<line x1="170.0" y1="338.0" x2="710.0" y2="354.0" stroke="#7cc47f" stroke-width="1.6" marker-end="url(#ah2)"/>
<text x="440.0" y="332.0" font-size="10.5" fill="#7cc47f" text-anchor="middle" font-weight="400">{Finished}  + [application data]</text>
<line x1="710.0" y1="394.0" x2="170.0" y2="410.0" stroke="#7cc47f" stroke-width="1.6" marker-end="url(#ah2)"/>
<text x="440.0" y="388.0" font-size="10.5" fill="#7cc47f" text-anchor="middle" font-weight="400">[application data]</text>
<text x="156.0" y="262.0" font-size="11" fill="#e2b45a" text-anchor="end" font-weight="700">1 RTT</text>
<line x1="162.0" y1="152.0" x2="162.0" y2="336.0" stroke="#e2b45a" stroke-width="1" stroke-dasharray="3,3"/>
<text x="440.0" y="438.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">{ } = encrypted with handshake keys    [ ] = encrypted with application keys</text>
<text x="440.0" y="456.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">TLS 1.2 needed 2 round trips before application data could flow.</text>
</svg>
