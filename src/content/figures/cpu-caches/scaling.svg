<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 414" width="880" height="414" role="img" aria-label="Illustrative throughput of padded versus adjacent per-thread counters as threads increase" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="414" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">The cost of false sharing as threads grow (illustrative)</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">each thread increments its own counter 100M times</text>
<line x1="90.0" y1="280.0" x2="710.0" y2="280.0" stroke="#4a4136" stroke-width="1.3"/>
<line x1="90.0" y1="280.0" x2="90.0" y2="100.0" stroke="#4a4136" stroke-width="1.3"/>
<path d="M90.0 268.8 L245.0 257.5 L400.0 235.0 L555.0 190.0 L710.0 100.0" fill="none" stroke="#7cc47f" stroke-width="2.2"/>
<circle cx="90.0" cy="268.8" r="3.2" fill="#7cc47f" fill-opacity="1" stroke="none" stroke-width="1"/>
<circle cx="245.0" cy="257.5" r="3.2" fill="#7cc47f" fill-opacity="1" stroke="none" stroke-width="1"/>
<circle cx="400.0" cy="235.0" r="3.2" fill="#7cc47f" fill-opacity="1" stroke="none" stroke-width="1"/>
<circle cx="555.0" cy="190.0" r="3.2" fill="#7cc47f" fill-opacity="1" stroke="none" stroke-width="1"/>
<circle cx="710.0" cy="100.0" r="3.2" fill="#7cc47f" fill-opacity="1" stroke="none" stroke-width="1"/>
<path d="M90.0 268.8 L245.0 273.2 L400.0 274.4 L555.0 274.9 L710.0 275.5" fill="none" stroke="#e5534b" stroke-width="2.2"/>
<circle cx="90.0" cy="268.8" r="3.2" fill="#e5534b" fill-opacity="1" stroke="none" stroke-width="1"/>
<circle cx="245.0" cy="273.2" r="3.2" fill="#e5534b" fill-opacity="1" stroke="none" stroke-width="1"/>
<circle cx="400.0" cy="274.4" r="3.2" fill="#e5534b" fill-opacity="1" stroke="none" stroke-width="1"/>
<circle cx="555.0" cy="274.9" r="3.2" fill="#e5534b" fill-opacity="1" stroke="none" stroke-width="1"/>
<circle cx="710.0" cy="275.5" r="3.2" fill="#e5534b" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="90.0" y="298.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">1</text>
<text x="245.0" y="298.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">2</text>
<text x="400.0" y="298.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">4</text>
<text x="555.0" y="298.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">8</text>
<text x="710.0" y="298.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">16</text>
<text x="400.0" y="316.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">threads</text>
<text x="82.0" y="104.0" font-size="10.5" fill="#a69d8e" text-anchor="end" font-weight="400">16×</text>
<text x="82.0" y="272.8" font-size="10.5" fill="#a69d8e" text-anchor="end" font-weight="400">1×</text>
<text x="704.0" y="90.0" font-size="11.5" fill="#7cc47f" text-anchor="end" font-weight="400">padded: scales linearly</text>
<text x="704.0" y="265.5" font-size="11.5" fill="#e5534b" text-anchor="end" font-weight="400">adjacent counters: slower than 1 thread</text>
<text x="40.0" y="346.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Total throughput relative to one thread. With adjacent counters, adding threads makes the program slower in</text>
<text x="40.0" y="365.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">absolute terms. The code looks perfectly parallel, which is what makes false sharing hard to spot without</text>
<text x="40.0" y="384.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">tools like perf c2c.</text>
</svg>
