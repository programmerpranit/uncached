<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 338" width="360" height="338" role="img" aria-label="Illustrative time to sum 100 million integers with sequential, strided, random and linked-list access" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="338" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Access patterns</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">sum 100M ints (illustrative)</text>
<text x="16.0" y="86.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">sequential array</text>
<rect x="16.0" y="94.0" width="16.0" height="14.0" rx="3" fill="#7cc47f" fill-opacity="0.7" stroke="#7cc47f" stroke-width="1"/>
<text x="40.0" y="106.0" font-size="11" fill="#7cc47f" text-anchor="start" font-weight="700">~30 ms</text>
<text x="16.0" y="130.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">strided (every 16th int)</text>
<rect x="16.0" y="138.0" width="90.0" height="14.0" rx="3" fill="#e2b45a" fill-opacity="0.7" stroke="#e2b45a" stroke-width="1"/>
<text x="114.0" y="150.0" font-size="11" fill="#e2b45a" text-anchor="start" font-weight="700">~16× more lines</text>
<text x="16.0" y="174.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">random indexes into array</text>
<rect x="16.0" y="182.0" width="170.0" height="14.0" rx="3" fill="#e5534b" fill-opacity="0.7" stroke="#e5534b" stroke-width="1"/>
<text x="194.0" y="194.0" font-size="11" fill="#e5534b" text-anchor="start" font-weight="700">~1 s</text>
<text x="16.0" y="218.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">linked list</text>
<rect x="16.0" y="226.0" width="200.0" height="14.0" rx="3" fill="#e5534b" fill-opacity="0.7" stroke="#e5534b" stroke-width="1"/>
<text x="224.0" y="238.0" font-size="11" fill="#e5534b" text-anchor="start" font-weight="700">~1–2 s</text>
<text x="16.0" y="270.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Prefetchers love sequential</text>
<text x="16.0" y="289.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">access; random and pointer</text>
<text x="16.0" y="308.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">chasing defeat them.</text>
</svg>
