<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 358" width="880" height="358" role="img" aria-label="Two cores updating different variables on the same cache line, causing the line to bounce between them" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="358" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b8cff"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">False sharing: independent variables, one cache line</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">two threads update different counters that happen to share a 64-byte line</text>
<rect x="40.0" y="100.0" width="160.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="120.0" y="119.0" font-size="13" fill="#5fb3a1" text-anchor="middle" font-weight="600">core 0</text>
<text x="120.0" y="135.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="400">counter_a++</text>
<rect x="680.0" y="100.0" width="160.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="760.0" y="119.0" font-size="13" fill="#9b8cff" text-anchor="middle" font-weight="600">core 1</text>
<text x="760.0" y="135.0" font-size="11" fill="#9b8cff" text-anchor="middle" font-weight="400">counter_b++</text>
<rect x="250.0" y="170.0" width="380.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<rect x="250.0" y="170.0" width="47.0" height="40.0" rx="3" fill="#5fb3a1" fill-opacity="0.5" stroke="#5fb3a1" stroke-width="1"/>
<text x="273.0" y="195.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="700">a</text>
<rect x="297.0" y="170.0" width="47.0" height="40.0" rx="3" fill="#9b8cff" fill-opacity="0.5" stroke="#9b8cff" stroke-width="1"/>
<text x="320.0" y="195.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="700">b</text>
<text x="490.0" y="195.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">rest of the 64-byte line</text>
<path d="M200 130 C 260 140, 260 160, 273 168" fill="none" stroke="#5fb3a1" stroke-width="1.3" marker-end="url(#ah0)"/>
<path d="M680 130 C 600 140, 360 150, 320 168" fill="none" stroke="#9b8cff" stroke-width="1.3" marker-end="url(#ah1)"/>
<text x="440.0" y="246.0" font-size="12" fill="#e5534b" text-anchor="middle" font-weight="600">each write invalidates the line in the other core's cache (MESI): it ping-pongs between cores</text>
<text x="40.0" y="290.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Neither thread reads the other's variable, yet every increment pays a cache-to-cache transfer (tens of ns, more</text>
<text x="40.0" y="309.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">across sockets) instead of an L1 hit. Fix: give hot per-thread data its own line (alignas(64), @Contended in Java,</text>
<text x="40.0" y="328.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">padding), or keep per-thread counters in thread-local storage and combine them when read.</text>
</svg>
