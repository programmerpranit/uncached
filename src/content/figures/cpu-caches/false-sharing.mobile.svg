<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 358" width="360" height="358" role="img" aria-label="Two cores updating different variables on the same cache line, causing the line to bounce between them" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="358" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">False sharing</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">different variables, same line</text>
<rect x="16.0" y="86.0" width="150.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="91.0" y="110.3" font-size="12" fill="#5fb3a1" text-anchor="middle" font-weight="600">core 0: a++</text>
<rect x="194.0" y="86.0" width="150.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="269.0" y="110.3" font-size="12" fill="#9b8cff" text-anchor="middle" font-weight="600">core 1: b++</text>
<rect x="16.0" y="150.0" width="328.0" height="34.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<rect x="16.0" y="150.0" width="40.0" height="34.0" rx="3" fill="#5fb3a1" fill-opacity="0.5" stroke="#5fb3a1" stroke-width="1"/>
<text x="36.0" y="172.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="700">a</text>
<rect x="56.0" y="150.0" width="40.0" height="34.0" rx="3" fill="#9b8cff" fill-opacity="0.5" stroke="#9b8cff" stroke-width="1"/>
<text x="76.0" y="172.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="700">b</text>
<text x="200.0" y="172.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">one 64-byte line</text>
<text x="16.0" y="214.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="400">The line ping-pongs between</text>
<text x="16.0" y="233.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="400">cores on every write.</text>
<text x="16.0" y="271.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Fix: pad hot per-thread data to</text>
<text x="16.0" y="290.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">its own line (alignas(64),</text>
<text x="16.0" y="309.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">@Contended), or use thread-local</text>
<text x="16.0" y="328.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">counters.</text>
</svg>
