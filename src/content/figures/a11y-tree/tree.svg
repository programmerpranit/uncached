<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 508" width="880" height="508" role="img" aria-label="The browser turns the DOM into an accessibility tree of roles, names and states, pruning wrappers; an icon-only button ends up with no name" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="508" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">DOM tree vs accessibility tree</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">the browser derives a simpler tree for assistive tech</text>
<text x="40.0" y="96.0" font-size="13" fill="#ede6d8" text-anchor="start" font-weight="700">DOM (what you wrote)</text>
<text x="480.0" y="96.0" font-size="13" fill="#ede6d8" text-anchor="start" font-weight="700">accessibility tree (what a screen reader gets)</text>
<rect x="40.0" y="110.0" width="380.0" height="300.0" rx="6" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="56.0" y="136.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">&lt;nav&gt;</text>
<text x="56.0" y="160.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">  &lt;ul&gt;</text>
<text x="56.0" y="184.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">    &lt;li&gt;&lt;a href="/"&gt;Home&lt;/a&gt;</text>
<text x="56.0" y="208.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">    &lt;li&gt;&lt;a href="/docs"&gt;Docs&lt;/a&gt;</text>
<text x="56.0" y="232.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">&lt;main&gt;</text>
<text x="56.0" y="256.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">  &lt;div class="wrap"&gt;</text>
<text x="56.0" y="280.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">    &lt;h1&gt;Settings&lt;/h1&gt;</text>
<text x="56.0" y="304.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">    &lt;label for=n&gt;Name&lt;/label&gt;</text>
<text x="56.0" y="328.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">    &lt;input id=n value="Ada"&gt;</text>
<text x="56.0" y="352.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">    &lt;div class="icon"&gt;&lt;/div&gt;</text>
<text x="56.0" y="376.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">    &lt;button&gt;&lt;svg …/&gt;&lt;/button&gt;</text>
<rect x="480.0" y="110.0" width="360.0" height="300.0" rx="6" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="496.0" y="140.0" font-size="12" fill="#9b8cff" text-anchor="start" font-weight="600">navigation</text>
<text x="518.0" y="172.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">list (2 items)</text>
<text x="540.0" y="204.0" font-size="12" fill="#ff5b2e" text-anchor="start" font-weight="600">link "Home"</text>
<text x="540.0" y="236.0" font-size="12" fill="#ff5b2e" text-anchor="start" font-weight="600">link "Docs"</text>
<text x="496.0" y="268.0" font-size="12" fill="#9b8cff" text-anchor="start" font-weight="600">main</text>
<text x="518.0" y="300.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="600">heading "Settings" level 1</text>
<text x="518.0" y="332.0" font-size="12" fill="#ff5b2e" text-anchor="start" font-weight="600">textbox "Name" value "Ada"</text>
<text x="518.0" y="364.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="600">button ""  ← no name!</text>
<line x1="424.0" y1="260.0" x2="476.0" y2="260.0" stroke="#a69d8e" stroke-width="1.5" marker-end="url(#ah0)"/>
<text x="40.0" y="440.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Each node gets a role, a name, a state/value and its relationships. Generic wrappers (div.wrap, span) are</text>
<text x="40.0" y="459.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">pruned, decorative nodes vanish, and labels are folded into the control they describe.</text>
<text x="40.0" y="478.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">The icon-only button has no text, so it is announced as just "button".</text>
</svg>
