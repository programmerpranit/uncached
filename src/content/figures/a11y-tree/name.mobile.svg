<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 492" width="360" height="492" role="img" aria-label="Accessible name sources in order: aria-labelledby, aria-label, native label, contents, then title or placeholder" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="492" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Accessible name order</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">first match wins (simplified)</text>
<rect x="16.0" y="86.0" width="328.0" height="56.0" rx="6" fill="#9b8cff" fill-opacity="0.1" stroke="#9b8cff" stroke-width="1.2"/>
<text x="28.0" y="108.0" font-size="12" fill="#9b8cff" text-anchor="start" font-weight="700">1. aria-labelledby</text>
<text x="28.0" y="128.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">text of the referenced element(s)</text>
<rect x="16.0" y="150.0" width="328.0" height="56.0" rx="6" fill="#9b8cff" fill-opacity="0.1" stroke="#9b8cff" stroke-width="1.2"/>
<text x="28.0" y="172.0" font-size="12" fill="#9b8cff" text-anchor="start" font-weight="700">2. aria-label</text>
<text x="28.0" y="192.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">string on the element itself</text>
<rect x="16.0" y="214.0" width="328.0" height="56.0" rx="6" fill="#5fb3a1" fill-opacity="0.1" stroke="#5fb3a1" stroke-width="1.2"/>
<text x="28.0" y="236.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="700">3. native label</text>
<text x="28.0" y="256.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">&lt;label for&gt;, &lt;caption&gt;, &lt;legend&gt;, alt=</text>
<rect x="16.0" y="278.0" width="328.0" height="56.0" rx="6" fill="#ff5b2e" fill-opacity="0.1" stroke="#ff5b2e" stroke-width="1.2"/>
<text x="28.0" y="300.0" font-size="12" fill="#ff5b2e" text-anchor="start" font-weight="700">4. contents</text>
<text x="28.0" y="320.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">text inside (buttons, links, headings)</text>
<rect x="16.0" y="342.0" width="328.0" height="56.0" rx="6" fill="#e2b45a" fill-opacity="0.1" stroke="#e2b45a" stroke-width="1.2"/>
<text x="28.0" y="364.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="700">5. title / placeholder</text>
<text x="28.0" y="384.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">last resort, unreliable</text>
<text x="16.0" y="424.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">aria-label overrides visible text:</text>
<text x="16.0" y="443.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">&lt;button aria-label="Save"&gt;Submit</text>
<text x="16.0" y="462.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">→ announced as "Save".</text>
</svg>
