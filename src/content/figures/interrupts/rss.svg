<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 368" width="880" height="368" role="img" aria-label="A multi-queue NIC hashing flows to queues whose interrupts go to different CPUs" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="368" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a4136"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e5534b"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Spreading interrupt work across cores</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">a multi-queue NIC with RSS hashes flows to queues, each with its own interrupt</text>
<rect x="40.0" y="140.0" width="150.0" height="60.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="115.0" y="167.0" font-size="13" fill="#ede6d8" text-anchor="middle" font-weight="600">NIC</text>
<text x="115.0" y="183.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">RSS: hash(5-tuple)</text>
<rect x="260.0" y="100.0" width="120.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="320.0" y="120.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="600">queue 0</text>
<line x1="190.0" y1="170.0" x2="258.0" y2="116.0" stroke="#4a4136" stroke-width="1.1" marker-end="url(#ah0)"/>
<rect x="450.0" y="100.0" width="120.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<text x="510.0" y="120.0" font-size="11" fill="#e5534b" text-anchor="middle" font-weight="600">IRQ 40</text>
<line x1="380.0" y1="116.0" x2="448.0" y2="116.0" stroke="#e5534b" stroke-width="1.1" marker-end="url(#ah1)"/>
<rect x="640.0" y="100.0" width="120.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="700.0" y="120.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="600">CPU 0</text>
<line x1="570.0" y1="116.0" x2="638.0" y2="116.0" stroke="#5fb3a1" stroke-width="1.1" marker-end="url(#ah2)"/>
<rect x="260.0" y="144.0" width="120.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="320.0" y="164.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="600">queue 1</text>
<line x1="190.0" y1="170.0" x2="258.0" y2="160.0" stroke="#4a4136" stroke-width="1.1" marker-end="url(#ah0)"/>
<rect x="450.0" y="144.0" width="120.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<text x="510.0" y="164.0" font-size="11" fill="#e5534b" text-anchor="middle" font-weight="600">IRQ 41</text>
<line x1="380.0" y1="160.0" x2="448.0" y2="160.0" stroke="#e5534b" stroke-width="1.1" marker-end="url(#ah1)"/>
<rect x="640.0" y="144.0" width="120.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="700.0" y="164.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="600">CPU 1</text>
<line x1="570.0" y1="160.0" x2="638.0" y2="160.0" stroke="#5fb3a1" stroke-width="1.1" marker-end="url(#ah2)"/>
<rect x="260.0" y="188.0" width="120.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="320.0" y="208.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="600">queue 2</text>
<line x1="190.0" y1="170.0" x2="258.0" y2="204.0" stroke="#4a4136" stroke-width="1.1" marker-end="url(#ah0)"/>
<rect x="450.0" y="188.0" width="120.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<text x="510.0" y="208.0" font-size="11" fill="#e5534b" text-anchor="middle" font-weight="600">IRQ 42</text>
<line x1="380.0" y1="204.0" x2="448.0" y2="204.0" stroke="#e5534b" stroke-width="1.1" marker-end="url(#ah1)"/>
<rect x="640.0" y="188.0" width="120.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="700.0" y="208.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="600">CPU 2</text>
<line x1="570.0" y1="204.0" x2="638.0" y2="204.0" stroke="#5fb3a1" stroke-width="1.1" marker-end="url(#ah2)"/>
<rect x="260.0" y="232.0" width="120.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="320.0" y="252.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="600">queue 3</text>
<line x1="190.0" y1="170.0" x2="258.0" y2="248.0" stroke="#4a4136" stroke-width="1.1" marker-end="url(#ah0)"/>
<rect x="450.0" y="232.0" width="120.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<text x="510.0" y="252.0" font-size="11" fill="#e5534b" text-anchor="middle" font-weight="600">IRQ 43</text>
<line x1="380.0" y1="248.0" x2="448.0" y2="248.0" stroke="#e5534b" stroke-width="1.1" marker-end="url(#ah1)"/>
<rect x="640.0" y="232.0" width="120.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="700.0" y="252.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="600">CPU 3</text>
<line x1="570.0" y1="248.0" x2="638.0" y2="248.0" stroke="#5fb3a1" stroke-width="1.1" marker-end="url(#ah2)"/>
<text x="40.0" y="300.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Each queue's interrupt is pinned (smp_affinity or irqbalance) to a different core, so softirq work for different</text>
<text x="40.0" y="319.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">flows runs in parallel. RPS/RFS do the same in software for single-queue NICs, and aRFS steers each flow to the</text>
<text x="40.0" y="338.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">core where its application thread runs, keeping caches warm.</text>
</svg>
