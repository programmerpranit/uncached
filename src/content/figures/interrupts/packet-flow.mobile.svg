<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 375" width="360" height="375" role="img" aria-label="Path of a network packet from NIC interrupt through the top half and softirq to the receiving thread" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="375" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Packet to recv()</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">top half fast, deferred work heavy</text>
<rect x="16.0" y="70.0" width="6.0" height="26.0" rx="1" fill="#4a4136" fill-opacity="0.9" stroke="#4a4136" stroke-width="1"/>
<text x="30.0" y="88.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="700">NIC</text>
<rect x="16.0" y="102.0" width="6.0" height="26.0" rx="1" fill="#e2b45a" fill-opacity="0.9" stroke="#e2b45a" stroke-width="1"/>
<text x="30.0" y="120.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="700">CPU</text>
<rect x="16.0" y="134.0" width="6.0" height="26.0" rx="1" fill="#e5534b" fill-opacity="0.9" stroke="#e5534b" stroke-width="1"/>
<text x="30.0" y="152.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="700">top half (hard IRQ)</text>
<rect x="16.0" y="166.0" width="6.0" height="26.0" rx="1" fill="#9b8cff" fill-opacity="0.9" stroke="#9b8cff" stroke-width="1"/>
<text x="30.0" y="184.0" font-size="12" fill="#9b8cff" text-anchor="start" font-weight="700">softirq (NET_RX)</text>
<rect x="16.0" y="198.0" width="6.0" height="26.0" rx="1" fill="#5fb3a1" fill-opacity="0.9" stroke="#5fb3a1" stroke-width="1"/>
<text x="30.0" y="216.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="700">wake the reader</text>
<rect x="16.0" y="230.0" width="6.0" height="26.0" rx="1" fill="#7cc47f" fill-opacity="0.9" stroke="#7cc47f" stroke-width="1"/>
<text x="30.0" y="248.0" font-size="12" fill="#7cc47f" text-anchor="start" font-weight="700">your thread</text>
<text x="16.0" y="288.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Top half: ack and schedule,</text>
<text x="16.0" y="307.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">microseconds, can't sleep.</text>
<text x="16.0" y="326.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Bottom half: protocol work, with</text>
<text x="16.0" y="345.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">interrupts enabled.</text>
</svg>
