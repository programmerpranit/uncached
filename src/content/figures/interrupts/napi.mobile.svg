<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 319" width="360" height="319" role="img" aria-label="Per-packet interrupts versus interrupt coalescing, NAPI polling and busy polling" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="319" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">NAPI: interrupts → polling</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">switch to polling under load</text>
<text x="16.0" y="86.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="700">1 interrupt per packet</text>
<text x="16.0" y="103.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">overhead eats the CPU</text>
<text x="16.0" y="130.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="700">interrupt coalescing (NIC)</text>
<text x="16.0" y="147.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">fewer IRQs, more latency</text>
<text x="16.0" y="174.0" font-size="12" fill="#7cc47f" text-anchor="start" font-weight="700">NAPI (kernel)</text>
<text x="16.0" y="191.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">IRQ once, then poll batches</text>
<text x="16.0" y="218.0" font-size="12" fill="#9b8cff" text-anchor="start" font-weight="700">busy polling</text>
<text x="16.0" y="235.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">lowest latency, burns CPU</text>
<text x="16.0" y="270.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Interrupts for low rates,</text>
<text x="16.0" y="289.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">polling for high rates.</text>
</svg>
