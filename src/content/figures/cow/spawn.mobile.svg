<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 367" width="360" height="367" role="img" aria-label="Cost of fork plus exec compared with vfork and posix_spawn" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="367" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Ways to start a program</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">fork cost grows with parent size</text>
<text x="16.0" y="88.0" font-size="12.5" fill="#ede6d8" text-anchor="start" font-weight="600">fork() + exec()</text>
<text x="16.0" y="105.0" font-size="11" fill="#e5534b" text-anchor="start" font-weight="400">~10 ms per GB mapped</text>
<rect x="16.0" y="114.0" width="202.0" height="14.0" rx="3" fill="#e5534b" fill-opacity="0.7" stroke="#e5534b" stroke-width="1"/>
<text x="16.0" y="150.0" font-size="12.5" fill="#ede6d8" text-anchor="start" font-weight="600">vfork() + exec()</text>
<text x="16.0" y="167.0" font-size="11" fill="#7cc47f" text-anchor="start" font-weight="400">constant, ~tens of µs</text>
<rect x="16.0" y="176.0" width="14.0" height="14.0" rx="3" fill="#7cc47f" fill-opacity="0.7" stroke="#7cc47f" stroke-width="1"/>
<text x="16.0" y="212.0" font-size="12.5" fill="#ede6d8" text-anchor="start" font-weight="600">posix_spawn()</text>
<text x="16.0" y="229.0" font-size="11" fill="#7cc47f" text-anchor="start" font-weight="400">constant, ~tens of µs</text>
<rect x="16.0" y="238.0" width="14.0" height="14.0" rx="3" fill="#7cc47f" fill-opacity="0.7" stroke="#7cc47f" stroke-width="1"/>
<text x="16.0" y="280.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">fork copies page tables:</text>
<text x="16.0" y="299.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">~10 ms per GB on bare metal.</text>
<text x="16.0" y="318.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">vfork / posix_spawn borrow the</text>
<text x="16.0" y="337.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">parent's memory until exec.</text>
</svg>
