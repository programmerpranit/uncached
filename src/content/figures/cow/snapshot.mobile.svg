<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 389" width="360" height="389" role="img" aria-label="Extra memory used by a fork-based Redis snapshot under different write patterns" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="389" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Snapshot by fork()</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">10 GB Redis; extra RAM = pages dirtied</text>
<text x="16.0" y="90.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">read-mostly cache</text>
<rect x="16.0" y="98.0" width="7.0" height="16.0" rx="3" fill="#7cc47f" fill-opacity="0.7" stroke="#7cc47f" stroke-width="1"/>
<text x="31.0" y="111.0" font-size="11" fill="#7cc47f" text-anchor="start" font-weight="700">+0.2 GB</text>
<text x="16.0" y="140.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">moderate writes</text>
<rect x="16.0" y="148.0" width="64.5" height="16.0" rx="3" fill="#e2b45a" fill-opacity="0.7" stroke="#e2b45a" stroke-width="1"/>
<text x="88.5" y="161.0" font-size="11" fill="#e2b45a" text-anchor="start" font-weight="700">+2.5 GB</text>
<text x="16.0" y="190.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">write-heavy, random keys</text>
<rect x="16.0" y="198.0" width="202.0" height="16.0" rx="3" fill="#e5534b" fill-opacity="0.7" stroke="#e5534b" stroke-width="1"/>
<text x="226.0" y="211.0" font-size="11" fill="#e5534b" text-anchor="start" font-weight="700">+8 GB</text>
<text x="16.0" y="240.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">write-heavy + THP</text>
<rect x="16.0" y="248.0" width="252.0" height="16.0" rx="3" fill="#e5534b" fill-opacity="0.7" stroke="#e5534b" stroke-width="1"/>
<text x="276.0" y="261.0" font-size="11" fill="#e5534b" text-anchor="start" font-weight="700">+10 GB</text>
<text x="16.0" y="302.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Every page written during the</text>
<text x="16.0" y="321.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">snapshot gets copied once. Before</text>
<text x="16.0" y="340.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Linux 5.8, THP copied 2 MiB per</text>
<text x="16.0" y="359.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">write instead of 4 KiB.</text>
</svg>
