<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 454" width="360" height="454" role="img" aria-label="A dropdown with z-index 9999 inside a card with z-index 1 is painted below a header with z-index 2" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="454" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Why z-index: 9999 loses</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">children can't escape their context</text>
<rect x="16.0" y="84.0" width="328.0" height="200.0" rx="8" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="28.0" y="104.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="700">root context</text>
<rect x="28.0" y="116.0" width="150.0" height="156.0" rx="6" fill="#9b8cff" fill-opacity="0.25" stroke="#9b8cff" stroke-width="1.4"/>
<text x="38.0" y="136.0" font-size="11" fill="#9b8cff" text-anchor="start" font-weight="700">.card  z: 1</text>
<rect x="38.0" y="190.0" width="130.0" height="44.0" rx="3" fill="#1b1712" fill-opacity="1" stroke="#d77fa1" stroke-width="1"/>
<text x="103.0" y="209.0" font-size="11" fill="#d77fa1" text-anchor="middle" font-weight="600">.dropdown</text>
<text x="103.0" y="225.0" font-size="11" fill="#d77fa1" text-anchor="middle" font-weight="400">z: 9999</text>
<rect x="186.0" y="116.0" width="146.0" height="156.0" rx="6" fill="#5fb3a1" fill-opacity="0.25" stroke="#5fb3a1" stroke-width="1.4"/>
<text x="196.0" y="136.0" font-size="11" fill="#5fb3a1" text-anchor="start" font-weight="700">.header  z: 2</text>
<text x="16.0" y="310.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Outside, the browser compares</text>
<text x="16.0" y="329.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">.card (1) with .header (2):</text>
<text x="16.0" y="348.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">the header wins, and the</text>
<text x="16.0" y="367.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">dropdown goes down with its card.</text>
<text x="16.0" y="405.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Fix: raise .card, remove its</text>
<text x="16.0" y="424.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">context, or portal to &lt;body&gt;.</text>
</svg>
