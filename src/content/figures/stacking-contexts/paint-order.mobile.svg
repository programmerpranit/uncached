<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 439" width="360" height="439" role="img" aria-label="The seven layers painted inside a stacking context, from background to positive z-index" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="439" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Paint order</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">back to front</text>
<rect x="16.0" y="84.0" width="328.0" height="32.0" rx="5" fill="#ff5b2e" fill-opacity="0.3" stroke="#ff5b2e" stroke-width="1.2"/>
<text x="26.0" y="105.0" font-size="12" fill="#ff5b2e" text-anchor="start" font-weight="700">7</text>
<text x="46.0" y="105.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">positioned, z-index &gt; 0 (ascending)</text>
<rect x="16.0" y="122.0" width="328.0" height="32.0" rx="5" fill="#e2b45a" fill-opacity="0.3" stroke="#e2b45a" stroke-width="1.2"/>
<text x="26.0" y="143.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="700">6</text>
<text x="46.0" y="143.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">positioned, z-index: auto / 0</text>
<rect x="16.0" y="160.0" width="328.0" height="32.0" rx="5" fill="#5fb3a1" fill-opacity="0.3" stroke="#5fb3a1" stroke-width="1.2"/>
<text x="26.0" y="181.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="700">5</text>
<text x="46.0" y="181.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">inline content: text, images</text>
<rect x="16.0" y="198.0" width="328.0" height="32.0" rx="5" fill="#5fb3a1" fill-opacity="0.3" stroke="#5fb3a1" stroke-width="1.2"/>
<text x="26.0" y="219.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="700">4</text>
<text x="46.0" y="219.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">floats</text>
<rect x="16.0" y="236.0" width="328.0" height="32.0" rx="5" fill="#5fb3a1" fill-opacity="0.3" stroke="#5fb3a1" stroke-width="1.2"/>
<text x="26.0" y="257.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="700">3</text>
<text x="46.0" y="257.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">in-flow blocks (non-positioned)</text>
<rect x="16.0" y="274.0" width="328.0" height="32.0" rx="5" fill="#9b8cff" fill-opacity="0.3" stroke="#9b8cff" stroke-width="1.2"/>
<text x="26.0" y="295.0" font-size="12" fill="#9b8cff" text-anchor="start" font-weight="700">2</text>
<text x="46.0" y="295.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">positioned, z-index &lt; 0</text>
<rect x="16.0" y="312.0" width="328.0" height="32.0" rx="5" fill="#a69d8e" fill-opacity="0.3" stroke="#a69d8e" stroke-width="1.2"/>
<text x="26.0" y="333.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="700">1</text>
<text x="46.0" y="333.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">background &amp; borders of the context root</text>
<text x="16.0" y="364.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">↑ top (painted last) … bottom (first) ↓</text>
<text x="16.0" y="390.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">z-index only reorders positioned</text>
<text x="16.0" y="409.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">elements within one context.</text>
</svg>
