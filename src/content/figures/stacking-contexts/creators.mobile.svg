<text x="126.1" y="550.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">effects</text>
<rect x="193.6" y="540.0" width="12.0" height="12.0" rx="2" fill="#7cc47f" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="211.6" y="550.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">explicit</text>
