<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 580" width="360" height="580" role="img" aria-label="Properties that create a new stacking context: positioning with z-index, fixed and sticky, opacity, transform, filter, isolation and more" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="580" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">What creates a context</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">often as a side effect</text>
<rect x="16.0" y="84.0" width="328.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#a69d8e" stroke-width="1"/>
<text x="180.0" y="101.0" font-size="11.5" fill="#a69d8e" text-anchor="middle" font-weight="600">root element</text>
<text x="180.0" y="117.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">&lt;html&gt;</text>
<rect x="16.0" y="130.0" width="328.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="180.0" y="147.0" font-size="11.5" fill="#ff5b2e" text-anchor="middle" font-weight="600">position + z-index</text>
<text x="180.0" y="163.0" font-size="11" fill="#ff5b2e" text-anchor="middle" font-weight="400">relative/absolute with z ≠ auto</text>
<rect x="16.0" y="176.0" width="328.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="180.0" y="193.0" font-size="11.5" fill="#ff5b2e" text-anchor="middle" font-weight="600">position: fixed / sticky</text>
<text x="180.0" y="209.0" font-size="11" fill="#ff5b2e" text-anchor="middle" font-weight="400">always</text>
<rect x="16.0" y="222.0" width="328.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="180.0" y="239.0" font-size="11.5" fill="#ff5b2e" text-anchor="middle" font-weight="600">flex / grid child</text>
<text x="180.0" y="255.0" font-size="11" fill="#ff5b2e" text-anchor="middle" font-weight="400">with z-index ≠ auto</text>
<rect x="16.0" y="268.0" width="328.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="285.0" font-size="11.5" fill="#e2b45a" text-anchor="middle" font-weight="600">opacity &lt; 1</text>
<text x="180.0" y="301.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="400">e.g. a fade animation</text>
<rect x="16.0" y="314.0" width="328.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="331.0" font-size="11.5" fill="#e2b45a" text-anchor="middle" font-weight="600">transform, filter</text>
<text x="180.0" y="347.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="400">perspective, clip-path, mask</text>
<rect x="16.0" y="360.0" width="328.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="377.0" font-size="11.5" fill="#e2b45a" text-anchor="middle" font-weight="600">mix-blend-mode</text>
<text x="180.0" y="393.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="400">≠ normal</text>
<rect x="16.0" y="406.0" width="328.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="423.0" font-size="11.5" fill="#e2b45a" text-anchor="middle" font-weight="600">will-change</text>
<text x="180.0" y="439.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="400">naming one of the above</text>
<rect x="16.0" y="452.0" width="328.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
