<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img" aria-label="Properties that create a new stacking context: positioning with z-index, fixed and sticky, opacity, transform, filter, isolation and more" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="430" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">What creates a stacking context</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">many properties do it as a side effect</text>
<rect x="40.0" y="96.0" width="390.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#a69d8e" stroke-width="1"/>
<text x="235.0" y="116.0" font-size="12.5" fill="#a69d8e" text-anchor="middle" font-weight="600">root element</text>
<text x="235.0" y="132.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">&lt;html&gt;</text>
<rect x="450.0" y="96.0" width="390.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="645.0" y="116.0" font-size="12.5" fill="#ff5b2e" text-anchor="middle" font-weight="600">position + z-index</text>
<text x="645.0" y="132.0" font-size="11" fill="#ff5b2e" text-anchor="middle" font-weight="400">relative/absolute with z ≠ auto</text>
<rect x="40.0" y="154.0" width="390.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="235.0" y="174.0" font-size="12.5" fill="#ff5b2e" text-anchor="middle" font-weight="600">position: fixed / sticky</text>
<text x="235.0" y="190.0" font-size="11" fill="#ff5b2e" text-anchor="middle" font-weight="400">always</text>
<rect x="450.0" y="154.0" width="390.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="645.0" y="174.0" font-size="12.5" fill="#ff5b2e" text-anchor="middle" font-weight="600">flex / grid child</text>
<text x="645.0" y="190.0" font-size="11" fill="#ff5b2e" text-anchor="middle" font-weight="400">with z-index ≠ auto</text>
<rect x="40.0" y="212.0" width="390.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="235.0" y="232.0" font-size="12.5" fill="#e2b45a" text-anchor="middle" font-weight="600">opacity &lt; 1</text>
<text x="235.0" y="248.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="400">e.g. a fade animation</text>
<rect x="450.0" y="212.0" width="390.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="645.0" y="232.0" font-size="12.5" fill="#e2b45a" text-anchor="middle" font-weight="600">transform, filter</text>
<text x="645.0" y="248.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="400">perspective, clip-path, mask</text>
<rect x="40.0" y="270.0" width="390.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="235.0" y="290.0" font-size="12.5" fill="#e2b45a" text-anchor="middle" font-weight="600">mix-blend-mode</text>
<text x="235.0" y="306.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="400">≠ normal</text>
<rect x="450.0" y="270.0" width="390.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="645.0" y="290.0" font-size="12.5" fill="#e2b45a" text-anchor="middle" font-weight="600">will-change</text>
<text x="645.0" y="306.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="400">naming one of the above</text>
<rect x="40.0" y="328.0" width="390.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="235.0" y="348.0" font-size="12.5" fill="#7cc47f" text-anchor="middle" font-weight="600">isolation: isolate</text>
<text x="235.0" y="364.0" font-size="11" fill="#7cc47f" text-anchor="middle" font-weight="400">the explicit way</text>
<rect x="450.0" y="328.0" width="390.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="645.0" y="348.0" font-size="12.5" fill="#7cc47f" text-anchor="middle" font-weight="600">contain</text>
<text x="645.0" y="364.0" font-size="11" fill="#7cc47f" text-anchor="middle" font-weight="400">layout / paint; container-type</text>
<rect x="40.0" y="390.0" width="12.0" height="12.0" rx="2" fill="#ff5b2e" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="58.0" y="400.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">positioning</text>
<rect x="158.4" y="390.0" width="12.0" height="12.0" rx="2" fill="#e2b45a" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="176.4" y="400.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">visual effects (surprising)</text>
<rect x="390.9" y="390.0" width="12.0" height="12.0" rx="2" fill="#7cc47f" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="408.9" y="400.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">explicit / containment</text>
</svg>
