<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" role="img" aria-label="A dropdown with z-index 9999 inside a card with z-index 1 is painted below a header with z-index 2" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="370" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Why z-index: 9999 loses</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">a child can never escape its parent stacking context</text>
<rect x="40.0" y="90.0" width="380.0" height="250.0" rx="8" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="56.0" y="112.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="700">root stacking context</text>
<rect x="60.0" y="130.0" width="170.0" height="190.0" rx="6" fill="#9b8cff" fill-opacity="0.25" stroke="#9b8cff" stroke-width="1.4"/>
<text x="72.0" y="152.0" font-size="12" fill="#9b8cff" text-anchor="start" font-weight="700">.card</text>
<text x="72.0" y="170.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">z-index: 1</text>
<text x="72.0" y="186.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">(creates a context)</text>
<rect x="76.0" y="220.0" width="140.0" height="44.0" rx="3" fill="#1b1712" fill-opacity="1" stroke="#d77fa1" stroke-width="1"/>
<text x="146.0" y="239.0" font-size="12" fill="#d77fa1" text-anchor="middle" font-weight="600">.dropdown</text>
<text x="146.0" y="255.0" font-size="11" fill="#d77fa1" text-anchor="middle" font-weight="400">z-index: 9999</text>
<rect x="250.0" y="130.0" width="150.0" height="190.0" rx="6" fill="#5fb3a1" fill-opacity="0.25" stroke="#5fb3a1" stroke-width="1.4"/>
<text x="262.0" y="152.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="700">.header</text>
<text x="262.0" y="170.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">z-index: 2</text>
<text x="460.0" y="110.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="700">what the browser compares</text>
<rect x="460.0" y="130.0" width="180.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="550.0" y="154.3" font-size="12" fill="#9b8cff" text-anchor="middle" font-weight="600">.card  →  1</text>
<rect x="660.0" y="130.0" width="180.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="750.0" y="154.3" font-size="12" fill="#5fb3a1" text-anchor="middle" font-weight="600">.header  →  2</text>
<text x="650.0" y="196.0" font-size="12" fill="#7cc47f" text-anchor="middle" font-weight="600">.header wins</text>
<text x="460.0" y="226.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">.dropdown's 9999 is only compared with its</text>
<text x="460.0" y="245.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">siblings inside .card. Seen from outside, the</text>
<text x="460.0" y="264.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">whole card (dropdown included) is one layer</text>
<text x="460.0" y="283.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">at z-index 1.</text>
<text x="460.0" y="321.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Fix: lift the context (.card z-index: 3),</text>
<text x="460.0" y="340.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">remove it, or portal the dropdown to &lt;body&gt;.</text>
</svg>
