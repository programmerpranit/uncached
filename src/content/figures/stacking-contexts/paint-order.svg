<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 354" width="880" height="354" role="img" aria-label="The seven layers painted inside a stacking context, from background to positive z-index" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="354" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Paint order inside one stacking context</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">back to front, as defined by CSS 2.1 Appendix E</text>
<rect x="60.0" y="270.0" width="340.0" height="52.0" rx="6" fill="#a69d8e" fill-opacity="0.25" stroke="#a69d8e" stroke-width="1.2"/>
<text x="72.0" y="302.0" font-size="13" fill="#a69d8e" text-anchor="start" font-weight="700">1</text>
<text x="96.0" y="302.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">background &amp; borders of the context root</text>
<rect x="94.0" y="236.0" width="340.0" height="52.0" rx="6" fill="#9b8cff" fill-opacity="0.33" stroke="#9b8cff" stroke-width="1.2"/>
<text x="106.0" y="268.0" font-size="13" fill="#9b8cff" text-anchor="start" font-weight="700">2</text>
<text x="130.0" y="268.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">positioned, z-index &lt; 0</text>
<rect x="128.0" y="202.0" width="340.0" height="52.0" rx="6" fill="#5fb3a1" fill-opacity="0.41000000000000003" stroke="#5fb3a1" stroke-width="1.2"/>
<text x="140.0" y="234.0" font-size="13" fill="#5fb3a1" text-anchor="start" font-weight="700">3</text>
<text x="164.0" y="234.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">in-flow blocks (non-positioned)</text>
<rect x="162.0" y="168.0" width="340.0" height="52.0" rx="6" fill="#5fb3a1" fill-opacity="0.49" stroke="#5fb3a1" stroke-width="1.2"/>
<text x="174.0" y="200.0" font-size="13" fill="#5fb3a1" text-anchor="start" font-weight="700">4</text>
<text x="198.0" y="200.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">floats</text>
<rect x="196.0" y="134.0" width="340.0" height="52.0" rx="6" fill="#5fb3a1" fill-opacity="0.5700000000000001" stroke="#5fb3a1" stroke-width="1.2"/>
<text x="208.0" y="166.0" font-size="13" fill="#5fb3a1" text-anchor="start" font-weight="700">5</text>
<text x="232.0" y="166.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">inline content: text, images</text>
<rect x="230.0" y="100.0" width="340.0" height="52.0" rx="6" fill="#e2b45a" fill-opacity="0.65" stroke="#e2b45a" stroke-width="1.2"/>
<text x="242.0" y="132.0" font-size="13" fill="#e2b45a" text-anchor="start" font-weight="700">6</text>
<text x="266.0" y="132.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">positioned, z-index: auto / 0</text>
<rect x="264.0" y="66.0" width="340.0" height="52.0" rx="6" fill="#ff5b2e" fill-opacity="0.73" stroke="#ff5b2e" stroke-width="1.2"/>
<text x="276.0" y="98.0" font-size="13" fill="#ff5b2e" text-anchor="start" font-weight="700">7</text>
<text x="300.0" y="98.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">positioned, z-index &gt; 0 (ascending)</text>
<line x1="630.0" y1="330.0" x2="630.0" y2="110.0" stroke="#a69d8e" stroke-width="1.3" marker-end="url(#ah0)"/>
<text x="642.0" y="118.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">towards the viewer</text>
<text x="642.0" y="170.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Within each layer, later in the</text>
<text x="642.0" y="189.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">document paints on top.</text>
<text x="642.0" y="227.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">z-index only reorders</text>
<text x="642.0" y="246.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">positioned elements (and flex/</text>
<text x="642.0" y="265.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">grid items) within the same</text>
<text x="642.0" y="284.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">stacking context.</text>
</svg>
