<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 459" width="360" height="459" role="img" aria-label="Service worker lifecycle: register, install, waiting, activate, controlling, with skipWaiting as a shortcut" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="459" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">SW lifecycle</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">new versions wait their turn</text>
<rect x="16.0" y="84.0" width="140.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#a69d8e" stroke-width="1"/>
<text x="86.0" y="108.3" font-size="12" fill="#a69d8e" text-anchor="middle" font-weight="600">register</text>
<text x="168.0" y="100.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">navigator.serviceWorker</text>
<text x="168.0" y="115.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">.register()</text>
<line x1="86.0" y1="126.0" x2="86.0" y2="140.0" stroke="#a69d8e" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="16.0" y="142.0" width="140.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="86.0" y="166.3" font-size="12" fill="#ff5b2e" text-anchor="middle" font-weight="600">install</text>
<text x="168.0" y="158.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">precache assets</text>
<text x="168.0" y="173.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">(event.waitUntil)</text>
<line x1="86.0" y1="184.0" x2="86.0" y2="198.0" stroke="#a69d8e" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="16.0" y="200.0" width="140.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="86.0" y="224.3" font-size="12" fill="#e2b45a" text-anchor="middle" font-weight="600">waiting</text>
<text x="168.0" y="216.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">old SW still</text>
<text x="168.0" y="231.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">controls tabs</text>
<line x1="86.0" y1="242.0" x2="86.0" y2="256.0" stroke="#a69d8e" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="16.0" y="258.0" width="140.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="86.0" y="282.3" font-size="12" fill="#9b8cff" text-anchor="middle" font-weight="600">activate</text>
<text x="168.0" y="274.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">delete old caches,</text>
<text x="168.0" y="289.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">clients.claim()</text>
<line x1="86.0" y1="300.0" x2="86.0" y2="314.0" stroke="#a69d8e" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="16.0" y="316.0" width="140.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="86.0" y="340.3" font-size="12" fill="#7cc47f" text-anchor="middle" font-weight="600">controlling</text>
<text x="168.0" y="332.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">handles fetch,</text>
<text x="168.0" y="347.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">push, sync</text>
<text x="16.0" y="382.0" font-size="11" fill="#d77fa1" text-anchor="start" font-weight="400">skipWaiting(): waiting → activate now</text>
<text x="16.0" y="410.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">v2 waits until no tab uses v1.</text>
<text x="16.0" y="429.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">A failed install discards v2.</text>
</svg>
