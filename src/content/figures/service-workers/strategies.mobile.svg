<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 554" width="360" height="554" role="img" aria-label="Four caching strategies: cache first, network first, stale-while-revalidate, and network or cache only" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="554" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Caching strategies</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">pick one per request type</text>
<rect x="16.0" y="84.0" width="328.0" height="104.0" rx="8" fill="#5fb3a1" fill-opacity="0.12" stroke="#5fb3a1" stroke-width="1.4"/>
<text x="28.0" y="108.0" font-size="13" fill="#5fb3a1" text-anchor="start" font-weight="700">cache first</text>
<text x="28.0" y="130.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">cache hit → done; miss → network, then</text>
<text x="28.0" y="145.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">store</text>
<text x="28.0" y="176.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">→ hashed JS/CSS, fonts, images</text>
<rect x="16.0" y="198.0" width="328.0" height="104.0" rx="8" fill="#e2b45a" fill-opacity="0.12" stroke="#e2b45a" stroke-width="1.4"/>
<text x="28.0" y="222.0" font-size="13" fill="#e2b45a" text-anchor="start" font-weight="700">network first</text>
<text x="28.0" y="244.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">try network (with timeout); fail → cache</text>
<text x="28.0" y="290.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">→ HTML, API data that must be fresh</text>
<rect x="16.0" y="312.0" width="328.0" height="104.0" rx="8" fill="#9b8cff" fill-opacity="0.12" stroke="#9b8cff" stroke-width="1.4"/>
<text x="28.0" y="336.0" font-size="13" fill="#9b8cff" text-anchor="start" font-weight="700">stale-while-revalidate</text>
<text x="28.0" y="358.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">answer from cache now; refresh cache in</text>
<text x="28.0" y="373.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">background</text>
<text x="28.0" y="404.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">→ avatars, non-critical API data</text>
<rect x="16.0" y="426.0" width="328.0" height="104.0" rx="8" fill="#a69d8e" fill-opacity="0.12" stroke="#a69d8e" stroke-width="1.4"/>
<text x="28.0" y="450.0" font-size="13" fill="#a69d8e" text-anchor="start" font-weight="700">network only / cache only</text>
<text x="28.0" y="472.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">no caching / precached only</text>
<text x="28.0" y="518.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">→ analytics, POSTs / app shell</text>
</svg>
