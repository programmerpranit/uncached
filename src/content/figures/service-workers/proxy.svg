<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 398" width="880" height="398" role="img" aria-label="A service worker intercepts fetches from the page and answers from Cache Storage or the network" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="398" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2b45a"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">A service worker sits between page and network</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">every fetch from controlled pages goes through its fetch handler</text>
<rect x="40.0" y="150.0" width="170.0" height="90.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="125.0" y="192.0" font-size="14" fill="#ede6d8" text-anchor="middle" font-weight="600">page</text>
<text x="125.0" y="208.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">fetch(), &lt;img&gt;, nav</text>
<rect x="330.0" y="130.0" width="220.0" height="130.0" rx="3" fill="#ff5b2e" fill-opacity="0.9" stroke="#ff5b2e" stroke-width="1"/>
<text x="440.0" y="200.0" font-size="14" fill="#1b1712" text-anchor="middle" font-weight="600">service worker</text>
<text x="440.0" y="220.0" font-size="11" fill="#1b1712" text-anchor="middle" font-weight="400">addEventListener('fetch')</text>
<text x="440.0" y="238.0" font-size="11" fill="#1b1712" text-anchor="middle" font-weight="400">event.respondWith(…)</text>
<rect x="660.0" y="90.0" width="180.0" height="70.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="750.0" y="122.0" font-size="13" fill="#5fb3a1" text-anchor="middle" font-weight="600">Cache Storage</text>
<text x="750.0" y="138.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="400">Request → Response</text>
<rect x="660.0" y="230.0" width="180.0" height="70.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="750.0" y="262.0" font-size="13" fill="#e2b45a" text-anchor="middle" font-weight="600">network</text>
<text x="750.0" y="278.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="400">server / CDN</text>
<line x1="212.0" y1="195.0" x2="326.0" y2="195.0" stroke="#a69d8e" stroke-width="1.5" marker-end="url(#ah0)"/>
<text x="268.0" y="186.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">request</text>
<line x1="552.0" y1="170.0" x2="656.0" y2="128.0" stroke="#5fb3a1" stroke-width="1.5" marker-end="url(#ah1)"/>
<line x1="552.0" y1="220.0" x2="656.0" y2="262.0" stroke="#e2b45a" stroke-width="1.5" marker-end="url(#ah2)"/>
<text x="40.0" y="330.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Runs on its own thread, with no DOM. Starts on demand and is stopped when idle.</text>
<text x="40.0" y="349.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Scope: controls pages under its URL path (e.g. /app/). Requires HTTPS (or localhost).</text>
<text x="40.0" y="368.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Can answer from the cache, the network, a mix, or a response it builds itself.</text>
</svg>
