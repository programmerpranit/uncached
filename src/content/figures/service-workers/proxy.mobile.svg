<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 414" width="360" height="414" role="img" aria-label="A service worker intercepts fetches from the page and answers from Cache Storage or the network" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="414" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2b45a"/></marker></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">SW as a network proxy</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">it intercepts every fetch</text>
<rect x="16.0" y="84.0" width="328.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="180.0" y="106.0" font-size="13" fill="#ede6d8" text-anchor="middle" font-weight="600">page</text>
<text x="180.0" y="122.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">fetch(), &lt;img&gt;, navigation</text>
<line x1="180.0" y1="136.0" x2="180.0" y2="162.0" stroke="#a69d8e" stroke-width="1.5" marker-end="url(#ah0)"/>
<rect x="16.0" y="166.0" width="328.0" height="62.0" rx="3" fill="#ff5b2e" fill-opacity="0.9" stroke="#ff5b2e" stroke-width="1"/>
<text x="180.0" y="201.7" font-size="13" fill="#1b1712" text-anchor="middle" font-weight="600">service worker</text>
<text x="180.0" y="214.0" font-size="10.5" fill="#1b1712" text-anchor="middle" font-weight="400">fetch event → respondWith()</text>
<line x1="100.0" y1="230.0" x2="100.0" y2="258.0" stroke="#5fb3a1" stroke-width="1.5" marker-end="url(#ah1)"/>
<line x1="260.0" y1="230.0" x2="260.0" y2="258.0" stroke="#e2b45a" stroke-width="1.5" marker-end="url(#ah2)"/>
<rect x="16.0" y="262.0" width="160.0" height="54.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="96.0" y="293.3" font-size="12" fill="#5fb3a1" text-anchor="middle" font-weight="600">Cache Storage</text>
<rect x="184.0" y="262.0" width="160.0" height="54.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="264.0" y="293.3" font-size="12" fill="#e2b45a" text-anchor="middle" font-weight="600">network</text>
<text x="16.0" y="346.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Own thread, no DOM; started on</text>
<text x="16.0" y="365.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">demand. Controls pages in its</text>
<text x="16.0" y="384.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">scope. HTTPS only.</text>
</svg>
