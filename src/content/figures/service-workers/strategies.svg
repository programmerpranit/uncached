<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="Four caching strategies: cache first, network first, stale-while-revalidate, and network or cache only" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="400" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Caching strategies</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">pick per request type, not one for the whole site</text>
<rect x="40.0" y="96.0" width="390.0" height="130.0" rx="8" fill="#5fb3a1" fill-opacity="0.12" stroke="#5fb3a1" stroke-width="1.4"/>
<text x="56.0" y="124.0" font-size="14" fill="#5fb3a1" text-anchor="start" font-weight="700">cache first</text>
<text x="56.0" y="152.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">cache hit → done; miss → network, then store</text>
<text x="56.0" y="180.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">good for:</text>
<text x="56.0" y="200.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">hashed JS/CSS, fonts, images</text>
<rect x="450.0" y="96.0" width="390.0" height="130.0" rx="8" fill="#e2b45a" fill-opacity="0.12" stroke="#e2b45a" stroke-width="1.4"/>
<text x="466.0" y="124.0" font-size="14" fill="#e2b45a" text-anchor="start" font-weight="700">network first</text>
<text x="466.0" y="152.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">try network (with timeout); fail → cache</text>
<text x="466.0" y="180.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">good for:</text>
<text x="466.0" y="200.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">HTML, API data that must be fresh</text>
<rect x="40.0" y="246.0" width="390.0" height="130.0" rx="8" fill="#9b8cff" fill-opacity="0.12" stroke="#9b8cff" stroke-width="1.4"/>
<text x="56.0" y="274.0" font-size="14" fill="#9b8cff" text-anchor="start" font-weight="700">stale-while-revalidate</text>
<text x="56.0" y="302.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">answer from cache now; refresh cache in background</text>
<text x="56.0" y="330.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">good for:</text>
<text x="56.0" y="350.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">avatars, non-critical API data</text>
<rect x="450.0" y="246.0" width="390.0" height="130.0" rx="8" fill="#a69d8e" fill-opacity="0.12" stroke="#a69d8e" stroke-width="1.4"/>
<text x="466.0" y="274.0" font-size="14" fill="#a69d8e" text-anchor="start" font-weight="700">network only / cache only</text>
<text x="466.0" y="302.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">no caching / precached only</text>
<text x="466.0" y="330.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">good for:</text>
<text x="466.0" y="350.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">analytics, POSTs / app shell</text>
</svg>
