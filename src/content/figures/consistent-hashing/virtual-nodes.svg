<text x="600.0" y="70.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600" >Virtual nodes</text>
<text x="600.0" y="100.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400" >Each physical server is hashed onto</text>
<text x="600.0" y="122.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400" >the ring many times (A#0, A#1, …).</text>
<text x="600.0" y="144.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400" ></text>
<text x="600.0" y="166.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400" >It owns many small arcs instead of</text>
<text x="600.0" y="188.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400" >one big one. With enough vnodes the</text>
<text x="600.0" y="210.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400" >totals even out, and a departing</text>
<text x="600.0" y="232.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400" >server’s keys scatter across all the</text>
<text x="600.0" y="254.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400" >others instead of one neighbour.</text>
<text x="600.0" y="276.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400" ></text>
<text x="600.0" y="298.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400" >Share of the ring with just 4 each —</text>
<text x="600.0" y="320.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400" >still lumpy (Fig. 5 uses 100):</text>
<rect x="600" y="339" width="190.6" height="14" fill="#ff5b2e"/>
<text x="798.6" y="351.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400" >A  45%</text>
<rect x="600" y="365" width="105.2" height="14" fill="#5fb3a1"/>
<text x="713.2" y="377.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400" >B  25%</text>
