<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img" aria-label="A text field is tokenized, lowercased, stripped of stop words and stemmed into terms; the inverted index maps each term to the documents containing it, and BM25 scores matches" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="430" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Analysis → inverted index → score</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">the same analyzer must run at index time and query time, or the terms will not match</text>
<rect x="40.0" y="90.0" width="220.0" height="46.0" rx="3" fill="#9b8cff" fill-opacity="0.18" stroke="#9b8cff" stroke-width="1"/>
<text x="150.0" y="117.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">"Running Shoes for Trails"</text>
<line x1="260.0" y1="113.0" x2="300.0" y2="113.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<text x="310.0" y="98.0" font-size="10.5" fill="#e2b45a" text-anchor="start" font-weight="700">tokenize</text>
<text x="400.0" y="98.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">Running | Shoes | for | Trails</text>
<text x="310.0" y="132.0" font-size="10.5" fill="#e2b45a" text-anchor="start" font-weight="700">lowercase</text>
<text x="400.0" y="132.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">running | shoes | for | trails</text>
<text x="310.0" y="166.0" font-size="10.5" fill="#e2b45a" text-anchor="start" font-weight="700">stop words</text>
<text x="400.0" y="166.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">running | shoes | trails</text>
<text x="310.0" y="200.0" font-size="10.5" fill="#e2b45a" text-anchor="start" font-weight="700">stem</text>
<text x="400.0" y="200.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">run | shoe | trail</text>
<text x="40.0" y="240.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="700">Inverted index (term → postings)</text>
<rect x="40.0" y="256.0" width="90.0" height="28.0" rx="3" fill="#5fb3a1" fill-opacity="0.2" stroke="#5fb3a1" stroke-width="1"/>
<text x="85.0" y="274.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">run</text>
<text x="146.0" y="275.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">→ doc 3, doc 7, doc 12</text>
<rect x="40.0" y="290.0" width="90.0" height="28.0" rx="3" fill="#5fb3a1" fill-opacity="0.2" stroke="#5fb3a1" stroke-width="1"/>
<text x="85.0" y="308.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">shoe</text>
<text x="146.0" y="309.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">→ doc 3, doc 9</text>
<rect x="40.0" y="324.0" width="90.0" height="28.0" rx="3" fill="#5fb3a1" fill-opacity="0.2" stroke="#5fb3a1" stroke-width="1"/>
<text x="85.0" y="342.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">trail</text>
<text x="146.0" y="343.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">→ doc 3, doc 7, doc 40</text>
<rect x="520.0" y="256.0" width="320.0" height="96.0" rx="3" fill="#7cc47f" fill-opacity="0.14" stroke="#7cc47f" stroke-width="1"/>
<text x="680.0" y="308.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="536.0" y="278.0" font-size="12" fill="#7cc47f" text-anchor="start" font-weight="700">BM25 relevance</text>
<text x="536.0" y="302.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">rare terms (low doc frequency) score higher</text>
<text x="536.0" y="318.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">term frequency saturates — 10 hits ≈ not 10×</text>
<text x="536.0" y="334.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">shorter fields weigh matches more</text>
<text x="40.0" y="400.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">Exact-match fields (IDs, status, tags) use keyword type: no analysis, used for filters, sorting and aggregations.</text>
</svg>
