<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 378" width="880" height="378" role="img" aria-label="Applications use an alias; a new index is created with the new mapping, filled with reindex, caught up with recent writes, and then the alias is atomically switched" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="378" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7cc47f"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Zero-downtime reindex with an alias</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">mappings and shard counts cannot change in place — build a new index and swap the alias atomically</text>
<circle cx="60.0" cy="106.0" r="16" fill="#5fb3a1" fill-opacity="1" stroke="0.25" stroke-width="#5fb3a1"/>
<text x="60.0" y="111.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="700">1</text>
<text x="90.0" y="111.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">App reads/writes alias "products" → products_v1</text>
<line x1="60.0" y1="122.0" x2="60.0" y2="148.0" stroke="#a69d8e" stroke-width="1" marker-end="url(#ah0)"/>
<circle cx="60.0" cy="164.0" r="16" fill="#9b8cff" fill-opacity="1" stroke="0.25" stroke-width="#9b8cff"/>
<text x="60.0" y="169.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="700">2</text>
<text x="90.0" y="169.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">Create products_v2 with new mapping / shard count</text>
<line x1="60.0" y1="180.0" x2="60.0" y2="206.0" stroke="#a69d8e" stroke-width="1" marker-end="url(#ah0)"/>
<circle cx="60.0" cy="222.0" r="16" fill="#e2b45a" fill-opacity="1" stroke="0.25" stroke-width="#e2b45a"/>
<text x="60.0" y="227.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="700">3</text>
<text x="90.0" y="227.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">_reindex v1 → v2 (or rebuild from source of truth)</text>
<line x1="60.0" y1="238.0" x2="60.0" y2="264.0" stroke="#a69d8e" stroke-width="1" marker-end="url(#ah0)"/>
<circle cx="60.0" cy="280.0" r="16" fill="#d77fa1" fill-opacity="1" stroke="0.25" stroke-width="#d77fa1"/>
<text x="60.0" y="285.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="700">4</text>
<text x="90.0" y="285.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">Catch up recent writes (dual-write or replay)</text>
<line x1="60.0" y1="296.0" x2="60.0" y2="322.0" stroke="#a69d8e" stroke-width="1" marker-end="url(#ah0)"/>
<circle cx="60.0" cy="338.0" r="16" fill="#7cc47f" fill-opacity="1" stroke="0.25" stroke-width="#7cc47f"/>
<text x="60.0" y="343.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="700">5</text>
<text x="90.0" y="343.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">Atomically move alias to v2; keep v1 for rollback</text>
<rect x="600.0" y="120.0" width="220.0" height="46.0" rx="3" fill="#ff5b2e" fill-opacity="0.2" stroke="#ff5b2e" stroke-width="1"/>
<text x="710.0" y="147.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">alias: products</text>
<rect x="560.0" y="230.0" width="130.0" height="44.0" rx="3" fill="#a69d8e" fill-opacity="0.12" stroke="#a69d8e" stroke-width="1"/>
<text x="625.0" y="256.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">products_v1</text>
<rect x="710.0" y="230.0" width="130.0" height="44.0" rx="3" fill="#7cc47f" fill-opacity="0.2" stroke="#7cc47f" stroke-width="1"/>
<text x="775.0" y="256.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">products_v2</text>
<line x1="680.0" y1="166.0" x2="625.0" y2="230.0" stroke="#a69d8e" stroke-width="1.2" stroke-dasharray="4,3"/>
<line x1="740.0" y1="166.0" x2="775.0" y2="230.0" stroke="#7cc47f" stroke-width="2" marker-end="url(#ah1)"/>
<text x="700.0" y="300.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">swap is one _aliases call</text>
</svg>
