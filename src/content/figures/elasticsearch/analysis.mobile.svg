<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 415" width="360" height="415" role="img" aria-label="A text field is tokenized, lowercased, stripped of stop words and stemmed into terms; the inverted index maps each term to the documents containing it, and BM25 scores matches" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="415" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Analysis → inverted index → score</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">text becomes terms, terms point to docs</text>
<rect x="16.0" y="70.0" width="328.0" height="36.0" rx="3" fill="#9b8cff" fill-opacity="0.18" stroke="#9b8cff" stroke-width="1"/>
<text x="180.0" y="91.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">"Running Shoes for Trails"</text>
<text x="16.0" y="132.0" font-size="10" fill="#e2b45a" text-anchor="start" font-weight="700">tokenize</text>
<text x="106.0" y="132.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">Running|Shoes|for|Trails</text>
<text x="16.0" y="156.0" font-size="10" fill="#e2b45a" text-anchor="start" font-weight="700">lowercase</text>
<text x="106.0" y="156.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">running|shoes|for|trails</text>
<text x="16.0" y="180.0" font-size="10" fill="#e2b45a" text-anchor="start" font-weight="700">stop words</text>
<text x="106.0" y="180.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">running|shoes|trails</text>
<text x="16.0" y="204.0" font-size="10" fill="#e2b45a" text-anchor="start" font-weight="700">stem</text>
<text x="106.0" y="204.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">run|shoe|trail</text>
<text x="16.0" y="242.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="700">Inverted index</text>
<rect x="16.0" y="254.0" width="74.0" height="26.0" rx="3" fill="#5fb3a1" fill-opacity="0.2" stroke="#5fb3a1" stroke-width="1"/>
<text x="53.0" y="270.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">run</text>
<text x="100.0" y="272.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">→ docs 3, 7, 12</text>
<rect x="16.0" y="286.0" width="74.0" height="26.0" rx="3" fill="#5fb3a1" fill-opacity="0.2" stroke="#5fb3a1" stroke-width="1"/>
<text x="53.0" y="302.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">shoe</text>
<text x="100.0" y="304.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">→ docs 3, 9</text>
<rect x="16.0" y="318.0" width="74.0" height="26.0" rx="3" fill="#5fb3a1" fill-opacity="0.2" stroke="#5fb3a1" stroke-width="1"/>
<text x="53.0" y="334.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">trail</text>
<text x="100.0" y="336.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">→ docs 3, 7, 40</text>
<text x="16.0" y="370.0" font-size="10" fill="#7cc47f" text-anchor="start" font-weight="400">BM25: rare terms score higher;</text>
<text x="16.0" y="385.0" font-size="10" fill="#7cc47f" text-anchor="start" font-weight="400">repeated terms saturate.</text>
</svg>
