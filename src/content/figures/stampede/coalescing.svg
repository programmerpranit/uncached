<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 369" width="880" height="369" role="img" aria-label="Request coalescing: one request recomputes the value while others wait for it" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="369" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5b2e"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Request coalescing (single flight)</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">one request recomputes; the rest wait for its result</text>
<rect x="40.0" y="80.0" width="120.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="100.0" y="100.0" font-size="11" fill="#ff5b2e" text-anchor="middle" font-weight="600">request 1</text>
<line x1="162.0" y1="96.0" x2="298.0" y2="190.0" stroke="#ff5b2e" stroke-width="1" marker-end="url(#ah0)"/>
<rect x="40.0" y="124.0" width="120.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="100.0" y="144.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">request 2</text>
<line x1="162.0" y1="140.0" x2="298.0" y2="190.0" stroke="#a69d8e" stroke-width="1" marker-end="url(#ah1)" stroke-dasharray="4 3"/>
<rect x="40.0" y="168.0" width="120.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="100.0" y="188.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">request 3</text>
<line x1="162.0" y1="184.0" x2="298.0" y2="190.0" stroke="#a69d8e" stroke-width="1" marker-end="url(#ah1)" stroke-dasharray="4 3"/>
<rect x="40.0" y="212.0" width="120.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="100.0" y="232.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">request 4</text>
<line x1="162.0" y1="228.0" x2="298.0" y2="190.0" stroke="#a69d8e" stroke-width="1" marker-end="url(#ah1)" stroke-dasharray="4 3"/>
<rect x="40.0" y="256.0" width="120.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="100.0" y="276.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">request 5</text>
<line x1="162.0" y1="272.0" x2="298.0" y2="190.0" stroke="#a69d8e" stroke-width="1" marker-end="url(#ah1)" stroke-dasharray="4 3"/>
<rect x="300.0" y="160.0" width="200.0" height="60.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="400.0" y="187.0" font-size="12" fill="#e2b45a" text-anchor="middle" font-weight="600">cache miss</text>
<text x="400.0" y="203.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="400">lock / in-flight map</text>
<rect x="600.0" y="160.0" width="180.0" height="60.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="690.0" y="187.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">database</text>
<text x="690.0" y="203.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">1 query</text>
<line x1="502.0" y1="190.0" x2="598.0" y2="190.0" stroke="#ff5b2e" stroke-width="1.2" marker-end="url(#ah0)"/>
<text x="300.0" y="250.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">requests 2–5 wait on the same future/promise</text>
<text x="40.0" y="320.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">In-process: Go’s singleflight, a map of in-flight futures. Across servers: a short-lived lock in Redis</text>
<text x="40.0" y="339.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">(SET key NX PX 5000), so only one server recomputes while others serve stale data or briefly wait.</text>
</svg>
