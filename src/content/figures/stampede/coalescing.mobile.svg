<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 365" width="360" height="365" role="img" aria-label="Request coalescing: one request recomputes the value while others wait for it" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="365" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5b2e"/></marker></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Request coalescing (single flight)</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">one recompute, many waiters</text>
<rect x="16.0" y="72.0" width="328.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="180.0" y="96.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">requests 1…1,000 miss</text>
<rect x="16.0" y="132.0" width="328.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="154.0" font-size="12" fill="#e2b45a" text-anchor="middle" font-weight="600">in-flight map / lock</text>
<text x="180.0" y="170.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="400">first request wins</text>
<line x1="180.0" y1="114.0" x2="180.0" y2="130.0" stroke="#a69d8e" stroke-width="1.1" marker-end="url(#ah0)"/>
<rect x="16.0" y="202.0" width="328.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="180.0" y="228.3" font-size="12" fill="#ff5b2e" text-anchor="middle" font-weight="600">database: 1 query</text>
<line x1="180.0" y1="184.0" x2="180.0" y2="200.0" stroke="#ff5b2e" stroke-width="1.1" marker-end="url(#ah1)"/>
<text x="16.0" y="278.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">The other 999 wait for the same</text>
<text x="16.0" y="297.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">result (or get stale data).</text>
<text x="16.0" y="316.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Go: singleflight. Across servers:</text>
<text x="16.0" y="335.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">a Redis lock with SET NX PX.</text>
</svg>
