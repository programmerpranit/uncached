<text x="80.0" y="288.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">10 s left</text>
<text x="820.0" y="288.0" font-size="10.5" fill="#a69d8e" text-anchor="end" font-weight="400">expiry</text>
<text x="86.0" y="100.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">P(refresh)</text>
<text x="40.0" y="330.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Each read refreshes early if  now − δ·β·ln(rand()) ≥ expiry,  where δ is how long the recompute takes. One request</text>
<text x="40.0" y="349.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">almost always refreshes shortly before expiry, so the key never actually expires under load. Larger β = earlier.</text>
