<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 414" width="880" height="414" role="img" aria-label="The DNS namespace as a tree: root delegates to org, com and io; com delegates to example.com and shop.com; example.com holds www, api and mail records; a panel shows the NS and glue records stored in the com zone" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="414" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Delegation: who is authoritative for what</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">each zone hands off a subtree with NS records; glue breaks the chicken-and-egg loop</text>
<rect x="380.0" y="80.0" width="120.0" height="40.0" rx="3" fill="#9b8cff" fill-opacity="0.22" stroke="#9b8cff" stroke-width="1"/>
<text x="440.0" y="104.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">.  (root)</text>
<rect x="140.0" y="170.0" width="120.0" height="40.0" rx="3" fill="#e2b45a" fill-opacity="0.22" stroke="#e2b45a" stroke-width="1"/>
<text x="200.0" y="194.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">org.</text>
<line x1="440.0" y1="120.0" x2="200.0" y2="168.0" stroke="#a69d8e" stroke-width="1" marker-end="url(#ah0)"/>
<rect x="380.0" y="170.0" width="120.0" height="40.0" rx="3" fill="#e2b45a" fill-opacity="0.22" stroke="#e2b45a" stroke-width="1"/>
<text x="440.0" y="194.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">com.</text>
<line x1="440.0" y1="120.0" x2="440.0" y2="168.0" stroke="#a69d8e" stroke-width="1" marker-end="url(#ah0)"/>
<rect x="620.0" y="170.0" width="120.0" height="40.0" rx="3" fill="#e2b45a" fill-opacity="0.22" stroke="#e2b45a" stroke-width="1"/>
<text x="680.0" y="194.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">io.</text>
<line x1="440.0" y1="120.0" x2="680.0" y2="168.0" stroke="#a69d8e" stroke-width="1" marker-end="url(#ah0)"/>
<rect x="200.0" y="260.0" width="160.0" height="40.0" rx="3" fill="#d77fa1" fill-opacity="0.22" stroke="#d77fa1" stroke-width="1"/>
<text x="280.0" y="284.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">example.com.</text>
<line x1="440.0" y1="210.0" x2="280.0" y2="258.0" stroke="#a69d8e" stroke-width="1" marker-end="url(#ah0)"/>
<rect x="400.0" y="260.0" width="160.0" height="40.0" rx="3" fill="#d77fa1" fill-opacity="0.22" stroke="#d77fa1" stroke-width="1"/>
<text x="480.0" y="284.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">shop.com.</text>
<line x1="440.0" y1="210.0" x2="480.0" y2="258.0" stroke="#a69d8e" stroke-width="1" marker-end="url(#ah0)"/>
<rect x="100.0" y="350.0" width="110.0" height="34.0" rx="3" fill="#5fb3a1" fill-opacity="0.22" stroke="#5fb3a1" stroke-width="1"/>
<text x="155.0" y="370.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">www</text>
<rect x="225.0" y="350.0" width="110.0" height="34.0" rx="3" fill="#5fb3a1" fill-opacity="0.22" stroke="#5fb3a1" stroke-width="1"/>
<text x="280.0" y="370.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">api</text>
<rect x="350.0" y="350.0" width="110.0" height="34.0" rx="3" fill="#5fb3a1" fill-opacity="0.22" stroke="#5fb3a1" stroke-width="1"/>
<text x="405.0" y="370.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">mail (MX)</text>
<line x1="280.0" y1="300.0" x2="155.0" y2="348.0" stroke="#a69d8e" stroke-width="1" marker-end="url(#ah0)"/>
<line x1="280.0" y1="300.0" x2="280.0" y2="348.0" stroke="#a69d8e" stroke-width="1" marker-end="url(#ah0)"/>
<line x1="280.0" y1="300.0" x2="405.0" y2="348.0" stroke="#a69d8e" stroke-width="1" marker-end="url(#ah0)"/>
<rect x="600.0" y="250.0" width="250.0" height="140.0" rx="8" fill="#2f2921" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="614.0" y="272.0" font-size="9.5" fill="#ede6d8" text-anchor="start" font-weight="700">In the com. zone:</text>
<text x="614.0" y="288.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">example.com. NS ns1.example.com.</text>
<text x="614.0" y="304.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">ns1.example.com. A 192.0.2.53</text>
<text x="614.0" y="320.0" font-size="9.5" fill="#e2b45a" text-anchor="start" font-weight="600">  ↑ glue record</text>
<text x="614.0" y="352.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">Without glue, finding ns1 would</text>
<text x="614.0" y="368.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">require asking ns1 itself.</text>
</svg>
