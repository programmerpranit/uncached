<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 329" width="880" height="329" role="img" aria-label="Worker leases with heartbeats; when a worker crashes, its lease expires and another worker retries" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="329" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Worker leases, heartbeats and retries</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">a run is owned only while its lease is renewed</text>
<text x="40.0" y="144.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="600">worker 1</text>
<text x="40.0" y="224.0" font-size="12" fill="#9b8cff" text-anchor="start" font-weight="600">worker 2</text>
<line x1="130.0" y1="140.0" x2="840.0" y2="140.0" stroke="#4a4136" stroke-width="1.3"/>
<line x1="130.0" y1="220.0" x2="840.0" y2="220.0" stroke="#4a4136" stroke-width="1.3"/>
<rect x="150.0" y="130.0" width="250.0" height="20.0" rx="3" fill="#5fb3a1" fill-opacity="0.35" stroke="#5fb3a1" stroke-width="1"/>
<text x="160.0" y="144.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">run 881 (attempt 1)</text>
<line x1="200.0" y1="130.0" x2="200.0" y2="112.0" stroke="#5fb3a1" stroke-width="1"/>
<line x1="260.0" y1="130.0" x2="260.0" y2="112.0" stroke="#5fb3a1" stroke-width="1"/>
<line x1="320.0" y1="130.0" x2="320.0" y2="112.0" stroke="#5fb3a1" stroke-width="1"/>
<line x1="380.0" y1="130.0" x2="380.0" y2="112.0" stroke="#5fb3a1" stroke-width="1"/>
<text x="290.0" y="106.0" font-size="10.5" fill="#5fb3a1" text-anchor="middle" font-weight="400">heartbeats extend lease</text>
<text x="410.0" y="144.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="600">✗ crash</text>
<rect x="400.0" y="160.0" width="120.0" height="14.0" rx="3" fill="#e5534b" fill-opacity="0.2" stroke="#e5534b" stroke-width="1" stroke-dasharray="3 3"/>
<text x="460.0" y="190.0" font-size="10.5" fill="#e5534b" text-anchor="middle" font-weight="400">lease expires</text>
<rect x="540.0" y="210.0" width="220.0" height="20.0" rx="3" fill="#9b8cff" fill-opacity="0.35" stroke="#9b8cff" stroke-width="1"/>
<text x="550.0" y="224.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">run 881 (attempt 2)</text>
<line x1="520.0" y1="174.0" x2="540.0" y2="210.0" stroke="#a69d8e" stroke-width="1" marker-end="url(#ah0)"/>
<text x="40.0" y="280.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Retries mean a run can execute more than once (attempt 1 may have done half its work, or may still be running</text>
<text x="40.0" y="299.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">after a network partition). So jobs must be idempotent, and writes should carry the attempt or a fencing token.</text>
</svg>
