<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 469" width="880" height="469" role="img" aria-label="Job scheduler architecture: API, job store, schedulers, queue and workers" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="469" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5b2e"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b8cff"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker><marker id="ah4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7cc47f"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Scheduler architecture</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">separate "when to run" from "running it"</text>
<rect x="30.0" y="80.0" width="140.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="100.0" y="102.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">API</text>
<text x="100.0" y="118.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">create / cancel</text>
<rect x="230.0" y="80.0" width="180.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="320.0" y="102.0" font-size="12" fill="#e2b45a" text-anchor="middle" font-weight="600">job store</text>
<text x="320.0" y="118.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="400">definitions + runs</text>
<line x1="172.0" y1="105.0" x2="228.0" y2="105.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="230.0" y="200.0" width="180.0" height="60.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="320.0" y="227.0" font-size="12" fill="#ff5b2e" text-anchor="middle" font-weight="600">schedulers</text>
<text x="320.0" y="243.0" font-size="11" fill="#ff5b2e" text-anchor="middle" font-weight="400">partitioned by job id</text>
<line x1="320.0" y1="132.0" x2="320.0" y2="198.0" stroke="#ff5b2e" stroke-width="1.1" marker-end="url(#ah1)"/>
<text x="330.0" y="170.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">poll due runs</text>
<rect x="480.0" y="200.0" width="160.0" height="60.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="560.0" y="227.0" font-size="12" fill="#9b8cff" text-anchor="middle" font-weight="600">queue</text>
<text x="560.0" y="243.0" font-size="11" fill="#9b8cff" text-anchor="middle" font-weight="400">ready runs</text>
<line x1="412.0" y1="230.0" x2="478.0" y2="230.0" stroke="#9b8cff" stroke-width="1.2" marker-end="url(#ah2)"/>
<rect x="710.0" y="150.0" width="140.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="780.0" y="176.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="600">worker 1</text>
<line x1="642.0" y1="230.0" x2="708.0" y2="172.0" stroke="#5fb3a1" stroke-width="1" marker-end="url(#ah3)"/>
<rect x="710.0" y="206.0" width="140.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="780.0" y="232.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="600">worker 2</text>
<line x1="642.0" y1="230.0" x2="708.0" y2="228.0" stroke="#5fb3a1" stroke-width="1" marker-end="url(#ah3)"/>
<rect x="710.0" y="262.0" width="140.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="780.0" y="288.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="600">worker 3</text>
<line x1="642.0" y1="230.0" x2="708.0" y2="284.0" stroke="#5fb3a1" stroke-width="1" marker-end="url(#ah3)"/>
<path d="M780 318 L780 350 L200 350 L200 122 L226 122" fill="none" stroke="#7cc47f" stroke-width="1.1" marker-end="url(#ah4)" stroke-dasharray="4 3"/>
<text x="490.0" y="368.0" font-size="10.5" fill="#7cc47f" text-anchor="middle" font-weight="400">status, heartbeats, results</text>
<text x="30.0" y="420.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Schedulers only decide which runs are due and enqueue them; workers only execute. Each can scale and fail</text>
<text x="30.0" y="439.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">independently, and the job store is the source of truth for every run’s state.</text>
</svg>
