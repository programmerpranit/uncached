<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 371" width="880" height="371" role="img" aria-label="A normal frame runs JavaScript, then style, layout, paint and composite once; interleaving DOM writes and geometry reads forces style and layout to run repeatedly inside the JavaScript task" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="371" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">One frame, and where forced layout sneaks in</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">normally layout runs once, after your JavaScript</text>
<text x="40.0" y="104.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="700">Normal frame</text>
<rect x="40.0" y="116.0" width="222.0" height="40.0" rx="3" fill="#e2b45a" fill-opacity="0.18" stroke="#e2b45a" stroke-width="1"/>
<text x="151.0" y="140.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">JavaScript</text>
<rect x="282.0" y="116.0" width="122.0" height="40.0" rx="3" fill="#9b8cff" fill-opacity="0.18" stroke="#9b8cff" stroke-width="1"/>
<text x="343.0" y="140.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Style</text>
<rect x="424.0" y="116.0" width="122.0" height="40.0" rx="3" fill="#5fb3a1" fill-opacity="0.18" stroke="#5fb3a1" stroke-width="1"/>
<text x="485.0" y="140.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Layout</text>
<rect x="566.0" y="116.0" width="122.0" height="40.0" rx="3" fill="#d77fa1" fill-opacity="0.18" stroke="#d77fa1" stroke-width="1"/>
<text x="627.0" y="140.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Paint</text>
<rect x="708.0" y="116.0" width="122.0" height="40.0" rx="3" fill="#7cc47f" fill-opacity="0.18" stroke="#7cc47f" stroke-width="1"/>
<text x="769.0" y="140.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Composite</text>
<text x="40.0" y="200.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="700">Forced layout: a read after a write</text>
<rect x="40.0" y="212.0" width="66.0" height="40.0" rx="3" fill="#e2b45a" fill-opacity="0.18" stroke="#e2b45a" stroke-width="1"/>
<text x="73.0" y="236.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">write</text>
<rect x="110.0" y="212.0" width="56.0" height="40.0" rx="3" fill="#9b8cff" fill-opacity="0.18" stroke="#9b8cff" stroke-width="1"/>
<text x="138.0" y="236.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Style</text>
<rect x="170.0" y="212.0" width="66.0" height="40.0" rx="3" fill="#5fb3a1" fill-opacity="0.18" stroke="#5fb3a1" stroke-width="1"/>
<text x="203.0" y="236.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Layout</text>
<rect x="240.0" y="212.0" width="56.0" height="40.0" rx="3" fill="#e2b45a" fill-opacity="0.18" stroke="#e2b45a" stroke-width="1"/>
<text x="268.0" y="236.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">read</text>
<rect x="300.0" y="212.0" width="56.0" height="40.0" rx="3" fill="#e2b45a" fill-opacity="0.18" stroke="#e2b45a" stroke-width="1"/>
<text x="328.0" y="236.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">write</text>
<rect x="360.0" y="212.0" width="56.0" height="40.0" rx="3" fill="#9b8cff" fill-opacity="0.18" stroke="#9b8cff" stroke-width="1"/>
<text x="388.0" y="236.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Style</text>
<rect x="420.0" y="212.0" width="66.0" height="40.0" rx="3" fill="#5fb3a1" fill-opacity="0.18" stroke="#5fb3a1" stroke-width="1"/>
<text x="453.0" y="236.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Layout</text>
<rect x="490.0" y="212.0" width="56.0" height="40.0" rx="3" fill="#e2b45a" fill-opacity="0.18" stroke="#e2b45a" stroke-width="1"/>
<text x="518.0" y="236.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">read</text>
<rect x="558.0" y="212.0" width="90.0" height="40.0" rx="3" fill="#d77fa1" fill-opacity="0.18" stroke="#d77fa1" stroke-width="1"/>
<text x="603.0" y="236.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Paint</text>
<rect x="656.0" y="212.0" width="100.0" height="40.0" rx="3" fill="#7cc47f" fill-opacity="0.18" stroke="#7cc47f" stroke-width="1"/>
<text x="706.0" y="236.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Composite</text>
<rect x="36.0" y="206.0" width="520.0" height="52.0" rx="8" fill="none" fill-opacity="1" stroke="#e5534b" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="40.0" y="284.0" font-size="11" fill="#e5534b" text-anchor="start" font-weight="400">all inside one JavaScript task, so the 16.7 ms budget goes on repeated layout</text>
<text x="40.0" y="322.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">The browser defers style and layout so it can do them once per frame. Reading a geometry property such as</text>
<text x="40.0" y="341.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">offsetHeight while the DOM is dirty forces it to run them now, synchronously, before your next line executes.</text>
</svg>
