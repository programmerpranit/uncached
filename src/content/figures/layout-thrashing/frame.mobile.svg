<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 579" width="360" height="579" role="img" aria-label="A normal frame runs JavaScript, then style, layout, paint and composite once; interleaving DOM writes and geometry reads forces style and layout to run repeatedly inside the JavaScript task" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="579" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Forced synchronous layout</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">layout pulled into your JS</text>
<text x="16.0" y="96.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="700">Normal frame</text>
<rect x="16.0" y="106.0" width="328.0" height="30.0" rx="3" fill="#e2b45a" fill-opacity="0.18" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="125.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">JavaScript</text>
<rect x="16.0" y="142.0" width="328.0" height="30.0" rx="3" fill="#9b8cff" fill-opacity="0.18" stroke="#9b8cff" stroke-width="1"/>
<text x="180.0" y="161.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Style</text>
<rect x="16.0" y="178.0" width="328.0" height="30.0" rx="3" fill="#5fb3a1" fill-opacity="0.18" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="197.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Layout</text>
<rect x="16.0" y="214.0" width="328.0" height="30.0" rx="3" fill="#d77fa1" fill-opacity="0.18" stroke="#d77fa1" stroke-width="1"/>
<text x="180.0" y="233.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Paint</text>
<rect x="16.0" y="250.0" width="328.0" height="30.0" rx="3" fill="#7cc47f" fill-opacity="0.18" stroke="#7cc47f" stroke-width="1"/>
<text x="180.0" y="269.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Composite</text>
<text x="16.0" y="306.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="700">Read after write, in a loop</text>
<rect x="28.0" y="318.0" width="304.0" height="26.0" rx="3" fill="#e2b45a" fill-opacity="0.18" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="335.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">write</text>
<rect x="28.0" y="349.0" width="304.0" height="26.0" rx="3" fill="#5fb3a1" fill-opacity="0.18" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="366.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Style + Layout</text>
<rect x="28.0" y="380.0" width="304.0" height="26.0" rx="3" fill="#e2b45a" fill-opacity="0.18" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="397.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">read</text>
<rect x="28.0" y="411.0" width="304.0" height="26.0" rx="3" fill="#e2b45a" fill-opacity="0.18" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="428.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">write</text>
<rect x="28.0" y="442.0" width="304.0" height="26.0" rx="3" fill="#5fb3a1" fill-opacity="0.18" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="459.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Style + Layout</text>
<rect x="28.0" y="473.0" width="304.0" height="26.0" rx="3" fill="#e2b45a" fill-opacity="0.18" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="490.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">read</text>
<rect x="18.0" y="312.0" width="324.0" height="194.0" rx="8" fill="none" fill-opacity="1" stroke="#e5534b" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="16.0" y="530.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">A geometry read on a dirty DOM</text>
<text x="16.0" y="549.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">runs style and layout right now.</text>
</svg>
