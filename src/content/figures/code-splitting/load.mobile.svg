<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 314" width="360" height="314" role="img" aria-label="Loading timeline comparing a single large bundle with split chunks, showing earlier interactivity" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="314" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">What the user waits for</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">before vs after splitting</text>
<text x="16.0" y="84.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">one bundle</text>
<rect x="16.0" y="94.0" width="20.0" height="24.0" rx="3" fill="#a69d8e" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<rect x="36.0" y="94.0" width="190.0" height="24.0" rx="3" fill="#e2b45a" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<rect x="226.0" y="94.0" width="110.0" height="24.0" rx="3" fill="#e5534b" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<line x1="336.0" y1="88.0" x2="336.0" y2="126.0" stroke="#7cc47f" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="16.0" y="150.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">split</text>
<rect x="16.0" y="160.0" width="20.0" height="24.0" rx="3" fill="#a69d8e" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<rect x="36.0" y="160.0" width="70.0" height="24.0" rx="3" fill="#ff5b2e" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<rect x="106.0" y="160.0" width="45.0" height="24.0" rx="3" fill="#e5534b" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<rect x="151.0" y="160.0" width="30.0" height="24.0" rx="3" fill="#9b8cff" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<line x1="181.0" y1="154.0" x2="181.0" y2="192.0" stroke="#7cc47f" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="16.0" y="206.0" width="12.0" height="12.0" rx="2" fill="#e2b45a" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="34.0" y="216.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">download</text>
<rect x="110.6" y="206.0" width="12.0" height="12.0" rx="2" fill="#e5534b" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="128.6" y="216.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">execute</text>
<text x="16.0" y="246.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">JS costs network bytes and</text>
<text x="16.0" y="265.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">main-thread time. Splitting</text>
<text x="16.0" y="284.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">cuts both for the first load.</text>
</svg>
