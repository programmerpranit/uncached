<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 397" width="880" height="397" role="img" aria-label="A single 1.2 MB bundle split into entry, vendor, per-route, on-demand and shared chunks" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="397" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Code splitting: one bundle becomes several chunks</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">split points are dynamic import() calls and entries</text>
<text x="40.0" y="96.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="600">before</text>
<rect x="40.0" y="104.0" width="800.0" height="40.0" rx="3" fill="#e2b45a" fill-opacity="0.8" stroke="none" stroke-width="1"/>
<text x="440.0" y="129.0" font-size="12" fill="#1b1712" text-anchor="middle" font-weight="700">app.js  ·  1.2 MB  ·  every route, every library</text>
<text x="40.0" y="186.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="600">after</text>
<rect x="40.0" y="194.0" width="144.0" height="40.0" rx="3" fill="#ff5b2e" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="112.0" y="219.0" font-size="12" fill="#1b1712" text-anchor="middle" font-weight="700">entry</text>
<text x="112.0" y="254.0" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="400">router, shell</text>
<text x="112.0" y="270.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">loaded first</text>
<rect x="194.0" y="194.0" width="164.0" height="40.0" rx="3" fill="#5fb3a1" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="276.0" y="219.0" font-size="12" fill="#1b1712" text-anchor="middle" font-weight="700">vendor</text>
<text x="276.0" y="254.0" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="400">react, react-dom</text>
<text x="276.0" y="270.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">long-cached</text>
<rect x="368.0" y="194.0" width="94.0" height="40.0" rx="3" fill="#9b8cff" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="415.0" y="219.0" font-size="12" fill="#1b1712" text-anchor="middle" font-weight="700">home</text>
<text x="415.0" y="254.0" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="400">route</text>
<text x="415.0" y="270.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">on navigation</text>
<rect x="472.0" y="194.0" width="154.0" height="40.0" rx="3" fill="#9b8cff" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="549.0" y="219.0" font-size="12" fill="#1b1712" text-anchor="middle" font-weight="700">dashboard</text>
<text x="549.0" y="254.0" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="400">route + charts</text>
<text x="549.0" y="270.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">on navigation</text>
<rect x="636.0" y="194.0" width="134.0" height="40.0" rx="3" fill="#d77fa1" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="703.0" y="219.0" font-size="12" fill="#1b1712" text-anchor="middle" font-weight="700">editor</text>
<text x="703.0" y="254.0" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="400">Monaco</text>
<text x="703.0" y="270.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">on click</text>
<rect x="780.0" y="194.0" width="58.0" height="40.0" rx="3" fill="#7cc47f" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="809.0" y="219.0" font-size="12" fill="#1b1712" text-anchor="middle" font-weight="700">shared</text>
<text x="809.0" y="254.0" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="400">common</text>
<text x="809.0" y="270.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">reused</text>
<text x="40.0" y="310.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Initial load downloads only entry + vendor (+ the current route). The editor chunk is fetched the first time</text>
<text x="40.0" y="329.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">someone opens the editor: const { Editor } = await import('./editor').</text>
<text x="40.0" y="367.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Shared modules used by several chunks are pulled into a common chunk so they download once.</text>
</svg>
