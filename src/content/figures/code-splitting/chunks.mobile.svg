<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 411" width="360" height="411" role="img" aria-label="A single 1.2 MB bundle split into entry, vendor, per-route, on-demand and shared chunks" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="411" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Code splitting</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">split at dynamic import()</text>
<text x="16.0" y="82.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="600">before</text>
<rect x="16.0" y="90.0" width="328.0" height="34.0" rx="3" fill="#e2b45a" fill-opacity="0.8" stroke="none" stroke-width="1"/>
<text x="180.0" y="112.0" font-size="12" fill="#1b1712" text-anchor="middle" font-weight="700">app.js · 1.2 MB</text>
<text x="16.0" y="152.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="600">after</text>
<rect x="16.0" y="160.0" width="220.0" height="30.0" rx="3" fill="#ff5b2e" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="24.0" y="180.0" font-size="11" fill="#1b1712" text-anchor="start" font-weight="700">entry: router, shell</text>
<text x="246.0" y="180.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">first</text>
<rect x="16.0" y="198.0" width="220.0" height="30.0" rx="3" fill="#5fb3a1" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="24.0" y="218.0" font-size="11" fill="#1b1712" text-anchor="start" font-weight="700">vendor: react</text>
<text x="246.0" y="218.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">first, cached</text>
<rect x="16.0" y="236.0" width="220.0" height="30.0" rx="3" fill="#9b8cff" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="24.0" y="256.0" font-size="11" fill="#1b1712" text-anchor="start" font-weight="700">home / dashboard</text>
<text x="246.0" y="256.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">per route</text>
<rect x="16.0" y="274.0" width="220.0" height="30.0" rx="3" fill="#d77fa1" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="24.0" y="294.0" font-size="11" fill="#1b1712" text-anchor="start" font-weight="700">editor (Monaco)</text>
<text x="246.0" y="294.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">on click</text>
<rect x="16.0" y="312.0" width="220.0" height="30.0" rx="3" fill="#7cc47f" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="24.0" y="332.0" font-size="11" fill="#1b1712" text-anchor="start" font-weight="700">shared</text>
<text x="246.0" y="332.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">reused</text>
<text x="16.0" y="362.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Split points: entries and</text>
<text x="16.0" y="381.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">dynamic import() calls.</text>
