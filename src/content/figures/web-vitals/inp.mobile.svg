<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 318" width="360" height="318" role="img" aria-label="Timeline of one interaction split into input delay, processing time and presentation delay until the next frame" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="318" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Anatomy of an interaction</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">input delay + processing + presentation</text>
<rect x="16.0" y="84.0" width="328.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="101.0" font-size="12" fill="#e2b45a" text-anchor="middle" font-weight="600">input delay</text>
<text x="180.0" y="117.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="400">another task is still running</text>
<rect x="16.0" y="136.0" width="328.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="180.0" y="153.0" font-size="12" fill="#ff5b2e" text-anchor="middle" font-weight="600">processing</text>
<text x="180.0" y="169.0" font-size="11" fill="#ff5b2e" text-anchor="middle" font-weight="400">your event handlers run</text>
<rect x="16.0" y="188.0" width="328.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="180.0" y="205.0" font-size="12" fill="#9b8cff" text-anchor="middle" font-weight="600">presentation</text>
<text x="180.0" y="221.0" font-size="11" fill="#9b8cff" text-anchor="middle" font-weight="400">style, layout, paint</text>
<text x="16.0" y="250.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Sum = one interaction's latency.</text>
<text x="16.0" y="269.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">INP ≈ the worst interaction</text>
<text x="16.0" y="288.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">on the page.</text>
</svg>
