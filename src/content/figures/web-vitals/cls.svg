<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 419" width="880" height="419" role="img" aria-label="A late-loading ad pushing article text down, with the impact fraction and distance fraction that make up its layout shift score" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="419" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">How a layout shift is scored</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">impact fraction × distance fraction, grouped in session windows</text>
<rect x="40.0" y="96.0" width="170.0" height="240.0" rx="10" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="125.0" y="90.0" font-size="11.5" fill="#a69d8e" text-anchor="middle" font-weight="400">before</text>
<rect x="52.0" y="110.0" width="146.0" height="90.0" rx="3" fill="#5fb3a1" fill-opacity="0.35" stroke="none" stroke-width="1"/>
<text x="125.0" y="160.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="400">article text</text>
<rect x="250.0" y="96.0" width="170.0" height="240.0" rx="10" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="335.0" y="90.0" font-size="11.5" fill="#a69d8e" text-anchor="middle" font-weight="400">after</text>
<rect x="262.0" y="110.0" width="146.0" height="60.0" rx="3" fill="#e2b45a" fill-opacity="0.5" stroke="none" stroke-width="1"/>
<text x="335.0" y="145.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="400">ad loads</text>
<rect x="262.0" y="180.0" width="146.0" height="90.0" rx="3" fill="#5fb3a1" fill-opacity="0.35" stroke="none" stroke-width="1"/>
<text x="335.0" y="230.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="400">article text</text>
<line x1="215.0" y1="200.0" x2="245.0" y2="200.0" stroke="#a69d8e" stroke-width="1.4" marker-end="url(#ah0)"/>
<text x="460.0" y="110.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">Text moved down 70 px in a 240 px viewport.</text>
<text x="460.0" y="150.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">impact fraction = union of before + after</text>
<text x="460.0" y="170.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">  area / viewport ≈ 0.66</text>
<text x="460.0" y="190.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">distance fraction = 70 / 240 ≈ 0.29</text>
<text x="460.0" y="230.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">shift score ≈ 0.66 × 0.29 ≈ 0.19  (needs improvement)</text>
<text x="40.0" y="370.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">CLS is the largest burst of shifts: shifts less than 1 s apart are summed into a window (max 5 s), and the</text>
<text x="40.0" y="389.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">worst window counts. Shifts within 500 ms of a user input are excluded.</text>
</svg>
