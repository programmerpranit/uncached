<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 395" width="880" height="395" role="img" aria-label="The three Core Web Vitals, LCP, INP and CLS, with their good, needs-improvement and poor thresholds" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="395" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">The three Core Web Vitals</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">loading, responsiveness, visual stability; judged at the 75th percentile</text>
<text x="40.0" y="118.0" font-size="20" fill="#ff5b2e" text-anchor="start" font-weight="700">LCP</text>
<text x="110.0" y="110.0" font-size="13" fill="#ede6d8" text-anchor="start" font-weight="600">Largest Contentful Paint</text>
<text x="110.0" y="128.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">when the main content appears</text>
<rect x="420.0" y="96.0" width="132.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="486.0" y="120.5" font-size="12.5" fill="#7cc47f" text-anchor="middle" font-weight="600">≤ 2.5 s</text>
<rect x="560.0" y="96.0" width="132.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="626.0" y="120.5" font-size="12.5" fill="#e2b45a" text-anchor="middle" font-weight="600">2.5–4 s</text>
<rect x="700.0" y="96.0" width="132.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<text x="766.0" y="120.5" font-size="12.5" fill="#e5534b" text-anchor="middle" font-weight="600">&gt; 4 s</text>
<text x="40.0" y="188.0" font-size="20" fill="#ff5b2e" text-anchor="start" font-weight="700">INP</text>
<text x="110.0" y="180.0" font-size="13" fill="#ede6d8" text-anchor="start" font-weight="600">Interaction to Next Paint</text>
<text x="110.0" y="198.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">how fast the page reacts to input</text>
<rect x="420.0" y="166.0" width="132.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="486.0" y="190.5" font-size="12.5" fill="#7cc47f" text-anchor="middle" font-weight="600">≤ 200 ms</text>
<rect x="560.0" y="166.0" width="132.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="626.0" y="190.5" font-size="12.5" fill="#e2b45a" text-anchor="middle" font-weight="600">200–500 ms</text>
<rect x="700.0" y="166.0" width="132.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<text x="766.0" y="190.5" font-size="12.5" fill="#e5534b" text-anchor="middle" font-weight="600">&gt; 500 ms</text>
<text x="40.0" y="258.0" font-size="20" fill="#ff5b2e" text-anchor="start" font-weight="700">CLS</text>
<text x="110.0" y="250.0" font-size="13" fill="#ede6d8" text-anchor="start" font-weight="600">Cumulative Layout Shift</text>
<text x="110.0" y="268.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">how much content jumps around</text>
<rect x="420.0" y="236.0" width="132.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="486.0" y="260.5" font-size="12.5" fill="#7cc47f" text-anchor="middle" font-weight="600">≤ 0.1</text>
<rect x="560.0" y="236.0" width="132.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="626.0" y="260.5" font-size="12.5" fill="#e2b45a" text-anchor="middle" font-weight="600">0.1–0.25</text>
<rect x="700.0" y="236.0" width="132.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<text x="766.0" y="260.5" font-size="12.5" fill="#e5534b" text-anchor="middle" font-weight="600">&gt; 0.25</text>
<text x="486.0" y="310.0" font-size="11" fill="#7cc47f" text-anchor="middle" font-weight="400">good</text>
<text x="626.0" y="310.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="400">needs improvement</text>
<text x="766.0" y="310.0" font-size="11" fill="#e5534b" text-anchor="middle" font-weight="400">poor</text>
<text x="40.0" y="346.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">A page "passes" when at least 75% of real visits are in the good range for all three metrics,</text>
<text x="40.0" y="365.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">measured separately on mobile and desktop.</text>
</svg>
