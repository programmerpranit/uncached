<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 437" width="360" height="437" role="img" aria-label="The three Core Web Vitals, LCP, INP and CLS, with their good, needs-improvement and poor thresholds" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="437" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">The three Core Web Vitals</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">judged at the 75th percentile</text>
<text x="16.0" y="98.0" font-size="12" fill="#ff5b2e" text-anchor="start" font-weight="700">LCP  ·  Largest Contentful Paint</text>
<text x="16.0" y="116.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">when the main content appears</text>
<rect x="16.0" y="126.0" width="104.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="68.0" y="145.0" font-size="11" fill="#7cc47f" text-anchor="middle" font-weight="600">≤ 2.5 s</text>
<rect x="128.0" y="126.0" width="104.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="145.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="600">2.5–4 s</text>
<rect x="240.0" y="126.0" width="104.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<text x="292.0" y="145.0" font-size="11" fill="#e5534b" text-anchor="middle" font-weight="600">&gt; 4 s</text>
<text x="16.0" y="188.0" font-size="12" fill="#ff5b2e" text-anchor="start" font-weight="700">INP  ·  Interaction to Next Paint</text>
<text x="16.0" y="206.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">how fast the page reacts to input</text>
<rect x="16.0" y="216.0" width="104.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="68.0" y="235.0" font-size="11" fill="#7cc47f" text-anchor="middle" font-weight="600">≤ 200 ms</text>
<rect x="128.0" y="216.0" width="104.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="235.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="600">200–500 ms</text>
<rect x="240.0" y="216.0" width="104.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<text x="292.0" y="235.0" font-size="11" fill="#e5534b" text-anchor="middle" font-weight="600">&gt; 500 ms</text>
<text x="16.0" y="278.0" font-size="12" fill="#ff5b2e" text-anchor="start" font-weight="700">CLS  ·  Cumulative Layout Shift</text>
<text x="16.0" y="296.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">how much content jumps around</text>
<rect x="16.0" y="306.0" width="104.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="68.0" y="325.0" font-size="11" fill="#7cc47f" text-anchor="middle" font-weight="600">≤ 0.1</text>
<rect x="128.0" y="306.0" width="104.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="325.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="600">0.1–0.25</text>
<rect x="240.0" y="306.0" width="104.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<text x="292.0" y="325.0" font-size="11" fill="#e5534b" text-anchor="middle" font-weight="600">&gt; 0.25</text>
<rect x="16.0" y="344.0" width="12.0" height="12.0" rx="2" fill="#7cc47f" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="34.0" y="354.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">good</text>
<rect x="82.0" y="344.0" width="12.0" height="12.0" rx="2" fill="#e2b45a" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="100.0" y="354.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">needs impr.</text>
<rect x="193.6" y="344.0" width="12.0" height="12.0" rx="2" fill="#e5534b" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="211.6" y="354.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">poor</text>
<text x="16.0" y="388.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Pass = 75% of real visits are good</text>
<text x="16.0" y="407.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">on all three, per device type.</text>
</svg>
