<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 339" width="880" height="339" role="img" aria-label="Timeline of one interaction split into input delay, processing time and presentation delay until the next frame" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="339" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e5534b"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Anatomy of an interaction</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">INP = input delay + processing + presentation delay</text>
<text x="40.0" y="100.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">main thread</text>
<rect x="40.0" y="110.0" width="220.0" height="40.0" rx="3" fill="#4a4136" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="150.0" y="135.0" font-size="11.5" fill="#a69d8e" text-anchor="middle" font-weight="400">other long task</text>
<rect x="264.0" y="110.0" width="260.0" height="40.0" rx="3" fill="#ff5b2e" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="394.0" y="135.0" font-size="12" fill="#1b1712" text-anchor="middle" font-weight="700">event handlers</text>
<rect x="528.0" y="110.0" width="150.0" height="40.0" rx="3" fill="#9b8cff" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="603.0" y="135.0" font-size="11.5" fill="#1b1712" text-anchor="middle" font-weight="600">style/layout/paint</text>
<circle cx="120.0" cy="180.0" r="6" fill="#e5534b" fill-opacity="1" stroke="none" stroke-width="1"/>
<line x1="120.0" y1="174.0" x2="120.0" y2="152.0" stroke="#e5534b" stroke-width="1.5" marker-end="url(#ah0)"/>
<text x="120.0" y="200.0" font-size="11" fill="#e5534b" text-anchor="middle" font-weight="400">tap</text>
<line x1="690.0" y1="100.0" x2="690.0" y2="170.0" stroke="#7cc47f" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="696.0" y="100.0" font-size="11" fill="#7cc47f" text-anchor="start" font-weight="400">next frame</text>
<line x1="120.0" y1="222.0" x2="262.0" y2="222.0" stroke="#e2b45a" stroke-width="2"/>
<line x1="120.0" y1="216.0" x2="120.0" y2="228.0" stroke="#e2b45a" stroke-width="2"/>
<line x1="262.0" y1="216.0" x2="262.0" y2="228.0" stroke="#e2b45a" stroke-width="2"/>
<text x="191.0" y="242.0" font-size="11.5" fill="#e2b45a" text-anchor="middle" font-weight="600">input delay</text>
<line x1="264.0" y1="222.0" x2="524.0" y2="222.0" stroke="#ff5b2e" stroke-width="2"/>
<line x1="264.0" y1="216.0" x2="264.0" y2="228.0" stroke="#ff5b2e" stroke-width="2"/>
<line x1="524.0" y1="216.0" x2="524.0" y2="228.0" stroke="#ff5b2e" stroke-width="2"/>
<text x="394.0" y="242.0" font-size="11.5" fill="#ff5b2e" text-anchor="middle" font-weight="600">processing time</text>
<line x1="528.0" y1="222.0" x2="688.0" y2="222.0" stroke="#9b8cff" stroke-width="2"/>
<line x1="528.0" y1="216.0" x2="528.0" y2="228.0" stroke="#9b8cff" stroke-width="2"/>
<line x1="688.0" y1="216.0" x2="688.0" y2="228.0" stroke="#9b8cff" stroke-width="2"/>
<text x="608.0" y="242.0" font-size="11.5" fill="#9b8cff" text-anchor="middle" font-weight="600">presentation delay</text>
<text x="40.0" y="290.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Every click, tap and key press on the page is measured; INP reports roughly the worst one (the 98th percentile</text>
<text x="40.0" y="309.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">for pages with many interactions). Scroll and hover don't count. All three parts block the same thread.</text>
</svg>
