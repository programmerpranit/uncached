<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 399" width="880" height="399" role="img" aria-label="A request handler validates input, enqueues a job and returns 202 immediately; workers pull jobs from a durable queue, call slow dependencies, retry failures with backoff and move exhausted jobs to a dead-letter queue" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="399" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7cc47f"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2b45a"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Moving work off the request path</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">the request enqueues and returns; workers do the slow part</text>
<rect x="40.0" y="120.0" width="130.0" height="56.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="105.0" y="152.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Client</text>
<rect x="220.0" y="120.0" width="150.0" height="56.0" rx="3" fill="#ff5b2e" fill-opacity="0.2" stroke="#ff5b2e" stroke-width="1"/>
<text x="295.0" y="145.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">API handler</text>
<text x="295.0" y="161.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">validate + enqueue</text>
<line x1="170.0" y1="148.0" x2="220.0" y2="148.0" stroke="#a69d8e" stroke-width="1.4" marker-end="url(#ah0)"/>
<text x="105.0" y="206.0" font-size="10.5" fill="#7cc47f" text-anchor="middle" font-weight="400">202 Accepted + job id</text>
<path d="M 240 176 Q 180 220 120 178" fill="none" stroke="#7cc47f" stroke-width="1.3" marker-end="url(#ah1)"/>
<rect x="420.0" y="112.0" width="180.0" height="72.0" rx="8" fill="#9b8cff" fill-opacity="0.15" stroke="#9b8cff" stroke-width="1.2"/>
<text x="436.0" y="136.0" font-size="12.5" fill="#9b8cff" text-anchor="start" font-weight="700">Queue / broker</text>
<rect x="436.0" y="150.0" width="24.0" height="22.0" rx="3" fill="#9b8cff" fill-opacity="0.5" stroke="none" stroke-width="1"/>
<rect x="466.0" y="150.0" width="24.0" height="22.0" rx="3" fill="#9b8cff" fill-opacity="0.5" stroke="none" stroke-width="1"/>
<rect x="496.0" y="150.0" width="24.0" height="22.0" rx="3" fill="#9b8cff" fill-opacity="0.5" stroke="none" stroke-width="1"/>
<rect x="526.0" y="150.0" width="24.0" height="22.0" rx="3" fill="#9b8cff" fill-opacity="0.5" stroke="none" stroke-width="1"/>
<rect x="556.0" y="150.0" width="24.0" height="22.0" rx="3" fill="#9b8cff" fill-opacity="0.5" stroke="none" stroke-width="1"/>
<line x1="370.0" y1="148.0" x2="420.0" y2="148.0" stroke="#a69d8e" stroke-width="1.4" marker-end="url(#ah0)"/>
<rect x="660.0" y="96.0" width="120.0" height="40.0" rx="3" fill="#5fb3a1" fill-opacity="0.2" stroke="#5fb3a1" stroke-width="1"/>
<text x="720.0" y="120.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Worker 1</text>
<line x1="600.0" y1="148.0" x2="660.0" y2="116.0" stroke="#5fb3a1" stroke-width="1.2" marker-end="url(#ah2)"/>
<rect x="660.0" y="146.0" width="120.0" height="40.0" rx="3" fill="#5fb3a1" fill-opacity="0.2" stroke="#5fb3a1" stroke-width="1"/>
<text x="720.0" y="170.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Worker 2</text>
<line x1="600.0" y1="148.0" x2="660.0" y2="166.0" stroke="#5fb3a1" stroke-width="1.2" marker-end="url(#ah2)"/>
<rect x="660.0" y="196.0" width="120.0" height="40.0" rx="3" fill="#5fb3a1" fill-opacity="0.2" stroke="#5fb3a1" stroke-width="1"/>
<text x="720.0" y="220.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Worker 3</text>
<line x1="600.0" y1="148.0" x2="660.0" y2="216.0" stroke="#5fb3a1" stroke-width="1.2" marker-end="url(#ah2)"/>
<rect x="660.0" y="268.0" width="180.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="750.0" y="295.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Email / PDF / API / DB</text>
<line x1="720.0" y1="236.0" x2="740.0" y2="268.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="420.0" y="240.0" width="180.0" height="56.0" rx="8" fill="#e5534b" fill-opacity="0.1" stroke="#e5534b" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="436.0" y="264.0" font-size="11.5" fill="#e2b45a" text-anchor="start" font-weight="700">Retry with backoff</text>
<text x="436.0" y="284.0" font-size="10.5" fill="#e5534b" text-anchor="start" font-weight="400">then dead-letter queue</text>
<path d="M 660 196 Q 620 250 600 262" fill="none" stroke="#e2b45a" stroke-width="1.2" marker-end="url(#ah3)" stroke-dasharray="4 3"/>
<text x="40.0" y="350.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">The user waits ~20 ms for validation and an enqueue, not 4 s for a PDF. Workers scale separately,</text>
<text x="40.0" y="369.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">retry failures and absorb spikes: the queue is a buffer between producers and capacity.</text>
</svg>
