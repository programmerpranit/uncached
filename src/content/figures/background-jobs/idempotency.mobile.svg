<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 503" width="360" height="503" role="img" aria-label="Duplicate execution: worker A performs a side effect then crashes before acknowledging, the lease expires, worker B reruns the job; without an idempotency key the card is charged twice, with one the second run is skipped" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="503" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Idempotent jobs</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">runs twice, effect once</text>
<rect x="16.0" y="90.0" width="328.0" height="44.0" rx="8" fill="#5fb3a1" fill-opacity="0.12" stroke="#5fb3a1" stroke-width="1.2"/>
<text x="28.0" y="109.0" font-size="11.5" fill="#5fb3a1" text-anchor="start" font-weight="700">1. Worker A</text>
<text x="28.0" y="126.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">charges card, sends email</text>
<rect x="16.0" y="142.0" width="328.0" height="44.0" rx="8" fill="#e5534b" fill-opacity="0.12" stroke="#e5534b" stroke-width="1.2"/>
<text x="28.0" y="161.0" font-size="11.5" fill="#e5534b" text-anchor="start" font-weight="700">2. Worker A</text>
<text x="28.0" y="178.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">crashes before ack</text>
<rect x="16.0" y="194.0" width="328.0" height="44.0" rx="8" fill="#9b8cff" fill-opacity="0.12" stroke="#9b8cff" stroke-width="1.2"/>
<text x="28.0" y="213.0" font-size="11.5" fill="#9b8cff" text-anchor="start" font-weight="700">3. Queue</text>
<text x="28.0" y="230.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">lease expires, re-delivers</text>
<rect x="16.0" y="246.0" width="328.0" height="44.0" rx="8" fill="#5fb3a1" fill-opacity="0.12" stroke="#5fb3a1" stroke-width="1.2"/>
<text x="28.0" y="265.0" font-size="11.5" fill="#5fb3a1" text-anchor="start" font-weight="700">4. Worker B</text>
<text x="28.0" y="282.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">runs the same job again</text>
<rect x="16.0" y="298.0" width="328.0" height="52.0" rx="8" fill="#e5534b" fill-opacity="0.08" stroke="#e5534b" stroke-width="1.2"/>
<text x="28.0" y="318.0" font-size="11.5" fill="#e5534b" text-anchor="start" font-weight="700">Without a key</text>
<text x="28.0" y="338.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">charged twice, two emails</text>
<rect x="16.0" y="360.0" width="328.0" height="70.0" rx="8" fill="#7cc47f" fill-opacity="0.08" stroke="#7cc47f" stroke-width="1.2"/>
<text x="28.0" y="380.0" font-size="11.5" fill="#7cc47f" text-anchor="start" font-weight="700">With an idempotency key</text>
<text x="28.0" y="400.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">key order-812:charge</text>
<text x="28.0" y="418.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">already done → skip</text>
<text x="16.0" y="454.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">Exactly-once delivery is a myth;</text>
<text x="16.0" y="473.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">exactly-once effect is not.</text>
</svg>
