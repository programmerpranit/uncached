<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 517" width="360" height="517" role="img" aria-label="A request handler validates input, enqueues a job and returns 202 immediately; workers pull jobs from a durable queue, call slow dependencies, retry failures with backoff and move exhausted jobs to a dead-letter queue" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="517" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Off the request path</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">enqueue fast, work later</text>
<rect x="16.0" y="90.0" width="328.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="180.0" y="117.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Client</text>
<line x1="180.0" y1="136.0" x2="180.0" y2="152.0" stroke="#a69d8e" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="16.0" y="152.0" width="328.0" height="46.0" rx="3" fill="#ff5b2e" fill-opacity="0.2" stroke="#ff5b2e" stroke-width="1"/>
<text x="180.0" y="172.0" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">API handler</text>
<text x="180.0" y="188.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">validate + enqueue → 202</text>
<line x1="180.0" y1="198.0" x2="180.0" y2="214.0" stroke="#a69d8e" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="16.0" y="214.0" width="328.0" height="46.0" rx="3" fill="#9b8cff" fill-opacity="0.2" stroke="#9b8cff" stroke-width="1"/>
<text x="180.0" y="234.0" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Queue / broker</text>
<text x="180.0" y="250.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">durable buffer</text>
<line x1="180.0" y1="260.0" x2="180.0" y2="276.0" stroke="#a69d8e" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="16.0" y="276.0" width="328.0" height="46.0" rx="3" fill="#5fb3a1" fill-opacity="0.2" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="296.0" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Workers × N</text>
<text x="180.0" y="312.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">pull, process, ack</text>
<line x1="180.0" y1="322.0" x2="180.0" y2="338.0" stroke="#a69d8e" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="16.0" y="338.0" width="328.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="180.0" y="365.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Email / PDF / API / DB</text>
<rect x="16.0" y="396.0" width="328.0" height="44.0" rx="8" fill="#e5534b" fill-opacity="0.1" stroke="#e5534b" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="28.0" y="422.0" font-size="11" fill="#e2b45a" text-anchor="start" font-weight="700">fail → retry w/ backoff → DLQ</text>
<text x="16.0" y="468.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">Users wait for the enqueue, not</text>
<text x="16.0" y="487.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">the work. Workers scale on their own.</text>
</svg>
