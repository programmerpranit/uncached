<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 446" width="360" height="446" role="img" aria-label="A hexagon with the domain at its center; driving adapters such as REST and Kafka call driving ports, and driven adapters such as Postgres and Stripe implement driven ports" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="446" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2b45a"/></marker></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Ports and adapters</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">core in the middle, tech at the edges</text>
<rect x="16.0" y="76.0" width="328.0" height="44.0" rx="3" fill="#5fb3a1" fill-opacity="0.15" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="95.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Driving adapters</text>
<text x="180.0" y="111.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">REST · CLI · consumer · tests</text>
<line x1="180.0" y1="120.0" x2="180.0" y2="140.0" stroke="#5fb3a1" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="16.0" y="144.0" width="328.0" height="36.0" rx="3" fill="#5fb3a1" fill-opacity="0.28" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="165.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">Driving ports: PlaceOrder, GetOrder</text>
<rect x="16.0" y="190.0" width="328.0" height="70.0" rx="3" fill="#9b8cff" fill-opacity="0.25" stroke="#9b8cff" stroke-width="1"/>
<text x="180.0" y="222.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Domain + use cases</text>
<text x="180.0" y="238.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">no framework imports</text>
<rect x="16.0" y="270.0" width="328.0" height="36.0" rx="3" fill="#e2b45a" fill-opacity="0.28" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="291.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">Driven ports: OrderRepository, Payments</text>
<line x1="180.0" y1="328.0" x2="180.0" y2="308.0" stroke="#e2b45a" stroke-width="1.3" marker-end="url(#ah1)" stroke-dasharray="4,3"/>
<rect x="16.0" y="330.0" width="328.0" height="44.0" rx="3" fill="#e2b45a" fill-opacity="0.15" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="349.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Driven adapters</text>
<text x="180.0" y="365.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">Postgres · Stripe · fakes</text>
<text x="16.0" y="400.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">Driven adapters implement interfaces</text>
<text x="16.0" y="416.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">the core owns (dashed arrow).</text>
</svg>
