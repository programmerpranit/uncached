<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 386" width="360" height="386" role="img" aria-label="Many fast core unit tests use in-memory fakes, fewer adapter contract tests run against real infrastructure, and a handful of end-to-end tests cover the full stack" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="386" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Testing at the seams</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">fast core tests, focused adapter tests</text>
<rect x="16.0" y="76.0" width="328.0" height="56.0" rx="3" fill="#9b8cff" fill-opacity="0.18" stroke="#9b8cff" stroke-width="1"/>
<text x="180.0" y="101.0" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Core unit tests</text>
<text x="180.0" y="117.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">use cases + in-memory fakes</text>
<text x="28.0" y="148.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">thousands · ms each</text>
<rect x="16.0" y="156.0" width="328.0" height="56.0" rx="3" fill="#e2b45a" fill-opacity="0.18" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="181.0" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Adapter contract tests</text>
<text x="180.0" y="197.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">same suite vs fake AND Postgres</text>
<text x="28.0" y="228.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">dozens · seconds</text>
<rect x="16.0" y="236.0" width="328.0" height="56.0" rx="3" fill="#5fb3a1" fill-opacity="0.18" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="261.0" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">End-to-end tests</text>
<text x="180.0" y="277.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">real HTTP → real DB</text>
<text x="28.0" y="308.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">a few · slow</text>
<text x="16.0" y="340.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">Run one contract suite against both</text>
<text x="16.0" y="356.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">fake and real adapters.</text>
</svg>
