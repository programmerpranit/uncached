<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 475" width="360" height="475" role="img" aria-label="A bundler resolves imports, parses files, transforms TypeScript and JSX, links the module graph with tree shaking, splits chunks, then minifies and emits hashed files" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="475" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Bundler pipeline</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">source modules → output files</text>
<rect x="16.0" y="84.0" width="328.0" height="46.0" rx="8" fill="#ff5b2e" fill-opacity="0.1" stroke="#ff5b2e" stroke-width="1.3"/>
<text x="28.0" y="104.0" font-size="12" fill="#ff5b2e" text-anchor="start" font-weight="700">1. resolve</text>
<text x="28.0" y="121.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">find each import on disk</text>
<rect x="16.0" y="138.0" width="328.0" height="46.0" rx="8" fill="#5fb3a1" fill-opacity="0.1" stroke="#5fb3a1" stroke-width="1.3"/>
<text x="28.0" y="158.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="700">2. load + parse</text>
<text x="28.0" y="175.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">read files, build ASTs</text>
<rect x="16.0" y="192.0" width="328.0" height="46.0" rx="8" fill="#e2b45a" fill-opacity="0.1" stroke="#e2b45a" stroke-width="1.3"/>
<text x="28.0" y="212.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="700">3. transform</text>
<text x="28.0" y="229.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">TS, JSX, CSS → JS</text>
<rect x="16.0" y="246.0" width="328.0" height="46.0" rx="8" fill="#9b8cff" fill-opacity="0.1" stroke="#9b8cff" stroke-width="1.3"/>
<text x="28.0" y="266.0" font-size="12" fill="#9b8cff" text-anchor="start" font-weight="700">4. link</text>
<text x="28.0" y="283.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">build the module graph, tree-shake</text>
<rect x="16.0" y="300.0" width="328.0" height="46.0" rx="8" fill="#d77fa1" fill-opacity="0.1" stroke="#d77fa1" stroke-width="1.3"/>
<text x="28.0" y="320.0" font-size="12" fill="#d77fa1" text-anchor="start" font-weight="700">5. chunk</text>
<text x="28.0" y="337.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">split by entry + dynamic import</text>
<rect x="16.0" y="354.0" width="328.0" height="46.0" rx="8" fill="#7cc47f" fill-opacity="0.1" stroke="#7cc47f" stroke-width="1.3"/>
<text x="28.0" y="374.0" font-size="12" fill="#7cc47f" text-anchor="start" font-weight="700">6. minify + emit</text>
<text x="28.0" y="391.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">shrink, hash, write files</text>
<text x="16.0" y="426.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">842 source modules become a few</text>
<text x="16.0" y="445.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">hashed, minified output files.</text>
</svg>
