<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 511" width="360" height="511" role="img" aria-label="Four kinds of workers: dedicated workers for CPU tasks, shared workers across tabs, service workers as a network proxy, and worklets hooking into rendering and audio" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="511" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Kinds of workers</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">all run off the main thread</text>
<rect x="16.0" y="84.0" width="328.0" height="82.0" rx="8" fill="#9b8cff" fill-opacity="0.08" stroke="#9b8cff" stroke-width="1.3"/>
<text x="28.0" y="106.0" font-size="12.5" fill="#9b8cff" text-anchor="start" font-weight="700">Dedicated Worker</text>
<text x="28.0" y="126.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">one page owns it</text>
<text x="28.0" y="146.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">CPU work: parsing, images, search</text>
<rect x="16.0" y="176.0" width="328.0" height="82.0" rx="8" fill="#5fb3a1" fill-opacity="0.08" stroke="#5fb3a1" stroke-width="1.3"/>
<text x="28.0" y="198.0" font-size="12.5" fill="#5fb3a1" text-anchor="start" font-weight="700">Shared Worker</text>
<text x="28.0" y="218.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">shared by tabs of one origin</text>
<text x="28.0" y="238.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">one WebSocket or cache for many tabs</text>
<rect x="16.0" y="268.0" width="328.0" height="82.0" rx="8" fill="#ff5b2e" fill-opacity="0.08" stroke="#ff5b2e" stroke-width="1.3"/>
<text x="28.0" y="290.0" font-size="12.5" fill="#ff5b2e" text-anchor="start" font-weight="700">Service Worker</text>
<text x="28.0" y="310.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">proxy between page and network</text>
<text x="28.0" y="330.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">offline, caching, push notifications</text>
<rect x="16.0" y="360.0" width="328.0" height="82.0" rx="8" fill="#e2b45a" fill-opacity="0.08" stroke="#e2b45a" stroke-width="1.3"/>
<text x="28.0" y="382.0" font-size="12.5" fill="#e2b45a" text-anchor="start" font-weight="700">Worklets</text>
<text x="28.0" y="402.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">small hooks into the engine</text>
<text x="28.0" y="422.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">audio, paint, animation, layout (Houdini)</text>
<text x="16.0" y="462.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">No DOM access; all talk to the</text>
<text x="16.0" y="481.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">page through messages.</text>
</svg>
