<text x="40.0" y="374.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">frames</text>
<text x="40.0" y="412.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Total work is the same, or slightly more. What changes is that the main thread stays free to handle input and paint.</text>
<text x="40.0" y="431.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Any task over 50 ms counts as a "long task" and directly hurts Interaction to Next Paint (INP).</text>
