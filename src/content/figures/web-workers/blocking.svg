<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 461" width="880" height="461" role="img" aria-label="A 600 millisecond task on the main thread drops dozens of frames; moved to a worker, the main thread keeps rendering and only handles the result" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="461" fill="#1b1712"/>
