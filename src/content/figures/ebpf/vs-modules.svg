<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 367" width="880" height="367" role="img" aria-label="eBPF programs compared with kernel modules for safety, deployment, portability, power and privilege" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="367" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Why not a kernel module?</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">eBPF trades expressiveness for safety and deployability</text>
<text x="260.0" y="96.0" font-size="12.5" fill="#7cc47f" text-anchor="start" font-weight="700">eBPF program</text>
<text x="570.0" y="96.0" font-size="12.5" fill="#e2b45a" text-anchor="start" font-weight="700">kernel module</text>
<rect x="40.0" y="108.0" width="800.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="56.0" y="128.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">safety</text>
<text x="260.0" y="128.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">verified: can't crash or hang the kernel</text>
<text x="570.0" y="128.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">a bug can panic the machine</text>
<rect x="40.0" y="144.0" width="800.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="56.0" y="164.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">deployment</text>
<text x="260.0" y="164.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">load at runtime, no reboot, no rebuild</text>
<text x="570.0" y="164.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">must match kernel version / build</text>
<rect x="40.0" y="180.0" width="800.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="56.0" y="200.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">portability</text>
<text x="260.0" y="200.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">CO-RE + BTF: one binary across kernels</text>
<text x="570.0" y="200.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">recompile per kernel</text>
<rect x="40.0" y="216.0" width="800.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="56.0" y="236.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">power</text>
<text x="260.0" y="236.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">limited helpers, bounded work</text>
<text x="570.0" y="236.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">anything the kernel can do</text>
<rect x="40.0" y="252.0" width="800.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="56.0" y="272.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">privilege</text>
<text x="260.0" y="272.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">needs CAP_BPF / CAP_SYS_ADMIN</text>
<text x="570.0" y="272.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">root to load</text>
<text x="40.0" y="318.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">CO-RE ("compile once, run everywhere") uses BTF type information shipped with the kernel to fix up struct field</text>
<text x="40.0" y="337.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">offsets at load time, so a tool built once works across kernel versions, which made eBPF practical to ship.</text>
</svg>
