<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 472" width="360" height="472" role="img" aria-label="eBPF pipeline from source code through the verifier and JIT to an attached hook, with maps shared with user space" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="472" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">eBPF pipeline</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">compile → verify → JIT → attach</text>
<rect x="16.0" y="86.0" width="328.0" height="34.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="180.0" y="107.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">C / Rust / bpftrace</text>
<rect x="16.0" y="128.0" width="328.0" height="34.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="149.1" font-size="11.5" fill="#5fb3a1" text-anchor="middle" font-weight="600">clang → BPF bytecode</text>
<rect x="16.0" y="170.0" width="328.0" height="34.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="191.1" font-size="11.5" fill="#e2b45a" text-anchor="middle" font-weight="600">bpf() syscall: load</text>
<rect x="16.0" y="212.0" width="328.0" height="34.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<text x="180.0" y="233.1" font-size="11.5" fill="#e5534b" text-anchor="middle" font-weight="600">verifier</text>
<rect x="16.0" y="254.0" width="328.0" height="34.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="180.0" y="275.1" font-size="11.5" fill="#7cc47f" text-anchor="middle" font-weight="600">JIT</text>
<rect x="16.0" y="296.0" width="328.0" height="34.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="180.0" y="317.1" font-size="11.5" fill="#9b8cff" text-anchor="middle" font-weight="600">attach to a hook</text>
<rect x="16.0" y="344.0" width="328.0" height="34.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="365.1" font-size="11.5" fill="#e2b45a" text-anchor="middle" font-weight="600">maps ↔ user-space tool</text>
<text x="16.0" y="404.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">The verifier rejects anything</text>
<text x="16.0" y="423.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">that could crash or hang the</text>
<text x="16.0" y="442.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">kernel. No kernel module needed.</text>
</svg>
