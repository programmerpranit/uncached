<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 393" width="360" height="393" role="img" aria-label="eBPF programs compared with kernel modules for safety, deployment, portability, power and privilege" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="393" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">eBPF vs modules</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">safety vs power</text>
<text x="16.0" y="86.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="700">safety</text>
<text x="16.0" y="103.0" font-size="10.5" fill="#7cc47f" text-anchor="start" font-weight="400">bpf: verified</text>
<text x="16.0" y="119.0" font-size="10.5" fill="#e2b45a" text-anchor="start" font-weight="400">module: a bug can panic the machine</text>
<text x="16.0" y="136.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="700">deployment</text>
<text x="16.0" y="153.0" font-size="10.5" fill="#7cc47f" text-anchor="start" font-weight="400">bpf: load at runtime</text>
<text x="16.0" y="169.0" font-size="10.5" fill="#e2b45a" text-anchor="start" font-weight="400">module: must match kernel version </text>
<text x="16.0" y="186.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="700">portability</text>
<text x="16.0" y="203.0" font-size="10.5" fill="#7cc47f" text-anchor="start" font-weight="400">bpf: CO-RE + BTF</text>
<text x="16.0" y="219.0" font-size="10.5" fill="#e2b45a" text-anchor="start" font-weight="400">module: recompile per kernel</text>
<text x="16.0" y="236.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="700">power</text>
<text x="16.0" y="253.0" font-size="10.5" fill="#7cc47f" text-anchor="start" font-weight="400">bpf: limited helpers, bounded work</text>
<text x="16.0" y="269.0" font-size="10.5" fill="#e2b45a" text-anchor="start" font-weight="400">module: anything the kernel can do</text>
<text x="16.0" y="286.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="700">privilege</text>
<text x="16.0" y="303.0" font-size="10.5" fill="#7cc47f" text-anchor="start" font-weight="400">bpf: needs CAP_BPF / CAP_SYS_ADMIN</text>
<text x="16.0" y="319.0" font-size="10.5" fill="#e2b45a" text-anchor="start" font-weight="400">module: root to load</text>
<text x="16.0" y="344.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">CO-RE + BTF: one binary runs</text>
<text x="16.0" y="363.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">across kernel versions.</text>
</svg>
