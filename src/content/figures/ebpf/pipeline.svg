<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 418" width="880" height="418" role="img" aria-label="eBPF pipeline from source code through the verifier and JIT to an attached hook, with maps shared with user space" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="418" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a4136"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2b45a"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">From source to running safely in the kernel</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">compile, verify, JIT, attach; share data with user space through maps</text>
<rect x="40.0" y="96.0" width="240.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="160.0" y="116.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">C / Rust / bpftrace</text>
<text x="160.0" y="132.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">restricted program</text>
<line x1="280.0" y1="119.0" x2="318.0" y2="119.0" stroke="#4a4136" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="320.0" y="96.0" width="240.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="440.0" y="116.0" font-size="12" fill="#5fb3a1" text-anchor="middle" font-weight="600">clang → BPF bytecode</text>
<text x="440.0" y="132.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="400">+ BTF type info</text>
<line x1="560.0" y1="119.0" x2="598.0" y2="119.0" stroke="#4a4136" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="600.0" y="96.0" width="240.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="720.0" y="123.3" font-size="12" fill="#e2b45a" text-anchor="middle" font-weight="600">bpf() syscall: load</text>
<line x1="720.0" y1="142.0" x2="720.0" y2="176.0" stroke="#4a4136" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="600.0" y="178.0" width="240.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<text x="720.0" y="198.0" font-size="12" fill="#e5534b" text-anchor="middle" font-weight="600">verifier</text>
<text x="720.0" y="214.0" font-size="11" fill="#e5534b" text-anchor="middle" font-weight="400">proves termination + memory safety</text>
<line x1="598.0" y1="201.0" x2="562.0" y2="201.0" stroke="#4a4136" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="320.0" y="178.0" width="240.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="440.0" y="198.0" font-size="12" fill="#7cc47f" text-anchor="middle" font-weight="600">JIT</text>
<text x="440.0" y="214.0" font-size="11" fill="#7cc47f" text-anchor="middle" font-weight="400">native x86 / ARM code</text>
<line x1="318.0" y1="201.0" x2="282.0" y2="201.0" stroke="#4a4136" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="40.0" y="178.0" width="240.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="160.0" y="198.0" font-size="12" fill="#9b8cff" text-anchor="middle" font-weight="600">attach to a hook</text>
<text x="160.0" y="214.0" font-size="11" fill="#9b8cff" text-anchor="middle" font-weight="400">kprobe, XDP, cgroup, LSM…</text>
<rect x="40.0" y="270.0" width="360.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="220.0" y="290.0" font-size="12" fill="#e2b45a" text-anchor="middle" font-weight="600">BPF maps</text>
<text x="220.0" y="306.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="400">hash, array, ring buffer, per-CPU…</text>
<line x1="160.0" y1="224.0" x2="160.0" y2="268.0" stroke="#e2b45a" stroke-width="1.2" marker-end="url(#ah1)"/>
<rect x="480.0" y="270.0" width="360.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="660.0" y="290.0" font-size="12" fill="#5fb3a1" text-anchor="middle" font-weight="600">user-space tool</text>
<text x="660.0" y="306.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="400">reads maps / ring buffer, updates config</text>
<line x1="400.0" y1="293.0" x2="478.0" y2="293.0" stroke="#e2b45a" stroke-width="1.2" marker-end="url(#ah1)"/>
<line x1="478.0" y1="293.0" x2="400.0" y2="293.0" stroke="#e2b45a" stroke-width="1.2" marker-end="url(#ah1)"/>
<text x="40.0" y="350.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">The verifier rejects any program that could crash or hang the kernel: unbounded loops, out-of-bounds access,</text>
<text x="40.0" y="369.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">unchecked pointers, calls to non-allowed helpers. That guarantee is what makes it acceptable to run new code</text>
<text x="40.0" y="388.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">in the kernel at runtime, without writing a kernel module.</text>
</svg>
