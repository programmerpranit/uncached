<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 311" width="880" height="311" role="img" aria-label="Last-write-wins loses one of two concurrent updates" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="311" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2b45a"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Last-write-wins silently drops a write</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">two replicas accept concurrent updates to the same cart</text>
<text x="40.0" y="100.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="600">replica A</text>
<text x="40.0" y="190.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="600">replica B</text>
<line x1="140.0" y1="96.0" x2="840.0" y2="96.0" stroke="#5fb3a1" stroke-width="1.4"/>
<line x1="140.0" y1="186.0" x2="840.0" y2="186.0" stroke="#e2b45a" stroke-width="1.4"/>
<circle cx="200.0" cy="96.0" r="6" fill="#5fb3a1" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="200.0" y="78.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="400">cart = [milk]</text>
<line x1="200.0" y1="96.0" x2="300.0" y2="186.0" stroke="#a69d8e" stroke-width="1" marker-end="url(#ah0)" stroke-dasharray="4 3"/>
<circle cx="300.0" cy="186.0" r="6" fill="#e2b45a" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="300.0" y="212.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">cart = [milk]</text>
<circle cx="420.0" cy="96.0" r="6" fill="#5fb3a1" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="420.0" y="78.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="400">+ eggs @ t=10.002</text>
<circle cx="440.0" cy="186.0" r="6" fill="#e2b45a" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="440.0" y="212.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="400">+ bread @ t=10.001</text>
<line x1="420.0" y1="96.0" x2="600.0" y2="186.0" stroke="#5fb3a1" stroke-width="1" marker-end="url(#ah1)" stroke-dasharray="4 3"/>
<line x1="440.0" y1="186.0" x2="600.0" y2="96.0" stroke="#e2b45a" stroke-width="1" marker-end="url(#ah2)" stroke-dasharray="4 3"/>
<circle cx="640.0" cy="96.0" r="7" fill="#e5534b" fill-opacity="1" stroke="none" stroke-width="1"/>
<circle cx="640.0" cy="186.0" r="7" fill="#e5534b" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="640.0" y="78.0" font-size="12" fill="#e5534b" text-anchor="middle" font-weight="600">[milk, eggs]</text>
<text x="640.0" y="212.0" font-size="12" fill="#e5534b" text-anchor="middle" font-weight="600">[milk, eggs]</text>
<text x="760.0" y="150.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">converged,</text>
<text x="760.0" y="166.0" font-size="11" fill="#e5534b" text-anchor="middle" font-weight="400">bread lost</text>
<text x="40.0" y="262.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">Both replicas converge, but "bread" is gone. Timestamps picked a winner; they could not tell the two</text>
<text x="40.0" y="281.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">updates were concurrent. Clock skew makes it worse: the "later" write may actually have happened first.</text>
</svg>
