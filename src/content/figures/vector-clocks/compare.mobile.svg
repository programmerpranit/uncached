<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 432" width="360" height="432" role="img" aria-label="Comparing vector clocks: happened-before, equal, or concurrent" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="432" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Comparing vector clocks</text>
<rect x="16.0" y="72.0" width="328.0" height="96.0" rx="3" fill="#7cc47f" fill-opacity="0.1" stroke="#7cc47f" stroke-width="1"/>
<text x="28.0" y="96.0" font-size="13" fill="#ede6d8" text-anchor="start" font-weight="600">[2,1,0] vs [3,1,0]</text>
<text x="28.0" y="116.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">every entry ≤, one &lt;</text>
<text x="28.0" y="138.0" font-size="12.5" fill="#7cc47f" text-anchor="start" font-weight="700">A happened before B</text>
<text x="28.0" y="156.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">B supersedes A: keep B</text>
<rect x="16.0" y="178.0" width="328.0" height="96.0" rx="3" fill="#a69d8e" fill-opacity="0.1" stroke="#a69d8e" stroke-width="1"/>
<text x="28.0" y="202.0" font-size="13" fill="#ede6d8" text-anchor="start" font-weight="600">[2,2,1] vs [2,2,1]</text>
<text x="28.0" y="222.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">all entries equal</text>
<text x="28.0" y="244.0" font-size="12.5" fill="#a69d8e" text-anchor="start" font-weight="700">same version</text>
<text x="28.0" y="262.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">nothing to do</text>
<rect x="16.0" y="284.0" width="328.0" height="96.0" rx="3" fill="#e5534b" fill-opacity="0.1" stroke="#e5534b" stroke-width="1"/>
<text x="28.0" y="308.0" font-size="13" fill="#ede6d8" text-anchor="start" font-weight="600">[3,0,0] vs [2,2,1]</text>
<text x="28.0" y="328.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">some &lt;, some &gt;</text>
<text x="28.0" y="350.0" font-size="12.5" fill="#e5534b" text-anchor="start" font-weight="700">concurrent</text>
<text x="28.0" y="368.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">conflict: keep both, resolve</text>
<text x="16.0" y="402.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Causality, not wall-clock time.</text>
</svg>
