<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 375" width="360" height="375" role="img" aria-label="Last-write-wins loses one of two concurrent updates" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="375" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">LWW drops a write</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">concurrent updates to one cart</text>
<text x="16.0" y="80.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="400">A: cart = [milk, eggs]</text>
<text x="16.0" y="99.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="400">B: cart = [milk, bread]</text>
<text x="16.0" y="118.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">(both started from [milk],</text>
<text x="16.0" y="137.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">concurrently)</text>
<rect x="16.0" y="162.0" width="328.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="180.0" y="188.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">LWW keeps the higher timestamp</text>
<rect x="16.0" y="218.0" width="328.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<text x="180.0" y="244.7" font-size="13" fill="#e5534b" text-anchor="middle" font-weight="600">result: [milk, eggs]</text>
<text x="16.0" y="288.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">"bread" is lost silently. Timestamps</text>
<text x="16.0" y="307.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">can’t tell the writes were</text>
<text x="16.0" y="326.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">concurrent, and skewed clocks can</text>
<text x="16.0" y="345.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">pick the wrong one.</text>
</svg>
