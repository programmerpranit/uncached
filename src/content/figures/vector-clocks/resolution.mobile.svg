<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 493" width="360" height="493" role="img" aria-label="Conflict resolution options: last-write-wins, siblings, merge functions and CRDTs" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="493" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Resolving a detected conflict</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">from simple to correct</text>
<rect x="16.0" y="72.0" width="328.0" height="80.0" rx="3" fill="#e5534b" fill-opacity="0.12" stroke="#e5534b" stroke-width="1"/>
<text x="28.0" y="96.0" font-size="13" fill="#e5534b" text-anchor="start" font-weight="700">Last-write-wins</text>
<text x="28.0" y="118.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">pick one by timestamp or node ID</text>
<text x="28.0" y="138.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">simple; loses data</text>
<rect x="16.0" y="162.0" width="328.0" height="80.0" rx="3" fill="#e2b45a" fill-opacity="0.12" stroke="#e2b45a" stroke-width="1"/>
<text x="28.0" y="186.0" font-size="13" fill="#e2b45a" text-anchor="start" font-weight="700">Siblings + app merge</text>
<text x="28.0" y="208.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">return all versions; the app merges</text>
<text x="28.0" y="228.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">correct; app does the work</text>
<rect x="16.0" y="252.0" width="328.0" height="80.0" rx="3" fill="#5fb3a1" fill-opacity="0.12" stroke="#5fb3a1" stroke-width="1"/>
<text x="28.0" y="276.0" font-size="13" fill="#5fb3a1" text-anchor="start" font-weight="700">Merge function</text>
<text x="28.0" y="298.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">union for sets, max for counters…</text>
<text x="28.0" y="318.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">automatic for some types</text>
<rect x="16.0" y="342.0" width="328.0" height="80.0" rx="3" fill="#7cc47f" fill-opacity="0.12" stroke="#7cc47f" stroke-width="1"/>
<text x="28.0" y="366.0" font-size="13" fill="#7cc47f" text-anchor="start" font-weight="700">CRDTs</text>
<text x="28.0" y="388.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">data types that merge by design</text>
<text x="28.0" y="408.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">provably convergent</text>
<text x="16.0" y="444.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Dynamo merged cart siblings by union,</text>
<text x="16.0" y="463.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">so deleted items could reappear.</text>
</svg>
