<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 342" width="360" height="342" role="img" aria-label="Space-time diagram of vector clocks on three nodes" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="342" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Vector clocks across three nodes</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">one counter per node</text>
<text x="16.0" y="78.0" font-size="13" fill="#5fb3a1" text-anchor="start" font-weight="700">A</text>
<text x="44.0" y="78.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">event</text>
<text x="344.0" y="78.0" font-size="12" fill="#ede6d8" text-anchor="end" font-weight="400">[1,0,0]</text>
<text x="16.0" y="104.0" font-size="13" fill="#5fb3a1" text-anchor="start" font-weight="700">A</text>
<text x="44.0" y="104.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">send to B</text>
<text x="344.0" y="104.0" font-size="12" fill="#ede6d8" text-anchor="end" font-weight="400">[2,0,0]</text>
<text x="16.0" y="130.0" font-size="13" fill="#9b8cff" text-anchor="start" font-weight="700">C</text>
<text x="44.0" y="130.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">event</text>
<text x="344.0" y="130.0" font-size="12" fill="#ede6d8" text-anchor="end" font-weight="400">[0,0,1]</text>
<text x="16.0" y="156.0" font-size="13" fill="#e2b45a" text-anchor="start" font-weight="700">B</text>
<text x="44.0" y="156.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">recv from A</text>
<text x="344.0" y="156.0" font-size="12" fill="#ede6d8" text-anchor="end" font-weight="400">[2,1,0]</text>
<text x="16.0" y="182.0" font-size="13" fill="#e2b45a" text-anchor="start" font-weight="700">B</text>
<text x="44.0" y="182.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">recv from C</text>
<text x="344.0" y="182.0" font-size="12" fill="#ede6d8" text-anchor="end" font-weight="400">[2,2,1]</text>
<text x="16.0" y="208.0" font-size="13" fill="#5fb3a1" text-anchor="start" font-weight="700">A</text>
<text x="44.0" y="208.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">event</text>
<text x="344.0" y="208.0" font-size="12" fill="#ede6d8" text-anchor="end" font-weight="400">[3,0,0]</text>
<text x="16.0" y="234.0" font-size="13" fill="#9b8cff" text-anchor="start" font-weight="700">C</text>
<text x="44.0" y="234.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">recv from B</text>
<text x="344.0" y="234.0" font-size="12" fill="#ede6d8" text-anchor="end" font-weight="400">[2,2,2]</text>
<text x="16.0" y="274.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">send: bump own entry</text>
<text x="16.0" y="293.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">receive: element-wise max, then bump</text>
<text x="16.0" y="312.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="400">[3,0,0] vs [2,2,1]: concurrent</text>
</svg>
