<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 389" width="880" height="389" role="img" aria-label="Space-time diagram of vector clocks on three nodes" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="389" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Vector clocks across three nodes</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">each node counts its own events; messages carry the whole vector</text>
<text x="40.0" y="104.0" font-size="14" fill="#5fb3a1" text-anchor="start" font-weight="700">A</text>
<line x1="70.0" y1="100.0" x2="840.0" y2="100.0" stroke="#5fb3a1" stroke-width="1.3"/>
<text x="40.0" y="194.0" font-size="14" fill="#e2b45a" text-anchor="start" font-weight="700">B</text>
<line x1="70.0" y1="190.0" x2="840.0" y2="190.0" stroke="#e2b45a" stroke-width="1.3"/>
<text x="40.0" y="284.0" font-size="14" fill="#9b8cff" text-anchor="start" font-weight="700">C</text>
<line x1="70.0" y1="280.0" x2="840.0" y2="280.0" stroke="#9b8cff" stroke-width="1.3"/>
<circle cx="130.0" cy="100.0" r="6" fill="#5fb3a1" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="130.0" y="86.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="400">[1,0,0]</text>
<circle cx="260.0" cy="100.0" r="6" fill="#5fb3a1" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="260.0" y="86.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="400">[2,0,0]</text>
<circle cx="360.0" cy="190.0" r="6" fill="#e2b45a" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="360.0" y="176.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="400">[2,1,0]</text>
<circle cx="230.0" cy="280.0" r="6" fill="#9b8cff" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="230.0" y="304.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="400">[0,0,1]</text>
<circle cx="560.0" cy="190.0" r="6" fill="#e2b45a" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="560.0" y="176.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="400">[2,2,1]</text>
<circle cx="520.0" cy="100.0" r="6" fill="#5fb3a1" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="520.0" y="86.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="400">[3,0,0]</text>
<circle cx="700.0" cy="280.0" r="6" fill="#9b8cff" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="700.0" y="304.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="400">[2,2,2]</text>
<line x1="260.0" y1="100.0" x2="354.0" y2="186.0" stroke="#a69d8e" stroke-width="1" marker-end="url(#ah0)"/>
<line x1="230.0" y1="280.0" x2="554.0" y2="194.0" stroke="#a69d8e" stroke-width="1" marker-end="url(#ah0)"/>
<line x1="560.0" y1="190.0" x2="694.0" y2="276.0" stroke="#a69d8e" stroke-width="1" marker-end="url(#ah0)"/>
<text x="520.0" y="124.0" font-size="10.5" fill="#e5534b" text-anchor="middle" font-weight="400">concurrent with B’s [2,2,1]</text>
<text x="40.0" y="340.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">On send: increment your own entry. On receive: take the element-wise max, then increment your own entry.</text>
<text x="40.0" y="359.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">A’s [3,0,0] and B’s [2,2,1] are concurrent: neither vector is ≥ the other in every position.</text>
</svg>
