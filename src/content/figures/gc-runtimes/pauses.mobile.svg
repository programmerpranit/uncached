<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 442" width="360" height="442" role="img" aria-label="Comparison of collectors: serial and parallel collectors stop the world for the whole collection, while G1, ZGC, Shenandoah, Go and .NET background GC do most work concurrently with only short stop-the-world phases" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="442" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">GC pauses</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">STW vs concurrent</text>
<text x="16.0" y="98.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="700">Serial / Parallel</text>
<rect x="16.0" y="106.0" width="328.0" height="14.0" rx="2" fill="#e5534b" fill-opacity="0.55" stroke="none" stroke-width="1"/>
<text x="16.0" y="136.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">STW for the whole collection</text>
<text x="16.0" y="160.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="700">G1</text>
<rect x="16.0" y="168.0" width="26.2" height="14.0" rx="2" fill="#e5534b" fill-opacity="0.55" stroke="none" stroke-width="1"/>
<rect x="42.2" y="168.0" width="170.6" height="14.0" rx="2" fill="#5fb3a1" fill-opacity="0.55" stroke="none" stroke-width="1"/>
<rect x="212.8" y="168.0" width="32.8" height="14.0" rx="2" fill="#e5534b" fill-opacity="0.55" stroke="none" stroke-width="1"/>
<text x="16.0" y="198.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">short STW + concurrent marking</text>
<text x="16.0" y="222.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="700">ZGC / Shenandoah</text>
<rect x="16.0" y="230.0" width="6.6" height="14.0" rx="2" fill="#e5534b" fill-opacity="0.55" stroke="none" stroke-width="1"/>
<rect x="22.6" y="230.0" width="305.0" height="14.0" rx="2" fill="#5fb3a1" fill-opacity="0.55" stroke="none" stroke-width="1"/>
<rect x="327.6" y="230.0" width="6.6" height="14.0" rx="2" fill="#e5534b" fill-opacity="0.55" stroke="none" stroke-width="1"/>
<text x="16.0" y="260.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">concurrent compaction</text>
<text x="16.0" y="284.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="700">Go</text>
<rect x="16.0" y="292.0" width="6.6" height="14.0" rx="2" fill="#e5534b" fill-opacity="0.55" stroke="none" stroke-width="1"/>
<rect x="22.6" y="292.0" width="288.6" height="14.0" rx="2" fill="#5fb3a1" fill-opacity="0.55" stroke="none" stroke-width="1"/>
<rect x="311.2" y="292.0" width="6.6" height="14.0" rx="2" fill="#e5534b" fill-opacity="0.55" stroke="none" stroke-width="1"/>
<text x="16.0" y="322.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">concurrent mark-sweep, non-moving</text>
<text x="16.0" y="346.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="700">.NET (background)</text>
<rect x="16.0" y="354.0" width="19.7" height="14.0" rx="2" fill="#e5534b" fill-opacity="0.55" stroke="none" stroke-width="1"/>
<rect x="35.7" y="354.0" width="242.7" height="14.0" rx="2" fill="#5fb3a1" fill-opacity="0.55" stroke="none" stroke-width="1"/>
<rect x="278.4" y="354.0" width="19.7" height="14.0" rx="2" fill="#e5534b" fill-opacity="0.55" stroke="none" stroke-width="1"/>
<text x="16.0" y="384.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">background gen2, STW gen0/1</text>
<rect x="16.0" y="402.0" width="12.0" height="12.0" rx="2" fill="#e5534b" fill-opacity="1" stroke="none" stroke-width="1"/>
