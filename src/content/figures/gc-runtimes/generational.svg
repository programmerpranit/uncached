<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 299" width="880" height="299" role="img" aria-label="A generational heap: new objects go to Eden, survivors are copied between survivor spaces and promoted to the old generation, which is collected less often" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="299" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Generational heap</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">most objects die young, so collect the young space often and cheaply</text>
<rect x="40.0" y="110.0" width="120.0" height="60.0" rx="3" fill="#ff5b2e" fill-opacity="0.18" stroke="#ff5b2e" stroke-width="1"/>
<text x="100.0" y="137.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Eden</text>
<text x="100.0" y="153.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">new allocs</text>
<rect x="170.0" y="110.0" width="70.0" height="60.0" rx="3" fill="#5fb3a1" fill-opacity="0.15" stroke="#5fb3a1" stroke-width="1"/>
<text x="205.0" y="144.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">S0</text>
<rect x="250.0" y="110.0" width="70.0" height="60.0" rx="3" fill="#5fb3a1" fill-opacity="0.15" stroke="#5fb3a1" stroke-width="1"/>
<text x="285.0" y="144.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">S1</text>
<rect x="340.0" y="110.0" width="500.0" height="60.0" rx="3" fill="#9b8cff" fill-opacity="0.15" stroke="#9b8cff" stroke-width="1"/>
<text x="590.0" y="137.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Old generation</text>
<text x="590.0" y="153.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">long-lived objects, collected rarely</text>
<text x="180.0" y="200.0" font-size="10.5" fill="#5fb3a1" text-anchor="middle" font-weight="400">minor GC: copy survivors, fast (ms)</text>
<text x="590.0" y="200.0" font-size="10.5" fill="#9b8cff" text-anchor="middle" font-weight="400">major / mixed GC: larger, slower</text>
<line x1="282.0" y1="172.0" x2="360.0" y2="172.0" stroke="#a69d8e" stroke-width="1" marker-end="url(#ah0)" stroke-dasharray="3,3"/>
<text x="320.0" y="188.0" font-size="9.5" fill="#a69d8e" text-anchor="middle" font-weight="400">promote</text>
<text x="40.0" y="250.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Write barriers record old→young pointers in a remembered set / card table,</text>
<text x="40.0" y="269.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">so a minor GC can scan only the young space plus those cards.</text>
</svg>
