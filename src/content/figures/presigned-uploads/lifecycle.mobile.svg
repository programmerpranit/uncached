<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 422" width="360" height="422" role="img" aria-label="Upload states: pending, uploaded, scanning, then ready or rejected; uploads sit in a private quarantine bucket until verified and expired pending uploads are cleaned up" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="422" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e5534b"/></marker></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Upload lifecycle</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">never trust the bytes until verified</text>
<rect x="16.0" y="76.0" width="200.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="0.18" stroke="#4a4136" stroke-width="1"/>
<text x="116.0" y="97.0" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">pending</text>
<text x="116.0" y="113.0" font-size="9.5" fill="#a69d8e" text-anchor="middle" font-weight="400">URL issued</text>
<line x1="116.0" y1="125.0" x2="116.0" y2="140.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="16.0" y="142.0" width="200.0" height="48.0" rx="3" fill="#e2b45a" fill-opacity="0.18" stroke="#e2b45a" stroke-width="1"/>
<text x="116.0" y="163.0" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">uploaded</text>
<text x="116.0" y="179.0" font-size="9.5" fill="#a69d8e" text-anchor="middle" font-weight="400">object exists</text>
<line x1="116.0" y1="191.0" x2="116.0" y2="206.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="16.0" y="208.0" width="200.0" height="48.0" rx="3" fill="#9b8cff" fill-opacity="0.18" stroke="#9b8cff" stroke-width="1"/>
<text x="116.0" y="229.0" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">scanning</text>
<text x="116.0" y="245.0" font-size="9.5" fill="#a69d8e" text-anchor="middle" font-weight="400">type, size, malware</text>
<line x1="116.0" y1="257.0" x2="116.0" y2="272.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="16.0" y="274.0" width="200.0" height="48.0" rx="3" fill="#7cc47f" fill-opacity="0.18" stroke="#7cc47f" stroke-width="1"/>
<text x="116.0" y="295.0" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">ready</text>
<text x="116.0" y="311.0" font-size="9.5" fill="#a69d8e" text-anchor="middle" font-weight="400">served via CDN</text>
<rect x="232.0" y="208.0" width="112.0" height="48.0" rx="3" fill="#e5534b" fill-opacity="0.15" stroke="#e5534b" stroke-width="1"/>
<text x="288.0" y="229.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">rejected</text>
<text x="288.0" y="245.0" font-size="9.5" fill="#a69d8e" text-anchor="middle" font-weight="400">delete, notify</text>
<line x1="216.0" y1="232.0" x2="230.0" y2="232.0" stroke="#e5534b" stroke-width="1.2" marker-end="url(#ah1)"/>
<text x="16.0" y="360.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">pending &gt; 24 h → expired, cleaned up.</text>
<text x="16.0" y="376.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">Uploads stay in a private quarantine</text>
<text x="16.0" y="392.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">bucket until ready.</text>
</svg>
