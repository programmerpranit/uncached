<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 384" width="880" height="384" role="img" aria-label="Upload states: pending, uploaded, scanning, then ready or rejected; uploads sit in a private quarantine bucket until verified and expired pending uploads are cleaned up" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="384" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e5534b"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Upload lifecycle</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">uploads land in quarantine and are promoted only after verification</text>
<rect x="40.0" y="100.0" width="170.0" height="56.0" rx="3" fill="#2f2921" fill-opacity="0.18" stroke="#4a4136" stroke-width="1"/>
<text x="125.0" y="125.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">pending</text>
<text x="125.0" y="141.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">URL issued</text>
<line x1="212.0" y1="128.0" x2="243.0" y2="128.0" stroke="#a69d8e" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="245.0" y="100.0" width="170.0" height="56.0" rx="3" fill="#e2b45a" fill-opacity="0.18" stroke="#e2b45a" stroke-width="1"/>
<text x="330.0" y="125.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">uploaded</text>
<text x="330.0" y="141.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">object exists</text>
<line x1="417.0" y1="128.0" x2="448.0" y2="128.0" stroke="#a69d8e" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="450.0" y="100.0" width="170.0" height="56.0" rx="3" fill="#9b8cff" fill-opacity="0.18" stroke="#9b8cff" stroke-width="1"/>
<text x="535.0" y="125.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">scanning</text>
<text x="535.0" y="141.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">type, size, malware</text>
<line x1="622.0" y1="128.0" x2="653.0" y2="128.0" stroke="#a69d8e" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="655.0" y="100.0" width="170.0" height="56.0" rx="3" fill="#7cc47f" fill-opacity="0.18" stroke="#7cc47f" stroke-width="1"/>
<text x="740.0" y="125.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">ready</text>
<text x="740.0" y="141.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">served via CDN</text>
<rect x="450.0" y="200.0" width="170.0" height="50.0" rx="3" fill="#e5534b" fill-opacity="0.15" stroke="#e5534b" stroke-width="1"/>
<text x="535.0" y="222.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">rejected</text>
<text x="535.0" y="238.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">delete + notify user</text>
<line x1="535.0" y1="158.0" x2="535.0" y2="198.0" stroke="#e5534b" stroke-width="1.3" marker-end="url(#ah1)"/>
<rect x="40.0" y="200.0" width="370.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="225.0" y="228.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="56.0" y="222.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="700">expired</text>
<text x="56.0" y="240.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">pending &gt; 24 h: clean up record and partial object</text>
<rect x="40.0" y="290.0" width="375.0" height="70.0" rx="3" fill="#e2b45a" fill-opacity="0.06" stroke="#e2b45a" stroke-width="1" stroke-dasharray="4,3"/>
<text x="56.0" y="312.0" font-size="10.5" fill="#e2b45a" text-anchor="start" font-weight="700">quarantine bucket (private, short lifecycle)</text>
<text x="56.0" y="332.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">uploaded · scanning</text>
<rect x="450.0" y="290.0" width="390.0" height="70.0" rx="3" fill="#7cc47f" fill-opacity="0.06" stroke="#7cc47f" stroke-width="1" stroke-dasharray="4,3"/>
<text x="466.0" y="312.0" font-size="10.5" fill="#7cc47f" text-anchor="start" font-weight="700">serving bucket (behind CDN)</text>
<text x="466.0" y="332.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">ready: re-encoded, metadata stripped</text>
</svg>
