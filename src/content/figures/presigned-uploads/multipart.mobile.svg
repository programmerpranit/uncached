<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 416" width="360" height="416" role="img" aria-label="A 600 MB file split into six parts uploaded in parallel; part 3 fails and is retried on its own before the upload is completed" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="416" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Multipart upload</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">parallel parts, retry one part</text>
<text x="16.0" y="92.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="700">video.mp4 · 600 MB → 6 parts</text>
<text x="16.0" y="122.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">part 1</text>
<rect x="70.0" y="108.0" width="200.0" height="18.0" rx="3" fill="#5fb3a1" fill-opacity="0.3" stroke="#5fb3a1" stroke-width="1"/>
<text x="278.0" y="121.0" font-size="9.5" fill="#7cc47f" text-anchor="start" font-weight="400">ETag ✓</text>
<text x="16.0" y="152.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">part 2</text>
<rect x="70.0" y="138.0" width="200.0" height="18.0" rx="3" fill="#5fb3a1" fill-opacity="0.3" stroke="#5fb3a1" stroke-width="1"/>
<text x="278.0" y="151.0" font-size="9.5" fill="#7cc47f" text-anchor="start" font-weight="400">ETag ✓</text>
<text x="16.0" y="182.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">part 3</text>
<rect x="70.0" y="168.0" width="100.0" height="18.0" rx="3" fill="#e5534b" fill-opacity="0.3" stroke="#e5534b" stroke-width="1"/>
<text x="178.0" y="181.0" font-size="9.5" fill="#e5534b" text-anchor="start" font-weight="400">✕ retry</text>
<text x="16.0" y="212.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">part 4</text>
<rect x="70.0" y="198.0" width="200.0" height="18.0" rx="3" fill="#5fb3a1" fill-opacity="0.3" stroke="#5fb3a1" stroke-width="1"/>
<text x="278.0" y="211.0" font-size="9.5" fill="#7cc47f" text-anchor="start" font-weight="400">ETag ✓</text>
<text x="16.0" y="242.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">part 5</text>
<rect x="70.0" y="228.0" width="200.0" height="18.0" rx="3" fill="#5fb3a1" fill-opacity="0.3" stroke="#5fb3a1" stroke-width="1"/>
<text x="278.0" y="241.0" font-size="9.5" fill="#7cc47f" text-anchor="start" font-weight="400">ETag ✓</text>
<text x="16.0" y="272.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">part 6</text>
<rect x="70.0" y="258.0" width="200.0" height="18.0" rx="3" fill="#5fb3a1" fill-opacity="0.3" stroke="#5fb3a1" stroke-width="1"/>
<text x="278.0" y="271.0" font-size="9.5" fill="#7cc47f" text-anchor="start" font-weight="400">ETag ✓</text>
<text x="16.0" y="310.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">1  CreateMultipartUpload</text>
<text x="16.0" y="327.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">2  UploadPart × N (presigned)</text>
<text x="16.0" y="344.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">3  CompleteMultipartUpload</text>
<text x="16.0" y="370.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">Abort unfinished uploads with</text>
<text x="16.0" y="386.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">a lifecycle rule.</text>
</svg>
