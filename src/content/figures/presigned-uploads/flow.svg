<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img" aria-label="Presigned upload flow: client asks the API for an upload, the API returns a presigned URL, the client uploads directly to object storage, a storage event triggers a worker that verifies and marks the upload ready" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="430" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b8cff"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2b45a"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d77fa1"/></marker><marker id="ah4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7cc47f"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Direct-to-storage upload</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">the API hands out permission; the bytes go straight to object storage</text>
<rect x="40.0" y="80.0" width="130.0" height="38.0" rx="3" fill="#9b8cff" fill-opacity="0.18" stroke="#9b8cff" stroke-width="1"/>
<text x="105.0" y="103.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Client</text>
<line x1="105.0" y1="118.0" x2="105.0" y2="370.0" stroke="#4a4136" stroke-width="1" stroke-dasharray="3,4"/>
<rect x="270.0" y="80.0" width="130.0" height="38.0" rx="3" fill="#5fb3a1" fill-opacity="0.18" stroke="#5fb3a1" stroke-width="1"/>
<text x="335.0" y="103.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">API</text>
<line x1="335.0" y1="118.0" x2="335.0" y2="370.0" stroke="#4a4136" stroke-width="1" stroke-dasharray="3,4"/>
<rect x="500.0" y="80.0" width="130.0" height="38.0" rx="3" fill="#e2b45a" fill-opacity="0.18" stroke="#e2b45a" stroke-width="1"/>
<text x="565.0" y="103.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Object storage</text>
<line x1="565.0" y1="118.0" x2="565.0" y2="370.0" stroke="#4a4136" stroke-width="1" stroke-dasharray="3,4"/>
<rect x="730.0" y="80.0" width="130.0" height="38.0" rx="3" fill="#7cc47f" fill-opacity="0.18" stroke="#7cc47f" stroke-width="1"/>
<text x="795.0" y="103.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Worker</text>
<line x1="795.0" y1="118.0" x2="795.0" y2="370.0" stroke="#4a4136" stroke-width="1" stroke-dasharray="3,4"/>
<line x1="105.0" y1="150.0" x2="331.0" y2="150.0" stroke="#9b8cff" stroke-width="1.4" marker-end="url(#ah0)"/>
<text x="220.0" y="143.0" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="400">1  POST /uploads (name, size, type)</text>
<line x1="335.0" y1="190.0" x2="109.0" y2="190.0" stroke="#5fb3a1" stroke-width="1.4" marker-end="url(#ah1)"/>
<text x="220.0" y="183.0" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="400">2  presigned PUT URL + upload id</text>
<line x1="105.0" y1="240.0" x2="561.0" y2="240.0" stroke="#e2b45a" stroke-width="1.4" marker-end="url(#ah2)"/>
<text x="335.0" y="233.0" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="400">3  PUT file bytes (MBs–GBs)</text>
<line x1="565.0" y1="290.0" x2="791.0" y2="290.0" stroke="#d77fa1" stroke-width="1.4" marker-end="url(#ah3)" stroke-dasharray="4,3"/>
<text x="680.0" y="283.0" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="400">4  ObjectCreated event</text>
<line x1="795.0" y1="335.0" x2="339.0" y2="335.0" stroke="#7cc47f" stroke-width="1.4" marker-end="url(#ah4)"/>
<text x="565.0" y="328.0" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="400">5  verified, scanned → mark ready</text>
<text x="40.0" y="400.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">The API never touches the file: it signs a short-lived, narrowly scoped URL and reacts to the result.</text>
</svg>
