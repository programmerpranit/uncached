<rect x="620.0" y="108.0" width="220.0" height="66.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="730.0" y="144.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="634.0" y="130.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">1  CreateMultipartUpload</text>
<text x="634.0" y="147.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">2  UploadPart × N (presigned each)</text>
<text x="634.0" y="164.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">3  CompleteMultipartUpload</text>
<rect x="620.0" y="200.0" width="220.0" height="110.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="730.0" y="258.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="634.0" y="222.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">S3: 5 MiB–5 GiB per part,</text>
<text x="634.0" y="239.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">up to 10,000 parts, 5 TiB object.</text>
<text x="634.0" y="273.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">Abort or expire unfinished uploads</text>
<text x="634.0" y="290.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">with a lifecycle rule.</text>
</svg>
