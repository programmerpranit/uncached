<text x="408.0" y="183.0" font-size="9.5" fill="#7cc47f" text-anchor="start" font-weight="400">ETag ✓</text>
<text x="40.0" y="212.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">part 2</text>
<rect x="100.0" y="198.0" width="300.0" height="18.0" rx="3" fill="#5fb3a1" fill-opacity="0.3" stroke="#5fb3a1" stroke-width="1"/>
<text x="408.0" y="211.0" font-size="9.5" fill="#7cc47f" text-anchor="start" font-weight="400">ETag ✓</text>
<text x="40.0" y="240.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">part 3</text>
<rect x="100.0" y="226.0" width="150.0" height="18.0" rx="3" fill="#e5534b" fill-opacity="0.3" stroke="#e5534b" stroke-width="1"/>
