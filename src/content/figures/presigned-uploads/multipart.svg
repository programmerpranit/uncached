<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 354" width="880" height="354" role="img" aria-label="A 600 MB file split into six parts uploaded in parallel; part 3 fails and is retried on its own before the upload is completed" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
