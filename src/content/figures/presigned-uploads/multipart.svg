<rect x="368.0" y="108.0" width="76.0" height="34.0" rx="3" fill="#e2b45a" fill-opacity="0.15" stroke="#e2b45a" stroke-width="1"/>
<text x="406.0" y="128.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">part 5</text>
<rect x="450.0" y="108.0" width="76.0" height="34.0" rx="3" fill="#e2b45a" fill-opacity="0.15" stroke="#e2b45a" stroke-width="1"/>
<text x="488.0" y="128.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">part 6</text>
