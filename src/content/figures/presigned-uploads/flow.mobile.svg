<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img" aria-label="Presigned upload flow: client asks the API for an upload, the API returns a presigned URL, the client uploads directly to object storage, a storage event triggers a worker that verifies and marks the upload ready" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="470" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Direct-to-storage upload</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">bytes skip your servers</text>
<circle cx="30.0" cy="98.0" r="13" fill="#9b8cff" fill-opacity="0.25" stroke="#9b8cff" stroke-width="1"/>
<text x="30.0" y="102.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="700">1</text>
<text x="54.0" y="94.0" font-size="11.5" fill="#9b8cff" text-anchor="start" font-weight="700">Client → API</text>
<text x="54.0" y="112.0" font-size="9.8" fill="#a69d8e" text-anchor="start" font-weight="400">POST /uploads {name, size, type}</text>
<circle cx="30.0" cy="168.0" r="13" fill="#5fb3a1" fill-opacity="0.25" stroke="#5fb3a1" stroke-width="1"/>
<text x="30.0" y="172.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="700">2</text>
<text x="54.0" y="164.0" font-size="11.5" fill="#5fb3a1" text-anchor="start" font-weight="700">API → Client</text>
<text x="54.0" y="182.0" font-size="9.8" fill="#a69d8e" text-anchor="start" font-weight="400">check auth &amp; limits, create record,</text>
<text x="54.0" y="196.0" font-size="9.8" fill="#a69d8e" text-anchor="start" font-weight="400">return presigned PUT URL (expires 10 min)</text>
<circle cx="30.0" cy="238.0" r="13" fill="#e2b45a" fill-opacity="0.25" stroke="#e2b45a" stroke-width="1"/>
<text x="30.0" y="242.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="700">3</text>
<text x="54.0" y="234.0" font-size="11.5" fill="#e2b45a" text-anchor="start" font-weight="700">Client → Storage</text>
<text x="54.0" y="252.0" font-size="9.8" fill="#a69d8e" text-anchor="start" font-weight="400">PUT bytes directly to the bucket</text>
<circle cx="30.0" cy="308.0" r="13" fill="#d77fa1" fill-opacity="0.25" stroke="#d77fa1" stroke-width="1"/>
<text x="30.0" y="312.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="700">4</text>
<text x="54.0" y="304.0" font-size="11.5" fill="#d77fa1" text-anchor="start" font-weight="700">Storage → Queue</text>
<text x="54.0" y="322.0" font-size="9.8" fill="#a69d8e" text-anchor="start" font-weight="400">ObjectCreated event</text>
<circle cx="30.0" cy="378.0" r="13" fill="#7cc47f" fill-opacity="0.25" stroke="#7cc47f" stroke-width="1"/>
<text x="30.0" y="382.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="700">5</text>
<text x="54.0" y="374.0" font-size="11.5" fill="#7cc47f" text-anchor="start" font-weight="700">Worker</text>
<text x="54.0" y="392.0" font-size="9.8" fill="#a69d8e" text-anchor="start" font-weight="400">verify size/type, scan, make</text>
<text x="54.0" y="406.0" font-size="9.8" fill="#a69d8e" text-anchor="start" font-weight="400">thumbnails, mark ready</text>
<text x="16.0" y="440.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">The API never handles the bytes.</text>
</svg>
