<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 549" width="360" height="549" role="img" aria-label="Consensus keeps identical logs on every server so their state machines stay identical" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="549" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Replicated state machine</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">same log + same order = same state</text>
<rect x="16.0" y="70.0" width="328.0" height="36.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="180.0" y="92.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">client: SET x←7</text>
<rect x="16.0" y="124.0" width="328.0" height="96.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="28.0" y="144.0" font-size="12" fill="#ff5b2e" text-anchor="start" font-weight="700">S1 (leader)</text>
<text x="332.0" y="144.0" font-size="12" fill="#ede6d8" text-anchor="end" font-weight="600">x=7 y=1</text>
<rect x="28.0" y="158.0" width="68.0" height="40.0" rx="3" fill="#e2b45a" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="62.0" y="182.3" font-size="12" fill="#1b1712" text-anchor="middle" font-weight="600">x←3</text>
<rect x="104.0" y="158.0" width="68.0" height="40.0" rx="3" fill="#e2b45a" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="138.0" y="182.3" font-size="12" fill="#1b1712" text-anchor="middle" font-weight="600">y←1</text>
<rect x="180.0" y="158.0" width="68.0" height="40.0" rx="3" fill="#e2b45a" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="214.0" y="182.3" font-size="12" fill="#1b1712" text-anchor="middle" font-weight="600">x←7</text>
<rect x="256.0" y="158.0" width="68.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="290.0" y="182.3" font-size="12" fill="#a69d8e" text-anchor="middle" font-weight="600">z←2</text>
<text x="28.0" y="212.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">log → state machine</text>
<rect x="16.0" y="232.0" width="328.0" height="96.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="28.0" y="252.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="700">S2</text>
<text x="332.0" y="252.0" font-size="12" fill="#ede6d8" text-anchor="end" font-weight="600">x=7 y=1</text>
<rect x="28.0" y="266.0" width="68.0" height="40.0" rx="3" fill="#e2b45a" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="62.0" y="290.3" font-size="12" fill="#1b1712" text-anchor="middle" font-weight="600">x←3</text>
<rect x="104.0" y="266.0" width="68.0" height="40.0" rx="3" fill="#e2b45a" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="138.0" y="290.3" font-size="12" fill="#1b1712" text-anchor="middle" font-weight="600">y←1</text>
<rect x="180.0" y="266.0" width="68.0" height="40.0" rx="3" fill="#e2b45a" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="214.0" y="290.3" font-size="12" fill="#1b1712" text-anchor="middle" font-weight="600">x←7</text>
<rect x="256.0" y="266.0" width="68.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="290.0" y="290.3" font-size="12" fill="#a69d8e" text-anchor="middle" font-weight="600">z←2</text>
<text x="28.0" y="320.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">log → state machine</text>
<rect x="16.0" y="340.0" width="328.0" height="96.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="28.0" y="360.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="700">S3</text>
<text x="332.0" y="360.0" font-size="12" fill="#ede6d8" text-anchor="end" font-weight="600">x=7 y=1</text>
<rect x="28.0" y="374.0" width="68.0" height="40.0" rx="3" fill="#e2b45a" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="62.0" y="398.3" font-size="12" fill="#1b1712" text-anchor="middle" font-weight="600">x←3</text>
<rect x="104.0" y="374.0" width="68.0" height="40.0" rx="3" fill="#e2b45a" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="138.0" y="398.3" font-size="12" fill="#1b1712" text-anchor="middle" font-weight="600">y←1</text>
<rect x="180.0" y="374.0" width="68.0" height="40.0" rx="3" fill="#e2b45a" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="214.0" y="398.3" font-size="12" fill="#1b1712" text-anchor="middle" font-weight="600">x←7</text>
<rect x="256.0" y="374.0" width="68.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="290.0" y="398.3" font-size="12" fill="#a69d8e" text-anchor="middle" font-weight="600">z←2</text>
<text x="28.0" y="428.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">log → state machine</text>
<text x="16.0" y="462.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Amber = committed (on a majority).</text>
<text x="16.0" y="481.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Every server applies committed</text>
<text x="16.0" y="500.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">entries in order, so all states</text>
<text x="16.0" y="519.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">match. z←2 isn’t committed yet.</text>
</svg>
