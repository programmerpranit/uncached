<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 518" width="880" height="518" role="img" aria-label="Basic Paxos prepare/promise and accept/accepted phases" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="518" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2b45a"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5b2e"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Basic Paxos: two phases</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">proposer P with ballot n = 5; three acceptors</text>
<text x="120.0" y="90.0" font-size="12" fill="#ff5b2e" text-anchor="middle" font-weight="700">Proposer</text>
<line x1="120.0" y1="100.0" x2="120.0" y2="420.0" stroke="#4a4136" stroke-width="1"/>
<text x="360.0" y="90.0" font-size="12" fill="#5fb3a1" text-anchor="middle" font-weight="700">Acceptor A</text>
<line x1="360.0" y1="100.0" x2="360.0" y2="420.0" stroke="#4a4136" stroke-width="1"/>
<text x="520.0" y="90.0" font-size="12" fill="#5fb3a1" text-anchor="middle" font-weight="700">Acceptor B</text>
<line x1="520.0" y1="100.0" x2="520.0" y2="420.0" stroke="#4a4136" stroke-width="1"/>
<text x="680.0" y="90.0" font-size="12" fill="#5fb3a1" text-anchor="middle" font-weight="700">Acceptor C</text>
<line x1="680.0" y1="100.0" x2="680.0" y2="420.0" stroke="#4a4136" stroke-width="1"/>
<text x="30.0" y="124.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="700">Phase 1</text>
<line x1="120.0" y1="130.0" x2="360.0" y2="148.0" stroke="#e2b45a" stroke-width="1.3" marker-end="url(#ah0)"/>
<line x1="120.0" y1="130.0" x2="520.0" y2="148.0" stroke="#e2b45a" stroke-width="1.3" marker-end="url(#ah0)"/>
<line x1="120.0" y1="130.0" x2="680.0" y2="148.0" stroke="#e2b45a" stroke-width="1.3" marker-end="url(#ah0)"/>
<text x="240.0" y="126.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="400">Prepare(5)</text>
<line x1="360.0" y1="180.0" x2="120.0" y2="198.0" stroke="#e2b45a" stroke-width="1.3" marker-end="url(#ah0)" stroke-dasharray="4 3"/>
<line x1="520.0" y1="180.0" x2="120.0" y2="198.0" stroke="#e2b45a" stroke-width="1.3" marker-end="url(#ah0)" stroke-dasharray="4 3"/>
<text x="240.0" y="208.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="400">Promise(5, last accepted)</text>
<text x="30.0" y="264.0" font-size="12" fill="#ff5b2e" text-anchor="start" font-weight="700">Phase 2</text>
<line x1="120.0" y1="270.0" x2="360.0" y2="288.0" stroke="#ff5b2e" stroke-width="1.3" marker-end="url(#ah1)"/>
<line x1="120.0" y1="270.0" x2="520.0" y2="288.0" stroke="#ff5b2e" stroke-width="1.3" marker-end="url(#ah1)"/>
<line x1="120.0" y1="270.0" x2="680.0" y2="288.0" stroke="#ff5b2e" stroke-width="1.3" marker-end="url(#ah1)"/>
<text x="240.0" y="266.0" font-size="11" fill="#ff5b2e" text-anchor="middle" font-weight="400">Accept(5, v)</text>
<line x1="360.0" y1="320.0" x2="120.0" y2="338.0" stroke="#ff5b2e" stroke-width="1.3" marker-end="url(#ah1)" stroke-dasharray="4 3"/>
<line x1="520.0" y1="320.0" x2="120.0" y2="338.0" stroke="#ff5b2e" stroke-width="1.3" marker-end="url(#ah1)" stroke-dasharray="4 3"/>
<text x="240.0" y="348.0" font-size="11" fill="#ff5b2e" text-anchor="middle" font-weight="400">Accepted(5, v)</text>
<text x="30.0" y="380.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">majority accepted → v is chosen</text>
<text x="30.0" y="450.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Phase 1 reserves ballot 5 and learns any value already accepted. If there is one, P must</text>
<text x="30.0" y="469.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">propose that value instead of its own. Acceptor C never replied, which is fine: a majority</text>
<text x="30.0" y="488.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">(2 of 3) is enough for each phase.</text>
</svg>
