<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 456" width="360" height="456" role="img" aria-label="Raft follower, candidate and leader states and the transitions between them" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="456" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2b45a"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5b2e"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Raft server states</text>
<rect x="100.0" y="70.0" width="160.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="99.0" font-size="14" fill="#ede6d8" text-anchor="middle" font-weight="600">Follower</text>
<line x1="180.0" y1="120.0" x2="180.0" y2="166.0" stroke="#e2b45a" stroke-width="1.4" marker-end="url(#ah0)"/>
<text x="190.0" y="148.0" font-size="11" fill="#e2b45a" text-anchor="start" font-weight="400">election timeout</text>
<rect x="100.0" y="168.0" width="160.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="197.0" font-size="14" fill="#e2b45a" text-anchor="middle" font-weight="600">Candidate</text>
<line x1="180.0" y1="218.0" x2="180.0" y2="264.0" stroke="#ff5b2e" stroke-width="1.4" marker-end="url(#ah1)"/>
<text x="190.0" y="246.0" font-size="11" fill="#ff5b2e" text-anchor="start" font-weight="400">wins majority</text>
<rect x="100.0" y="266.0" width="160.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="180.0" y="295.0" font-size="14" fill="#ff5b2e" text-anchor="middle" font-weight="600">Leader</text>
<path d="M98 290 Q40 290 40 190 Q40 94 98 94" fill="none" stroke="#5fb3a1" stroke-width="1.3" marker-end="url(#ah2)"/>
<text x="16.0" y="194.0" font-size="10" fill="#5fb3a1" text-anchor="start" font-weight="400">higher</text>
<text x="16.0" y="207.0" font-size="10" fill="#5fb3a1" text-anchor="start" font-weight="400">term</text>
<path d="M262 192 Q330 192 330 160 Q330 130 270 180" fill="none" stroke="#e2b45a" stroke-width="1.2" marker-end="url(#ah0)"/>
<text x="290.0" y="128.0" font-size="10" fill="#e2b45a" text-anchor="start" font-weight="400">split vote</text>
<text x="16.0" y="350.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Every message carries a term. Seeing</text>
<text x="16.0" y="369.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">a higher term → become follower.</text>
<text x="16.0" y="407.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Randomized timeouts (150–300 ms)</text>
<text x="16.0" y="426.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">make split votes rare.</text>
</svg>
