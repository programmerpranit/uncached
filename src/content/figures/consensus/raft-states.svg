<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 421" width="880" height="421" role="img" aria-label="Raft follower, candidate and leader states and the transitions between them" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="421" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2b45a"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5b2e"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Raft server states</text>
<rect x="60.0" y="140.0" width="170.0" height="56.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="145.0" y="173.4" font-size="15" fill="#ede6d8" text-anchor="middle" font-weight="600">Follower</text>
<rect x="355.0" y="140.0" width="170.0" height="56.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="440.0" y="173.4" font-size="15" fill="#e2b45a" text-anchor="middle" font-weight="600">Candidate</text>
<rect x="650.0" y="140.0" width="170.0" height="56.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="735.0" y="173.4" font-size="15" fill="#ff5b2e" text-anchor="middle" font-weight="600">Leader</text>
<path d="M232 160 L353 160" fill="none" stroke="#e2b45a" stroke-width="1.5" marker-end="url(#ah0)"/>
<text x="292.0" y="150.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="400">election timeout</text>
<path d="M527 160 L648 160" fill="none" stroke="#ff5b2e" stroke-width="1.5" marker-end="url(#ah1)"/>
<text x="588.0" y="150.0" font-size="11" fill="#ff5b2e" text-anchor="middle" font-weight="400">wins majority</text>
<path d="M470 198 Q470 245 440 245 Q410 245 410 200" fill="none" stroke="#e2b45a" stroke-width="1.3" marker-end="url(#ah0)"/>
<text x="500.0" y="240.0" font-size="11" fill="#e2b45a" text-anchor="start" font-weight="400">split vote → new term, retry</text>
<path d="M355 180 L232 180" fill="none" stroke="#5fb3a1" stroke-width="1.3" marker-end="url(#ah2)"/>
<text x="292.0" y="200.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="400">sees leader /</text>
<text x="292.0" y="214.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="400">higher term</text>
<path d="M735 198 L735 300 L145 300 L145 200" fill="none" stroke="#5fb3a1" stroke-width="1.3" marker-end="url(#ah2)"/>
<text x="440.0" y="320.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="400">leader discovers a higher term → steps down</text>
<text x="60.0" y="372.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Every message carries a term number. Seeing a higher term → adopt it and become a follower.</text>
<text x="60.0" y="391.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Randomized timeouts (e.g. 150–300 ms) make simultaneous elections unlikely.</text>
</svg>
