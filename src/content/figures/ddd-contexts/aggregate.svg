<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 375" width="880" height="375" role="img" aria-label="The Order aggregate contains order lines and a shipping address, guarded by the Order root, which enforces invariants in one transaction; it references the Customer aggregate only by ID and publishes an OrderPlaced event for other contexts" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="375" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b8cff"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7cc47f"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Aggregates</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">an aggregate is the unit of consistency; across aggregates, use IDs and events</text>
<rect x="40.0" y="85.0" width="420.0" height="220.0" rx="3" fill="#ff5b2e" fill-opacity="0.07" stroke="#ff5b2e" stroke-width="1"/>
<text x="250.0" y="198.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="56.0" y="108.0" font-size="12" fill="#ff5b2e" text-anchor="start" font-weight="700">Order aggregate (one transaction)</text>
<rect x="70.0" y="125.0" width="170.0" height="46.0" rx="3" fill="#ff5b2e" fill-opacity="0.2" stroke="#ff5b2e" stroke-width="1"/>
<text x="155.0" y="152.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Order (root)</text>
<line x1="155.0" y1="171.0" x2="155.0" y2="196.0" stroke="#a69d8e" stroke-width="1"/>
<line x1="127.0" y1="196.0" x2="377.0" y2="196.0" stroke="#a69d8e" stroke-width="1"/>
<rect x="70.0" y="215.0" width="115.0" height="38.0" rx="3" fill="#a69d8e" fill-opacity="0.12" stroke="#a69d8e" stroke-width="1"/>
<text x="127.5" y="237.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">OrderLine</text>
<line x1="127.0" y1="196.0" x2="127.0" y2="213.0" stroke="#a69d8e" stroke-width="1"/>
<rect x="195.0" y="215.0" width="115.0" height="38.0" rx="3" fill="#a69d8e" fill-opacity="0.12" stroke="#a69d8e" stroke-width="1"/>
<text x="252.5" y="237.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">OrderLine</text>
<line x1="252.0" y1="196.0" x2="252.0" y2="213.0" stroke="#a69d8e" stroke-width="1"/>
<rect x="320.0" y="215.0" width="115.0" height="38.0" rx="3" fill="#a69d8e" fill-opacity="0.12" stroke="#a69d8e" stroke-width="1"/>
<text x="377.5" y="237.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">ShippingAddress</text>
<line x1="377.0" y1="196.0" x2="377.0" y2="213.0" stroke="#a69d8e" stroke-width="1"/>
<text x="270.0" y="128.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="700">invariants:</text>
<text x="270.0" y="144.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">total = sum of lines</text>
<text x="270.0" y="158.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">max 50 lines</text>
<text x="270.0" y="172.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">frozen once paid</text>
<text x="56.0" y="288.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">outside code talks to the root only</text>
<rect x="560.0" y="90.0" width="240.0" height="46.0" rx="3" fill="#9b8cff" fill-opacity="0.15" stroke="#9b8cff" stroke-width="1"/>
<text x="680.0" y="117.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Customer aggregate</text>
<line x1="462.0" y1="135.0" x2="558.0" y2="115.0" stroke="#9b8cff" stroke-width="1.2" marker-end="url(#ah0)" stroke-dasharray="4,3"/>
<text x="505.0" y="112.0" font-size="9.5" fill="#a69d8e" text-anchor="middle" font-weight="400">customerId</text>
<rect x="560.0" y="230.0" width="240.0" height="60.0" rx="3" fill="#7cc47f" fill-opacity="0.15" stroke="#7cc47f" stroke-width="1"/>
<text x="680.0" y="257.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">OrderPlaced event</text>
<text x="680.0" y="273.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">→ Billing, Shipping, Inventory</text>
<line x1="462.0" y1="260.0" x2="558.0" y2="260.0" stroke="#7cc47f" stroke-width="1.3" marker-end="url(#ah1)"/>
<text x="40.0" y="345.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">Reference other aggregates by ID; change them through events (eventually consistent).</text>
</svg>
