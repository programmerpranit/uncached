<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 429" width="360" height="429" role="img" aria-label="The word product means a catalog entry with images in Catalog, a stock item in Inventory, a priced line item in Billing and a parcel with weight in Shipping; each bounded context owns its own model and shares only the ID" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="429" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">One word, four models</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">"product" per context</text>
<rect x="16.0" y="80.0" width="328.0" height="62.0" rx="3" fill="#5fb3a1" fill-opacity="0.1" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="114.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="28.0" y="102.0" font-size="11.5" fill="#5fb3a1" text-anchor="start" font-weight="700">Catalog: Product</text>
<text x="28.0" y="124.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">title, images, description, category</text>
<rect x="16.0" y="152.0" width="328.0" height="62.0" rx="3" fill="#e2b45a" fill-opacity="0.1" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="186.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="28.0" y="174.0" font-size="11.5" fill="#e2b45a" text-anchor="start" font-weight="700">Inventory: Stock item</text>
<text x="28.0" y="196.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">SKU, warehouse, quantity on hand</text>
<rect x="16.0" y="224.0" width="328.0" height="62.0" rx="3" fill="#9b8cff" fill-opacity="0.1" stroke="#9b8cff" stroke-width="1"/>
<text x="180.0" y="258.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="28.0" y="246.0" font-size="11.5" fill="#9b8cff" text-anchor="start" font-weight="700">Billing: Line item</text>
<text x="28.0" y="268.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">price, tax code, discount, currency</text>
<rect x="16.0" y="296.0" width="328.0" height="62.0" rx="3" fill="#d77fa1" fill-opacity="0.1" stroke="#d77fa1" stroke-width="1"/>
<text x="180.0" y="330.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="28.0" y="318.0" font-size="11.5" fill="#d77fa1" text-anchor="start" font-weight="700">Shipping: Parcel</text>
<text x="28.0" y="340.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">weight, dimensions, hazmat flag</text>
<text x="16.0" y="380.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">Shared: only the ID.</text>
<text x="16.0" y="399.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">Each model changes on its own.</text>
</svg>
