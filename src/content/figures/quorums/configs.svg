<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 335" width="880" height="335" role="img" aria-label="Read and write quorum configurations for N=3 and their trade-offs" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="335" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Tuning R and W (N = 3)</text>
<text x="40.0" y="92.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="600">config</text>
<text x="200.0" y="92.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="600">R + W &gt; N?</text>
<text x="340.0" y="92.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="600">good for</text>
<text x="500.0" y="92.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="600">trade-off</text>
<line x1="40.0" y1="102.0" x2="840.0" y2="102.0" stroke="#4a4136" stroke-width="1.3"/>
<text x="40.0" y="132.0" font-size="13" fill="#5fb3a1" text-anchor="start" font-weight="700">W=3, R=1</text>
<text x="200.0" y="132.0" font-size="12" fill="#7cc47f" text-anchor="start" font-weight="400">yes</text>
<text x="340.0" y="132.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">fast reads</text>
<text x="500.0" y="132.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">writes fail if any replica is down</text>
<text x="40.0" y="166.0" font-size="13" fill="#ff5b2e" text-anchor="start" font-weight="700">W=2, R=2</text>
<text x="200.0" y="166.0" font-size="12" fill="#7cc47f" text-anchor="start" font-weight="400">yes</text>
<text x="340.0" y="166.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">balanced</text>
<text x="500.0" y="166.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">tolerates 1 down for reads and writes</text>
<text x="40.0" y="200.0" font-size="13" fill="#e2b45a" text-anchor="start" font-weight="700">W=1, R=3</text>
<text x="200.0" y="200.0" font-size="12" fill="#7cc47f" text-anchor="start" font-weight="400">yes</text>
<text x="340.0" y="200.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">fast writes</text>
<text x="500.0" y="200.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">reads fail if any replica is down</text>
<text x="40.0" y="234.0" font-size="13" fill="#e5534b" text-anchor="start" font-weight="700">W=1, R=1</text>
<text x="200.0" y="234.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="400">no</text>
<text x="340.0" y="234.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">fastest</text>
<text x="500.0" y="234.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">no overlap: stale reads likely</text>
<text x="40.0" y="286.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Latency follows the slowest replica you wait for, so larger quorums are slower, especially across regions.</text>
<text x="40.0" y="305.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Cassandra’s QUORUM is ⌊N/2⌋+1 for both reads and writes; ONE/ONE trades consistency for speed.</text>
</svg>
