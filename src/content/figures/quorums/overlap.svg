<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 349" width="880" height="349" role="img" aria-label="With N=3, W=2 and R=2, every read set overlaps every write set" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="349" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Why R + W &gt; N guarantees overlap</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">N = 3 replicas, W = 2, R = 2</text>
<circle cx="260.0" cy="180.0" r="38" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1.5"/>
<text x="260.0" y="176.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">replica 1</text>
<text x="260.0" y="194.0" font-size="12" fill="#7cc47f" text-anchor="middle" font-weight="700">v2</text>
<circle cx="440.0" cy="180.0" r="38" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1.5"/>
<text x="440.0" y="176.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">replica 2</text>
<text x="440.0" y="194.0" font-size="12" fill="#7cc47f" text-anchor="middle" font-weight="700">v2</text>
<circle cx="620.0" cy="180.0" r="38" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1.5"/>
<text x="620.0" y="176.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">replica 3</text>
<text x="620.0" y="194.0" font-size="12" fill="#a69d8e" text-anchor="middle" font-weight="700">v1</text>
<rect x="205.0" y="118.0" width="290.0" height="110.0" rx="60" fill="#ff5b2e" fill-opacity="0.08" stroke="#ff5b2e" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="350.0" y="110.0" font-size="11" fill="#ff5b2e" text-anchor="middle" font-weight="400">write set (W=2) wrote v2</text>
<rect x="385.0" y="132.0" width="290.0" height="110.0" rx="60" fill="#5fb3a1" fill-opacity="0.08" stroke="#5fb3a1" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="530.0" y="262.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="400">read set (R=2)</text>
<text x="440.0" y="240.0" font-size="1" fill="#ede6d8" text-anchor="start" font-weight="400"></text>
<text x="40.0" y="300.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Any 2 replicas a reader contacts must include at least one of the 2 that took the write (2 + 2 &gt; 3). The reader</text>
<text x="40.0" y="319.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">sees versions v2 and v1, keeps the newest, and can repair the stale replica.</text>
</svg>
