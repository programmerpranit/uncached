<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 379" width="880" height="379" role="img" aria-label="Sloppy quorum: a fallback node accepts a write for an unreachable replica and hands it back later" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="379" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7cc47f"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2b45a"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Sloppy quorum and hinted handoff</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">when home replicas are unreachable, borrow a neighbour</text>
<rect x="40.0" y="140.0" width="120.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="100.0" y="169.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">coordinator</text>
<rect x="300.0" y="70.0" width="170.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="385.0" y="96.3" font-size="12" fill="#7cc47f" text-anchor="middle" font-weight="600">A (home)</text>
<text x="490.0" y="97.0" font-size="11" fill="#7cc47f" text-anchor="start" font-weight="400">ack</text>
<line x1="162.0" y1="165.0" x2="298.0" y2="92.0" stroke="#7cc47f" stroke-width="1" marker-end="url(#ah0)"/>
<rect x="300.0" y="128.0" width="170.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<text x="385.0" y="154.3" font-size="12" fill="#e5534b" text-anchor="middle" font-weight="600">B (home)</text>
<text x="490.0" y="155.0" font-size="11" fill="#e5534b" text-anchor="start" font-weight="400">down</text>
<line x1="162.0" y1="165.0" x2="298.0" y2="150.0" stroke="#a69d8e" stroke-width="1" marker-end="url(#ah1)" stroke-dasharray="4 3"/>
<rect x="300.0" y="186.0" width="170.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<text x="385.0" y="212.3" font-size="12" fill="#e5534b" text-anchor="middle" font-weight="600">C (home)</text>
<text x="490.0" y="213.0" font-size="11" fill="#e5534b" text-anchor="start" font-weight="400">down</text>
<line x1="162.0" y1="165.0" x2="298.0" y2="208.0" stroke="#a69d8e" stroke-width="1" marker-end="url(#ah1)" stroke-dasharray="4 3"/>
<rect x="300.0" y="244.0" width="170.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="385.0" y="270.3" font-size="12" fill="#e2b45a" text-anchor="middle" font-weight="600">D (fallback)</text>
<text x="490.0" y="271.0" font-size="11" fill="#e2b45a" text-anchor="start" font-weight="400">ack + hint "for B"</text>
<line x1="162.0" y1="165.0" x2="298.0" y2="266.0" stroke="#e2b45a" stroke-width="1" marker-end="url(#ah2)"/>
<line x1="612.0" y1="262.0" x2="700.0" y2="168.0" stroke="#e2b45a" stroke-width="1.1" marker-end="url(#ah2)" stroke-dasharray="5 4"/>
<text x="690.0" y="222.0" font-size="11" fill="#e2b45a" text-anchor="start" font-weight="400">when B recovers,</text>
<text x="690.0" y="238.0" font-size="11" fill="#e2b45a" text-anchor="start" font-weight="400">D hands the write back</text>
<rect x="700.0" y="120.0" width="140.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="770.0" y="146.0" font-size="11" fill="#7cc47f" text-anchor="middle" font-weight="600">B (recovered)</text>
<text x="40.0" y="330.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">W=2 is satisfied by A and D, so the write succeeds despite two home replicas being down. But a read quorum</text>
<text x="40.0" y="349.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">of A, B, C might miss it: sloppy quorums improve availability and give up the overlap guarantee.</text>
</svg>
