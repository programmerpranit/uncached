<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 351" width="360" height="351" role="img" aria-label="With N=3, W=2 and R=2, every read set overlaps every write set" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="351" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Why R + W &gt; N guarantees overlap</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">N = 3, W = 2, R = 2</text>
<rect x="16.0" y="80.0" width="328.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="180.0" y="107.3" font-size="12" fill="#7cc47f" text-anchor="middle" font-weight="600">replica 1: v2</text>
<rect x="290.0" y="89.0" width="28.0" height="28.0" rx="3" fill="#ff5b2e" fill-opacity="0.9" stroke="#ff5b2e" stroke-width="1"/>
<text x="304.0" y="107.3" font-size="12" fill="#1b1712" text-anchor="middle" font-weight="600">W</text>
<rect x="16.0" y="136.0" width="328.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="180.0" y="163.3" font-size="12" fill="#7cc47f" text-anchor="middle" font-weight="600">replica 2: v2</text>
<rect x="290.0" y="145.0" width="28.0" height="28.0" rx="3" fill="#ff5b2e" fill-opacity="0.9" stroke="#ff5b2e" stroke-width="1"/>
<text x="304.0" y="163.3" font-size="12" fill="#1b1712" text-anchor="middle" font-weight="600">W</text>
<rect x="254.0" y="145.0" width="28.0" height="28.0" rx="3" fill="#5fb3a1" fill-opacity="0.9" stroke="#5fb3a1" stroke-width="1"/>
<text x="268.0" y="163.3" font-size="12" fill="#1b1712" text-anchor="middle" font-weight="600">R</text>
<rect x="16.0" y="192.0" width="328.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="180.0" y="219.3" font-size="12" fill="#a69d8e" text-anchor="middle" font-weight="600">replica 3: v1</text>
<rect x="290.0" y="201.0" width="28.0" height="28.0" rx="3" fill="#5fb3a1" fill-opacity="0.9" stroke="#5fb3a1" stroke-width="1"/>
<text x="304.0" y="219.3" font-size="12" fill="#1b1712" text-anchor="middle" font-weight="600">R</text>
<text x="16.0" y="264.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Writes reach replicas 1–2, reads</text>
<text x="16.0" y="283.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">hit 2–3. Any 2 of 3 overlap with</text>
<text x="16.0" y="302.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">any other 2, so the read always</text>
<text x="16.0" y="321.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">sees v2.</text>
</svg>
