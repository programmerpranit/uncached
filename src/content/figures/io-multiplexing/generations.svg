<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 389" width="880" height="389" role="img" aria-label="Thread per connection, select/poll, epoll/kqueue and io_uring compared" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="389" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Handling 10,000 connections: four generations</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">work per wake-up, with 10,000 open sockets and 10 ready</text>
<rect x="40.0" y="80.0" width="800.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<text x="56.0" y="101.0" font-size="13" fill="#e5534b" text-anchor="start" font-weight="700">thread per connection</text>
<text x="56.0" y="118.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">blocking read() in each</text>
<text x="330.0" y="108.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">10,000 threads, 10,000 stacks, lots of switches</text>
<rect x="40.0" y="138.0" width="800.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="56.0" y="159.0" font-size="13" fill="#e2b45a" text-anchor="start" font-weight="700">select() / poll()</text>
<text x="56.0" y="176.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">O(n) per call</text>
<text x="330.0" y="166.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">pass all 10,000 fds in, kernel scans all 10,000</text>
<rect x="40.0" y="196.0" width="800.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="56.0" y="217.0" font-size="13" fill="#5fb3a1" text-anchor="start" font-weight="700">epoll / kqueue</text>
<text x="56.0" y="234.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">O(ready) per call</text>
<text x="330.0" y="224.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">register once; wait returns the 10 ready fds</text>
<rect x="40.0" y="254.0" width="800.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="56.0" y="275.0" font-size="13" fill="#7cc47f" text-anchor="start" font-weight="700">io_uring</text>
<text x="56.0" y="292.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">batched, few syscalls</text>
<text x="330.0" y="282.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">submit operations via shared rings; get completions</text>
<text x="40.0" y="340.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Readiness APIs (select, poll, epoll, kqueue) say "this socket can be read now", then you call read(). Completion</text>
<text x="40.0" y="359.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">APIs (io_uring, Windows IOCP) take the read itself and report when it is done, which also works for disk files.</text>
</svg>
