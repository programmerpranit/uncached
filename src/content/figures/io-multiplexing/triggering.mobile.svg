<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 318" width="360" height="318" role="img" aria-label="Level-triggered epoll reports leftover data on every wait; edge-triggered reports only once" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="318" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Level vs edge triggered</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">4 KB arrives, app reads 1 KB</text>
<text x="16.0" y="90.0" font-size="12.5" fill="#5fb3a1" text-anchor="start" font-weight="700">level-triggered</text>
<circle cx="30.0" cy="112.0" r="6" fill="#5fb3a1" fill-opacity="1" stroke="none" stroke-width="1"/>
<circle cx="70.0" cy="112.0" r="6" fill="#5fb3a1" fill-opacity="1" stroke="none" stroke-width="1"/>
<circle cx="110.0" cy="112.0" r="6" fill="#5fb3a1" fill-opacity="1" stroke="none" stroke-width="1"/>
<circle cx="150.0" cy="112.0" r="6" fill="#5fb3a1" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="16.0" y="140.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">every wait while data remains</text>
<text x="16.0" y="180.0" font-size="12.5" fill="#9b8cff" text-anchor="start" font-weight="700">edge-triggered</text>
<circle cx="30.0" cy="202.0" r="6" fill="#9b8cff" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="50.0" y="206.0" font-size="11" fill="#e5534b" text-anchor="start" font-weight="400">once, then silence</text>
<text x="16.0" y="250.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Edge mode reports changes only:</text>
<text x="16.0" y="269.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">read until EAGAIN, or leftover</text>
<text x="16.0" y="288.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">data may sit there forever.</text>
</svg>
