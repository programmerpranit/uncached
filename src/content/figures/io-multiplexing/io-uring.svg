<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 418" width="880" height="418" role="img" aria-label="io_uring submission and completion ring buffers shared between application and kernel" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="418" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2b45a"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">io_uring: two ring buffers shared between app and kernel</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">the app queues requests in the submission ring and reaps results from the completion ring</text>
<circle cx="260.0" cy="210.0" r="100" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="2"/>
<circle cx="260.0" cy="210.0" r="55.00000000000001" fill="#1b1712" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="260.0" y="214.0" font-size="12" fill="#5fb3a1" text-anchor="middle" font-weight="700">SQ</text>
<text x="260.0" y="136.0" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="400">read</text>
<text x="305.3" y="150.5" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="400">send</text>
<text x="333.8" y="188.7" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="400">recv</text>
<text x="334.8" y="236.2" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="400">fsync</text>
<circle cx="620.0" cy="210.0" r="100" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="2"/>
<circle cx="620.0" cy="210.0" r="55.00000000000001" fill="#1b1712" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="620.0" y="214.0" font-size="12" fill="#7cc47f" text-anchor="middle" font-weight="700">CQ</text>
<text x="620.0" y="136.0" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="400">res=512</text>
<text x="665.3" y="150.5" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="400">res=64</text>
<text x="693.8" y="188.7" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="400">res=0</text>
<text x="260.0" y="96.0" font-size="12" fill="#5fb3a1" text-anchor="middle" font-weight="600">submission queue</text>
<text x="620.0" y="96.0" font-size="12" fill="#7cc47f" text-anchor="middle" font-weight="600">completion queue</text>
<text x="80.0" y="210.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">app writes</text>
<text x="80.0" y="226.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">SQEs</text>
<text x="800.0" y="210.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">app reads</text>
<text x="800.0" y="226.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">CQEs</text>
<path d="M360 190 C 420 150, 460 150, 520 190" fill="none" stroke="#e2b45a" stroke-width="1.5" marker-end="url(#ah0)"/>
<text x="440.0" y="146.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="400">kernel performs I/O</text>
<text x="40.0" y="350.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Both rings live in memory mapped into the app and the kernel, so queuing a request is a memory write. One</text>
<text x="40.0" y="369.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">io_uring_enter() call can submit hundreds of operations and wait for completions; with SQPOLL a kernel thread</text>
<text x="40.0" y="388.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">polls the ring and the app makes no syscalls at all. Works for sockets, files, timers, accept, and more.</text>
</svg>
