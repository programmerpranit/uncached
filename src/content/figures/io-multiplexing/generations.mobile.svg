<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" width="360" height="420" role="img" aria-label="Thread per connection, select/poll, epoll/kqueue and io_uring compared" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="420" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Four generations</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">10,000 sockets, 10 ready</text>
<rect x="16.0" y="86.0" width="328.0" height="54.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<text x="28.0" y="108.0" font-size="12.5" fill="#e5534b" text-anchor="start" font-weight="700">thread per connection</text>
<text x="28.0" y="128.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">blocking read() in each</text>
<rect x="16.0" y="150.0" width="328.0" height="54.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="28.0" y="172.0" font-size="12.5" fill="#e2b45a" text-anchor="start" font-weight="700">select() / poll()</text>
<text x="28.0" y="192.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">O(n) per call</text>
<rect x="16.0" y="214.0" width="328.0" height="54.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="28.0" y="236.0" font-size="12.5" fill="#5fb3a1" text-anchor="start" font-weight="700">epoll / kqueue</text>
<text x="28.0" y="256.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">O(ready) per call</text>
<rect x="16.0" y="278.0" width="328.0" height="54.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="28.0" y="300.0" font-size="12.5" fill="#7cc47f" text-anchor="start" font-weight="700">io_uring</text>
<text x="28.0" y="320.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">batched, few syscalls</text>
<text x="16.0" y="352.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Readiness (epoll, kqueue): "you</text>
<text x="16.0" y="371.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">can read now". Completion (io_uring,</text>
<text x="16.0" y="390.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">IOCP): "your read finished".</text>
</svg>
