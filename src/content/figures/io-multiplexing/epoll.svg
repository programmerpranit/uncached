<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 459" width="880" height="459" role="img" aria-label="epoll interest list and ready list; packets move sockets to the ready list and epoll_wait returns them" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="459" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2b45a"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7cc47f"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">epoll: the kernel tracks interest and readiness for you</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">epoll_ctl adds sockets once; packets move sockets to the ready list; epoll_wait drains it</text>
<rect x="240.0" y="90.0" width="400.0" height="230.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="440.0" y="112.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">epoll instance (in kernel)</text>
<rect x="260.0" y="128.0" width="170.0" height="170.0" rx="3" fill="#1b1712" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="345.0" y="150.0" font-size="11.5" fill="#5fb3a1" text-anchor="middle" font-weight="600">interest list</text>
<text x="345.0" y="166.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">(red-black tree)</text>
<text x="345.0" y="194.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">fd 7</text>
<text x="345.0" y="216.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">fd 8</text>
<text x="345.0" y="238.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">fd 9</text>
<text x="345.0" y="260.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">… 10,000 fds</text>
<rect x="450.0" y="128.0" width="170.0" height="170.0" rx="3" fill="#1b1712" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="535.0" y="150.0" font-size="11.5" fill="#7cc47f" text-anchor="middle" font-weight="600">ready list</text>
<text x="535.0" y="186.0" font-size="11.5" fill="#7cc47f" text-anchor="middle" font-weight="400">fd 9</text>
<text x="535.0" y="208.0" font-size="11.5" fill="#7cc47f" text-anchor="middle" font-weight="400">fd 812</text>
<rect x="40.0" y="140.0" width="160.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="120.0" y="164.3" font-size="12" fill="#5fb3a1" text-anchor="middle" font-weight="600">epoll_ctl(ADD)</text>
<line x1="200.0" y1="160.0" x2="258.0" y2="170.0" stroke="#5fb3a1" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="40.0" y="240.0" width="160.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="120.0" y="264.3" font-size="12" fill="#e2b45a" text-anchor="middle" font-weight="600">NIC → packet</text>
<path d="M120 280 C 120 360, 540 370, 540 300" fill="none" stroke="#e2b45a" stroke-width="1.3" marker-end="url(#ah1)"/>
<text x="330.0" y="372.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="400">socket callback adds fd to ready list</text>
<rect x="690.0" y="180.0" width="160.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="770.0" y="199.0" font-size="12" fill="#7cc47f" text-anchor="middle" font-weight="600">epoll_wait()</text>
<text x="770.0" y="215.0" font-size="11" fill="#7cc47f" text-anchor="middle" font-weight="400">returns fd 9, 812</text>
<line x1="622.0" y1="200.0" x2="688.0" y2="200.0" stroke="#7cc47f" stroke-width="1.3" marker-end="url(#ah2)"/>
<text x="40.0" y="410.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Registering is O(log n) once; each wait costs O(number ready), not O(number watched). The event loop then calls</text>
<text x="40.0" y="429.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">read()/write() on just those sockets until they would block (EAGAIN), and goes back to epoll_wait.</text>
</svg>
