<text x="60.0" y="306.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Any 0 bit means "definitely not present". All 1s means "probably present": the bits may have been set by other</text>
<text x="60.0" y="325.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">keys. No false negatives, tunable false positives, and no way to list or delete keys.</text>
