<text x="40.0" y="340.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">p ≈ 0.6185^(bits per element) with k = (m/n)·ln 2 hash functions. ~10 bits per key gives ~1%, and every extra</text>
<text x="40.0" y="359.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">4.8 bits divides the error by 10. A billion keys at 1% fits in ~1.2 GB, far less than storing the keys.</text>
