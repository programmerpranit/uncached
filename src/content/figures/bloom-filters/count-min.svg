<text x="40.0" y="270.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Increment: add 1 to one counter per row. Collisions only add, so every row over-estimates; the minimum is the best</text>
<text x="40.0" y="289.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">guess. Error ≤ εN with probability 1−δ using w = e/ε and d = ln(1/δ). Used for heavy hitters and rate limiting.</text>
