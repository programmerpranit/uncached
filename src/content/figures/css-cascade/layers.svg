<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 356" width="880" height="356" role="img" aria-label="Cascade layers declared in order reset, base, components, utilities; a later layer wins over an earlier one regardless of specificity, and unlayered styles beat all layers" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="356" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7cc47f"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Cascade layers beat specificity</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">@layer reset, base, components, utilities;</text>
<rect x="40.0" y="100.0" width="520.0" height="40.0" rx="8" fill="#a69d8e" fill-opacity="0.12" stroke="#a69d8e" stroke-width="1.3"/>
<text x="56.0" y="125.0" font-size="12.5" fill="#a69d8e" text-anchor="start" font-weight="700">reset</text>
<text x="190.0" y="125.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">*, ::before { box-sizing: border-box }</text>
<rect x="40.0" y="148.0" width="520.0" height="40.0" rx="8" fill="#5fb3a1" fill-opacity="0.12" stroke="#5fb3a1" stroke-width="1.3"/>
<text x="56.0" y="173.0" font-size="12.5" fill="#5fb3a1" text-anchor="start" font-weight="700">base</text>
<text x="190.0" y="173.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">#app a { color: navy }   (1,0,1)</text>
<rect x="40.0" y="196.0" width="520.0" height="40.0" rx="8" fill="#9b8cff" fill-opacity="0.12" stroke="#9b8cff" stroke-width="1.3"/>
<text x="56.0" y="221.0" font-size="12.5" fill="#9b8cff" text-anchor="start" font-weight="700">components</text>
<text x="190.0" y="221.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">.btn { color: white }   (0,1,0)</text>
<rect x="40.0" y="244.0" width="520.0" height="40.0" rx="8" fill="#ff5b2e" fill-opacity="0.12" stroke="#ff5b2e" stroke-width="1.3"/>
<text x="56.0" y="269.0" font-size="12.5" fill="#ff5b2e" text-anchor="start" font-weight="700">utilities</text>
<text x="190.0" y="269.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">.text-red { color: red }   (0,1,0)</text>
<rect x="40.0" y="292.0" width="520.0" height="40.0" rx="8" fill="#e2b45a" fill-opacity="0.12" stroke="#e2b45a" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="56.0" y="317.0" font-size="12.5" fill="#e2b45a" text-anchor="start" font-weight="700">unlayered</text>
<text x="190.0" y="317.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">styles outside any layer</text>
<line x1="590.0" y1="330.0" x2="590.0" y2="108.0" stroke="#7cc47f" stroke-width="1.6" marker-end="url(#ah0)"/>
<text x="604.0" y="120.0" font-size="11.5" fill="#7cc47f" text-anchor="start" font-weight="700">wins conflicts</text>
<text x="604.0" y="150.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">A later layer beats an</text>
<text x="604.0" y="167.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">earlier one, whatever the</text>
<text x="604.0" y="184.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">specificity: .btn (0,1,0)</text>
<text x="604.0" y="201.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">overrides #app a (1,0,1).</text>
<text x="604.0" y="235.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">Unlayered styles beat all</text>
<text x="604.0" y="252.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">layers. For !important,</text>
<text x="604.0" y="269.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">the order flips: earlier</text>
<text x="604.0" y="286.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">layers win.</text>
</svg>
