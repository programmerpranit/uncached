<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 438" width="360" height="438" role="img" aria-label="Cascade layers declared in order reset, base, components, utilities; a later layer wins over an earlier one regardless of specificity, and unlayered styles beat all layers" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="438" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Cascade layers</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">order declared once, up front</text>
<rect x="16.0" y="84.0" width="328.0" height="46.0" rx="8" fill="#a69d8e" fill-opacity="0.1" stroke="#a69d8e" stroke-width="1.3"/>
<text x="28.0" y="103.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="700">reset</text>
<text x="28.0" y="120.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">*, ::before { box-sizing: border-box }</text>
<rect x="16.0" y="138.0" width="328.0" height="46.0" rx="8" fill="#5fb3a1" fill-opacity="0.1" stroke="#5fb3a1" stroke-width="1.3"/>
<text x="28.0" y="157.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="700">base</text>
<text x="28.0" y="174.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">#app a { color: navy }</text>
<rect x="16.0" y="192.0" width="328.0" height="46.0" rx="8" fill="#9b8cff" fill-opacity="0.1" stroke="#9b8cff" stroke-width="1.3"/>
<text x="28.0" y="211.0" font-size="12" fill="#9b8cff" text-anchor="start" font-weight="700">components</text>
<text x="28.0" y="228.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">.btn { color: white }</text>
<rect x="16.0" y="246.0" width="328.0" height="46.0" rx="8" fill="#ff5b2e" fill-opacity="0.1" stroke="#ff5b2e" stroke-width="1.3"/>
<text x="28.0" y="265.0" font-size="12" fill="#ff5b2e" text-anchor="start" font-weight="700">utilities</text>
<text x="28.0" y="282.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">.text-red { color: red }</text>
<rect x="16.0" y="300.0" width="328.0" height="46.0" rx="8" fill="#e2b45a" fill-opacity="0.1" stroke="#e2b45a" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="28.0" y="319.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="700">unlayered</text>
<text x="28.0" y="336.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">styles outside any layer</text>
<text x="16.0" y="370.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Lower in the list wins, whatever</text>
<text x="16.0" y="389.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">the specificity. !important flips</text>
<text x="16.0" y="408.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">the order: earlier layers win.</text>
</svg>
