<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 467" width="880" height="467" role="img" aria-label="The cascade compares origin and importance, then context, then inline style, then cascade layers, then specificity, then order of appearance; each step only breaks ties from the previous one" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="467" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">How the cascade picks a winner</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">each step only breaks ties left by the one before</text>
<rect x="40.0" y="96.0" width="800.0" height="42.0" rx="8" fill="#ff5b2e" fill-opacity="0.12" stroke="#ff5b2e" stroke-width="1.3"/>
<text x="56.0" y="122.0" font-size="12.5" fill="#ff5b2e" text-anchor="start" font-weight="700">1. origin + importance</text>
<text x="300.0" y="122.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">user-agent &lt; user &lt; author; !important reverses the order</text>
<rect x="60.0" y="146.0" width="760.0" height="42.0" rx="8" fill="#d77fa1" fill-opacity="0.12" stroke="#d77fa1" stroke-width="1.3"/>
<text x="76.0" y="172.0" font-size="12.5" fill="#d77fa1" text-anchor="start" font-weight="700">2. context</text>
<text x="320.0" y="172.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">shadow DOM: outer vs encapsulated styles</text>
<rect x="80.0" y="196.0" width="720.0" height="42.0" rx="8" fill="#e2b45a" fill-opacity="0.12" stroke="#e2b45a" stroke-width="1.3"/>
<text x="96.0" y="222.0" font-size="12.5" fill="#e2b45a" text-anchor="start" font-weight="700">3. element-attached</text>
<text x="340.0" y="222.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">style="…" beats any selector</text>
<rect x="100.0" y="246.0" width="680.0" height="42.0" rx="8" fill="#9b8cff" fill-opacity="0.12" stroke="#9b8cff" stroke-width="1.3"/>
<text x="116.0" y="272.0" font-size="12.5" fill="#9b8cff" text-anchor="start" font-weight="700">4. cascade layers</text>
<text x="360.0" y="272.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">later @layer wins; unlayered beats layered</text>
<rect x="120.0" y="296.0" width="640.0" height="42.0" rx="8" fill="#5fb3a1" fill-opacity="0.12" stroke="#5fb3a1" stroke-width="1.3"/>
<text x="136.0" y="322.0" font-size="12.5" fill="#5fb3a1" text-anchor="start" font-weight="700">5. specificity</text>
<text x="380.0" y="322.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">(ids, classes, types): compared left to right</text>
<rect x="140.0" y="346.0" width="600.0" height="42.0" rx="8" fill="#7cc47f" fill-opacity="0.12" stroke="#7cc47f" stroke-width="1.3"/>
<text x="156.0" y="372.0" font-size="12.5" fill="#7cc47f" text-anchor="start" font-weight="700">6. order of appearance</text>
<text x="400.0" y="372.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">the last declaration wins</text>
<text x="40.0" y="418.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Only declarations for the same property on the same element compete. If step 1 already decides, specificity</text>
<text x="40.0" y="437.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">never matters. Most day-to-day conflicts are settled at step 5 or 6, which is why specificity gets the blame.</text>
</svg>
