<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 497" width="360" height="497" role="img" aria-label="The cascade compares origin and importance, then context, then inline style, then cascade layers, then specificity, then order of appearance; each step only breaks ties from the previous one" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="497" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Cascade order</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">each step breaks ties</text>
<rect x="16.0" y="84.0" width="328.0" height="50.0" rx="8" fill="#ff5b2e" fill-opacity="0.1" stroke="#ff5b2e" stroke-width="1.3"/>
<text x="28.0" y="104.0" font-size="12" fill="#ff5b2e" text-anchor="start" font-weight="700">1. origin + importance</text>
<text x="28.0" y="122.0" font-size="9.5" fill="#ede6d8" text-anchor="start" font-weight="400">user-agent &lt; user &lt; author, !important flips</text>
<rect x="16.0" y="142.0" width="328.0" height="50.0" rx="8" fill="#d77fa1" fill-opacity="0.1" stroke="#d77fa1" stroke-width="1.3"/>
<text x="28.0" y="162.0" font-size="12" fill="#d77fa1" text-anchor="start" font-weight="700">2. context</text>
<text x="28.0" y="180.0" font-size="9.5" fill="#ede6d8" text-anchor="start" font-weight="400">shadow DOM: outer vs encapsulated styles</text>
<rect x="16.0" y="200.0" width="328.0" height="50.0" rx="8" fill="#e2b45a" fill-opacity="0.1" stroke="#e2b45a" stroke-width="1.3"/>
<text x="28.0" y="220.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="700">3. element-attached</text>
<text x="28.0" y="238.0" font-size="9.5" fill="#ede6d8" text-anchor="start" font-weight="400">style="…" beats any selector</text>
<rect x="16.0" y="258.0" width="328.0" height="50.0" rx="8" fill="#9b8cff" fill-opacity="0.1" stroke="#9b8cff" stroke-width="1.3"/>
<text x="28.0" y="278.0" font-size="12" fill="#9b8cff" text-anchor="start" font-weight="700">4. cascade layers</text>
<text x="28.0" y="296.0" font-size="9.5" fill="#ede6d8" text-anchor="start" font-weight="400">later @layer wins; unlayered beats layered</text>
<rect x="16.0" y="316.0" width="328.0" height="50.0" rx="8" fill="#5fb3a1" fill-opacity="0.1" stroke="#5fb3a1" stroke-width="1.3"/>
<text x="28.0" y="336.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="700">5. specificity</text>
<text x="28.0" y="354.0" font-size="9.5" fill="#ede6d8" text-anchor="start" font-weight="400">(ids, classes, types): compared left to right</text>
<rect x="16.0" y="374.0" width="328.0" height="50.0" rx="8" fill="#7cc47f" fill-opacity="0.1" stroke="#7cc47f" stroke-width="1.3"/>
<text x="28.0" y="394.0" font-size="12" fill="#7cc47f" text-anchor="start" font-weight="700">6. order of appearance</text>
<text x="28.0" y="412.0" font-size="9.5" fill="#ede6d8" text-anchor="start" font-weight="400">the last declaration wins</text>
<text x="16.0" y="448.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Only same-property declarations</text>
<text x="16.0" y="467.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">on the same element compete.</text>
</svg>
