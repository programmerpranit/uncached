<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 298" width="880" height="298" role="img" aria-label="Resolving a path one component at a time through the dentry cache" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="298" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a4136"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Path lookup: /home/ana/notes.txt, one component at a time</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">each step checks permission and asks the dentry cache before the disk</text>
<rect x="40.0" y="100.0" width="170.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="125.0" y="126.7" font-size="13" fill="#7cc47f" text-anchor="middle" font-weight="600">/</text>
<text x="125.0" y="170.0" font-size="11" fill="#7cc47f" text-anchor="middle" font-weight="400">root dentry (cached)</text>
<line x1="210.0" y1="122.0" x2="244.0" y2="122.0" stroke="#4a4136" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="244.0" y="100.0" width="170.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="329.0" y="126.7" font-size="13" fill="#7cc47f" text-anchor="middle" font-weight="600">home</text>
<text x="329.0" y="170.0" font-size="11" fill="#7cc47f" text-anchor="middle" font-weight="400">dcache hit → inode 2</text>
<line x1="414.0" y1="122.0" x2="448.0" y2="122.0" stroke="#4a4136" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="448.0" y="100.0" width="170.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="533.0" y="126.7" font-size="13" fill="#7cc47f" text-anchor="middle" font-weight="600">ana</text>
<text x="533.0" y="170.0" font-size="11" fill="#7cc47f" text-anchor="middle" font-weight="400">dcache hit → inode 1405</text>
<line x1="618.0" y1="122.0" x2="652.0" y2="122.0" stroke="#4a4136" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="652.0" y="100.0" width="170.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="737.0" y="126.7" font-size="13" fill="#e2b45a" text-anchor="middle" font-weight="600">notes.txt</text>
<text x="737.0" y="170.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="400">dcache miss → read dir</text>
<text x="737.0" y="188.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="400">→ inode 1832</text>
<text x="40.0" y="230.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">At each component the kernel checks execute (search) permission on the directory, follows mount points and</text>
<text x="40.0" y="249.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">symlinks, and looks in the dentry cache, a hash table of (parent, name) → inode, including negative entries for</text>
<text x="40.0" y="268.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">names that don't exist. Hot paths are resolved without locks using RCU, so most lookups never touch the disk.</text>
</svg>
