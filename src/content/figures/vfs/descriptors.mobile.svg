<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 407" width="360" height="407" role="img" aria-label="File descriptor tables point to open file descriptions, which point to inodes" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="407" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2b45a"/></marker></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">fd → open file → inode</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">three levels of indirection</text>
<text x="16.0" y="88.0" font-size="11.5" fill="#ff5b2e" text-anchor="start" font-weight="400">process A: fd 3, fd 4 (dup), fd 5</text>
<text x="16.0" y="108.0" font-size="11.5" fill="#d77fa1" text-anchor="start" font-weight="400">process B (fork): fd 3</text>
<rect x="16.0" y="136.0" width="328.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="153.0" font-size="11.5" fill="#e2b45a" text-anchor="middle" font-weight="600">open file #1: offset 4096</text>
<text x="180.0" y="169.0" font-size="10" fill="#e2b45a" text-anchor="middle" font-weight="400">A fd 3, A fd 4, B fd 3</text>
<rect x="16.0" y="186.0" width="328.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="203.0" font-size="11.5" fill="#e2b45a" text-anchor="middle" font-weight="600">open file #2: offset 0</text>
<text x="180.0" y="219.0" font-size="10" fill="#e2b45a" text-anchor="middle" font-weight="400">A fd 5</text>
<rect x="100.0" y="250.0" width="160.0" height="34.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="271.3" font-size="12" fill="#5fb3a1" text-anchor="middle" font-weight="600">inode 1832</text>
<line x1="180.0" y1="226.0" x2="180.0" y2="248.0" stroke="#e2b45a" stroke-width="1.2" marker-end="url(#ah0)"/>
<text x="16.0" y="320.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">dup and fork share an offset;</text>
<text x="16.0" y="339.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">separate open() calls don't.</text>
<text x="16.0" y="358.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Permissions are checked once,</text>
<text x="16.0" y="377.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">at open().</text>
</svg>
