<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 428" width="880" height="428" role="img" aria-label="Directory entries map names to an inode number; the inode holds metadata and block pointers" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="428" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2b45a"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b8cff"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Names live in directories; files live in inodes</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">a directory maps names to inode numbers; the inode holds everything else</text>
<rect x="40.0" y="90.0" width="250.0" height="150.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="56.0" y="112.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="600">directory /home/ana</text>
<text x="60.0" y="142.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">notes.txt</text>
<text x="270.0" y="142.0" font-size="12" fill="#e2b45a" text-anchor="end" font-weight="400">→ 1832</text>
<text x="60.0" y="170.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">todo.txt</text>
<text x="270.0" y="170.0" font-size="12" fill="#e2b45a" text-anchor="end" font-weight="400">→ 1832</text>
<text x="60.0" y="198.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">photos/</text>
<text x="270.0" y="198.0" font-size="12" fill="#e2b45a" text-anchor="end" font-weight="400">→ 2210</text>
<rect x="360.0" y="90.0" width="260.0" height="230.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="376.0" y="112.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="600">inode 1832</text>
<text x="376.0" y="140.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">type + permissions: -rw-r--r--</text>
<text x="376.0" y="168.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">owner uid/gid: 1000/1000</text>
<text x="376.0" y="196.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">size: 18,204 bytes</text>
<text x="376.0" y="224.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">timestamps: atime mtime ctime</text>
<text x="376.0" y="252.0" font-size="11.5" fill="#7cc47f" text-anchor="start" font-weight="400">link count: 2</text>
<text x="376.0" y="280.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">extents → blocks 9100–9104</text>
<rect x="690.0" y="230.0" width="150.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="765.0" y="252.0" font-size="12" fill="#9b8cff" text-anchor="middle" font-weight="600">data blocks</text>
<text x="765.0" y="268.0" font-size="11" fill="#9b8cff" text-anchor="middle" font-weight="400">9100–9104</text>
<line x1="292.0" y1="142.0" x2="358.0" y2="140.0" stroke="#e2b45a" stroke-width="1.2" marker-end="url(#ah0)"/>
<line x1="292.0" y1="170.0" x2="358.0" y2="148.0" stroke="#e2b45a" stroke-width="1.2" marker-end="url(#ah0)"/>
<line x1="622.0" y1="284.0" x2="688.0" y2="256.0" stroke="#9b8cff" stroke-width="1.3" marker-end="url(#ah1)"/>
<text x="40.0" y="360.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">The inode has no name. Two directory entries pointing to the same inode are hard links (link count 2): both</text>
<text x="40.0" y="379.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">names are equally "the" file, and the data is freed only when the count reaches 0 and no process has it open.</text>
<text x="40.0" y="398.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">That's why deleting an open log file doesn't free disk space until the writer closes it.</text>
</svg>
