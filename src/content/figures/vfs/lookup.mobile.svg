<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 361" width="360" height="361" role="img" aria-label="Resolving a path one component at a time through the dentry cache" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="361" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Path lookup</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">dcache first, disk on miss</text>
<rect x="16.0" y="86.0" width="120.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="76.0" y="106.3" font-size="12" fill="#7cc47f" text-anchor="middle" font-weight="600">/</text>
<text x="148.0" y="107.0" font-size="11" fill="#7cc47f" text-anchor="start" font-weight="400">root dentry (cached)</text>
<rect x="16.0" y="130.0" width="120.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="76.0" y="150.3" font-size="12" fill="#7cc47f" text-anchor="middle" font-weight="600">home</text>
<text x="148.0" y="151.0" font-size="11" fill="#7cc47f" text-anchor="start" font-weight="400">dcache hit → inode 2</text>
<rect x="16.0" y="174.0" width="120.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="76.0" y="194.3" font-size="12" fill="#7cc47f" text-anchor="middle" font-weight="600">ana</text>
<text x="148.0" y="195.0" font-size="11" fill="#7cc47f" text-anchor="start" font-weight="400">dcache hit → inode 1405</text>
<rect x="16.0" y="218.0" width="120.0" height="32.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="76.0" y="238.3" font-size="12" fill="#e2b45a" text-anchor="middle" font-weight="600">notes.txt</text>
<text x="148.0" y="239.0" font-size="11" fill="#e2b45a" text-anchor="start" font-weight="400">dcache miss</text>
<text x="16.0" y="274.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Each step: permission check,</text>
<text x="16.0" y="293.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">mounts, symlinks, dcache lookup.</text>
<text x="16.0" y="312.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Negative entries cache "no such</text>
<text x="16.0" y="331.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">file". Most lookups skip the disk.</text>
</svg>
