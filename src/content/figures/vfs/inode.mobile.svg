<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 393" width="360" height="393" role="img" aria-label="Directory entries map names to an inode number; the inode holds metadata and block pointers" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="393" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Directories and inodes</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">name → inode number → data</text>
<text x="16.0" y="86.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="600">directory /home/ana</text>
<text x="16.0" y="108.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">notes.txt  → 1832</text>
<text x="16.0" y="128.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">todo.txt   → 1832</text>
<text x="16.0" y="148.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">photos/    → 2210</text>
<text x="16.0" y="186.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="600">inode 1832</text>
<text x="16.0" y="208.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">-rw-r--r--, uid 1000</text>
<text x="16.0" y="228.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">size 18,204 B, times</text>
<text x="16.0" y="248.0" font-size="11.5" fill="#7cc47f" text-anchor="start" font-weight="400">link count: 2</text>
<text x="16.0" y="268.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">extents → blocks 9100–9104</text>
<text x="16.0" y="306.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Inodes have no names. Two names,</text>
<text x="16.0" y="325.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">one inode = hard links. Data is</text>
<text x="16.0" y="344.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">freed at link count 0 and no</text>
<text x="16.0" y="363.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">open file descriptors.</text>
</svg>
