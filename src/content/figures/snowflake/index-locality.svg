<text x="40.0" y="236.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="400">Random: every leaf page is a write target, so the working set is the whole index.</text>
<text x="40.0" y="255.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Pages split in the middle and end up ~50–70% full; caches miss more as the table grows.</text>
<text x="40.0" y="296.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="400">Time-ordered: new keys land in the rightmost leaf.</text>
<text x="40.0" y="315.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Only the "hot" tail of the index needs to be in memory; pages fill up completely before splitting.</text>
</svg>
