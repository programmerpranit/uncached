<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 397" width="880" height="397" role="img" aria-label="Comparison of auto-increment, ranges, UUIDv4, UUIDv7, ULID and Snowflake IDs" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="397" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">ID schemes compared</text>
<text x="40.0" y="90.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="600">scheme</text>
<text x="280.0" y="90.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="600">bits</text>
<text x="380.0" y="90.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="600">sortable</text>
<text x="500.0" y="90.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="600">unique</text>
<text x="620.0" y="90.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="600">no coordination</text>
<line x1="40.0" y1="100.0" x2="840.0" y2="100.0" stroke="#4a4136" stroke-width="1.3"/>
<text x="40.0" y="128.0" font-size="13" fill="#e2b45a" text-anchor="start" font-weight="600">Auto-increment</text>
<text x="280.0" y="128.0" font-size="13" fill="#ede6d8" text-anchor="start" font-weight="400">64</text>
<text x="380.0" y="128.0" font-size="13" fill="#7cc47f" text-anchor="start" font-weight="400">✓</text>
<text x="500.0" y="128.0" font-size="13" fill="#7cc47f" text-anchor="start" font-weight="400">✓</text>
<text x="620.0" y="128.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="400">✗ one DB</text>
<text x="40.0" y="162.0" font-size="13" fill="#e2b45a" text-anchor="start" font-weight="600">DB ranges / Hi-Lo</text>
<text x="280.0" y="162.0" font-size="13" fill="#ede6d8" text-anchor="start" font-weight="400">64</text>
<text x="380.0" y="162.0" font-size="13" fill="#e2b45a" text-anchor="start" font-weight="400">~</text>
<text x="500.0" y="162.0" font-size="13" fill="#7cc47f" text-anchor="start" font-weight="400">✓</text>
<text x="620.0" y="162.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="400">~ allocator</text>
<text x="40.0" y="196.0" font-size="13" fill="#e5534b" text-anchor="start" font-weight="600">UUIDv4</text>
<text x="280.0" y="196.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">128</text>
<text x="380.0" y="196.0" font-size="13" fill="#e5534b" text-anchor="start" font-weight="400">✗</text>
<text x="500.0" y="196.0" font-size="13" fill="#7cc47f" text-anchor="start" font-weight="400">✓</text>
<text x="620.0" y="196.0" font-size="13" fill="#7cc47f" text-anchor="start" font-weight="400">✓</text>
<text x="40.0" y="230.0" font-size="13" fill="#5fb3a1" text-anchor="start" font-weight="600">UUIDv7</text>
<text x="280.0" y="230.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">128</text>
<text x="380.0" y="230.0" font-size="13" fill="#7cc47f" text-anchor="start" font-weight="400">✓</text>
<text x="500.0" y="230.0" font-size="13" fill="#7cc47f" text-anchor="start" font-weight="400">✓</text>
<text x="620.0" y="230.0" font-size="13" fill="#7cc47f" text-anchor="start" font-weight="400">✓</text>
<text x="40.0" y="264.0" font-size="13" fill="#5fb3a1" text-anchor="start" font-weight="600">ULID</text>
<text x="280.0" y="264.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">128</text>
<text x="380.0" y="264.0" font-size="13" fill="#7cc47f" text-anchor="start" font-weight="400">✓</text>
<text x="500.0" y="264.0" font-size="13" fill="#7cc47f" text-anchor="start" font-weight="400">✓</text>
<text x="620.0" y="264.0" font-size="13" fill="#7cc47f" text-anchor="start" font-weight="400">✓</text>
<text x="40.0" y="298.0" font-size="13" fill="#ff5b2e" text-anchor="start" font-weight="600">Snowflake</text>
<text x="280.0" y="298.0" font-size="13" fill="#ede6d8" text-anchor="start" font-weight="400">64</text>
<text x="380.0" y="298.0" font-size="13" fill="#7cc47f" text-anchor="start" font-weight="400">✓</text>
<text x="500.0" y="298.0" font-size="13" fill="#7cc47f" text-anchor="start" font-weight="400">✓</text>
<text x="620.0" y="298.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="400">~ worker IDs</text>
<text x="40.0" y="348.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">"Sortable" means IDs created later compare larger (roughly, across machines), which keeps B-tree inserts</text>
<text x="40.0" y="367.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">at the right edge of the index and lets you paginate and shard by time.</text>
</svg>
