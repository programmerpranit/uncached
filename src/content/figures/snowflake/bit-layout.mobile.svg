<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 439" width="360" height="439" role="img" aria-label="Snowflake ID bit layout: 1 sign bit, 41-bit timestamp, 10-bit machine ID, 12-bit sequence" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="439" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Anatomy of a Snowflake ID</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">64 bits, packed into one integer</text>
<rect x="16.0" y="72.0" width="328.0" height="58.0" rx="3" fill="#a69d8e" fill-opacity="0.15" stroke="#a69d8e" stroke-width="1"/>
<text x="28.0" y="96.0" font-size="13" fill="#a69d8e" text-anchor="start" font-weight="700">0</text>
<text x="332.0" y="96.0" font-size="11" fill="#ede6d8" text-anchor="end" font-weight="600">sign</text>
<text x="28.0" y="116.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">always 0</text>
<rect x="16.0" y="138.0" width="328.0" height="58.0" rx="3" fill="#ff5b2e" fill-opacity="0.15" stroke="#ff5b2e" stroke-width="1"/>
<text x="28.0" y="162.0" font-size="13" fill="#ff5b2e" text-anchor="start" font-weight="700">timestamp</text>
<text x="332.0" y="162.0" font-size="11" fill="#ede6d8" text-anchor="end" font-weight="600">41 bits</text>
<text x="28.0" y="182.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">ms since custom epoch</text>
<rect x="16.0" y="204.0" width="328.0" height="58.0" rx="3" fill="#5fb3a1" fill-opacity="0.15" stroke="#5fb3a1" stroke-width="1"/>
<text x="28.0" y="228.0" font-size="13" fill="#5fb3a1" text-anchor="start" font-weight="700">machine</text>
<text x="332.0" y="228.0" font-size="11" fill="#ede6d8" text-anchor="end" font-weight="600">10 bits</text>
<text x="28.0" y="248.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">1,024 workers</text>
<rect x="16.0" y="270.0" width="328.0" height="58.0" rx="3" fill="#e2b45a" fill-opacity="0.15" stroke="#e2b45a" stroke-width="1"/>
<text x="28.0" y="294.0" font-size="13" fill="#e2b45a" text-anchor="start" font-weight="700">sequence</text>
<text x="332.0" y="294.0" font-size="11" fill="#ede6d8" text-anchor="end" font-weight="600">12 bits</text>
<text x="28.0" y="314.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">4,096 per ms</text>
<text x="16.0" y="352.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Time in the high bits ⇒ IDs sort</text>
<text x="16.0" y="371.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">by creation time.</text>
<text x="16.0" y="390.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">41 bits of ms ≈ 69.7 years.</text>
<text x="16.0" y="409.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">1,024 × 4,096 ≈ 4.2B IDs/s total.</text>
</svg>
