<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 588" width="360" height="588" role="img" aria-label="Comparison of auto-increment, ranges, UUIDv4, UUIDv7, ULID and Snowflake IDs" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="588" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">ID schemes compared</text>
<rect x="16.0" y="74.0" width="328.0" height="64.0" rx="3" fill="#e2b45a" fill-opacity="0.1" stroke="#e2b45a" stroke-width="1"/>
<text x="28.0" y="96.0" font-size="13" fill="#e2b45a" text-anchor="start" font-weight="700">Auto-increment</text>
<text x="332.0" y="96.0" font-size="11" fill="#a69d8e" text-anchor="end" font-weight="400">64 bits</text>
<text x="28.0" y="122.0" font-size="11" fill="#7cc47f" text-anchor="start" font-weight="400">sort ✓</text>
<text x="128.0" y="122.0" font-size="11" fill="#7cc47f" text-anchor="start" font-weight="400">uniq ✓</text>
<text x="228.0" y="122.0" font-size="11" fill="#e5534b" text-anchor="start" font-weight="400">coord ✗</text>
<rect x="16.0" y="146.0" width="328.0" height="64.0" rx="3" fill="#e2b45a" fill-opacity="0.1" stroke="#e2b45a" stroke-width="1"/>
<text x="28.0" y="168.0" font-size="13" fill="#e2b45a" text-anchor="start" font-weight="700">DB ranges / Hi-Lo</text>
<text x="332.0" y="168.0" font-size="11" fill="#a69d8e" text-anchor="end" font-weight="400">64 bits</text>
<text x="28.0" y="194.0" font-size="11" fill="#e2b45a" text-anchor="start" font-weight="400">sort ~</text>
<text x="128.0" y="194.0" font-size="11" fill="#7cc47f" text-anchor="start" font-weight="400">uniq ✓</text>
<text x="228.0" y="194.0" font-size="11" fill="#e2b45a" text-anchor="start" font-weight="400">coord ~</text>
<rect x="16.0" y="218.0" width="328.0" height="64.0" rx="3" fill="#e5534b" fill-opacity="0.1" stroke="#e5534b" stroke-width="1"/>
<text x="28.0" y="240.0" font-size="13" fill="#e5534b" text-anchor="start" font-weight="700">UUIDv4</text>
<text x="332.0" y="240.0" font-size="11" fill="#a69d8e" text-anchor="end" font-weight="400">128 bits</text>
<text x="28.0" y="266.0" font-size="11" fill="#e5534b" text-anchor="start" font-weight="400">sort ✗</text>
<text x="128.0" y="266.0" font-size="11" fill="#7cc47f" text-anchor="start" font-weight="400">uniq ✓</text>
<text x="228.0" y="266.0" font-size="11" fill="#7cc47f" text-anchor="start" font-weight="400">coord ✓</text>
<rect x="16.0" y="290.0" width="328.0" height="64.0" rx="3" fill="#5fb3a1" fill-opacity="0.1" stroke="#5fb3a1" stroke-width="1"/>
<text x="28.0" y="312.0" font-size="13" fill="#5fb3a1" text-anchor="start" font-weight="700">UUIDv7</text>
<text x="332.0" y="312.0" font-size="11" fill="#a69d8e" text-anchor="end" font-weight="400">128 bits</text>
<text x="28.0" y="338.0" font-size="11" fill="#7cc47f" text-anchor="start" font-weight="400">sort ✓</text>
<text x="128.0" y="338.0" font-size="11" fill="#7cc47f" text-anchor="start" font-weight="400">uniq ✓</text>
<text x="228.0" y="338.0" font-size="11" fill="#7cc47f" text-anchor="start" font-weight="400">coord ✓</text>
<rect x="16.0" y="362.0" width="328.0" height="64.0" rx="3" fill="#5fb3a1" fill-opacity="0.1" stroke="#5fb3a1" stroke-width="1"/>
<text x="28.0" y="384.0" font-size="13" fill="#5fb3a1" text-anchor="start" font-weight="700">ULID</text>
<text x="332.0" y="384.0" font-size="11" fill="#a69d8e" text-anchor="end" font-weight="400">128 bits</text>
<text x="28.0" y="410.0" font-size="11" fill="#7cc47f" text-anchor="start" font-weight="400">sort ✓</text>
<text x="128.0" y="410.0" font-size="11" fill="#7cc47f" text-anchor="start" font-weight="400">uniq ✓</text>
<text x="228.0" y="410.0" font-size="11" fill="#7cc47f" text-anchor="start" font-weight="400">coord ✓</text>
<rect x="16.0" y="434.0" width="328.0" height="64.0" rx="3" fill="#ff5b2e" fill-opacity="0.1" stroke="#ff5b2e" stroke-width="1"/>
<text x="28.0" y="456.0" font-size="13" fill="#ff5b2e" text-anchor="start" font-weight="700">Snowflake</text>
<text x="332.0" y="456.0" font-size="11" fill="#a69d8e" text-anchor="end" font-weight="400">64 bits</text>
<text x="28.0" y="482.0" font-size="11" fill="#7cc47f" text-anchor="start" font-weight="400">sort ✓</text>
<text x="128.0" y="482.0" font-size="11" fill="#7cc47f" text-anchor="start" font-weight="400">uniq ✓</text>
<text x="228.0" y="482.0" font-size="11" fill="#e2b45a" text-anchor="start" font-weight="400">coord ~</text>
<text x="16.0" y="520.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">coord ✓ = no coordination needed.</text>
<text x="16.0" y="539.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">"~ worker IDs": Snowflake needs each</text>
<text x="16.0" y="558.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">worker to get a unique machine ID.</text>
</svg>
