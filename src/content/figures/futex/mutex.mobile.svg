<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 383" width="360" height="383" role="img" aria-label="State machine of a three-state futex mutex with fast and slow paths" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="383" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Three-state mutex</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">0 free · 1 locked · 2 contended</text>
<rect x="16.0" y="86.0" width="104.0" height="34.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="68.0" y="107.0" font-size="11" fill="#7cc47f" text-anchor="middle" font-weight="600">0 unlocked</text>
<rect x="128.0" y="86.0" width="104.0" height="34.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="107.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="600">1 locked</text>
<rect x="240.0" y="86.0" width="104.0" height="34.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<text x="292.0" y="107.0" font-size="11" fill="#e5534b" text-anchor="middle" font-weight="600">2 contended</text>
<text x="16.0" y="150.0" font-size="12" fill="#7cc47f" text-anchor="start" font-weight="700">lock(), fast path</text>
<text x="16.0" y="168.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">CAS 0→1, no syscall</text>
<text x="16.0" y="194.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="700">lock(), slow path</text>
<text x="16.0" y="212.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">set 2, futex_wait while held</text>
<text x="16.0" y="238.0" font-size="12" fill="#7cc47f" text-anchor="start" font-weight="700">unlock(), fast path</text>
<text x="16.0" y="256.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">xchg 0; was 1 → done</text>
<text x="16.0" y="282.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="700">unlock(), slow path</text>
<text x="16.0" y="300.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">was 2 → futex_wake(1)</text>
<text x="16.0" y="334.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Uncontended: two atomics,</text>
<text x="16.0" y="353.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">~20 ns, no kernel.</text>
</svg>
