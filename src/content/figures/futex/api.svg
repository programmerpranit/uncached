<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 424" width="880" height="424" role="img" aria-label="The futex wait and wake operations and the kernel hash table of waiting threads" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="424" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">The futex API: wait if the word still equals what I saw</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">the kernel only provides sleeping and waking; the lock itself is a 32-bit word in user memory</text>
<rect x="40.0" y="96.0" width="380.0" height="64.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="230.0" y="125.0" font-size="12.5" fill="#5fb3a1" text-anchor="middle" font-weight="600">futex(&amp;word, FUTEX_WAIT, expected)</text>
<text x="230.0" y="141.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="400">atomically: sleep if word == expected, else EAGAIN</text>
<rect x="460.0" y="96.0" width="380.0" height="64.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="650.0" y="125.0" font-size="12.5" fill="#e2b45a" text-anchor="middle" font-weight="600">futex(&amp;word, FUTEX_WAKE, n)</text>
<text x="650.0" y="141.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="400">wake up to n threads waiting on this address</text>
<rect x="40.0" y="190.0" width="800.0" height="110.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="56.0" y="212.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">inside the kernel</text>
<rect x="70.0" y="226.0" width="110.0" height="58.0" rx="3" fill="#1b1712" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="125.0" y="246.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">bucket 0</text>
<rect x="195.0" y="226.0" width="110.0" height="58.0" rx="3" fill="#1b1712" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="250.0" y="246.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">bucket 1</text>
<rect x="320.0" y="226.0" width="110.0" height="58.0" rx="3" fill="#1b1712" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="375.0" y="246.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">bucket 2</text>
<rect x="445.0" y="226.0" width="110.0" height="58.0" rx="3" fill="#1b1712" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="500.0" y="246.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">bucket 3</text>
<rect x="570.0" y="226.0" width="110.0" height="58.0" rx="3" fill="#1b1712" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="625.0" y="246.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">bucket 4</text>
<rect x="695.0" y="226.0" width="110.0" height="58.0" rx="3" fill="#1b1712" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="750.0" y="246.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">bucket 5</text>
<rect x="80.0" y="256.0" width="90.0" height="22.0" rx="3" fill="#1b1712" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="125.0" y="270.4" font-size="9.5" fill="#5fb3a1" text-anchor="middle" font-weight="600">T7 @0x7f10</text>
<rect x="330.0" y="256.0" width="90.0" height="22.0" rx="3" fill="#1b1712" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="375.0" y="270.4" font-size="9.5" fill="#5fb3a1" text-anchor="middle" font-weight="600">T3 @0x55a0</text>
<text x="440.0" y="320.0" font-size="11.5" fill="#a69d8e" text-anchor="middle" font-weight="400">hash(address) → bucket with a queue of sleeping threads; no state exists when nobody waits</text>
<text x="40.0" y="356.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">The check-and-sleep happens under the bucket lock, so a waker that changes the word and calls FUTEX_WAKE can't</text>
<text x="40.0" y="375.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">slip in between "I saw it locked" and "I went to sleep": no lost wakeups. Everything else (the lock protocol,</text>
<text x="40.0" y="394.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">spinning, fairness) is decided by user-space code.</text>
</svg>
