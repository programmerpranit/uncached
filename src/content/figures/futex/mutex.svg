<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 401" width="880" height="401" role="img" aria-label="State machine of a three-state futex mutex with fast and slow paths" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="401" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e5534b"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7cc47f"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">A futex mutex with three states (Drepper)</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">0 = unlocked · 1 = locked, no waiters · 2 = locked, maybe waiters</text>
<rect x="80.0" y="92.0" width="200.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="180.0" y="118.7" font-size="13" fill="#7cc47f" text-anchor="middle" font-weight="600">0  unlocked</text>
<rect x="340.0" y="92.0" width="200.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="440.0" y="118.7" font-size="13" fill="#5fb3a1" text-anchor="middle" font-weight="600">1  locked</text>
<rect x="600.0" y="92.0" width="200.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<text x="700.0" y="118.7" font-size="13" fill="#e5534b" text-anchor="middle" font-weight="600">2  contended</text>
<line x1="280.0" y1="108.0" x2="338.0" y2="108.0" stroke="#5fb3a1" stroke-width="1.3" marker-end="url(#ah0)"/>
<text x="310.0" y="100.0" font-size="10.5" fill="#5fb3a1" text-anchor="middle" font-weight="400">CAS</text>
<line x1="540.0" y1="108.0" x2="598.0" y2="108.0" stroke="#e5534b" stroke-width="1.3" marker-end="url(#ah1)"/>
<text x="570.0" y="100.0" font-size="10.5" fill="#e5534b" text-anchor="middle" font-weight="400">waiter</text>
<path d="M680 136 C 600 180, 260 180, 180 138" fill="none" stroke="#7cc47f" stroke-width="1.2" marker-end="url(#ah2)" stroke-dasharray="4 3"/>
<text x="430.0" y="190.0" font-size="10.5" fill="#7cc47f" text-anchor="middle" font-weight="400">unlock (wake one if it was 2)</text>
<text x="40.0" y="228.0" font-size="12.5" fill="#7cc47f" text-anchor="start" font-weight="700">lock(), fast path</text>
<text x="240.0" y="228.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">CAS 0 → 1 succeeds: done, no syscall</text>
<text x="40.0" y="256.0" font-size="12.5" fill="#e2b45a" text-anchor="start" font-weight="700">lock(), slow path</text>
<text x="240.0" y="256.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">swap word to 2; while old value ≠ 0: futex_wait(&amp;w, 2); swap to 2 again</text>
<text x="40.0" y="284.0" font-size="12.5" fill="#7cc47f" text-anchor="start" font-weight="700">unlock(), fast path</text>
<text x="240.0" y="284.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">atomic exchange to 0; old value was 1 → nobody waiting, done</text>
<text x="40.0" y="312.0" font-size="12.5" fill="#e2b45a" text-anchor="start" font-weight="700">unlock(), slow path</text>
<text x="240.0" y="312.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">old value was 2 → futex_wake(&amp;w, 1)</text>
<text x="40.0" y="352.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Uncontended lock + unlock: two atomic instructions, ~20 ns, no kernel. The "2" state exists so unlock knows</text>
<text x="40.0" y="371.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">whether a syscall is needed; the cost is an occasional unnecessary wake. Real implementations add brief spinning.</text>
</svg>
