<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 479" width="360" height="479" role="img" aria-label="Design system layers from bottom to top: design tokens, primitives, components, patterns and product screens" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="479" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Design system layers</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">built bottom-up</text>
<rect x="16.0" y="86.0" width="328.0" height="58.0" rx="8" fill="#d77fa1" fill-opacity="0.2" stroke="#d77fa1" stroke-width="1.4"/>
<text x="28.0" y="108.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="700">Product screens</text>
<text x="332.0" y="108.0" font-size="10" fill="#d77fa1" text-anchor="end" font-weight="400">owned by feature teams</text>
<text x="28.0" y="128.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">checkout, settings, dashboards</text>
<rect x="16.0" y="152.0" width="328.0" height="58.0" rx="8" fill="#9b8cff" fill-opacity="0.2" stroke="#9b8cff" stroke-width="1.4"/>
<text x="28.0" y="174.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="700">Patterns</text>
<text x="332.0" y="174.0" font-size="10" fill="#9b8cff" text-anchor="end" font-weight="400">documented recipes</text>
<text x="28.0" y="194.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">forms, empty states, data tables</text>
<rect x="16.0" y="218.0" width="328.0" height="58.0" rx="8" fill="#ff5b2e" fill-opacity="0.2" stroke="#ff5b2e" stroke-width="1.4"/>
<text x="28.0" y="240.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="700">Components</text>
<text x="332.0" y="240.0" font-size="10" fill="#ff5b2e" text-anchor="end" font-weight="400">typed APIs, a11y built in</text>
<text x="28.0" y="260.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">Button, Dialog, Select, Tabs</text>
<rect x="16.0" y="284.0" width="328.0" height="58.0" rx="8" fill="#5fb3a1" fill-opacity="0.2" stroke="#5fb3a1" stroke-width="1.4"/>
<text x="28.0" y="306.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="700">Primitives</text>
<text x="332.0" y="306.0" font-size="10" fill="#5fb3a1" text-anchor="end" font-weight="400">layout &amp; typography</text>
<text x="28.0" y="326.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">Box, Stack, Text, Icon</text>
<rect x="16.0" y="350.0" width="328.0" height="58.0" rx="8" fill="#e2b45a" fill-opacity="0.2" stroke="#e2b45a" stroke-width="1.4"/>
<text x="28.0" y="372.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="700">Design tokens</text>
<text x="332.0" y="372.0" font-size="10" fill="#e2b45a" text-anchor="end" font-weight="400">named decisions, not values</text>
<text x="28.0" y="392.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">color, space, radius, type, motion</text>
<text x="16.0" y="430.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">Change a token once; everything</text>
<text x="16.0" y="449.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">above it updates.</text>
</svg>
