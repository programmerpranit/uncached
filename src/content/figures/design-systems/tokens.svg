<text x="56.0" y="336.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="700">Dark theme: remap only the semantic tier</text>
<text x="56.0" y="360.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">color.surface.default → gray-900   ·   color.text.default → gray-50   ·   color.action.primary → blue-300</text>
<text x="40.0" y="420.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Components never reference raw values, so a theme, a brand or a high-contrast mode is a new</text>
<text x="40.0" y="439.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">semantic mapping. The same tokens can be exported to CSS variables, iOS and Android.</text>
