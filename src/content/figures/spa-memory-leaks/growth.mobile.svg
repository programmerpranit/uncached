<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 439" width="360" height="439" role="img" aria-label="Heap size over repeated navigations: a healthy app returns to the same baseline after garbage collection, a leaking one climbs steadily" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="439" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Heap over time</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">healthy vs leaking</text>
<line x1="16.0" y1="300.0" x2="344.0" y2="300.0" stroke="#4a4136" stroke-width="1"/>
<line x1="16.0" y1="300.0" x2="16.0" y2="120.0" stroke="#4a4136" stroke-width="1"/>
<text x="20.0" y="116.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">JS heap (MB)</text>
<text x="344.0" y="318.0" font-size="10.5" fill="#a69d8e" text-anchor="end" font-weight="400">navigations →</text>
<path d="M16,280 L44.7,225.6 L57.0,280.0 L85.7,225.6 L98.0,280.0 L126.7,225.6 L139.0,280.0 L167.7,225.6 L180.0,280.0 L208.7,225.6 L221.0,280.0 L249.7,225.6 L262.0,280.0 L290.7,225.6 L303.0,280.0 L331.7,225.6 L344.0,280.0" fill="none" stroke="#7cc47f" stroke-width="2"/>
<path d="M16,270 L44.7,215.6 L57.0,257.2 L85.7,202.8 L98.0,244.5 L126.7,190.1 L139.0,231.8 L167.7,177.3 L180.0,219.0 L208.7,164.6 L221.0,206.2 L249.7,151.8 L262.0,193.5 L290.7,139.1 L303.0,180.8 L331.7,126.3 L344.0,168.0" fill="none" stroke="#e5534b" stroke-width="2"/>
<rect x="16.0" y="324.0" width="12.0" height="12.0" rx="2" fill="#7cc47f" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="34.0" y="334.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">healthy: GC returns to baseline</text>
<rect x="16.0" y="344.0" width="12.0" height="12.0" rx="2" fill="#e5534b" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="34.0" y="354.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">leaking: baseline creeps up</text>
<text x="16.0" y="390.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Something still references old</text>
<text x="16.0" y="409.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">screens, so GC can't free them.</text>
</svg>
