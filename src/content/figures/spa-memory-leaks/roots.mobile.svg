<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 452" width="360" height="452" role="img" aria-label="A global event listener and an interval timer reference a closure, which keeps an unmounted component, its detached DOM and its data reachable" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="452" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e5534b"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b8cff"/></marker></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Retained by a root</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">reachable = not garbage</text>
<rect x="16.0" y="84.0" width="150.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="91.0" y="108.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">window (root)</text>
<rect x="194.0" y="84.0" width="150.0" height="40.0" rx="3" fill="#e5534b" fill-opacity="0.85" stroke="#e5534b" stroke-width="1"/>
<text x="269.0" y="108.0" font-size="11" fill="#1b1712" text-anchor="middle" font-weight="600">listener / timer</text>
<line x1="168.0" y1="104.0" x2="190.0" y2="104.0" stroke="#e5534b" stroke-width="1.4" marker-end="url(#ah0)"/>
<rect x="16.0" y="150.0" width="328.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="180.0" y="174.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">closure (handler)</text>
<line x1="268.0" y1="126.0" x2="268.0" y2="146.0" stroke="#e5534b" stroke-width="1.4" marker-end="url(#ah0)"/>
<rect x="16.0" y="214.0" width="328.0" height="140.0" rx="8" fill="#9b8cff" fill-opacity="0.08" stroke="#9b8cff" stroke-width="1.2" stroke-dasharray="5 4"/>
<line x1="180.0" y1="192.0" x2="180.0" y2="212.0" stroke="#9b8cff" stroke-width="1.4" marker-end="url(#ah1)"/>
<text x="28.0" y="242.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">old &lt;ProductPage&gt; component</text>
<text x="28.0" y="268.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">detached DOM (3,000 nodes)</text>
<text x="28.0" y="294.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">5 MB of fetched data</text>
<text x="28.0" y="338.0" font-size="10.5" fill="#9b8cff" text-anchor="start" font-weight="400">unmounted, but still reachable</text>
<text x="16.0" y="384.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">GC frees only what is unreachable</text>
<text x="16.0" y="403.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">from roots; one forgotten listener</text>
<text x="16.0" y="422.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">keeps everything it captures.</text>
</svg>
