<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 473" width="360" height="473" role="img" aria-label="Five steps to find a leak: take a baseline snapshot, repeat the action, compare snapshots, follow the retainer path, and remove the reference" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="473" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Finding a leak</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">snapshot, repeat, compare</text>
<rect x="16.0" y="84.0" width="328.0" height="58.0" rx="8" fill="#ff5b2e" fill-opacity="0.08" stroke="#ff5b2e" stroke-width="1.3"/>
<circle cx="38.0" cy="113.0" r="12" fill="#ff5b2e" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="38.0" y="118.0" font-size="11.5" fill="#1b1712" text-anchor="middle" font-weight="700">1</text>
<text x="60.0" y="108.0" font-size="12" fill="#ff5b2e" text-anchor="start" font-weight="700">baseline</text>
<text x="60.0" y="128.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">load, warm up, GC, snapshot</text>
<rect x="16.0" y="150.0" width="328.0" height="58.0" rx="8" fill="#5fb3a1" fill-opacity="0.08" stroke="#5fb3a1" stroke-width="1.3"/>
<circle cx="38.0" cy="179.0" r="12" fill="#5fb3a1" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="38.0" y="184.0" font-size="11.5" fill="#1b1712" text-anchor="middle" font-weight="700">2</text>
<text x="60.0" y="174.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="700">repeat</text>
<text x="60.0" y="194.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">open/close the view 5–10 times</text>
<rect x="16.0" y="216.0" width="328.0" height="58.0" rx="8" fill="#e2b45a" fill-opacity="0.08" stroke="#e2b45a" stroke-width="1.3"/>
<circle cx="38.0" cy="245.0" r="12" fill="#e2b45a" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="38.0" y="250.0" font-size="11.5" fill="#1b1712" text-anchor="middle" font-weight="700">3</text>
<text x="60.0" y="240.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="700">compare</text>
<text x="60.0" y="260.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">GC, snapshot, "Comparison" view</text>
<rect x="16.0" y="282.0" width="328.0" height="58.0" rx="8" fill="#9b8cff" fill-opacity="0.08" stroke="#9b8cff" stroke-width="1.3"/>
<circle cx="38.0" cy="311.0" r="12" fill="#9b8cff" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="38.0" y="316.0" font-size="11.5" fill="#1b1712" text-anchor="middle" font-weight="700">4</text>
<text x="60.0" y="306.0" font-size="12" fill="#9b8cff" text-anchor="start" font-weight="700">retainers</text>
<text x="60.0" y="326.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">read the leaked object's retainers</text>
<rect x="16.0" y="348.0" width="328.0" height="58.0" rx="8" fill="#7cc47f" fill-opacity="0.08" stroke="#7cc47f" stroke-width="1.3"/>
<circle cx="38.0" cy="377.0" r="12" fill="#7cc47f" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="38.0" y="382.0" font-size="11.5" fill="#1b1712" text-anchor="middle" font-weight="700">5</text>
<text x="60.0" y="372.0" font-size="12" fill="#7cc47f" text-anchor="start" font-weight="700">fix</text>
<text x="60.0" y="392.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">remove listener, timer, cache entry</text>
<text x="16.0" y="424.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Counts that grow with each repeat</text>
<text x="16.0" y="443.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">point straight at the leak.</text>
</svg>
