<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 453" width="880" height="453" role="img" aria-label="A global event listener and an interval timer reference a closure, which keeps an unmounted component, its detached DOM and its data reachable" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="453" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e5534b"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b8cff"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Why the garbage collector can't free it</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">a forgotten reference from a root keeps a whole subtree alive</text>
<rect x="40.0" y="110.0" width="150.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="115.0" y="138.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">window (GC root)</text>
<rect x="40.0" y="200.0" width="150.0" height="48.0" rx="3" fill="#e5534b" fill-opacity="0.85" stroke="#e5534b" stroke-width="1"/>
<text x="115.0" y="228.1" font-size="11.5" fill="#1b1712" text-anchor="middle" font-weight="600">event listener</text>
<rect x="40.0" y="290.0" width="150.0" height="48.0" rx="3" fill="#e5534b" fill-opacity="0.85" stroke="#e5534b" stroke-width="1"/>
<text x="115.0" y="318.1" font-size="11.5" fill="#1b1712" text-anchor="middle" font-weight="600">setInterval</text>
<line x1="115.0" y1="160.0" x2="115.0" y2="196.0" stroke="#a69d8e" stroke-width="1.3" marker-end="url(#ah0)"/>
<path d="M190,134 C220,134 220,314 196,314" fill="none" stroke="#a69d8e" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="300.0" y="200.0" width="170.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="385.0" y="228.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">closure (handler)</text>
<line x1="192.0" y1="224.0" x2="296.0" y2="224.0" stroke="#e5534b" stroke-width="1.5" marker-end="url(#ah1)"/>
<line x1="192.0" y1="314.0" x2="296.0" y2="236.0" stroke="#e5534b" stroke-width="1.5" marker-end="url(#ah1)"/>
<rect x="560.0" y="140.0" width="250.0" height="48.0" rx="3" fill="#9b8cff" fill-opacity="0.15" stroke="#9b8cff" stroke-width="1"/>
<text x="685.0" y="168.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">old &lt;ProductPage&gt; component</text>
<rect x="560.0" y="210.0" width="250.0" height="48.0" rx="3" fill="#9b8cff" fill-opacity="0.15" stroke="#9b8cff" stroke-width="1"/>
<text x="685.0" y="238.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">detached DOM subtree (3,000 nodes)</text>
<rect x="560.0" y="280.0" width="250.0" height="48.0" rx="3" fill="#9b8cff" fill-opacity="0.15" stroke="#9b8cff" stroke-width="1"/>
<text x="685.0" y="308.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">5 MB of fetched data</text>
<line x1="472.0" y1="224.0" x2="556.0" y2="164.0" stroke="#9b8cff" stroke-width="1.3" marker-end="url(#ah2)"/>
<line x1="472.0" y1="224.0" x2="556.0" y2="234.0" stroke="#9b8cff" stroke-width="1.3" marker-end="url(#ah2)"/>
<line x1="472.0" y1="224.0" x2="556.0" y2="304.0" stroke="#9b8cff" stroke-width="1.3" marker-end="url(#ah2)"/>
<rect x="548.0" y="124.0" width="276.0" height="218.0" rx="8" fill="none" fill-opacity="1" stroke="#9b8cff" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="686.0" y="362.0" font-size="11" fill="#9b8cff" text-anchor="middle" font-weight="400">unmounted, but still reachable</text>
<text x="40.0" y="404.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Garbage collectors free only what is unreachable from roots such as window, the active stack and live timers.</text>
<text x="40.0" y="423.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">A single listener or timer that was never removed keeps its closure, and everything the closure references, alive.</text>
</svg>
