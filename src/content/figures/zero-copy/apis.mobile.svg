<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" width="360" height="380" role="img" aria-label="Linux zero-copy APIs: sendfile, splice, copy_file_range, MSG_ZEROCOPY and mmap" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="380" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Zero-copy APIs</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">what moves where</text>
<text x="16.0" y="86.0" font-size="12.5" fill="#5fb3a1" text-anchor="start" font-weight="700">sendfile</text>
<text x="16.0" y="103.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">static files, Kafka consumers</text>
<text x="16.0" y="130.0" font-size="12.5" fill="#e2b45a" text-anchor="start" font-weight="700">splice</text>
<text x="16.0" y="147.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">proxies: socket → pipe → socket</text>
<text x="16.0" y="174.0" font-size="12.5" fill="#7cc47f" text-anchor="start" font-weight="700">copy_file_range</text>
<text x="16.0" y="191.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">cp, file copies, backups</text>
<text x="16.0" y="218.0" font-size="12.5" fill="#9b8cff" text-anchor="start" font-weight="700">MSG_ZEROCOPY / io_uring send_zc</text>
<text x="16.0" y="235.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">large sends from app memory</text>
<text x="16.0" y="262.0" font-size="12.5" fill="#ede6d8" text-anchor="start" font-weight="700">mmap + write</text>
<text x="16.0" y="279.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">simple, but faults + TLB cost</text>
<text x="16.0" y="312.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">kTLS encrypts in the kernel or</text>
<text x="16.0" y="331.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">NIC, so sendfile works over</text>
<text x="16.0" y="350.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">HTTPS.</text>
</svg>
