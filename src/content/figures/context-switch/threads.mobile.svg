<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 433" width="360" height="433" role="img" aria-label="Illustrative throughput curve rising to the core count then falling as threads increase" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="433" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Too many threads</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">8 cores, CPU-bound (illustrative)</text>
<line x1="46.0" y1="280.0" x2="336.0" y2="280.0" stroke="#4a4136" stroke-width="1.3"/>
<line x1="46.0" y1="280.0" x2="46.0" y2="100.0" stroke="#4a4136" stroke-width="1.3"/>
<path d="M46.0 258.4 L75.0 236.8 L104.0 195.4 L133.0 118.0 L162.0 121.6 L220.0 136.0 L278.0 161.2 L336.0 199.0" fill="none" stroke="#ff5b2e" stroke-width="2.2"/>
<circle cx="46.0" cy="258.4" r="3.5" fill="#ff5b2e" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="46.0" y="298.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">1</text>
<circle cx="75.0" cy="236.8" r="3.5" fill="#ff5b2e" fill-opacity="1" stroke="none" stroke-width="1"/>
<circle cx="104.0" cy="195.4" r="3.5" fill="#ff5b2e" fill-opacity="1" stroke="none" stroke-width="1"/>
<circle cx="133.0" cy="118.0" r="3.5" fill="#ff5b2e" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="133.0" y="298.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">8</text>
<circle cx="162.0" cy="121.6" r="3.5" fill="#ff5b2e" fill-opacity="1" stroke="none" stroke-width="1"/>
<circle cx="220.0" cy="136.0" r="3.5" fill="#ff5b2e" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="220.0" y="298.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">64</text>
<circle cx="278.0" cy="161.2" r="3.5" fill="#ff5b2e" fill-opacity="1" stroke="none" stroke-width="1"/>
<circle cx="336.0" cy="199.0" r="3.5" fill="#ff5b2e" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="336.0" y="298.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">1024</text>
<text x="191.0" y="318.0" font-size="11.5" fill="#a69d8e" text-anchor="middle" font-weight="400">threads</text>
<text x="38.0" y="104.0" font-size="10.5" fill="#a69d8e" text-anchor="end" font-weight="400">100%</text>
<text x="38.0" y="194.0" font-size="10.5" fill="#a69d8e" text-anchor="end" font-weight="400">50%</text>
<line x1="133.0" y1="280.0" x2="133.0" y2="100.0" stroke="#5fb3a1" stroke-width="1" stroke-dasharray="4 3"/>
<text x="139.0" y="108.0" font-size="11" fill="#5fb3a1" text-anchor="start" font-weight="400">threads = cores</text>
<text x="16.0" y="346.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Past one thread per core, threads</text>
<text x="16.0" y="365.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">just take turns: switches, cache</text>
<text x="16.0" y="384.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">eviction and lock contention eat</text>
<text x="16.0" y="403.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">throughput.</text>
</svg>
