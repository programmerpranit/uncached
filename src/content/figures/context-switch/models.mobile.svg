<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 407" width="360" height="407" role="img" aria-label="Techniques to avoid kernel context switches: event loops, user-space threads, thread-per-core, batching, busy polling" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="407" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Avoiding switches</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">fewer or cheaper switches</text>
<text x="16.0" y="84.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="700">event loop (epoll / io_uring)</text>
<text x="16.0" y="101.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">one thread per core, many sockets</text>
<text x="16.0" y="130.0" font-size="12" fill="#9b8cff" text-anchor="start" font-weight="700">user-space threads</text>
<text x="16.0" y="147.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">~100 ns switches in the runtime</text>
<text x="16.0" y="176.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="700">thread-per-core</text>
<text x="16.0" y="193.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">pinned, no sharing or migration</text>
<text x="16.0" y="222.0" font-size="12" fill="#7cc47f" text-anchor="start" font-weight="700">batching</text>
<text x="16.0" y="239.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">fewer syscalls per unit of work</text>
<text x="16.0" y="268.0" font-size="12" fill="#d77fa1" text-anchor="start" font-weight="700">busy polling</text>
<text x="16.0" y="285.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">spin when the wait is very short</text>
<text x="16.0" y="320.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Event loops, user-space threads,</text>
<text x="16.0" y="339.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">pinned threads, batching and</text>
<text x="16.0" y="358.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">polling all cut the number or</text>
<text x="16.0" y="377.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">cost of kernel switches.</text>
</svg>
