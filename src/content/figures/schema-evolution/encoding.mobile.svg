<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">tags vs schema resolution</text>
<rect x="16.0" y="80.0" width="328.0" height="140.0" rx="3" fill="#5fb3a1" fill-opacity="0.07" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="153.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="28.0" y="102.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="700">Protobuf</text>
<rect x="28.0" y="116.0" width="96.0" height="30.0" rx="3" fill="#5fb3a1" fill-opacity="0.18" stroke="#5fb3a1" stroke-width="1"/>
<text x="76.0" y="134.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">1:"Ada"</text>
<rect x="132.0" y="116.0" width="96.0" height="30.0" rx="3" fill="#5fb3a1" fill-opacity="0.18" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="134.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">2:36</text>
<rect x="236.0" y="116.0" width="96.0" height="30.0" rx="3" fill="#e2b45a" fill-opacity="0.18" stroke="#e2b45a" stroke-width="1"/>
<text x="284.0" y="134.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">3:"a@x"</text>
<text x="28.0" y="170.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">field numbers on the wire;</text>
<text x="28.0" y="189.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">unknown tags skipped</text>
<rect x="16.0" y="236.0" width="328.0" height="150.0" rx="3" fill="#9b8cff" fill-opacity="0.07" stroke="#9b8cff" stroke-width="1"/>
<text x="180.0" y="314.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="28.0" y="258.0" font-size="12" fill="#9b8cff" text-anchor="start" font-weight="700">Avro</text>
<rect x="28.0" y="272.0" width="78.0" height="30.0" rx="3" fill="#9b8cff" fill-opacity="0.18" stroke="#9b8cff" stroke-width="1"/>
<text x="67.0" y="290.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">"Ada"</text>
<rect x="114.0" y="272.0" width="78.0" height="30.0" rx="3" fill="#9b8cff" fill-opacity="0.18" stroke="#9b8cff" stroke-width="1"/>
<text x="153.0" y="290.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">36</text>
<text x="28.0" y="326.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">no tags: decode with writer</text>
