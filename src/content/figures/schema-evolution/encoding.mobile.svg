<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 410" width="360" height="410" role="img" aria-label="Protobuf encodes each value with its field number so unknown fields can be skipped; Avro encodes bare values in schema order and resolves the writer schema against the reader schema by field name" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="410" fill="#1b1712"/>
<defs></defs>
