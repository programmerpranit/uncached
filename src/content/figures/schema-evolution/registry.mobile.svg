<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 381" width="360" height="381" role="img" aria-label="A producer registers a new schema version; the registry runs a compatibility check and returns an ID or rejects it; each message carries a magic byte and the schema ID; consumers fetch and cache the writer schema by ID" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="381" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Schema registry</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">compat checked at publish time</text>
<rect x="16.0" y="80.0" width="328.0" height="40.0" rx="3" fill="#5fb3a1" fill-opacity="0.15" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="104.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Producer registers User v3</text>
