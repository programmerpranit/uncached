<text x="180.0" y="159.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Registry: compat check</text>
<text x="180.0" y="175.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">→ id 42, or reject</text>
<line x1="180.0" y1="186.0" x2="180.0" y2="202.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="16.0" y="204.0" width="50.0" height="38.0" rx="3" fill="#a69d8e" fill-opacity="0.15" stroke="#a69d8e" stroke-width="1"/>
<text x="41.0" y="226.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">0x0</text>
