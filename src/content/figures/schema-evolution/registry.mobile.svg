<text x="109.0" y="226.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">id 42</text>
<rect x="152.0" y="204.0" width="192.0" height="38.0" rx="3" fill="#5fb3a1" fill-opacity="0.15" stroke="#5fb3a1" stroke-width="1"/>
<text x="248.0" y="226.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">payload</text>
<line x1="180.0" y1="242.0" x2="180.0" y2="258.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="16.0" y="260.0" width="328.0" height="40.0" rx="3" fill="#ff5b2e" fill-opacity="0.15" stroke="#ff5b2e" stroke-width="1"/>
<text x="180.0" y="284.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Consumer fetches #42, resolves</text>
<text x="16.0" y="332.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">Bad changes fail at publish</text>
<text x="16.0" y="351.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">time, not in a consumer.</text>
