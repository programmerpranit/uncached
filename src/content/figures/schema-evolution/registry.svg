<line x1="670.0" y1="128.0" x2="527.0" y2="128.0" stroke="#ff5b2e" stroke-width="1.3" stroke-dasharray="4,3"/>
<text x="600.0" y="175.0" font-size="9.5" fill="#a69d8e" text-anchor="middle" font-weight="400">4. fetch #42 (cached)</text>
<text x="40.0" y="300.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">Step 2 runs the compatibility check (BACKWARD, FORWARD, FULL…) against earlier versions.</text>
<text x="40.0" y="319.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">An incompatible schema fails in CI or at producer startup, not in a consumer at 3 a.m.</text>
