<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 349" width="880" height="349" role="img" aria-label="A producer registers a new schema version; the registry runs a compatibility check and returns an ID or rejects it; each message carries a magic byte and the schema ID; consumers fetch and cache the writer schema by ID" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="349" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b8cff"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Schema registry</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">compatibility is enforced before a bad message can exist</text>
<rect x="40.0" y="90.0" width="170.0" height="54.0" rx="3" fill="#5fb3a1" fill-opacity="0.15" stroke="#5fb3a1" stroke-width="1"/>
<text x="125.0" y="114.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Producer</text>
<text x="125.0" y="130.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">User v3</text>
<rect x="355.0" y="90.0" width="170.0" height="54.0" rx="3" fill="#9b8cff" fill-opacity="0.15" stroke="#9b8cff" stroke-width="1"/>
<text x="440.0" y="114.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Schema registry</text>
<text x="440.0" y="130.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">subject: users-value</text>
<rect x="670.0" y="90.0" width="170.0" height="54.0" rx="3" fill="#ff5b2e" fill-opacity="0.15" stroke="#ff5b2e" stroke-width="1"/>
