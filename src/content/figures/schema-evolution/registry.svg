<text x="755.0" y="130.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">reader schema v2</text>
<line x1="210.0" y1="108.0" x2="353.0" y2="108.0" stroke="#5fb3a1" stroke-width="1.3" marker-end="url(#ah0)"/>
<text x="282.0" y="100.0" font-size="9.5" fill="#a69d8e" text-anchor="middle" font-weight="400">1. register</text>
<line x1="353.0" y1="128.0" x2="212.0" y2="128.0" stroke="#9b8cff" stroke-width="1.3" marker-end="url(#ah1)"/>
<text x="282.0" y="142.0" font-size="9.5" fill="#a69d8e" text-anchor="middle" font-weight="400">2. id = 42 / reject</text>
<rect x="170.0" y="210.0" width="540.0" height="44.0" rx="3" fill="#a69d8e" fill-opacity="0.08" stroke="#a69d8e" stroke-width="1"/>
<text x="440.0" y="235.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
