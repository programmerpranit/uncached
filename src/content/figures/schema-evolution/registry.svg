<text x="210.0" y="235.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">0x0</text>
<rect x="250.0" y="210.0" width="110.0" height="44.0" rx="3" fill="#9b8cff" fill-opacity="0.15" stroke="#9b8cff" stroke-width="1"/>
<text x="305.0" y="235.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">schema id 42</text>
<rect x="360.0" y="210.0" width="350.0" height="44.0" rx="3" fill="#5fb3a1" fill-opacity="0.15" stroke="#5fb3a1" stroke-width="1"/>
<text x="535.0" y="235.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">binary payload</text>
