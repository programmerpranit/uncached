<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 399" width="360" height="399" role="img" aria-label="Backward compatibility means a new reader can read data from an old writer; forward compatibility means an old reader can read data from a new writer; full compatibility means both" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="399" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Who can read whom?</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">writer version × reader version</text>
<rect x="16.0" y="84.0" width="328.0" height="70.0" rx="3" fill="#5fb3a1" fill-opacity="0.12" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="122.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="28.0" y="106.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="700">BACKWARD</text>
<text x="28.0" y="126.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">new reader reads old data</text>
<text x="28.0" y="144.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">→ upgrade consumers first</text>
<rect x="16.0" y="168.0" width="328.0" height="70.0" rx="3" fill="#9b8cff" fill-opacity="0.12" stroke="#9b8cff" stroke-width="1"/>
<text x="180.0" y="206.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="28.0" y="190.0" font-size="12" fill="#9b8cff" text-anchor="start" font-weight="700">FORWARD</text>
<text x="28.0" y="210.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">old reader reads new data</text>
<text x="28.0" y="228.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">→ upgrade producers first</text>
<rect x="16.0" y="252.0" width="328.0" height="70.0" rx="3" fill="#ff5b2e" fill-opacity="0.12" stroke="#ff5b2e" stroke-width="1"/>
<text x="180.0" y="290.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="28.0" y="274.0" font-size="12" fill="#ff5b2e" text-anchor="start" font-weight="700">FULL</text>
<text x="28.0" y="294.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">both directions</text>
<text x="28.0" y="312.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">→ deploy in any order</text>
<text x="16.0" y="350.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">"Transitive" variants check</text>
<text x="16.0" y="369.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">against every older version.</text>
</svg>
