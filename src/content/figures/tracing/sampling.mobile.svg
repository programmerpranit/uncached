<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 392" width="360" height="392" role="img" aria-label="Head-based sampling decides at the root and propagates the flag, which is cheap but drops most errors; tail-based sampling buffers complete traces in a collector and keeps errors, slow traces and a small percentage of the rest" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="392" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Head vs tail sampling</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">decide early or late</text>
<rect x="16.0" y="88.0" width="328.0" height="130.0" rx="8" fill="#ff5b2e" fill-opacity="0.07" stroke="#ff5b2e" stroke-width="1.2"/>
<text x="28.0" y="112.0" font-size="13" fill="#ff5b2e" text-anchor="start" font-weight="700">Head-based</text>
<text x="28.0" y="142.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">root decides: keep 5%</text>
<text x="28.0" y="166.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">flag propagates downstream</text>
<text x="28.0" y="190.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">✓ cheap   ✗ misses errors</text>
<rect x="16.0" y="238.0" width="328.0" height="130.0" rx="8" fill="#e2b45a" fill-opacity="0.07" stroke="#e2b45a" stroke-width="1.2"/>
<text x="28.0" y="262.0" font-size="13" fill="#e2b45a" text-anchor="start" font-weight="700">Tail-based</text>
<text x="28.0" y="292.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">buffer whole trace first</text>
<text x="28.0" y="316.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">keep errors + slow + 1%</text>
<text x="28.0" y="340.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">✓ smart   ✗ costly collector</text>
</svg>
