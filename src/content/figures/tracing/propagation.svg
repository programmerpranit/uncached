<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 445" width="880" height="445" role="img" aria-label="W3C traceparent header carrying version, trace ID, parent span ID and sampled flag from the gateway to orders over HTTP and to a shipping worker via a Kafka record header, with an in-process context object inside each service" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="445" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ede6d8"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Context propagation</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">the trace context rides along in headers, in-process context and message metadata</text>
<rect x="40.0" y="110.0" width="150.0" height="60.0" rx="3" fill="#ff5b2e" fill-opacity="0.15" stroke="#ff5b2e" stroke-width="1"/>
<text x="115.0" y="137.0" font-size="13" fill="#ede6d8" text-anchor="middle" font-weight="600">gateway</text>
<text x="115.0" y="153.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">span A</text>
<rect x="360.0" y="110.0" width="150.0" height="60.0" rx="3" fill="#5fb3a1" fill-opacity="0.15" stroke="#5fb3a1" stroke-width="1"/>
<text x="435.0" y="137.0" font-size="13" fill="#ede6d8" text-anchor="middle" font-weight="600">orders</text>
<text x="435.0" y="153.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">span B (parent A)</text>
<rect x="680.0" y="110.0" width="160.0" height="60.0" rx="3" fill="#9b8cff" fill-opacity="0.15" stroke="#9b8cff" stroke-width="1"/>
<text x="760.0" y="137.0" font-size="13" fill="#ede6d8" text-anchor="middle" font-weight="600">shipping worker</text>
<text x="760.0" y="153.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">span D (link to C)</text>
<line x1="190.0" y1="140.0" x2="360.0" y2="140.0" stroke="#ede6d8" stroke-width="1.3" marker-end="url(#ah0)"/>
<text x="275.0" y="130.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">HTTP header</text>
<line x1="510.0" y1="140.0" x2="680.0" y2="140.0" stroke="#ede6d8" stroke-width="1.3" marker-end="url(#ah0)"/>
<text x="595.0" y="130.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">Kafka record header</text>
<rect x="40.0" y="200.0" width="800.0" height="74.0" rx="8" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="56.0" y="224.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="700">traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01</text>
<text x="100.0" y="252.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">version</text>
<text x="200.0" y="252.0" font-size="10" fill="#ff5b2e" text-anchor="start" font-weight="400">trace-id (16 bytes)</text>
<text x="394.0" y="252.0" font-size="10" fill="#5fb3a1" text-anchor="start" font-weight="400">parent span-id (8 bytes)</text>
<text x="580.0" y="252.0" font-size="10" fill="#e2b45a" text-anchor="start" font-weight="400">flags: sampled</text>
<rect x="360.0" y="300.0" width="480.0" height="58.0" rx="8" fill="#5fb3a1" fill-opacity="0.08" stroke="#5fb3a1" stroke-width="1"/>
<text x="376.0" y="322.0" font-size="11" fill="#5fb3a1" text-anchor="start" font-weight="700">Inside orders: context object follows the request</text>
<text x="376.0" y="344.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">thread-local / AsyncLocalStorage / contextvars / context.Context</text>
<text x="40.0" y="396.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Each hop extracts the incoming context, starts a child span, and injects the new span ID into outgoing calls.</text>
<text x="40.0" y="415.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">One service that forgets to forward the header breaks the trace into disconnected pieces.</text>
</svg>
