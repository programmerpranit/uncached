<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" width="360" height="320" role="img" aria-label="Dirty page thresholds for background writeback and writer throttling, and fsync" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="320" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Write-back caching</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">write() returns before disk</text>
<rect x="16.0" y="92.0" width="328.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<rect x="16.0" y="92.0" width="46.0" height="30.0" rx="3" fill="#e2b45a" fill-opacity="0.7" stroke="#e2b45a" stroke-width="1"/>
<line x1="49.0" y1="84.0" x2="49.0" y2="130.0" stroke="#5fb3a1" stroke-width="1.4" stroke-dasharray="4 3"/>
<line x1="82.0" y1="84.0" x2="82.0" y2="140.0" stroke="#e5534b" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="16.0" y="156.0" font-size="11.5" fill="#5fb3a1" text-anchor="start" font-weight="400">10%: background flush</text>
<text x="16.0" y="176.0" font-size="11.5" fill="#e5534b" text-anchor="start" font-weight="400">20%: writers throttled</text>
<text x="16.0" y="214.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Dirty pages wait up to ~30 s,</text>
<text x="16.0" y="233.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">absorbing rewrites. fsync()</text>
<text x="16.0" y="252.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">forces a file to stable storage.</text>
<text x="16.0" y="271.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Power loss before writeback</text>
<text x="16.0" y="290.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">loses data only in RAM.</text>
</svg>
