<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 368" width="880" height="368" role="img" aria-label="read copies data from the page cache into a buffer while mmap maps page cache pages directly" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="368" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b8cff"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ede6d8"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Two ways to read a file, one cache underneath</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">read() copies from the page cache; mmap maps page-cache pages into your address space</text>
<rect x="40.0" y="96.0" width="180.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="130.0" y="122.3" font-size="12" fill="#5fb3a1" text-anchor="middle" font-weight="600">read(fd, buf, n)</text>
<rect x="40.0" y="200.0" width="180.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="130.0" y="219.0" font-size="12" fill="#9b8cff" text-anchor="middle" font-weight="600">p = mmap(file)</text>
<text x="130.0" y="235.0" font-size="11" fill="#9b8cff" text-anchor="middle" font-weight="400">then *p</text>
<rect x="340.0" y="90.0" width="240.0" height="170.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="460.0" y="112.0" font-size="12" fill="#e2b45a" text-anchor="middle" font-weight="600">page cache (kernel RAM)</text>
<rect x="360.0" y="128.0" width="46.0" height="28.0" rx="3" fill="#e2b45a" fill-opacity="0.6" stroke="#e2b45a" stroke-width="1"/>
<rect x="414.0" y="128.0" width="46.0" height="28.0" rx="3" fill="#e2b45a" fill-opacity="0.25" stroke="#e2b45a" stroke-width="1"/>
<rect x="468.0" y="128.0" width="46.0" height="28.0" rx="3" fill="#e2b45a" fill-opacity="0.25" stroke="#e2b45a" stroke-width="1"/>
<rect x="522.0" y="128.0" width="46.0" height="28.0" rx="3" fill="#e2b45a" fill-opacity="0.6" stroke="#e2b45a" stroke-width="1"/>
<rect x="360.0" y="166.0" width="46.0" height="28.0" rx="3" fill="#e2b45a" fill-opacity="0.25" stroke="#e2b45a" stroke-width="1"/>
<rect x="414.0" y="166.0" width="46.0" height="28.0" rx="3" fill="#e2b45a" fill-opacity="0.25" stroke="#e2b45a" stroke-width="1"/>
<rect x="468.0" y="166.0" width="46.0" height="28.0" rx="3" fill="#e2b45a" fill-opacity="0.6" stroke="#e2b45a" stroke-width="1"/>
<rect x="522.0" y="166.0" width="46.0" height="28.0" rx="3" fill="#e2b45a" fill-opacity="0.25" stroke="#e2b45a" stroke-width="1"/>
<rect x="360.0" y="204.0" width="46.0" height="28.0" rx="3" fill="#e2b45a" fill-opacity="0.25" stroke="#e2b45a" stroke-width="1"/>
<rect x="414.0" y="204.0" width="46.0" height="28.0" rx="3" fill="#e2b45a" fill-opacity="0.6" stroke="#e2b45a" stroke-width="1"/>
<rect x="468.0" y="204.0" width="46.0" height="28.0" rx="3" fill="#e2b45a" fill-opacity="0.25" stroke="#e2b45a" stroke-width="1"/>
<rect x="522.0" y="204.0" width="46.0" height="28.0" rx="3" fill="#e2b45a" fill-opacity="0.25" stroke="#e2b45a" stroke-width="1"/>
<rect x="680.0" y="150.0" width="160.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="760.0" y="172.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">disk / SSD</text>
<text x="760.0" y="188.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">~100 µs per miss (NVMe)</text>
<line x1="220.0" y1="118.0" x2="338.0" y2="140.0" stroke="#5fb3a1" stroke-width="1.4" marker-end="url(#ah0)"/>
<text x="276.0" y="112.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="400">copy to buf</text>
<line x1="220.0" y1="222.0" x2="338.0" y2="215.0" stroke="#9b8cff" stroke-width="1.4" marker-end="url(#ah1)" stroke-dasharray="5 3"/>
<text x="276.0" y="262.0" font-size="11" fill="#9b8cff" text-anchor="middle" font-weight="400">map pages, no copy</text>
<line x1="678.0" y1="175.0" x2="582.0" y2="175.0" stroke="#ede6d8" stroke-width="1.3" marker-end="url(#ah2)"/>
<text x="630.0" y="166.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">miss</text>
<text x="40.0" y="300.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Either way, the first access to a block reads it from storage into the page cache; later accesses by any process</text>
<text x="40.0" y="319.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">hit RAM. read() copies the bytes into your buffer (one syscall per call); mmap gives you the cached pages directly,</text>
<text x="40.0" y="338.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">so access is a plain load, but every first touch of a page is a page fault and the kernel decides what stays mapped.</text>
</svg>
