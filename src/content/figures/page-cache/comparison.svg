<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 422" width="880" height="422" role="img" aria-label="Comparison of read and write versus mmap for copies, costs, access patterns, errors and control" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="422" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">read() or mmap? It depends on the access pattern</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">both use the page cache; they differ in copies, faults and control</text>
<text x="260.0" y="96.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="700">read() / write()</text>
<text x="580.0" y="96.0" font-size="12" fill="#9b8cff" text-anchor="start" font-weight="700">mmap</text>
<rect x="40.0" y="108.0" width="800.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="56.0" y="128.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">copies</text>
<text x="260.0" y="128.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">one copy per read into your buffer</text>
<text x="580.0" y="128.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">none: pages mapped directly</text>
<rect x="40.0" y="144.0" width="800.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="56.0" y="164.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">per-access cost</text>
<text x="260.0" y="164.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">syscall per call, amortized by size</text>
<text x="580.0" y="164.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">plain load; page fault on first touch</text>
<rect x="40.0" y="180.0" width="800.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="56.0" y="200.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">random small reads</text>
<text x="260.0" y="200.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">syscall overhead each</text>
<text x="580.0" y="200.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">very cheap once mapped</text>
<rect x="40.0" y="216.0" width="800.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="56.0" y="236.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">large sequential scan</text>
<text x="260.0" y="236.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">fast with big buffers + readahead</text>
<text x="580.0" y="236.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">fine; faults + TLB cost add up</text>
<rect x="40.0" y="252.0" width="800.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="56.0" y="272.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">error handling</text>
<text x="260.0" y="272.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">errors returned as -1 / errno</text>
<text x="580.0" y="272.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">I/O error → SIGBUS in your code</text>
<rect x="40.0" y="288.0" width="800.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="56.0" y="308.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">control</text>
<text x="260.0" y="308.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">you choose what to keep</text>
<text x="580.0" y="308.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">kernel decides eviction and timing</text>
<text x="40.0" y="354.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">mmap shines for read-mostly data accessed randomly and shared between processes (libraries, indexes, LMDB).</text>
<text x="40.0" y="373.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Databases that need control over eviction and I/O scheduling use read/write with their own buffer pool, and</text>
<text x="40.0" y="392.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">some (InnoDB, Oracle) use O_DIRECT to bypass the page cache entirely.</text>
</svg>
