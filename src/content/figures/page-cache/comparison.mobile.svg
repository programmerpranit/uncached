<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" role="img" aria-label="Comparison of read and write versus mmap for copies, costs, access patterns, errors and control" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="470" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">read() or mmap?</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">copies vs faults vs control</text>
<text x="16.0" y="86.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="700">copies</text>
<text x="16.0" y="103.0" font-size="11" fill="#5fb3a1" text-anchor="start" font-weight="400">read: one per read</text>
<text x="16.0" y="119.0" font-size="11" fill="#9b8cff" text-anchor="start" font-weight="400">mmap: none</text>
<text x="16.0" y="136.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="700">per access</text>
<text x="16.0" y="153.0" font-size="11" fill="#5fb3a1" text-anchor="start" font-weight="400">read: syscall per call</text>
<text x="16.0" y="169.0" font-size="11" fill="#9b8cff" text-anchor="start" font-weight="400">mmap: load; fault on 1st touch</text>
<text x="16.0" y="186.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="700">random small reads</text>
<text x="16.0" y="203.0" font-size="11" fill="#5fb3a1" text-anchor="start" font-weight="400">read: syscall each</text>
<text x="16.0" y="219.0" font-size="11" fill="#9b8cff" text-anchor="start" font-weight="400">mmap: very cheap</text>
<text x="16.0" y="236.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="700">big sequential scan</text>
<text x="16.0" y="253.0" font-size="11" fill="#5fb3a1" text-anchor="start" font-weight="400">read: fast, big buffers</text>
<text x="16.0" y="269.0" font-size="11" fill="#9b8cff" text-anchor="start" font-weight="400">mmap: ok; faults add up</text>
<text x="16.0" y="286.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="700">I/O errors</text>
<text x="16.0" y="303.0" font-size="11" fill="#5fb3a1" text-anchor="start" font-weight="400">read: -1 / errno</text>
<text x="16.0" y="319.0" font-size="11" fill="#9b8cff" text-anchor="start" font-weight="400">mmap: SIGBUS</text>
<text x="16.0" y="336.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="700">who controls caching</text>
<text x="16.0" y="353.0" font-size="11" fill="#5fb3a1" text-anchor="start" font-weight="400">read: you</text>
<text x="16.0" y="369.0" font-size="11" fill="#9b8cff" text-anchor="start" font-weight="400">mmap: the kernel</text>
<text x="16.0" y="402.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">mmap: random, read-mostly, shared.</text>
<text x="16.0" y="421.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">read/write + buffer pool: when you</text>
<text x="16.0" y="440.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">need control (most databases).</text>
</svg>
