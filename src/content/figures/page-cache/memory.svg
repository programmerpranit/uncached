<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 318" width="880" height="318" role="img" aria-label="Memory on a 64 GiB server split into process memory, page cache and free memory" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="318" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">"Free" memory is mostly cache, and that's good</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">a 64 GiB server, as reported by free -g</text>
<rect x="40.0" y="110.0" width="225.0" height="40.0" rx="3" fill="#ff5b2e" fill-opacity="0.75" stroke="#ff5b2e" stroke-width="1"/>
<text x="152.5" y="135.0" font-size="12" fill="#1b1712" text-anchor="middle" font-weight="700">18 GiB</text>
<rect x="265.0" y="110.0" width="525.0" height="40.0" rx="3" fill="#e2b45a" fill-opacity="0.75" stroke="#e2b45a" stroke-width="1"/>
<text x="527.5" y="135.0" font-size="12" fill="#1b1712" text-anchor="middle" font-weight="700">42 GiB</text>
<rect x="790.0" y="110.0" width="50.0" height="40.0" rx="3" fill="#7cc47f" fill-opacity="0.75" stroke="#7cc47f" stroke-width="1"/>
<text x="815.0" y="135.0" font-size="12" fill="#1b1712" text-anchor="middle" font-weight="700">4 GiB</text>
<rect x="40.0" y="170.0" width="12.0" height="12.0" rx="2" fill="#ff5b2e" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="58.0" y="180.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">used by processes</text>
<rect x="195.9" y="170.0" width="12.0" height="12.0" rx="2" fill="#e2b45a" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="213.9" y="180.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">page cache (buff/cache)</text>
<rect x="392.8" y="170.0" width="12.0" height="12.0" rx="2" fill="#7cc47f" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="410.8" y="180.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">truly free</text>
<text x="40.0" y="216.0" font-size="12.5" fill="#7cc47f" text-anchor="start" font-weight="600">available ≈ free + reclaimable cache ≈ 44 GiB</text>
<text x="40.0" y="250.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Linux uses idle RAM to cache file data, because empty RAM is wasted. Clean cached pages can be dropped instantly</text>
<text x="40.0" y="269.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">when a process needs memory, so the "available" column, not "free", is what matters. Reclaim keeps active and</text>
<text x="40.0" y="288.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">inactive lists (approximating LRU), so a one-off scan of a big file doesn't evict pages that are used often.</text>
</svg>
