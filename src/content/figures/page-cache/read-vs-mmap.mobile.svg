<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 427" width="360" height="427" role="img" aria-label="read copies data from the page cache into a buffer while mmap maps page cache pages directly" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="427" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b8cff"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ede6d8"/></marker></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">read() vs mmap</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">both go through the page cache</text>
<rect x="16.0" y="86.0" width="150.0" height="36.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="91.0" y="101.0" font-size="12" fill="#5fb3a1" text-anchor="middle" font-weight="600">read()</text>
<text x="91.0" y="117.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="400">copies</text>
<rect x="194.0" y="86.0" width="150.0" height="36.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="269.0" y="101.0" font-size="12" fill="#9b8cff" text-anchor="middle" font-weight="600">mmap + *p</text>
<text x="269.0" y="117.0" font-size="11" fill="#9b8cff" text-anchor="middle" font-weight="400">maps, no copy</text>
<rect x="16.0" y="160.0" width="328.0" height="70.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="184.0" font-size="12" fill="#e2b45a" text-anchor="middle" font-weight="600">page cache (kernel RAM)</text>
<text x="180.0" y="204.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">shared by all processes</text>
<line x1="91.0" y1="122.0" x2="91.0" y2="158.0" stroke="#5fb3a1" stroke-width="1.3" marker-end="url(#ah0)"/>
<line x1="269.0" y1="122.0" x2="269.0" y2="158.0" stroke="#9b8cff" stroke-width="1.3" marker-end="url(#ah1)" stroke-dasharray="5 3"/>
<rect x="100.0" y="264.0" width="160.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="180.0" y="288.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">disk / SSD</text>
<line x1="180.0" y1="262.0" x2="180.0" y2="232.0" stroke="#ede6d8" stroke-width="1.3" marker-end="url(#ah2)"/>
<text x="190.0" y="252.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">on miss</text>
<text x="16.0" y="340.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">First access loads the page from</text>
<text x="16.0" y="359.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">storage; later reads hit RAM.</text>
<text x="16.0" y="378.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">read() copies per call; mmap</text>
<text x="16.0" y="397.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">faults on first touch per page.</text>
</svg>
