<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 386" width="880" height="386" role="img" aria-label="Journaling steps: write to the journal, commit, checkpoint to the main area, free the journal space" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="386" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b8cff"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Write-ahead journaling: log it, commit it, then do it</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">the journal turns several writes into one atomic transaction</text>
<rect x="40.0" y="90.0" width="330.0" height="60.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="56.0" y="112.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="600">journal (circular log)</text>
<rect x="56.0" y="122.0" width="54.0" height="22.0" rx="3" fill="#5fb3a1" fill-opacity="0.3" stroke="#5fb3a1" stroke-width="1"/>
<text x="83.0" y="137.0" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="400">TxB</text>
<rect x="116.0" y="122.0" width="54.0" height="22.0" rx="3" fill="#5fb3a1" fill-opacity="0.3" stroke="#5fb3a1" stroke-width="1"/>
<text x="143.0" y="137.0" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="400">bitmap</text>
<rect x="176.0" y="122.0" width="54.0" height="22.0" rx="3" fill="#5fb3a1" fill-opacity="0.3" stroke="#5fb3a1" stroke-width="1"/>
<text x="203.0" y="137.0" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="400">inode</text>
<rect x="236.0" y="122.0" width="54.0" height="22.0" rx="3" fill="#5fb3a1" fill-opacity="0.3" stroke="#5fb3a1" stroke-width="1"/>
<text x="263.0" y="137.0" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="400">data</text>
<rect x="296.0" y="122.0" width="54.0" height="22.0" rx="3" fill="#e2b45a" fill-opacity="0.3" stroke="#e2b45a" stroke-width="1"/>
<text x="323.0" y="137.0" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="400">TxE</text>
<rect x="470.0" y="90.0" width="370.0" height="60.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="486.0" y="112.0" font-size="12" fill="#9b8cff" text-anchor="start" font-weight="600">main filesystem area</text>
<rect x="486.0" y="122.0" width="104.0" height="22.0" rx="3" fill="#9b8cff" fill-opacity="0.3" stroke="#9b8cff" stroke-width="1"/>
<text x="538.0" y="137.0" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="400">bitmap</text>
<rect x="600.0" y="122.0" width="104.0" height="22.0" rx="3" fill="#9b8cff" fill-opacity="0.3" stroke="#9b8cff" stroke-width="1"/>
<text x="652.0" y="137.0" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="400">inode</text>
<rect x="714.0" y="122.0" width="104.0" height="22.0" rx="3" fill="#9b8cff" fill-opacity="0.3" stroke="#9b8cff" stroke-width="1"/>
<text x="766.0" y="137.0" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="400">data 812</text>
<line x1="372.0" y1="120.0" x2="468.0" y2="120.0" stroke="#9b8cff" stroke-width="1.3" marker-end="url(#ah0)"/>
<text x="420.0" y="112.0" font-size="11" fill="#9b8cff" text-anchor="middle" font-weight="400">checkpoint</text>
<text x="40.0" y="190.0" font-size="12.5" fill="#5fb3a1" text-anchor="start" font-weight="700">1. journal write</text>
<text x="220.0" y="190.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">write the updated blocks (or a description of them) to the journal</text>
<text x="40.0" y="218.0" font-size="12.5" fill="#e2b45a" text-anchor="start" font-weight="700">2. commit</text>
<text x="220.0" y="218.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">write a commit record, only after step 1 is durable (barrier / FUA)</text>
<text x="40.0" y="246.0" font-size="12.5" fill="#9b8cff" text-anchor="start" font-weight="700">3. checkpoint</text>
<text x="220.0" y="246.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">write the blocks to their real locations, any time later</text>
<text x="40.0" y="274.0" font-size="12.5" fill="#ede6d8" text-anchor="start" font-weight="700">4. free</text>
<text x="220.0" y="274.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">mark the transaction's journal space reusable</text>
<text x="40.0" y="318.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Crash before the commit record is durable: the transaction is ignored. Crash after it: recovery replays committed</text>
<text x="40.0" y="337.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">transactions from the journal (idempotently). Recovery takes seconds because only the journal is read, not the</text>
<text x="40.0" y="356.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">whole disk. Databases do the same thing with their write-ahead log.</text>
</svg>
