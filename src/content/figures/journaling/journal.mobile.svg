<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 365" width="360" height="365" role="img" aria-label="Journaling steps: write to the journal, commit, checkpoint to the main area, free the journal space" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="365" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Journaling</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">log, commit, checkpoint</text>
<text x="16.0" y="86.0" font-size="12.5" fill="#5fb3a1" text-anchor="start" font-weight="700">1. journal write</text>
<text x="16.0" y="103.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">log the changed blocks</text>
<text x="16.0" y="132.0" font-size="12.5" fill="#e2b45a" text-anchor="start" font-weight="700">2. commit</text>
<text x="16.0" y="149.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">commit record after log is durable</text>
<text x="16.0" y="178.0" font-size="12.5" fill="#9b8cff" text-anchor="start" font-weight="700">3. checkpoint</text>
<text x="16.0" y="195.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">write blocks in place, later</text>
<text x="16.0" y="224.0" font-size="12.5" fill="#ede6d8" text-anchor="start" font-weight="700">4. free</text>
<text x="16.0" y="241.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">reuse journal space</text>
<text x="16.0" y="278.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Crash before commit: ignored.</text>
<text x="16.0" y="297.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Crash after: replay from the</text>
<text x="16.0" y="316.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">journal. Recovery takes seconds,</text>
<text x="16.0" y="335.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">not a full-disk fsck.</text>
</svg>
