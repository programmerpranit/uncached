<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 357" width="360" height="357" role="img" aria-label="Illustrative relative run time of a memory-bound scan with local, interleaved and remote memory placement" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="357" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Locality matters</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">memory-bound scan (illustrative)</text>
<text x="16.0" y="86.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">all local (bound per node)</text>
<rect x="16.0" y="94.0" width="115.0" height="14.0" rx="3" fill="#7cc47f" fill-opacity="0.7" stroke="#7cc47f" stroke-width="1"/>
<text x="137.0" y="106.0" font-size="11" fill="#7cc47f" text-anchor="start" font-weight="700">1.0×</text>
<text x="16.0" y="130.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">interleaved</text>
<rect x="16.0" y="138.0" width="138.0" height="14.0" rx="3" fill="#e2b45a" fill-opacity="0.7" stroke="#e2b45a" stroke-width="1"/>
<text x="160.0" y="150.0" font-size="11" fill="#e2b45a" text-anchor="start" font-weight="700">~1.2×</text>
<text x="16.0" y="174.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">all memory on the other node</text>
<rect x="16.0" y="182.0" width="184.0" height="14.0" rx="3" fill="#e5534b" fill-opacity="0.7" stroke="#e5534b" stroke-width="1"/>
<text x="206.0" y="194.0" font-size="11" fill="#e5534b" text-anchor="start" font-weight="700">~1.6×</text>
<text x="16.0" y="218.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">all on one node</text>
<rect x="16.0" y="226.0" width="207.0" height="14.0" rx="3" fill="#e5534b" fill-opacity="0.7" stroke="#e5534b" stroke-width="1"/>
<text x="229.0" y="238.0" font-size="11" fill="#e5534b" text-anchor="start" font-weight="700">~1.8×</text>
<text x="16.0" y="270.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Pointer chasing feels remote</text>
<text x="16.0" y="289.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">latency; scans feel bandwidth.</text>
<text x="16.0" y="308.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Cache-friendly code barely</text>
<text x="16.0" y="327.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">notices.</text>
</svg>
