<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 412" width="880" height="412" role="img" aria-label="NUMA memory policies: local, bind, preferred and interleave, with typical uses" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="412" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">NUMA policies and when to use them</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">set per process (numactl) or per memory range (mbind, set_mempolicy)</text>
<rect x="40.0" y="84.0" width="800.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="56.0" y="104.0" font-size="13" fill="#7cc47f" text-anchor="start" font-weight="700">local (default)</text>
<text x="260.0" y="104.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">allocate on the node where the thread runs</text>
<text x="260.0" y="122.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">use for: threads that stay put</text>
<rect x="40.0" y="142.0" width="800.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="56.0" y="162.0" font-size="13" fill="#5fb3a1" text-anchor="start" font-weight="700">bind</text>
<text x="260.0" y="162.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">only these nodes; fail or reclaim if full</text>
<text x="260.0" y="180.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">use for: pinned services, one instance per node</text>
<rect x="40.0" y="200.0" width="800.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="56.0" y="220.0" font-size="13" fill="#e2b45a" text-anchor="start" font-weight="700">preferred</text>
<text x="260.0" y="220.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">try this node, fall back elsewhere</text>
<text x="260.0" y="238.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">use for: soft affinity</text>
<rect x="40.0" y="258.0" width="800.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="56.0" y="278.0" font-size="13" fill="#9b8cff" text-anchor="start" font-weight="700">interleave</text>
<text x="260.0" y="278.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">round-robin pages across nodes</text>
<text x="260.0" y="296.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">use for: big shared data used by every thread</text>
<text x="40.0" y="344.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Interleaving gives every thread the same average latency and spreads bandwidth across all memory controllers, a</text>
<text x="40.0" y="363.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">good default for large shared caches and databases that don't partition by node (MongoDB and older MySQL guides</text>
<text x="40.0" y="382.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">recommend it). Binding is best when work can be partitioned: run one instance per socket.</text>
</svg>
