<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 308" width="880" height="308" role="img" aria-label="Single-threaded initialization puts all memory on one node, while parallel initialization spreads it across nodes" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="308" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">First touch decides where memory lives</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Linux allocates a page on the node of the thread that first writes it</text>
<text x="40.0" y="100.0" font-size="12.5" fill="#e5534b" text-anchor="start" font-weight="700">bad: one thread initializes everything</text>
<rect x="40.0" y="112.0" width="380.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<rect x="40.0" y="112.0" width="380.0" height="40.0" rx="3" fill="#5fb3a1" fill-opacity="0.6" stroke="#5fb3a1" stroke-width="1"/>
<text x="230.0" y="137.0" font-size="12" fill="#1b1712" text-anchor="middle" font-weight="700">all 64 GiB on node 0</text>
<text x="40.0" y="180.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">then 32 workers on both nodes read it: half of them always go remote, and node 0's</text>
<text x="40.0" y="198.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">memory controller becomes the bottleneck</text>
<text x="460.0" y="100.0" font-size="12.5" fill="#7cc47f" text-anchor="start" font-weight="700">good: each worker initializes its own part</text>
<rect x="460.0" y="112.0" width="190.0" height="40.0" rx="3" fill="#5fb3a1" fill-opacity="0.6" stroke="#5fb3a1" stroke-width="1"/>
<text x="555.0" y="137.0" font-size="12" fill="#1b1712" text-anchor="middle" font-weight="700">32 GiB node 0</text>
<rect x="650.0" y="112.0" width="190.0" height="40.0" rx="3" fill="#9b8cff" fill-opacity="0.6" stroke="#9b8cff" stroke-width="1"/>
<text x="745.0" y="137.0" font-size="12" fill="#1b1712" text-anchor="middle" font-weight="700">32 GiB node 1</text>
<text x="40.0" y="240.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Memory placement is decided page by page at the first page fault, not at malloc(). Parallel initialization,</text>
<text x="40.0" y="259.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">per-node allocation (numa_alloc_onnode, mbind), interleaving (numactl --interleave=all), or pinning threads and</text>
<text x="40.0" y="278.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">memory together (numactl --cpunodebind=0 --membind=0) keep accesses local. NUMA balancing migrates pages later.</text>
</svg>
