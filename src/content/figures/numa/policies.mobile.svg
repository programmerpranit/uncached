<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 338" width="360" height="338" role="img" aria-label="NUMA memory policies: local, bind, preferred and interleave, with typical uses" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="338" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">NUMA policies</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">numactl / mbind</text>
<text x="16.0" y="86.0" font-size="12.5" fill="#7cc47f" text-anchor="start" font-weight="700">local (default)</text>
<text x="16.0" y="103.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">threads that stay put</text>
<text x="16.0" y="130.0" font-size="12.5" fill="#5fb3a1" text-anchor="start" font-weight="700">bind</text>
<text x="16.0" y="147.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">pinned services, one instance per node</text>
<text x="16.0" y="174.0" font-size="12.5" fill="#e2b45a" text-anchor="start" font-weight="700">preferred</text>
<text x="16.0" y="191.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">soft affinity</text>
<text x="16.0" y="218.0" font-size="12.5" fill="#9b8cff" text-anchor="start" font-weight="700">interleave</text>
<text x="16.0" y="235.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">big shared data used by every thread</text>
<text x="16.0" y="270.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Interleave big shared data;</text>
<text x="16.0" y="289.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">bind when work is partitioned</text>
<text x="16.0" y="308.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">(one instance per socket).</text>
</svg>
