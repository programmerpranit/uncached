<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 428" width="880" height="428" role="img" aria-label="A two-socket server with two NUMA nodes, each with cores, L3 cache and local DRAM, joined by an interconnect" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="428" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">A two-socket server is two NUMA nodes</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">each socket has its own memory; reaching the other socket's memory crosses the interconnect</text>
<rect x="40.0" y="90.0" width="360.0" height="200.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="220.0" y="112.0" font-size="13" fill="#5fb3a1" text-anchor="middle" font-weight="700">node 0</text>
<rect x="60.0" y="128.0" width="72.0" height="40.0" rx="3" fill="#1b1712" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="96.0" y="151.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">core</text>
<rect x="142.0" y="128.0" width="72.0" height="40.0" rx="3" fill="#1b1712" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="178.0" y="151.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">core</text>
<rect x="224.0" y="128.0" width="72.0" height="40.0" rx="3" fill="#1b1712" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="260.0" y="151.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">core</text>
<rect x="306.0" y="128.0" width="72.0" height="40.0" rx="3" fill="#1b1712" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="342.0" y="151.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">core</text>
<rect x="60.0" y="180.0" width="320.0" height="30.0" rx="3" fill="#1b1712" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="220.0" y="199.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="600">shared L3 cache</text>
<rect x="60.0" y="226.0" width="320.0" height="44.0" rx="3" fill="#1b1712" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="220.0" y="245.0" font-size="12" fill="#5fb3a1" text-anchor="middle" font-weight="600">local DRAM (256 GiB)</text>
<text x="220.0" y="261.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="400">memory controller on this socket</text>
<rect x="480.0" y="90.0" width="360.0" height="200.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="660.0" y="112.0" font-size="13" fill="#9b8cff" text-anchor="middle" font-weight="700">node 1</text>
<rect x="500.0" y="128.0" width="72.0" height="40.0" rx="3" fill="#1b1712" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="536.0" y="151.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">core</text>
<rect x="582.0" y="128.0" width="72.0" height="40.0" rx="3" fill="#1b1712" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="618.0" y="151.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">core</text>
<rect x="664.0" y="128.0" width="72.0" height="40.0" rx="3" fill="#1b1712" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="700.0" y="151.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">core</text>
<rect x="746.0" y="128.0" width="72.0" height="40.0" rx="3" fill="#1b1712" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="782.0" y="151.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">core</text>
<rect x="500.0" y="180.0" width="320.0" height="30.0" rx="3" fill="#1b1712" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="660.0" y="199.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="600">shared L3 cache</text>
<rect x="500.0" y="226.0" width="320.0" height="44.0" rx="3" fill="#1b1712" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="660.0" y="245.0" font-size="12" fill="#9b8cff" text-anchor="middle" font-weight="600">local DRAM (256 GiB)</text>
<text x="660.0" y="261.0" font-size="11" fill="#9b8cff" text-anchor="middle" font-weight="400">memory controller on this socket</text>
<line x1="400.0" y1="150.0" x2="478.0" y2="150.0" stroke="#e5534b" stroke-width="2.5"/>
<line x1="478.0" y1="150.0" x2="400.0" y2="150.0" stroke="#e5534b" stroke-width="2.5"/>
<text x="440.0" y="172.0" font-size="10" fill="#e5534b" text-anchor="middle" font-weight="400">interconnect</text>
<text x="220.0" y="322.0" font-size="12" fill="#7cc47f" text-anchor="middle" font-weight="600">local access ~80–100 ns</text>
<text x="660.0" y="322.0" font-size="12" fill="#e5534b" text-anchor="middle" font-weight="600">remote access ~130–200 ns</text>
<text x="40.0" y="360.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">A thread on node 0 reading memory attached to node 1 pays extra latency and shares limited interconnect bandwidth.</text>
<text x="40.0" y="379.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Typical remote/local latency ratios are 1.3–2×; numactl --hardware prints the kernel's distance table. Large</text>
<text x="40.0" y="398.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">single-socket CPUs can also expose several NUMA nodes (sub-NUMA clustering, chiplets).</text>
</svg>
