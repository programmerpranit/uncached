<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 506" width="880" height="506" role="img" aria-label="A streamed HTML response: the shell contains a placeholder and fallback, and a later chunk carries hidden content plus a small script that swaps it in" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="506" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">One HTTP response, many chunks</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">how a late Suspense boundary replaces its fallback</text>
<rect x="40.0" y="96.0" width="400.0" height="166.0" rx="6" fill="#ff5b2e" fill-opacity="0.08" stroke="#ff5b2e" stroke-width="1.3"/>
<text x="52.0" y="116.0" font-size="11" fill="#ff5b2e" text-anchor="start" font-weight="700">chunk 1: shell</text>
<text x="428.0" y="116.0" font-size="10.5" fill="#a69d8e" text-anchor="end" font-weight="400">t = 40 ms</text>
<text x="52.0" y="138.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">&lt;html&gt;&lt;body&gt;</text>
<text x="52.0" y="155.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">  &lt;nav&gt;…&lt;/nav&gt;</text>
<text x="52.0" y="172.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">  &lt;!--$?--&gt;</text>
<text x="52.0" y="189.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">  &lt;template id="B:0"&gt;&lt;/template&gt;</text>
<text x="52.0" y="206.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">  &lt;div class="skeleton"&gt;…&lt;/div&gt;</text>
<text x="52.0" y="223.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">  &lt;!--/$--&gt;</text>
<text x="52.0" y="240.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">  &lt;script src="app.js" async&gt;</text>
<rect x="40.0" y="280.0" width="400.0" height="140.0" rx="6" fill="#5fb3a1" fill-opacity="0.08" stroke="#5fb3a1" stroke-width="1.3"/>
<text x="52.0" y="300.0" font-size="11" fill="#5fb3a1" text-anchor="start" font-weight="700">chunk 2: resolved boundary</text>
<text x="428.0" y="300.0" font-size="10.5" fill="#a69d8e" text-anchor="end" font-weight="400">t = 700 ms</text>
<text x="52.0" y="322.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">&lt;div hidden id="S:0"&gt;</text>
<text x="52.0" y="339.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">  &lt;ul class="reviews"&gt;…&lt;/ul&gt;</text>
<text x="52.0" y="356.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">&lt;/div&gt;</text>
<text x="52.0" y="373.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">&lt;script&gt;</text>
<text x="52.0" y="390.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">  $RC("B:0", "S:0")</text>
<text x="52.0" y="407.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">&lt;/script&gt;</text>
<rect x="40.0" y="438.0" width="400.0" height="44.0" rx="6" fill="#a69d8e" fill-opacity="0.08" stroke="#a69d8e" stroke-width="1.3"/>
<text x="52.0" y="458.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="700">chunk 3: close</text>
<text x="428.0" y="458.0" font-size="10.5" fill="#a69d8e" text-anchor="end" font-weight="400">t = 700 ms</text>
<text x="300.0" y="476.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">&lt;/body&gt;&lt;/html&gt;</text>
<rect x="500.0" y="96.0" width="340.0" height="386.0" rx="8" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="670.0" y="120.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="700">what the browser shows</text>
<rect x="520.0" y="136.0" width="300.0" height="36.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="670.0" y="158.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">nav</text>
<rect x="520.0" y="186.0" width="300.0" height="60.0" rx="4" fill="#a69d8e" fill-opacity="0.15" stroke="#a69d8e" stroke-width="1" stroke-dasharray="4 3"/>
<text x="670.0" y="221.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">skeleton (fallback)</text>
<text x="670.0" y="272.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="400">↓ chunk 2 arrives</text>
<rect x="520.0" y="286.0" width="300.0" height="36.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="670.0" y="308.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">nav</text>
<rect x="520.0" y="336.0" width="300.0" height="60.0" rx="3" fill="#5fb3a1" fill-opacity="0.85" stroke="#5fb3a1" stroke-width="1"/>
<text x="670.0" y="370.0" font-size="11" fill="#1b1712" text-anchor="middle" font-weight="600">reviews (real content)</text>
<text x="520.0" y="424.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">$RC moves the hidden div into the</text>
<text x="520.0" y="441.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">placeholder and removes the fallback,</text>
<text x="520.0" y="458.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">before React has even loaded.</text>
<line x1="442.0" y1="330.0" x2="516.0" y2="360.0" stroke="#5fb3a1" stroke-width="1.3" marker-end="url(#ah0)"/>
</svg>
