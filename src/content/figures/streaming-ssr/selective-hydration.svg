<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 505" width="880" height="505" role="img" aria-label="Suspense boundaries hydrate independently; a click on a not-yet-hydrated boundary makes React hydrate it first and replay the event" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="505" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Selective hydration</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">each Suspense boundary hydrates on its own; clicks jump the queue</text>
<rect x="40.0" y="96.0" width="520.0" height="330.0" rx="8" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="56.0" y="118.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="700">&lt;App&gt;</text>
<rect x="60.0" y="132.0" width="480.0" height="40.0" rx="3" fill="#7cc47f" fill-opacity="0.85" stroke="#7cc47f" stroke-width="1"/>
<text x="300.0" y="156.1" font-size="11.5" fill="#1b1712" text-anchor="middle" font-weight="600">&lt;Nav&gt;  (outside Suspense: hydrates first)</text>
<rect x="60.0" y="188.0" width="230.0" height="220.0" rx="6" fill="#9b8cff" fill-opacity="0.08" stroke="#9b8cff" stroke-width="1.3" stroke-dasharray="5 3"/>
<text x="72.0" y="208.0" font-size="11" fill="#9b8cff" text-anchor="start" font-weight="700">&lt;Suspense&gt; #1</text>
<rect x="76.0" y="222.0" width="198.0" height="70.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="175.0" y="254.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">&lt;Sidebar&gt;</text>
<text x="175.0" y="270.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">code loaded, waiting turn</text>
<rect x="76.0" y="306.0" width="198.0" height="86.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="175.0" y="346.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">&lt;Comments&gt;</text>
<text x="175.0" y="362.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">hydrating…</text>
<rect x="310.0" y="188.0" width="230.0" height="220.0" rx="6" fill="#d77fa1" fill-opacity="0.08" stroke="#d77fa1" stroke-width="1.3" stroke-dasharray="5 3"/>
<text x="322.0" y="208.0" font-size="11" fill="#d77fa1" text-anchor="start" font-weight="700">&lt;Suspense&gt; #2</text>
<rect x="326.0" y="222.0" width="198.0" height="170.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#d77fa1" stroke-width="1"/>
<text x="425.0" y="304.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">&lt;BuyBox&gt;</text>
<text x="425.0" y="320.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">user clicked here!</text>
<circle cx="470.0" cy="366.0" r="10" fill="#d77fa1" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="470.0" y="370.0" font-size="11" fill="#1b1712" text-anchor="middle" font-weight="400">↖</text>
<text x="600.0" y="124.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="700">Order React works in</text>
<circle cx="612.0" cy="148.0" r="9" fill="#7cc47f" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="612.0" y="152.0" font-size="10" fill="#1b1712" text-anchor="middle" font-weight="700">1</text>
<text x="630.0" y="152.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">Nav (no boundary)</text>
<circle cx="612.0" cy="174.0" r="9" fill="#9b8cff" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="612.0" y="178.0" font-size="10" fill="#1b1712" text-anchor="middle" font-weight="700">2</text>
<text x="630.0" y="178.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">Comments starts…</text>
<circle cx="612.0" cy="200.0" r="9" fill="#d77fa1" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="612.0" y="204.0" font-size="10" fill="#1b1712" text-anchor="middle" font-weight="700">3</text>
<text x="630.0" y="204.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">click on BuyBox recorded</text>
<circle cx="612.0" cy="226.0" r="9" fill="#d77fa1" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="612.0" y="230.0" font-size="10" fill="#1b1712" text-anchor="middle" font-weight="700">4</text>
<text x="630.0" y="230.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">BuyBox hydrated first,</text>
<text x="630.0" y="256.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">click is replayed</text>
<circle cx="612.0" cy="278.0" r="9" fill="#9b8cff" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="612.0" y="282.0" font-size="10" fill="#1b1712" text-anchor="middle" font-weight="700">5</text>
<text x="630.0" y="282.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">then Sidebar, Comments</text>
<text x="600.0" y="330.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">Hydration yields to the</text>
<text x="600.0" y="348.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">browser between boundaries,</text>
<text x="600.0" y="366.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">so the page stays responsive.</text>
<text x="40.0" y="456.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Without boundaries, hydration is one long task over the whole tree.</text>
<text x="40.0" y="475.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">With them, React hydrates in pieces, in priority order.</text>
</svg>
