<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 408" width="360" height="408" role="img" aria-label="Suspense boundaries hydrate independently; a click on a not-yet-hydrated boundary makes React hydrate it first and replay the event" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="408" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Selective hydration</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">boundaries hydrate separately</text>
<rect x="16.0" y="84.0" width="328.0" height="40.0" rx="3" fill="#7cc47f" fill-opacity="0.85" stroke="#7cc47f" stroke-width="1"/>
<text x="180.0" y="108.1" font-size="11.5" fill="#1b1712" text-anchor="middle" font-weight="600">&lt;Nav&gt;: hydrates first</text>
<rect x="16.0" y="138.0" width="328.0" height="80.0" rx="6" fill="#9b8cff" fill-opacity="0.08" stroke="#9b8cff" stroke-width="1.3" stroke-dasharray="5 3"/>
<text x="28.0" y="158.0" font-size="11" fill="#9b8cff" text-anchor="start" font-weight="700">&lt;Suspense&gt; #1</text>
<text x="28.0" y="182.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">Sidebar, Comments</text>
<text x="28.0" y="202.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">hydrating in background</text>
<rect x="16.0" y="232.0" width="328.0" height="80.0" rx="6" fill="#d77fa1" fill-opacity="0.08" stroke="#d77fa1" stroke-width="1.3" stroke-dasharray="5 3"/>
<text x="28.0" y="252.0" font-size="11" fill="#d77fa1" text-anchor="start" font-weight="700">&lt;Suspense&gt; #2</text>
<text x="28.0" y="276.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">BuyBox: user clicks here</text>
<text x="28.0" y="296.0" font-size="10.5" fill="#d77fa1" text-anchor="start" font-weight="400">→ jumps the queue, click replayed</text>
<text x="16.0" y="340.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Each boundary hydrates on its own,</text>
<text x="16.0" y="359.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">in priority order, yielding between</text>
<text x="16.0" y="378.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">them so the page stays responsive.</text>
</svg>
