<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 523" width="360" height="523" role="img" aria-label="Timeline comparing classic SSR, which waits for the slowest query before sending anything, with streaming SSR, which sends a shell immediately and streams sections as data resolves" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="523" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Classic vs streaming SSR</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">slowest query stops blocking</text>
<rect x="16.0" y="84.0" width="328.0" height="176.0" rx="8" fill="#e5534b" fill-opacity="0.08" stroke="#e5534b" stroke-width="1.3"/>
<text x="28.0" y="110.0" font-size="14" fill="#e5534b" text-anchor="start" font-weight="700">Classic SSR</text>
<circle cx="36.0" cy="136.0" r="9" fill="#e5534b" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="36.0" y="140.0" font-size="10" fill="#1b1712" text-anchor="middle" font-weight="700">1</text>
<text x="54.0" y="140.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">wait for ALL data (~700 ms)</text>
<circle cx="36.0" cy="166.0" r="9" fill="#e5534b" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="36.0" y="170.0" font-size="10" fill="#1b1712" text-anchor="middle" font-weight="700">2</text>
<text x="54.0" y="170.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">send full HTML → first paint</text>
<circle cx="36.0" cy="196.0" r="9" fill="#e5534b" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="36.0" y="200.0" font-size="10" fill="#1b1712" text-anchor="middle" font-weight="700">3</text>
<text x="54.0" y="200.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">download all JS</text>
<circle cx="36.0" cy="226.0" r="9" fill="#e5534b" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="36.0" y="230.0" font-size="10" fill="#1b1712" text-anchor="middle" font-weight="700">4</text>
<text x="54.0" y="230.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">hydrate whole page at once</text>
<rect x="16.0" y="274.0" width="328.0" height="176.0" rx="8" fill="#7cc47f" fill-opacity="0.08" stroke="#7cc47f" stroke-width="1.3"/>
<text x="28.0" y="300.0" font-size="14" fill="#7cc47f" text-anchor="start" font-weight="700">Streaming SSR</text>
<circle cx="36.0" cy="326.0" r="9" fill="#7cc47f" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="36.0" y="330.0" font-size="10" fill="#1b1712" text-anchor="middle" font-weight="700">1</text>
<text x="54.0" y="330.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">send shell + fallbacks (~40 ms)</text>
<circle cx="36.0" cy="356.0" r="9" fill="#7cc47f" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="36.0" y="360.0" font-size="10" fill="#1b1712" text-anchor="middle" font-weight="700">2</text>
<text x="54.0" y="360.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">stream products when ready</text>
<circle cx="36.0" cy="386.0" r="9" fill="#7cc47f" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="36.0" y="390.0" font-size="10" fill="#1b1712" text-anchor="middle" font-weight="700">3</text>
<text x="54.0" y="390.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">hydrate ready parts early</text>
<circle cx="36.0" cy="416.0" r="9" fill="#7cc47f" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="36.0" y="420.0" font-size="10" fill="#1b1712" text-anchor="middle" font-weight="700">4</text>
<text x="54.0" y="420.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">stream reviews at ~700 ms</text>
<text x="16.0" y="474.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Same total server work, but the user</text>
<text x="16.0" y="493.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">sees and uses the page much sooner.</text>
</svg>
