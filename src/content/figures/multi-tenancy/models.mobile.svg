<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 410" width="360" height="410" role="img" aria-label="Three models: a shared schema with a tenant_id column, a schema per tenant inside one database, and a database per tenant; isolation, cost and operational effort rise from left to right" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="410" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Three isolation models</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">shared → isolated</text>
<rect x="16.0" y="82.0" width="328.0" height="86.0" rx="3" fill="#ff5b2e" fill-opacity="0.1" stroke="#ff5b2e" stroke-width="1"/>
<text x="180.0" y="128.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="28.0" y="104.0" font-size="12" fill="#ff5b2e" text-anchor="start" font-weight="700">Shared schema</text>
<text x="28.0" y="122.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">tenant_id column on every row</text>
<text x="28.0" y="142.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">cheapest, densest, one migration</text>
<text x="28.0" y="161.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">noisy neighbours, leak = WHERE bug</text>
<rect x="16.0" y="178.0" width="328.0" height="86.0" rx="3" fill="#5fb3a1" fill-opacity="0.1" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="224.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="28.0" y="200.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="700">Schema per tenant</text>
<text x="28.0" y="218.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">one DB, N schemas</text>
<text x="28.0" y="238.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">logical isolation, per-tenant restore</text>
<text x="28.0" y="257.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">N× migrations, catalog bloat</text>
<rect x="16.0" y="274.0" width="328.0" height="86.0" rx="3" fill="#9b8cff" fill-opacity="0.1" stroke="#9b8cff" stroke-width="1"/>
<text x="180.0" y="320.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="28.0" y="296.0" font-size="12" fill="#9b8cff" text-anchor="start" font-weight="700">Database per tenant</text>
<text x="28.0" y="314.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">own DB / cluster</text>
<text x="28.0" y="334.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">strong isolation, per-tenant region</text>
<text x="28.0" y="353.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">highest cost, fleet ops</text>
<text x="16.0" y="380.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">→ more isolation, more cost</text>
</svg>
