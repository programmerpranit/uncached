<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 419" width="360" height="419" role="img" aria-label="A request is resolved to a tenant from the subdomain or token, the tenant is stored in request context, a router picks the shard or database, and row-level security enforces the tenant filter; quotas and telemetry are tagged per tenant" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="419" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Tenant context flow</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">resolve at edge, enforce in DB</text>
<rect x="16.0" y="80.0" width="328.0" height="44.0" rx="3" fill="#a69d8e" fill-opacity="0.15" stroke="#a69d8e" stroke-width="1"/>
<text x="180.0" y="99.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Request</text>
<text x="180.0" y="115.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">acme.app.com / JWT tid</text>
<rect x="16.0" y="136.0" width="328.0" height="44.0" rx="3" fill="#ff5b2e" fill-opacity="0.15" stroke="#ff5b2e" stroke-width="1"/>
<text x="180.0" y="155.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Resolve tenant</text>
<text x="180.0" y="171.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">tid → plan, region, shard</text>
<line x1="180.0" y1="126.0" x2="180.0" y2="134.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="16.0" y="192.0" width="328.0" height="44.0" rx="3" fill="#5fb3a1" fill-opacity="0.15" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="211.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Context</text>
<text x="180.0" y="227.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">tenant in request scope</text>
<line x1="180.0" y1="182.0" x2="180.0" y2="190.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="16.0" y="248.0" width="328.0" height="44.0" rx="3" fill="#e2b45a" fill-opacity="0.15" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="267.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Router</text>
<text x="180.0" y="283.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">pick pool / shard / DB</text>
<line x1="180.0" y1="238.0" x2="180.0" y2="246.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="16.0" y="304.0" width="328.0" height="44.0" rx="3" fill="#9b8cff" fill-opacity="0.15" stroke="#9b8cff" stroke-width="1"/>
<text x="180.0" y="323.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">DB guard</text>
<text x="180.0" y="339.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">RLS: tenant_id = setting</text>
<line x1="180.0" y1="294.0" x2="180.0" y2="302.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<text x="16.0" y="370.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">Derive tenant from auth; let</text>
<text x="16.0" y="389.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">the DB reject unfiltered queries.</text>
</svg>
