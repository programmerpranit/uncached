<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 379" width="880" height="379" role="img" aria-label="Chat system architecture with connection gateways, chat service, message store, session registry and push" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="379" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b8cff"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d77fa1"/></marker><marker id="ah4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2b45a"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Chat architecture</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">stateful connection gateways + stateless chat services</text>
<rect x="30.0" y="90.0" width="120.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="90.0" y="116.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="600">Alice (phone)</text>
<rect x="30.0" y="220.0" width="120.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="90.0" y="246.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="600">Bob (laptop)</text>
<rect x="210.0" y="90.0" width="170.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="295.0" y="109.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">gateway 7</text>
<text x="295.0" y="125.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">WebSocket, 500k conns</text>
<rect x="210.0" y="220.0" width="170.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="295.0" y="239.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">gateway 12</text>
<text x="295.0" y="255.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">WebSocket</text>
<line x1="152.0" y1="112.0" x2="208.0" y2="112.0" stroke="#5fb3a1" stroke-width="1.2"/>
<line x1="152.0" y1="242.0" x2="208.0" y2="242.0" stroke="#e2b45a" stroke-width="1.2"/>
<rect x="450.0" y="150.0" width="170.0" height="56.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="535.0" y="175.0" font-size="12" fill="#ff5b2e" text-anchor="middle" font-weight="600">chat service</text>
<text x="535.0" y="191.0" font-size="11" fill="#ff5b2e" text-anchor="middle" font-weight="400">validate, seq, store</text>
<line x1="382.0" y1="112.0" x2="448.0" y2="166.0" stroke="#a69d8e" stroke-width="1.1" marker-end="url(#ah0)"/>
<rect x="690.0" y="70.0" width="160.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="770.0" y="90.0" font-size="11" fill="#9b8cff" text-anchor="middle" font-weight="600">message store</text>
<text x="770.0" y="106.0" font-size="11" fill="#9b8cff" text-anchor="middle" font-weight="400">per-conversation log</text>
<rect x="690.0" y="150.0" width="160.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="770.0" y="170.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="600">session registry</text>
<text x="770.0" y="186.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="400">user → gateway</text>
<rect x="690.0" y="230.0" width="160.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#d77fa1" stroke-width="1"/>
<text x="770.0" y="250.0" font-size="11" fill="#d77fa1" text-anchor="middle" font-weight="600">push service</text>
<text x="770.0" y="266.0" font-size="11" fill="#d77fa1" text-anchor="middle" font-weight="400">APNs / FCM</text>
<line x1="622.0" y1="166.0" x2="688.0" y2="94.0" stroke="#9b8cff" stroke-width="1.1" marker-end="url(#ah1)"/>
<line x1="622.0" y1="178.0" x2="688.0" y2="173.0" stroke="#5fb3a1" stroke-width="1.1" marker-end="url(#ah2)"/>
<line x1="622.0" y1="192.0" x2="688.0" y2="252.0" stroke="#d77fa1" stroke-width="1" marker-end="url(#ah3)" stroke-dasharray="4 3"/>
<line x1="448.0" y1="192.0" x2="382.0" y2="240.0" stroke="#e2b45a" stroke-width="1.1" marker-end="url(#ah4)"/>
<text x="395.0" y="276.0" font-size="10.5" fill="#e2b45a" text-anchor="start" font-weight="400">deliver to Bob’s gateway</text>
<text x="30.0" y="330.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Gateways only hold connections; chat services hold no connections. To deliver, a chat service looks up which</text>
<text x="30.0" y="349.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">gateway(s) each recipient’s devices are on, and falls back to a mobile push notification for offline devices.</text>
</svg>
