<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 332" width="360" height="332" role="img" aria-label="Techniques for reducing presence fan-out: heartbeats, debouncing, subscriptions and limits for large groups" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="332" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Presence fan-out</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">changes × interested contacts</text>
<text x="16.0" y="82.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">500 contacts × 20 reconnects/day</text>
<text x="16.0" y="101.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">= 20,000 events per user.</text>
<text x="16.0" y="140.0" font-size="12.5" fill="#5fb3a1" text-anchor="start" font-weight="700">heartbeat</text>
<text x="16.0" y="158.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">client pings every ~30 s; missing 2 → offline</text>
<text x="16.0" y="188.0" font-size="12.5" fill="#e2b45a" text-anchor="start" font-weight="700">debounce</text>
<text x="16.0" y="206.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">ignore flaps shorter than a few seconds</text>
<text x="16.0" y="236.0" font-size="12.5" fill="#9b8cff" text-anchor="start" font-weight="700">subscribe</text>
<text x="16.0" y="254.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">only push presence for chats on screen</text>
<text x="16.0" y="284.0" font-size="12.5" fill="#ff5b2e" text-anchor="start" font-weight="700">large groups</text>
<text x="16.0" y="302.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">show counts or nothing, not per-member status</text>
</svg>
