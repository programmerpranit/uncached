<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 310" width="360" height="310" role="img" aria-label="Devices sync a conversation by requesting messages after their last known sequence number" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="310" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Sync by sequence number</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">device asks: “after seq N?”</text>
<text x="16.0" y="84.0" font-size="12" fill="#9b8cff" text-anchor="start" font-weight="600">conversation #551</text>
<rect x="16.0" y="96.0" width="36.0" height="36.0" rx="3" fill="#9b8cff" fill-opacity="0.15" stroke="#9b8cff" stroke-width="1"/>
<text x="34.0" y="119.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="400">84</text>
<rect x="57.0" y="96.0" width="36.0" height="36.0" rx="3" fill="#9b8cff" fill-opacity="0.15" stroke="#9b8cff" stroke-width="1"/>
<text x="75.0" y="119.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="400">85</text>
<rect x="98.0" y="96.0" width="36.0" height="36.0" rx="3" fill="#9b8cff" fill-opacity="0.15" stroke="#9b8cff" stroke-width="1"/>
<text x="116.0" y="119.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="400">86</text>
<rect x="139.0" y="96.0" width="36.0" height="36.0" rx="3" fill="#9b8cff" fill-opacity="0.4" stroke="#9b8cff" stroke-width="1"/>
<text x="157.0" y="119.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="400">87</text>
<rect x="180.0" y="96.0" width="36.0" height="36.0" rx="3" fill="#9b8cff" fill-opacity="0.4" stroke="#9b8cff" stroke-width="1"/>
<text x="198.0" y="119.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="400">88</text>
<rect x="221.0" y="96.0" width="36.0" height="36.0" rx="3" fill="#9b8cff" fill-opacity="0.4" stroke="#9b8cff" stroke-width="1"/>
<text x="239.0" y="119.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="400">89</text>
<rect x="262.0" y="96.0" width="36.0" height="36.0" rx="3" fill="#9b8cff" fill-opacity="0.4" stroke="#9b8cff" stroke-width="1"/>
<text x="280.0" y="119.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="400">90</text>
<rect x="303.0" y="96.0" width="36.0" height="36.0" rx="3" fill="#9b8cff" fill-opacity="0.4" stroke="#9b8cff" stroke-width="1"/>
<text x="321.0" y="119.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="400">91</text>
<text x="16.0" y="166.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="400">phone: last 91 → up to date</text>
<text x="16.0" y="185.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="400">laptop: last 86</text>
<text x="16.0" y="204.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="400">→ fetch after=86 → 87…91</text>
<text x="16.0" y="242.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Same order on every device.</text>
<text x="16.0" y="261.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Gaps are detectable.</text>
<text x="16.0" y="280.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Reconnect = "everything after N".</text>
</svg>
