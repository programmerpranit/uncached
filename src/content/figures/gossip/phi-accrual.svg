<text x="94.0" y="98.0" font-size="12" fill="#a69d8e" text-anchor="end" font-weight="400">φ</text>
<text x="40.0" y="330.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Heartbeats normally arrive every ~1 s (±0.2 s here). φ = −log₁₀ P(a heartbeat would arrive even later).</text>
<text x="40.0" y="349.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Each application picks its own threshold: act early with a low φ, or avoid false alarms with a high one.</text>
<text x="40.0" y="368.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Because the distribution is learned from history, slow or jittery networks raise the bar automatically.</text>
