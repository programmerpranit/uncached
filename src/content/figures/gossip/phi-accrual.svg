<text x="106.0" y="147.3" font-size="10.5" fill="#e5534b" text-anchor="start" font-weight="400">φ=8: Cassandra default threshold</text>
<text x="100.0" y="296.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">0 s</text>
<text x="340.0" y="296.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">1 s</text>
