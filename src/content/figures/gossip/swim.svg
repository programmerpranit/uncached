<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 449" width="880" height="449" role="img" aria-label="SWIM: a direct ping, then indirect pings through other members, before suspecting a node" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="449" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e5534b"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">SWIM failure detection</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">direct probe, then indirect probes through k peers</text>
<rect x="40.0" y="140.0" width="110.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="95.0" y="162.0" font-size="14" fill="#ede6d8" text-anchor="middle" font-weight="600">A</text>
<text x="95.0" y="178.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">prober</text>
<rect x="700.0" y="140.0" width="110.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="755.0" y="162.0" font-size="14" fill="#e2b45a" text-anchor="middle" font-weight="600">B</text>
<text x="755.0" y="178.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="400">target</text>
<line x1="152.0" y1="158.0" x2="698.0" y2="158.0" stroke="#e5534b" stroke-width="1.2" marker-end="url(#ah0)" stroke-dasharray="5 4"/>
<text x="420.0" y="150.0" font-size="11" fill="#e5534b" text-anchor="middle" font-weight="400">1. ping B … no ack (packet lost?)</text>
<rect x="360.0" y="250.0" width="90.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="405.0" y="274.7" font-size="13" fill="#5fb3a1" text-anchor="middle" font-weight="600">C</text>
<line x1="150.0" y1="185.0" x2="360.0" y2="260.0" stroke="#5fb3a1" stroke-width="1" marker-end="url(#ah1)"/>
<line x1="450.0" y1="260.0" x2="700.0" y2="192.0" stroke="#5fb3a1" stroke-width="1" marker-end="url(#ah1)"/>
<rect x="500.0" y="320.0" width="90.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="545.0" y="344.7" font-size="13" fill="#5fb3a1" text-anchor="middle" font-weight="600">D</text>
<line x1="150.0" y1="185.0" x2="500.0" y2="330.0" stroke="#5fb3a1" stroke-width="1" marker-end="url(#ah1)"/>
<line x1="590.0" y1="330.0" x2="700.0" y2="192.0" stroke="#5fb3a1" stroke-width="1" marker-end="url(#ah1)"/>
<text x="170.0" y="268.0" font-size="11" fill="#5fb3a1" text-anchor="start" font-weight="400">2. ping-req B via C, D</text>
<text x="680.0" y="250.0" font-size="11" fill="#5fb3a1" text-anchor="start" font-weight="400">3. C/D ping B, relay ack</text>
<text x="40.0" y="400.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">If any indirect probe succeeds, B is alive and A’s own link was the problem. If none do, B becomes "suspect";</text>
<text x="40.0" y="419.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">if it doesn’t refute that within a timeout, it is declared dead and the news spreads by gossip.</text>
</svg>
