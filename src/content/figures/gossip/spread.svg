<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 403" width="880" height="403" role="img" aria-label="Number of informed nodes per gossip round for fan-out 1 and 3" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="403" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Gossip spreads like an epidemic</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">1,000 nodes; each informed node tells k random peers per round</text>
<line x1="100.0" y1="290.0" x2="820.0" y2="290.0" stroke="#4a4136" stroke-width="1.3"/>
<line x1="100.0" y1="90.0" x2="100.0" y2="290.0" stroke="#4a4136" stroke-width="1.3"/>
<text x="94.0" y="294.0" font-size="10.5" fill="#a69d8e" text-anchor="end" font-weight="400">0</text>
<line x1="100.0" y1="290.0" x2="820.0" y2="290.0" stroke="#2f2921" stroke-width="1"/>
<text x="94.0" y="194.0" font-size="10.5" fill="#a69d8e" text-anchor="end" font-weight="400">500</text>
<line x1="100.0" y1="190.0" x2="820.0" y2="190.0" stroke="#2f2921" stroke-width="1"/>
<text x="94.0" y="94.0" font-size="10.5" fill="#a69d8e" text-anchor="end" font-weight="400">1000</text>
<line x1="100.0" y1="90.0" x2="820.0" y2="90.0" stroke="#2f2921" stroke-width="1"/>
<path d="M100.0,289.8 L142.4,289.6 L184.7,289.2 L227.1,288.4 L269.4,286.8 L311.8,283.8 L354.1,278.2 L396.5,267.4 L438.8,247.6 L481.2,217.4 L523.5,177.6 L565.9,143.2 L608.2,117.8 L650.6,102.2 L692.9,94.6 L735.3,91.6 L777.6,90.4 L820.0,90.0" fill="none" stroke="#e2b45a" stroke-width="2.2"/>
<text x="814.0" y="106.0" font-size="11" fill="#e2b45a" text-anchor="end" font-weight="400">k=1: all in 17 rounds</text>
<path d="M100.0,289.8 L142.4,289.2 L184.7,286.8 L227.1,277.4 L269.4,244.4 L311.8,167.2 L354.1,103.0 L396.5,91.6 L438.8,90.0" fill="none" stroke="#ff5b2e" stroke-width="2.2"/>
<text x="444.8" y="106.0" font-size="11" fill="#ff5b2e" text-anchor="start" font-weight="400">k=3: all in 8 rounds</text>
<text x="100.0" y="306.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">0</text>
<text x="184.7" y="306.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">2</text>
<text x="269.4" y="306.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">4</text>
<text x="354.1" y="306.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">6</text>
<text x="438.8" y="306.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">8</text>
<text x="523.5" y="306.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">10</text>
<text x="608.2" y="306.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">12</text>
<text x="692.9" y="306.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">14</text>
<text x="777.6" y="306.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">16</text>
<text x="820.0" y="322.0" font-size="10.5" fill="#a69d8e" text-anchor="end" font-weight="400">rounds</text>
<text x="40.0" y="354.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Slow start, explosive middle, long tail: the classic S-curve. Rounds needed grow with log n, so 10× more nodes adds</text>
<text x="40.0" y="373.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">only a few rounds. Redundant messages make it robust: no single node or link is critical.</text>
