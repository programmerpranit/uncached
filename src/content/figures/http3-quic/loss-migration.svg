<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" width="880" height="372" role="img" aria-label="Six QUIC packets with one lost: only the stream whose data was lost waits, the other two are delivered; a side panel shows a client switching from Wi-Fi to LTE while keeping the same connection ID" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="372" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Per-stream loss recovery and connection migration</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">a lost packet stalls only its own stream; a connection ID survives an IP change</text>
<text x="40.0" y="100.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="700">packets</text>
<rect x="130.0" y="82.0" width="62.0" height="28.0" rx="3" fill="#5fb3a1" fill-opacity="0.25" stroke="#5fb3a1" stroke-width="1"/>
<text x="161.0" y="99.4" font-size="9.5" fill="#ede6d8" text-anchor="middle" font-weight="600">stream 1</text>
<rect x="200.0" y="82.0" width="62.0" height="28.0" rx="4" fill="#1b1712" fill-opacity="1" stroke="#e5534b" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="231.0" y="100.0" font-size="9.5" fill="#e5534b" text-anchor="middle" font-weight="700">LOST</text>
<rect x="270.0" y="82.0" width="62.0" height="28.0" rx="3" fill="#e2b45a" fill-opacity="0.25" stroke="#e2b45a" stroke-width="1"/>
<text x="301.0" y="99.4" font-size="9.5" fill="#ede6d8" text-anchor="middle" font-weight="600">stream 3</text>
<rect x="340.0" y="82.0" width="62.0" height="28.0" rx="3" fill="#5fb3a1" fill-opacity="0.25" stroke="#5fb3a1" stroke-width="1"/>
<text x="371.0" y="99.4" font-size="9.5" fill="#ede6d8" text-anchor="middle" font-weight="600">stream 1</text>
<rect x="410.0" y="82.0" width="62.0" height="28.0" rx="3" fill="#9b8cff" fill-opacity="0.25" stroke="#9b8cff" stroke-width="1"/>
<text x="441.0" y="99.4" font-size="9.5" fill="#ede6d8" text-anchor="middle" font-weight="600">stream 2</text>
<rect x="480.0" y="82.0" width="62.0" height="28.0" rx="3" fill="#e2b45a" fill-opacity="0.25" stroke="#e2b45a" stroke-width="1"/>
<text x="511.0" y="99.4" font-size="9.5" fill="#ede6d8" text-anchor="middle" font-weight="600">stream 3</text>
<text x="40.0" y="160.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="600">stream 1</text>
<rect x="130.0" y="144.0" width="300.0" height="26.0" rx="3" fill="#5fb3a1" fill-opacity="0.25" stroke="#5fb3a1" stroke-width="1"/>
<text x="280.0" y="160.4" font-size="9.5" fill="#ede6d8" text-anchor="middle" font-weight="600">delivered to app</text>
<text x="40.0" y="196.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="600">stream 2</text>
<rect x="130.0" y="180.0" width="120.0" height="26.0" rx="3" fill="#9b8cff" fill-opacity="0.1" stroke="#9b8cff" stroke-width="1"/>
<text x="190.0" y="196.4" font-size="9.5" fill="#ede6d8" text-anchor="middle" font-weight="600">waiting</text>
<text x="260.0" y="197.0" font-size="9.5" fill="#e5534b" text-anchor="start" font-weight="400">← only this stream waits for the retransmit</text>
<text x="40.0" y="232.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="600">stream 3</text>
<rect x="130.0" y="216.0" width="300.0" height="26.0" rx="3" fill="#e2b45a" fill-opacity="0.25" stroke="#e2b45a" stroke-width="1"/>
<text x="280.0" y="232.4" font-size="9.5" fill="#ede6d8" text-anchor="middle" font-weight="600">delivered to app</text>
<rect x="560.0" y="76.0" width="290.0" height="200.0" rx="8" fill="#2f2921" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="705.0" y="98.0" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="700">Connection migration</text>
<rect x="580.0" y="112.0" width="250.0" height="32.0" rx="3" fill="#5fb3a1" fill-opacity="0.22" stroke="#5fb3a1" stroke-width="1"/>
<text x="705.0" y="131.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">Wi-Fi  192.0.2.7 : 51000</text>
<line x1="705.0" y1="146.0" x2="705.0" y2="172.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="580.0" y="176.0" width="250.0" height="32.0" rx="3" fill="#e2b45a" fill-opacity="0.22" stroke="#e2b45a" stroke-width="1"/>
<text x="705.0" y="195.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600">LTE  198.51.100.4 : 6120</text>
<text x="705.0" y="232.0" font-size="10" fill="#ff5b2e" text-anchor="middle" font-weight="600">same Connection ID → same session</text>
<text x="705.0" y="250.0" font-size="9.5" fill="#a69d8e" text-anchor="middle" font-weight="400">TCP would see a new 4-tuple and reset</text>
<text x="40.0" y="310.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">QUIC numbers packets independently of stream data and tracks ordering per stream, so loss in stream 2 never blocks 1 and 3.</text>
<text x="40.0" y="326.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">Connections are identified by an opaque ID rather than the IP/port 4-tuple, so a phone walking off Wi-Fi keeps its connection</text>
<text x="40.0" y="342.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">after a short path validation instead of re-handshaking.</text>
</svg>
