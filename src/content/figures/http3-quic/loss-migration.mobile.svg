<rect x="16.0" y="300.0" width="328.0" height="28.0" rx="3" fill="#e2b45a" fill-opacity="0.22" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="317.4" font-size="9.5" fill="#ede6d8" text-anchor="middle" font-weight="600">LTE 198.51.100.4</text>
<text x="16.0" y="348.0" font-size="9.5" fill="#ff5b2e" text-anchor="start" font-weight="600">Same connection ID → same session.</text>
<text x="16.0" y="363.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">TCP would see a new 4-tuple and reset.</text>
