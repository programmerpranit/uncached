<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 393" width="360" height="393" role="img" aria-label="Six QUIC packets with one lost: only the stream whose data was lost waits, the other two are delivered; a side panel shows a client switching from Wi-Fi to LTE while keeping the same connection ID" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="393" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Loss isolation &amp; migration</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">one stream stalls, not all</text>
<rect x="16.0" y="80.0" width="50.0" height="26.0" rx="3" fill="#5fb3a1" fill-opacity="0.25" stroke="#5fb3a1" stroke-width="1"/>
<text x="41.0" y="96.2" font-size="9" fill="#ede6d8" text-anchor="middle" font-weight="600">s1</text>
<rect x="71.0" y="80.0" width="50.0" height="26.0" rx="4" fill="#1b1712" fill-opacity="1" stroke="#e5534b" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="96.0" y="97.0" font-size="8.5" fill="#e5534b" text-anchor="middle" font-weight="700">LOST</text>
<rect x="126.0" y="80.0" width="50.0" height="26.0" rx="3" fill="#e2b45a" fill-opacity="0.25" stroke="#e2b45a" stroke-width="1"/>
<text x="151.0" y="96.2" font-size="9" fill="#ede6d8" text-anchor="middle" font-weight="600">s3</text>
<rect x="181.0" y="80.0" width="50.0" height="26.0" rx="3" fill="#5fb3a1" fill-opacity="0.25" stroke="#5fb3a1" stroke-width="1"/>
<text x="206.0" y="96.2" font-size="9" fill="#ede6d8" text-anchor="middle" font-weight="600">s1</text>
<rect x="236.0" y="80.0" width="50.0" height="26.0" rx="3" fill="#9b8cff" fill-opacity="0.25" stroke="#9b8cff" stroke-width="1"/>
<text x="261.0" y="96.2" font-size="9" fill="#ede6d8" text-anchor="middle" font-weight="600">s2</text>
<rect x="291.0" y="80.0" width="50.0" height="26.0" rx="3" fill="#e2b45a" fill-opacity="0.25" stroke="#e2b45a" stroke-width="1"/>
<text x="316.0" y="96.2" font-size="9" fill="#ede6d8" text-anchor="middle" font-weight="600">s3</text>
<text x="16.0" y="140.0" font-size="9.5" fill="#ede6d8" text-anchor="start" font-weight="600">stream 1</text>
<rect x="90.0" y="124.0" width="254.0" height="24.0" rx="3" fill="#5fb3a1" fill-opacity="0.25" stroke="#5fb3a1" stroke-width="1"/>
<text x="217.0" y="139.2" font-size="9" fill="#ede6d8" text-anchor="middle" font-weight="600">delivered</text>
<text x="16.0" y="172.0" font-size="9.5" fill="#ede6d8" text-anchor="start" font-weight="600">stream 2</text>
<rect x="90.0" y="156.0" width="110.0" height="24.0" rx="3" fill="#9b8cff" fill-opacity="0.1" stroke="#9b8cff" stroke-width="1"/>
