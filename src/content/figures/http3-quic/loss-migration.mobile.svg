<text x="217.0" y="203.2" font-size="9" fill="#ede6d8" text-anchor="middle" font-weight="600">delivered</text>
<text x="16.0" y="242.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="700">Connection migration</text>
