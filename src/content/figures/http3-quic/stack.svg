<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 482" width="880" height="482" role="img" aria-label="Two stacks side by side: HTTP/2 over TLS over TCP over IP, and HTTP/3 over QUIC (which includes TLS 1.3 and streams) over UDP over IP" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="482" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">HTTP/2 vs HTTP/3 protocol stacks</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">QUIC folds transport, encryption and streams into one user-space protocol on UDP</text>
<text x="250.0" y="92.0" font-size="13" fill="#ede6d8" text-anchor="middle" font-weight="700">HTTP/2</text>
<rect x="110.0" y="108.0" width="280.0" height="52.0" rx="3" fill="#ff5b2e" fill-opacity="0.22" stroke="#ff5b2e" stroke-width="1"/>
<text x="250.0" y="131.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">HTTP/2</text>
<text x="250.0" y="147.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">framing, HPACK, streams</text>
<rect x="110.0" y="166.0" width="280.0" height="52.0" rx="3" fill="#9b8cff" fill-opacity="0.22" stroke="#9b8cff" stroke-width="1"/>
<text x="250.0" y="189.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">TLS 1.2 / 1.3</text>
<text x="250.0" y="205.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">encryption</text>
<rect x="110.0" y="224.0" width="280.0" height="52.0" rx="3" fill="#5fb3a1" fill-opacity="0.22" stroke="#5fb3a1" stroke-width="1"/>
<text x="250.0" y="247.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">TCP</text>
<text x="250.0" y="263.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">reliability, ordering, congestion</text>
<rect x="110.0" y="282.0" width="280.0" height="52.0" rx="3" fill="#4a4136" fill-opacity="0.22" stroke="#4a4136" stroke-width="1"/>
<text x="250.0" y="312.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">IP</text>
<text x="250.0" y="356.0" font-size="9.5" fill="#a69d8e" text-anchor="middle" font-weight="400">kernel</text>
<text x="630.0" y="92.0" font-size="13" fill="#ede6d8" text-anchor="middle" font-weight="700">HTTP/3</text>
<rect x="490.0" y="108.0" width="280.0" height="52.0" rx="3" fill="#ff5b2e" fill-opacity="0.22" stroke="#ff5b2e" stroke-width="1"/>
<text x="630.0" y="131.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">HTTP/3</text>
<text x="630.0" y="147.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">framing, QPACK</text>
<rect x="490.0" y="166.0" width="280.0" height="86.0" rx="3" fill="#d77fa1" fill-opacity="0.22" stroke="#d77fa1" stroke-width="1"/>
<text x="630.0" y="206.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">QUIC</text>
<text x="630.0" y="222.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">streams · loss recovery · TLS 1.3</text>
<rect x="490.0" y="258.0" width="280.0" height="52.0" rx="3" fill="#e2b45a" fill-opacity="0.22" stroke="#e2b45a" stroke-width="1"/>
<text x="630.0" y="281.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">UDP</text>
<text x="630.0" y="297.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">ports + checksum only</text>
<rect x="490.0" y="316.0" width="280.0" height="52.0" rx="3" fill="#4a4136" fill-opacity="0.22" stroke="#4a4136" stroke-width="1"/>
<text x="630.0" y="346.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">IP</text>
<text x="630.0" y="390.0" font-size="9.5" fill="#a69d8e" text-anchor="middle" font-weight="400">user space (QUIC) · kernel (UDP)</text>
<line x1="400.0" y1="190.0" x2="480.0" y2="190.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<text x="40.0" y="420.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">Under HTTP/2, streams exist only in HTTP; TCP sees one byte stream, and TLS sits on top as a separate handshake.</text>
<text x="40.0" y="436.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">QUIC makes streams a transport concept, encrypts nearly every header byte, and ships in the app or library — so it can evolve</text>
<text x="40.0" y="452.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">without waiting for OS kernels and middleboxes to change. UDP is just the envelope that gets it through the internet.</text>
</svg>
