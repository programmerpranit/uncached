<text x="606.0" y="262.0" font-size="10.5" fill="#7cc47f" text-anchor="start" font-weight="400">Independent deploy</text>
<text x="606.0" y="278.0" font-size="10.5" fill="#7cc47f" text-anchor="start" font-weight="400">and scaling</text>
<text x="606.0" y="302.0" font-size="10.5" fill="#e5534b" text-anchor="start" font-weight="400">Distributed</text>
<text x="606.0" y="318.0" font-size="10.5" fill="#e5534b" text-anchor="start" font-weight="400">systems tax</text>
