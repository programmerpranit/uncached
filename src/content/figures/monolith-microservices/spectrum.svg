<text x="40.0" y="385.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">more coordination in code</text>
<text x="840.0" y="385.0" font-size="10" fill="#a69d8e" text-anchor="end" font-weight="400">more coordination over the network</text>
</svg>
