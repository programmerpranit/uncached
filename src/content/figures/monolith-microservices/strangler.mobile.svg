<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360" role="img" aria-label="Strangler fig migration in three stages: put a proxy in front of the monolith, route one bounded context to a new service, and repeat until the monolith shrinks" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="360" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Strangler fig migration</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">extract one slice at a time</text>
<rect x="16.0" y="80.0" width="328.0" height="62.0" rx="3" fill="#ff5b2e" fill-opacity="0.14" stroke="#ff5b2e" stroke-width="1"/>
<text x="180.0" y="108.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">1. Facade in front</text>
<text x="180.0" y="124.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">all traffic → monolith</text>
<line x1="180.0" y1="142.0" x2="180.0" y2="154.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="16.0" y="156.0" width="328.0" height="62.0" rx="3" fill="#9b8cff" fill-opacity="0.14" stroke="#9b8cff" stroke-width="1"/>
<text x="180.0" y="184.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">2. Extract one context</text>
<text x="180.0" y="200.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">/shipping → new service</text>
<line x1="180.0" y1="218.0" x2="180.0" y2="230.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="16.0" y="232.0" width="328.0" height="62.0" rx="3" fill="#e2b45a" fill-opacity="0.14" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="260.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">3. Repeat</text>
<text x="180.0" y="276.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">monolith shrinks or stays as core</text>
<text x="16.0" y="330.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">Roll back by flipping a route.</text>
</svg>
