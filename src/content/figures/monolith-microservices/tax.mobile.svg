<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 499" width="360" height="499" role="img" aria-label="Table of what changes when a function call becomes a network call: latency, failure handling, consistency, queries, debugging, change management and operations all get harder" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="499" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">The distributed systems tax</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">what a function call becomes</text>
<rect x="16.0" y="74.0" width="328.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="0.6" stroke="none" stroke-width="1"/>
<text x="28.0" y="92.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="700">Latency</text>
<text x="28.0" y="108.0" font-size="9.5" fill="#e2b45a" text-anchor="start" font-weight="400">mono: ~ns function call</text>
<text x="28.0" y="121.0" font-size="9.5" fill="#9b8cff" text-anchor="start" font-weight="400">micro: ~ms network hop, x every hop</text>
<rect x="16.0" y="132.0" width="328.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="0.6" stroke="none" stroke-width="1"/>
<text x="28.0" y="150.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="700">Failure</text>
<text x="28.0" y="166.0" font-size="9.5" fill="#e2b45a" text-anchor="start" font-weight="400">mono: exception, same process</text>
<text x="28.0" y="179.0" font-size="9.5" fill="#9b8cff" text-anchor="start" font-weight="400">micro: timeouts, retries, partial failure</text>
<rect x="16.0" y="190.0" width="328.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="0.6" stroke="none" stroke-width="1"/>
<text x="28.0" y="208.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="700">Consistency</text>
<text x="28.0" y="224.0" font-size="9.5" fill="#e2b45a" text-anchor="start" font-weight="400">mono: one DB transaction</text>
<text x="28.0" y="237.0" font-size="9.5" fill="#9b8cff" text-anchor="start" font-weight="400">micro: sagas, outbox</text>
<rect x="16.0" y="248.0" width="328.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="0.6" stroke="none" stroke-width="1"/>
<text x="28.0" y="266.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="700">Queries</text>
<text x="28.0" y="282.0" font-size="9.5" fill="#e2b45a" text-anchor="start" font-weight="400">mono: SQL JOIN</text>
<text x="28.0" y="295.0" font-size="9.5" fill="#9b8cff" text-anchor="start" font-weight="400">micro: API composition or replicated data</text>
<rect x="16.0" y="306.0" width="328.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="0.6" stroke="none" stroke-width="1"/>
<text x="28.0" y="324.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="700">Debugging</text>
<text x="28.0" y="340.0" font-size="9.5" fill="#e2b45a" text-anchor="start" font-weight="400">mono: one stack trace</text>
<text x="28.0" y="353.0" font-size="9.5" fill="#9b8cff" text-anchor="start" font-weight="400">micro: distributed tracing</text>
<rect x="16.0" y="364.0" width="328.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="0.6" stroke="none" stroke-width="1"/>
<text x="28.0" y="382.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="700">Change</text>
<text x="28.0" y="398.0" font-size="9.5" fill="#e2b45a" text-anchor="start" font-weight="400">mono: one refactor, one deploy</text>
<text x="28.0" y="411.0" font-size="9.5" fill="#9b8cff" text-anchor="start" font-weight="400">micro: versioned contracts, ordered rollouts</text>
<rect x="16.0" y="422.0" width="328.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="0.6" stroke="none" stroke-width="1"/>
<text x="28.0" y="440.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="700">Operations</text>
<text x="28.0" y="456.0" font-size="9.5" fill="#e2b45a" text-anchor="start" font-weight="400">mono: 1 pipeline, 1 dashboard</text>
<text x="28.0" y="469.0" font-size="9.5" fill="#9b8cff" text-anchor="start" font-weight="400">micro: N pipelines, mesh</text>
</svg>
