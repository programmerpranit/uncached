<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 432" width="880" height="432" role="img" aria-label="Cache layers from the user inward: CDN, reverse proxy, in-process L1, distributed L2 such as Redis, and the database, each with typical latency" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="432" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5b2e"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Caching layers</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">each layer is faster and closer to the user, and harder to keep consistent</text>
<rect x="40.0" y="80.0" width="120.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="100.0" y="104.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Client</text>
<rect x="40.0" y="140.0" width="240.0" height="44.0" rx="3" fill="#d77fa1" fill-opacity="0.16" stroke="#d77fa1" stroke-width="1"/>
<text x="160.0" y="166.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">CDN / edge</text>
<text x="300.0" y="160.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="700">~5–30 ms from user</text>
<text x="300.0" y="176.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">public, per-URL</text>
<line x1="100.0" y1="120.0" x2="100.0" y2="138.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="40.0" y="196.0" width="240.0" height="44.0" rx="3" fill="#9b8cff" fill-opacity="0.16" stroke="#9b8cff" stroke-width="1"/>
<text x="160.0" y="222.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Reverse proxy</text>
<text x="300.0" y="216.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="700">~1 ms</text>
<text x="300.0" y="232.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">Varnish, NGINX</text>
<line x1="160.0" y1="184.0" x2="160.0" y2="194.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="40.0" y="252.0" width="240.0" height="44.0" rx="3" fill="#7cc47f" fill-opacity="0.16" stroke="#7cc47f" stroke-width="1"/>
<text x="160.0" y="278.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">In-process (L1)</text>
<text x="300.0" y="272.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="700">~100 ns</text>
<text x="300.0" y="288.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">per instance, tiny</text>
<line x1="160.0" y1="240.0" x2="160.0" y2="250.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="40.0" y="308.0" width="240.0" height="44.0" rx="3" fill="#5fb3a1" fill-opacity="0.16" stroke="#5fb3a1" stroke-width="1"/>
<text x="160.0" y="334.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Distributed (L2)</text>
<text x="300.0" y="328.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="700">~0.5–1 ms</text>
<text x="300.0" y="344.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">Redis, Memcached</text>
<line x1="160.0" y1="296.0" x2="160.0" y2="306.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="40.0" y="364.0" width="240.0" height="44.0" rx="3" fill="#e2b45a" fill-opacity="0.16" stroke="#e2b45a" stroke-width="1"/>
<text x="160.0" y="390.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Database</text>
<text x="300.0" y="384.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="700">~1–50 ms</text>
<text x="300.0" y="400.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">buffer pool, source of truth</text>
<line x1="160.0" y1="352.0" x2="160.0" y2="362.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<line x1="560.0" y1="150.0" x2="560.0" y2="400.0" stroke="#ff5b2e" stroke-width="1.4" marker-end="url(#ah1)"/>
<text x="575.0" y="170.0" font-size="11" fill="#d77fa1" text-anchor="start" font-weight="700">closer to the user:</text>
<text x="575.0" y="192.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">faster, offloads everything,</text>
<text x="575.0" y="211.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">but stale copies everywhere</text>
<text x="575.0" y="300.0" font-size="11" fill="#ff5b2e" text-anchor="start" font-weight="700">closer to the data:</text>
<text x="575.0" y="322.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">fresher, easier to invalidate,</text>
<text x="575.0" y="341.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">but every hop costs latency</text>
</svg>
