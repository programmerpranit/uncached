<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 444" width="360" height="444" role="img" aria-label="Four caching strategies: cache-aside where the app loads the cache on a miss, read-through, write-through that writes cache and database together, and write-behind that writes the database asynchronously" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="444" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Read and write strategies</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">who loads the cache?</text>
<rect x="16.0" y="76.0" width="328.0" height="80.0" rx="3" fill="#5fb3a1" fill-opacity="0.1" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="119.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="28.0" y="97.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="700">Cache-aside</text>
<text x="28.0" y="116.0" font-size="9.8" fill="#a69d8e" text-anchor="start" font-weight="400">app reads cache; on miss reads DB</text>
<text x="28.0" y="130.0" font-size="9.8" fill="#a69d8e" text-anchor="start" font-weight="400">and populates cache</text>
<text x="28.0" y="146.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="700">most common, lazy</text>
<rect x="16.0" y="164.0" width="328.0" height="80.0" rx="3" fill="#9b8cff" fill-opacity="0.1" stroke="#9b8cff" stroke-width="1"/>
<text x="180.0" y="207.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="28.0" y="185.0" font-size="12" fill="#9b8cff" text-anchor="start" font-weight="700">Read-through</text>
<text x="28.0" y="204.0" font-size="9.8" fill="#a69d8e" text-anchor="start" font-weight="400">cache library loads from DB</text>
<text x="28.0" y="218.0" font-size="9.8" fill="#a69d8e" text-anchor="start" font-weight="400">on miss, transparently</text>
<text x="28.0" y="234.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="700">simpler app code</text>
<rect x="16.0" y="252.0" width="328.0" height="80.0" rx="3" fill="#e2b45a" fill-opacity="0.1" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="295.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="28.0" y="273.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="700">Write-through</text>
<text x="28.0" y="292.0" font-size="9.8" fill="#a69d8e" text-anchor="start" font-weight="400">writes go to cache and DB</text>
<text x="28.0" y="306.0" font-size="9.8" fill="#a69d8e" text-anchor="start" font-weight="400">synchronously</text>
<text x="28.0" y="322.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="700">fresh, slower writes</text>
<rect x="16.0" y="340.0" width="328.0" height="80.0" rx="3" fill="#e5534b" fill-opacity="0.1" stroke="#e5534b" stroke-width="1"/>
<text x="180.0" y="383.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="28.0" y="361.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="700">Write-behind</text>
<text x="28.0" y="380.0" font-size="9.8" fill="#a69d8e" text-anchor="start" font-weight="400">writes go to cache, DB</text>
<text x="28.0" y="394.0" font-size="9.8" fill="#a69d8e" text-anchor="start" font-weight="400">updated asynchronously</text>
<text x="28.0" y="410.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="700">fast, can lose data</text>
</svg>
