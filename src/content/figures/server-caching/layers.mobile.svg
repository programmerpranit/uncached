<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 449" width="360" height="449" role="img" aria-label="Cache layers from the user inward: CDN, reverse proxy, in-process L1, distributed L2 such as Redis, and the database, each with typical latency" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="449" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Caching layers</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">closer = faster, harder to invalidate</text>
<rect x="16.0" y="76.0" width="328.0" height="52.0" rx="3" fill="#d77fa1" fill-opacity="0.14" stroke="#d77fa1" stroke-width="1"/>
<text x="180.0" y="105.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="28.0" y="97.0" font-size="11.5" fill="#d77fa1" text-anchor="start" font-weight="700">CDN / edge</text>
<text x="332.0" y="97.0" font-size="10" fill="#ede6d8" text-anchor="end" font-weight="400">~5–30 ms from user</text>
<text x="28.0" y="116.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">public, per-URL</text>
<rect x="16.0" y="138.0" width="328.0" height="52.0" rx="3" fill="#9b8cff" fill-opacity="0.14" stroke="#9b8cff" stroke-width="1"/>
<text x="180.0" y="167.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="28.0" y="159.0" font-size="11.5" fill="#9b8cff" text-anchor="start" font-weight="700">Reverse proxy</text>
<text x="332.0" y="159.0" font-size="10" fill="#ede6d8" text-anchor="end" font-weight="400">~1 ms</text>
<text x="28.0" y="178.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">Varnish, NGINX</text>
<rect x="16.0" y="200.0" width="328.0" height="52.0" rx="3" fill="#7cc47f" fill-opacity="0.14" stroke="#7cc47f" stroke-width="1"/>
<text x="180.0" y="229.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="28.0" y="221.0" font-size="11.5" fill="#7cc47f" text-anchor="start" font-weight="700">In-process (L1)</text>
<text x="332.0" y="221.0" font-size="10" fill="#ede6d8" text-anchor="end" font-weight="400">~100 ns</text>
<text x="28.0" y="240.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">per instance, tiny</text>
<rect x="16.0" y="262.0" width="328.0" height="52.0" rx="3" fill="#5fb3a1" fill-opacity="0.14" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="291.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="28.0" y="283.0" font-size="11.5" fill="#5fb3a1" text-anchor="start" font-weight="700">Distributed (L2)</text>
<text x="332.0" y="283.0" font-size="10" fill="#ede6d8" text-anchor="end" font-weight="400">~0.5–1 ms</text>
<text x="28.0" y="302.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">Redis, Memcached</text>
<rect x="16.0" y="324.0" width="328.0" height="52.0" rx="3" fill="#e2b45a" fill-opacity="0.14" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="353.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="28.0" y="345.0" font-size="11.5" fill="#e2b45a" text-anchor="start" font-weight="700">Database</text>
<text x="332.0" y="345.0" font-size="10" fill="#ede6d8" text-anchor="end" font-weight="400">~1–50 ms</text>
<text x="28.0" y="364.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">buffer pool, source of truth</text>
<text x="16.0" y="400.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">Top: fastest, stalest.</text>
<text x="16.0" y="419.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">Bottom: freshest, slowest.</text>
</svg>
