<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 379" width="880" height="379" role="img" aria-label="Illustrative sizes for one photo: PNG about 1.4 MB, JPEG about 240 KB, WebP about 165 KB and AVIF about 115 KB at similar visual quality" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="379" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Same photo, different formats</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">approximate file size at similar visual quality</text>
<text x="40.0" y="122.0" font-size="13" fill="#e5534b" text-anchor="start" font-weight="700">PNG</text>
<text x="40.0" y="138.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">lossless, for graphics</text>
<rect x="220.0" y="108.0" width="560.0" height="28.0" rx="4" fill="#e5534b" fill-opacity="0.35" stroke="#e5534b" stroke-width="1.2"/>
<text x="788.0" y="127.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">1,400 KB</text>
<text x="40.0" y="174.0" font-size="13" fill="#e2b45a" text-anchor="start" font-weight="700">JPEG</text>
<text x="40.0" y="190.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">universal baseline</text>
<rect x="220.0" y="160.0" width="96.0" height="28.0" rx="4" fill="#e2b45a" fill-opacity="0.35" stroke="#e2b45a" stroke-width="1.2"/>
<text x="324.0" y="179.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">240 KB</text>
<text x="40.0" y="226.0" font-size="13" fill="#5fb3a1" text-anchor="start" font-weight="700">WebP</text>
<text x="40.0" y="242.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">~25–35% smaller</text>
<rect x="220.0" y="212.0" width="66.0" height="28.0" rx="4" fill="#5fb3a1" fill-opacity="0.35" stroke="#5fb3a1" stroke-width="1.2"/>
<text x="294.0" y="231.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">165 KB</text>
<text x="40.0" y="278.0" font-size="13" fill="#7cc47f" text-anchor="start" font-weight="700">AVIF</text>
<text x="40.0" y="294.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">~50% smaller, slower encode</text>
<rect x="220.0" y="264.0" width="46.0" height="28.0" rx="4" fill="#7cc47f" fill-opacity="0.35" stroke="#7cc47f" stroke-width="1.2"/>
<text x="274.0" y="283.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">115 KB</text>
<text x="40.0" y="330.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Illustrative numbers for a 1600 × 900 photo. Real savings depend on the image and the encoder settings.</text>
<text x="40.0" y="349.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">PNG is the wrong choice for photos; keep it (or SVG) for logos, screenshots and flat graphics.</text>
</svg>
