<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 397" width="360" height="397" role="img" aria-label="Illustrative sizes for one photo: PNG about 1.4 MB, JPEG about 240 KB, WebP about 165 KB and AVIF about 115 KB at similar visual quality" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="397" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Same photo, four formats</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">approx. size, similar quality</text>
<text x="16.0" y="102.0" font-size="12.5" fill="#e5534b" text-anchor="start" font-weight="700">PNG</text>
<text x="80.0" y="102.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">lossless, for graphics</text>
<rect x="16.0" y="112.0" width="260.0" height="22.0" rx="4" fill="#e5534b" fill-opacity="0.35" stroke="#e5534b" stroke-width="1.2"/>
<text x="284.0" y="128.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">1,400 KB</text>
<text x="16.0" y="164.0" font-size="12.5" fill="#e2b45a" text-anchor="start" font-weight="700">JPEG</text>
<text x="80.0" y="164.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">universal baseline</text>
<rect x="16.0" y="174.0" width="44.6" height="22.0" rx="4" fill="#e2b45a" fill-opacity="0.35" stroke="#e2b45a" stroke-width="1.2"/>
<text x="68.6" y="190.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">240 KB</text>
<text x="16.0" y="226.0" font-size="12.5" fill="#5fb3a1" text-anchor="start" font-weight="700">WebP</text>
<text x="80.0" y="226.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">~25–35% smaller</text>
<rect x="16.0" y="236.0" width="30.6" height="22.0" rx="4" fill="#5fb3a1" fill-opacity="0.35" stroke="#5fb3a1" stroke-width="1.2"/>
<text x="54.6" y="252.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">165 KB</text>
<text x="16.0" y="288.0" font-size="12.5" fill="#7cc47f" text-anchor="start" font-weight="700">AVIF</text>
<text x="80.0" y="288.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">~50% smaller, slower encode</text>
<rect x="16.0" y="298.0" width="21.4" height="22.0" rx="4" fill="#7cc47f" fill-opacity="0.35" stroke="#7cc47f" stroke-width="1.2"/>
<text x="45.4" y="314.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">115 KB</text>
<text x="16.0" y="348.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Illustrative, 1600 × 900 photo.</text>
<text x="16.0" y="367.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Use PNG or SVG for flat graphics.</text>
</svg>
