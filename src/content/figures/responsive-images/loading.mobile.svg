<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 374" width="360" height="374" role="img" aria-label="The above-the-fold hero image loads eagerly with high fetch priority, below-the-fold images use loading lazy, and every image declares width and height so space is reserved before it loads" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="374" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Loading order</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">priority, lazy, reserved space</text>
<rect x="16.0" y="84.0" width="328.0" height="82.0" rx="8" fill="#7cc47f" fill-opacity="0.1" stroke="#7cc47f" stroke-width="1.3"/>
<text x="28.0" y="106.0" font-size="12" fill="#7cc47f" text-anchor="start" font-weight="700">Above the fold: hero / LCP</text>
<text x="28.0" y="128.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">eager + fetchpriority="high"</text>
<text x="28.0" y="145.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">never lazy; preload if hidden</text>
<rect x="16.0" y="176.0" width="328.0" height="82.0" rx="8" fill="#e2b45a" fill-opacity="0.1" stroke="#e2b45a" stroke-width="1.3"/>
<text x="28.0" y="198.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="700">Below the fold</text>
<text x="28.0" y="220.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">loading="lazy": fetched as it</text>
<text x="28.0" y="237.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">approaches the viewport</text>
<rect x="16.0" y="268.0" width="328.0" height="82.0" rx="8" fill="#9b8cff" fill-opacity="0.1" stroke="#9b8cff" stroke-width="1.3"/>
<text x="28.0" y="290.0" font-size="12" fill="#9b8cff" text-anchor="start" font-weight="700">Every image</text>
<text x="28.0" y="312.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">width + height (or aspect-ratio)</text>
<text x="28.0" y="329.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">reserve space: no layout shift</text>
</svg>
