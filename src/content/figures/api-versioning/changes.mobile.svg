<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 567" width="360" height="567" role="img" aria-label="Backward compatible changes such as adding optional fields or endpoints versus breaking changes such as removing or renaming fields, changing types or tightening validation" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="567" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Safe vs breaking</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">what old clients survive</text>
<rect x="16.0" y="90.0" width="328.0" height="194.0" rx="10" fill="#7cc47f" fill-opacity="0.08" stroke="#7cc47f" stroke-width="1.2"/>
<text x="28.0" y="114.0" font-size="12.5" fill="#7cc47f" text-anchor="start" font-weight="700">Compatible: ship any time</text>
<text x="28.0" y="138.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">+ Add an optional request field</text>
<text x="28.0" y="160.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">+ Add a response field</text>
<text x="28.0" y="182.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">+ Add a new endpoint or method</text>
<text x="28.0" y="204.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">+ Add an enum value (if clients</text>
<text x="41.0" y="226.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">were told to tolerate unknowns)</text>
<text x="28.0" y="248.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">+ Relax a validation rule</text>
<text x="28.0" y="270.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">+ Make a required input optional</text>
<rect x="16.0" y="298.0" width="328.0" height="194.0" rx="10" fill="#e5534b" fill-opacity="0.08" stroke="#e5534b" stroke-width="1.2"/>
<text x="28.0" y="322.0" font-size="12.5" fill="#e5534b" text-anchor="start" font-weight="700">Breaking: new version</text>
<text x="28.0" y="346.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">× Remove or rename a field</text>
<text x="28.0" y="368.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">× Change a field type (int → string)</text>
<text x="28.0" y="390.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">× Make an optional input required</text>
<text x="28.0" y="412.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">× Tighten validation or limits</text>
<text x="28.0" y="434.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">× Change error codes or status</text>
<text x="28.0" y="456.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">× Change default behaviour or units</text>
<text x="28.0" y="478.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">× Change pagination or ordering</text>
<text x="16.0" y="518.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">If a correct old client could break,</text>
<text x="16.0" y="537.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">it is a breaking change.</text>
</svg>
