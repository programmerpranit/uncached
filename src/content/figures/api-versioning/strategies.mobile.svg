<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480" role="img" aria-label="Three versioning schemes: a version in the URL path, in an Accept header media type, or a date-pinned version header, each with trade-offs" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="480" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Where the version lives</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">three common schemes</text>
<rect x="16.0" y="90.0" width="328.0" height="104.0" rx="10" fill="#ff5b2e" fill-opacity="0.08" stroke="#ff5b2e" stroke-width="1.2"/>
<text x="28.0" y="112.0" font-size="12.5" fill="#ff5b2e" text-anchor="start" font-weight="700">URL path</text>
<text x="28.0" y="134.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">GET /v2/orders/812</text>
<text x="28.0" y="158.0" font-size="10.5" fill="#7cc47f" text-anchor="start" font-weight="400">+ obvious, cacheable, easy to route</text>
<text x="28.0" y="178.0" font-size="10.5" fill="#e5534b" text-anchor="start" font-weight="400">− whole API jumps at once; links break</text>
<rect x="16.0" y="206.0" width="328.0" height="104.0" rx="10" fill="#9b8cff" fill-opacity="0.08" stroke="#9b8cff" stroke-width="1.2"/>
<text x="28.0" y="228.0" font-size="12.5" fill="#9b8cff" text-anchor="start" font-weight="700">Header / media type</text>
<text x="28.0" y="250.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">Accept: application/vnd.shop.v2+json</text>
<text x="28.0" y="274.0" font-size="10.5" fill="#7cc47f" text-anchor="start" font-weight="400">+ clean URLs, per-resource versions</text>
<text x="28.0" y="294.0" font-size="10.5" fill="#e5534b" text-anchor="start" font-weight="400">− hidden in curl; caches need Vary</text>
<rect x="16.0" y="322.0" width="328.0" height="104.0" rx="10" fill="#5fb3a1" fill-opacity="0.08" stroke="#5fb3a1" stroke-width="1.2"/>
<text x="28.0" y="344.0" font-size="12.5" fill="#5fb3a1" text-anchor="start" font-weight="700">Date-pinned</text>
<text x="28.0" y="366.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">Api-Version: 2026-03-01</text>
<text x="28.0" y="390.0" font-size="10.5" fill="#7cc47f" text-anchor="start" font-weight="400">+ small changes, per-account pinning</text>
<text x="28.0" y="410.0" font-size="10.5" fill="#e5534b" text-anchor="start" font-weight="400">− server must run a transform chain</text>
<text x="16.0" y="450.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">Version rarely; evolve additively.</text>
</svg>
