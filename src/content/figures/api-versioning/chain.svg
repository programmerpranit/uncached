<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 437" width="880" height="437" role="img" aria-label="Date-pinned versioning: the handler produces only the latest response shape, and a chain of small adapters transforms it back step by step for clients pinned to older versions" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="437" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Date-pinned versions: one codebase, many shapes</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">handlers speak only the latest; adapters translate for older pins</text>
<rect x="40.0" y="110.0" width="180.0" height="56.0" rx="3" fill="#5fb3a1" fill-opacity="0.2" stroke="#5fb3a1" stroke-width="1"/>
<text x="130.0" y="135.0" font-size="13" fill="#ede6d8" text-anchor="middle" font-weight="600">Handler</text>
<text x="130.0" y="151.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">latest shape only</text>
<line x1="220.0" y1="138.0" x2="270.0" y2="138.0" stroke="#a69d8e" stroke-width="1.4" marker-end="url(#ah0)"/>
<rect x="270.0" y="100.0" width="170.0" height="78.0" rx="8" fill="#9b8cff" fill-opacity="0.12" stroke="#9b8cff" stroke-width="1.2"/>
<text x="282.0" y="122.0" font-size="11.5" fill="#9b8cff" text-anchor="start" font-weight="700">down to 2025-11-15</text>
<text x="282.0" y="145.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">amount</text>
<text x="282.0" y="163.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">→ {value, currency}</text>
<line x1="440.0" y1="138.0" x2="460.0" y2="138.0" stroke="#a69d8e" stroke-width="1.4" marker-end="url(#ah0)"/>
<rect x="460.0" y="100.0" width="170.0" height="78.0" rx="8" fill="#e2b45a" fill-opacity="0.12" stroke="#e2b45a" stroke-width="1.2"/>
<text x="472.0" y="122.0" font-size="11.5" fill="#e2b45a" text-anchor="start" font-weight="700">down to 2025-06-01</text>
<text x="472.0" y="145.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">status "canceled"</text>
<text x="472.0" y="163.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">→ "cancelled"</text>
<line x1="630.0" y1="138.0" x2="650.0" y2="138.0" stroke="#a69d8e" stroke-width="1.4" marker-end="url(#ah0)"/>
<rect x="650.0" y="100.0" width="170.0" height="78.0" rx="8" fill="#ff5b2e" fill-opacity="0.12" stroke="#ff5b2e" stroke-width="1.2"/>
<text x="662.0" y="122.0" font-size="11.5" fill="#ff5b2e" text-anchor="start" font-weight="700">down to 2024-09-10</text>
<text x="662.0" y="145.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">customer inlined</text>
<text x="662.0" y="163.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">→ customer_id</text>
<text x="40.0" y="230.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">Client pinned 2026-03-01</text>
<text x="240.0" y="230.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">no adapters run</text>
<rect x="270.0" y="238.0" width="4.0" height="6.0" rx="3" fill="#5fb3a1" fill-opacity="0.8" stroke="none" stroke-width="1"/>
<text x="40.0" y="280.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">Client pinned 2025-06-01</text>
<text x="240.0" y="280.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">2 adapters run</text>
<rect x="270.0" y="288.0" width="360.0" height="6.0" rx="3" fill="#e2b45a" fill-opacity="0.8" stroke="none" stroke-width="1"/>
<text x="40.0" y="330.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">Client pinned 2024-09-10</text>
<text x="240.0" y="330.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">3 adapters run</text>
<rect x="270.0" y="338.0" width="550.0" height="6.0" rx="3" fill="#ff5b2e" fill-opacity="0.8" stroke="none" stroke-width="1"/>
<text x="40.0" y="388.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Each breaking change ships as one small adapter. Old clients keep their pinned shape; new accounts</text>
<text x="40.0" y="407.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">get the latest. Adapters are deleted once no account is pinned before them.</text>
</svg>
