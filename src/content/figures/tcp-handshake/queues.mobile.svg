<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 454" width="360" height="454" role="img" aria-label="A listening socket has a SYN queue for half-open connections and an accept queue for established ones; SYN floods fill the first, and a slow application overflows the second" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="454" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Inside a listening socket</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">SYN queue → accept queue → accept()</text>
<rect x="60.0" y="72.0" width="240.0" height="42.0" rx="3" fill="#5fb3a1" fill-opacity="0.18" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="90.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">clients</text>
<text x="180.0" y="106.0" font-size="9.5" fill="#a69d8e" text-anchor="middle" font-weight="400">send SYN</text>
<line x1="180.0" y1="114.0" x2="180.0" y2="134.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="60.0" y="134.0" width="240.0" height="42.0" rx="3" fill="#9b8cff" fill-opacity="0.18" stroke="#9b8cff" stroke-width="1"/>
<text x="180.0" y="152.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">SYN queue</text>
<text x="180.0" y="168.0" font-size="9.5" fill="#a69d8e" text-anchor="middle" font-weight="400">half-open (SYN_RCVD)</text>
<line x1="180.0" y1="176.0" x2="180.0" y2="196.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="60.0" y="196.0" width="240.0" height="42.0" rx="3" fill="#7cc47f" fill-opacity="0.18" stroke="#7cc47f" stroke-width="1"/>
<text x="180.0" y="214.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">accept queue</text>
<text x="180.0" y="230.0" font-size="9.5" fill="#a69d8e" text-anchor="middle" font-weight="400">ESTABLISHED, waiting</text>
<line x1="180.0" y1="238.0" x2="180.0" y2="258.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="60.0" y="258.0" width="240.0" height="42.0" rx="3" fill="#e2b45a" fill-opacity="0.18" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="276.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">accept()</text>
<text x="180.0" y="292.0" font-size="9.5" fill="#a69d8e" text-anchor="middle" font-weight="400">app takes the socket</text>
<text x="186.0" y="128.0" font-size="8.5" fill="#a69d8e" text-anchor="start" font-weight="400">SYN-ACK sent</text>
<text x="186.0" y="190.0" font-size="8.5" fill="#a69d8e" text-anchor="start" font-weight="400">ACK received</text>
<text x="16.0" y="334.0" font-size="9.5" fill="#e5534b" text-anchor="start" font-weight="700">SYN flood</text>
<text x="16.0" y="349.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">Spoofed SYNs fill the SYN queue.</text>
<text x="16.0" y="364.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">Fix: SYN cookies (state in ISN).</text>
<text x="16.0" y="394.0" font-size="9.5" fill="#e2b45a" text-anchor="start" font-weight="700">Accept queue full</text>
<text x="16.0" y="409.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">App too slow to accept(); final ACK</text>
<text x="16.0" y="424.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">dropped, requests stall.</text>
</svg>
