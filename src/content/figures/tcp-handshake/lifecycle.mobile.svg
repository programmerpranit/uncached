<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 618" width="360" height="618" role="img" aria-label="Sequence diagram: SYN, SYN-ACK and ACK open the connection, data flows, then FIN, ACK, FIN, ACK close it, with each side&#x27;s TCP state labelled and the client ending in TIME_WAIT" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="618" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b8cff"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2b45a"/></marker></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">A TCP connection, open to close</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">3-way open, 4-way close</text>
<rect x="60.0" y="78.0" width="80.0" height="28.0" rx="3" fill="#5fb3a1" fill-opacity="0.2" stroke="#5fb3a1" stroke-width="1"/>
<text x="100.0" y="95.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">client</text>
<rect x="220.0" y="78.0" width="80.0" height="28.0" rx="3" fill="#9b8cff" fill-opacity="0.2" stroke="#9b8cff" stroke-width="1"/>
<text x="260.0" y="95.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">server</text>
<line x1="100.0" y1="136.0" x2="260.0" y2="152.0" stroke="#5fb3a1" stroke-width="1.6" marker-end="url(#ah0)"/>
<text x="180.0" y="132.0" font-size="9.5" fill="#5fb3a1" text-anchor="middle" font-weight="400">SYN seq=x</text>
<text x="92.0" y="140.0" font-size="9" fill="#ede6d8" text-anchor="end" font-weight="600">SYN_SENT</text>
<text x="268.0" y="156.0" font-size="9" fill="#ede6d8" text-anchor="start" font-weight="600">LISTEN</text>
<line x1="260.0" y1="180.0" x2="100.0" y2="196.0" stroke="#9b8cff" stroke-width="1.6" marker-end="url(#ah1)"/>
<text x="180.0" y="176.0" font-size="9.5" fill="#9b8cff" text-anchor="middle" font-weight="400">SYN-ACK seq=y ack=x+1</text>
<text x="268.0" y="184.0" font-size="9" fill="#ede6d8" text-anchor="start" font-weight="600">SYN_RCVD</text>
<line x1="100.0" y1="224.0" x2="260.0" y2="240.0" stroke="#5fb3a1" stroke-width="1.6" marker-end="url(#ah0)"/>
<text x="180.0" y="220.0" font-size="9.5" fill="#5fb3a1" text-anchor="middle" font-weight="400">ACK ack=y+1</text>
<text x="92.0" y="228.0" font-size="9" fill="#ede6d8" text-anchor="end" font-weight="600">ESTABLISHED</text>
<rect x="100.0" y="262.0" width="160.0" height="30.0" rx="2" fill="#7cc47f" fill-opacity="0.12" stroke="none" stroke-width="1"/>
<text x="180.0" y="281.0" font-size="9.5" fill="#7cc47f" text-anchor="middle" font-weight="400">data ⇄ (ESTABLISHED)</text>
<line x1="100.0" y1="312.0" x2="260.0" y2="328.0" stroke="#e2b45a" stroke-width="1.6" marker-end="url(#ah2)"/>
<text x="180.0" y="308.0" font-size="9.5" fill="#e2b45a" text-anchor="middle" font-weight="400">FIN</text>
<text x="92.0" y="316.0" font-size="9" fill="#ede6d8" text-anchor="end" font-weight="600">FIN_WAIT_1</text>
<line x1="260.0" y1="356.0" x2="100.0" y2="372.0" stroke="#e2b45a" stroke-width="1.6" marker-end="url(#ah2)"/>
<text x="180.0" y="352.0" font-size="9.5" fill="#e2b45a" text-anchor="middle" font-weight="400">ACK</text>
<text x="92.0" y="376.0" font-size="9" fill="#ede6d8" text-anchor="end" font-weight="600">FIN_WAIT_2</text>
<text x="268.0" y="360.0" font-size="9" fill="#ede6d8" text-anchor="start" font-weight="600">CLOSE_WAIT</text>
<line x1="260.0" y1="400.0" x2="100.0" y2="416.0" stroke="#e2b45a" stroke-width="1.6" marker-end="url(#ah2)"/>
<text x="180.0" y="396.0" font-size="9.5" fill="#e2b45a" text-anchor="middle" font-weight="400">FIN</text>
<text x="268.0" y="404.0" font-size="9" fill="#ede6d8" text-anchor="start" font-weight="600">LAST_ACK</text>
<line x1="100.0" y1="444.0" x2="260.0" y2="460.0" stroke="#e2b45a" stroke-width="1.6" marker-end="url(#ah2)"/>
<text x="180.0" y="440.0" font-size="9.5" fill="#e2b45a" text-anchor="middle" font-weight="400">ACK</text>
<text x="92.0" y="448.0" font-size="9" fill="#ede6d8" text-anchor="end" font-weight="600">TIME_WAIT</text>
<text x="268.0" y="464.0" font-size="9" fill="#ede6d8" text-anchor="start" font-weight="600">CLOSED</text>
<line x1="100.0" y1="106.0" x2="100.0" y2="518.0" stroke="#4a4136" stroke-width="1.2"/>
<line x1="260.0" y1="106.0" x2="260.0" y2="518.0" stroke="#4a4136" stroke-width="1.2"/>
<text x="92.0" y="512.0" font-size="9" fill="#a69d8e" text-anchor="end" font-weight="400">wait 2×MSL</text>
<text x="92.0" y="528.0" font-size="9" fill="#a69d8e" text-anchor="end" font-weight="400">→ CLOSED</text>
<text x="16.0" y="558.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">Client can send data with the</text>
<text x="16.0" y="573.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">3rd segment: 1 RTT before</text>
<text x="16.0" y="588.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">the first request.</text>
</svg>
