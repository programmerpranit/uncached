<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 664" width="880" height="664" role="img" aria-label="TCP state machine: CLOSED to SYN_SENT on connect or LISTEN on listen, SYN_RCVD, ESTABLISHED, then FIN_WAIT_1, FIN_WAIT_2 and TIME_WAIT for the active closer and CLOSE_WAIT and LAST_ACK for the passive closer" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="664" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">The TCP state machine (simplified)</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">each arrow is "event / action"; the rare simultaneous-open and CLOSING paths are omitted</text>
<rect x="355.0" y="80.0" width="170.0" height="38.0" rx="3" fill="#a69d8e" fill-opacity="0.18" stroke="#a69d8e" stroke-width="1"/>
<text x="440.0" y="103.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">CLOSED</text>
<rect x="70.0" y="160.0" width="170.0" height="38.0" rx="3" fill="#5fb3a1" fill-opacity="0.18" stroke="#5fb3a1" stroke-width="1"/>
<text x="155.0" y="183.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">SYN_SENT</text>
<rect x="640.0" y="160.0" width="170.0" height="38.0" rx="3" fill="#9b8cff" fill-opacity="0.18" stroke="#9b8cff" stroke-width="1"/>
<text x="725.0" y="183.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">LISTEN</text>
<rect x="640.0" y="240.0" width="170.0" height="38.0" rx="3" fill="#9b8cff" fill-opacity="0.18" stroke="#9b8cff" stroke-width="1"/>
<text x="725.0" y="263.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">SYN_RCVD</text>
<rect x="355.0" y="320.0" width="170.0" height="38.0" rx="3" fill="#7cc47f" fill-opacity="0.18" stroke="#7cc47f" stroke-width="1"/>
<text x="440.0" y="343.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">ESTABLISHED</text>
<rect x="70.0" y="400.0" width="170.0" height="38.0" rx="3" fill="#e2b45a" fill-opacity="0.18" stroke="#e2b45a" stroke-width="1"/>
<text x="155.0" y="423.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">FIN_WAIT_1</text>
<rect x="70.0" y="470.0" width="170.0" height="38.0" rx="3" fill="#e2b45a" fill-opacity="0.18" stroke="#e2b45a" stroke-width="1"/>
<text x="155.0" y="493.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">FIN_WAIT_2</text>
<rect x="70.0" y="540.0" width="170.0" height="38.0" rx="3" fill="#e2b45a" fill-opacity="0.18" stroke="#e2b45a" stroke-width="1"/>
<text x="155.0" y="563.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">TIME_WAIT</text>
<rect x="640.0" y="400.0" width="170.0" height="38.0" rx="3" fill="#e2b45a" fill-opacity="0.18" stroke="#e2b45a" stroke-width="1"/>
<text x="725.0" y="423.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">CLOSE_WAIT</text>
<rect x="640.0" y="470.0" width="170.0" height="38.0" rx="3" fill="#e2b45a" fill-opacity="0.18" stroke="#e2b45a" stroke-width="1"/>
<text x="725.0" y="493.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">LAST_ACK</text>
<rect x="355.0" y="540.0" width="170.0" height="38.0" rx="3" fill="#a69d8e" fill-opacity="0.18" stroke="#a69d8e" stroke-width="1"/>
<text x="440.0" y="563.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">CLOSED</text>
<line x1="440.0" y1="118.0" x2="155.0" y2="160.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<text x="297.5" y="130.0" font-size="9.5" fill="#a69d8e" text-anchor="middle" font-weight="400">connect() / SYN</text>
<line x1="440.0" y1="118.0" x2="725.0" y2="160.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<text x="582.5" y="130.0" font-size="9.5" fill="#a69d8e" text-anchor="middle" font-weight="400">listen()</text>
<line x1="725.0" y1="198.0" x2="725.0" y2="240.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<text x="731.0" y="223.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">SYN / SYN-ACK</text>
<line x1="155.0" y1="198.0" x2="355.0" y2="339.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<text x="263.0" y="272.5" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">SYN-ACK / ACK</text>
<line x1="725.0" y1="278.0" x2="525.0" y2="339.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<text x="625.0" y="299.5" font-size="9.5" fill="#a69d8e" text-anchor="middle" font-weight="400">ACK</text>
<line x1="440.0" y1="358.0" x2="155.0" y2="400.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<text x="297.5" y="370.0" font-size="9.5" fill="#a69d8e" text-anchor="middle" font-weight="400">close() / FIN</text>
<line x1="440.0" y1="358.0" x2="725.0" y2="400.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<text x="582.5" y="370.0" font-size="9.5" fill="#a69d8e" text-anchor="middle" font-weight="400">FIN / ACK</text>
<line x1="155.0" y1="438.0" x2="155.0" y2="470.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<text x="161.0" y="458.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">ACK</text>
<line x1="155.0" y1="508.0" x2="155.0" y2="540.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<text x="161.0" y="528.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">FIN / ACK</text>
<line x1="725.0" y1="438.0" x2="725.0" y2="470.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<text x="731.0" y="458.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">close() / FIN</text>
<line x1="725.0" y1="508.0" x2="525.0" y2="559.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<text x="625.0" y="524.5" font-size="9.5" fill="#a69d8e" text-anchor="middle" font-weight="400">ACK</text>
<line x1="240.0" y1="559.0" x2="355.0" y2="559.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<text x="297.5" y="553.0" font-size="9.5" fill="#a69d8e" text-anchor="middle" font-weight="400">after 2×MSL</text>
<text x="440.0" y="616.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">Active closer: FIN_WAIT_1 → FIN_WAIT_2 → TIME_WAIT.   Passive closer: CLOSE_WAIT → LAST_ACK.</text>
<text x="440.0" y="634.0" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="400">Thousands of CLOSE_WAIT sockets = your app forgot to call close(). Thousands of TIME_WAIT = you close lots of short connections.</text>
</svg>
