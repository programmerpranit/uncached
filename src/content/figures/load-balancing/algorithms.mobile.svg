<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" width="360" height="560" role="img" aria-label="Round robin, weighted round robin, least connections, least latency, power of two choices, hashing" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="560" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Common algorithms</text>
<rect x="16.0" y="64.0" width="328.0" height="72.0" rx="3" fill="#5fb3a1" fill-opacity="0.12" stroke="#5fb3a1" stroke-width="1"/>
<text x="28.0" y="86.0" font-size="12.5" fill="#5fb3a1" text-anchor="start" font-weight="700">Round robin</text>
<text x="28.0" y="106.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">next backend in turn</text>
<text x="28.0" y="124.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">no state; ignores load</text>
<rect x="16.0" y="144.0" width="328.0" height="72.0" rx="3" fill="#5fb3a1" fill-opacity="0.12" stroke="#5fb3a1" stroke-width="1"/>
<text x="28.0" y="166.0" font-size="12.5" fill="#5fb3a1" text-anchor="start" font-weight="700">Weighted RR</text>
<text x="28.0" y="186.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">more turns for bigger hosts</text>
<text x="28.0" y="204.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">static weights</text>
<rect x="16.0" y="224.0" width="328.0" height="72.0" rx="3" fill="#e2b45a" fill-opacity="0.12" stroke="#e2b45a" stroke-width="1"/>
<text x="28.0" y="246.0" font-size="12.5" fill="#e2b45a" text-anchor="start" font-weight="700">Least connections</text>
<text x="28.0" y="266.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">fewest active requests</text>
<text x="28.0" y="284.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">needs global view</text>
<rect x="16.0" y="304.0" width="328.0" height="72.0" rx="3" fill="#e2b45a" fill-opacity="0.12" stroke="#e2b45a" stroke-width="1"/>
<text x="28.0" y="326.0" font-size="12.5" fill="#e2b45a" text-anchor="start" font-weight="700">Least latency / EWMA</text>
<text x="28.0" y="346.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">fastest recent responses</text>
<text x="28.0" y="364.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">can herd; needs care</text>
<rect x="16.0" y="384.0" width="328.0" height="72.0" rx="3" fill="#ff5b2e" fill-opacity="0.12" stroke="#ff5b2e" stroke-width="1"/>
<text x="28.0" y="406.0" font-size="12.5" fill="#ff5b2e" text-anchor="start" font-weight="700">Power of two choices</text>
<text x="28.0" y="426.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">sample 2, take the less loaded</text>
<text x="28.0" y="444.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">near-optimal, cheap</text>
<rect x="16.0" y="464.0" width="328.0" height="72.0" rx="3" fill="#9b8cff" fill-opacity="0.12" stroke="#9b8cff" stroke-width="1"/>
<text x="28.0" y="486.0" font-size="12.5" fill="#9b8cff" text-anchor="start" font-weight="700">Hashing</text>
<text x="28.0" y="506.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">hash(key) → backend</text>
<text x="28.0" y="524.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">affinity; skew risk</text>
</svg>
