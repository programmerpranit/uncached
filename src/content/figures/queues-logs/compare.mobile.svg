<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 510" width="360" height="510" role="img" aria-label="Comparison of message queues and event logs" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="510" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Queue vs log at a glance</text>
<text x="16.0" y="70.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="600">after consumption</text>
<text x="16.0" y="90.0" font-size="11.5" fill="#e2b45a" text-anchor="start" font-weight="400">Q: deleted</text>
<text x="16.0" y="108.0" font-size="11.5" fill="#9b8cff" text-anchor="start" font-weight="400">L: retained</text>
<text x="16.0" y="128.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="600">consumers</text>
<text x="16.0" y="148.0" font-size="11.5" fill="#e2b45a" text-anchor="start" font-weight="400">Q: compete for messages</text>
<text x="16.0" y="166.0" font-size="11.5" fill="#9b8cff" text-anchor="start" font-weight="400">L: independent groups</text>
<text x="16.0" y="186.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="600">replay</text>
<text x="16.0" y="206.0" font-size="11.5" fill="#e2b45a" text-anchor="start" font-weight="400">Q: no (DLQ only)</text>
<text x="16.0" y="224.0" font-size="11.5" fill="#9b8cff" text-anchor="start" font-weight="400">L: yes, rewind offset</text>
<text x="16.0" y="244.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="600">ordering</text>
<text x="16.0" y="264.0" font-size="11.5" fill="#e2b45a" text-anchor="start" font-weight="400">Q: weak, per queue</text>
<text x="16.0" y="282.0" font-size="11.5" fill="#9b8cff" text-anchor="start" font-weight="400">L: strict per partition</text>
<text x="16.0" y="302.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="600">per-message routing</text>
<text x="16.0" y="322.0" font-size="11.5" fill="#e2b45a" text-anchor="start" font-weight="400">Q: rich (exchanges, priorities)</text>
<text x="16.0" y="340.0" font-size="11.5" fill="#9b8cff" text-anchor="start" font-weight="400">L: by key → partition</text>
<text x="16.0" y="360.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="600">slow message</text>
<text x="16.0" y="380.0" font-size="11.5" fill="#e2b45a" text-anchor="start" font-weight="400">Q: blocks only itself</text>
<text x="16.0" y="398.0" font-size="11.5" fill="#9b8cff" text-anchor="start" font-weight="400">L: blocks its partition</text>
<text x="16.0" y="418.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="600">scale unit</text>
<text x="16.0" y="438.0" font-size="11.5" fill="#e2b45a" text-anchor="start" font-weight="400">Q: consumers</text>
<text x="16.0" y="456.0" font-size="11.5" fill="#9b8cff" text-anchor="start" font-weight="400">L: partitions</text>
<text x="16.0" y="480.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">Q = queue (RabbitMQ, SQS) · L = log (Kafka)</text>
</svg>
