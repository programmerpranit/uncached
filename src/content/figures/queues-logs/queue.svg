<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 381" width="880" height="381" role="img" aria-label="A message queue delivers each message to one consumer and deletes it after acknowledgement" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="381" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">A message queue: deliver, ack, delete</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">competing consumers share the work</text>
<rect x="40.0" y="130.0" width="120.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="100.0" y="159.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">producer</text>
<rect x="220.0" y="120.0" width="300.0" height="70.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="232.0" y="112.0" font-size="11" fill="#e2b45a" text-anchor="start" font-weight="600">queue</text>
<rect x="240.0" y="135.0" width="56.0" height="40.0" rx="3" fill="#e2b45a" fill-opacity="0.85" stroke="#e2b45a" stroke-width="1"/>
<text x="268.0" y="159.3" font-size="12" fill="#1b1712" text-anchor="middle" font-weight="600">m5</text>
<rect x="310.0" y="135.0" width="56.0" height="40.0" rx="3" fill="#e2b45a" fill-opacity="0.85" stroke="#e2b45a" stroke-width="1"/>
<text x="338.0" y="159.3" font-size="12" fill="#1b1712" text-anchor="middle" font-weight="600">m4</text>
<rect x="380.0" y="135.0" width="56.0" height="40.0" rx="3" fill="#e2b45a" fill-opacity="0.85" stroke="#e2b45a" stroke-width="1"/>
<text x="408.0" y="159.3" font-size="12" fill="#1b1712" text-anchor="middle" font-weight="600">m3</text>
<line x1="162.0" y1="155.0" x2="218.0" y2="155.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="600.0" y="70.0" width="170.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="685.0" y="89.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="600">consumer A</text>
<text x="685.0" y="105.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="400">processing m1</text>
<rect x="600.0" y="134.0" width="170.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="685.0" y="153.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="600">consumer B</text>
<text x="685.0" y="169.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="400">processing m2</text>
<rect x="600.0" y="198.0" width="170.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="685.0" y="217.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="600">consumer C</text>
<text x="685.0" y="233.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="400">idle</text>
<line x1="522.0" y1="155.0" x2="598.0" y2="92.0" stroke="#5fb3a1" stroke-width="1" marker-end="url(#ah1)"/>
<line x1="522.0" y1="155.0" x2="598.0" y2="156.0" stroke="#5fb3a1" stroke-width="1" marker-end="url(#ah1)"/>
<line x1="522.0" y1="155.0" x2="598.0" y2="220.0" stroke="#5fb3a1" stroke-width="1" marker-end="url(#ah1)"/>
<text x="600.0" y="270.0" font-size="11" fill="#7cc47f" text-anchor="start" font-weight="400">ack → broker deletes the message</text>
<text x="600.0" y="290.0" font-size="11" fill="#e5534b" text-anchor="start" font-weight="400">no ack before timeout → redelivered</text>
<text x="40.0" y="332.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Each message goes to one consumer. Once acknowledged it is gone. Order is per queue at best, and with</text>
<text x="40.0" y="351.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">several consumers and redeliveries, messages are processed out of order.</text>
</svg>
