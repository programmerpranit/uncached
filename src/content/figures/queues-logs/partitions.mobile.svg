<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 414" width="360" height="414" role="img" aria-label="Keys are hashed to partitions; each partition is consumed in order by one consumer in a group" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="414" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Partitions: order + parallelism</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">hash(key) picks the partition</text>
<rect x="16.0" y="72.0" width="328.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="180.0" y="98.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">producer: hash(order_id)</text>
<rect x="16.0" y="136.0" width="328.0" height="56.0" rx="3" fill="#5fb3a1" fill-opacity="0.12" stroke="#5fb3a1" stroke-width="1"/>
<text x="28.0" y="158.0" font-size="11.5" fill="#5fb3a1" text-anchor="start" font-weight="700">partition 0 → consumer 1</text>
<text x="28.0" y="178.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">order-17, order-42</text>
<rect x="16.0" y="202.0" width="328.0" height="56.0" rx="3" fill="#e2b45a" fill-opacity="0.12" stroke="#e2b45a" stroke-width="1"/>
<text x="28.0" y="224.0" font-size="11.5" fill="#e2b45a" text-anchor="start" font-weight="700">partition 1 → consumer 2</text>
<text x="28.0" y="244.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">order-8, order-99</text>
<rect x="16.0" y="268.0" width="328.0" height="56.0" rx="3" fill="#d77fa1" fill-opacity="0.12" stroke="#d77fa1" stroke-width="1"/>
<text x="28.0" y="290.0" font-size="11.5" fill="#d77fa1" text-anchor="start" font-weight="700">partition 2 → consumer 3</text>
<text x="28.0" y="310.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">order-3, order-61</text>
<text x="16.0" y="346.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Same key → same partition → in order.</text>
<text x="16.0" y="365.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Max one consumer per partition</text>
<text x="16.0" y="384.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">per group.</text>
</svg>
