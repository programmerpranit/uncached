<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" width="360" height="290" role="img" aria-label="Comparison of explicit hugetlbfs huge pages and transparent huge pages" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="290" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">hugetlbfs vs THP</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">explicit vs transparent</text>
<text x="16.0" y="86.0" font-size="12.5" fill="#5fb3a1" text-anchor="start" font-weight="700">explicit (hugetlbfs)</text>
<text x="16.0" y="106.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">· reserved, guaranteed, never swapped</text>
<text x="16.0" y="124.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">· app must request them</text>
<text x="16.0" y="142.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">· Oracle, Postgres, DPDK, VMs</text>
<text x="16.0" y="172.0" font-size="12.5" fill="#e2b45a" text-anchor="start" font-weight="700">transparent (THP)</text>
<text x="16.0" y="192.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">· automatic, best effort</text>
<text x="16.0" y="210.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">· no app changes needed</text>
<text x="16.0" y="228.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">· risk: compaction stalls, bloat</text>
<text x="16.0" y="260.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">1 GiB pages: hugetlbfs only.</text>
</svg>
