<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 387" width="880" height="387" role="img" aria-label="Illustrative effect of huge pages on different workloads" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="387" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">When huge pages pay off (illustrative)</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">run-time change from backing memory with 2 MiB pages</text>
<text x="40.0" y="104.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">random access over 100 GB (hash join, KV store)</text>
<rect x="460.0" y="92.0" width="208.0" height="20.0" rx="3" fill="#7cc47f" fill-opacity="0.7" stroke="#7cc47f" stroke-width="1"/>
<text x="678.0" y="107.0" font-size="12" fill="#7cc47f" text-anchor="start" font-weight="700">−10% to −30%</text>
<text x="40.0" y="148.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">large JVM heap, GC scanning</text>
<rect x="460.0" y="136.0" width="130.0" height="20.0" rx="3" fill="#7cc47f" fill-opacity="0.7" stroke="#7cc47f" stroke-width="1"/>
<text x="600.0" y="151.0" font-size="12" fill="#7cc47f" text-anchor="start" font-weight="700">−5% to −15%</text>
<text x="40.0" y="192.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">VM guest memory (2D page walks)</text>
<rect x="460.0" y="180.0" width="156.0" height="20.0" rx="3" fill="#7cc47f" fill-opacity="0.7" stroke="#7cc47f" stroke-width="1"/>
<text x="626.0" y="195.0" font-size="12" fill="#7cc47f" text-anchor="start" font-weight="700">−10%+</text>
<text x="40.0" y="236.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">small, cache-friendly working set</text>
<rect x="460.0" y="224.0" width="7.8" height="20.0" rx="3" fill="#a69d8e" fill-opacity="0.7" stroke="#a69d8e" stroke-width="1"/>
<text x="477.8" y="239.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="700">~0%</text>
<text x="40.0" y="280.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">fork-heavy / sparse memory (Redis)</text>
<rect x="460.0" y="268.0" width="143.0" height="20.0" rx="3" fill="#e5534b" fill-opacity="0.7" stroke="#e5534b" stroke-width="1"/>
<text x="613.0" y="283.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="700">latency spikes, bloat</text>
<text x="40.0" y="338.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Huge pages help when TLB misses are a real cost: big, randomly accessed memory. They hurt when memory is sparse</text>
<text x="40.0" y="357.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">(a 2 MiB page for a few KB of data), when fork copies whole huge pages, or when allocation stalls on compaction.</text>
</svg>
