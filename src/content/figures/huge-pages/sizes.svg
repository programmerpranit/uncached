<text x="440.0" y="334.0" font-size="11.5" fill="#a69d8e" text-anchor="middle" font-weight="400">one 2 MiB page = 512 contiguous 4 KiB frames, aligned to 2 MiB, mapped by one PMD entry</text>
<text x="40.0" y="366.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Benefits: fewer TLB misses, shorter page walks, less page-table memory, fewer page faults. The catch: the kernel</text>
<text x="40.0" y="385.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">needs 2 MiB of physically contiguous, aligned free memory, which gets hard to find on a long-running system.</text>
