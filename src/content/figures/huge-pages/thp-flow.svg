<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 411" width="880" height="411" role="img" aria-label="How transparent huge pages are allocated at fault time, compacted, collapsed by khugepaged and split" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="411" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a4136"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">How THP gets a huge page</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">on a fault in a suitable 2 MiB-aligned region, or later in the background</text>
<circle cx="56.0" cy="100.0" r="11" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1.5"/>
<text x="56.0" y="104.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="700">1</text>
<text x="80.0" y="99.0" font-size="12.5" fill="#ede6d8" text-anchor="start" font-weight="700">page fault in an anonymous region</text>
<text x="80.0" y="116.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">region is 2 MiB-aligned and THP-eligible (enabled = always, or madvise)</text>
<line x1="56.0" y1="112.0" x2="56.0" y2="134.0" stroke="#4a4136" stroke-width="1.2" marker-end="url(#ah0)"/>
<circle cx="56.0" cy="150.0" r="11" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1.5"/>
<text x="56.0" y="154.0" font-size="11" fill="#7cc47f" text-anchor="middle" font-weight="700">2</text>
<text x="80.0" y="149.0" font-size="12.5" fill="#7cc47f" text-anchor="start" font-weight="700">free 2 MiB block available?</text>
<text x="80.0" y="166.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">yes → zero it (2 MiB memset) and map with one PMD entry</text>
<line x1="56.0" y1="162.0" x2="56.0" y2="184.0" stroke="#4a4136" stroke-width="1.2" marker-end="url(#ah0)"/>
<circle cx="56.0" cy="200.0" r="11" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1.5"/>
<text x="56.0" y="204.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="700">3</text>
<text x="80.0" y="199.0" font-size="12.5" fill="#e2b45a" text-anchor="start" font-weight="700">no → defrag setting decides</text>
<text x="80.0" y="216.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">direct compaction now (can stall), defer, or fall back to 4 KiB</text>
<line x1="56.0" y1="212.0" x2="56.0" y2="234.0" stroke="#4a4136" stroke-width="1.2" marker-end="url(#ah0)"/>
<circle cx="56.0" cy="250.0" r="11" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1.5"/>
<text x="56.0" y="254.0" font-size="11" fill="#9b8cff" text-anchor="middle" font-weight="700">4</text>
<text x="80.0" y="249.0" font-size="12.5" fill="#9b8cff" text-anchor="start" font-weight="700">khugepaged (background)</text>
<text x="80.0" y="266.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">scans regions, copies 512 small pages into a new huge page, remaps</text>
<line x1="56.0" y1="262.0" x2="56.0" y2="284.0" stroke="#4a4136" stroke-width="1.2" marker-end="url(#ah0)"/>
<circle cx="56.0" cy="300.0" r="11" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1.5"/>
<text x="56.0" y="304.0" font-size="11" fill="#e5534b" text-anchor="middle" font-weight="700">5</text>
<text x="80.0" y="299.0" font-size="12.5" fill="#e5534b" text-anchor="start" font-weight="700">under memory pressure</text>
<text x="80.0" y="316.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">huge pages may be split back into 4 KiB pages for reclaim and swap</text>
<text x="40.0" y="362.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Knobs live in /sys/kernel/mm/transparent_hugepage/: enabled (always, madvise, never) and defrag (always, defer,</text>
<text x="40.0" y="381.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">defer+madvise, madvise, never). Latency-sensitive databases often recommend never or madvise.</text>
</svg>
