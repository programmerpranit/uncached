<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 316" width="360" height="316" role="img" aria-label="Illustrative effect of huge pages on different workloads" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="316" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">When they pay off</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">effect of 2 MiB pages</text>
<text x="16.0" y="86.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">random access, huge data</text>
<text x="344.0" y="86.0" font-size="11" fill="#7cc47f" text-anchor="end" font-weight="700">−10% to −30%</text>
<text x="16.0" y="116.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">big JVM heap</text>
<text x="344.0" y="116.0" font-size="11" fill="#7cc47f" text-anchor="end" font-weight="700">−5% to −15%</text>
<text x="16.0" y="146.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">VM guest memory</text>
<text x="344.0" y="146.0" font-size="11" fill="#7cc47f" text-anchor="end" font-weight="700">−10%+</text>
<text x="16.0" y="176.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">small working set</text>
<text x="344.0" y="176.0" font-size="11" fill="#ede6d8" text-anchor="end" font-weight="700">~0%</text>
<text x="16.0" y="206.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">fork-heavy / sparse</text>
<text x="344.0" y="206.0" font-size="11" fill="#e5534b" text-anchor="end" font-weight="700">latency spikes, bloat</text>
<text x="16.0" y="248.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Help: big, random access.</text>
<text x="16.0" y="267.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Hurt: sparse memory, fork,</text>
<text x="16.0" y="286.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">compaction stalls.</text>
</svg>
