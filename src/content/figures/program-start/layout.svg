<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 464" width="880" height="464" role="img" aria-label="Process address space after loading: app segments, heap, mapped libraries, vdso and stack" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="464" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">The process address space after loading</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">x86-64 Linux, addresses randomized by ASLR (not to scale)</text>
<rect x="100.0" y="90.0" width="280.0" height="26.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="240.0" y="107.0" font-size="11" fill="#9b8cff" text-anchor="middle" font-weight="600">stack (argv, envp, auxv) ↓</text>
<text x="396.0" y="107.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">rw-</text>
<text x="240.0" y="138.0" font-size="13" fill="#a69d8e" text-anchor="middle" font-weight="400">⋮</text>
<rect x="100.0" y="146.0" width="280.0" height="26.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="240.0" y="163.0" font-size="11" fill="#7cc47f" text-anchor="middle" font-weight="600">vdso, vvar</text>
<text x="396.0" y="163.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">r-x</text>
<rect x="100.0" y="176.0" width="280.0" height="26.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="240.0" y="193.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="600">ld-linux-x86-64.so.2</text>
<text x="396.0" y="193.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">r-x / rw-</text>
<rect x="100.0" y="206.0" width="280.0" height="26.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="240.0" y="223.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="600">libssl.so.3</text>
<text x="396.0" y="223.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">r-x / rw-</text>
<rect x="100.0" y="236.0" width="280.0" height="26.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="240.0" y="253.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="600">libc.so.6</text>
<text x="396.0" y="253.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">r-x / rw-</text>
<rect x="100.0" y="266.0" width="280.0" height="26.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="240.0" y="283.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="600">mmap region ↓</text>
<text x="396.0" y="283.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400"></text>
<text x="240.0" y="314.0" font-size="13" fill="#a69d8e" text-anchor="middle" font-weight="400">⋮</text>
<rect x="100.0" y="322.0" width="280.0" height="26.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="240.0" y="339.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="600">heap (brk) ↑</text>
<text x="396.0" y="339.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">rw-</text>
<rect x="100.0" y="352.0" width="280.0" height="26.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="240.0" y="369.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="600">.data .bss</text>
<text x="396.0" y="369.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">rw-</text>
<rect x="100.0" y="382.0" width="280.0" height="26.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="240.0" y="399.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="600">.rodata</text>
<text x="396.0" y="399.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">r--</text>
<rect x="100.0" y="412.0" width="280.0" height="26.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="240.0" y="429.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="600">.text (app code)</text>
<text x="396.0" y="429.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">r-x</text>
<text x="80.0" y="100.0" font-size="11" fill="#a69d8e" text-anchor="end" font-weight="400">high</text>
<text x="80.0" y="434.0" font-size="11" fill="#a69d8e" text-anchor="end" font-weight="400">low</text>
<text x="500.0" y="110.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Each shared library is mapped</text>
<text x="500.0" y="129.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">once in RAM and shared by every</text>
<text x="500.0" y="148.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">process (code pages are read-only</text>
<text x="500.0" y="167.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">and file-backed). Data pages are</text>
<text x="500.0" y="186.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">private and copy-on-write.</text>
<text x="500.0" y="224.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">ASLR picks random bases for the</text>
<text x="500.0" y="243.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">stack, heap, mmap area and (for</text>
<text x="500.0" y="262.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">PIE executables) the program</text>
<text x="500.0" y="281.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">itself, so exploit addresses</text>
<text x="500.0" y="300.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">change on every run.</text>
</svg>
