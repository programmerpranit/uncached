<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 485" width="360" height="485" role="img" aria-label="The service inserts the order row and an outbox event row in one database transaction; a relay reads the outbox by polling or change data capture, publishes to the broker and marks the row sent, giving at-least-once delivery to consumers" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="485" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">The outbox pattern</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">event commits with the data</text>
<rect x="16.0" y="84.0" width="328.0" height="40.0" rx="3" fill="#ff5b2e" fill-opacity="0.2" stroke="#ff5b2e" stroke-width="1"/>
<text x="180.0" y="108.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Order service</text>
<rect x="16.0" y="138.0" width="328.0" height="138.0" rx="10" fill="#5fb3a1" fill-opacity="0.08" stroke="#5fb3a1" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="28.0" y="158.0" font-size="11" fill="#5fb3a1" text-anchor="start" font-weight="700">ONE transaction</text>
<rect x="28.0" y="168.0" width="304.0" height="44.0" rx="3" fill="#5fb3a1" fill-opacity="0.2" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="187.0" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">orders</text>
<text x="180.0" y="203.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">INSERT order #42</text>
<rect x="28.0" y="220.0" width="304.0" height="44.0" rx="3" fill="#e2b45a" fill-opacity="0.2" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="239.0" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">outbox</text>
<text x="180.0" y="255.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">INSERT OrderPlaced #42</text>
<line x1="180.0" y1="276.0" x2="180.0" y2="296.0" stroke="#a69d8e" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="16.0" y="296.0" width="328.0" height="44.0" rx="3" fill="#d77fa1" fill-opacity="0.2" stroke="#d77fa1" stroke-width="1"/>
<text x="180.0" y="315.0" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Relay</text>
<text x="180.0" y="331.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">poll table or tail WAL (CDC)</text>
<line x1="180.0" y1="340.0" x2="180.0" y2="360.0" stroke="#a69d8e" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="16.0" y="360.0" width="328.0" height="44.0" rx="3" fill="#9b8cff" fill-opacity="0.2" stroke="#9b8cff" stroke-width="1"/>
<text x="180.0" y="386.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Broker → consumers</text>
<text x="16.0" y="436.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">Event exists iff the order does.</text>
<text x="16.0" y="455.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">Relay retries → at-least-once.</text>
</svg>
