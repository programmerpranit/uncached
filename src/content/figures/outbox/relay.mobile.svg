<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 541" width="360" height="541" role="img" aria-label="Comparison of a polling publisher that selects unsent outbox rows with SKIP LOCKED and a CDC relay that tails the write-ahead log, both feeding an idempotent consumer that records processed event ids to discard duplicates" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="541" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Relay and consume</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">polling vs CDC, consumer dedup</text>
<rect x="16.0" y="86.0" width="328.0" height="118.0" rx="8" fill="#e2b45a" fill-opacity="0.1" stroke="#e2b45a" stroke-width="1.2"/>
<text x="28.0" y="108.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="700">Polling publisher</text>
<text x="28.0" y="130.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">SELECT … WHERE sent_at IS NULL</text>
<text x="28.0" y="150.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">ORDER BY id LIMIT 100</text>
<text x="28.0" y="170.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">FOR UPDATE SKIP LOCKED</text>
<text x="28.0" y="190.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">publish → UPDATE sent_at</text>
<rect x="16.0" y="216.0" width="328.0" height="118.0" rx="8" fill="#5fb3a1" fill-opacity="0.1" stroke="#5fb3a1" stroke-width="1.2"/>
<text x="28.0" y="238.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="700">Log tailing (CDC)</text>
<text x="28.0" y="260.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">Debezium reads the WAL/binlog</text>
<text x="28.0" y="280.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">outbox insert = change event</text>
<text x="28.0" y="300.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">Kafka Connect routes by type</text>
<text x="28.0" y="320.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">offset stored, no polling query</text>
<rect x="16.0" y="346.0" width="328.0" height="118.0" rx="8" fill="#9b8cff" fill-opacity="0.1" stroke="#9b8cff" stroke-width="1.2"/>
<text x="28.0" y="368.0" font-size="12" fill="#9b8cff" text-anchor="start" font-weight="700">Idempotent consumer</text>
<text x="28.0" y="390.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">event_id in processed_events?</text>
<text x="28.0" y="410.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">yes → ack and skip</text>
<text x="28.0" y="430.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">no → apply + insert id</text>
<text x="28.0" y="450.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">in the same local txn</text>
<text x="16.0" y="492.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">Relays can double-publish, so</text>
<text x="16.0" y="511.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">consumers dedupe on event id.</text>
</svg>
