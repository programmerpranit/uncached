<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 509" width="360" height="509" role="img" aria-label="Writing to a database and then a message broker as two separate operations: a crash between them leaves the order saved with no event, or an event published for an order that was never committed" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="509" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">The dual-write problem</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">two writes, no shared transaction</text>
<rect x="16.0" y="84.0" width="328.0" height="44.0" rx="3" fill="#ff5b2e" fill-opacity="0.2" stroke="#ff5b2e" stroke-width="1"/>
<text x="180.0" y="110.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Order service</text>
<rect x="16.0" y="146.0" width="156.0" height="40.0" rx="3" fill="#5fb3a1" fill-opacity="0.2" stroke="#5fb3a1" stroke-width="1"/>
<text x="94.0" y="170.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">1. Postgres</text>
<rect x="188.0" y="146.0" width="156.0" height="40.0" rx="3" fill="#9b8cff" fill-opacity="0.2" stroke="#9b8cff" stroke-width="1"/>
<text x="266.0" y="170.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">2. Kafka</text>
<text x="180.0" y="212.0" font-size="12" fill="#e5534b" text-anchor="middle" font-weight="700">✕ crash in between</text>
<rect x="16.0" y="232.0" width="328.0" height="62.0" rx="6" fill="#e5534b" fill-opacity="0.08" stroke="#e5534b" stroke-width="1"/>
<text x="28.0" y="252.0" font-size="11" fill="#e5534b" text-anchor="start" font-weight="700">DB commit, then publish</text>
<text x="28.0" y="269.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">crash between the two</text>
<text x="28.0" y="285.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">order saved, no event: shipping never hears</text>
<rect x="16.0" y="302.0" width="328.0" height="62.0" rx="6" fill="#e5534b" fill-opacity="0.08" stroke="#e5534b" stroke-width="1"/>
<text x="28.0" y="322.0" font-size="11" fill="#e5534b" text-anchor="start" font-weight="700">Publish, then DB commit</text>
<text x="28.0" y="339.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">commit fails or rolls back</text>
<text x="28.0" y="355.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">event for an order that does not exist</text>
<rect x="16.0" y="372.0" width="328.0" height="62.0" rx="6" fill="#e2b45a" fill-opacity="0.08" stroke="#e2b45a" stroke-width="1"/>
<text x="28.0" y="392.0" font-size="11" fill="#e2b45a" text-anchor="start" font-weight="700">Publish inside the transaction</text>
<text x="28.0" y="409.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">broker call succeeds, commit fails</text>
<text x="28.0" y="425.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">phantom event, long-held locks</text>
<text x="16.0" y="460.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">No ordering of two separate</text>
<text x="16.0" y="479.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">writes is safe.</text>
</svg>
