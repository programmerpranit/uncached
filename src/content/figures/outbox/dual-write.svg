<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 443" width="880" height="443" role="img" aria-label="Writing to a database and then a message broker as two separate operations: a crash between them leaves the order saved with no event, or an event published for an order that was never committed" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="443" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b8cff"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">The dual-write problem</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">two systems, no shared transaction: any crash leaves them disagreeing</text>
<rect x="40.0" y="100.0" width="150.0" height="56.0" rx="3" fill="#ff5b2e" fill-opacity="0.2" stroke="#ff5b2e" stroke-width="1"/>
<text x="115.0" y="132.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Order service</text>
<rect x="330.0" y="70.0" width="150.0" height="48.0" rx="3" fill="#5fb3a1" fill-opacity="0.2" stroke="#5fb3a1" stroke-width="1"/>
<text x="405.0" y="98.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Postgres</text>
<rect x="330.0" y="140.0" width="150.0" height="48.0" rx="3" fill="#9b8cff" fill-opacity="0.2" stroke="#9b8cff" stroke-width="1"/>
<text x="405.0" y="168.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Kafka</text>
<line x1="190.0" y1="120.0" x2="330.0" y2="94.0" stroke="#5fb3a1" stroke-width="1.3" marker-end="url(#ah0)"/>
<text x="250.0" y="98.0" font-size="10" fill="#5fb3a1" text-anchor="start" font-weight="400">1. INSERT</text>
<line x1="190.0" y1="136.0" x2="330.0" y2="164.0" stroke="#9b8cff" stroke-width="1.3" marker-end="url(#ah1)"/>
<text x="250.0" y="170.0" font-size="10" fill="#9b8cff" text-anchor="start" font-weight="400">2. publish</text>
<text x="560.0" y="96.0" font-size="13" fill="#e5534b" text-anchor="start" font-weight="700">✕ crash here</text>
<text x="560.0" y="118.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">= one write happened,</text>
<text x="560.0" y="136.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">the other did not</text>
<rect x="40.0" y="230.0" width="800.0" height="40.0" rx="6" fill="#e5534b" fill-opacity="0.08" stroke="#e5534b" stroke-width="1"/>
<text x="56.0" y="255.0" font-size="11.5" fill="#e5534b" text-anchor="start" font-weight="700">DB commit, then publish</text>
<text x="290.0" y="255.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">crash between the two</text>
<text x="555.0" y="255.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">order saved, no event: shipping never hears</text>
<rect x="40.0" y="278.0" width="800.0" height="40.0" rx="6" fill="#e5534b" fill-opacity="0.08" stroke="#e5534b" stroke-width="1"/>
<text x="56.0" y="303.0" font-size="11.5" fill="#e5534b" text-anchor="start" font-weight="700">Publish, then DB commit</text>
<text x="290.0" y="303.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">commit fails or rolls back</text>
<text x="555.0" y="303.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">event for an order that does not exist</text>
<rect x="40.0" y="326.0" width="800.0" height="40.0" rx="6" fill="#e2b45a" fill-opacity="0.08" stroke="#e2b45a" stroke-width="1"/>
<text x="56.0" y="351.0" font-size="11.5" fill="#e2b45a" text-anchor="start" font-weight="700">Publish inside the transaction</text>
<text x="290.0" y="351.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">broker call succeeds, commit fails</text>
<text x="555.0" y="351.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">phantom event, long-held locks</text>
<text x="40.0" y="394.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">No ordering of two independent writes is safe. Retries do not help either: you cannot tell whether the</text>
<text x="40.0" y="413.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">first write happened. You need one atomic write, then a reliable way to propagate it.</text>
</svg>
