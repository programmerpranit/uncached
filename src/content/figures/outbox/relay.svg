<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 379" width="880" height="379" role="img" aria-label="Comparison of a polling publisher that selects unsent outbox rows with SKIP LOCKED and a CDC relay that tails the write-ahead log, both feeding an idempotent consumer that records processed event ids to discard duplicates" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="379" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Two ways to relay, one way to consume</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">polling vs log tailing, and why consumers dedupe</text>
<rect x="40.0" y="90.0" width="260.0" height="190.0" rx="8" fill="#e2b45a" fill-opacity="0.1" stroke="#e2b45a" stroke-width="1.2"/>
<text x="54.0" y="114.0" font-size="12.5" fill="#e2b45a" text-anchor="start" font-weight="700">Polling publisher</text>
<text x="54.0" y="142.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">SELECT … WHERE sent_at IS NULL</text>
<text x="54.0" y="166.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">ORDER BY id LIMIT 100</text>
<text x="54.0" y="190.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">FOR UPDATE SKIP LOCKED</text>
<text x="54.0" y="214.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">publish → UPDATE sent_at</text>
<text x="54.0" y="262.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">simple; adds query load &amp; latency</text>
<rect x="320.0" y="90.0" width="260.0" height="190.0" rx="8" fill="#5fb3a1" fill-opacity="0.1" stroke="#5fb3a1" stroke-width="1.2"/>
<text x="334.0" y="114.0" font-size="12.5" fill="#5fb3a1" text-anchor="start" font-weight="700">Log tailing (CDC)</text>
<text x="334.0" y="142.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">Debezium reads the WAL/binlog</text>
<text x="334.0" y="166.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">outbox insert = change event</text>
<text x="334.0" y="190.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">Kafka Connect routes by type</text>
<text x="334.0" y="214.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">offset stored, no polling query</text>
<text x="334.0" y="262.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">low latency; more infra to run</text>
<rect x="600.0" y="90.0" width="240.0" height="190.0" rx="8" fill="#9b8cff" fill-opacity="0.1" stroke="#9b8cff" stroke-width="1.2"/>
<text x="614.0" y="114.0" font-size="12.5" fill="#9b8cff" text-anchor="start" font-weight="700">Idempotent consumer</text>
<text x="614.0" y="142.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">event_id in processed_events?</text>
<text x="614.0" y="166.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">yes → ack and skip</text>
<text x="614.0" y="190.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">no → apply + insert id</text>
<text x="614.0" y="214.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">in the same local txn</text>
<text x="614.0" y="262.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">duplicates become no-ops</text>
<line x1="560.0" y1="185.0" x2="600.0" y2="185.0" stroke="#a69d8e" stroke-width="1.3" marker-end="url(#ah0)"/>
<text x="40.0" y="330.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Both relays can publish a row twice (crash after publish, before marking sent), so the event id</text>
<text x="40.0" y="349.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">travels with the message and the consumer records it. Partition by aggregate id to keep per-entity order.</text>
</svg>
