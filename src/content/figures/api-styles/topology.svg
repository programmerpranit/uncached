<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 437" width="880" height="437" role="img" aria-label="A common hybrid: partners call a public REST API, web and mobile apps call a GraphQL backend-for-frontend, and both call internal services over gRPC" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="437" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5b2e"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b8cff"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Mixing styles in one system</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">each edge gets the protocol that suits its consumer</text>
<rect x="40.0" y="110.0" width="170.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="125.0" y="139.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Partners</text>
<rect x="40.0" y="200.0" width="170.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="125.0" y="229.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Web app</text>
<rect x="40.0" y="290.0" width="170.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="125.0" y="319.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Mobile app</text>
<rect x="330.0" y="110.0" width="180.0" height="50.0" rx="3" fill="#ff5b2e" fill-opacity="0.2" stroke="#ff5b2e" stroke-width="1"/>
<text x="420.0" y="139.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Public REST API</text>
<rect x="330.0" y="245.0" width="180.0" height="50.0" rx="3" fill="#9b8cff" fill-opacity="0.2" stroke="#9b8cff" stroke-width="1"/>
<text x="420.0" y="274.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">GraphQL BFF</text>
<line x1="210.0" y1="135.0" x2="330.0" y2="135.0" stroke="#ff5b2e" stroke-width="1.6" marker-end="url(#ah0)"/>
<text x="270.0" y="126.0" font-size="10.5" fill="#ff5b2e" text-anchor="middle" font-weight="400">REST</text>
<line x1="210.0" y1="225.0" x2="330.0" y2="262.0" stroke="#9b8cff" stroke-width="1.6" marker-end="url(#ah1)"/>
<line x1="210.0" y1="315.0" x2="330.0" y2="278.0" stroke="#9b8cff" stroke-width="1.6" marker-end="url(#ah1)"/>
<rect x="660.0" y="110.0" width="180.0" height="50.0" rx="3" fill="#5fb3a1" fill-opacity="0.2" stroke="#5fb3a1" stroke-width="1"/>
<text x="750.0" y="139.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Orders service</text>
<line x1="510.0" y1="135.0" x2="660.0" y2="135.0" stroke="#5fb3a1" stroke-width="1.3" marker-end="url(#ah2)"/>
<line x1="510.0" y1="270.0" x2="660.0" y2="135.0" stroke="#5fb3a1" stroke-width="1.3" marker-end="url(#ah2)"/>
<rect x="660.0" y="200.0" width="180.0" height="50.0" rx="3" fill="#5fb3a1" fill-opacity="0.2" stroke="#5fb3a1" stroke-width="1"/>
<text x="750.0" y="229.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Users service</text>
<line x1="510.0" y1="135.0" x2="660.0" y2="225.0" stroke="#5fb3a1" stroke-width="1.3" marker-end="url(#ah2)"/>
<line x1="510.0" y1="270.0" x2="660.0" y2="225.0" stroke="#5fb3a1" stroke-width="1.3" marker-end="url(#ah2)"/>
<rect x="660.0" y="290.0" width="180.0" height="50.0" rx="3" fill="#5fb3a1" fill-opacity="0.2" stroke="#5fb3a1" stroke-width="1"/>
<text x="750.0" y="319.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Inventory service</text>
<line x1="510.0" y1="135.0" x2="660.0" y2="315.0" stroke="#5fb3a1" stroke-width="1.3" marker-end="url(#ah2)"/>
<line x1="510.0" y1="270.0" x2="660.0" y2="315.0" stroke="#5fb3a1" stroke-width="1.3" marker-end="url(#ah2)"/>
<text x="585.0" y="108.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="700">gRPC</text>
<text x="40.0" y="388.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Partners get a stable, documented, cacheable REST API. UI teams get a GraphQL layer shaped to their screens.</text>
<text x="40.0" y="407.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Services talk to each other over gRPC with generated clients and deadlines.</text>
</svg>
