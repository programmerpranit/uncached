<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 427" width="360" height="427" role="img" aria-label="A common hybrid: partners call a public REST API, web and mobile apps call a GraphQL backend-for-frontend, and both call internal services over gRPC" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
