<text x="272.0" y="188.0" font-size="15" fill="#7cc47f" text-anchor="middle" font-weight="400">●</text>
<text x="330.0" y="188.0" font-size="15" fill="#e5534b" text-anchor="middle" font-weight="400">○</text>
<text x="16.0" y="215.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">Strict typed contract</text>
