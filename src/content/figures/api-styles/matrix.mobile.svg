<text x="272.0" y="160.0" font-size="15" fill="#7cc47f" text-anchor="middle" font-weight="400">●</text>
<text x="330.0" y="160.0" font-size="15" fill="#e2b45a" text-anchor="middle" font-weight="400">◐</text>
