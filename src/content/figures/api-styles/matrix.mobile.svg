<text x="272.0" y="132.0" font-size="15" fill="#e5534b" text-anchor="middle" font-weight="400">○</text>
<text x="330.0" y="132.0" font-size="15" fill="#e5534b" text-anchor="middle" font-weight="400">○</text>
<text x="16.0" y="159.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">Browser support</text>
