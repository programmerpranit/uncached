<text x="16.0" y="299.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">Public, third-party AP…</text>
<text x="214.0" y="300.0" font-size="15" fill="#7cc47f" text-anchor="middle" font-weight="400">●</text>
<text x="272.0" y="300.0" font-size="15" fill="#e2b45a" text-anchor="middle" font-weight="400">◐</text>
<text x="330.0" y="300.0" font-size="15" fill="#e5534b" text-anchor="middle" font-weight="400">○</text>
<text x="16.0" y="327.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">Debug with curl</text>
<text x="214.0" y="328.0" font-size="15" fill="#7cc47f" text-anchor="middle" font-weight="400">●</text>
<text x="272.0" y="328.0" font-size="15" fill="#e2b45a" text-anchor="middle" font-weight="400">◐</text>
<text x="330.0" y="328.0" font-size="15" fill="#e5534b" text-anchor="middle" font-weight="400">○</text>
<text x="16.0" y="360.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">REST: public + browser. GraphQL: many</text>
<text x="16.0" y="379.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">UI clients. gRPC: internal services.</text>
