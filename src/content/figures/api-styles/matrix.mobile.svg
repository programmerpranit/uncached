<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">● strong ◐ partial ○ weak</text>
<text x="214.0" y="100.0" font-size="11.5" fill="#ff5b2e" text-anchor="middle" font-weight="700">REST</text>
