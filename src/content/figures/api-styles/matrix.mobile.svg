<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 409" width="360" height="409" role="img" aria-label="Comparison: REST is strongest at HTTP caching, browser support, public APIs and curl debugging; GraphQL at flexible client queries and typed schema; gRPC at typed contracts, payload speed and streaming" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="409" fill="#1b1712"/>
<defs></defs>
