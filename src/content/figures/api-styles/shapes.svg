<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 437" width="880" height="437" role="img" aria-label="Fetching an order page: REST needs three GET requests to resource URLs, GraphQL sends one query naming exact fields, gRPC makes one typed call over HTTP/2 with Protobuf" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="437" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">One screen, three API styles</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">an order page needs the order, its customer and its items</text>
<rect x="40.0" y="100.0" width="252.0" height="250.0" rx="10" fill="#ff5b2e" fill-opacity="0.1" stroke="#ff5b2e" stroke-width="1.2"/>
<text x="56.0" y="128.0" font-size="15" fill="#ff5b2e" text-anchor="start" font-weight="700">REST</text>
<text x="56.0" y="164.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">GET /orders/812</text>
<text x="56.0" y="186.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">GET /customers/42</text>
<text x="56.0" y="208.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">GET /orders/812/items</text>
<line x1="56.0" y1="240.0" x2="276.0" y2="240.0" stroke="#4a4136" stroke-width="1"/>
<text x="56.0" y="266.0" font-size="11.5" fill="#ff5b2e" text-anchor="start" font-weight="700">3 round trips, full resources</text>
<text x="56.0" y="292.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">HTTP/1.1 or 2</text>
<text x="56.0" y="312.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">JSON · cacheable URLs</text>
<rect x="314.0" y="100.0" width="252.0" height="250.0" rx="10" fill="#9b8cff" fill-opacity="0.1" stroke="#9b8cff" stroke-width="1.2"/>
<text x="330.0" y="128.0" font-size="15" fill="#9b8cff" text-anchor="start" font-weight="700">GraphQL</text>
<text x="330.0" y="164.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">POST /graphql</text>
<text x="330.0" y="186.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">{ order(id:812){ total</text>
<text x="330.0" y="208.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">  customer{name} items{sku qty} } }</text>
<line x1="330.0" y1="240.0" x2="550.0" y2="240.0" stroke="#4a4136" stroke-width="1"/>
<text x="330.0" y="266.0" font-size="11.5" fill="#9b8cff" text-anchor="start" font-weight="700">1 round trip, exact fields</text>
<text x="330.0" y="292.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">one endpoint</text>
<text x="330.0" y="312.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">client picks the shape</text>
<rect x="588.0" y="100.0" width="252.0" height="250.0" rx="10" fill="#5fb3a1" fill-opacity="0.1" stroke="#5fb3a1" stroke-width="1.2"/>
<text x="604.0" y="128.0" font-size="15" fill="#5fb3a1" text-anchor="start" font-weight="700">gRPC</text>
<text x="604.0" y="164.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">OrderService.GetOrder</text>
<text x="604.0" y="186.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">(GetOrderRequest{id:812})</text>
<text x="604.0" y="208.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">→ OrderView message</text>
<line x1="604.0" y1="240.0" x2="824.0" y2="240.0" stroke="#4a4136" stroke-width="1"/>
<text x="604.0" y="266.0" font-size="11.5" fill="#5fb3a1" text-anchor="start" font-weight="700">1 call, typed binary</text>
<text x="604.0" y="292.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">HTTP/2</text>
<text x="604.0" y="312.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">Protobuf · generated stubs</text>
<text x="40.0" y="388.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">REST models resources, GraphQL models a graph the client queries, and gRPC models procedure calls with a</text>
<text x="40.0" y="407.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">strict schema. Each one makes a different side of the contract easy.</text>
</svg>
