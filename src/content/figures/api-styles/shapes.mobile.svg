<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 554" width="360" height="554" role="img" aria-label="Fetching an order page: REST needs three GET requests to resource URLs, GraphQL sends one query naming exact fields, gRPC makes one typed call over HTTP/2 with Protobuf" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="554" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Three API styles</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">order + customer + items</text>
<rect x="16.0" y="92.0" width="328.0" height="138.0" rx="10" fill="#ff5b2e" fill-opacity="0.1" stroke="#ff5b2e" stroke-width="1.2"/>
<text x="28.0" y="116.0" font-size="13.5" fill="#ff5b2e" text-anchor="start" font-weight="700">REST</text>
<text x="28.0" y="140.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">GET /orders/812</text>
<text x="28.0" y="158.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">GET /customers/42</text>
<text x="28.0" y="176.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">GET /orders/812/items</text>
<text x="28.0" y="200.0" font-size="11" fill="#ff5b2e" text-anchor="start" font-weight="700">3 round trips, full resources</text>
<text x="28.0" y="218.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">HTTP/1.1 or 2 · JSON · cacheable URLs</text>
<rect x="16.0" y="242.0" width="328.0" height="138.0" rx="10" fill="#9b8cff" fill-opacity="0.1" stroke="#9b8cff" stroke-width="1.2"/>
<text x="28.0" y="266.0" font-size="13.5" fill="#9b8cff" text-anchor="start" font-weight="700">GraphQL</text>
<text x="28.0" y="290.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">POST /graphql</text>
<text x="28.0" y="308.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">{ order(id:812){ total</text>
<text x="28.0" y="326.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">  customer{name} items{sku qty} } }</text>
<text x="28.0" y="350.0" font-size="11" fill="#9b8cff" text-anchor="start" font-weight="700">1 round trip, exact fields</text>
<text x="28.0" y="368.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">one endpoint · client picks the shape</text>
<rect x="16.0" y="392.0" width="328.0" height="138.0" rx="10" fill="#5fb3a1" fill-opacity="0.1" stroke="#5fb3a1" stroke-width="1.2"/>
<text x="28.0" y="416.0" font-size="13.5" fill="#5fb3a1" text-anchor="start" font-weight="700">gRPC</text>
<text x="28.0" y="440.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">OrderService.GetOrder</text>
<text x="28.0" y="458.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">(GetOrderRequest{id:812})</text>
<text x="28.0" y="476.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">→ OrderView message</text>
<text x="28.0" y="500.0" font-size="11" fill="#5fb3a1" text-anchor="start" font-weight="700">1 call, typed binary</text>
<text x="28.0" y="518.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">HTTP/2 · Protobuf · generated stubs</text>
</svg>
