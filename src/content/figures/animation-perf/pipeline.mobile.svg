<rect x="280.0" y="282.0" width="60.0" height="26.0" rx="4" fill="#7cc47f" fill-opacity="0.45" stroke="#7cc47f" stroke-width="1"/>
<text x="310.0" y="299.0" font-size="9" fill="#ede6d8" text-anchor="middle" font-weight="400">Comp.</text>
<text x="16.0" y="326.0" font-size="10.5" fill="#7cc47f" text-anchor="start" font-weight="400">composite only</text>
<text x="16.0" y="356.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">Animate transform and opacity;</text>
<text x="16.0" y="375.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">they skip layout and paint.</text>
