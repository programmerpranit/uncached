<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">what each property costs per frame</text>
<text x="16.0" y="96.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="700">width, height, top, left…</text>
<rect x="16.0" y="106.0" width="60.0" height="26.0" rx="4" fill="#a69d8e" fill-opacity="0.45" stroke="#a69d8e" stroke-width="1"/>
