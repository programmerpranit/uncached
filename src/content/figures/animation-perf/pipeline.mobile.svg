<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 405" width="360" height="405" role="img" aria-label="Animating width re-runs style, layout, paint and composite; animating color re-runs paint; animating transform or opacity only re-runs composite" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="405" fill="#1b1712"/>
<defs></defs>
