<rect x="214.0" y="106.0" width="60.0" height="26.0" rx="4" fill="#e2b45a" fill-opacity="0.45" stroke="#e2b45a" stroke-width="1"/>
<text x="244.0" y="123.0" font-size="9" fill="#ede6d8" text-anchor="middle" font-weight="400">Paint</text>
