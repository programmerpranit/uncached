<text x="310.0" y="123.0" font-size="9" fill="#ede6d8" text-anchor="middle" font-weight="400">Comp.</text>
<text x="16.0" y="150.0" font-size="10.5" fill="#e5534b" text-anchor="start" font-weight="400">layout + paint + composite</text>
<text x="16.0" y="184.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="700">color, background, box-shadow…</text>
<rect x="16.0" y="194.0" width="60.0" height="26.0" rx="4" fill="#a69d8e" fill-opacity="0.45" stroke="#a69d8e" stroke-width="1"/>
