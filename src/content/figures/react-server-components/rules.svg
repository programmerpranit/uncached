<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 403" width="880" height="403" role="img" aria-label="What can and cannot be passed as props from server components to client components" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="403" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Boundary rules</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">what can cross from server to client</text>
<rect x="40.0" y="96.0" width="385.0" height="200.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="56.0" y="122.0" font-size="13" fill="#7cc47f" text-anchor="start" font-weight="700">Can pass as props</text>
<text x="56.0" y="150.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">• strings, numbers, plain objects, arrays</text>
<text x="56.0" y="172.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">• Date, Map, Set, BigInt, typed arrays</text>
<text x="56.0" y="194.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">• Promises (unwrap with use())</text>
<text x="56.0" y="216.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">• JSX, including server components as children</text>
<text x="56.0" y="238.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">• server functions ('use server')</text>
<rect x="455.0" y="96.0" width="385.0" height="200.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<text x="471.0" y="122.0" font-size="13" fill="#e5534b" text-anchor="start" font-weight="700">Cannot</text>
<text x="471.0" y="150.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">• ordinary functions / event handlers</text>
<text x="471.0" y="172.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">• class instances</text>
<text x="471.0" y="194.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">• Symbols not registered globally</text>
<text x="471.0" y="216.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">• importing server-only code in client files</text>
<text x="40.0" y="330.0" font-size="12.5" fill="#ede6d8" text-anchor="start" font-weight="700">Composition pattern</text>
<text x="40.0" y="354.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">&lt;ClientTabs&gt;  &lt;ServerProductList /&gt;  &lt;/ClientTabs&gt;</text>
<text x="40.0" y="373.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">A client component can render server components passed in as children; they are rendered on the server first.</text>
</svg>
