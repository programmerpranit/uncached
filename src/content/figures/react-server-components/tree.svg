<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 389" width="880" height="389" role="img" aria-label="Component tree mixing server components and client components, with only client components shipped to the browser" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="389" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">One tree, two environments</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">server components render on the server; client components ship JS</text>
<line x1="300.0" y1="118.0" x2="140.0" y2="172.0" stroke="#4a4136" stroke-width="1.3"/>
<line x1="300.0" y1="118.0" x2="300.0" y2="172.0" stroke="#4a4136" stroke-width="1.3"/>
<line x1="300.0" y1="118.0" x2="470.0" y2="172.0" stroke="#4a4136" stroke-width="1.3"/>
<line x1="140.0" y1="208.0" x2="140.0" y2="262.0" stroke="#4a4136" stroke-width="1.3"/>
<line x1="300.0" y1="208.0" x2="260.0" y2="262.0" stroke="#4a4136" stroke-width="1.3"/>
<line x1="300.0" y1="208.0" x2="380.0" y2="262.0" stroke="#4a4136" stroke-width="1.3"/>
<line x1="470.0" y1="208.0" x2="500.0" y2="262.0" stroke="#4a4136" stroke-width="1.3"/>
<rect x="242.0" y="82.0" width="116.0" height="36.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="300.0" y="104.1" font-size="11.5" fill="#5fb3a1" text-anchor="middle" font-weight="600">Page</text>
<rect x="82.0" y="172.0" width="116.0" height="36.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="140.0" y="194.1" font-size="11.5" fill="#5fb3a1" text-anchor="middle" font-weight="600">Header</text>
<rect x="242.0" y="172.0" width="116.0" height="36.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="300.0" y="194.1" font-size="11.5" fill="#5fb3a1" text-anchor="middle" font-weight="600">ProductDetails</text>
<rect x="412.0" y="172.0" width="116.0" height="36.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="470.0" y="194.1" font-size="11.5" fill="#5fb3a1" text-anchor="middle" font-weight="600">Reviews</text>
<rect x="82.0" y="262.0" width="116.0" height="36.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="140.0" y="284.1" font-size="11.5" fill="#9b8cff" text-anchor="middle" font-weight="600">SearchBox</text>
<rect x="202.0" y="262.0" width="116.0" height="36.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="260.0" y="284.1" font-size="11.5" fill="#9b8cff" text-anchor="middle" font-weight="600">AddToCart</text>
<rect x="322.0" y="262.0" width="116.0" height="36.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="380.0" y="284.1" font-size="11.5" fill="#5fb3a1" text-anchor="middle" font-weight="600">Markdown</text>
<rect x="442.0" y="262.0" width="116.0" height="36.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="500.0" y="284.1" font-size="11.5" fill="#9b8cff" text-anchor="middle" font-weight="600">LikeButton</text>
<rect x="640.0" y="100.0" width="200.0" height="90.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="656.0" y="124.0" font-size="12.5" fill="#5fb3a1" text-anchor="start" font-weight="700">Server component</text>
<text x="656.0" y="146.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">async, reads DB/files</text>
<text x="656.0" y="162.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">zero JS sent</text>
<text x="656.0" y="178.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">no state or effects</text>
<rect x="640.0" y="206.0" width="200.0" height="90.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="656.0" y="230.0" font-size="12.5" fill="#9b8cff" text-anchor="start" font-weight="700">'use client'</text>
<text x="656.0" y="252.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">SSR to HTML, then hydrates</text>
<text x="656.0" y="268.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">useState, onClick</text>
<text x="656.0" y="284.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">code in the bundle</text>
<text x="40.0" y="340.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">The 'use client' directive marks a boundary: that module and everything it imports go to the client bundle.</text>
<text x="40.0" y="359.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Server components can render client components and pass them serializable props or server-rendered children.</text>
</svg>
