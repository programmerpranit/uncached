<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 506" width="360" height="506" role="img" aria-label="Component tree mixing server components and client components, with only client components shipped to the browser" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="506" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Server + client tree</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">only client parts ship JS</text>
<rect x="16.0" y="84.0" width="150.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="91.0" y="103.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="600">Page</text>
<rect x="50.0" y="122.0" width="150.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="125.0" y="141.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="600">Header</text>
<rect x="84.0" y="160.0" width="150.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="159.0" y="179.0" font-size="11" fill="#9b8cff" text-anchor="middle" font-weight="600">SearchBox</text>
<rect x="50.0" y="198.0" width="150.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="125.0" y="217.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="600">ProductDetails</text>
<rect x="84.0" y="236.0" width="150.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="159.0" y="255.0" font-size="11" fill="#9b8cff" text-anchor="middle" font-weight="600">AddToCart</text>
<rect x="84.0" y="274.0" width="150.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="159.0" y="293.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="600">Markdown</text>
<rect x="50.0" y="312.0" width="150.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="125.0" y="331.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="600">Reviews</text>
<rect x="84.0" y="350.0" width="150.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="159.0" y="369.0" font-size="11" fill="#9b8cff" text-anchor="middle" font-weight="600">LikeButton</text>
<rect x="16.0" y="394.0" width="14.0" height="14.0" rx="3" fill="#5fb3a1" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="38.0" y="406.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">server: no JS</text>
<rect x="180.0" y="394.0" width="14.0" height="14.0" rx="3" fill="#9b8cff" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="202.0" y="406.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">'use client'</text>
<text x="16.0" y="438.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">'use client' modules and their</text>
<text x="16.0" y="457.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">imports are bundled; the rest</text>
<text x="16.0" y="476.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">stays on the server.</text>
</svg>
