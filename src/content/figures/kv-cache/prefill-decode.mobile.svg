<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 406" width="360" height="406" role="img" aria-label="Prefill processes the prompt in parallel; decode generates one token per step" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="406" fill="#1b1712"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker></defs>
<text x="16.0" y="30.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Two phases of a request</text>
<rect x="16.0" y="52.0" width="328.0" height="60.0" rx="2" fill="#e2b45a" fill-opacity="0.9" stroke="none" stroke-width="1"/>
<text x="180.0" y="78.0" font-size="14" fill="#1b1712" text-anchor="middle" font-weight="700">PREFILL</text>
<text x="180.0" y="98.0" font-size="12" fill="#1b1712" text-anchor="middle" font-weight="400">all prompt tokens at once</text>
<text x="16.0" y="140.0" font-size="12.5" fill="#ede6d8" text-anchor="start" font-weight="400">Time to first token (TTFT)</text>
<text x="16.0" y="159.0" font-size="12.5" fill="#a69d8e" text-anchor="start" font-weight="400">Big matrix × matrix multiplies.</text>
<text x="16.0" y="178.0" font-size="12.5" fill="#a69d8e" text-anchor="start" font-weight="400">Compute-bound: GPU cores are busy.</text>
<text x="16.0" y="197.0" font-size="12.5" fill="#a69d8e" text-anchor="start" font-weight="400">Writes the prompt’s K/V into the cache.</text>
<rect x="16.0" y="256.0" width="30.0" height="32.0" rx="2" fill="#ff5b2e" fill-opacity="0.9" stroke="none" stroke-width="1"/>
<rect x="53.0" y="256.0" width="30.0" height="32.0" rx="2" fill="#ff5b2e" fill-opacity="0.9" stroke="none" stroke-width="1"/>
<rect x="90.0" y="256.0" width="30.0" height="32.0" rx="2" fill="#ff5b2e" fill-opacity="0.9" stroke="none" stroke-width="1"/>
<rect x="127.0" y="256.0" width="30.0" height="32.0" rx="2" fill="#ff5b2e" fill-opacity="0.9" stroke="none" stroke-width="1"/>
<rect x="164.0" y="256.0" width="30.0" height="32.0" rx="2" fill="#ff5b2e" fill-opacity="0.9" stroke="none" stroke-width="1"/>
<rect x="201.0" y="256.0" width="30.0" height="32.0" rx="2" fill="#ff5b2e" fill-opacity="0.9" stroke="none" stroke-width="1"/>
<rect x="238.0" y="256.0" width="30.0" height="32.0" rx="2" fill="#ff5b2e" fill-opacity="0.9" stroke="none" stroke-width="1"/>
<rect x="275.0" y="256.0" width="30.0" height="32.0" rx="2" fill="#ff5b2e" fill-opacity="0.9" stroke="none" stroke-width="1"/>
<rect x="312.0" y="256.0" width="30.0" height="32.0" rx="2" fill="#ff5b2e" fill-opacity="0.9" stroke="none" stroke-width="1"/>
<text x="16.0" y="246.0" font-size="13" fill="#ff5b2e" text-anchor="start" font-weight="600">DECODE — one token per pass</text>
<text x="16.0" y="316.0" font-size="12.5" fill="#ede6d8" text-anchor="start" font-weight="400">Time per output token (TPOT)</text>
<text x="16.0" y="335.0" font-size="12.5" fill="#a69d8e" text-anchor="start" font-weight="400">Matrix × vector per token.</text>
<text x="16.0" y="354.0" font-size="12.5" fill="#a69d8e" text-anchor="start" font-weight="400">Memory-bound: each step re-reads all</text>
<text x="16.0" y="373.0" font-size="12.5" fill="#a69d8e" text-anchor="start" font-weight="400">weights plus the whole KV cache.</text>
</svg>
