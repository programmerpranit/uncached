<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 438" width="880" height="438" role="img" aria-label="Page types and reclaim cost: clean file pages are dropped, dirty file pages written back, anonymous pages need swap, and mlocked pages are unevictable" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="438" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a4136"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">What reclaim can take</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">every page is either file-backed or anonymous, and they cost different amounts to evict</text>
<rect x="40.0" y="100.0" width="250.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="165.0" y="121.0" font-size="12.5" fill="#7cc47f" text-anchor="middle" font-weight="600">clean file page</text>
<text x="165.0" y="137.0" font-size="11" fill="#7cc47f" text-anchor="middle" font-weight="400">binary code, read cache</text>
<line x1="292.0" y1="124.0" x2="348.0" y2="124.0" stroke="#4a4136" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="350.0" y="100.0" width="360.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="530.0" y="128.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">drop it: re-read from disk later</text>
<text x="730.0" y="129.0" font-size="12" fill="#7cc47f" text-anchor="start" font-weight="700">cheap</text>
<rect x="40.0" y="160.0" width="250.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="165.0" y="181.0" font-size="12.5" fill="#e2b45a" text-anchor="middle" font-weight="600">dirty file page</text>
<text x="165.0" y="197.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="400">written but not flushed</text>
<line x1="292.0" y1="184.0" x2="348.0" y2="184.0" stroke="#4a4136" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="350.0" y="160.0" width="360.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="530.0" y="188.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">write back to the file, then drop</text>
<text x="730.0" y="189.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="700">medium</text>
<rect x="40.0" y="220.0" width="250.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<text x="165.0" y="241.0" font-size="12.5" fill="#e5534b" text-anchor="middle" font-weight="600">anonymous page</text>
<text x="165.0" y="257.0" font-size="11" fill="#e5534b" text-anchor="middle" font-weight="400">heap, stack, tmpfs</text>
<line x1="292.0" y1="244.0" x2="348.0" y2="244.0" stroke="#4a4136" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="350.0" y="220.0" width="360.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="530.0" y="248.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">write to swap, or keep it forever</text>
<text x="730.0" y="249.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="700">needs swap</text>
<rect x="40.0" y="280.0" width="250.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#a69d8e" stroke-width="1"/>
<text x="165.0" y="301.0" font-size="12.5" fill="#a69d8e" text-anchor="middle" font-weight="600">unevictable</text>
<text x="165.0" y="317.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">mlock()ed, ramfs</text>
<line x1="292.0" y1="304.0" x2="348.0" y2="304.0" stroke="#4a4136" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="350.0" y="280.0" width="360.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="530.0" y="308.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">cannot be reclaimed at all</text>
<text x="730.0" y="309.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="700">never</text>
<text x="40.0" y="370.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Without swap, anonymous memory can never be evicted, so under pressure the kernel has only file pages left to</text>
<text x="40.0" y="389.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">drop, including the code of running programs. vm.swappiness (0–200, default 60) sets the relative cost of</text>
<text x="40.0" y="408.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">swapping anon pages versus dropping file pages; it does not mean "start swapping at 60% usage".</text>
</svg>
