<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 390" width="360" height="390" role="img" aria-label="Page types and reclaim cost: clean file pages are dropped, dirty file pages written back, anonymous pages need swap, and mlocked pages are unevictable" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="390" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">What reclaim takes</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">file vs anonymous pages</text>
<text x="16.0" y="86.0" font-size="12.5" fill="#7cc47f" text-anchor="start" font-weight="700">clean file page</text>
<text x="344.0" y="86.0" font-size="11" fill="#7cc47f" text-anchor="end" font-weight="400">cheap</text>
<text x="16.0" y="104.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">drop it: re-read from disk later</text>
<text x="16.0" y="134.0" font-size="12.5" fill="#e2b45a" text-anchor="start" font-weight="700">dirty file page</text>
<text x="344.0" y="134.0" font-size="11" fill="#e2b45a" text-anchor="end" font-weight="400">medium</text>
<text x="16.0" y="152.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">write back to the file, then drop</text>
<text x="16.0" y="182.0" font-size="12.5" fill="#e5534b" text-anchor="start" font-weight="700">anonymous page</text>
<text x="344.0" y="182.0" font-size="11" fill="#e5534b" text-anchor="end" font-weight="400">needs swap</text>
<text x="16.0" y="200.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">write to swap, or keep it forever</text>
<text x="16.0" y="230.0" font-size="12.5" fill="#a69d8e" text-anchor="start" font-weight="700">unevictable</text>
<text x="344.0" y="230.0" font-size="11" fill="#a69d8e" text-anchor="end" font-weight="400">never</text>
<text x="16.0" y="248.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">cannot be reclaimed at all</text>
<text x="16.0" y="284.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">No swap → anon pages are</text>
<text x="16.0" y="303.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">pinned, so the kernel evicts</text>
<text x="16.0" y="322.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">file pages (even program code).</text>
<text x="16.0" y="341.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">swappiness = anon vs file cost,</text>
<text x="16.0" y="360.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">not a usage threshold.</text>
</svg>
