<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 375" width="360" height="375" role="img" aria-label="A TLB shootdown: one core sends inter-processor interrupts to other cores, which flush the entry and acknowledge" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="375" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2b45a"/></marker></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">TLB shootdown</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">unmap on one core, flush on all</text>
<rect x="16.0" y="90.0" width="130.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="81.0" y="110.0" font-size="12" fill="#ff5b2e" text-anchor="middle" font-weight="600">core 0</text>
<text x="81.0" y="126.0" font-size="11" fill="#ff5b2e" text-anchor="middle" font-weight="400">munmap</text>
<rect x="214.0" y="80.0" width="130.0" height="36.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="279.0" y="102.1" font-size="11.5" fill="#5fb3a1" text-anchor="middle" font-weight="600">core 1</text>
<line x1="146.0" y1="113.0" x2="212.0" y2="98.0" stroke="#e2b45a" stroke-width="1.1" marker-end="url(#ah0)"/>
<rect x="214.0" y="130.0" width="130.0" height="36.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="279.0" y="152.1" font-size="11.5" fill="#5fb3a1" text-anchor="middle" font-weight="600">core 2</text>
<line x1="146.0" y1="113.0" x2="212.0" y2="148.0" stroke="#e2b45a" stroke-width="1.1" marker-end="url(#ah0)"/>
<rect x="214.0" y="180.0" width="130.0" height="36.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="279.0" y="202.1" font-size="11.5" fill="#5fb3a1" text-anchor="middle" font-weight="600">core 3</text>
<line x1="146.0" y1="113.0" x2="212.0" y2="198.0" stroke="#e2b45a" stroke-width="1.1" marker-end="url(#ah0)"/>
<text x="16.0" y="166.0" font-size="11.5" fill="#e2b45a" text-anchor="start" font-weight="400">IPI → flush → ack</text>
<text x="16.0" y="250.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">TLBs aren't coherent in hardware.</text>
<text x="16.0" y="269.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Removing a mapping means</text>
<text x="16.0" y="288.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">interrupting every core running</text>
<text x="16.0" y="307.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">the process and waiting for each</text>
<text x="16.0" y="326.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">to flush. Frequent munmap from</text>
<text x="16.0" y="345.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">many threads scales badly.</text>
</svg>
