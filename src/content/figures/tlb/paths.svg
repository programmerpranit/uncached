<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 458" width="880" height="458" role="img" aria-label="A memory access either hits in the TLB, misses and walks the page table, or faults into the kernel" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="458" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ede6d8"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7cc47f"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2b45a"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e5534b"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Three ways a memory access can go</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">the TLB caches translations; a miss walks the page table; a missing page faults</text>
<rect x="40.0" y="100.0" width="130.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="105.0" y="126.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">virtual addr</text>
<rect x="230.0" y="100.0" width="130.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="295.0" y="126.7" font-size="13" fill="#7cc47f" text-anchor="middle" font-weight="600">TLB</text>
<rect x="450.0" y="100.0" width="180.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="540.0" y="126.3" font-size="12" fill="#7cc47f" text-anchor="middle" font-weight="600">physical access</text>
<line x1="170.0" y1="122.0" x2="228.0" y2="122.0" stroke="#ede6d8" stroke-width="1.3" marker-end="url(#ah0)"/>
<line x1="360.0" y1="122.0" x2="448.0" y2="122.0" stroke="#7cc47f" stroke-width="1.5" marker-end="url(#ah1)"/>
<text x="404.0" y="112.0" font-size="11" fill="#7cc47f" text-anchor="middle" font-weight="400">hit</text>
<text x="660.0" y="118.0" font-size="12" fill="#7cc47f" text-anchor="start" font-weight="600">~1 cycle extra</text>
<text x="660.0" y="134.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">(most accesses)</text>
<rect x="230.0" y="200.0" width="130.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="295.0" y="219.0" font-size="12" fill="#e2b45a" text-anchor="middle" font-weight="600">page walk</text>
<text x="295.0" y="235.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="400">hardware</text>
<line x1="295.0" y1="144.0" x2="295.0" y2="198.0" stroke="#e2b45a" stroke-width="1.3" marker-end="url(#ah2)"/>
<text x="305.0" y="176.0" font-size="11" fill="#e2b45a" text-anchor="start" font-weight="400">miss</text>
<path d="M360 222 H540 V146" fill="none" stroke="#e2b45a" stroke-width="1.3" marker-end="url(#ah2)"/>
<text x="420.0" y="214.0" font-size="11" fill="#e2b45a" text-anchor="start" font-weight="400">PTE present</text>
<text x="660.0" y="214.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="600">~10s to 100s of cycles</text>
<text x="660.0" y="230.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">(cached tables vs DRAM)</text>
<rect x="230.0" y="300.0" width="130.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e5534b" stroke-width="1"/>
<text x="295.0" y="319.0" font-size="12" fill="#e5534b" text-anchor="middle" font-weight="600">page fault</text>
<text x="295.0" y="335.0" font-size="11" fill="#e5534b" text-anchor="middle" font-weight="400">→ kernel</text>
<line x1="295.0" y1="244.0" x2="295.0" y2="298.0" stroke="#e5534b" stroke-width="1.3" marker-end="url(#ah3)"/>
<text x="305.0" y="276.0" font-size="11" fill="#e5534b" text-anchor="start" font-weight="400">not present / denied</text>
<text x="660.0" y="312.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="600">~µs (minor) to ms (major)</text>
<text x="660.0" y="328.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">or SIGSEGV if invalid</text>
<text x="40.0" y="390.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">The TLB check happens on every load, store and instruction fetch. With hit rates above 99%, translation is nearly</text>
<text x="40.0" y="409.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">free. Workloads with huge, random working sets (databases, graph analytics, big hash tables) miss far more often,</text>
<text x="40.0" y="428.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">and page walks can eat a large share of runtime.</text>
</svg>
