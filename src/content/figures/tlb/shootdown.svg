<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 368" width="880" height="368" role="img" aria-label="A TLB shootdown: one core sends inter-processor interrupts to other cores, which flush the entry and acknowledge" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="368" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2b45a"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7cc47f"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">TLB shootdown: invalidating stale entries on other cores</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">munmap / mprotect on one core must flush that mapping everywhere the process runs</text>
<rect x="40.0" y="110.0" width="170.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="125.0" y="132.0" font-size="13" fill="#ff5b2e" text-anchor="middle" font-weight="600">core 0</text>
<text x="125.0" y="148.0" font-size="11" fill="#ff5b2e" text-anchor="middle" font-weight="400">munmap(addr)</text>
<rect x="420.0" y="90.0" width="170.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="505.0" y="109.0" font-size="12" fill="#5fb3a1" text-anchor="middle" font-weight="600">core 1</text>
<text x="505.0" y="125.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="400">runs same process</text>
<line x1="210.0" y1="135.0" x2="418.0" y2="112.0" stroke="#e2b45a" stroke-width="1.2" marker-end="url(#ah0)"/>
<line x1="590.0" y1="112.0" x2="680.0" y2="112.0" stroke="#7cc47f" stroke-width="1.1" marker-end="url(#ah1)"/>
<rect x="420.0" y="150.0" width="170.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="505.0" y="169.0" font-size="12" fill="#5fb3a1" text-anchor="middle" font-weight="600">core 2</text>
<text x="505.0" y="185.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="400">runs same process</text>
<line x1="210.0" y1="135.0" x2="418.0" y2="172.0" stroke="#e2b45a" stroke-width="1.2" marker-end="url(#ah0)"/>
<line x1="590.0" y1="172.0" x2="680.0" y2="172.0" stroke="#7cc47f" stroke-width="1.1" marker-end="url(#ah1)"/>
<rect x="420.0" y="210.0" width="170.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="505.0" y="229.0" font-size="12" fill="#5fb3a1" text-anchor="middle" font-weight="600">core 3</text>
<text x="505.0" y="245.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="400">runs same process</text>
<line x1="210.0" y1="135.0" x2="418.0" y2="232.0" stroke="#e2b45a" stroke-width="1.2" marker-end="url(#ah0)"/>
<line x1="590.0" y1="232.0" x2="680.0" y2="232.0" stroke="#7cc47f" stroke-width="1.1" marker-end="url(#ah1)"/>
<text x="300.0" y="108.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="400">IPI: flush addr</text>
<text x="690.0" y="120.0" font-size="11" fill="#7cc47f" text-anchor="start" font-weight="400">invlpg, then ack</text>
<text x="690.0" y="136.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">core 0 waits for</text>
<text x="690.0" y="152.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">all acks</text>
<text x="40.0" y="300.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Each core caches translations privately, and x86 hardware does not keep TLBs coherent. Changing or removing a</text>
<text x="40.0" y="319.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">mapping means sending inter-processor interrupts and waiting. With many threads frequently calling munmap,</text>
<text x="40.0" y="338.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">mprotect or madvise(DONTNEED), shootdowns become a scalability bottleneck; batching and process-wide flushes help.</text>
</svg>
