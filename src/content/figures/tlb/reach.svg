<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" role="img" aria-label="TLB reach with 4 KiB, 2 MiB and 1 GiB pages" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="350" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">TLB reach: how much memory the TLB can cover</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">a ~1,500-entry second-level TLB, as on recent x86 cores (bars not to scale)</text>
<text x="40.0" y="104.0" font-size="12.5" fill="#ede6d8" text-anchor="start" font-weight="600">4 KiB pages</text>
<text x="40.0" y="121.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">1,536 × 4 KiB</text>
<rect x="300.0" y="94.0" width="10.0" height="20.0" rx="3" fill="#e5534b" fill-opacity="0.7" stroke="#e5534b" stroke-width="1"/>
<text x="320.0" y="109.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="700">6 MiB</text>
<text x="40.0" y="160.0" font-size="12.5" fill="#ede6d8" text-anchor="start" font-weight="600">2 MiB pages</text>
<text x="40.0" y="177.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">1,536 × 2 MiB</text>
<rect x="300.0" y="150.0" width="182.0" height="20.0" rx="3" fill="#e2b45a" fill-opacity="0.7" stroke="#e2b45a" stroke-width="1"/>
<text x="492.0" y="165.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="700">3 GiB</text>
<text x="40.0" y="216.0" font-size="12.5" fill="#ede6d8" text-anchor="start" font-weight="600">1 GiB pages</text>
<text x="40.0" y="233.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">entries × 1 GiB</text>
<rect x="300.0" y="206.0" width="402.0" height="20.0" rx="3" fill="#7cc47f" fill-opacity="0.7" stroke="#7cc47f" stroke-width="1"/>
<text x="712.0" y="221.0" font-size="12" fill="#7cc47f" text-anchor="start" font-weight="700">many GiB</text>
<text x="40.0" y="282.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">With 4 KiB pages, a working set bigger than a few MiB can't stay in the TLB, so random access across a 50 GB</text>
<text x="40.0" y="301.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">hash table misses on nearly every lookup. Huge pages raise reach 512× per entry. Exact entry counts differ by</text>
<text x="40.0" y="320.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">CPU and by page size (1 GiB entries are fewer), but the orders of magnitude hold.</text>
</svg>
