<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 279" width="360" height="279" role="img" aria-label="Snapshots let you rebuild state from a recent point instead of replaying every event" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
