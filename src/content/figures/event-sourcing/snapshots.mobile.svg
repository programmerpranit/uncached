<text x="16.0" y="170.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Without a snapshot: replay all events from #1.</text>
<text x="16.0" y="192.0" font-size="12" fill="#7cc47f" text-anchor="start" font-weight="400">With one: load it + replay the tail.</text>
<text x="16.0" y="230.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">Snapshots are a disposable cache;</text>
<text x="16.0" y="249.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">events remain the source of truth.</text>
