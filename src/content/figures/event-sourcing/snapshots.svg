<text x="30.0" y="170.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Without a snapshot: replay all events from #1.</text>
<text x="30.0" y="192.0" font-size="12" fill="#7cc47f" text-anchor="start" font-weight="400">With one: load snapshot, replay only the tail.</text>
<text x="30.0" y="230.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">Snapshots are a cache of state at a version. They can be</text>
<text x="30.0" y="249.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">thrown away and rebuilt; the events stay the source of truth.</text>
