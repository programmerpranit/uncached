<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 376" width="880" height="376" role="img" aria-label="A CRUD row stores only current state; an event log stores every change" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="376" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Storing state vs storing events</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">the same bank account, two ways</text>
<text x="30.0" y="92.0" font-size="13" fill="#a69d8e" text-anchor="start" font-weight="700">CRUD: current state only</text>
<rect x="30.0" y="106.0" width="360.0" height="70.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="48.0" y="134.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">accounts</text>
<text x="48.0" y="160.0" font-size="13" fill="#ede6d8" text-anchor="start" font-weight="600">id=42  owner=Ana  balance=100</text>
<text x="30.0" y="210.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Each UPDATE overwrites the row.</text>
<text x="30.0" y="229.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">How did we get to 100? Unknown,</text>
<text x="30.0" y="248.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">unless you also keep an audit log.</text>
<text x="450.0" y="92.0" font-size="13" fill="#ff5b2e" text-anchor="start" font-weight="700">Event sourcing: append-only log</text>
<rect x="450.0" y="106.0" width="400.0" height="36.0" rx="3" fill="#5fb3a1" fill-opacity="0.15" stroke="#5fb3a1" stroke-width="1"/>
<text x="464.0" y="129.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">#1  AccountOpened</text>
<text x="836.0" y="129.0" font-size="12" fill="#5fb3a1" text-anchor="end" font-weight="600">owner: Ana</text>
<rect x="450.0" y="150.0" width="400.0" height="36.0" rx="3" fill="#7cc47f" fill-opacity="0.15" stroke="#7cc47f" stroke-width="1"/>
<text x="464.0" y="173.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">#2  MoneyDeposited</text>
<text x="836.0" y="173.0" font-size="12" fill="#7cc47f" text-anchor="end" font-weight="600">+100</text>
<rect x="450.0" y="194.0" width="400.0" height="36.0" rx="3" fill="#e2b45a" fill-opacity="0.15" stroke="#e2b45a" stroke-width="1"/>
<text x="464.0" y="217.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">#3  MoneyWithdrawn</text>
<text x="836.0" y="217.0" font-size="12" fill="#e2b45a" text-anchor="end" font-weight="600">−30</text>
<rect x="450.0" y="238.0" width="400.0" height="36.0" rx="3" fill="#7cc47f" fill-opacity="0.15" stroke="#7cc47f" stroke-width="1"/>
<text x="464.0" y="261.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">#4  MoneyDeposited</text>
<text x="836.0" y="261.0" font-size="12" fill="#7cc47f" text-anchor="end" font-weight="600">+50</text>
<rect x="450.0" y="282.0" width="400.0" height="36.0" rx="3" fill="#e2b45a" fill-opacity="0.15" stroke="#e2b45a" stroke-width="1"/>
<text x="464.0" y="305.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">#5  MoneyWithdrawn</text>
<text x="836.0" y="305.0" font-size="12" fill="#e2b45a" text-anchor="end" font-weight="600">−20</text>
<text x="450.0" y="346.0" font-size="13" fill="#ff5b2e" text-anchor="start" font-weight="700">fold(events) → balance = 100</text>
</svg>
