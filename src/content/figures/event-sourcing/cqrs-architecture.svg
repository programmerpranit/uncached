<text x="100.0" y="410.0" font-size="11" fill="#5fb3a1" text-anchor="start" font-weight="400">query</text>
<text x="30.0" y="500.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Writes go through one model that enforces business rules and emits events.</text>
<text x="30.0" y="519.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Reads come from projections shaped for each screen. They update asynchronously, so reads are eventually consistent.</text>
