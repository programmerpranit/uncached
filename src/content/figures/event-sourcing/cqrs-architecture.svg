<text x="585.0" y="129.0" font-size="13" fill="#ff5b2e" text-anchor="middle" font-weight="600">event store</text>
<text x="585.0" y="145.0" font-size="11" fill="#ff5b2e" text-anchor="middle" font-weight="400">append-only log</text>
<line x1="585.0" y1="170.0" x2="585.0" y2="214.0" stroke="#a69d8e" stroke-width="1.3" marker-end="url(#ah1)"/>
