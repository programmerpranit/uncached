<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 347" width="360" height="347" role="img" aria-label="Shuffle sharding assigns each customer a random subset of workers so one bad customer rarely shares all workers with another" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="347" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Shuffle sharding</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">8 workers, 2 per customer</text>
<rect x="16.0" y="82.0" width="76.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="54.0" y="110.7" font-size="13" fill="#a69d8e" text-anchor="middle" font-weight="600">w0</text>
<rect x="99.0" y="82.0" width="76.0" height="48.0" rx="3" fill="#e5534b" fill-opacity="0.75" stroke="#e5534b" stroke-width="1"/>
<text x="137.0" y="110.7" font-size="13" fill="#1b1712" text-anchor="middle" font-weight="600">w1</text>
<rect x="182.0" y="82.0" width="76.0" height="48.0" rx="3" fill="#5fb3a1" fill-opacity="0.75" stroke="#5fb3a1" stroke-width="1"/>
<text x="220.0" y="110.7" font-size="13" fill="#1b1712" text-anchor="middle" font-weight="600">w2</text>
<rect x="265.0" y="82.0" width="76.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="303.0" y="110.7" font-size="13" fill="#a69d8e" text-anchor="middle" font-weight="600">w3</text>
<rect x="16.0" y="140.0" width="76.0" height="48.0" rx="3" fill="#e5534b" fill-opacity="0.75" stroke="#e5534b" stroke-width="1"/>
<text x="54.0" y="168.7" font-size="13" fill="#1b1712" text-anchor="middle" font-weight="600">w4</text>
<rect x="99.0" y="140.0" width="76.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="137.0" y="168.7" font-size="13" fill="#a69d8e" text-anchor="middle" font-weight="600">w5</text>
<rect x="182.0" y="140.0" width="76.0" height="48.0" rx="3" fill="#e2b45a" fill-opacity="0.75" stroke="#e2b45a" stroke-width="1"/>
<text x="220.0" y="168.7" font-size="13" fill="#1b1712" text-anchor="middle" font-weight="600">w6</text>
<rect x="265.0" y="140.0" width="76.0" height="48.0" rx="3" fill="#5fb3a1" fill-opacity="0.75" stroke="#5fb3a1" stroke-width="1"/>
<text x="303.0" y="168.7" font-size="13" fill="#1b1712" text-anchor="middle" font-weight="600">w7</text>
<text x="16.0" y="222.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="400">A (poison) → w1, w4</text>
<text x="16.0" y="241.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="400">B → w4, w6: degraded, not down</text>
<text x="16.0" y="260.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="400">C → w2, w7: untouched</text>
<text x="16.0" y="298.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">28 possible pairs from 8 workers,</text>
<text x="16.0" y="317.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">so full overlap with A is 1 in 28.</text>
</svg>
