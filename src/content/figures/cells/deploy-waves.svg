<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 288" width="880" height="288" role="img" aria-label="Changes are deployed to a canary cell, then progressively larger waves of cells" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="288" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Deploy cell by cell</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">each wave widens only after the previous one stays healthy</text>
<rect x="40.0" y="110.0" width="72.0" height="60.0" rx="3" fill="#ff5b2e" fill-opacity="0.2" stroke="#ff5b2e" stroke-width="1"/>
<text x="52.0" y="134.0" font-size="13" fill="#ff5b2e" text-anchor="start" font-weight="700">canary</text>
<text x="52.0" y="156.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">1 cell</text>
<text x="118.0" y="144.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">bake →</text>
<rect x="172.0" y="110.0" width="84.0" height="60.0" rx="3" fill="#e2b45a" fill-opacity="0.2" stroke="#e2b45a" stroke-width="1"/>
<text x="184.0" y="134.0" font-size="13" fill="#e2b45a" text-anchor="start" font-weight="700">wave 1</text>
<text x="184.0" y="156.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">2 cells</text>
<text x="262.0" y="144.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">bake →</text>
<rect x="316.0" y="110.0" width="156.0" height="60.0" rx="3" fill="#5fb3a1" fill-opacity="0.2" stroke="#5fb3a1" stroke-width="1"/>
<text x="328.0" y="134.0" font-size="13" fill="#5fb3a1" text-anchor="start" font-weight="700">wave 2</text>
<text x="328.0" y="156.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">8 cells</text>
<text x="478.0" y="144.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">bake →</text>
<rect x="532.0" y="110.0" width="260.0" height="60.0" rx="3" fill="#7cc47f" fill-opacity="0.2" stroke="#7cc47f" stroke-width="1"/>
<text x="544.0" y="134.0" font-size="13" fill="#7cc47f" text-anchor="start" font-weight="700">wave 3</text>
<text x="544.0" y="156.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">rest</text>
<text x="40.0" y="220.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">A change reaches one cell first, then a few, then many, with automated health checks and bake time between waves.</text>
<text x="40.0" y="239.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Rollback is per cell. Config changes and feature flags follow the same waves, since they cause</text>
<text x="40.0" y="258.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">outages just as often as code.</text>
</svg>
