<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 399" width="880" height="399" role="img" aria-label="A thin cell router maps a partition key to one of several full-stack cells" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="399" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2b45a"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5b2e"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">The cell router: the thin layer above the cells</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">maps each partition key to its cell; must be the simplest thing in the system</text>
<rect x="40.0" y="140.0" width="130.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="105.0" y="162.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">request</text>
<text x="105.0" y="178.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">customer_id=8812</text>
<rect x="240.0" y="130.0" width="200.0" height="70.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="340.0" y="162.0" font-size="13" fill="#ff5b2e" text-anchor="middle" font-weight="600">cell router</text>
<text x="340.0" y="178.0" font-size="11" fill="#ff5b2e" text-anchor="middle" font-weight="400">lookup 8812 → cell 3</text>
<line x1="172.0" y1="165.0" x2="238.0" y2="165.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="240.0" y="240.0" width="200.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="340.0" y="266.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="600">cell map (replicated)</text>
<line x1="340.0" y1="238.0" x2="340.0" y2="202.0" stroke="#e2b45a" stroke-width="1" marker-end="url(#ah1)" stroke-dasharray="4 3"/>
<rect x="540.0" y="80.0" width="300.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="690.0" y="102.0" font-size="12" fill="#5fb3a1" text-anchor="middle" font-weight="600">cell 1</text>
<text x="690.0" y="118.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="400">LB → app → cache → DB (full stack)</text>
<line x1="442.0" y1="165.0" x2="538.0" y2="105.0" stroke="#a69d8e" stroke-width="0.8" marker-end="url(#ah0)" stroke-dasharray="4 3"/>
<rect x="540.0" y="142.0" width="300.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="690.0" y="164.0" font-size="12" fill="#5fb3a1" text-anchor="middle" font-weight="600">cell 2</text>
<text x="690.0" y="180.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="400">LB → app → cache → DB (full stack)</text>
<line x1="442.0" y1="165.0" x2="538.0" y2="167.0" stroke="#a69d8e" stroke-width="0.8" marker-end="url(#ah0)" stroke-dasharray="4 3"/>
<rect x="540.0" y="204.0" width="300.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="690.0" y="226.0" font-size="12" fill="#ff5b2e" text-anchor="middle" font-weight="600">cell 3</text>
<text x="690.0" y="242.0" font-size="11" fill="#ff5b2e" text-anchor="middle" font-weight="400">LB → app → cache → DB (full stack)</text>
<line x1="442.0" y1="165.0" x2="538.0" y2="229.0" stroke="#ff5b2e" stroke-width="1.2" marker-end="url(#ah2)"/>
<rect x="540.0" y="266.0" width="300.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="690.0" y="288.0" font-size="12" fill="#5fb3a1" text-anchor="middle" font-weight="600">cell 4</text>
<text x="690.0" y="304.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="400">LB → app → cache → DB (full stack)</text>
<line x1="442.0" y1="165.0" x2="538.0" y2="291.0" stroke="#a69d8e" stroke-width="0.8" marker-end="url(#ah0)" stroke-dasharray="4 3"/>
<text x="40.0" y="350.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">The router has no business logic: it reads a key from the request, looks it up in a cached map, and forwards.</text>
<text x="40.0" y="369.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Keep it stateless and boring, because it is the one component shared by every cell.</text>
</svg>
