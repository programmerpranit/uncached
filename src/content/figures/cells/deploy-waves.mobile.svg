<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 419" width="360" height="419" role="img" aria-label="Changes are deployed to a canary cell, then progressively larger waves of cells" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="419" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Deploy cell by cell</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">waves, with bake time</text>
<rect x="16.0" y="72.0" width="328.0" height="46.0" rx="3" fill="#ff5b2e" fill-opacity="0.2" stroke="#ff5b2e" stroke-width="1"/>
<text x="28.0" y="92.0" font-size="12.5" fill="#ff5b2e" text-anchor="start" font-weight="700">canary</text>
<text x="28.0" y="110.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">1 cell</text>
<text x="180.0" y="134.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">↓ bake + health checks</text>
<rect x="16.0" y="148.0" width="328.0" height="46.0" rx="3" fill="#e2b45a" fill-opacity="0.2" stroke="#e2b45a" stroke-width="1"/>
<text x="28.0" y="168.0" font-size="12.5" fill="#e2b45a" text-anchor="start" font-weight="700">wave 1</text>
<text x="28.0" y="186.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">2 cells</text>
<text x="180.0" y="210.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">↓ bake + health checks</text>
<rect x="16.0" y="224.0" width="328.0" height="46.0" rx="3" fill="#5fb3a1" fill-opacity="0.2" stroke="#5fb3a1" stroke-width="1"/>
<text x="28.0" y="244.0" font-size="12.5" fill="#5fb3a1" text-anchor="start" font-weight="700">wave 2</text>
<text x="28.0" y="262.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">8 cells</text>
<text x="180.0" y="286.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">↓ bake + health checks</text>
<rect x="16.0" y="300.0" width="328.0" height="46.0" rx="3" fill="#7cc47f" fill-opacity="0.2" stroke="#7cc47f" stroke-width="1"/>
<text x="28.0" y="320.0" font-size="12.5" fill="#7cc47f" text-anchor="start" font-weight="700">wave 3</text>
<text x="28.0" y="338.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">rest</text>
<text x="16.0" y="370.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Config and flags follow the same</text>
<text x="16.0" y="389.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">waves as code.</text>
</svg>
