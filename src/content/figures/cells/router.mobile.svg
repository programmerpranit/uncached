<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 449" width="360" height="449" role="img" aria-label="A thin cell router maps a partition key to one of several full-stack cells" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="449" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">The cell router</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">partition key → cell</text>
<rect x="16.0" y="72.0" width="328.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="180.0" y="98.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">request: customer_id=8812</text>
<rect x="16.0" y="132.0" width="328.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="180.0" y="154.0" font-size="13" fill="#ff5b2e" text-anchor="middle" font-weight="600">cell router</text>
<text x="180.0" y="170.0" font-size="11" fill="#ff5b2e" text-anchor="middle" font-weight="400">cached map: 8812 → cell 3</text>
<line x1="180.0" y1="118.0" x2="180.0" y2="130.0" stroke="#a69d8e" stroke-width="1.1" marker-end="url(#ah0)"/>
<rect x="16.0" y="200.0" width="328.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="224.1" font-size="11.5" fill="#5fb3a1" text-anchor="middle" font-weight="600">cell 1: full stack</text>
<rect x="16.0" y="246.0" width="328.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="270.1" font-size="11.5" fill="#5fb3a1" text-anchor="middle" font-weight="600">cell 2: full stack</text>
<rect x="16.0" y="292.0" width="328.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="180.0" y="316.1" font-size="11.5" fill="#ff5b2e" text-anchor="middle" font-weight="600">cell 3: full stack</text>
<rect x="16.0" y="338.0" width="328.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="362.1" font-size="11.5" fill="#5fb3a1" text-anchor="middle" font-weight="600">cell 4: full stack</text>
<text x="16.0" y="400.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">The router is shared by every cell,</text>
<text x="16.0" y="419.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">so keep it stateless and boring.</text>
</svg>
