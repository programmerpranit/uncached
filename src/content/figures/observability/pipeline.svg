<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 349" width="880" height="349" role="img" aria-label="Services emit telemetry through the OpenTelemetry SDK over OTLP to a collector that batches, redacts, samples and enriches it, then routes metrics, traces and logs to separate backends" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="349" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5b2e"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Telemetry pipeline</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">instrument once with OpenTelemetry; route to any backend</text>
<rect x="40.0" y="110.0" width="170.0" height="90.0" rx="3" fill="#ff5b2e" fill-opacity="0.15" stroke="#ff5b2e" stroke-width="1"/>
<text x="125.0" y="152.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Service</text>
<text x="125.0" y="168.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">OTel SDK</text>
<rect x="300.0" y="90.0" width="220.0" height="130.0" rx="3" fill="#9b8cff" fill-opacity="0.1" stroke="#9b8cff" stroke-width="1"/>
<text x="410.0" y="158.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="316.0" y="114.0" font-size="12.5" fill="#9b8cff" text-anchor="start" font-weight="700">Collector</text>
<text x="316.0" y="138.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">batch · retry</text>
<text x="316.0" y="157.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">redact PII</text>
<text x="316.0" y="176.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">tail-sample traces</text>
<text x="316.0" y="195.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">add k8s metadata</text>
<line x1="210.0" y1="155.0" x2="298.0" y2="155.0" stroke="#ff5b2e" stroke-width="1.5" marker-end="url(#ah0)"/>
<text x="254.0" y="146.0" font-size="9.5" fill="#a69d8e" text-anchor="middle" font-weight="400">OTLP</text>
<rect x="620.0" y="70.0" width="220.0" height="50.0" rx="3" fill="#5fb3a1" fill-opacity="0.15" stroke="#5fb3a1" stroke-width="1"/>
<text x="730.0" y="92.0" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Metrics TSDB</text>
<text x="730.0" y="108.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">Prometheus / Mimir</text>
<line x1="520.0" y1="155.0" x2="618.0" y2="95.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah1)"/>
<rect x="620.0" y="135.0" width="220.0" height="50.0" rx="3" fill="#9b8cff" fill-opacity="0.15" stroke="#9b8cff" stroke-width="1"/>
<text x="730.0" y="157.0" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Trace store</text>
<text x="730.0" y="173.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">Tempo / Jaeger</text>
<line x1="520.0" y1="155.0" x2="618.0" y2="160.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah1)"/>
<rect x="620.0" y="200.0" width="220.0" height="50.0" rx="3" fill="#e2b45a" fill-opacity="0.15" stroke="#e2b45a" stroke-width="1"/>
<text x="730.0" y="222.0" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Log store</text>
<text x="730.0" y="238.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">Loki / Elasticsearch</text>
<line x1="520.0" y1="155.0" x2="618.0" y2="225.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah1)"/>
<text x="40.0" y="300.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">The collector decouples apps from vendors and is where cost control lives: sampling,</text>
<text x="40.0" y="319.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">dropping noisy attributes, and keeping cardinality in check before it hits storage.</text>
</svg>
