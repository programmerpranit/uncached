<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360" role="img" aria-label="Services emit telemetry through the OpenTelemetry SDK over OTLP to a collector that batches, redacts, samples and enriches it, then routes metrics, traces and logs to separate backends" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="360" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Telemetry pipeline</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">collect, process, route</text>
<rect x="16.0" y="80.0" width="328.0" height="40.0" rx="3" fill="#ff5b2e" fill-opacity="0.15" stroke="#ff5b2e" stroke-width="1"/>
<text x="180.0" y="104.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Service + OTel SDK</text>
<line x1="180.0" y1="120.0" x2="180.0" y2="136.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="16.0" y="138.0" width="328.0" height="62.0" rx="3" fill="#9b8cff" fill-opacity="0.15" stroke="#9b8cff" stroke-width="1"/>
<text x="180.0" y="166.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Collector</text>
<text x="180.0" y="182.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">batch · redact · sample</text>
<line x1="180.0" y1="200.0" x2="180.0" y2="216.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="16.0" y="218.0" width="104.0" height="40.0" rx="3" fill="#5fb3a1" fill-opacity="0.15" stroke="#5fb3a1" stroke-width="1"/>
<text x="68.0" y="242.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Metrics</text>
<rect x="128.0" y="218.0" width="104.0" height="40.0" rx="3" fill="#9b8cff" fill-opacity="0.15" stroke="#9b8cff" stroke-width="1"/>
<text x="180.0" y="242.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Traces</text>
<rect x="240.0" y="218.0" width="104.0" height="40.0" rx="3" fill="#e2b45a" fill-opacity="0.15" stroke="#e2b45a" stroke-width="1"/>
<text x="292.0" y="242.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Logs</text>
<text x="16.0" y="292.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">Instrument once; the collector</text>
<text x="16.0" y="311.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">routes, samples and controls</text>
<text x="16.0" y="330.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">cost before storage.</text>
</svg>
