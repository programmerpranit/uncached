<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 431" width="360" height="431" role="img" aria-label="Metrics answer whether something is wrong and are cheap and aggregated; traces answer where, following one request across services; logs answer why, with detailed high-cardinality context" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="431" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Three signals, three questions</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">logs · metrics · traces</text>
<rect x="16.0" y="80.0" width="328.0" height="84.0" rx="3" fill="#5fb3a1" fill-opacity="0.1" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="125.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="28.0" y="102.0" font-size="11.5" fill="#5fb3a1" text-anchor="start" font-weight="700">Metrics: Is something wrong?</text>
<text x="28.0" y="124.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">counters, gauges, histograms over time</text>
<text x="28.0" y="146.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">cheap · aggregated · low cardinality</text>
<rect x="16.0" y="176.0" width="328.0" height="84.0" rx="3" fill="#9b8cff" fill-opacity="0.1" stroke="#9b8cff" stroke-width="1"/>
<text x="180.0" y="221.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="28.0" y="198.0" font-size="11.5" fill="#9b8cff" text-anchor="start" font-weight="700">Traces: Where is it wrong?</text>
<text x="28.0" y="220.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">one request across services, as spans</text>
<text x="28.0" y="242.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">sampled · causal · per request</text>
<rect x="16.0" y="272.0" width="328.0" height="84.0" rx="3" fill="#e2b45a" fill-opacity="0.1" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="317.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="28.0" y="294.0" font-size="11.5" fill="#e2b45a" text-anchor="start" font-weight="700">Logs: Why is it wrong?</text>
<text x="28.0" y="316.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">discrete events with full context fields</text>
<text x="28.0" y="338.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">expensive · detailed · high cardinality</text>
<text x="16.0" y="382.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">alert (metric) → slow span</text>
<text x="16.0" y="401.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">(trace) → cause (logs)</text>
</svg>
