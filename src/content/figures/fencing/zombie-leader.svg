<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 469" width="880" height="469" role="img" aria-label="A paused client writes after its lease expired, corrupting data" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="469" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5b2e"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2b45a"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">The zombie leader problem</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">a paused process doesn’t know its lease expired</text>
<text x="30.0" y="114.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">client 1</text>
<line x1="150.0" y1="110.0" x2="840.0" y2="110.0" stroke="#4a4136" stroke-width="1"/>
<text x="30.0" y="194.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">lock service</text>
<line x1="150.0" y1="190.0" x2="840.0" y2="190.0" stroke="#4a4136" stroke-width="1"/>
<text x="30.0" y="274.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">client 2</text>
<line x1="150.0" y1="270.0" x2="840.0" y2="270.0" stroke="#4a4136" stroke-width="1"/>
<text x="30.0" y="354.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="600">storage</text>
<line x1="150.0" y1="350.0" x2="840.0" y2="350.0" stroke="#4a4136" stroke-width="1"/>
<line x1="170.0" y1="110.0" x2="170.0" y2="186.0" stroke="#a69d8e" stroke-width="1.1" marker-end="url(#ah0)"/>
<text x="164.0" y="150.0" font-size="10" fill="#a69d8e" text-anchor="end" font-weight="400">acquire</text>
<line x1="190.0" y1="190.0" x2="190.0" y2="114.0" stroke="#5fb3a1" stroke-width="1.1" marker-end="url(#ah1)"/>
<text x="196.0" y="140.0" font-size="10" fill="#5fb3a1" text-anchor="start" font-weight="400">ok</text>
<rect x="170.0" y="92.0" width="250.0" height="10.0" rx="2" fill="#5fb3a1" fill-opacity="0.5" stroke="none" stroke-width="1"/>
<text x="170.0" y="86.0" font-size="10" fill="#5fb3a1" text-anchor="start" font-weight="400">lease held</text>
<rect x="240.0" y="104.0" width="300.0" height="12.0" rx="2" fill="#e5534b" fill-opacity="0.55" stroke="none" stroke-width="1"/>
<text x="390.0" y="128.0" font-size="11" fill="#e5534b" text-anchor="middle" font-weight="600">stop-the-world GC pause</text>
<text x="422.0" y="86.0" font-size="10" fill="#e2b45a" text-anchor="start" font-weight="400">lease expires</text>
<line x1="450.0" y1="270.0" x2="450.0" y2="194.0" stroke="#a69d8e" stroke-width="1.1" marker-end="url(#ah0)"/>
<text x="444.0" y="232.0" font-size="10" fill="#a69d8e" text-anchor="end" font-weight="400">acquire</text>
<line x1="470.0" y1="190.0" x2="470.0" y2="266.0" stroke="#ff5b2e" stroke-width="1.1" marker-end="url(#ah2)"/>
<text x="476.0" y="216.0" font-size="10" fill="#ff5b2e" text-anchor="start" font-weight="400">ok</text>
<line x1="500.0" y1="270.0" x2="500.0" y2="346.0" stroke="#ff5b2e" stroke-width="1.3" marker-end="url(#ah2)"/>
<text x="506.0" y="320.0" font-size="10" fill="#ff5b2e" text-anchor="start" font-weight="400">write</text>
<line x1="560.0" y1="110.0" x2="560.0" y2="346.0" stroke="#e2b45a" stroke-width="1.3" marker-end="url(#ah3)"/>
<text x="566.0" y="300.0" font-size="10" fill="#e2b45a" text-anchor="start" font-weight="400">write — thinks it still holds the lock</text>
<text x="560.0" y="376.0" font-size="12" fill="#e5534b" text-anchor="middle" font-weight="700">✕ both clients wrote: data corrupted</text>
<text x="30.0" y="420.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Client 1 checked its lease before the pause, so from its point of view it is still the leader. Leases alone</text>
<text x="30.0" y="439.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">can’t prevent this; the process has no way to notice it was paused.</text>
</svg>
