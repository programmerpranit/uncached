<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 367" width="360" height="367" role="img" aria-label="Monotonic fencing tokens let storage reject writes from an expired lock holder" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="367" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">With fencing tokens</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">storage rejects stale tokens</text>
<circle cx="28.0" cy="74.0" r="9" fill="#5fb3a1" fill-opacity="0.9" stroke="none" stroke-width="1"/>
<text x="28.0" y="78.0" font-size="10" fill="#1b1712" text-anchor="middle" font-weight="700">1</text>
<text x="46.0" y="78.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">client 1 acquires the lock → token 33</text>
<circle cx="28.0" cy="108.0" r="9" fill="#e5534b" fill-opacity="0.9" stroke="none" stroke-width="1"/>
<text x="28.0" y="112.0" font-size="10" fill="#1b1712" text-anchor="middle" font-weight="700">2</text>
<text x="46.0" y="112.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">client 1 pauses (GC, VM stall)…</text>
<circle cx="28.0" cy="142.0" r="9" fill="#e2b45a" fill-opacity="0.9" stroke="none" stroke-width="1"/>
<text x="28.0" y="146.0" font-size="10" fill="#1b1712" text-anchor="middle" font-weight="700">3</text>
<text x="46.0" y="146.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">lease expires</text>
<circle cx="28.0" cy="176.0" r="9" fill="#ff5b2e" fill-opacity="0.9" stroke="none" stroke-width="1"/>
<text x="28.0" y="180.0" font-size="10" fill="#1b1712" text-anchor="middle" font-weight="700">4</text>
<text x="46.0" y="180.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">client 2 acquires → token 34</text>
<circle cx="28.0" cy="210.0" r="9" fill="#ff5b2e" fill-opacity="0.9" stroke="none" stroke-width="1"/>
<text x="28.0" y="214.0" font-size="10" fill="#1b1712" text-anchor="middle" font-weight="700">5</text>
<text x="46.0" y="214.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">client 2 writes with 34 ✓</text>
<circle cx="28.0" cy="244.0" r="9" fill="#e5534b" fill-opacity="0.9" stroke="none" stroke-width="1"/>
<text x="28.0" y="248.0" font-size="10" fill="#1b1712" text-anchor="middle" font-weight="700">6</text>
<text x="46.0" y="248.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">client 1 wakes, writes with 33</text>
<text x="16.0" y="288.0" font-size="13" fill="#e5534b" text-anchor="start" font-weight="700">✕ storage rejects 33 &lt; 34</text>
<text x="16.0" y="318.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">The storage tracks the highest token</text>
<text x="16.0" y="337.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">it has seen and rejects older ones.</text>
</svg>
