<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 370" width="880" height="370" role="img" aria-label="Nodes race to create a lease-backed key; the winner is leader until its lease lapses" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="370" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5b2e"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Leader election with a lease</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">using etcd / ZooKeeper / Consul</text>
<rect x="40.0" y="90.0" width="140.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="110.0" y="112.0" font-size="13" fill="#ff5b2e" text-anchor="middle" font-weight="600">node A</text>
<text x="110.0" y="128.0" font-size="11" fill="#ff5b2e" text-anchor="middle" font-weight="400">leader</text>
<rect x="40.0" y="170.0" width="140.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="110.0" y="192.0" font-size="13" fill="#ede6d8" text-anchor="middle" font-weight="600">node B</text>
<text x="110.0" y="208.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">watching</text>
<rect x="40.0" y="250.0" width="140.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="110.0" y="272.0" font-size="13" fill="#ede6d8" text-anchor="middle" font-weight="600">node C</text>
<text x="110.0" y="288.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">watching</text>
<rect x="380.0" y="140.0" width="240.0" height="80.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="500.0" y="177.0" font-size="13" fill="#5fb3a1" text-anchor="middle" font-weight="600">/election/leader</text>
<text x="500.0" y="193.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="400">value: A · lease 10 s · rev 34</text>
<line x1="182.0" y1="115.0" x2="378.0" y2="160.0" stroke="#ff5b2e" stroke-width="1.3" marker-end="url(#ah0)"/>
<text x="250.0" y="122.0" font-size="11" fill="#ff5b2e" text-anchor="start" font-weight="400">create-if-absent ✓ + keepalive</text>
<line x1="182.0" y1="195.0" x2="378.0" y2="182.0" stroke="#a69d8e" stroke-width="1.1" marker-end="url(#ah1)" stroke-dasharray="4 3"/>
<line x1="182.0" y1="275.0" x2="378.0" y2="200.0" stroke="#a69d8e" stroke-width="1.1" marker-end="url(#ah1)" stroke-dasharray="4 3"/>
<text x="240.0" y="262.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">create fails → watch key</text>
<text x="660.0" y="150.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">If A stops renewing,</text>
<text x="660.0" y="169.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">the lease expires, the</text>
<text x="660.0" y="188.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">key is deleted and the</text>
<text x="660.0" y="207.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">watchers race again.</text>
<text x="40.0" y="340.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">The revision number of the winning write (34) is a ready-made fencing token: it only ever increases.</text>
</svg>
