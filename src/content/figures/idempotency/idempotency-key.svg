<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 524" width="880" height="524" role="img" aria-label="The server records each idempotency key and replays the stored response on retries" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="524" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ede6d8"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2b45a"/></marker><marker id="ah3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7cc47f"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Idempotency keys</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">the client picks a unique key and reuses it on retries</text>
<text x="136.0" y="84.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="700">client</text>
<text x="440.0" y="84.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="700">API</text>
<text x="744.0" y="84.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="700">key store</text>
<line x1="136.0" y1="96.0" x2="136.0" y2="464.0" stroke="#4a4136" stroke-width="1"/>
<line x1="440.0" y1="96.0" x2="440.0" y2="464.0" stroke="#4a4136" stroke-width="1"/>
<line x1="744.0" y1="96.0" x2="744.0" y2="464.0" stroke="#4a4136" stroke-width="1"/>
<line x1="136.0" y1="128.0" x2="440.0" y2="128.0" stroke="#ede6d8" stroke-width="1.4" marker-end="url(#ah0)"/>
<text x="288.0" y="120.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="400">POST /charge  Idempotency-Key: k1</text>
<line x1="440.0" y1="172.0" x2="744.0" y2="172.0" stroke="#5fb3a1" stroke-width="1.4" marker-end="url(#ah1)"/>
<text x="592.0" y="164.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="400">INSERT key k1 (unique)</text>
<line x1="440.0" y1="216.0" x2="744.0" y2="216.0" stroke="#5fb3a1" stroke-width="1.4" marker-end="url(#ah1)"/>
<text x="592.0" y="208.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="400">charge, store result for k1</text>
<line x1="440.0" y1="260.0" x2="288.0" y2="260.0" stroke="#a69d8e" stroke-width="1.4"/>
<text x="284.0" y="264.0" font-size="14" fill="#e5534b" text-anchor="end" font-weight="700">✕</text>
<text x="288.0" y="252.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">200 OK</text>
<text x="136.0" y="302.0" font-size="12" fill="#e2b45a" text-anchor="middle" font-weight="600">timeout… retry</text>
<line x1="136.0" y1="338.0" x2="440.0" y2="338.0" stroke="#e2b45a" stroke-width="1.4" marker-end="url(#ah2)"/>
<text x="288.0" y="330.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="400">POST /charge  Idempotency-Key: k1</text>
<line x1="440.0" y1="382.0" x2="744.0" y2="382.0" stroke="#7cc47f" stroke-width="1.4" marker-end="url(#ah3)"/>
<text x="592.0" y="374.0" font-size="11" fill="#7cc47f" text-anchor="middle" font-weight="400">k1 exists → load result</text>
<line x1="440.0" y1="426.0" x2="136.0" y2="426.0" stroke="#7cc47f" stroke-width="1.4" marker-end="url(#ah3)" stroke-dasharray="4 4"/>
<text x="288.0" y="418.0" font-size="11" fill="#7cc47f" text-anchor="middle" font-weight="400">200 OK (replayed)</text>
<text x="40.0" y="494.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Same key, same response, and the side effect happens once. A different body with the same key gets a 422.</text>
</svg>
