<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 409" width="360" height="409" role="img" aria-label="A consumer records processed message ids in the same transaction as its side effects" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="409" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Idempotent consumer</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">dedupe + effect in one transaction</text>
<rect x="16.0" y="72.0" width="328.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="100.3" font-size="12" fill="#e2b45a" text-anchor="middle" font-weight="600">queue redelivers msg #881</text>
<line x1="180.0" y1="122.0" x2="180.0" y2="142.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="16.0" y="144.0" width="328.0" height="150.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="28.0" y="166.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="700">one transaction</text>
<rect x="28.0" y="178.0" width="304.0" height="40.0" rx="3" fill="#1b1712" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="180.0" y="202.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">INSERT processed(881)</text>
<rect x="28.0" y="226.0" width="304.0" height="40.0" rx="3" fill="#1b1712" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="180.0" y="250.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">UPDATE balances …</text>
<text x="16.0" y="322.0" font-size="12" fill="#7cc47f" text-anchor="start" font-weight="600">duplicate id → skip and ack</text>
<text x="16.0" y="341.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">otherwise commit both, then ack.</text>
<text x="16.0" y="360.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">A crash before commit applies</text>
<text x="16.0" y="379.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">nothing, so redelivery is safe.</text>
</svg>
