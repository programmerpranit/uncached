<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" role="img" aria-label="A consumer records processed message ids in the same transaction as its side effects" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="350" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Idempotent consumer</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">dedupe and the side effect commit together</text>
<rect x="30.0" y="100.0" width="230.0" height="56.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="145.0" y="125.0" font-size="13" fill="#e2b45a" text-anchor="middle" font-weight="600">queue</text>
<text x="145.0" y="141.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="400">delivers msg #881 (again)</text>
<line x1="262.0" y1="128.0" x2="288.0" y2="128.0" stroke="#a69d8e" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="290.0" y="86.0" width="550.0" height="190.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="306.0" y="110.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="700">one database transaction</text>
<rect x="306.0" y="124.0" width="250.0" height="44.0" rx="3" fill="#1b1712" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="431.0" y="150.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">INSERT processed(id=881)</text>
<rect x="576.0" y="124.0" width="250.0" height="44.0" rx="3" fill="#1b1712" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="701.0" y="150.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">UPDATE balances …</text>
<text x="306.0" y="200.0" font-size="12" fill="#7cc47f" text-anchor="start" font-weight="600">unique violation → already done → ack and skip</text>
<text x="306.0" y="226.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">otherwise commit both, then ack the message</text>
<text x="306.0" y="252.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">crash before commit → nothing applied → redelivery is safe</text>
<text x="40.0" y="320.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Because the dedupe record and the business change commit atomically, a crash can never leave one without the other.</text>
</svg>
