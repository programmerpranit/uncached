<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 403" width="880" height="403" role="img" aria-label="At-most-once, at-least-once and effectively-exactly-once delivery" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="403" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Delivery guarantees</text>
<rect x="40.0" y="80.0" width="800.0" height="74.0" rx="3" fill="#a69d8e" fill-opacity="0.12" stroke="#a69d8e" stroke-width="1"/>
<text x="56.0" y="106.0" font-size="14" fill="#a69d8e" text-anchor="start" font-weight="700">At most once</text>
<text x="56.0" y="130.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">send, never retry — may lose messages; never duplicates</text>
<rect x="40.0" y="166.0" width="800.0" height="74.0" rx="3" fill="#e2b45a" fill-opacity="0.12" stroke="#e2b45a" stroke-width="1"/>
<text x="56.0" y="192.0" font-size="14" fill="#e2b45a" text-anchor="start" font-weight="700">At least once</text>
<text x="56.0" y="216.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">retry until acknowledged — never loses; may duplicate</text>
<rect x="40.0" y="252.0" width="800.0" height="74.0" rx="3" fill="#ff5b2e" fill-opacity="0.12" stroke="#ff5b2e" stroke-width="1"/>
<text x="56.0" y="278.0" font-size="14" fill="#ff5b2e" text-anchor="start" font-weight="700">Exactly once (effectively)</text>
<text x="56.0" y="302.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">at-least-once delivery + idempotent or transactional processing → each effect once</text>
<text x="40.0" y="354.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Networks can’t guarantee a message arrives exactly once. Systems that promise</text>
<text x="40.0" y="373.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">“exactly once” mean the effect happens once.</text>
</svg>
