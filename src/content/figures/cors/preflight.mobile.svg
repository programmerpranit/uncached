<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 473" width="360" height="473" role="img" aria-label="A simple cross-origin GET versus a PUT that first sends an OPTIONS preflight and only proceeds if the server allows the method and headers" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="473" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Simple vs preflight</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">OPTIONS asks first</text>
<text x="16.0" y="90.0" font-size="13" fill="#5fb3a1" text-anchor="start" font-weight="700">A. simple GET</text>
<text x="16.0" y="116.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="700">→</text>
<text x="56.0" y="116.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">GET /items</text>
<text x="56.0" y="131.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">Origin: https://app…</text>
<text x="16.0" y="160.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="700">←</text>
<text x="56.0" y="160.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">200 + Allow-Origin: https://app…</text>
<text x="56.0" y="175.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">JS may read the response</text>
<text x="16.0" y="220.0" font-size="13" fill="#e2b45a" text-anchor="start" font-weight="700">B. PUT + JSON + Authorization</text>
<text x="16.0" y="246.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="700">→</text>
<text x="56.0" y="246.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">OPTIONS /items/7</text>
<text x="56.0" y="261.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">Request-Method: PUT</text>
<text x="56.0" y="276.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">Request-Headers: content-type, auth…</text>
<text x="16.0" y="306.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="700">←</text>
<text x="56.0" y="306.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">204 Allow-Methods: PUT</text>
<text x="56.0" y="321.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">Allow-Headers: …   Max-Age: 600</text>
<text x="16.0" y="352.0" font-size="12" fill="#ff5b2e" text-anchor="start" font-weight="700">→</text>
<text x="56.0" y="352.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">PUT /items/7 (the real request)</text>
<text x="16.0" y="380.0" font-size="12" fill="#ff5b2e" text-anchor="start" font-weight="700">←</text>
<text x="56.0" y="380.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">200 + Allow-Origin</text>
<text x="16.0" y="424.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Preflight fails → the real request</text>
<text x="16.0" y="443.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">is never sent.</text>
</svg>
