<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 599" width="360" height="599" role="img" aria-label="For credentialed CORS the client opts in with credentials include and the server must echo an exact origin, allow credentials and vary on Origin" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="599" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">CORS with cookies</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">both sides opt in</text>
<rect x="16.0" y="84.0" width="328.0" height="74.0" rx="6" fill="#ff5b2e" fill-opacity="0.1" stroke="#ff5b2e" stroke-width="1.2"/>
<text x="28.0" y="104.0" font-size="10.5" fill="#ff5b2e" text-anchor="start" font-weight="700">client</text>
<text x="28.0" y="122.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">fetch(url, { credentials:</text>
<text x="28.0" y="136.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">"include" })</text>
<rect x="16.0" y="166.0" width="328.0" height="74.0" rx="6" fill="#5fb3a1" fill-opacity="0.1" stroke="#5fb3a1" stroke-width="1.2"/>
<text x="28.0" y="186.0" font-size="10.5" fill="#5fb3a1" text-anchor="start" font-weight="700">server</text>
<text x="28.0" y="204.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">Access-Control-Allow-Origin:</text>
<text x="28.0" y="218.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">https://app.example.com</text>
<rect x="16.0" y="248.0" width="328.0" height="74.0" rx="6" fill="#5fb3a1" fill-opacity="0.1" stroke="#5fb3a1" stroke-width="1.2"/>
<text x="28.0" y="268.0" font-size="10.5" fill="#5fb3a1" text-anchor="start" font-weight="700">server</text>
<text x="28.0" y="286.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">Access-Control-Allow-Credentials:</text>
<text x="28.0" y="300.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">true</text>
<rect x="16.0" y="330.0" width="328.0" height="74.0" rx="6" fill="#9b8cff" fill-opacity="0.1" stroke="#9b8cff" stroke-width="1.2"/>
<text x="28.0" y="350.0" font-size="10.5" fill="#9b8cff" text-anchor="start" font-weight="700">server</text>
<text x="28.0" y="368.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">Vary:</text>
<text x="28.0" y="382.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">Origin</text>
<rect x="16.0" y="412.0" width="328.0" height="74.0" rx="6" fill="#e2b45a" fill-opacity="0.1" stroke="#e2b45a" stroke-width="1.2"/>
<text x="28.0" y="432.0" font-size="10.5" fill="#e2b45a" text-anchor="start" font-weight="700">cookie</text>
<text x="28.0" y="450.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">Set-Cookie:</text>
<text x="28.0" y="464.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">sid=…; SameSite=None; Secure</text>
<text x="16.0" y="512.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="400">* is rejected with credentials.</text>
<text x="16.0" y="531.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="400">Reflecting any Origin + Allow-</text>
<text x="16.0" y="550.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="400">Credentials lets any site read</text>
<text x="16.0" y="569.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="400">logged-in data.</text>
</svg>
