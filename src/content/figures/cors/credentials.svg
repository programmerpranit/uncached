<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 505" width="880" height="505" role="img" aria-label="For credentialed CORS the client opts in with credentials include and the server must echo an exact origin, allow credentials and vary on Origin" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="505" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">CORS with cookies (credentials)</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">both sides must opt in, and wildcards stop working</text>
<rect x="40.0" y="96.0" width="800.0" height="58.0" rx="6" fill="#ff5b2e" fill-opacity="0.1" stroke="#ff5b2e" stroke-width="1.2"/>
<text x="56.0" y="120.0" font-size="11" fill="#ff5b2e" text-anchor="start" font-weight="700">client</text>
<text x="130.0" y="120.0" font-size="12.5" fill="#ede6d8" text-anchor="start" font-weight="400">fetch(url, { credentials: "include" })</text>
<text x="130.0" y="140.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">or xhr.withCredentials = true</text>
<rect x="40.0" y="164.0" width="800.0" height="58.0" rx="6" fill="#5fb3a1" fill-opacity="0.1" stroke="#5fb3a1" stroke-width="1.2"/>
<text x="56.0" y="188.0" font-size="11" fill="#5fb3a1" text-anchor="start" font-weight="700">server</text>
<text x="130.0" y="188.0" font-size="12.5" fill="#ede6d8" text-anchor="start" font-weight="400">Access-Control-Allow-Origin: https://app.example.com</text>
<text x="130.0" y="208.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">must echo an exact origin, never *</text>
<rect x="40.0" y="232.0" width="800.0" height="58.0" rx="6" fill="#5fb3a1" fill-opacity="0.1" stroke="#5fb3a1" stroke-width="1.2"/>
<text x="56.0" y="256.0" font-size="11" fill="#5fb3a1" text-anchor="start" font-weight="700">server</text>
<text x="130.0" y="256.0" font-size="12.5" fill="#ede6d8" text-anchor="start" font-weight="400">Access-Control-Allow-Credentials: true</text>
<text x="130.0" y="276.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">otherwise JS can't read the response</text>
<rect x="40.0" y="300.0" width="800.0" height="58.0" rx="6" fill="#9b8cff" fill-opacity="0.1" stroke="#9b8cff" stroke-width="1.2"/>
<text x="56.0" y="324.0" font-size="11" fill="#9b8cff" text-anchor="start" font-weight="700">server</text>
<text x="130.0" y="324.0" font-size="12.5" fill="#ede6d8" text-anchor="start" font-weight="400">Vary: Origin</text>
<text x="130.0" y="344.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">so caches don't serve one origin's answer to another</text>
<rect x="40.0" y="368.0" width="800.0" height="58.0" rx="6" fill="#e2b45a" fill-opacity="0.1" stroke="#e2b45a" stroke-width="1.2"/>
<text x="56.0" y="392.0" font-size="11" fill="#e2b45a" text-anchor="start" font-weight="700">cookie</text>
<text x="130.0" y="392.0" font-size="12.5" fill="#ede6d8" text-anchor="start" font-weight="400">Set-Cookie: sid=…; SameSite=None; Secure</text>
<text x="130.0" y="412.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">third-party contexts need SameSite=None</text>
<text x="40.0" y="456.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="400">Allow-Origin: * with credentials is rejected by the browser. Reflecting any Origin header back with</text>
<text x="40.0" y="475.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="400">Allow-Credentials: true is the classic misconfiguration: it lets any site read logged-in data.</text>
</svg>
