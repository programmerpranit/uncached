<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 488" width="360" height="488" role="img" aria-label="Comparing URLs to https://app.example.com: only a different path keeps the same origin; scheme, host or port changes make it cross-origin" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="488" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Same origin?</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">scheme + host + port must match</text>
<text x="16.0" y="90.0" font-size="12" fill="#ff5b2e" text-anchor="start" font-weight="700">page: https://app.example.com</text>
<rect x="16.0" y="110.0" width="328.0" height="50.0" rx="5" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="28.0" y="130.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">https://app.example.com/a</text>
<text x="28.0" y="149.0" font-size="11" fill="#7cc47f" text-anchor="start" font-weight="600">same (path differs)</text>
<rect x="16.0" y="168.0" width="328.0" height="50.0" rx="5" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="28.0" y="188.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">http://app.example.com</text>
<text x="28.0" y="207.0" font-size="11" fill="#e5534b" text-anchor="start" font-weight="600">cross: scheme</text>
<rect x="16.0" y="226.0" width="328.0" height="50.0" rx="5" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="28.0" y="246.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">https://api.example.com</text>
<text x="28.0" y="265.0" font-size="11" fill="#e5534b" text-anchor="start" font-weight="600">cross: host</text>
<rect x="16.0" y="284.0" width="328.0" height="50.0" rx="5" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="28.0" y="304.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">https://app.example.com:8443</text>
<text x="28.0" y="323.0" font-size="11" fill="#e5534b" text-anchor="start" font-weight="600">cross: port</text>
<rect x="16.0" y="342.0" width="328.0" height="50.0" rx="5" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="28.0" y="362.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">https://example.com</text>
<text x="28.0" y="381.0" font-size="11" fill="#e5534b" text-anchor="start" font-weight="600">cross: host (no subdomain)</text>
<text x="16.0" y="420.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Path never matters. Same-site</text>
<text x="16.0" y="439.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">(example.com) is a cookie idea,</text>
<text x="16.0" y="458.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">not a CORS one.</text>
</svg>
