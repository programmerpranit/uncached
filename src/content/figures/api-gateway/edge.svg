<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 359" width="880" height="359" role="img" aria-label="The API gateway handles north-south traffic from the internet into the cluster, while a service mesh with sidecars handles east-west traffic between services" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="359" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5b2e"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">North–south vs east–west</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">the gateway handles traffic entering the system; a mesh handles traffic between services</text>
<rect x="40.0" y="140.0" width="110.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="95.0" y="169.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Internet</text>
<rect x="210.0" y="130.0" width="150.0" height="70.0" rx="3" fill="#ff5b2e" fill-opacity="0.2" stroke="#ff5b2e" stroke-width="1"/>
<text x="285.0" y="162.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">API gateway</text>
<text x="285.0" y="178.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">north–south</text>
<line x1="150.0" y1="165.0" x2="208.0" y2="165.0" stroke="#ff5b2e" stroke-width="1.5" marker-end="url(#ah0)"/>
<rect x="410.0" y="80.0" width="430.0" height="190.0" rx="3" fill="#5fb3a1" fill-opacity="0.05" stroke="#5fb3a1" stroke-width="1" stroke-dasharray="4,3"/>
<text x="424.0" y="100.0" font-size="11" fill="#5fb3a1" text-anchor="start" font-weight="700">cluster (service mesh: east–west)</text>
<rect x="450.0" y="130.0" width="120.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="510.0" y="154.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">orders</text>
<circle cx="570.0" cy="134.0" r="6" fill="#5fb3a1" fill-opacity="1" stroke="none" stroke-width="1"/>
<rect x="620.0" y="120.0" width="120.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="680.0" y="144.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">users</text>
<circle cx="740.0" cy="124.0" r="6" fill="#5fb3a1" fill-opacity="1" stroke="none" stroke-width="1"/>
<rect x="450.0" y="210.0" width="120.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="510.0" y="234.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">payments</text>
<circle cx="570.0" cy="214.0" r="6" fill="#5fb3a1" fill-opacity="1" stroke="none" stroke-width="1"/>
<rect x="640.0" y="210.0" width="120.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="700.0" y="234.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">stock</text>
<circle cx="760.0" cy="214.0" r="6" fill="#5fb3a1" fill-opacity="1" stroke="none" stroke-width="1"/>
<line x1="360.0" y1="165.0" x2="448.0" y2="150.0" stroke="#ff5b2e" stroke-width="1.4" marker-end="url(#ah0)"/>
<line x1="570.0" y1="150.0" x2="618.0" y2="140.0" stroke="#5fb3a1" stroke-width="1.2" marker-end="url(#ah1)"/>
<line x1="510.0" y1="170.0" x2="510.0" y2="208.0" stroke="#5fb3a1" stroke-width="1.2" marker-end="url(#ah1)"/>
<line x1="570.0" y1="230.0" x2="638.0" y2="230.0" stroke="#5fb3a1" stroke-width="1.2" marker-end="url(#ah1)"/>
<text x="40.0" y="310.0" font-size="11.5" fill="#ff5b2e" text-anchor="start" font-weight="400">Gateway: client auth, API keys, quotas, public routing, response shaping.</text>
<text x="40.0" y="329.0" font-size="11.5" fill="#5fb3a1" text-anchor="start" font-weight="400">Mesh sidecars: mTLS between services, retries, timeouts, traffic splitting, telemetry.</text>
</svg>
