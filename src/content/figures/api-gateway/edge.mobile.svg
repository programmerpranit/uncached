<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 322" width="360" height="322" role="img" aria-label="The API gateway handles north-south traffic from the internet into the cluster, while a service mesh with sidecars handles east-west traffic between services" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="322" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5b2e"/></marker></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">North–south vs east–west</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">gateway vs service mesh</text>
<rect x="16.0" y="72.0" width="328.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="180.0" y="96.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Internet</text>
<rect x="16.0" y="130.0" width="328.0" height="56.0" rx="3" fill="#ff5b2e" fill-opacity="0.2" stroke="#ff5b2e" stroke-width="1"/>
<text x="180.0" y="155.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">API gateway</text>
<text x="180.0" y="171.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">north–south: auth, quotas</text>
<line x1="180.0" y1="112.0" x2="180.0" y2="128.0" stroke="#ff5b2e" stroke-width="1.2" marker-end="url(#ah0)"/>
<line x1="180.0" y1="186.0" x2="180.0" y2="206.0" stroke="#ff5b2e" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="16.0" y="208.0" width="328.0" height="90.0" rx="3" fill="#5fb3a1" fill-opacity="0.06" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="256.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="28.0" y="230.0" font-size="11" fill="#5fb3a1" text-anchor="start" font-weight="700">service mesh: east–west</text>
<text x="28.0" y="254.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">orders ⇄ users ⇄ payments</text>
<text x="28.0" y="273.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">mTLS, retries, telemetry</text>
</svg>
