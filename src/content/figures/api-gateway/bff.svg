<text x="60.0" y="385.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">Mobile BFF returns one compact payload per screen; web BFF returns richer data; partner API stays versioned.</text>
<text x="60.0" y="404.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">Keep BFFs thin: composition and shaping only. Business rules live in the domain services.</text>
