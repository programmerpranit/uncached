<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 359" width="880" height="359" role="img" aria-label="The flag service streams rules to an SDK inside the application, which evaluates targeting rules locally: segments, attributes, then a stable hash-based percentage rollout, then a default" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="359" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b8cff"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7cc47f"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">How a flag is evaluated</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">rules are pushed to the SDK; evaluation is local</text>
<rect x="40.0" y="90.0" width="180.0" height="50.0" rx="3" fill="#9b8cff" fill-opacity="0.15" stroke="#9b8cff" stroke-width="1"/>
<text x="130.0" y="112.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Flag service</text>
<text x="130.0" y="128.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">rules, audit log, UI</text>
<line x1="220.0" y1="115.0" x2="318.0" y2="115.0" stroke="#9b8cff" stroke-width="1.5" marker-end="url(#ah0)"/>
<text x="270.0" y="106.0" font-size="9.5" fill="#a69d8e" text-anchor="middle" font-weight="400">stream</text>
<rect x="320.0" y="80.0" width="240.0" height="180.0" rx="3" fill="#ff5b2e" fill-opacity="0.08" stroke="#ff5b2e" stroke-width="1"/>
<text x="440.0" y="173.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="334.0" y="102.0" font-size="11.5" fill="#ff5b2e" text-anchor="start" font-weight="700">SDK in your service</text>
<text x="334.0" y="128.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">1. user in "beta" segment → ON</text>
<text x="334.0" y="147.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">2. country = DE → OFF</text>
<text x="334.0" y="166.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">3. hash(flag+userId) % 100 &lt; 10</text>
<text x="334.0" y="185.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">   → ON (10% rollout)</text>
<text x="334.0" y="204.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">4. default → OFF</text>
<rect x="620.0" y="90.0" width="220.0" height="50.0" rx="3" fill="#a69d8e" fill-opacity="0.12" stroke="#a69d8e" stroke-width="1"/>
<text x="730.0" y="118.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">isEnabled("new-checkout", ctx)</text>
<line x1="620.0" y1="115.0" x2="562.0" y2="115.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah1)"/>
<rect x="620.0" y="190.0" width="220.0" height="50.0" rx="3" fill="#7cc47f" fill-opacity="0.15" stroke="#7cc47f" stroke-width="1"/>
<text x="730.0" y="219.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">→ true, variant B</text>
<line x1="562.0" y1="215.0" x2="618.0" y2="215.0" stroke="#7cc47f" stroke-width="1.2" marker-end="url(#ah2)"/>
<text x="40.0" y="310.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">Consistent hashing keeps each user in the same bucket as the percentage grows, so</text>
<text x="40.0" y="329.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">nobody flips between old and new on every request. Exposure events feed experiments.</text>
</svg>
