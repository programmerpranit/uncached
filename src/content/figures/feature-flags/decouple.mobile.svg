<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 327" width="360" height="327" role="img" aria-label="Deploys v41 to v44 ship code continuously while a feature flag separately ramps the release from staff to 1, 10, 50 and 100 percent of users" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="327" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Deploy ≠ release</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">ship dark, then turn on</text>
<text x="16.0" y="96.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="700">Deploys (code)</text>
<rect x="16.0" y="106.0" width="74.0" height="32.0" rx="3" fill="#a69d8e" fill-opacity="0.15" stroke="#a69d8e" stroke-width="1"/>
<text x="53.0" y="126.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">v41</text>
<rect x="98.0" y="106.0" width="74.0" height="32.0" rx="3" fill="#a69d8e" fill-opacity="0.15" stroke="#a69d8e" stroke-width="1"/>
<text x="135.0" y="126.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">v42</text>
<rect x="180.0" y="106.0" width="74.0" height="32.0" rx="3" fill="#a69d8e" fill-opacity="0.15" stroke="#a69d8e" stroke-width="1"/>
<text x="217.0" y="126.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">v43</text>
<rect x="262.0" y="106.0" width="74.0" height="32.0" rx="3" fill="#a69d8e" fill-opacity="0.15" stroke="#a69d8e" stroke-width="1"/>
<text x="299.0" y="126.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">v44</text>
<text x="16.0" y="166.0" font-size="11" fill="#ff5b2e" text-anchor="start" font-weight="700">Release (flag)</text>
<rect x="16.0" y="176.0" width="58.0" height="32.0" rx="3" fill="#5fb3a1" fill-opacity="0.18" stroke="#5fb3a1" stroke-width="1"/>
<text x="45.0" y="195.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">staff</text>
<rect x="82.0" y="176.0" width="58.0" height="32.0" rx="3" fill="#e2b45a" fill-opacity="0.18" stroke="#e2b45a" stroke-width="1"/>
<text x="111.0" y="195.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">1%</text>
<rect x="148.0" y="176.0" width="58.0" height="32.0" rx="3" fill="#e2b45a" fill-opacity="0.18" stroke="#e2b45a" stroke-width="1"/>
<text x="177.0" y="195.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">10%</text>
<rect x="214.0" y="176.0" width="58.0" height="32.0" rx="3" fill="#e2b45a" fill-opacity="0.18" stroke="#e2b45a" stroke-width="1"/>
<text x="243.0" y="195.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">50%</text>
<rect x="280.0" y="176.0" width="58.0" height="32.0" rx="3" fill="#7cc47f" fill-opacity="0.18" stroke="#7cc47f" stroke-width="1"/>
<text x="309.0" y="195.8" font-size="10.5" fill="#ede6d8" text-anchor="middle" font-weight="600">100%</text>
<text x="16.0" y="240.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">New code ships dark in v42;</text>
<text x="16.0" y="259.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">the flag ramps exposure with</text>
<text x="16.0" y="278.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">no further deploys and a</text>
<text x="16.0" y="297.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">seconds-fast kill switch.</text>
</svg>
