<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="Deploys v41 to v44 ship code continuously while a feature flag separately ramps the release from staff to 1, 10, 50 and 100 percent of users" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="330" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Deploy ≠ release</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">code ships dark; a flag decides who sees it, and when</text>
<text x="40.0" y="110.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="700">Deploy</text>
<text x="40.0" y="200.0" font-size="12" fill="#ff5b2e" text-anchor="start" font-weight="700">Release</text>
<line x1="130.0" y1="105.0" x2="840.0" y2="105.0" stroke="#4a4136" stroke-width="1"/>
<line x1="130.0" y1="195.0" x2="840.0" y2="195.0" stroke="#4a4136" stroke-width="1"/>
<rect x="160.0" y="88.0" width="90.0" height="34.0" rx="3" fill="#a69d8e" fill-opacity="0.15" stroke="#a69d8e" stroke-width="1"/>
<text x="205.0" y="109.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">v41</text>
<rect x="330.0" y="88.0" width="90.0" height="34.0" rx="3" fill="#a69d8e" fill-opacity="0.15" stroke="#a69d8e" stroke-width="1"/>
<text x="375.0" y="109.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">v42</text>
<rect x="500.0" y="88.0" width="90.0" height="34.0" rx="3" fill="#a69d8e" fill-opacity="0.15" stroke="#a69d8e" stroke-width="1"/>
<text x="545.0" y="109.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">v43</text>
<rect x="670.0" y="88.0" width="90.0" height="34.0" rx="3" fill="#a69d8e" fill-opacity="0.15" stroke="#a69d8e" stroke-width="1"/>
<text x="715.0" y="109.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">v44</text>
<text x="370.0" y="140.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">flag OFF: new checkout code deployed but dark</text>
<rect x="330.0" y="178.0" width="70.0" height="34.0" rx="3" fill="#5fb3a1" fill-opacity="0.18" stroke="#5fb3a1" stroke-width="1"/>
<text x="365.0" y="199.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">staff</text>
<rect x="450.0" y="178.0" width="70.0" height="34.0" rx="3" fill="#e2b45a" fill-opacity="0.18" stroke="#e2b45a" stroke-width="1"/>
<text x="485.0" y="199.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">1%</text>
<rect x="550.0" y="178.0" width="70.0" height="34.0" rx="3" fill="#e2b45a" fill-opacity="0.18" stroke="#e2b45a" stroke-width="1"/>
<text x="585.0" y="199.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">10%</text>
<rect x="650.0" y="178.0" width="70.0" height="34.0" rx="3" fill="#e2b45a" fill-opacity="0.18" stroke="#e2b45a" stroke-width="1"/>
<text x="685.0" y="199.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">50%</text>
<rect x="760.0" y="178.0" width="70.0" height="34.0" rx="3" fill="#7cc47f" fill-opacity="0.18" stroke="#7cc47f" stroke-width="1"/>
<text x="795.0" y="199.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">100%</text>
<line x1="345.0" y1="122.0" x2="355.0" y2="176.0" stroke="#a69d8e" stroke-width="1" marker-end="url(#ah0)" stroke-dasharray="3,3"/>
<text x="600.0" y="240.0" font-size="10" fill="#ff5b2e" text-anchor="middle" font-weight="400">flag ramps: no deploy needed; kill switch flips back in seconds</text>
<text x="40.0" y="300.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">Releases become a configuration change: reversible, targetable, and observable per cohort.</text>
</svg>
