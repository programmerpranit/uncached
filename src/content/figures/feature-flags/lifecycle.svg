<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 409" width="880" height="409" role="img" aria-label="A flag is created with an owner and expiry, deployed dark, ramped from 1 to 100 percent, held fully on, then removed from code; rollback flips it off. Release, experiment, ops and permission flags have different lifespans" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="409" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Every flag needs an exit</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">release flags are temporary; delete them or they become debt</text>
<rect x="40.0" y="110.0" width="140.0" height="54.0" rx="3" fill="#9b8cff" fill-opacity="0.15" stroke="#9b8cff" stroke-width="1"/>
<text x="110.0" y="134.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Create</text>
<text x="110.0" y="150.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">owner + expiry</text>
<rect x="204.0" y="110.0" width="140.0" height="54.0" rx="3" fill="#a69d8e" fill-opacity="0.15" stroke="#a69d8e" stroke-width="1"/>
<text x="274.0" y="134.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Dark</text>
<text x="274.0" y="150.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">deployed off</text>
<line x1="182.0" y1="137.0" x2="202.0" y2="137.0" stroke="#a69d8e" stroke-width="1.5" marker-end="url(#ah0)"/>
<rect x="368.0" y="110.0" width="140.0" height="54.0" rx="3" fill="#e2b45a" fill-opacity="0.15" stroke="#e2b45a" stroke-width="1"/>
<text x="438.0" y="134.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Ramp</text>
<text x="438.0" y="150.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">1→100%</text>
<line x1="346.0" y1="137.0" x2="366.0" y2="137.0" stroke="#a69d8e" stroke-width="1.5" marker-end="url(#ah0)"/>
<rect x="532.0" y="110.0" width="140.0" height="54.0" rx="3" fill="#7cc47f" fill-opacity="0.15" stroke="#7cc47f" stroke-width="1"/>
<text x="602.0" y="134.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Full on</text>
<text x="602.0" y="150.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">100% stable</text>
<line x1="510.0" y1="137.0" x2="530.0" y2="137.0" stroke="#a69d8e" stroke-width="1.5" marker-end="url(#ah0)"/>
<rect x="696.0" y="110.0" width="140.0" height="54.0" rx="3" fill="#ff5b2e" fill-opacity="0.15" stroke="#ff5b2e" stroke-width="1"/>
<text x="766.0" y="134.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Remove</text>
<text x="766.0" y="150.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">delete code path</text>
<line x1="674.0" y1="137.0" x2="694.0" y2="137.0" stroke="#a69d8e" stroke-width="1.5" marker-end="url(#ah0)"/>
<path d="M 600,170 C 600,240 380,240 380,170" fill="none" stroke="#e5534b" stroke-width="1.5"/>
<text x="490.0" y="252.0" font-size="10" fill="#e5534b" text-anchor="middle" font-weight="400">rollback: flip off</text>
<text x="40.0" y="300.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="700">Flag types by lifespan</text>
<text x="40.0" y="322.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">Release toggle — days to weeks, then delete</text>
<text x="40.0" y="341.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">Experiment — weeks, until the result is significant</text>
<text x="40.0" y="360.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">Ops / kill switch — long-lived, owned by on-call</text>
<text x="40.0" y="379.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">Permission / entitlement — permanent, really product config</text>
</svg>
