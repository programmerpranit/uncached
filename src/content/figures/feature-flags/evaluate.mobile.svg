<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 395" width="360" height="395" role="img" aria-label="The flag service streams rules to an SDK inside the application, which evaluates targeting rules locally: segments, attributes, then a stable hash-based percentage rollout, then a default" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="395" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b8cff"/></marker></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Flag evaluation</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">rules cached in SDK, local eval</text>
<rect x="16.0" y="82.0" width="328.0" height="40.0" rx="3" fill="#9b8cff" fill-opacity="0.15" stroke="#9b8cff" stroke-width="1"/>
<text x="180.0" y="106.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">Flag service (rules, audit)</text>
<line x1="180.0" y1="122.0" x2="180.0" y2="138.0" stroke="#9b8cff" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="16.0" y="140.0" width="328.0" height="130.0" rx="3" fill="#ff5b2e" fill-opacity="0.08" stroke="#ff5b2e" stroke-width="1"/>
<text x="180.0" y="208.6" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="28.0" y="160.0" font-size="11" fill="#ff5b2e" text-anchor="start" font-weight="700">SDK cache, local evaluation</text>
<text x="28.0" y="182.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">1. beta segment → ON</text>
<text x="28.0" y="201.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">2. country DE → OFF</text>
<text x="28.0" y="220.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">3. hash(flag+user)%100 &lt; 10 → ON</text>
<text x="28.0" y="239.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">4. default → OFF</text>
<rect x="16.0" y="284.0" width="328.0" height="36.0" rx="3" fill="#7cc47f" fill-opacity="0.15" stroke="#7cc47f" stroke-width="1"/>
<text x="180.0" y="306.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">→ true, variant B</text>
<text x="16.0" y="346.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">Stable hashing keeps users in</text>
<text x="16.0" y="365.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">the same bucket as % grows.</text>
</svg>
