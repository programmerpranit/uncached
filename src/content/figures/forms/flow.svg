<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 449" width="880" height="449" role="img" aria-label="A controlled input sends each change through onChange into React state, which re-renders and writes the value back; an uncontrolled input keeps its value in the DOM and it is read once on submit with FormData" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="449" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5b2e"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Where the value lives</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">controlled: React state is the source of truth · uncontrolled: the DOM is</text>
<text x="40.0" y="104.0" font-size="14" fill="#ff5b2e" text-anchor="start" font-weight="700">Controlled</text>
<rect x="40.0" y="124.0" width="150.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="115.0" y="146.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">&lt;input&gt;</text>
<text x="115.0" y="162.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">value={name}</text>
<rect x="290.0" y="124.0" width="150.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="365.0" y="146.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">onChange</text>
<text x="365.0" y="162.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">setName(value)</text>
<rect x="540.0" y="124.0" width="150.0" height="50.0" rx="3" fill="#ff5b2e" fill-opacity="0.25" stroke="#ff5b2e" stroke-width="1"/>
<text x="615.0" y="146.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">React state</text>
<text x="615.0" y="162.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">name</text>
<line x1="190.0" y1="140.0" x2="290.0" y2="140.0" stroke="#ff5b2e" stroke-width="1.4" marker-end="url(#ah0)"/>
<line x1="440.0" y1="140.0" x2="540.0" y2="140.0" stroke="#ff5b2e" stroke-width="1.4" marker-end="url(#ah0)"/>
<path d="M615,174 L615,214 L115,214 L115,178" fill="none" stroke="#ff5b2e" stroke-width="1.4" marker-end="url(#ah0)"/>
<text x="365.0" y="232.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">re-render writes value back</text>
<text x="720.0" y="134.0" font-size="11.5" fill="#e2b45a" text-anchor="start" font-weight="400">every keystroke</text>
<text x="720.0" y="153.0" font-size="11.5" fill="#e2b45a" text-anchor="start" font-weight="400">= a render</text>
<text x="40.0" y="290.0" font-size="14" fill="#5fb3a1" text-anchor="start" font-weight="700">Uncontrolled</text>
<rect x="40.0" y="310.0" width="150.0" height="50.0" rx="3" fill="#5fb3a1" fill-opacity="0.25" stroke="#5fb3a1" stroke-width="1"/>
<text x="115.0" y="332.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">&lt;input&gt;</text>
<text x="115.0" y="348.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">DOM holds value</text>
<rect x="290.0" y="310.0" width="150.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="365.0" y="332.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">onSubmit</text>
<text x="365.0" y="348.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">new FormData(form)</text>
<rect x="540.0" y="310.0" width="150.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="615.0" y="332.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Server / action</text>
<text x="615.0" y="348.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">once, on submit</text>
<line x1="190.0" y1="335.0" x2="290.0" y2="335.0" stroke="#5fb3a1" stroke-width="1.4" marker-end="url(#ah1)" stroke-dasharray="5 4"/>
<line x1="440.0" y1="335.0" x2="540.0" y2="335.0" stroke="#5fb3a1" stroke-width="1.4" marker-end="url(#ah1)"/>
<text x="240.0" y="326.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">read once</text>
<text x="720.0" y="320.0" font-size="11.5" fill="#7cc47f" text-anchor="start" font-weight="400">typing renders</text>
<text x="720.0" y="339.0" font-size="11.5" fill="#7cc47f" text-anchor="start" font-weight="400">nothing</text>
<text x="40.0" y="400.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Controlled inputs expose the value to render on every change: live formatting, dependent fields.</text>
<text x="40.0" y="419.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Uncontrolled inputs let the browser keep the value; you read it with FormData or a ref when you need it.</text>
</svg>
