<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 395" width="880" height="395" role="img" aria-label="Validation timeline: stay quiet while typing, check on blur, re-check on every change once an error is shown, validate all fields on submit, and validate again on the server with the same schema" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="395" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">When to validate</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">reward early, punish late; the server always has the final say</text>
<rect x="40.0" y="110.0" width="152.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="116.0" y="137.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">While typing</text>
<line x1="192.0" y1="133.0" x2="204.0" y2="133.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<text x="44.0" y="182.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">No errors yet: don't</text>
<text x="44.0" y="201.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">shout at half-typed</text>
<text x="44.0" y="220.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">input</text>
<rect x="204.0" y="110.0" width="152.0" height="46.0" rx="3" fill="#e2b45a" fill-opacity="0.25" stroke="#e2b45a" stroke-width="1"/>
<text x="280.0" y="137.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">On blur</text>
<line x1="356.0" y1="133.0" x2="368.0" y2="133.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<text x="208.0" y="182.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">First check when the</text>
<text x="208.0" y="201.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">user leaves the field</text>
<rect x="368.0" y="110.0" width="152.0" height="46.0" rx="3" fill="#ff5b2e" fill-opacity="0.25" stroke="#ff5b2e" stroke-width="1"/>
<text x="444.0" y="137.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">After an error</text>
<line x1="520.0" y1="133.0" x2="532.0" y2="133.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<text x="372.0" y="182.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">Re-validate on every</text>
<text x="372.0" y="201.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">change so the error</text>
<text x="372.0" y="220.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">clears instantly</text>
<rect x="532.0" y="110.0" width="152.0" height="46.0" rx="3" fill="#9b8cff" fill-opacity="0.25" stroke="#9b8cff" stroke-width="1"/>
<text x="608.0" y="137.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">On submit</text>
<line x1="684.0" y1="133.0" x2="696.0" y2="133.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah0)"/>
<text x="536.0" y="182.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">Validate everything,</text>
<text x="536.0" y="201.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">focus the first</text>
<text x="536.0" y="220.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">invalid field</text>
<rect x="696.0" y="110.0" width="152.0" height="46.0" rx="3" fill="#e5534b" fill-opacity="0.25" stroke="#e5534b" stroke-width="1"/>
<text x="772.0" y="137.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">On the server</text>
<text x="700.0" y="182.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">Same schema again;</text>
<text x="700.0" y="201.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">return field errors</text>
<rect x="40.0" y="270.0" width="800.0" height="46.0" rx="6" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="60.0" y="298.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">One schema (e.g. Zod) shared by client and server: the client check is for speed, the server check is for trust.</text>
<text x="40.0" y="346.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Native constraints (required, type="email", pattern, min) give free checks and messages;</text>
<text x="40.0" y="365.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">style errors with :user-invalid so they appear only after interaction.</text>
</svg>
