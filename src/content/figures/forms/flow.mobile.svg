<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 545" width="360" height="545" role="img" aria-label="A controlled input sends each change through onChange into React state, which re-renders and writes the value back; an uncontrolled input keeps its value in the DOM and it is read once on submit with FormData" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="545" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5b2e"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Where the value lives</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">controlled vs uncontrolled</text>
<text x="16.0" y="100.0" font-size="13" fill="#ff5b2e" text-anchor="start" font-weight="700">Controlled</text>
<rect x="16.0" y="114.0" width="328.0" height="34.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="180.0" y="135.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">&lt;input value&gt;</text>
<line x1="180.0" y1="148.0" x2="180.0" y2="162.0" stroke="#ff5b2e" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="16.0" y="162.0" width="328.0" height="34.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="180.0" y="183.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">onChange → setState</text>
<line x1="180.0" y1="196.0" x2="180.0" y2="210.0" stroke="#ff5b2e" stroke-width="1.3" marker-end="url(#ah0)"/>
<rect x="16.0" y="210.0" width="328.0" height="34.0" rx="3" fill="#ff5b2e" fill-opacity="0.25" stroke="#ff5b2e" stroke-width="1"/>
<text x="180.0" y="231.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">React state</text>
<path d="M344,227 L352,227 L352,131 L344,131" fill="none" stroke="#ff5b2e" stroke-width="1.3" marker-end="url(#ah0)"/>
<text x="16.0" y="260.0" font-size="11" fill="#e2b45a" text-anchor="start" font-weight="400">every keystroke = a render</text>
<text x="16.0" y="298.0" font-size="13" fill="#5fb3a1" text-anchor="start" font-weight="700">Uncontrolled</text>
<rect x="16.0" y="312.0" width="328.0" height="34.0" rx="3" fill="#5fb3a1" fill-opacity="0.25" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="333.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">&lt;input&gt; (DOM value)</text>
<line x1="180.0" y1="346.0" x2="180.0" y2="360.0" stroke="#5fb3a1" stroke-width="1.3" marker-end="url(#ah1)"/>
<rect x="16.0" y="360.0" width="328.0" height="34.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="381.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">onSubmit → FormData</text>
<line x1="180.0" y1="394.0" x2="180.0" y2="408.0" stroke="#5fb3a1" stroke-width="1.3" marker-end="url(#ah1)"/>
<rect x="16.0" y="408.0" width="328.0" height="34.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="429.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">server / action</text>
<text x="16.0" y="458.0" font-size="11" fill="#7cc47f" text-anchor="start" font-weight="400">typing renders nothing</text>
<text x="16.0" y="496.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">Controlled: value in state, available</text>
<text x="16.0" y="515.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">to render. Uncontrolled: read on demand.</text>
</svg>
