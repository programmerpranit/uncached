<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 393" width="880" height="393" role="img" aria-label="Priority inheritance, priority ceiling, disabling preemption and avoiding shared locks as fixes" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="393" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Ways to prevent priority inversion</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">from protocols in the lock to design choices</text>
<rect x="40.0" y="84.0" width="800.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="56.0" y="104.0" font-size="12.5" fill="#7cc47f" text-anchor="start" font-weight="700">priority inheritance</text>
<text x="260.0" y="104.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">boost the holder to the highest waiter's priority</text>
<text x="260.0" y="122.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">e.g. Linux PI futexes, rt_mutex, VxWorks</text>
<rect x="40.0" y="142.0" width="800.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="56.0" y="162.0" font-size="12.5" fill="#5fb3a1" text-anchor="start" font-weight="700">priority ceiling</text>
<text x="260.0" y="162.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">holder runs at the lock's ceiling priority as soon as it locks</text>
<text x="260.0" y="180.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">e.g. POSIX PTHREAD_PRIO_PROTECT, Ada, RTOSes</text>
<rect x="40.0" y="200.0" width="800.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="56.0" y="220.0" font-size="12.5" fill="#e2b45a" text-anchor="start" font-weight="700">disable preemption</text>
<text x="260.0" y="220.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">short critical sections can't be preempted at all</text>
<text x="260.0" y="238.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">e.g. kernel spinlocks, interrupt masking</text>
<rect x="40.0" y="258.0" width="800.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="56.0" y="278.0" font-size="12.5" fill="#9b8cff" text-anchor="start" font-weight="700">avoid shared locks</text>
<text x="260.0" y="278.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">lock-free queues, message passing, one owner per resource</text>
<text x="260.0" y="296.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">e.g. audio threads, real-time loops</text>
<text x="40.0" y="344.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Inheritance is dynamic and only costs when contention happens. Ceilings also prevent deadlock between tasks that</text>
<text x="40.0" y="363.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">follow them, but require knowing every lock's users in advance, which is why they live in safety-critical RTOSes.</text>
</svg>
