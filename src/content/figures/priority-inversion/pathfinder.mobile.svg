<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 284" width="360" height="284" role="img" aria-label="Mars Pathfinder tasks: high-priority bus management, medium communications and low-priority meteorological data sharing a mutex" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="284" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Mars Pathfinder, 1997</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">VxWorks, shared bus mutex</text>
<text x="16.0" y="86.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="700">high</text>
<text x="80.0" y="86.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">bus management task</text>
<text x="16.0" y="112.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="700">medium</text>
<text x="80.0" y="112.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">communications task</text>
<text x="16.0" y="138.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="700">low</text>
<text x="80.0" y="138.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">meteorological data task</text>
<text x="16.0" y="178.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Low held the mutex, medium</text>
<text x="16.0" y="197.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">preempted it, high waited, and</text>
<text x="16.0" y="216.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">a watchdog reset the lander.</text>
<text x="16.0" y="235.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Fix: enable priority inheritance</text>
<text x="16.0" y="254.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">via an uploaded patch.</text>
</svg>
