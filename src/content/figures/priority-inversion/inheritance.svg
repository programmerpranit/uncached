<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 317" width="880" height="317" role="img" aria-label="Timeline with priority inheritance: the low task is boosted while the high task waits, so the medium task cannot preempt it" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="317" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Priority inheritance: boost the lock holder</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">while H waits, L runs at H's priority, so M can't preempt it</text>
<text x="106.0" y="116.0" font-size="13" fill="#e5534b" text-anchor="end" font-weight="700">H</text>
<line x1="120.0" y1="124.0" x2="820.0" y2="124.0" stroke="#4a4136" stroke-width="1"/>
<text x="106.0" y="162.0" font-size="13" fill="#e2b45a" text-anchor="end" font-weight="700">M</text>
<line x1="120.0" y1="170.0" x2="820.0" y2="170.0" stroke="#4a4136" stroke-width="1"/>
<text x="106.0" y="208.0" font-size="13" fill="#5fb3a1" text-anchor="end" font-weight="700">L</text>
<line x1="120.0" y1="216.0" x2="820.0" y2="216.0" stroke="#4a4136" stroke-width="1"/>
<rect x="120.0" y="196.0" width="84.0" height="20.0" rx="3" fill="#5fb3a1" fill-opacity="0.75" stroke="#5fb3a1" stroke-width="1"/>
<text x="162.0" y="210.0" font-size="10.5" fill="#1b1712" text-anchor="middle" font-weight="700">L</text>
<rect x="204.0" y="196.0" width="56.0" height="20.0" rx="3" fill="#5fb3a1" fill-opacity="0.75" stroke="#5fb3a1" stroke-width="1"/>
<text x="232.0" y="210.0" font-size="10.5" fill="#1b1712" text-anchor="middle" font-weight="700">lock</text>
<rect x="260.0" y="104.0" width="42.0" height="20.0" rx="3" fill="#e5534b" fill-opacity="0.75" stroke="#e5534b" stroke-width="1"/>
<text x="281.0" y="118.0" font-size="10.5" fill="#1b1712" text-anchor="middle" font-weight="700">H</text>
<rect x="302.0" y="104.0" width="70.0" height="20.0" rx="3" fill="#e5534b" fill-opacity="0.15" stroke="#e5534b" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="302.0" y="196.0" width="70.0" height="20.0" rx="3" fill="#e5534b" fill-opacity="0.75" stroke="#e5534b" stroke-width="1"/>
<text x="337.0" y="210.0" font-size="10.5" fill="#1b1712" text-anchor="middle" font-weight="700">L@H</text>
<rect x="372.0" y="104.0" width="168.0" height="20.0" rx="3" fill="#e5534b" fill-opacity="0.75" stroke="#e5534b" stroke-width="1"/>
<text x="456.0" y="118.0" font-size="10.5" fill="#1b1712" text-anchor="middle" font-weight="700">H gets lock</text>
<rect x="330.0" y="150.0" width="7.0" height="20.0" rx="3" fill="#e2b45a" fill-opacity="0.75" stroke="#e2b45a" stroke-width="1"/>
<rect x="540.0" y="150.0" width="280.0" height="20.0" rx="3" fill="#e2b45a" fill-opacity="0.75" stroke="#e2b45a" stroke-width="1"/>
<text x="680.0" y="164.0" font-size="10.5" fill="#1b1712" text-anchor="middle" font-weight="700">M</text>
<rect x="372.0" y="196.0" width="14.0" height="20.0" rx="3" fill="#5fb3a1" fill-opacity="0.75" stroke="#5fb3a1" stroke-width="1"/>
<text x="341.0" y="164.0" font-size="10.5" fill="#e2b45a" text-anchor="start" font-weight="400">M ready, must wait</text>
<text x="40.0" y="268.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">While H is blocked on its lock, L runs at H's priority, finishes its critical section and unlocks, so H waits</text>
<text x="40.0" y="287.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">only as long as that critical section. Linux PI futexes (PTHREAD_PRIO_INHERIT) and rt_mutex do this.</text>
</svg>
