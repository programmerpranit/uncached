<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360" role="img" aria-label="The four Coffman conditions with a way to break each" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="360" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Four conditions</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">all four needed; break one</text>
<text x="16.0" y="86.0" font-size="12.5" fill="#5fb3a1" text-anchor="start" font-weight="700">mutual exclusion</text>
<text x="16.0" y="103.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">fix: lock-free or per-thread data</text>
<text x="16.0" y="136.0" font-size="12.5" fill="#e2b45a" text-anchor="start" font-weight="700">hold and wait</text>
<text x="16.0" y="153.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">fix: acquire all at once</text>
<text x="16.0" y="186.0" font-size="12.5" fill="#9b8cff" text-anchor="start" font-weight="700">no preemption</text>
<text x="16.0" y="203.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">fix: try-lock + timeout, roll back</text>
<text x="16.0" y="236.0" font-size="12.5" fill="#7cc47f" text-anchor="start" font-weight="700">circular wait</text>
<text x="16.0" y="253.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">fix: global lock ordering ★</text>
<text x="16.0" y="292.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">★ Lock ordering is the usual fix.</text>
<text x="16.0" y="311.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Databases detect cycles and abort</text>
<text x="16.0" y="330.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">a victim instead.</text>
</svg>
