<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 452" width="360" height="452" role="img" aria-label="Two threads each holding one lock and waiting for the other, forming a cycle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="452" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7cc47f"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e5534b"/></marker></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">The classic deadlock</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">each holds one, waits for the other</text>
<rect x="16.0" y="96.0" width="130.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="81.0" y="116.0" font-size="12" fill="#5fb3a1" text-anchor="middle" font-weight="600">thread 1</text>
<text x="81.0" y="132.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="400">holds A</text>
<rect x="16.0" y="236.0" width="130.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="81.0" y="256.0" font-size="12" fill="#9b8cff" text-anchor="middle" font-weight="600">thread 2</text>
<text x="81.0" y="272.0" font-size="11" fill="#9b8cff" text-anchor="middle" font-weight="400">holds B</text>
<rect x="214.0" y="96.0" width="130.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="279.0" y="123.3" font-size="12" fill="#e2b45a" text-anchor="middle" font-weight="600">lock A</text>
<rect x="214.0" y="236.0" width="130.0" height="46.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="279.0" y="263.3" font-size="12" fill="#e2b45a" text-anchor="middle" font-weight="600">lock B</text>
<line x1="212.0" y1="119.0" x2="148.0" y2="119.0" stroke="#7cc47f" stroke-width="1.5" marker-end="url(#ah0)"/>
<line x1="212.0" y1="259.0" x2="148.0" y2="259.0" stroke="#7cc47f" stroke-width="1.5" marker-end="url(#ah0)"/>
<line x1="146.0" y1="140.0" x2="214.0" y2="240.0" stroke="#e5534b" stroke-width="1.5" marker-end="url(#ah1)" stroke-dasharray="5 4"/>
<line x1="146.0" y1="238.0" x2="214.0" y2="140.0" stroke="#e5534b" stroke-width="1.5" marker-end="url(#ah1)" stroke-dasharray="5 4"/>
<rect x="16.0" y="302.0" width="12.0" height="12.0" rx="2" fill="#7cc47f" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="34.0" y="312.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">held by</text>
<rect x="126.0" y="302.0" width="12.0" height="12.0" rx="2" fill="#e5534b" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="144.0" y="312.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">waits for</text>
<text x="16.0" y="346.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">T1: lock(A); lock(B)</text>
<text x="16.0" y="365.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">T2: lock(B); lock(A)</text>
<text x="16.0" y="403.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">A cycle in the wait-for graph:</text>
<text x="16.0" y="422.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">nobody proceeds, nobody releases.</text>
</svg>
