<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 354" width="880" height="354" role="img" aria-label="Two database transactions deadlock on row locks and the database aborts one" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="354" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Databases detect deadlocks and abort a victim</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">row locks taken in opposite order by two transactions</text>
<text x="40.0" y="100.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="700">T1</text>
<text x="90.0" y="100.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">UPDATE accounts SET … WHERE id = 1</text>
<text x="560.0" y="100.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="400">locks row 1</text>
<text x="40.0" y="134.0" font-size="12" fill="#9b8cff" text-anchor="start" font-weight="700">T2</text>
<text x="90.0" y="134.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">UPDATE accounts SET … WHERE id = 2</text>
<text x="560.0" y="134.0" font-size="12" fill="#9b8cff" text-anchor="start" font-weight="400">locks row 2</text>
<text x="40.0" y="168.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="700">T1</text>
<text x="90.0" y="168.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">UPDATE accounts SET … WHERE id = 2</text>
<text x="560.0" y="168.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="400">waits for T2</text>
<text x="40.0" y="202.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="700">T2</text>
<text x="90.0" y="202.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">UPDATE accounts SET … WHERE id = 1</text>
<text x="560.0" y="202.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="400">waits for T1 → cycle</text>
<text x="40.0" y="236.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="700">DB</text>
<text x="90.0" y="236.0" font-size="12" fill="#ede6d8" text-anchor="start" font-weight="400">deadlock detected: abort T2</text>
<text x="560.0" y="236.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="400">T1 proceeds</text>
<text x="40.0" y="286.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">PostgreSQL checks for cycles after a lock wait exceeds deadlock_timeout (1 s by default); InnoDB checks</text>
<text x="40.0" y="305.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">immediately on each wait. The victim gets an error (40P01 in Postgres, 1213 in MySQL) and the application must retry</text>
<text x="40.0" y="324.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">the whole transaction. Touching rows in a consistent order (e.g. sorted ids) avoids most of these.</text>
</svg>
