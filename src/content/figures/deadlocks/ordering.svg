<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 308" width="880" height="308" role="img" aria-label="Acquiring locks in a consistent global order prevents deadlock" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="308" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7cc47f"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Lock ordering: always acquire in the same global order</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">order by a stable key (account id, address, lock level), then a cycle can't form</text>
<text x="40.0" y="100.0" font-size="12.5" fill="#ede6d8" text-anchor="start" font-weight="600">transfer(from, to):</text>
<text x="60.0" y="124.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="400">first, second = sort(from, to) by id</text>
<text x="60.0" y="143.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="400">lock(first); lock(second)</text>
<text x="60.0" y="162.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">...move money...</text>
<text x="60.0" y="181.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">unlock both</text>
<rect x="520.0" y="96.0" width="140.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="590.0" y="120.3" font-size="12" fill="#e2b45a" text-anchor="middle" font-weight="600">lock id 17</text>
<rect x="520.0" y="170.0" width="140.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="590.0" y="194.3" font-size="12" fill="#e2b45a" text-anchor="middle" font-weight="600">lock id 42</text>
<line x1="590.0" y1="136.0" x2="590.0" y2="168.0" stroke="#7cc47f" stroke-width="1.6" marker-end="url(#ah0)"/>
<text x="600.0" y="158.0" font-size="11" fill="#7cc47f" text-anchor="start" font-weight="400">always 17 then 42</text>
<text x="690.0" y="118.0" font-size="11" fill="#5fb3a1" text-anchor="start" font-weight="400">T1 (17→42)</text>
<text x="690.0" y="192.0" font-size="11" fill="#9b8cff" text-anchor="start" font-weight="400">T2 (42→17)</text>
<text x="40.0" y="240.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Both transfers lock id 17 first. Whoever gets it proceeds; the other waits on 17 while holding nothing, so there is</text>
<text x="40.0" y="259.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">no cycle. Large codebases encode the order as lock levels and check it: Linux's lockdep, Abseil's Mutex</text>
<text x="40.0" y="278.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">deadlock detection and Java's ThreadMXBean.findDeadlockedThreads() catch violations in testing or production.</text>
</svg>
