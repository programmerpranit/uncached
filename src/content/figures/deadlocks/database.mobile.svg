<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 337" width="360" height="337" role="img" aria-label="Two database transactions deadlock on row locks and the database aborts one" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="337" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Database deadlocks</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">detect the cycle, abort one</text>
<text x="16.0" y="88.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="700">T1</text>
<text x="52.0" y="88.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">UPDATE id=1 → lock row 1</text>
<text x="16.0" y="118.0" font-size="12" fill="#9b8cff" text-anchor="start" font-weight="700">T2</text>
<text x="52.0" y="118.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">UPDATE id=2 → lock row 2</text>
<text x="16.0" y="148.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="700">T1</text>
<text x="52.0" y="148.0" font-size="11.5" fill="#e5534b" text-anchor="start" font-weight="400">UPDATE id=2 → wait for T2</text>
<text x="16.0" y="178.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="700">T2</text>
<text x="52.0" y="178.0" font-size="11.5" fill="#e5534b" text-anchor="start" font-weight="400">UPDATE id=1 → wait → cycle</text>
<text x="16.0" y="208.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="700">DB</text>
<text x="52.0" y="208.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">abort T2; T1 proceeds</text>
<text x="16.0" y="250.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">The victim gets an error and must</text>
<text x="16.0" y="269.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">retry the whole transaction.</text>
<text x="16.0" y="288.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Touch rows in sorted order to</text>
<text x="16.0" y="307.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">avoid most cycles.</text>
</svg>
