<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 427" width="880" height="427" role="img" aria-label="The four Coffman conditions with a way to break each" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="427" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">The four Coffman conditions, and how to break each</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">a deadlock needs all four; remove any one and deadlock is impossible</text>
<text x="40.0" y="96.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">condition</text>
<text x="500.0" y="96.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">break it with</text>
<rect x="40.0" y="106.0" width="800.0" height="52.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="56.0" y="126.0" font-size="13" fill="#5fb3a1" text-anchor="start" font-weight="700">mutual exclusion</text>
<text x="56.0" y="144.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">a resource is held by one thread at a time</text>
<text x="500.0" y="134.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">lock-free, immutable or per-thread data</text>
<rect x="40.0" y="168.0" width="800.0" height="52.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="56.0" y="188.0" font-size="13" fill="#e2b45a" text-anchor="start" font-weight="700">hold and wait</text>
<text x="56.0" y="206.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">holding one resource while waiting for another</text>
<text x="500.0" y="196.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">acquire all at once (or release and retry)</text>
<rect x="40.0" y="230.0" width="800.0" height="52.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="56.0" y="250.0" font-size="13" fill="#9b8cff" text-anchor="start" font-weight="700">no preemption</text>
<text x="56.0" y="268.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">resources can't be taken away</text>
<text x="500.0" y="258.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">try-lock with timeout, abort and roll back</text>
<rect x="40.0" y="292.0" width="800.0" height="52.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#7cc47f" stroke-width="1"/>
<text x="56.0" y="312.0" font-size="13" fill="#7cc47f" text-anchor="start" font-weight="700">circular wait</text>
<text x="56.0" y="330.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">a cycle of threads each waiting on the next</text>
<text x="500.0" y="320.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">global lock ordering ← most practical</text>
<text x="40.0" y="378.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Mutual exclusion is usually the point of a lock, so real systems break one of the other three. Ordering locks</text>
<text x="40.0" y="397.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">consistently is the cheapest and most common; databases instead detect cycles and abort a victim (preemption).</text>
</svg>
