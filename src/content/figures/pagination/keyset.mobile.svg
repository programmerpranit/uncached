<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 432" width="360" height="432" role="img" aria-label="Keyset pagination: the next-page query filters on the tuple (created_at, id) being less than the last row seen, ordered by both columns and limited to 21 rows, so a composite index lets the database seek directly to the cursor; the cursor is encoded as an opaque base64 token" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="432" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Keyset + tie-breaker</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">seek past the last row</text>
<rect x="16.0" y="86.0" width="328.0" height="130.0" rx="8" fill="#9b8cff" fill-opacity="0.1" stroke="#9b8cff" stroke-width="1.2"/>
<text x="28.0" y="108.0" font-size="12" fill="#9b8cff" text-anchor="start" font-weight="700">Next-page query</text>
<text x="28.0" y="132.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">WHERE (created_at, id)</text>
<text x="40.0" y="152.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">&lt; ($last_ts, $last_id)</text>
<text x="28.0" y="172.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">ORDER BY created_at DESC, id DESC</text>
<text x="28.0" y="192.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">LIMIT 21</text>
<rect x="16.0" y="228.0" width="328.0" height="70.0" rx="8" fill="#5fb3a1" fill-opacity="0.1" stroke="#5fb3a1" stroke-width="1.2"/>
<text x="28.0" y="250.0" font-size="11.5" fill="#5fb3a1" text-anchor="start" font-weight="700">Index (created_at, id)</text>
<text x="28.0" y="272.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">seek to cursor, read 21 rows</text>
<text x="28.0" y="288.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">same cost on page 1 or 10,000</text>
<rect x="16.0" y="310.0" width="328.0" height="62.0" rx="8" fill="#e2b45a" fill-opacity="0.1" stroke="#e2b45a" stroke-width="1.1"/>
<text x="28.0" y="332.0" font-size="11.5" fill="#e2b45a" text-anchor="start" font-weight="700">Opaque cursor</text>
<text x="28.0" y="354.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">base64({ts, id, v}) → "eyJ0cy…"</text>
<text x="16.0" y="402.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">id breaks timestamp ties.</text>
</svg>
