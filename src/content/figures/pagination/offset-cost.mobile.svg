<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440" width="360" height="440" role="img" aria-label="Bar comparison of offset pagination: page 1 reads 20 rows, page 50 reads 1,000 rows and discards 980, page 5,000 reads 100,000 rows and discards 99,980, so cost grows linearly with page depth" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="440" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Why OFFSET gets slow</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">skipped rows are still read</text>
<text x="16.0" y="106.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="700">page 1  ·  OFFSET 0</text>
<rect x="16.0" y="116.0" width="10.0" height="26.0" rx="3" fill="#7cc47f" fill-opacity="0.6" stroke="#7cc47f" stroke-width="1"/>
<text x="16.0" y="160.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">20 rows read, 20 returned</text>
<text x="16.0" y="196.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="700">page 50  ·  OFFSET 980</text>
<rect x="16.0" y="206.0" width="3.0" height="26.0" rx="4" fill="#e5534b" fill-opacity="0.25" stroke="#e5534b" stroke-width="1"/>
<rect x="19.0" y="206.0" width="10.0" height="26.0" rx="3" fill="#7cc47f" fill-opacity="0.6" stroke="#7cc47f" stroke-width="1"/>
<text x="16.0" y="250.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">980 rows read &amp; thrown away</text>
<text x="16.0" y="286.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="700">page 5,000  ·  OFFSET 99,980</text>
<rect x="16.0" y="296.0" width="303.9" height="26.0" rx="4" fill="#e5534b" fill-opacity="0.25" stroke="#e5534b" stroke-width="1"/>
<rect x="319.9" y="296.0" width="10.0" height="26.0" rx="3" fill="#7cc47f" fill-opacity="0.6" stroke="#7cc47f" stroke-width="1"/>
<text x="16.0" y="340.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">99,980 rows read &amp; thrown away</text>
<rect x="16.0" y="354.0" width="12.0" height="12.0" rx="2" fill="#e5534b" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="34.0" y="364.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">scanned, dropped</text>
<rect x="165.1" y="354.0" width="12.0" height="12.0" rx="2" fill="#7cc47f" fill-opacity="1" stroke="none" stroke-width="1"/>
<text x="183.1" y="364.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">returned</text>
<text x="16.0" y="410.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">Cost grows with page depth.</text>
</svg>
