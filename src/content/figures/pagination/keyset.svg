<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 429" width="880" height="429" role="img" aria-label="Keyset pagination: the next-page query filters on the tuple (created_at, id) being less than the last row seen, ordered by both columns and limited to 21 rows, so a composite index lets the database seek directly to the cursor; the cursor is encoded as an opaque base64 token" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="429" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Keyset pagination with a tie-breaker</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">sort by (created_at, id) and seek past the last row</text>
<rect x="40.0" y="92.0" width="420.0" height="150.0" rx="8" fill="#9b8cff" fill-opacity="0.1" stroke="#9b8cff" stroke-width="1.2"/>
<text x="56.0" y="116.0" font-size="12" fill="#9b8cff" text-anchor="start" font-weight="700">Query for the next page</text>
<text x="56.0" y="144.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">SELECT * FROM posts</text>
<text x="56.0" y="166.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">WHERE (created_at, id) &lt; ($last_ts, $last_id)</text>
<text x="56.0" y="188.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">ORDER BY created_at DESC, id DESC</text>
<text x="56.0" y="210.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">LIMIT 21   -- one extra = has_more</text>
<rect x="500.0" y="92.0" width="340.0" height="150.0" rx="8" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="516.0" y="116.0" font-size="11.5" fill="#5fb3a1" text-anchor="start" font-weight="700">Index: (created_at DESC, id DESC)</text>
<rect x="516.0" y="130.0" width="308.0" height="16.0" rx="3" fill="#4a4136" fill-opacity="0.3" stroke="none" stroke-width="1"/>
<rect x="516.0" y="150.0" width="308.0" height="16.0" rx="3" fill="#4a4136" fill-opacity="0.3" stroke="none" stroke-width="1"/>
<rect x="516.0" y="170.0" width="308.0" height="16.0" rx="3" fill="#5fb3a1" fill-opacity="0.35" stroke="none" stroke-width="1"/>
<rect x="516.0" y="190.0" width="308.0" height="16.0" rx="3" fill="#5fb3a1" fill-opacity="0.35" stroke="none" stroke-width="1"/>
<rect x="516.0" y="210.0" width="308.0" height="16.0" rx="3" fill="#5fb3a1" fill-opacity="0.35" stroke="none" stroke-width="1"/>
<text x="670.0" y="259.0" font-size="10" fill="#5fb3a1" text-anchor="middle" font-weight="400">seek straight to the cursor, read 21</text>
<rect x="40.0" y="280.0" width="800.0" height="60.0" rx="8" fill="#e2b45a" fill-opacity="0.1" stroke="#e2b45a" stroke-width="1.1"/>
<text x="56.0" y="302.0" font-size="11.5" fill="#e2b45a" text-anchor="start" font-weight="700">Opaque cursor sent to the client</text>
<text x="56.0" y="324.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">base64({"ts":"2026-11-02T10:15:03Z","id":81723,"v":1})  →  "eyJ0cyI6IjIwMjYtMTEtMDJU…"</text>
<text x="40.0" y="380.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Constant cost per page at any depth. The id tie-breaker makes the order total, so rows with equal</text>
<text x="40.0" y="399.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">timestamps are never skipped or repeated. The cursor is opaque so the server can change its contents.</text>
</svg>
