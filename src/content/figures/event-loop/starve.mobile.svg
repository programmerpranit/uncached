<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 418" width="360" height="418" role="img" aria-label="Main-thread timelines: a long task and a microtask chain block frames, chunked tasks let rendering and input run" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="418" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Long work and frames</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">main thread over 100 ms</text>
<text x="16.0" y="96.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="700">One long task</text>
<text x="16.0" y="114.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">no paint or input for 96 ms</text>
<rect x="16.0" y="124.0" width="328.0" height="22.0" rx="3" fill="#e5534b" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="16.0" y="182.0" font-size="12" fill="#d77fa1" text-anchor="start" font-weight="700">await in a loop</text>
<text x="16.0" y="200.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">microtasks: still no paint</text>
<rect x="16.0" y="210.0" width="328.0" height="22.0" rx="3" fill="#d77fa1" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="16.0" y="268.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="700">Chunked tasks</text>
<text x="16.0" y="286.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">10 ms work, then paint</text>
<rect x="16.0" y="296.0" width="38.0" height="22.0" rx="3" fill="#e2b45a" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<rect x="55.0" y="296.0" width="12.0" height="22.0" rx="3" fill="#9b8cff" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<rect x="71.0" y="296.0" width="38.0" height="22.0" rx="3" fill="#e2b45a" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<rect x="110.0" y="296.0" width="12.0" height="22.0" rx="3" fill="#9b8cff" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<rect x="126.0" y="296.0" width="38.0" height="22.0" rx="3" fill="#e2b45a" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<rect x="165.0" y="296.0" width="12.0" height="22.0" rx="3" fill="#9b8cff" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<rect x="181.0" y="296.0" width="38.0" height="22.0" rx="3" fill="#e2b45a" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<rect x="220.0" y="296.0" width="12.0" height="22.0" rx="3" fill="#9b8cff" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<rect x="236.0" y="296.0" width="38.0" height="22.0" rx="3" fill="#e2b45a" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<rect x="275.0" y="296.0" width="12.0" height="22.0" rx="3" fill="#9b8cff" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<rect x="291.0" y="296.0" width="38.0" height="22.0" rx="3" fill="#e2b45a" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<rect x="330.0" y="296.0" width="12.0" height="22.0" rx="3" fill="#9b8cff" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="16.0" y="350.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Yield with setTimeout or</text>
<text x="16.0" y="369.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">scheduler.yield() to let the</text>
<text x="16.0" y="388.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">browser paint and handle input.</text>
</svg>
