<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="Event loop: call stack, task queue, microtask queue and the rendering step, with the order in which they run" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="420" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">One turn of the event loop</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">one task, then all microtasks, then maybe render</text>
<rect x="40.0" y="90.0" width="180.0" height="210.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="56.0" y="114.0" font-size="12.5" fill="#ede6d8" text-anchor="start" font-weight="700">Call stack</text>
<rect x="56.0" y="130.0" width="148.0" height="34.0" rx="3" fill="#1b1712" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="130.0" y="151.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="600">handleClick()</text>
<rect x="56.0" y="174.0" width="148.0" height="34.0" rx="3" fill="#1b1712" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="130.0" y="195.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="600">render()</text>
<rect x="56.0" y="218.0" width="148.0" height="34.0" rx="3" fill="#1b1712" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="130.0" y="239.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="600">main script</text>
<rect x="260.0" y="90.0" width="270.0" height="90.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="276.0" y="114.0" font-size="12.5" fill="#e2b45a" text-anchor="start" font-weight="700">Task queues (macrotasks)</text>
<text x="276.0" y="138.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">setTimeout, setInterval, I/O,</text>
<text x="276.0" y="154.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">events, MessageChannel, script</text>
<rect x="260.0" y="210.0" width="270.0" height="90.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="276.0" y="234.0" font-size="12.5" fill="#5fb3a1" text-anchor="start" font-weight="700">Microtask queue</text>
<text x="276.0" y="258.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">Promise reactions, await,</text>
<text x="276.0" y="274.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">queueMicrotask, MutationObserver</text>
<rect x="570.0" y="90.0" width="270.0" height="210.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="586.0" y="114.0" font-size="12.5" fill="#9b8cff" text-anchor="start" font-weight="700">Rendering opportunity</text>
<text x="586.0" y="138.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">~every 16.7 ms, if needed:</text>
<text x="586.0" y="154.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">requestAnimationFrame callbacks</text>
<text x="586.0" y="170.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">style, layout, paint</text>
<path d="M 395 180 L 395 210" fill="none" stroke="#e2b45a" stroke-width="1.2"/>
<circle cx="52.0" cy="342.0" r="11" fill="#1b1712" fill-opacity="1" stroke="#e2b45a" stroke-width="1.5"/>
<text x="52.0" y="346.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="700">1</text>
<text x="70.0" y="346.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">run ONE task</text>
<circle cx="262.0" cy="342.0" r="11" fill="#1b1712" fill-opacity="1" stroke="#5fb3a1" stroke-width="1.5"/>
<text x="262.0" y="346.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="700">2</text>
<text x="280.0" y="346.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">drain ALL microtasks</text>
<circle cx="472.0" cy="342.0" r="11" fill="#1b1712" fill-opacity="1" stroke="#9b8cff" stroke-width="1.5"/>
<text x="472.0" y="346.0" font-size="11" fill="#9b8cff" text-anchor="middle" font-weight="700">3</text>
<text x="490.0" y="346.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">render if frame due</text>
<circle cx="682.0" cy="342.0" r="11" fill="#1b1712" fill-opacity="1" stroke="#a69d8e" stroke-width="1.5"/>
<text x="682.0" y="346.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="700">4</text>
<text x="700.0" y="346.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">repeat</text>
<text x="40.0" y="390.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">While the call stack is non-empty nothing else runs: no other task, no microtask, no paint.</text>
</svg>
