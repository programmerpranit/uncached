<text x="458.0" y="360.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">blocked</text>
<text x="40.0" y="396.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Yielding with setTimeout or scheduler.yield() ends the task, so rendering and input can run in between.</text>
<text x="40.0" y="415.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Awaiting an already-resolved promise does not: microtasks run before the browser gets a chance to paint.</text>
