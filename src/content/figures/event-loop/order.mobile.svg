<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 439" width="360" height="439" role="img" aria-label="Ordering of console output for synchronous code, promise microtasks and a zero-delay timeout" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="439" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Who runs first?</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">output: A E C D B</text>
<rect x="16.0" y="80.0" width="328.0" height="130.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="26.0" y="102.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">log('A')</text>
<text x="26.0" y="120.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">setTimeout(() =&gt; log('B'))</text>
<text x="26.0" y="138.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">Promise.resolve()</text>
<text x="26.0" y="156.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">.then(() =&gt; log('C'))</text>
<text x="26.0" y="174.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">queueMicrotask(() =&gt; log('D'))</text>
<text x="26.0" y="192.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">log('E')</text>
<rect x="16.0" y="232.0" width="328.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="28.0" y="257.0" font-size="11.5" fill="#e2b45a" text-anchor="start" font-weight="700">Script task</text>
<text x="332.0" y="257.0" font-size="13" fill="#ede6d8" text-anchor="end" font-weight="700">A, E</text>
<rect x="16.0" y="280.0" width="328.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="28.0" y="305.0" font-size="11.5" fill="#5fb3a1" text-anchor="start" font-weight="700">Microtasks</text>
<text x="332.0" y="305.0" font-size="13" fill="#ede6d8" text-anchor="end" font-weight="700">C, D</text>
<rect x="16.0" y="328.0" width="328.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="28.0" y="353.0" font-size="11.5" fill="#e2b45a" text-anchor="start" font-weight="700">Next task</text>
<text x="332.0" y="353.0" font-size="13" fill="#ede6d8" text-anchor="end" font-weight="700">B</text>
<text x="16.0" y="390.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">0 ms timers still wait for the</text>
<text x="16.0" y="409.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">next task; promises do not.</text>
</svg>
