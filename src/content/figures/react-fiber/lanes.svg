<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 369" width="880" height="369" role="img" aria-label="Lane priorities from SyncLane for clicks down to IdleLane, showing that urgent updates interrupt transition renders" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="369" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Lanes: priorities as bitmasks</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">urgent updates interrupt transitions</text>
<rect x="40.0" y="100.0" width="22.0" height="22.0" rx="3" fill="#e5534b" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="76.0" y="116.0" font-size="12.5" fill="#ede6d8" text-anchor="start" font-weight="600">SyncLane</text>
<text x="300.0" y="116.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">discrete input: click, keypress</text>
<rect x="40.0" y="136.0" width="22.0" height="22.0" rx="3" fill="#e2b45a" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="76.0" y="152.0" font-size="12.5" fill="#ede6d8" text-anchor="start" font-weight="600">InputContinuousLane</text>
<text x="300.0" y="152.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">drag, scroll, pointermove</text>
<rect x="40.0" y="172.0" width="22.0" height="22.0" rx="3" fill="#5fb3a1" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="76.0" y="188.0" font-size="12.5" fill="#ede6d8" text-anchor="start" font-weight="600">DefaultLane</text>
<text x="300.0" y="188.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">setState from fetch, timers</text>
<rect x="40.0" y="208.0" width="22.0" height="22.0" rx="3" fill="#9b8cff" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="76.0" y="224.0" font-size="12.5" fill="#ede6d8" text-anchor="start" font-weight="600">TransitionLanes</text>
<text x="300.0" y="224.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">startTransition, useDeferredValue</text>
<rect x="40.0" y="244.0" width="22.0" height="22.0" rx="3" fill="#a69d8e" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="76.0" y="260.0" font-size="12.5" fill="#ede6d8" text-anchor="start" font-weight="600">IdleLane</text>
<text x="300.0" y="260.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">offscreen, prerender</text>
<text x="40.0" y="286.0" font-size="11" fill="#a69d8e" text-anchor="start" font-weight="400">high priority ↑   low priority ↓</text>
<text x="40.0" y="320.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Each update is tagged with a lane bit. React renders the highest-priority pending lanes first; if a click arrives</text>
<text x="40.0" y="339.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">during a transition render, that work is discarded and restarted after the click commits.</text>
</svg>
