<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 389" width="360" height="389" role="img" aria-label="Lane priorities from SyncLane for clicks down to IdleLane, showing that urgent updates interrupt transition renders" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="389" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Lanes (priorities)</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">urgent beats transition</text>
<rect x="16.0" y="90.0" width="16.0" height="16.0" rx="3" fill="#e5534b" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="42.0" y="103.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="600">SyncLane</text>
<text x="42.0" y="121.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">discrete input: click, keypress</text>
<rect x="16.0" y="138.0" width="16.0" height="16.0" rx="3" fill="#e2b45a" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="42.0" y="151.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="600">InputContinuousLane</text>
<text x="42.0" y="169.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">drag, scroll, pointermove</text>
<rect x="16.0" y="186.0" width="16.0" height="16.0" rx="3" fill="#5fb3a1" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="42.0" y="199.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="600">DefaultLane</text>
<text x="42.0" y="217.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">setState from fetch, timers</text>
<rect x="16.0" y="234.0" width="16.0" height="16.0" rx="3" fill="#9b8cff" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="42.0" y="247.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="600">TransitionLanes</text>
<text x="42.0" y="265.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">startTransition, useDeferredValue</text>
<rect x="16.0" y="282.0" width="16.0" height="16.0" rx="3" fill="#a69d8e" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="42.0" y="295.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="600">IdleLane</text>
<text x="42.0" y="313.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">offscreen, prerender</text>
<text x="16.0" y="340.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Urgent lanes interrupt and</text>
<text x="16.0" y="359.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">restart transition renders.</text>
</svg>
