<text x="40.0" y="318.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="400">compared: 7 hashes (root, 2, 2, 2) instead of 8 leaves; skipped: everything under the green "=" nodes</text>
<text x="40.0" y="350.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Only the path to the differing leaf is explored. For a tree with millions of leaves and a few differences, replicas</text>
<text x="40.0" y="369.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">exchange a few dozen hashes, then transfer just the keys in the mismatching leaf ranges.</text>
