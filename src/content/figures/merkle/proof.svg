<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 338" width="880" height="338" role="img" aria-label="A Merkle inclusion proof: the item hash plus sibling hashes on the path recompute the root" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="338" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Inclusion proof: prove one item with log₂ n hashes</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">to check H2 is in the tree, you need only its sibling path</text>
<line x1="440.0" y1="115.0" x2="240.0" y2="147.0" stroke="#4a4136" stroke-width="1"/>
<line x1="440.0" y1="115.0" x2="640.0" y2="147.0" stroke="#4a4136" stroke-width="1"/>
<line x1="240.0" y1="177.0" x2="140.0" y2="209.0" stroke="#4a4136" stroke-width="1"/>
<line x1="240.0" y1="177.0" x2="340.0" y2="209.0" stroke="#4a4136" stroke-width="1"/>
<line x1="640.0" y1="177.0" x2="540.0" y2="209.0" stroke="#4a4136" stroke-width="1"/>
<line x1="640.0" y1="177.0" x2="740.0" y2="209.0" stroke="#4a4136" stroke-width="1"/>
<rect x="385.0" y="85.0" width="110.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="440.0" y="104.0" font-size="11" fill="#ff5b2e" text-anchor="middle" font-weight="600">root ✓</text>
<rect x="185.0" y="147.0" width="110.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="240.0" y="166.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="600">H(01) given</text>
<rect x="585.0" y="147.0" width="110.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#a69d8e" stroke-width="1"/>
<text x="640.0" y="166.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="600">computed</text>
<rect x="85.0" y="209.0" width="110.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#a69d8e" stroke-width="1"/>
<text x="140.0" y="228.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="600"></text>
<rect x="285.0" y="209.0" width="110.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#a69d8e" stroke-width="1"/>
<text x="340.0" y="228.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="600"></text>
<rect x="485.0" y="209.0" width="110.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="540.0" y="228.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="600">H2 (item)</text>
<rect x="685.0" y="209.0" width="110.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="740.0" y="228.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="600">H3 given</text>
<text x="40.0" y="270.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Given the trusted root, a client verifies item 2 with just H3 and H(01): compute H(23) = hash(H2, H3), then</text>
<text x="40.0" y="289.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">root = hash(H(01), H(23)), and compare. For a billion items that is ~30 hashes. Certificate Transparency logs,</text>
<text x="40.0" y="308.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Bitcoin light clients (SPV) and Git all rely on this.</text>
</svg>
