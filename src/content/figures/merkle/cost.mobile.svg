<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 314" width="360" height="314" role="img" aria-label="Data transferred to reconcile two replicas naively versus with a Merkle tree" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="314" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Anti-entropy cost</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">100M keys, 50 differ</text>
<text x="16.0" y="80.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">send every key + value</text>
<rect x="16.0" y="88.0" width="240.0" height="16.0" rx="3" fill="#e5534b" fill-opacity="0.7" stroke="#e5534b" stroke-width="1"/>
<text x="262.0" y="101.0" font-size="11.5" fill="#e5534b" text-anchor="start" font-weight="700">~100 GB</text>
<text x="16.0" y="130.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">send every key + hash (16 B)</text>
<rect x="16.0" y="138.0" width="144.0" height="16.0" rx="3" fill="#e2b45a" fill-opacity="0.7" stroke="#e2b45a" stroke-width="1"/>
<text x="166.0" y="151.0" font-size="11.5" fill="#e2b45a" text-anchor="start" font-weight="700">~2.4 GB</text>
<text x="16.0" y="180.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">Merkle tree, then differing ranges</text>
<rect x="16.0" y="188.0" width="9.6" height="16.0" rx="3" fill="#7cc47f" fill-opacity="0.7" stroke="#7cc47f" stroke-width="1"/>
<text x="31.6" y="201.0" font-size="11.5" fill="#7cc47f" text-anchor="start" font-weight="700">~0.2 MB</text>
<text x="16.0" y="246.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Cost scales with the differences,</text>
<text x="16.0" y="265.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">not the data. Building the tree</text>
<text x="16.0" y="284.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">still reads everything once.</text>
</svg>
