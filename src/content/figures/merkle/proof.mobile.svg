<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 387" width="360" height="387" role="img" aria-label="A Merkle inclusion proof: the item hash plus sibling hashes on the path recompute the root" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="387" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Inclusion proof</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">sibling path to the root</text>
<line x1="180.0" y1="111.0" x2="98.0" y2="143.0" stroke="#4a4136" stroke-width="1"/>
<line x1="180.0" y1="111.0" x2="262.0" y2="143.0" stroke="#4a4136" stroke-width="1"/>
<line x1="98.0" y1="173.0" x2="57.0" y2="205.0" stroke="#4a4136" stroke-width="1"/>
<line x1="98.0" y1="173.0" x2="139.0" y2="205.0" stroke="#4a4136" stroke-width="1"/>
<line x1="262.0" y1="173.0" x2="221.0" y2="205.0" stroke="#4a4136" stroke-width="1"/>
<line x1="262.0" y1="173.0" x2="303.0" y2="205.0" stroke="#4a4136" stroke-width="1"/>
<rect x="125.0" y="81.0" width="110.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="180.0" y="99.6" font-size="10" fill="#ff5b2e" text-anchor="middle" font-weight="600">root ✓</text>
<rect x="43.0" y="143.0" width="110.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="98.0" y="161.6" font-size="10" fill="#e2b45a" text-anchor="middle" font-weight="600">H(01)</text>
<rect x="207.0" y="143.0" width="110.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#a69d8e" stroke-width="1"/>
<text x="262.0" y="161.6" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="600">computed</text>
<rect x="20.0" y="205.0" width="74.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#a69d8e" stroke-width="1"/>
<text x="57.0" y="223.6" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="600"></text>
<rect x="102.0" y="205.0" width="74.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#a69d8e" stroke-width="1"/>
<text x="139.0" y="223.6" font-size="10" fill="#a69d8e" text-anchor="middle" font-weight="600"></text>
<rect x="184.0" y="205.0" width="74.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="221.0" y="223.6" font-size="10" fill="#5fb3a1" text-anchor="middle" font-weight="600">H2 item</text>
<rect x="266.0" y="205.0" width="74.0" height="30.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="303.0" y="223.6" font-size="10" fill="#e2b45a" text-anchor="middle" font-weight="600">H3</text>
<text x="16.0" y="262.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="400">given: H3, H(01)</text>
<text x="16.0" y="281.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="400">compute H(23), then root</text>
<text x="16.0" y="319.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">1 billion items → ~30 hashes.</text>
<text x="16.0" y="338.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Used by Certificate Transparency,</text>
<text x="16.0" y="357.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Bitcoin SPV, Git.</text>
</svg>
