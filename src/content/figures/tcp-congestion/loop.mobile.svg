<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 412" width="360" height="412" role="img" aria-label="Sender sends data through a bottleneck router queue to the receiver; ACKs return carrying congestion signals: loss, rising delay, or ECN marks" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="412" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7cc47f"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">The feedback loop</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">signals come back with the ACKs</text>
<text x="180.0" y="78.0" font-size="9.5" fill="#7cc47f" text-anchor="middle" font-weight="400">ACKs carry the signals back</text>
<path d="M294,96 L294,86 L66,86 L66,96" fill="none" stroke="#7cc47f" stroke-width="1.4" marker-end="url(#ah0)"/>
<rect x="16.0" y="98.0" width="100.0" height="48.0" rx="3" fill="#5fb3a1" fill-opacity="0.2" stroke="#5fb3a1" stroke-width="1"/>
<text x="66.0" y="119.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">sender</text>
<text x="66.0" y="135.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">cwnd</text>
<rect x="244.0" y="98.0" width="100.0" height="48.0" rx="3" fill="#9b8cff" fill-opacity="0.2" stroke="#9b8cff" stroke-width="1"/>
<text x="294.0" y="119.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">receiver</text>
<text x="294.0" y="135.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">rwnd</text>
<rect x="110.0" y="160.0" width="140.0" height="56.0" rx="8" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="180.0" y="176.0" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="700">bottleneck</text>
<rect x="130.0" y="184.0" width="13.0" height="22.0" rx="2" fill="#e2b45a" fill-opacity="0.7" stroke="#e2b45a" stroke-width="1"/>
<rect x="147.0" y="184.0" width="13.0" height="22.0" rx="2" fill="#e2b45a" fill-opacity="0.7" stroke="#e2b45a" stroke-width="1"/>
<rect x="164.0" y="184.0" width="13.0" height="22.0" rx="2" fill="#e2b45a" fill-opacity="0.7" stroke="#e2b45a" stroke-width="1"/>
<rect x="181.0" y="184.0" width="13.0" height="22.0" rx="2" fill="#e2b45a" fill-opacity="0.7" stroke="#e2b45a" stroke-width="1"/>
<rect x="198.0" y="184.0" width="13.0" height="22.0" rx="2" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<rect x="215.0" y="184.0" width="13.0" height="22.0" rx="2" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<path d="M66,146 L66,188 L110,188" fill="none" stroke="#5fb3a1" stroke-width="1.4" marker-end="url(#ah1)"/>
<path d="M250,188 L294,188 L294,146" fill="none" stroke="#5fb3a1" stroke-width="1.4" marker-end="url(#ah1)"/>
<rect x="16.0" y="236.0" width="328.0" height="44.0" rx="3" fill="#e5534b" fill-opacity="0.12" stroke="#e5534b" stroke-width="1"/>
<text x="180.0" y="262.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="28.0" y="254.0" font-size="11" fill="#e5534b" text-anchor="start" font-weight="700">Loss</text>
<text x="28.0" y="270.0" font-size="9.5" fill="#ede6d8" text-anchor="start" font-weight="400">dup ACKs, RTO — Reno, CUBIC</text>
<rect x="16.0" y="290.0" width="328.0" height="44.0" rx="3" fill="#e2b45a" fill-opacity="0.12" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="316.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="28.0" y="308.0" font-size="11" fill="#e2b45a" text-anchor="start" font-weight="700">Delay</text>
<text x="28.0" y="324.0" font-size="9.5" fill="#ede6d8" text-anchor="start" font-weight="400">RTT rises — Vegas, BBR</text>
<rect x="16.0" y="344.0" width="328.0" height="44.0" rx="3" fill="#9b8cff" fill-opacity="0.12" stroke="#9b8cff" stroke-width="1"/>
<text x="180.0" y="370.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="28.0" y="362.0" font-size="11" fill="#9b8cff" text-anchor="start" font-weight="700">ECN mark</text>
<text x="28.0" y="378.0" font-size="9.5" fill="#ede6d8" text-anchor="start" font-weight="400">CE bit — DCTCP, L4S</text>
</svg>
