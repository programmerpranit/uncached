<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 378" width="880" height="378" role="img" aria-label="Sender sends data through a bottleneck router queue to the receiver; ACKs return carrying congestion signals: loss, rising delay, or ECN marks" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="378" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7cc47f"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">The feedback loop</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">the sender never sees the bottleneck; it infers congestion from what returns with the ACKs</text>
<rect x="40.0" y="110.0" width="140.0" height="60.0" rx="3" fill="#5fb3a1" fill-opacity="0.2" stroke="#5fb3a1" stroke-width="1"/>
<text x="110.0" y="137.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">sender</text>
<text x="110.0" y="153.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">cwnd, pacing</text>
<rect x="700.0" y="110.0" width="140.0" height="60.0" rx="3" fill="#9b8cff" fill-opacity="0.2" stroke="#9b8cff" stroke-width="1"/>
<text x="770.0" y="137.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">receiver</text>
<text x="770.0" y="153.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">rwnd</text>
<rect x="300.0" y="100.0" width="280.0" height="80.0" rx="8" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="440.0" y="120.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="700">bottleneck router</text>
<rect x="380.0" y="136.0" width="14.0" height="30.0" rx="2" fill="#e2b45a" fill-opacity="0.7" stroke="#e2b45a" stroke-width="1"/>
<rect x="398.0" y="136.0" width="14.0" height="30.0" rx="2" fill="#e2b45a" fill-opacity="0.7" stroke="#e2b45a" stroke-width="1"/>
<rect x="416.0" y="136.0" width="14.0" height="30.0" rx="2" fill="#e2b45a" fill-opacity="0.7" stroke="#e2b45a" stroke-width="1"/>
<rect x="434.0" y="136.0" width="14.0" height="30.0" rx="2" fill="#e2b45a" fill-opacity="0.7" stroke="#e2b45a" stroke-width="1"/>
<rect x="452.0" y="136.0" width="14.0" height="30.0" rx="2" fill="#e2b45a" fill-opacity="0.7" stroke="#e2b45a" stroke-width="1"/>
<rect x="470.0" y="136.0" width="14.0" height="30.0" rx="2" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<rect x="488.0" y="136.0" width="14.0" height="30.0" rx="2" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="440.0" y="194.0" font-size="10" fill="#e2b45a" text-anchor="middle" font-weight="400">queue fills when inflight &gt; BDP</text>
<line x1="180.0" y1="140.0" x2="300.0" y2="140.0" stroke="#5fb3a1" stroke-width="1.6" marker-end="url(#ah0)"/>
<line x1="580.0" y1="140.0" x2="700.0" y2="140.0" stroke="#5fb3a1" stroke-width="1.6" marker-end="url(#ah0)"/>
<text x="240.0" y="132.0" font-size="10" fill="#5fb3a1" text-anchor="middle" font-weight="400">data</text>
<text x="640.0" y="132.0" font-size="10" fill="#5fb3a1" text-anchor="middle" font-weight="400">data</text>
<path d="M770,170 L770,240 L110,240 L110,170" fill="none" stroke="#7cc47f" stroke-width="1.6" marker-end="url(#ah1)"/>
<text x="440.0" y="232.0" font-size="10.5" fill="#7cc47f" text-anchor="middle" font-weight="400">ACKs (+ SACK blocks, ECN echo, timestamps)</text>
<rect x="40.0" y="280.0" width="250.0" height="74.0" rx="3" fill="#e5534b" fill-opacity="0.12" stroke="#e5534b" stroke-width="1"/>
<text x="165.0" y="321.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="54.0" y="302.0" font-size="12" fill="#e5534b" text-anchor="start" font-weight="700">Loss</text>
<text x="54.0" y="322.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">dup ACKs / SACK gaps, or RTO</text>
<text x="54.0" y="340.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">used by Reno, CUBIC</text>
<rect x="320.0" y="280.0" width="250.0" height="74.0" rx="3" fill="#e2b45a" fill-opacity="0.12" stroke="#e2b45a" stroke-width="1"/>
<text x="445.0" y="321.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="334.0" y="302.0" font-size="12" fill="#e2b45a" text-anchor="start" font-weight="700">Delay</text>
<text x="334.0" y="322.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">RTT rises as the queue grows</text>
<text x="334.0" y="340.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">used by Vegas, BBR, LEDBAT</text>
<rect x="600.0" y="280.0" width="250.0" height="74.0" rx="3" fill="#9b8cff" fill-opacity="0.12" stroke="#9b8cff" stroke-width="1"/>
<text x="725.0" y="321.3" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600"></text>
<text x="614.0" y="302.0" font-size="12" fill="#9b8cff" text-anchor="start" font-weight="700">ECN mark</text>
<text x="614.0" y="322.0" font-size="10" fill="#ede6d8" text-anchor="start" font-weight="400">router sets CE bit before dropping</text>
<text x="614.0" y="340.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">used by DCTCP, L4S</text>
</svg>
