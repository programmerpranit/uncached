<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 404" width="360" height="404" role="img" aria-label="Timeline comparing a blocking thread that serves requests A, B and C one after another while idle during database waits, with an event loop that starts all three and overlaps their I/O waits on one thread; a CPU-heavy handler blocks the loop for everyone" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="404" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">One thread, many requests</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">interleaving at each await</text>
<text x="16.0" y="100.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="700">Blocking thread</text>
<rect x="16.0" y="110.0" width="14.0" height="22.0" rx="2" fill="#ff5b2e" fill-opacity="0.7" stroke="none" stroke-width="1"/>
<rect x="30.0" y="110.0" width="70.0" height="22.0" rx="2" fill="#ff5b2e" fill-opacity="0.15" stroke="#ff5b2e" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="100.0" y="110.0" width="10.0" height="22.0" rx="2" fill="#ff5b2e" fill-opacity="0.7" stroke="none" stroke-width="1"/>
<rect x="122.0" y="110.0" width="14.0" height="22.0" rx="2" fill="#5fb3a1" fill-opacity="0.7" stroke="none" stroke-width="1"/>
<rect x="136.0" y="110.0" width="70.0" height="22.0" rx="2" fill="#5fb3a1" fill-opacity="0.15" stroke="#5fb3a1" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="206.0" y="110.0" width="10.0" height="22.0" rx="2" fill="#5fb3a1" fill-opacity="0.7" stroke="none" stroke-width="1"/>
<rect x="228.0" y="110.0" width="14.0" height="22.0" rx="2" fill="#9b8cff" fill-opacity="0.7" stroke="none" stroke-width="1"/>
<rect x="242.0" y="110.0" width="70.0" height="22.0" rx="2" fill="#9b8cff" fill-opacity="0.15" stroke="#9b8cff" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="312.0" y="110.0" width="10.0" height="22.0" rx="2" fill="#9b8cff" fill-opacity="0.7" stroke="none" stroke-width="1"/>
<text x="16.0" y="170.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="700">Event loop</text>
<rect x="16.0" y="180.0" width="16.0" height="22.0" rx="2" fill="#ff5b2e" fill-opacity="0.7" stroke="none" stroke-width="1"/>
<rect x="32.0" y="208.0" width="120.0" height="12.0" rx="2" fill="#ff5b2e" fill-opacity="0.15" stroke="#ff5b2e" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="160.0" y="180.0" width="14.0" height="22.0" rx="2" fill="#ff5b2e" fill-opacity="0.7" stroke="none" stroke-width="1"/>
<rect x="36.0" y="180.0" width="16.0" height="22.0" rx="2" fill="#5fb3a1" fill-opacity="0.7" stroke="none" stroke-width="1"/>
<rect x="52.0" y="224.0" width="120.0" height="12.0" rx="2" fill="#5fb3a1" fill-opacity="0.15" stroke="#5fb3a1" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="180.0" y="180.0" width="14.0" height="22.0" rx="2" fill="#5fb3a1" fill-opacity="0.7" stroke="none" stroke-width="1"/>
<rect x="56.0" y="180.0" width="16.0" height="22.0" rx="2" fill="#9b8cff" fill-opacity="0.7" stroke="none" stroke-width="1"/>
<rect x="72.0" y="240.0" width="120.0" height="12.0" rx="2" fill="#9b8cff" fill-opacity="0.15" stroke="#9b8cff" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="200.0" y="180.0" width="14.0" height="22.0" rx="2" fill="#9b8cff" fill-opacity="0.7" stroke="none" stroke-width="1"/>
<text x="16.0" y="280.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">waits overlap; one thread</text>
<rect x="16.0" y="300.0" width="328.0" height="80.0" rx="8" fill="#e5534b" fill-opacity="0.08" stroke="#e5534b" stroke-width="1.1"/>
<text x="28.0" y="322.0" font-size="11.5" fill="#e5534b" text-anchor="start" font-weight="700">CPU-heavy handler</text>
<text x="28.0" y="344.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">blocks the loop: every other</text>
<text x="28.0" y="363.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">request stalls until it finishes</text>
</svg>
