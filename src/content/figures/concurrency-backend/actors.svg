<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 399" width="880" height="399" role="img" aria-label="Requests become messages delivered to per-entity actors; each actor has a mailbox, owns its state, handles one message at a time, and a supervisor restarts actors that crash" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="399" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e2b45a"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e5534b"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Actors: state behind a mailbox</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">no shared memory, no locks: one message at a time</text>
<rect x="320.0" y="100.0" width="240.0" height="90.0" rx="10" fill="#9b8cff" fill-opacity="0.12" stroke="#9b8cff" stroke-width="1.2"/>
<text x="336.0" y="122.0" font-size="12.5" fill="#9b8cff" text-anchor="start" font-weight="700">Cart #17</text>
<text x="336.0" y="146.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">state: items, total</text>
<text x="336.0" y="166.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">behaviour: handle(msg)</text>
<rect x="250.0" y="132.0" width="22.0" height="22.0" rx="3" fill="#e2b45a" fill-opacity="0.5" stroke="none" stroke-width="1"/>
<rect x="224.0" y="132.0" width="22.0" height="22.0" rx="3" fill="#e2b45a" fill-opacity="0.5" stroke="none" stroke-width="1"/>
<rect x="198.0" y="132.0" width="22.0" height="22.0" rx="3" fill="#e2b45a" fill-opacity="0.5" stroke="none" stroke-width="1"/>
<text x="200.0" y="180.0" font-size="9.5" fill="#e2b45a" text-anchor="middle" font-weight="400">mailbox</text>
<line x1="272.0" y1="143.0" x2="320.0" y2="143.0" stroke="#e2b45a" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="320.0" y="220.0" width="240.0" height="90.0" rx="10" fill="#9b8cff" fill-opacity="0.12" stroke="#9b8cff" stroke-width="1.2"/>
<text x="336.0" y="242.0" font-size="12.5" fill="#9b8cff" text-anchor="start" font-weight="700">Cart #42</text>
<text x="336.0" y="266.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">state: items, total</text>
<text x="336.0" y="286.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">behaviour: handle(msg)</text>
<rect x="250.0" y="252.0" width="22.0" height="22.0" rx="3" fill="#e2b45a" fill-opacity="0.5" stroke="none" stroke-width="1"/>
<rect x="224.0" y="252.0" width="22.0" height="22.0" rx="3" fill="#e2b45a" fill-opacity="0.5" stroke="none" stroke-width="1"/>
<rect x="198.0" y="252.0" width="22.0" height="22.0" rx="3" fill="#e2b45a" fill-opacity="0.5" stroke="none" stroke-width="1"/>
<text x="200.0" y="300.0" font-size="9.5" fill="#e2b45a" text-anchor="middle" font-weight="400">mailbox</text>
<line x1="272.0" y1="263.0" x2="320.0" y2="263.0" stroke="#e2b45a" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="40.0" y="150.0" width="120.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="100.0" y="179.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Requests</text>
<line x1="160.0" y1="170.0" x2="196.0" y2="135.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah1)"/>
<line x1="160.0" y1="182.0" x2="196.0" y2="255.0" stroke="#a69d8e" stroke-width="1.2" marker-end="url(#ah1)"/>
<rect x="640.0" y="160.0" width="180.0" height="60.0" rx="3" fill="#e5534b" fill-opacity="0.15" stroke="#e5534b" stroke-width="1"/>
<text x="730.0" y="187.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Supervisor</text>
<text x="730.0" y="203.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">restart on crash</text>
<path d="M 640 180 Q 600 140 560 140" fill="none" stroke="#e5534b" stroke-width="1.1" marker-end="url(#ah2)" stroke-dasharray="4 3"/>
<path d="M 640 200 Q 600 250 560 260" fill="none" stroke="#e5534b" stroke-width="1.1" marker-end="url(#ah2)" stroke-dasharray="4 3"/>
<text x="40.0" y="350.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Each actor owns its state and processes one message at a time, so no locks are needed. Millions of</text>
<text x="40.0" y="369.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">cheap actors can run on a few threads; failures are isolated and restarted by a supervisor ("let it crash").</text>
</svg>
