<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 550" width="360" height="550" role="img" aria-label="Comparison of thread-per-request servers, event-loop async runtimes and actor systems: their unit of concurrency, how they wait on I/O, their main limits and example platforms" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="550" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Three ways to wait</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">while a request waits on I/O</text>
<rect x="16.0" y="86.0" width="328.0" height="140.0" rx="8" fill="#ff5b2e" fill-opacity="0.1" stroke="#ff5b2e" stroke-width="1.2"/>
<text x="28.0" y="108.0" font-size="12" fill="#ff5b2e" text-anchor="start" font-weight="700">Thread per request</text>
<text x="28.0" y="130.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">1 OS thread per request</text>
<text x="28.0" y="149.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">blocking calls, simple stack traces</text>
<text x="28.0" y="168.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">~1 MB stack + context switches</text>
<text x="28.0" y="187.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">limit: thousands of threads</text>
<text x="28.0" y="214.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">Java servlets, Rails, Django, PHP-FPM</text>
<rect x="16.0" y="236.0" width="328.0" height="140.0" rx="8" fill="#5fb3a1" fill-opacity="0.1" stroke="#5fb3a1" stroke-width="1.2"/>
<text x="28.0" y="258.0" font-size="12" fill="#5fb3a1" text-anchor="start" font-weight="700">Event loop + async</text>
<text x="28.0" y="280.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">few threads, many tasks</text>
<text x="28.0" y="299.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">await yields at each I/O</text>
<text x="28.0" y="318.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">no blocking allowed on loop</text>
<text x="28.0" y="337.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">limit: CPU of the loop thread</text>
<text x="28.0" y="364.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">Node.js, asyncio, Netty, Tokio</text>
<rect x="16.0" y="386.0" width="328.0" height="140.0" rx="8" fill="#9b8cff" fill-opacity="0.1" stroke="#9b8cff" stroke-width="1.2"/>
<text x="28.0" y="408.0" font-size="12" fill="#9b8cff" text-anchor="start" font-weight="700">Actors</text>
<text x="28.0" y="430.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">isolated state + mailbox</text>
<text x="28.0" y="449.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">one message at a time</text>
<text x="28.0" y="468.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">communicate only by messages</text>
<text x="28.0" y="487.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">limit: mailbox / scheduler</text>
<text x="28.0" y="514.0" font-size="9.5" fill="#a69d8e" text-anchor="start" font-weight="400">Erlang/Elixir, Akka, Orleans</text>
</svg>
