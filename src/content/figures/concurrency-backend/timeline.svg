<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 399" width="880" height="399" role="img" aria-label="Timeline comparing a blocking thread that serves requests A, B and C one after another while idle during database waits, with an event loop that starts all three and overlaps their I/O waits on one thread; a CPU-heavy handler blocks the loop for everyone" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="880" height="399" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">One thread, many requests</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">an event loop interleaves requests at every await</text>
<text x="40.0" y="84.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="700">Blocking thread: sits idle while waiting</text>
<rect x="40.0" y="96.0" width="30.0" height="24.0" rx="3" fill="#ff5b2e" fill-opacity="0.7" stroke="none" stroke-width="1"/>
<rect x="70.0" y="96.0" width="120.0" height="24.0" rx="3" fill="#ff5b2e" fill-opacity="0.15" stroke="#ff5b2e" stroke-width="1" stroke-dasharray="3 3"/>
<text x="130.0" y="113.0" font-size="9" fill="#a69d8e" text-anchor="middle" font-weight="400">waiting on DB</text>
<rect x="190.0" y="96.0" width="20.0" height="24.0" rx="3" fill="#ff5b2e" fill-opacity="0.7" stroke="none" stroke-width="1"/>
<rect x="220.0" y="96.0" width="30.0" height="24.0" rx="3" fill="#5fb3a1" fill-opacity="0.7" stroke="none" stroke-width="1"/>
<rect x="250.0" y="96.0" width="120.0" height="24.0" rx="3" fill="#5fb3a1" fill-opacity="0.15" stroke="#5fb3a1" stroke-width="1" stroke-dasharray="3 3"/>
<text x="310.0" y="113.0" font-size="9" fill="#a69d8e" text-anchor="middle" font-weight="400">waiting on DB</text>
<rect x="370.0" y="96.0" width="20.0" height="24.0" rx="3" fill="#5fb3a1" fill-opacity="0.7" stroke="none" stroke-width="1"/>
<rect x="400.0" y="96.0" width="30.0" height="24.0" rx="3" fill="#9b8cff" fill-opacity="0.7" stroke="none" stroke-width="1"/>
<rect x="430.0" y="96.0" width="120.0" height="24.0" rx="3" fill="#9b8cff" fill-opacity="0.15" stroke="#9b8cff" stroke-width="1" stroke-dasharray="3 3"/>
<text x="490.0" y="113.0" font-size="9" fill="#a69d8e" text-anchor="middle" font-weight="400">waiting on DB</text>
<rect x="550.0" y="96.0" width="20.0" height="24.0" rx="3" fill="#9b8cff" fill-opacity="0.7" stroke="none" stroke-width="1"/>
<text x="40.0" y="146.0" font-size="11.5" fill="#ede6d8" text-anchor="start" font-weight="700">Event loop: runs other requests while waiting</text>
<rect x="40.0" y="160.0" width="30.0" height="24.0" rx="3" fill="#ff5b2e" fill-opacity="0.7" stroke="none" stroke-width="1"/>
<text x="55.0" y="177.0" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="400">A</text>
<rect x="70.0" y="190.0" width="120.0" height="14.0" rx="3" fill="#ff5b2e" fill-opacity="0.15" stroke="#ff5b2e" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="220.0" y="160.0" width="20.0" height="24.0" rx="3" fill="#ff5b2e" fill-opacity="0.7" stroke="none" stroke-width="1"/>
<rect x="74.0" y="160.0" width="30.0" height="24.0" rx="3" fill="#5fb3a1" fill-opacity="0.7" stroke="none" stroke-width="1"/>
<text x="89.0" y="177.0" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="400">B</text>
<rect x="104.0" y="210.0" width="120.0" height="14.0" rx="3" fill="#5fb3a1" fill-opacity="0.15" stroke="#5fb3a1" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="254.0" y="160.0" width="20.0" height="24.0" rx="3" fill="#5fb3a1" fill-opacity="0.7" stroke="none" stroke-width="1"/>
<rect x="108.0" y="160.0" width="30.0" height="24.0" rx="3" fill="#9b8cff" fill-opacity="0.7" stroke="none" stroke-width="1"/>
<text x="123.0" y="177.0" font-size="10" fill="#ede6d8" text-anchor="middle" font-weight="400">C</text>
<rect x="138.0" y="230.0" width="120.0" height="14.0" rx="3" fill="#9b8cff" fill-opacity="0.15" stroke="#9b8cff" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="288.0" y="160.0" width="20.0" height="24.0" rx="3" fill="#9b8cff" fill-opacity="0.7" stroke="none" stroke-width="1"/>
<text x="40.0" y="266.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">I/O in flight concurrently (kernel / epoll)</text>
<line x1="40.0" y1="290.0" x2="840.0" y2="290.0" stroke="#4a4136" stroke-width="1"/>
<text x="40.0" y="308.0" font-size="10" fill="#a69d8e" text-anchor="start" font-weight="400">time →</text>
<rect x="560.0" y="150.0" width="280.0" height="110.0" rx="8" fill="#e5534b" fill-opacity="0.08" stroke="#e5534b" stroke-width="1.1"/>
<text x="574.0" y="172.0" font-size="11.5" fill="#e5534b" text-anchor="start" font-weight="700">One CPU-heavy handler</text>
<text x="574.0" y="194.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">(JSON.parse of 50 MB, bcrypt, regex)</text>
<text x="574.0" y="213.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">blocks the loop: every other</text>
<text x="574.0" y="232.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">request stalls until it finishes</text>
<text x="40.0" y="350.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Same three requests: the blocking thread needs ~3× the wall time or 3 threads. The loop overlaps the waits</text>
<text x="40.0" y="369.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">on one thread, as long as every handler yields quickly.</text>
</svg>
