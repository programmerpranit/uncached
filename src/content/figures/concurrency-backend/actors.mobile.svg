<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 450" width="360" height="450" role="img" aria-label="Requests become messages delivered to per-entity actors; each actor has a mailbox, owns its state, handles one message at a time, and a supervisor restarts actors that crash" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" style="font-variant-ligatures:none">
<rect width="360" height="450" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Actors</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">one message at a time</text>
<rect x="16.0" y="86.0" width="328.0" height="40.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="180.0" y="110.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">Requests → messages</text>
<rect x="16.0" y="146.0" width="328.0" height="80.0" rx="10" fill="#9b8cff" fill-opacity="0.12" stroke="#9b8cff" stroke-width="1.2"/>
<text x="28.0" y="168.0" font-size="12" fill="#9b8cff" text-anchor="start" font-weight="700">Cart #17</text>
<text x="28.0" y="190.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">mailbox → handle(msg) one at a time</text>
<text x="28.0" y="210.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">owns state: items, total</text>
<rect x="16.0" y="238.0" width="328.0" height="80.0" rx="10" fill="#9b8cff" fill-opacity="0.12" stroke="#9b8cff" stroke-width="1.2"/>
<text x="28.0" y="260.0" font-size="12" fill="#9b8cff" text-anchor="start" font-weight="700">Cart #42</text>
<text x="28.0" y="282.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">mailbox → handle(msg) one at a time</text>
<text x="28.0" y="302.0" font-size="10.5" fill="#a69d8e" text-anchor="start" font-weight="400">owns state: items, total</text>
<rect x="16.0" y="336.0" width="328.0" height="48.0" rx="3" fill="#e5534b" fill-opacity="0.15" stroke="#e5534b" stroke-width="1"/>
<text x="180.0" y="357.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">Supervisor</text>
<text x="180.0" y="373.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">restarts crashed actors</text>
<text x="16.0" y="420.0" font-size="11.5" fill="#a69d8e" text-anchor="start" font-weight="400">No shared memory, no locks.</text>
</svg>
