<text x="40.0" y="330.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Most requests are fast; a few are much slower. Those few dominate user experience at scale, because heavy users</text>
<text x="40.0" y="349.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">and fanned-out requests encounter them constantly. Measure and set targets on p99 / p99.9, not the mean.</text>
