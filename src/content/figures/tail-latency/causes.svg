<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 284" width="880" height="284" role="img" aria-label="Sources of tail latency: queueing, shared resources, background work, hardware, retries and fan-out" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="284" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Where tail latency comes from</text>
<rect x="40.0" y="76.0" width="255.0" height="84.0" rx="3" fill="#ff5b2e" fill-opacity="0.12" stroke="#ff5b2e" stroke-width="1"/>
<text x="54.0" y="104.0" font-size="13" fill="#ff5b2e" text-anchor="start" font-weight="700">Queueing</text>
<text x="54.0" y="128.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">bursts wait behind other work</text>
<text x="54.0" y="144.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400"></text>
<rect x="315.0" y="76.0" width="255.0" height="84.0" rx="3" fill="#e2b45a" fill-opacity="0.12" stroke="#e2b45a" stroke-width="1"/>
<text x="329.0" y="104.0" font-size="13" fill="#e2b45a" text-anchor="start" font-weight="700">Shared resources</text>
<text x="329.0" y="128.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">noisy neighbours, CPU, caches,</text>
<text x="329.0" y="144.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">network</text>
<rect x="590.0" y="76.0" width="255.0" height="84.0" rx="3" fill="#9b8cff" fill-opacity="0.12" stroke="#9b8cff" stroke-width="1"/>
<text x="604.0" y="104.0" font-size="13" fill="#9b8cff" text-anchor="start" font-weight="700">Background work</text>
<text x="604.0" y="128.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">GC, compaction, log rotation</text>
<text x="604.0" y="144.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400"></text>
<rect x="40.0" y="176.0" width="255.0" height="84.0" rx="3" fill="#d77fa1" fill-opacity="0.12" stroke="#d77fa1" stroke-width="1"/>
<text x="54.0" y="204.0" font-size="13" fill="#d77fa1" text-anchor="start" font-weight="700">Power &amp; hardware</text>
<text x="54.0" y="228.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">CPU throttling, SSD garbage</text>
<text x="54.0" y="244.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">collection</text>
<rect x="315.0" y="176.0" width="255.0" height="84.0" rx="3" fill="#e5534b" fill-opacity="0.12" stroke="#e5534b" stroke-width="1"/>
<text x="329.0" y="204.0" font-size="13" fill="#e5534b" text-anchor="start" font-weight="700">Retries &amp; timeouts</text>
<text x="329.0" y="228.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">a lost packet = 200 ms+ TCP</text>
<text x="329.0" y="244.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">retransmit</text>
<rect x="590.0" y="176.0" width="255.0" height="84.0" rx="3" fill="#5fb3a1" fill-opacity="0.12" stroke="#5fb3a1" stroke-width="1"/>
<text x="604.0" y="204.0" font-size="13" fill="#5fb3a1" text-anchor="start" font-weight="700">Fan-out</text>
<text x="604.0" y="228.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400">waiting for the slowest of n</text>
<text x="604.0" y="244.0" font-size="10.5" fill="#ede6d8" text-anchor="start" font-weight="400"></text>
</svg>
