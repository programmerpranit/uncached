<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 389" width="880" height="389" role="img" aria-label="Probability that a fanned-out request is slow grows quickly with the number of servers" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
