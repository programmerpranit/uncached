<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 349" width="880" height="349" role="img" aria-label="Hedged requests: a backup request sent after the p95 delay returns first" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="349" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Hedged requests</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">send a backup after the p95 delay; take the first answer</text>
<text x="40.0" y="100.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">replica 1</text>
<text x="40.0" y="160.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">replica 2</text>
<rect x="140.0" y="86.0" width="560.0" height="22.0" rx="3" fill="#e5534b" fill-opacity="0.35" stroke="#e5534b" stroke-width="1"/>
<text x="150.0" y="101.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">stuck behind a GC pause / slow disk … 400 ms</text>
<line x1="140.0" y1="70.0" x2="140.0" y2="240.0" stroke="#a69d8e" stroke-width="1" stroke-dasharray="3 3"/>
<text x="134.0" y="256.0" font-size="10.5" fill="#a69d8e" text-anchor="end" font-weight="400">t=0 send</text>
<line x1="240.0" y1="70.0" x2="240.0" y2="240.0" stroke="#e2b45a" stroke-width="1" stroke-dasharray="3 3"/>
<text x="246.0" y="256.0" font-size="10.5" fill="#e2b45a" text-anchor="start" font-weight="400">t=p95 (20 ms): hedge</text>
<rect x="240.0" y="146.0" width="90.0" height="22.0" rx="3" fill="#7cc47f" fill-opacity="0.4" stroke="#7cc47f" stroke-width="1"/>
<text x="250.0" y="161.0" font-size="11" fill="#ede6d8" text-anchor="start" font-weight="400">12 ms</text>
<line x1="330.0" y1="157.0" x2="330.0" y2="240.0" stroke="#7cc47f" stroke-width="1" stroke-dasharray="3 3"/>
<text x="340.0" y="226.0" font-size="11" fill="#7cc47f" text-anchor="start" font-weight="400">answer at 32 ms → cancel replica 1</text>
<text x="40.0" y="300.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Only ~5% of requests trigger a hedge, so extra load is about 5%. In Google’s measurements, hedging after a 10 ms</text>
<text x="40.0" y="319.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">delay cut the p99.9 of a BigTable read benchmark from 1,800 ms to 74 ms while sending just 2% more requests.</text>
</svg>
