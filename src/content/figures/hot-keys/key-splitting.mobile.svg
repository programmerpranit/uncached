<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 369" width="360" height="369" role="img" aria-label="A write-hot counter split into eight sub-keys on different shards and summed on read" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="369" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Write-hot key: split it into sub-keys</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">split into N sub-keys</text>
<rect x="16.0" y="72.0" width="328.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="180.0" y="98.1" font-size="11.5" fill="#ff5b2e" text-anchor="middle" font-weight="600">50k writes/s to likes:post42</text>
<rect x="16.0" y="136.0" width="160.0" height="28.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="96.0" y="153.8" font-size="10.5" fill="#5fb3a1" text-anchor="middle" font-weight="600">likes:post42#0</text>
<rect x="184.0" y="136.0" width="160.0" height="28.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="264.0" y="153.8" font-size="10.5" fill="#5fb3a1" text-anchor="middle" font-weight="600">likes:post42#1</text>
<rect x="16.0" y="172.0" width="160.0" height="28.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="96.0" y="189.8" font-size="10.5" fill="#5fb3a1" text-anchor="middle" font-weight="600">likes:post42#2</text>
<rect x="184.0" y="172.0" width="160.0" height="28.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="264.0" y="189.8" font-size="10.5" fill="#5fb3a1" text-anchor="middle" font-weight="600">likes:post42#3</text>
<text x="180.0" y="226.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">… #0 to #7 on different shards</text>
<rect x="16.0" y="244.0" width="328.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="180.0" y="270.3" font-size="12" fill="#9b8cff" text-anchor="middle" font-weight="600">read = sum of 8 sub-keys</text>
<text x="16.0" y="320.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Each sub-key takes 1/8 of the writes.</text>
<text x="16.0" y="339.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Reads fan out, so cache the sum.</text>
</svg>
