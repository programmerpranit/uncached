<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 367" width="360" height="367" role="img" aria-label="Hot key detection pipeline: sample, count, aggregate, act" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="367" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Detecting hot keys</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">sample · count · act</text>
<rect x="16.0" y="72.0" width="328.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="93.0" font-size="12" fill="#5fb3a1" text-anchor="middle" font-weight="600">sample</text>
<text x="180.0" y="109.0" font-size="10.5" fill="#5fb3a1" text-anchor="middle" font-weight="400">1 in 100 requests per node</text>
<rect x="16.0" y="130.0" width="328.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="180.0" y="151.0" font-size="12" fill="#e2b45a" text-anchor="middle" font-weight="600">count</text>
<text x="180.0" y="167.0" font-size="10.5" fill="#e2b45a" text-anchor="middle" font-weight="400">Count-Min sketch / top-k per window</text>
<rect x="16.0" y="188.0" width="328.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="180.0" y="209.0" font-size="12" fill="#9b8cff" text-anchor="middle" font-weight="600">aggregate</text>
<text x="180.0" y="225.0" font-size="10.5" fill="#9b8cff" text-anchor="middle" font-weight="400">merge per-node top-k centrally</text>
<rect x="16.0" y="246.0" width="328.0" height="48.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="180.0" y="267.0" font-size="12" fill="#ff5b2e" text-anchor="middle" font-weight="600">act</text>
<text x="180.0" y="283.0" font-size="10.5" fill="#ff5b2e" text-anchor="middle" font-weight="400">split, replicate, cache, or throttle</text>
<text x="16.0" y="318.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Hotness is dynamic: detect and</text>
<text x="16.0" y="337.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">react within seconds.</text>
</svg>
