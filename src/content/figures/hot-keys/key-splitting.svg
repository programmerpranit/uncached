<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 409" width="880" height="409" role="img" aria-label="A write-hot counter split into eight sub-keys on different shards and summed on read" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="409" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff5b2e"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fb3a1"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b8cff"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Write-hot key: split it into sub-keys</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">likes:post42 → likes:post42#0 … #7, summed on read</text>
<rect x="40.0" y="140.0" width="150.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#ff5b2e" stroke-width="1"/>
<text x="115.0" y="162.0" font-size="12" fill="#ff5b2e" text-anchor="middle" font-weight="600">writes</text>
<text x="115.0" y="178.0" font-size="11" fill="#ff5b2e" text-anchor="middle" font-weight="400">50k/s to post42</text>
<rect x="240.0" y="140.0" width="150.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="315.0" y="162.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">pick random #n</text>
<text x="315.0" y="178.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">n ∈ 0…7</text>
<line x1="192.0" y1="165.0" x2="238.0" y2="165.0" stroke="#ff5b2e" stroke-width="1.2" marker-end="url(#ah0)"/>
<rect x="460.0" y="70.0" width="170.0" height="24.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="545.0" y="85.8" font-size="10.5" fill="#5fb3a1" text-anchor="middle" font-weight="600">likes:post42#0</text>
<line x1="392.0" y1="165.0" x2="458.0" y2="82.0" stroke="#5fb3a1" stroke-width="0.8" marker-end="url(#ah1)"/>
<rect x="460.0" y="100.0" width="170.0" height="24.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="545.0" y="115.8" font-size="10.5" fill="#5fb3a1" text-anchor="middle" font-weight="600">likes:post42#1</text>
<line x1="392.0" y1="165.0" x2="458.0" y2="112.0" stroke="#5fb3a1" stroke-width="0.8" marker-end="url(#ah1)"/>
<rect x="460.0" y="130.0" width="170.0" height="24.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="545.0" y="145.8" font-size="10.5" fill="#5fb3a1" text-anchor="middle" font-weight="600">likes:post42#2</text>
<line x1="392.0" y1="165.0" x2="458.0" y2="142.0" stroke="#5fb3a1" stroke-width="0.8" marker-end="url(#ah1)"/>
<rect x="460.0" y="160.0" width="170.0" height="24.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="545.0" y="175.8" font-size="10.5" fill="#5fb3a1" text-anchor="middle" font-weight="600">likes:post42#3</text>
<line x1="392.0" y1="165.0" x2="458.0" y2="172.0" stroke="#5fb3a1" stroke-width="0.8" marker-end="url(#ah1)"/>
<rect x="460.0" y="190.0" width="170.0" height="24.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="545.0" y="205.8" font-size="10.5" fill="#5fb3a1" text-anchor="middle" font-weight="600">likes:post42#4</text>
<line x1="392.0" y1="165.0" x2="458.0" y2="202.0" stroke="#5fb3a1" stroke-width="0.8" marker-end="url(#ah1)"/>
<rect x="460.0" y="220.0" width="170.0" height="24.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="545.0" y="235.8" font-size="10.5" fill="#5fb3a1" text-anchor="middle" font-weight="600">likes:post42#5</text>
<line x1="392.0" y1="165.0" x2="458.0" y2="232.0" stroke="#5fb3a1" stroke-width="0.8" marker-end="url(#ah1)"/>
<rect x="460.0" y="250.0" width="170.0" height="24.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="545.0" y="265.8" font-size="10.5" fill="#5fb3a1" text-anchor="middle" font-weight="600">likes:post42#6</text>
<line x1="392.0" y1="165.0" x2="458.0" y2="262.0" stroke="#5fb3a1" stroke-width="0.8" marker-end="url(#ah1)"/>
<rect x="460.0" y="280.0" width="170.0" height="24.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="545.0" y="295.8" font-size="10.5" fill="#5fb3a1" text-anchor="middle" font-weight="600">likes:post42#7</text>
<line x1="392.0" y1="165.0" x2="458.0" y2="292.0" stroke="#5fb3a1" stroke-width="0.8" marker-end="url(#ah1)"/>
<text x="545.0" y="322.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">spread over 8 shards</text>
<rect x="690.0" y="140.0" width="160.0" height="50.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#9b8cff" stroke-width="1"/>
<text x="770.0" y="162.0" font-size="11" fill="#9b8cff" text-anchor="middle" font-weight="600">read = Σ #0…#7</text>
<text x="770.0" y="178.0" font-size="11" fill="#9b8cff" text-anchor="middle" font-weight="400">8 reads, or cache</text>
<line x1="632.0" y1="165.0" x2="688.0" y2="165.0" stroke="#9b8cff" stroke-width="1.1" marker-end="url(#ah2)"/>
<text x="40.0" y="360.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Each sub-key takes 1/8 of the writes. Reads now fan out to 8 keys, so keep N small, cache the sum, or only split</text>
<text x="40.0" y="379.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">keys that are detected as hot. DynamoDB calls this write sharding; it is the same idea as a sharded counter.</text>
</svg>
