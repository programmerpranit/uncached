<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 336" width="360" height="336" role="img" aria-label="Read-hot keys absorbed by local caches and replicated cache entries" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="336" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">Read-hot key: copy it</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">local caches + replicas</text>
<rect x="16.0" y="72.0" width="328.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="180.0" y="98.1" font-size="11.5" fill="#ede6d8" text-anchor="middle" font-weight="600">app servers: local 1–5 s cache</text>
<rect x="16.0" y="132.0" width="328.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="180.0" y="158.1" font-size="11.5" fill="#5fb3a1" text-anchor="middle" font-weight="600">cache node A + replicas B, C</text>
<rect x="16.0" y="192.0" width="328.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="180.0" y="218.1" font-size="11.5" fill="#a69d8e" text-anchor="middle" font-weight="600">database: rarely touched</text>
<line x1="180.0" y1="118.0" x2="180.0" y2="130.0" stroke="#a69d8e" stroke-width="1" marker-end="url(#ah0)"/>
<line x1="180.0" y1="178.0" x2="180.0" y2="190.0" stroke="#a69d8e" stroke-width="1" marker-end="url(#ah0)" stroke-dasharray="4 3"/>
<text x="16.0" y="268.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Most reads never leave the app</text>
<text x="16.0" y="287.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">server. The rest spread over</text>
<text x="16.0" y="306.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">several copies of the hot key.</text>
</svg>
