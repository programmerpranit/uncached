<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 389" width="880" height="389" role="img" aria-label="Read-hot keys absorbed by local caches and replicated cache entries" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="389" fill="#1b1712"/>
<defs><marker id="ah0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a69d8e"/></marker></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Read-hot key: copy it closer to the readers</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">local caches and extra replicas absorb most reads</text>
<rect x="40.0" y="80.0" width="170.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="125.0" y="99.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">app server 1</text>
<text x="125.0" y="115.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">local cache: hit</text>
<rect x="40.0" y="138.0" width="170.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="125.0" y="157.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">app server 2</text>
<text x="125.0" y="173.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">local cache: hit</text>
<rect x="40.0" y="196.0" width="170.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="125.0" y="215.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">app server 3</text>
<text x="125.0" y="231.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">local cache: hit</text>
<rect x="40.0" y="254.0" width="170.0" height="44.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="125.0" y="273.0" font-size="11" fill="#ede6d8" text-anchor="middle" font-weight="600">app server 4</text>
<text x="125.0" y="289.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">local cache: hit</text>
<rect x="320.0" y="110.0" width="190.0" height="60.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#e2b45a" stroke-width="1"/>
<text x="415.0" y="137.0" font-size="12" fill="#e2b45a" text-anchor="middle" font-weight="600">cache node A</text>
<text x="415.0" y="153.0" font-size="11" fill="#e2b45a" text-anchor="middle" font-weight="400">owns hot key</text>
<rect x="320.0" y="200.0" width="190.0" height="60.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#5fb3a1" stroke-width="1"/>
<text x="415.0" y="227.0" font-size="12" fill="#5fb3a1" text-anchor="middle" font-weight="600">replicas B, C</text>
<text x="415.0" y="243.0" font-size="11" fill="#5fb3a1" text-anchor="middle" font-weight="400">copies of hot key</text>
<line x1="212.0" y1="102.0" x2="318.0" y2="140.0" stroke="#a69d8e" stroke-width="0.9" marker-end="url(#ah0)" stroke-dasharray="4 3"/>
<line x1="212.0" y1="160.0" x2="318.0" y2="140.0" stroke="#a69d8e" stroke-width="0.9" marker-end="url(#ah0)" stroke-dasharray="4 3"/>
<line x1="212.0" y1="218.0" x2="318.0" y2="230.0" stroke="#a69d8e" stroke-width="0.9" marker-end="url(#ah0)" stroke-dasharray="4 3"/>
<line x1="212.0" y1="276.0" x2="318.0" y2="230.0" stroke="#a69d8e" stroke-width="0.9" marker-end="url(#ah0)" stroke-dasharray="4 3"/>
<rect x="620.0" y="150.0" width="200.0" height="60.0" rx="3" fill="#2f2921" fill-opacity="1" stroke="#4a4136" stroke-width="1"/>
<text x="720.0" y="177.0" font-size="12" fill="#ede6d8" text-anchor="middle" font-weight="600">database</text>
<text x="720.0" y="193.0" font-size="11" fill="#a69d8e" text-anchor="middle" font-weight="400">rarely touched</text>
<line x1="512.0" y1="140.0" x2="618.0" y2="170.0" stroke="#a69d8e" stroke-width="1" marker-end="url(#ah0)" stroke-dasharray="4 3"/>
<text x="40.0" y="340.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">A 1–5 second in-process cache on each app server turns 200k reads/s into a few hundred. For the remaining reads,</text>
<text x="40.0" y="359.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">replicate hot keys to several cache nodes and pick one at random. Facebook and Twitter both do variants of this.</text>
</svg>
