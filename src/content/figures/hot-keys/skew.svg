<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 381" width="880" height="381" role="img" aria-label="Load per shard with one hot shard far above capacity while others are idle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="880" height="381" fill="#1b1712"/>
<defs></defs>
<text x="30.0" y="32.0" font-size="16" fill="#ede6d8" text-anchor="start" font-weight="600">Skew: one shard melts while others idle</text>
<text x="30.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">load per shard, 16 shards, Zipf-distributed keys + one viral key</text>
<line x1="90.0" y1="280.0" x2="830.0" y2="280.0" stroke="#4a4136" stroke-width="1.3"/>
<line x1="90.0" y1="216.7" x2="830.0" y2="216.7" stroke="#e5534b" stroke-width="1" stroke-dasharray="4 3"/>
<text x="94.0" y="210.7" font-size="10.5" fill="#e5534b" text-anchor="start" font-weight="400">shard capacity</text>
<rect x="92.0" y="265.1" width="42.2" height="14.9" rx="1" fill="#5fb3a1" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<rect x="138.2" y="266.4" width="42.2" height="13.6" rx="1" fill="#5fb3a1" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<rect x="184.5" y="263.6" width="42.2" height="16.4" rx="1" fill="#5fb3a1" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<rect x="230.8" y="265.9" width="42.2" height="14.1" rx="1" fill="#5fb3a1" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<rect x="277.0" y="266.7" width="42.2" height="13.3" rx="1" fill="#5fb3a1" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<rect x="323.2" y="263.5" width="42.2" height="16.5" rx="1" fill="#5fb3a1" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<rect x="369.5" y="258.6" width="42.2" height="21.4" rx="1" fill="#5fb3a1" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<rect x="415.8" y="259.7" width="42.2" height="20.3" rx="1" fill="#5fb3a1" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<rect x="462.0" y="260.1" width="42.2" height="19.9" rx="1" fill="#5fb3a1" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<rect x="508.2" y="265.2" width="42.2" height="14.8" rx="1" fill="#5fb3a1" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<rect x="554.5" y="262.2" width="42.2" height="17.8" rx="1" fill="#5fb3a1" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<rect x="600.8" y="96.3" width="42.2" height="183.7" rx="1" fill="#e5534b" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<rect x="647.0" y="265.7" width="42.2" height="14.3" rx="1" fill="#5fb3a1" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<rect x="693.2" y="266.3" width="42.2" height="13.7" rx="1" fill="#5fb3a1" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<rect x="739.5" y="265.3" width="42.2" height="14.7" rx="1" fill="#5fb3a1" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<rect x="785.8" y="258.5" width="42.2" height="21.5" rx="1" fill="#5fb3a1" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="621.9" y="88.3" font-size="10.5" fill="#e5534b" text-anchor="middle" font-weight="400">shard 11</text>
<text x="460.0" y="298.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">shards</text>
<text x="40.0" y="332.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">The cluster as a whole is under half its capacity, yet one shard is overloaded. Adding nodes does nothing:</text>
<text x="40.0" y="351.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">all traffic for the hot key still lands on one shard. Hashing spreads keys evenly, not load.</text>
</svg>
