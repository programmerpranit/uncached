<rect x="98.2" y="218.5" width="14.8" height="11.5" rx="1" fill="#5fb3a1" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<rect x="117.0" y="217.7" width="14.8" height="12.3" rx="1" fill="#5fb3a1" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<rect x="135.8" y="215.3" width="14.8" height="14.7" rx="1" fill="#5fb3a1" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<rect x="154.5" y="214.5" width="14.8" height="15.5" rx="1" fill="#5fb3a1" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<rect x="173.2" y="213.6" width="14.8" height="16.4" rx="1" fill="#5fb3a1" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<rect x="192.0" y="213.4" width="14.8" height="16.6" rx="1" fill="#5fb3a1" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<rect x="210.8" y="219.3" width="14.8" height="10.7" rx="1" fill="#5fb3a1" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<rect x="229.5" y="215.5" width="14.8" height="14.5" rx="1" fill="#5fb3a1" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<rect x="248.2" y="85.0" width="14.8" height="145.0" rx="1" fill="#e5534b" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<rect x="267.0" y="216.2" width="14.8" height="13.8" rx="1" fill="#5fb3a1" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<rect x="285.8" y="218.7" width="14.8" height="11.3" rx="1" fill="#5fb3a1" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<rect x="304.5" y="216.4" width="14.8" height="13.6" rx="1" fill="#5fb3a1" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<rect x="323.2" y="219.3" width="14.8" height="10.7" rx="1" fill="#5fb3a1" fill-opacity="0.85" stroke="none" stroke-width="1"/>
<text x="255.6" y="77.0" font-size="10.5" fill="#e5534b" text-anchor="middle" font-weight="400">shard 11</text>
<text x="190.0" y="248.0" font-size="10.5" fill="#a69d8e" text-anchor="middle" font-weight="400">shards</text>
<text x="16.0" y="282.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">The cluster is under half full,</text>
<text x="16.0" y="301.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">but one shard is overloaded.</text>
<text x="16.0" y="320.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">Adding nodes doesn’t help one key.</text>
