<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 350" width="360" height="350" role="img" aria-label="Load per shard with one hot shard far above capacity while others are idle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace">
<rect width="360" height="350" fill="#1b1712"/>
<defs></defs>
<text x="16.0" y="32.0" font-size="15" fill="#ede6d8" text-anchor="start" font-weight="600">One hot shard</text>
<text x="16.0" y="52.0" font-size="12" fill="#a69d8e" text-anchor="start" font-weight="400">16 shards, Zipf keys + one viral key</text>
<line x1="40.0" y1="230.0" x2="340.0" y2="230.0" stroke="#4a4136" stroke-width="1.3"/>
<line x1="40.0" y1="180.0" x2="340.0" y2="180.0" stroke="#e5534b" stroke-width="1" stroke-dasharray="4 3"/>
<text x="44.0" y="174.0" font-size="10.5" fill="#e5534b" text-anchor="start" font-weight="400">shard capacity</text>
<rect x="42.0" y="213.8" width="14.8" height="16.2" rx="1" fill="#5fb3a1" fill-opacity="0.85" stroke="none" stroke-width="1"/>
